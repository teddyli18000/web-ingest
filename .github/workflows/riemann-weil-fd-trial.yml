name: Riemann-Weil finite-difference Schur trial
on:
  push:
    branches: [main]
    paths:
      - 'temp-work/riemann-weil-research/experiments/finite_difference_trial_ratio.py'
      - '.github/workflows/riemann-weil-fd-trial.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        c: [97, 193, 397, 797]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check python-flint mpmath
      - name: Fetch pinned verifier
        run: |
          git clone --quiet https://github.com/akivag613/connes-cvs-.git upstream-connes-cvs
          git -C upstream-connes-cvs checkout --quiet 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c
      - name: Compute trial ratio
        run: |
          python temp-work/riemann-weil-research/experiments/finite_difference_trial_ratio.py \
            --upstream-script upstream-connes-cvs/papers/2_guinand_weil_dictionary_tail_order/scripts/arb_ldlt_certify.py \
            --c '${{ matrix.c }}' --N 24 --prec 3000 --output 'fd-${{ matrix.c }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: fd-${{ matrix.c }}
          path: fd-${{ matrix.c }}.json
          retention-days: 1
  collect:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: fd-*
          path: fd
          merge-multiple: true
      - name: Merge
        run: |
          python - <<'PY'
          import glob,json
          from pathlib import Path
          rows=[json.loads(Path(f).read_text()) for f in glob.glob('fd/fd-*.json')]
          rows.sort(key=lambda x:x['c'])
          out={'status':'finite_difference_schur_trial_large_edge','rows':rows}
          p=Path('temp-work/riemann-weil-research/results/fd-trial-ratio-N24-c97-193-397-797.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({'rows':[{'c':r['c'],'ratio_mid':r['energy_over_schur_pivot']['mid'],'check':r['variational_check_energy_ge_schur']} for r in rows]},indent=2))
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'riemann-weil-research-bot'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          p='temp-work/riemann-weil-research/results/fd-trial-ratio-N24-c97-193-397-797.json'; git add "$p"; git diff --cached --quiet && exit 0; git commit -m 'research: record finite-difference Schur trial ratios'
          for attempt in 1 2 3; do git push origin HEAD:main && exit 0; git fetch origin main; git rebase origin/main; done; exit 1
