name: temp-ta41-direct-coupled-job-cp
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-direct-coupled-job-cp.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-direct-coupled-job-cp
  cancel-in-progress: false
jobs:
  construct:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: ta43js-n7elite1711, k: 2, seconds: 40}
          - {case: ta43js-n7elite1711, k: 3, seconds: 40}
          - {case: ta46js-n7elite1701, k: 3, seconds: 70}
          - {case: ta46js-n7elite1701, k: 4, seconds: 90}
          - {case: ta46js-n7elite1701, k: 5, seconds: 90}
          - {case: ta42js-n7elite1701, k: 4, seconds: 90}
          - {case: ta41, k: 4, seconds: 90}
          - {case: ta41, k: 6, seconds: 90}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin solver and syntax-check joint job/operation CP
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/joint_job_release_cp.py
      - name: Optimize job release decisions and full machine orders in a single CP model
        run: |
          set -euo pipefail
          c='${{ matrix.case }}'
          if test "$c" = ta41; then input=ta41; else input="science-boundary/job-shop-ta41/positive-n7-elite-data/$c/start.txt"; fi
          python3 science-boundary/job-shop-ta41/joint_job_release_cp.py \
            --start "$input" --max-jobs '${{ matrix.k }}' --seed 333 --workers 4 --seconds '${{ matrix.seconds }}' \
            --out "science-boundary/job-shop-ta41/results/joint-job-cp-$c-k${{ matrix.k }}"
      - name: Official Few Shots validator for any ta41 target certificate
        if: always()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/joint-job-cp-${{ matrix.case }}-k${{ matrix.k }}"
          if test '${{ matrix.case }}' = ta41 && test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist independent DAG reconstruction and exact CP outcomes
        if: always()
        run: |
          set -euo pipefail
          dir="science-boundary/job-shop-ta41/results/joint-job-cp-${{ matrix.case }}-k${{ matrix.k }}"
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): directly coupled complete-job release CP ${{ matrix.case }} K${{ matrix.k }}'
          for attempt in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
