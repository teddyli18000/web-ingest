name: temp Thomson 960 2D saddle chord holonomy

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-saddle-chord-holonomy.yml'

jobs:
  chord:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { a: 886, b: 960, s: '0.48' }
          - { a: 886, b: 380, s: '0.48' }
          - { a: 960, b: 380, s: '0.48' }
          - { a: 886, b: 960, s: '0.78' }
          - { a: 886, b: 380, s: '0.78' }
          - { a: 960, b: 380, s: '0.78' }
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Compile comparison code
        run: python3 -m py_compile science-boundary/thomson-960/code/compare_n961_saddle_chord_paths.py
      - uses: actions/download-artifact@v4
        with:
          pattern: thomson-weighted-saddle-ray-*
          path: ${{ runner.temp }}/rays
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41719943255
      - name: Compare two stationary continuations to common occupancy
        run: |
          python3 science-boundary/thomson-960/code/compare_n961_saddle_chord_paths.py \
            "$RUNNER_TEMP/rays" \
            --a ${{ matrix.a }} --b ${{ matrix.b }} --s ${{ matrix.s }} \
            --nsteps 6 --gradient-tol 4e-5 --live-score 444368.3924061973 \
            --out "$RUNNER_TEMP/out"
      - name: Report comparison and real-N960 exit
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          f=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/'result.json'
          if f.exists():
              d=json.loads(f.read_text())
              print('PAIR',d['a'],d['b'],'S',d['s'],'CHARGES',d['mid_charges'],'COMPARE',d['comparison'])
              for row in d['rows']:
                  print('ROOT',row['start_label'],row['complete'],row['energy'],row['gradient_rms'],row.get('hessian_eigenvalues',[])[:4])
                  print('PROJECTIONS',[(p['label'],p['class'],p['delta_live']) for p in row.get('projections',[])])
                  for side in row.get('unstable_sides',[]):
                      print('SIDE',side['sign'],side['weighted_energy'],[(p['label'],p['class'],p['delta_live']) for p in side['projections']])
          else:
              print('NO_RESULT_JSON')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-saddle-chord-${{ matrix.a }}-${{ matrix.b }}-s${{ matrix.s }}
          path: ${{ runner.temp }}/out
          retention-days: 10
