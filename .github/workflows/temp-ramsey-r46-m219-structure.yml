name: Temp Ramsey R46 m219 structure and local extremes

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/m219_structure.py
      - science-boundary/ramsey-r46/m219_extreme_catalogs.py
      - .github/workflows/temp-ramsey-r46-m219-structure.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-m219-structure
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact m219 structural reduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 -m py_compile science-boundary/ramsey-r46/m219_structure.py science-boundary/ramsey-r46/m219_extreme_catalogs.py
          python3 science-boundary/ramsey-r46/m219_structure.py --output /tmp/r46/m219-structure.json
          python3 - /tmp/r46/m219-structure.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['aggregate_vector_count']==158
          assert d['after_no_lucky_d12_count']==46
          assert d['after_degree11_local_count']==23
          assert d['n11_zero_survivor_count']==2
          assert d['n11_eq_5']['induced_degree11_graph']=='K5 minus a matching of size 2'
          print('m219 structure OK')
          PY
      - name: Download and scan complete local catalogues
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r36_11.g6.gz -o /tmp/r46/r36_11.g6.gz
          curl --fail --location --retry 4 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r45_24.g6 -o /tmp/r46/r45_24.g6
          python3 science-boundary/ramsey-r46/m219_extreme_catalogs.py \
            --r36-11 /tmp/r46/r36_11.g6.gz \
            --r45-24 /tmp/r46/r45_24.g6 \
            --output /tmp/r46/m219-extreme-catalogs.json
          python3 - /tmp/r46/m219-extreme-catalogs.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['A26']['target_count']==2
          assert d['B116']['target_count']==9
          print('extreme catalogues OK')
          PY
      - name: Persist evidence and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/m219-structure.json science-boundary/ramsey-r46/results/m219-structure.json
          cp /tmp/r46/m219-extreme-catalogs.json science-boundary/ramsey-r46/results/m219-extreme-catalogs.json
          git rm .github/workflows/temp-ramsey-r46-m219-structure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/m219-structure.json science-boundary/ramsey-r46/results/m219-extreme-catalogs.json
          git commit -m 'ramsey-r46: record m219 structure and local extremes'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-m219-structure
          path: /tmp/r46
          if-no-files-found: warn
          retention-days: 7
