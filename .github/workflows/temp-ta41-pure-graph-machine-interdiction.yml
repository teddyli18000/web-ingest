name: temp-ta41-pure-graph-machine-interdiction
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/machine_interdiction.cpp'
      - '.github/workflows/temp-ta41-pure-graph-machine-interdiction.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-pure-graph-machine-interdiction
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Construct checked source instance and solve every machine-free mask
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'science-boundary/job-shop-ta41')
          from search import obtain,setup,evaluate
          routes,durations,orders=obtain()
          pos,dur=setup(routes,durations)
          assert evaluate(orders,pos,dur)==2006
          p=Path('/tmp/ta41-machine-input.txt')
          with p.open('w') as f:
              print(30,20,file=f)
              for j in range(30):
                  print(' '.join('%d %d'%(m,durations[j][k])
                        for k,m in enumerate(routes[j])),file=f)
              for order in orders: print(' '.join(map(str,order)),file=f)
          PY
          g++ -std=c++17 -O3 -Wall -Wextra -Werror science-boundary/job-shop-ta41/machine_interdiction.cpp -o /tmp/ta41-machine-interdiction
          mkdir -p science-boundary/job-shop-ta41/results
          /tmp/ta41-machine-interdiction /tmp/ta41-machine-input.txt science-boundary/job-shop-ta41/results/graph-machine-interdiction.json
      - name: Cross-check proof witness and sample masks in independent Python DAG
        run: |
          python3 - <<'PY'
          import json,random,sys
          from pathlib import Path
          sys.path.insert(0,'science-boundary/job-shop-ta41')
          from search import obtain,setup,evaluate
          from structural_cut import disjunctive_dag
          base=Path('science-boundary/job-shop-ta41/results')
          report=json.loads((base/'graph-machine-interdiction.json').read_text())
          routes,durations,orders=obtain()
          pos,dur=setup(routes,durations)
          assert evaluate(orders,pos,dur)==2006
          def crosscheck(mask):
              removed={m*29+k for m in range(20) if mask&(1<<m) for k in range(29)}
              return disjunctive_dag(orders,pos,dur,removed)[-1]
          assert crosscheck(0)==2006
          first=report['first_passing_mask_decimal']
          assert crosscheck(first)<=2005
          rng=random.Random(4107)
          for _ in range(200):
              mask=rng.randrange(1<<20)
              k=mask.bit_count()
              lb=crosscheck(mask)
              assert lb>=report['levels'][k]['lowest_partial_order_longest_path']
          for lev in report['levels']:
              mask=lev['witness_mask_decimal']
              assert mask.bit_count()==lev['free_machines']
              assert crosscheck(mask)==lev['lowest_partial_order_longest_path']
          print('Verified all 21 minimum-level witness masks and 200 randomized crosschecks')
          PY
      - name: Commit exhaustive finite proof
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/graph-machine-interdiction.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): exhaust exact pure-graph machine order relaxations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
