name: Riemann-Weil rigorous sine-power Rayleigh sweep

on:
  workflow_dispatch:
  push:
    paths:
      - "temp-work/riemann-weil-research/experiments/sine_power_rayleigh.py"
      - ".github/workflows/riemann-weil-sine-power-rayleigh.yml"

permissions:
  contents: write

concurrency:
  group: riemann-weil-sine-power-rayleigh
  cancel-in-progress: false

jobs:
  rayleigh:
    name: c=${{ matrix.c }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        c: [13, 17, 23, 37, 67, 100]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install interval dependencies
        run: python -m pip install --disable-pip-version-check python-flint mpmath
      - name: Fetch pinned public verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/akivag613/connes-cvs-.git upstream-connes-cvs
          git -C upstream-connes-cvs checkout --quiet 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c
      - name: Contract sine-power family
        run: |
          python temp-work/riemann-weil-research/experiments/sine_power_rayleigh.py \
            --upstream-script upstream-connes-cvs/papers/2_guinand_weil_dictionary_tail_order/scripts/arb_ldlt_certify.py \
            --upstream-commit 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c \
            --c ${{ matrix.c }} --m-max 40 --prec 4000 \
            --output sine-c${{ matrix.c }}.json
          python -m json.tool sine-c${{ matrix.c }}.json >/dev/null
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: sine-rayleigh-c${{ matrix.c }}
          path: sine-c${{ matrix.c }}.json
          retention-days: 1

  collect:
    name: collect sine-power Rayleigh sweep
    needs: rayleigh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: sine-rayleigh-c*
          path: tmp/sine
          merge-multiple: true
      - name: Merge
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('tmp/sine').glob('sine-c*.json'):
              x=json.loads(p.read_text())
              rows.append({
                  'c':x['c'],
                  'best':x['best_positive_midpoint_row_nonrigorous_selection'],
                  'negative_m':[r['m'] for r in x['rows'] if r['certified_negative']],
                  'rows':x['rows'],
              })
          rows.sort(key=lambda x:x['c'])
          if not rows: raise SystemExit('no sine Rayleigh rows')
          out={
              'status':'rigorous_cutoff_free_sine_power_rayleigh_sweep',
              'upstream_commit':'5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c',
              'rows':rows,
              'meaning':'Each family value is interval-certified. The selected best m is chosen by midpoint only; no full-space positivity follows.'
          }
          dest=Path('temp-work/riemann-weil-research/results/sine-power-rayleigh-sweep.json')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':out['status'],'best':[{'c':r['c'],'best':r['best']} for r in rows]},indent=2,sort_keys=True))
          PY
      - name: Commit result safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp-work/riemann-weil-research/results/sine-power-rayleigh-sweep.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(riemann): record rigorous sine-power Rayleigh sweep"
          git pull --rebase origin main
          git push origin HEAD:main
