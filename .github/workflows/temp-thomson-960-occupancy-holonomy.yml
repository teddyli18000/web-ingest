name: temp Thomson 960 occupancy holonomy loops

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-occupancy-holonomy.yml'

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - peak: '0.35'
            floor: '0.65'
            orientation: '886-first'
            tag: 'small-886'
          - peak: '0.35'
            floor: '0.65'
            orientation: '960-first'
            tag: 'small-960'
          - peak: '0.65'
            floor: '0.35'
            orientation: '886-first'
            tag: 'large-886'
          - peak: '0.65'
            floor: '0.35'
            orientation: '960-first'
            tag: 'large-960'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Static check
        run: python3 -m py_compile science-boundary/thomson-960/code/search_n961_occupancy_holonomy.py
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Run occupancy loop
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          python3 science-boundary/thomson-960/code/search_n961_occupancy_holonomy.py \
            "$RUNNER_TEMP/seed/A-natural.json" \
            --q960-peak '${{ matrix.peak }}' \
            --q886-floor '${{ matrix.floor }}' \
            --orientation '${{ matrix.orientation }}' \
            --segment-steps 5 \
            --live-score "$live" \
            --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/out/result.json" ]; then exit 0; fi
          python3 - <<'PY'
          import json, os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('LOOP',d['q960_peak'],d['q886_floor'],d['orientation'])
          print('ENDPOINT',d['endpoint'])
          print('BEST',d['best_projection'])
          print('DISTINCT',d['distinct_projection_summary'])
          for c in d['corners']:
              print('CORNER',c['corner'],c['q886'],c['q960'],c['active_rms_vs_base'],c['sig_del960']['coord'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-occupancy-holonomy-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 10
