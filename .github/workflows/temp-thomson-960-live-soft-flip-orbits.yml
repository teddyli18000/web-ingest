name: temp Thomson 960 live soft flip orbits

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-live-soft-flip-orbits.yml'

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: orbit0
            quad: '217,559,551,308'
          - tag: orbit1
            quad: '59,639,935,603'
          - tag: orbit2
            quad: '79,134,323,35'
          - tag: orbit4
            quad: '108,282,511,599'
          - tag: orbit5
            quad: '126,522,886,306'
          - tag: orbit6
            quad: '12,139,958,286'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Cross one soft same-count topology orbit
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) tag=${{ matrix.tag }} live=$live"
          python3 science-boundary/thomson-960/code/search_explicit_scaffolded_flip.py \
            "$RUNNER_TEMP/seed/live.json" --quad '${{ matrix.quad }}' \
            --patterns balanced,newdiag,olddiag \
            --multipliers 1.003,1.01,1.03,1.08,1.18,1.35 \
            --fixed-maxiter 1600 --release-maxiter 3400 \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('QUAD',d['quad'],'THRESHOLDS',d['thresholds'])
          print('BEST',d['best_release_energy'],'DELTA',d['best_delta_live'])
          for b in d['lowest_distinct_release_basins'][:16]:
              print('BASIN',b['energy'],b['delta_live'],b['coord_counts'],'pat',b['pattern'],'m',b['multiplier'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-live-soft-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 10
