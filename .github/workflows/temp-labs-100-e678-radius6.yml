name: temp labs-100 E678 radius 6

on:
  push:
    paths:
      - '.github/workflows/temp-labs-100-e678-radius6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-radius6:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exhaust exact Hamming radius 6 around E678
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20 -fopenmp -DNDEBUG \
            science-boundary/labs-100/code/sphere_shell.cpp -o /tmp/labs100-sphere-shell
          seq='---------+--+-+--+--+-++-++++---+----++---++-+++-++---+---++-++--+-+++-++-+---++++---+++++---+-+-+-+'
          /tmp/labs100-sphere-shell "$seq" 6 4 | tee /tmp/radius6.txt
          grep -F 'BASE energy=678' /tmp/radius6.txt
          grep -F 'RADIUS radius=6 tested=1192052400 ' /tmp/radius6.txt
          best=$(sed -n 's/^BESTSEQ //p' /tmp/radius6.txt)
          python3 science-boundary/labs-100/code/verify.py -- "$best"
