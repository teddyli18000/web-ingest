name: temp labs100 h18 K19 kp15 exact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-labs100-h18-k19-kp15-exact.yml'

concurrency:
  group: temp-labs100-h18-k19-kp15-exact
  cancel-in-progress: false

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build corrected split exact programs
        run: |
          g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_h18_k19_kp15_compressed.cpp -o "$RUNNER_TEMP/compressed"
          g++ -O3 -march=native science-boundary/labs-100/code/oddperfect_h18_k19_kp15_fullgamma.cpp -o "$RUNNER_TEMP/fullgamma"
      - name: Exhaust compressed and full-gamma fibre branches using all CPUs
        shell: bash
        run: |
          set -euo pipefail
          OMP_NUM_THREADS="$(nproc)" "$RUNNER_TEMP/compressed" | tee "$RUNNER_TEMP/compressed.log"
          "$RUNNER_TEMP/fullgamma" | tee "$RUNNER_TEMP/fullgamma.log"
          grep -F 'K19_KP15_COMPRESSED orbits=88 rank11=8 rank13=80 tested=80779032 exactvalid=92501 spectral=1 base=0 alt=1' "$RUNNER_TEMP/compressed.log"
          grep -F 'K19_KP15_FULLGAMMA alphas=1024 half_gamma_solutions=32780 full_gamma_solutions=65560 affine_transforms=32780000 V0_pass=0' "$RUNNER_TEMP/fullgamma.log"
          grep -F 'EXACT_EXCLUSION h18_K19_kp15_kc4_Wle130' "$RUNNER_TEMP/fullgamma.log"
      - name: Upload exact transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-h18-k19-kp15-exact-corrected
          path: |
            ${{ runner.temp }}/compressed.log
            ${{ runner.temp }}/fullgamma.log
          if-no-files-found: warn
