name: temp-ta41-independent-core-verification
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/verify_core_dual.py'
      - '.github/workflows/temp-ta41-independent-core-verification.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-independent-core-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install independent CP-SAT checker
        run: python -m pip install 'ortools==9.14.6206'
      - name: Certify every weighted UNSAT core and rational packing inequalities
        run: |
          python3 science-boundary/job-shop-ta41/verify_core_dual.py --seconds 9
      - name: Preserve independent proof audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/core-dual-independent-verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): audit portable dual by independent per-core proofs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
