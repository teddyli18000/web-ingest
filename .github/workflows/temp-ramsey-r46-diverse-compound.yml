name: temp Ramsey R46 diverse compound constructive search

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-ramsey-r46-diverse-compound.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-ramsey-r46-diverse-compound-${{ github.ref }}
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {seed: 42, parent: near14, depth: 7}
          - {seed: 183, parent: near14, depth: 12}
          - {seed: 20261110, parent: near14, depth: 16}
          - {seed: 20261111, parent: near14, depth: 10}
          - {seed: 120, parent: near12, depth: 10}
          - {seed: 312, parent: near12, depth: 15}
          - {seed: 666, parent: near12, depth: 8}
          - {seed: 972, parent: near12, depth: 13}
    steps:
      - uses: actions/checkout@v4
      - name: Run novelty-gated multi-parent compound edge repair
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ramsey-diverse"
          if [ '${{ matrix.parent }}' = near14 ]; then
            BASE=science-boundary/ramsey-r46/results/algorithm22-calibration-best-14.json
          else
            BASE=science-boundary/ramsey-r46/results/compound-repair-36-12-defects.json
          fi
          python3 science-boundary/ramsey-r46/compound_repair_diverse.py \
            --initial "$BASE" --out "$RUNNER_TEMP/ramsey-diverse/best.json" \
            --novel-out "$RUNNER_TEMP/ramsey-diverse/diverse.json" \
            --seed ${{ matrix.seed }} --depth ${{ matrix.depth }} \
            --depth-jitter 10 --steps 30000 --seconds 145 \
            --min-distance 13 --cross-rate 0.20 \
            | tee "$RUNNER_TEMP/ramsey-diverse/run.log"
      - name: Recount all preserved 36-vertex candidates independently
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import itertools, json, os
          d=Path(os.environ["RUNNER_TEMP"])/"ramsey-diverse"
          for p in (d/"best.json",d/"diverse.json"):
              if not p.exists():continue
              a=json.loads(p.read_text())["adjacency"]
              assert len(a)==36 and all(len(row)==36 for row in a)
              assert all(a[i][i]=="0" and a[i][j]==a[j][i] for i in range(36) for j in range(36))
              adj=[sum(1<<j for j,ch in enumerate(row) if ch=="1") for row in a]
              full=(1<<36)-1
              comp=[full &~x &~(1<<i) for i,x in enumerate(adj)]
              def count(x,k,c):
                  if k==0:return 1
                  z=0
                  while c.bit_count()>=k:
                      bit=c&-c;v=bit.bit_length()-1;c^=bit
                      z+=count(x,k-1,c&x[v])
                  return z
              k4=count(adj,4,full);i6=count(comp,6,full)
              print("INDEPENDENT_RECOUNT",p.name,"K4",k4,"I6",i6,"total",k4+i6)
              assert k4+i6<=14 if 'near14' in '${{ matrix.parent }}' else k4+i6<=12
              if k4+i6==0:
                  (d/"witness.json").write_text(json.dumps({"adjacency":a}))
          PY
          if [ -f "$RUNNER_TEMP/ramsey-diverse/witness.json" ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
            mkdir -p "$RUNNER_TEMP/p003-verify"
            cp "$RUNNER_TEMP/ramsey-diverse/witness.json" "$RUNNER_TEMP/p003-verify/certificate.json"
            python3 "$RUNNER_TEMP/few-shots/problems/p003-ramsey-r46/verify/verify.py" "$RUNNER_TEMP/p003-verify"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p003-diverse-${{ matrix.parent }}-${{ matrix.seed }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/ramsey-diverse/
