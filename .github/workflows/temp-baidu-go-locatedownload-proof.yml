name: Baidu production Go locatedownload proof (one shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-baidu-go-locatedownload-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BAIDU_DRIVE_BAIDU_SESSION: ${{ secrets.BAIDU_DRIVE_BAIDU_SESSION }}
      BAIDU_DRIVE_STATE_KEY: ${{ secrets.BAIDU_DRIVE_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            baidu-drive
      - uses: actions/checkout@v4
        with:
          repository: teddyli18000/baidu-drive-mover
          ref: a9e76feb18fe9ca1ac680d0ea555aac684d622de
          path: .go-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-source/go.mod
          cache-dependency-path: .go-source/go.sum
      - name: Restore existing encrypted browser cookie locally
        run: |
          python3 -m pip install -q 'cryptography==46.0.4'
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,"baidu-drive")
          import auth_session,auth_provision,controller
          gh=controller.GitHub(os.environ["GITHUB_REPOSITORY"],os.environ["GITHUB_TOKEN"])
          cookie=auth_session.read(gh,os.environ["BAIDU_DRIVE_BAIDU_SESSION"],os.environ["BAIDU_DRIVE_STATE_KEY"])
          auth_provision.write_private(Path(os.environ["RUNNER_TEMP"])/"baidu-read.cookies",cookie)
          print("Current Baidu session loaded privately")
          PY
      - name: Compile production Go source and read one exact 4 MiB range
        run: |
          mkdir -p .go-source/cmd/production-source-proof
          cp baidu-drive/mover/relay_locatedownload.go .go-source/cmd/production-source-proof/relay_locatedownload.go
          cat > .go-source/cmd/production-source-proof/main.go <<'GO'
          package main
          import (
              "context"
              "encoding/json"
              "fmt"
              "io"
              "os"
              "path/filepath"
              "strings"
          )
          func main() {
              cookie,err:=os.ReadFile(filepath.Join(os.Getenv("RUNNER_TEMP"),"baidu-read.cookies"))
              if err!=nil {panic("private source credential missing")}
              var meta struct {
                  Path string `json:"baidu_staging_path"`
                  Size int64 `json:"size"`
              }
              blob,err:=os.ReadFile(filepath.Join(os.Getenv("GITHUB_WORKSPACE"),
                  "baidu-drive/state/files/bd-20261114T114727Z-caff29/506174993752725.json"))
              if err!=nil {panic("public staged identity missing")}
              if err=json.Unmarshal(blob,&meta);err!=nil {panic("invalid public source metadata")}
              if meta.Size!=1302042184 || !strings.HasPrefix(meta.Path,"/BaiduDriveMover/") {
                  panic("staged source identity mismatch")
              }
              source,err:=newLocatedDownloadSource(strings.TrimSpace(string(cookie)))
              if err!=nil {panic("cannot initialize signed source")}
              const length int64=4<<20
              stream,err:=source.OpenDownloadRange(context.Background(),meta.Path,0,length-1)
              if err!=nil {
                  fmt.Printf("production source read failed: %v\n",err)
                  os.Exit(1)
              }
              defer stream.Body.Close()
              if stream.Start!=0 || stream.End!=length-1 || stream.Total!=meta.Size || stream.Remaining!=length {
                  panic("Go source returned mismatched Range metadata")
              }
              n,err:=io.CopyN(io.Discard,stream.Body,length)
              if err!=nil || n!=length {panic("Go source failed to read full 4 MiB")}
              fmt.Println("PASS: production Go locatedownload adapter read exact 4 MiB range")
          }
          GO
          cd .go-source
          go run ./cmd/production-source-proof
