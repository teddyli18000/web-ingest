name: Temp Science Boundary C7 portable extra t9 seeds
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-portable-extra-seeds.yml
      - science-boundary/shannon-capacity-c7/code/bpz_t9_portable_extra_seeds.py
      - science-boundary/shannon-capacity-c7/code/bpz_t9_aux_translation_fft.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public sources read-only
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git init "$RUNNER_TEMP/c7-five"
          git -C "$RUNNER_TEMP/c7-five" remote add origin https://github.com/molind/c7-five.git
          git -C "$RUNNER_TEMP/c7-five" fetch --depth 1 origin ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
          git -C "$RUNNER_TEMP/c7-five" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
      - name: Install dependency
        run: python3 -m pip install --disable-pip-version-check numpy
      - name: Diagnose portable witness bundle
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/c7-five" <<'PY'
          import gzip,json,runpy,sys,traceback
          from pathlib import Path
          root=Path(sys.argv[1])
          p=root/'data'/'core-overlap.json.gz'
          try:
              with gzip.open(p,'rt') as h: z=json.load(h)
              print('CORE_OVERLAP_KEYS', sorted(z))
              for k,v in z.items():
                  try: print('CORE_FIELD',k,type(v).__name__,len(v) if hasattr(v,'__len__') else None)
                  except Exception: pass
          except BaseException:
              print('CORE_OVERLAP_ERROR'); traceback.print_exc()
          for name in ('u1.py','u2.py'):
              try:
                  ns=runpy.run_path(str(root/'verify'/name),run_name='__portable_witness_probe__')
                  print('CHECKER_OK',name,'keys',sorted(ns)[:30])
              except BaseException as e:
                  print('CHECKER_ERROR',name,type(e).__name__,repr(e)); traceback.print_exc()
          PY
      - name: Replay portable witnesses and scan all translations
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shot" "$RUNNER_TEMP/result"
          set +e
          python3 -X faulthandler science-boundary/shannon-capacity-c7/code/bpz_t9_portable_extra_seeds.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/c7-five" \
            "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/status.json" \
            2>&1 | tee "$RUNNER_TEMP/result/combined.txt"
          rc=${PIPESTATUS[0]}
          set -e
          if [[ $rc -ne 0 ]]; then echo "portable seed scan rc=$rc"; exit $rc; fi
          cat "$RUNNER_TEMP/result/status.json"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify breakthrough with Few Shots verifier
        if: steps.scan.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1)) <= 134753: raise SystemExit(r)
          print(f"VERIFIED BREAKTHROUGH score={r['score']}")
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-portable-extra-t9-seeds
          path: ${{ runner.temp }}/result
          retention-days: 14
      - name: Summarize
        if: always()
        shell: bash
        run: |
          { echo '## C7 portable extra t9 seed scan'; for f in status.json verify.json; do if [[ -f "$RUNNER_TEMP/result/$f" ]]; then echo '```json'; cat "$RUNNER_TEMP/result/$f"; echo '```'; fi; done; echo '### combined'; echo '```text'; tail -n 120 "$RUNNER_TEMP/result/combined.txt" 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
