name: temp-ta41-energetic-certificate
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/energetic_certificate.py'
      - '.github/workflows/temp-ta41-energetic-certificate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-energetic-certificate
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Search integer-only compulsory-processing overload, no CP solver
        run: |
          python3 science-boundary/job-shop-ta41/energetic_certificate.py --fixed 0,4,7,8 --target 2005 --out science-boundary/job-shop-ta41/results/energetic-fixed4.json
      - name: Save proof or recorded negative result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/energetic-fixed4.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): test standalone energetic proof of four-machine obstruction'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
