name: temp labs100 O58 K34 2+14 exact fibre join
on:
  push:
    paths:
      - '.github/workflows/temp-labs100-o58-k34-fibre2-join.yml'
  workflow_dispatch:
concurrency:
  group: temp-labs100-o58-k34-fibre2-join
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact ternary fibre enumerator and periodic join
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-100
          g++ -O3 -std=c++20 code/o58_k34_fibre2_exact.cpp -o "$RUNNER_TEMP/fibre2"
          g++ -O3 -std=c++20 -fopenmp code/o58_k34_fibre2_join.cpp -o "$RUNNER_TEMP/join"
      - name: Independent smoke regression
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/fibre2" 1 1 0 0 | tee smoke.log
          grep -q 'rank=12 free=13 total=1594323 wt14=150528 integerExact=101376 minSH=30 SHle24=0' smoke.log
      - name: Exhaust all 240 normalized fibre linear systems
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/cases
          : > outputs/tasks.txt
          for d in $(seq 1 24); do
            for eps in -1 1; do
              echo "$d $eps 0 0" >> outputs/tasks.txt
              for s in 1 5; do
                for orient in -1 1; do
                  echo "$d $eps $s $orient" >> outputs/tasks.txt
                done
              done
            done
          done
          export SOLVER="$RUNNER_TEMP/fibre2"
          export OUTROOT="$PWD/outputs/cases"
          xargs -P "$(nproc)" -n4 bash -c '
            set -euo pipefail
            d="$1"; eps="$2"; s="$3"; o="$4"
            "$SOLVER" "$d" "$eps" "$s" "$o" > "$OUTROOT/d${d}-e${eps}-s${s}-o${o}.log"
          ' _ < outputs/tasks.txt
          cat outputs/cases/*.log > outputs/full-fibre.log
          python3 - <<'PY'
          import re
          lines = open('outputs/full-fibre.log').read().splitlines()
          summaries = [x for x in lines if x.startswith('FIBRE2_EXACT ')]
          hits = [x for x in lines if x.startswith('HIT ')]
          assert len(summaries) == 240, len(summaries)
          assert len(hits) == 1912, len(hits)
          center = [x for x in summaries if re.search(r' s=0 ', x)]
          assert len(center) == 48
          assert min(int(re.search(r'minSH=(\d+)', x).group(1)) for x in center) == 26
          assert all(x.endswith('SHle24=0') for x in center)
          print('FIBRE2_REPRODUCTION systems=240 low_SH_fibres=1912 center_cases=48 center_minSH=26')
          PY
      - name: Exhaust exact compatible periodic compression
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          "$RUNNER_TEMP/join" outputs/full-fibre.log | tee outputs/join.log
          grep -q 'K34_FIBRE2_JOIN hits=1912 groups=952 c_signs=439824 systems=433168 periodic=20416 minSG=88 min_margin=60 Qpass=0' outputs/join.log
      - name: Archive exact transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-o58-k34-fibre2-join
          path: |
            smoke.log
            outputs/
          retention-days: 30
