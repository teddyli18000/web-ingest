name: temp Thomson 960 elite scar edge-genome constructive search

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-elite-edge-genomes.yml'

jobs:
  connectivity-recombine:
    runs-on: ubuntu-24.04
    timeout-minutes: 205
    strategy:
      fail-fast: false
      matrix:
        seed: [67401, 67402]
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: few-shots/few-shots
          path: few-shots
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy numba
      - name: Check R A B W D source energies, R-A edge genome and analytic bond-force gradient
        run: |
          python3 -m py_compile science-boundary/thomson-960/code/search_elite_scar_edge_genomes.py
          python3 science-boundary/thomson-960/code/search_elite_scar_edge_genomes.py \
            few-shots \
            --a-json science-boundary/thomson-960/data/neighbor-soft-003280.json \
            --b-json science-boundary/thomson-960/data/basin-b-010566.json \
            --w-json science-boundary/thomson-960/data/scar-braid-elites-2202-2026-11-06.json \
            --d-json science-boundary/thomson-960/data/basin-d-018586.json \
            --seed ${{ matrix.seed }} --cycles 3 --maxiter 370 \
            --out "$RUNNER_TEMP/smoke"
      - name: Recombine donor-specific scar connectivity motifs and physically relax every N960 child
        run: |
          python3 science-boundary/thomson-960/code/search_elite_scar_edge_genomes.py \
            few-shots \
            --a-json science-boundary/thomson-960/data/neighbor-soft-003280.json \
            --b-json science-boundary/thomson-960/data/basin-b-010566.json \
            --w-json science-boundary/thomson-960/data/scar-braid-elites-2202-2026-11-06.json \
            --d-json science-boundary/thomson-960/data/basin-d-018586.json \
            --seed ${{ matrix.seed }} --cycles 75 --maxiter 580 \
            --out "$RUNNER_TEMP/out"
      - name: Report physical R-score and whether elite scar motifs were inherited
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for sub in ('smoke','out'):
              p=root/sub/'result.json'
              if not p.exists():
                  print('MISSING',p);continue
              d=json.loads(p.read_text());rr=d['rows']
              print('RESULT',sub,'seed',d['seed'],'cycles',d['cycles_done'],
                    'best',d['best'],'new',d['new'],'wins',d['candidates'],
                    'gradient_check',d['gradient_test'],
                    'R_TO_A_EDGE_TEMPLATE',d['positive_template_size'])
              for kind in ('positive_control','no_bias_control'):
                  x=[r for r in rr if r[kind]]
                  print('TEST',kind,'n',len(x),
                        'best',min((r['energy'] for r in x),default=None),
                        'max_donor_edges_retained',max((r['after_quench_added'] for r in x),default=0))
              print('ELITES',[(z['energy'],z['tag']) for z in d['elites']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-elite-scar-edge-genomes-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/out
            ${{ runner.temp }}/smoke
          retention-days: 10
