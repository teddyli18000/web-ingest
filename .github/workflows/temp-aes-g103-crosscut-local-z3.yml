name: temp-aes-g103-crosscut-local-z3

on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/g103_crosscut_local_z3.py'
      - '.github/workflows/temp-aes-g103-crosscut-local-z3.yml'

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: python -m pip install --quiet z3-solver
      - name: Enumerate and solve all three-slot deletion splits on four CPUs
        run: |
          set -euxo pipefail
          mkdir -p results
          python - <<'PY' > plans.txt
          import sys
          sys.path.insert(0,'science-boundary/aes-sbox-circuit')
          import released_and_skeleton as ras
          import temporal_window_resynth as tw
          c=ras.load_circuit('nist-g103')
          s=tw.original_schedule(c)
          local=s[31:]
          print('# full schedule',s,file=sys.stderr)
          print('# local schedule',local,file=sys.stderr)
          assert len(local)==2
          for r0 in range(4):
              r1=3-r0
              if r0<=local[0] and r1<=local[1]:
                  print(f'{r0},{r1}')
          PY
          cat plans.txt
          run_one() {
            p="$1"
            tag="${p//,/-}"
            mkdir -p "results/$tag"
            python science-boundary/aes-sbox-circuit/g103_crosscut_local_z3.py \
              --start 31 --removals "$p" --timeout-ms 300000 \
              --out "results/$tag" > "results/$tag.log" 2>&1
          }
          export -f run_one
          xargs -r -n1 -P4 bash -c 'run_one "$0"' < plans.txt
          cat results/*.log || true
      - name: Aggregate independently checked candidates
        run: |
          python - <<'PY'
          import glob,json,os,shutil,sys
          sys.path.insert(0,'science-boundary/aes-sbox-circuit')
          import released_and_skeleton as ras
          rows=[]
          for f in glob.glob('results/*/summary.json'):
              x=json.load(open(f)); rows.append(x)
              if x.get('status')=='sat':
                  cp=os.path.join(os.path.dirname(f),'candidate.json')
                  c=json.load(open(cp)); assert ras.independent_check(c)[0]
                  if len(c['gates'])<=100 and not os.path.exists('candidate-100.json'):
                      shutil.copy(cp,'candidate-100.json')
          rows.sort(key=lambda x:x.get('removals',[]))
          agg={'results':rows,'sat':sum(x.get('status')=='sat' for x in rows),
               'unsat':sum(x.get('status')=='unsat' for x in rows),
               'unknown':sum(x.get('status')=='unknown' for x in rows)}
          json.dump(agg,open('aggregate.json','w'),indent=2)
          print(json.dumps({k:v for k,v in agg.items() if k!='results'}))
          PY
      - name: Official verifier if 100 found
        run: |
          set -euxo pipefail
          if [ -f candidate-100.json ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/shot
            cp candidate-100.json /tmp/shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-g103-crosscut-local-z3
          path: |
            plans.txt
            aggregate.json
            candidate-100.json
            official-verifier.jsonl
            results
          if-no-files-found: warn
