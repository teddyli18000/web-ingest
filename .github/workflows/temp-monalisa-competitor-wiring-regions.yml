name: temp-monalisa-competitor-wiring-regions
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/historical_wiring_components.py
      - .github/workflows/temp-monalisa-competitor-wiring-regions.yml
permissions:
  contents: write
jobs:
  regions:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch original 8 full tour and 3 Concorde LP observations
        run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          python -m pip install numpy matplotlib
          mkdir -p /tmp/p010-source/tour /tmp/p010-source/lp
          root=https://www.math.uwaterloo.ca/tsp/data/ml
          for score in 5757199 5757200 5757203 5757204 5757205 5757241 5757245; do
            curl -fsSL --retry 3 --max-time 120 "$root/tour/monalisa_${score}.tour" -o "/tmp/p010-source/tour/monalisa_${score}.tour"
          done
          for variant in 6nsub 5zsub 4zsub; do
            curl -fsSL --retry 3 --max-time 120 "$root/x/mona.${variant}.x" -o "/tmp/p010-source/lp/mona.${variant}.x"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path('/tmp/p010-source/tour');l=Path('/tmp/p010-source/lp')
          tours={f'historic_{s}':str(t/f'monalisa_{s}.tour') for s in (5757199,5757200,5757203,5757204,5757205,5757241,5757245)}
          lps={'2012-04-18':str(l/'mona.6nsub.x'),'2012-01-21':str(l/'mona.5zsub.x'),'2011-07-15':str(l/'mona.4zsub.x')}
          Path('/tmp/p010-source/tours.json').write_text(json.dumps(tours))
          Path('/tmp/p010-source/lps.json').write_text(json.dumps(lps))
          PY
      - name: Extract exact alternative-wiring components
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          python science-boundary/mona-lisa-tsp/historical_wiring_components.py \
            --baseline upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --tours /tmp/p010-source/tours.json --lps /tmp/p010-source/lps.json \
            --report science-boundary/mona-lisa-tsp/data/historical-wiring-components-summary.json \
            --regions science-boundary/mona-lisa-tsp/data/historical-wiring-components-all.json
      - name: Preserve verified component topology on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/mona-lisa-tsp/data/historical-wiring-components-summary.json science-boundary/mona-lisa-tsp/data/historical-wiring-components-all.json
          git commit -m 'science(p010): freeze local competing-wiring components over official strong tours and LP solutions'
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monalisa-competing-wiring-components
          path: science-boundary/mona-lisa-tsp/data/historical-wiring-components-*.json
          if-no-files-found: ignore
