name: temp-google-trending-html-probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-google-trending-html-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe server-rendered ds:0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.request

          for geo in ("SG", "US", "GB", "HK"):
              url = f"https://trends.google.com/trending?geo={geo}&hl=en-US&hours=24"
              with urllib.request.urlopen(url, timeout=30) as response:
                  html = response.read().decode()
              match = re.search(
                  r"AF_initDataCallback\(\{key: 'ds:0', hash: '\d+', data:(\[.*?\]), sideChannel: \{\}\}\);",
                  html,
                  re.S,
              )
              rows = json.loads(match.group(1))[1] if match else None
              print(json.dumps({
                  "geo": geo,
                  "html_bytes": len(html),
                  "has_ds0": match is not None,
                  "row_count": len(rows or []),
                  "first_row_len": len(rows[0]) if rows else None,
              }))
          PY
