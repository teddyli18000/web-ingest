name: temp Thomson 960 inherited scar elite basin search

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-inherited-scar-elites.yml'

jobs:
  offspring:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [6606, 7707]
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: few-shots/few-shots
          path: few-shots
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy numba
      - name: Compile candidate engine
        run: python3 -m py_compile science-boundary/thomson-960/code/search_hamiltonian_scar_braid.py
      - uses: actions/download-artifact@v4
        with:
          name: thomson-scar-braid-seed-2202
          path: ${{ runner.temp }}/elites
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 42250842594
      - uses: actions/download-artifact@v4
        with:
          pattern: thomson-saddle-chord-886-*
          path: ${{ runner.temp }}/chords
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41857433482
      - name: Cross topology, inherited elite and collision-contracted scar flow search
        run: |
          python3 science-boundary/thomson-960/code/search_hamiltonian_scar_braid.py \
            few-shots --chord-dir "$RUNNER_TEMP/chords" \
            --elite-dir "$RUNNER_TEMP/elites" \
            --seed ${{ matrix.seed }} --trials 450 --maxiter 700 \
            --temp 0.075 --out "$RUNNER_TEMP/out"
      - name: Report actual candidate quality and operator comparison
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/'result.json'
          if not p.exists():
              print('NO_RESULT');raise SystemExit(0)
          d=json.loads(p.read_text())
          print('SEED',d['seed'],'TRIALS',d['trials_done'],'BEST',d['best_energy'],
                'DELTA',d['best_delta_record'],'CANDIDATES',d['candidates_below_record'])
          rows=[r for r in d['rows'] if 'energy' in r]
          for mode in ('vortices','dipole','braid','randomcap'):
              z=[r for r in rows if r['mode']==mode]
              print('MODE',mode,'n',len(z),
                    'min_delta',min((r['delta_record'] for r in z),default=None),
                    'distinct_below_0.05',sum(r['delta_record']<0.05 and r['unique'] for r in z),
                    'move_rms_avg',sum(r['move_rms'] for r in z)/max(1,len(z)))
          print('POOL',[(p['energy'],p['tag']) for p in d['population']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-inherited-scar-elites-${{ matrix.seed }}
          path: ${{ runner.temp }}/out
          retention-days: 10
