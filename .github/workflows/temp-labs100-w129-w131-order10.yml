name: temp labs100 W129 W131 order10 quotient search

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-labs100-w129-w131-order10.yml'

concurrency:
  group: temp-labs100-w129-w131-order10
  cancel-in-progress: false

jobs:
  strengthened-hard-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build exact order10 profile generator
        run: g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_h20_w129_w131_order10_profiles.cpp -o "$RUNNER_TEMP/profiles"
      - name: Generate all three exact quotient tables using every runner CPU
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_cpus=$(nproc)"
          OMP_NUM_THREADS="$(nproc)" "$RUNNER_TEMP/profiles" "$RUNNER_TEMP/w" 2>&1 | tee "$RUNNER_TEMP/profile-summary.txt"
          test "$(wc -l < "$RUNNER_TEMP/w_low11.txt")" -eq 95420
          test "$(wc -l < "$RUNNER_TEMP/w_a0.txt")" -eq 146860
          test "$(wc -l < "$RUNNER_TEMP/w_low12.txt")" -eq 82100
      - name: Install OR-Tools
        run: python -m pip install --disable-pip-version-check 'ortools>=9.14,<10'
      - name: Search the five previously hard structural cases in parallel
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/labs"
          cases='W129-A W131-A0 W131-A2 W131-B1 W131-B3'
          export RUNNER_TEMP
          printf '%s\n' $cases | xargs -P"$(nproc)" -I{} bash -c '
            c="$1"
            case "$c" in
              W131-A0) typ=a0 ;;
              W131-B3) typ=low12 ;;
              *) typ=low11 ;;
            esac
            set +e
            python science-boundary/labs-100/code/oddperfect_h20_w129_w131_order10_cpsat.py \
              --case "$c" --profiles "$RUNNER_TEMP/w_${typ}.txt" --seconds 240 --workers 1 --seed 301029 \
              >"$RUNNER_TEMP/labs/$c.log" 2>&1
            rc=$?
            echo "$c $rc" >"$RUNNER_TEMP/labs/$c.status"
            exit 0
          ' _ {}
          cat "$RUNNER_TEMP"/labs/*.log | tee "$RUNNER_TEMP/summary.log"
          cat "$RUNNER_TEMP"/labs/*.status | sort | tee "$RUNNER_TEMP/status.txt"
          if grep -q '"independent_check": true' "$RUNNER_TEMP"/labs/*.log; then
            echo FOUND_VERIFIED_RECORD_CANDIDATE
          fi
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-w129-w131-order10
          path: |
            ${{ runner.temp }}/profile-summary.txt
            ${{ runner.temp }}/summary.log
            ${{ runner.temp }}/status.txt
            ${{ runner.temp }}/labs/*.log
            ${{ runner.temp }}/labs/*.status
          if-no-files-found: warn
