name: Temp Science Boundary C7 outside-outside deficit frontier

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-outside-outside-deficit.yml
      - science-boundary/shannon-capacity-c7/code/bpz_outside_outside_deficit_frontier.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-outside-outside-deficit
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: 4
      OMP_PROC_BIND: spread
      OMP_PLACES: cores
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned BPZ source and Few Shots verifier
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
      - name: Packed terminal-aware outside-outside frontier
        id: search
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_outside_outside_deficit_frontier.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/frontier.json" "$RUNNER_TEMP/shot/certificate.json" \
            --caps 0,1,2 --closure-limit 120000 --exact-limit 60000 --workers 4 \
            | tee "$RUNNER_TEMP/result/frontier.stdout"
          python3 - "$RUNNER_TEMP/result/frontier.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          with open(sys.argv[2],'a') as f:
              f.write(f"found={'true' if r.get('candidate_materialized') else 'false'}\n")
              f.write(f"score={r.get('candidate_score') or 0}\n")
          PY
      - name: Verify breakthrough with Few Shots verifier
        if: steps.search.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if not r.get('valid') or int(r.get('score',-1)) < 134754: raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY
      - name: Upload frontier result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-outside-outside-deficit-frontier
          path: |
            ${{ runner.temp }}/result
            ${{ runner.temp }}/shot
          retention-days: 14
