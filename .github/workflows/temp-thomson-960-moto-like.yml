name: temp Thomson 960 MOTO-like saddle explorer

on:
  push:
    branches: [main]
    paths:
      - "science-boundary/thomson-960/launch-moto.flag"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        seed: [8101, 8102]
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Screen diverse spectral-gap starts and follow minimum modes
        run: |
          python3 science-boundary/thomson-960/code/moto_like_saddle_explorer.py \
            "$RUNNER_TEMP/few-shots" --seed ${{ matrix.seed }} \
            --population 6 --select 2 --basis-k 10 \
            --scales 0.008,0.014,0.022 \
            --mmf-cycles 5 --mmf-steps 50 \
            --mmf-eta 0.00025 --mmf-max-rms 0.000012 \
            --certify-amp 0.002 \
            --out "$RUNNER_TEMP/moto-${{ matrix.seed }}.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'moto-${{ matrix.seed }}.json')
          d=json.load(open(p))
          for r in d.get('results',[]):
              r.pop('saddle_points',None)
              for e in r.get('certified_endpoints',[]): e.pop('points',None)
          print(json.dumps(d,indent=2))
          PY
      - name: Upload explorer result
        uses: actions/upload-artifact@v4
        with:
          name: thomson-moto-${{ matrix.seed }}
          path: ${{ runner.temp }}/moto-${{ matrix.seed }}.json
          retention-days: 7
