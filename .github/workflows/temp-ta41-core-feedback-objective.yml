name: temp-ta41-core-feedback-objective
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-core-feedback-objective.yml'
      - 'science-boundary/job-shop-ta41/optimize_core_feedback_subspaces.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-core-feedback-objective
  cancel-in-progress: false
jobs:
  optimize:
    strategy:
      fail-fast: false
      matrix:
        parent: [baseline, '124']
        method: [degree, core_random, random]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Pin solver and check syntax
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/optimize_core_feedback_subspaces.py
      - name: Recheck residual hard subspace with warm-started objective CP
        run: |
          python3 science-boundary/job-shop-ta41/optimize_core_feedback_subspaces.py \
            --parent '${{ matrix.parent }}' --method '${{ matrix.method }}' \
            --seconds 105 --workers 4 \
            --out 'science-boundary/job-shop-ta41/results/core-objective-${{ matrix.parent }}-${{ matrix.method }}'
      - name: Official Few Shots check if improvement found
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/core-objective-${{ matrix.parent }}-${{ matrix.method }}"
          if test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist certified scores and all unknowns
        if: always()
        run: |
          set -euo pipefail
          out='science-boundary/job-shop-ta41/results/core-objective-${{ matrix.parent }}-${{ matrix.method }}'
          if ! test -d "$out"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): warm objective check of core-feedback ${{ matrix.parent }} ${{ matrix.method }}'
          for attempt in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
