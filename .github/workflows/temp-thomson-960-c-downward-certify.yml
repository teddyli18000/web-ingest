name: temp Thomson 960 certify C-downward index1 saddles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-c-downward-certify.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        phase: [0, 20, 100]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Download C-downward candidate
        uses: actions/download-artifact@v4
        with:
          name: thomson-c-i1-p${{ matrix.phase }}
          path: ${{ runner.temp }}/seed
          github-token: ${{ github.token }}
          run-id: 40735119192
      - name: Hybrid refine candidate
        run: |
          python3 science-boundary/thomson-960/code/refine_saddle_hybrid.py \
            "$RUNNER_TEMP/seed/c-i1-p${{ matrix.phase }}.json" \
            --outer 8 --penalty 350000 --perp-maxiter 700 \
            --newton-damping 0.45 --max-reaction-rms 0.00008 \
            --out "$RUNNER_TEMP/refined-p${{ matrix.phase }}.json"
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'refined-p${{ matrix.phase }}.json')
          d=json.load(open(p))
          print('REFINED',d['final_energy'],d['final_gradient_rms'],d['negative_internal_modes_below_-1e-3'],[m['eigenvalue'] for m in d['final_modes'][:6]])
          PY
      - name: Descend both reaction-mode sides when index1
        run: |
          NEG=$(python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'refined-p${{ matrix.phase }}.json')))
          print(d['negative_internal_modes_below_-1e-3'])
          PY
          )
          if [ "$NEG" = "1" ]; then
            python3 science-boundary/thomson-960/code/search_saddle_transverse.py \
              "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/refined-p${{ matrix.phase }}.json" \
              --transverse-mode 1 --sign 1 --transverse-amps 0 \
              --reaction-amps=-0.003,-0.0015,0.0015,0.003 \
              --out "$RUNNER_TEMP/reaction-p${{ matrix.phase }}.json"
          else
            echo "not index1 after refinement: $NEG"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-c-downward-certified-p${{ matrix.phase }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/refined-p${{ matrix.phase }}.json
            ${{ runner.temp }}/reaction-p${{ matrix.phase }}.json
