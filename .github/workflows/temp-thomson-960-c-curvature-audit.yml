name: temp Thomson 960 C curvature audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-c-curvature-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Rebuild C and audit mode-0 curvature
        run: |
          python3 science-boundary/thomson-960/code/harvest_basin_c.py \
            "$RUNNER_TEMP/few-shots" --neighbor-json science-boundary/thomson-960/data/neighbor-soft-003280.json \
            --scale 0.95 --out "$RUNNER_TEMP/c.json"
          python3 science-boundary/thomson-960/code/audit_mode_curvature.py \
            "$RUNNER_TEMP/c.json" --mode 0 \
            --amps 1e-5,3e-5,1e-4,2e-4,3e-4,4e-4,5e-4,6e-4,7e-4,8e-4,1e-3,1.5e-3 \
            --out "$RUNNER_TEMP/c-curvature.json"
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-c-curvature-audit
          retention-days: 7
          path: ${{ runner.temp }}/c-curvature.json
