name: Temp GPT MV final 1080p30

on:
  push:
    paths:
      - ".github/workflows/temp-gpt-mv-ending-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: temp-work/gpt-mv-code-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
      - name: Render final film
        run: node export/render.mjs --start 0 --end 60 --width 1920 --height 1080 --fps 30 --art-source reach-hq --out out/GPT_Shared_Draft_Final.mp4
      - name: Validate final media
        run: |
          set -euo pipefail
          test -s out/GPT_Shared_Draft_Final.mp4
          test -s out/GPT_Shared_Draft_Final.contact.jpg
          ffmpeg -v error -i out/GPT_Shared_Draft_Final.mp4 -f null -
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,avg_frame_rate,codec_name,pix_fmt -show_entries format=duration -of default=nw=1 out/GPT_Shared_Draft_Final.mp4 | tee out/metadata.txt
          python - <<'PY'
          import json, subprocess
          p='out/GPT_Shared_Draft_Final.mp4'
          raw=subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height,r_frame_rate','-show_entries','format=duration','-of','json',p], text=True)
          j=json.loads(raw); s=j['streams'][0]; d=float(j['format']['duration'])
          assert s['width']==1920 and s['height']==1080, s
          assert s['r_frame_rate']=='30/1', s
          assert 59.9 <= d <= 60.1, d
          print('validated',s['width'],s['height'],s['r_frame_rate'],d)
          PY
          ffmpeg -hide_banner -i out/GPT_Shared_Draft_Final.mp4 -vf "blackdetect=d=0.15:pix_th=0.02,freezedetect=n=0.001:d=1.0" -an -f null - 2>&1 | tee out/qc.txt
          if grep -q 'black_start' out/qc.txt; then echo 'unexpected black interval' >&2; exit 1; fi
          sha256sum out/GPT_Shared_Draft_Final.mp4 | tee out/sha256.txt
      - name: Upload final review
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mv-final-1080p30-${{ github.run_id }}
          path: |
            temp-work/gpt-mv-code-native/out/GPT_Shared_Draft_Final.mp4
            temp-work/gpt-mv-code-native/out/GPT_Shared_Draft_Final.contact.jpg
            temp-work/gpt-mv-code-native/out/metadata.txt
            temp-work/gpt-mv-code-native/out/qc.txt
            temp-work/gpt-mv-code-native/out/sha256.txt
          retention-days: 14
          if-no-files-found: error
