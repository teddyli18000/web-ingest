name: temp Thomson capture new scar-braid elite coordinates

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-save-novel-scar-elites.yml'

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: thomson-scar-braid-seed-2202
          path: ${{ runner.temp }}/elite
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 42250842594
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Independently repolish and retain distinct new low-energy parents
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          import numpy as np
          sys.path.insert(0,'science-boundary/thomson-960/code')
          import search_size_beam as sb
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'elite'/'result.json').read_text())
          R=444368.3924061973
          known=[R,444368.3956862258,444368.4029728613,444368.4040805305]
          novel=[p for p in d['population']
                 if p['energy']<R+0.7 and all(abs(p['energy']-e)>1e-5 for e in known)]
          kept=[]
          for p in novel[:8]:
              x=np.asarray(p['points'],float)
              E,y,nit,ok=sb.stable_relax(x,2200)
              print('REPOLISH',p['tag'],'stored',p['energy'],'checked',E,'deltaR',E-R,flush=True)
              if abs(E-p['energy'])>3e-5:raise RuntimeError('energy mismatch')
              if any(abs(E-z['energy'])<1e-6 for z in kept):continue
              kept.append({'energy':E,'delta_record':E-R,'points':y.tolist(),
                           'origin_tag':p['tag'],'independent_nit':int(nit)})
          output={'baseline':R,'origin_run':42250842594,'seed':2202,
                  'method':'area-preserving scar-braid candidate generation',
                  'independent_repolish':'search_size_beam.stable_relax',
                  'novel_parent_count':len(kept),'minima':kept}
          path=pathlib.Path('science-boundary/thomson-960/data/scar-braid-elites-2202-2026-11-06.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(output,separators=(',',':'))+'\n')
          print('SAVED',path,'count',len(kept),'first energies',[p['energy'] for p in kept])
          PY
      - name: Commit verified elite parents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/thomson-960/data/scar-braid-elites-2202-2026-11-06.json
          git commit -m "thomson: save independently repolished novel scar-braid parents"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            echo "Retrying concurrent main push after attempt $attempt"
          done
          exit 1
