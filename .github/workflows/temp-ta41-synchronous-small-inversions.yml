name: temp-ta41-synchronous-small-inversions
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/synchronous_small_inversions.py'
      - '.github/workflows/temp-ta41-synchronous-small-inversions.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-synchronous-small-inversions
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: single-2005
            target: 2005
            r: 1
            budget: 20
          - label: single-2006
            target: 2006
            r: 1
            budget: 20
          - label: double-2005
            target: 2005
            r: 2
            budget: 30
          - label: double-2006
            target: 2006
            r: 2
            budget: 30
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned solver and verify syntax
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/synchronous_small_inversions.py
      - name: Optimize all swaps jointly with exact non-overlap
        run: |
          python3 science-boundary/job-shop-ta41/synchronous_small_inversions.py \
            --target '${{ matrix.target }}' --per-machine '${{ matrix.r }}' \
            --min-swaps 15 --max-swaps '${{ matrix.budget }}' --min-machines 15 \
            --seconds 180 --out 'science-boundary/job-shop-ta41/results/synchronous-${{ matrix.label }}'
      - name: Official score validation when a certificate exists
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/synchronous-${{ matrix.label }}"
          if test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2006,v
          PY
          fi
      - name: Persist independently interpretable outcome
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/synchronous-${{ matrix.label }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): simultaneous disjoint swaps ${{ matrix.label }}'
          for attempt in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
