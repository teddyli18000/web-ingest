name: Google Trending - four region repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-trending-four-region-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: google-trending-maintenance
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate task and temporary tool
        run: |
          python -m py_compile google-trending/*.py tools/tmp/google-trending-gap-audit.py
          python -m unittest discover -s google-trending/tests -v
          python tools/check-repository-integrity.py --show

      - name: Audit 2026 GitHub history gap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/tmp/google-trending-gap-audit.py \
            --output tools/reports/google-trending-gap-audit-2026-09-01.md

      - name: Download licensed historical raw archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 \
            -o "$RUNNER_TEMP/googletrendarchive-daily.zip" \
            "https://huggingface.co/datasets/aurman/GoogleTrendArchive/resolve/main/daily_compressed.zip?download=true"
          echo "2c62716919db98408ede388ed2c6c59f7db7bd01b197ea019aeded197204e09c  $RUNNER_TEMP/googletrendarchive-daily.zip" | sha256sum -c -

      - name: Add GB and HK to licensed historical archive
        shell: bash
        run: |
          set -euo pipefail
          for year in 2024 2025 2026; do
            python google-trending/backfill.py \
              --zip "$RUNNER_TEMP/googletrendarchive-daily.zip" \
              --zip-sha256 "2c62716919db98408ede388ed2c6c59f7db7bd01b197ea019aeded197204e09c" \
              --year "$year"
          done

      - name: Capture all four regions for today
        run: python google-trending/capture.py

      - name: Validate archive and refresh dashboard
        run: |
          python google-trending/validate_archive.py
          python google-trending/render_readme.py

      - name: Commit repair, report and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/google-trending-four-region-repair.yml
          git rm tools/tmp/google-trending-gap-audit.py
          git add google-trending/data google-trending/backfill-manifest.json google-trending/README.md tools/reports

          git status --short
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 1
          fi

          git commit -m "maintenance(google-trending): complete four-region recovery"
          git pull --rebase origin main
          git push origin HEAD:main
