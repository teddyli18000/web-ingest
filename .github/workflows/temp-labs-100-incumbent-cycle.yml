name: temp labs-100 incumbent basin cycle
on:
  push:
    paths:
      - 'science-boundary/labs-100/code/incumbent_cycle.cpp'
      - '.github/workflows/temp-labs-100-incumbent-cycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and run
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20 -fopenmp -DNDEBUG science-boundary/labs-100/code/incumbent_cycle.cpp -o /tmp/inc-cycle
          set +e
          /tmp/inc-cycle --runs 24 --threads 4 --cycles 8 --steps 3000 --seed 1 | tee /tmp/inc-cycle.txt
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^(BREAK|FAR|FINAL)' /tmp/inc-cycle.txt
          exit 0
