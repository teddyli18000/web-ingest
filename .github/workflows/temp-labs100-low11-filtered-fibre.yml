name: temp labs100 filtered low11 joint fibre search

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-labs100-low11-filtered-fibre.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-labs100-low11-filtered-fibre
  cancel-in-progress: false

jobs:
  exact-filtered-fibre:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the already verified near-NGP order10 tables
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/near"
          gh run download 41047039026 --repo "$GITHUB_REPOSITORY" \
            --name labs100-low11-nearngp10 --dir "$RUNNER_TEMP/near"
          test "$(wc -l < "$RUNNER_TEMP/near/near_d1.txt")" -eq 26600
          test "$(wc -l < "$RUNNER_TEMP/near/near_d2.txt")" -eq 67916
          sha256sum "$RUNNER_TEMP/near/near_d1.txt" "$RUNNER_TEMP/near/near_d2.txt" | tee "$RUNNER_TEMP/filter-sha256.txt"
      - name: Build exact fixed-candidate fibre oracle
        run: g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_order25_fibre_mitm.cpp -o "$RUNNER_TEMP/fibre"
      - name: Install OR-Tools
        run: python -m pip install --disable-pip-version-check 'ortools>=9.14,<10'
      - name: Search the four unresolved overlap layers for d1 and d2 using every CPU
        shell: bash
        run: |
          set -uo pipefail
          echo "runner_cpus=$(nproc)"
          mkdir -p "$RUNNER_TEMP/labs"
          export RUNNER_TEMP
          for d in 1 2; do
            for k in 12 14; do
              for t in 4 6 8 10; do
                echo "$d $k $t"
              done
            done
          done | xargs -P"$(nproc)" -n3 bash -c '
            d="$1"; k="$2"; t="$3"
            set +e
            python science-boundary/labs-100/code/oddperfect_low11_compressed_order10_fibre_cpsat.py \
              --kp "$k" --overlap "$t" --profiles "$RUNNER_TEMP/near/near_d${d}.txt" \
              --seconds 90 --workers 1 --seed $((501030+1000*d+100*k+t)) \
              >"$RUNNER_TEMP/labs/d${d}-k${k}-t${t}.json" 2>&1
            rc=$?
            echo "d${d} kp${k} t${t} rc=${rc}" >"$RUNNER_TEMP/labs/d${d}-k${k}-t${t}.status"
            exit 0
          ' _
          cat "$RUNNER_TEMP"/labs/*.json | tee "$RUNNER_TEMP/summary.log"
          cat "$RUNNER_TEMP"/labs/*.status | sort | tee "$RUNNER_TEMP/status.txt"
      - name: Exact full fibre test every verified compressed candidate in its target defect class
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/fibre.log"
          for src in "$RUNNER_TEMP"/labs/*.json; do
            if ! grep -q '"independent_check": true' "$src"; then
              continue
            fi
            stem=$(basename "$src" .json)
            d=$(printf '%s' "$stem" | sed -n 's/^d\([12]\)-.*/\1/p')
            test -n "$d"
            python - "$src" "$RUNNER_TEMP/candidate.txt" <<'PY'
          import json,sys
          z=json.load(open(sys.argv[1]))
          with open(sys.argv[2],'w') as f:
              f.write(' '.join(map(str,z['p']))+'\n')
              f.write(' '.join(map(str,z['c']))+'\n')
          PY
            echo "$stem defect$d" | tee -a "$RUNNER_TEMP/fibre.log"
            OMP_NUM_THREADS="$(nproc)" "$RUNNER_TEMP/fibre" --defect "$d" < "$RUNNER_TEMP/candidate.txt" | tee -a "$RUNNER_TEMP/fibre.log"
          done
          if grep -E 'compatible_probe_lifts=[1-9][0-9]*' "$RUNNER_TEMP/fibre.log"; then
            echo FILTERED_COMPRESSED_CANDIDATE_HAS_TARGET_FIBRE_LIFT
          fi
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-low11-filtered-fibre
          path: |
            ${{ runner.temp }}/filter-sha256.txt
            ${{ runner.temp }}/summary.log
            ${{ runner.temp }}/status.txt
            ${{ runner.temp }}/fibre.log
            ${{ runner.temp }}/labs/*.json
            ${{ runner.temp }}/labs/*.status
          if-no-files-found: warn
