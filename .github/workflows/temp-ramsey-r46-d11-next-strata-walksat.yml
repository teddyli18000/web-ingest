name: Temp Ramsey R46 d11 next-strata WalkSAT

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/d11_pair_walksat.cpp
      - .github/workflows/temp-ramsey-r46-d11-next-strata-walksat.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download authenticated complete endpoint catalogues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/catalogs
          curl --fail --location --retry 4 --silent --show-error https://users.cecs.anu.edu.au/~bdm/data/r36_11.g6.gz -o /tmp/r46/r36_11.g6.gz
          curl --fail --location --retry 4 --silent --show-error https://users.cecs.anu.edu.au/~bdm/data/r45_24.g6 -o /tmp/r46/r45_24.g6
          echo '628c53df90910b2aae9a9559a62605593ff6fcdac66e9f23f95a134a4a696f36  /tmp/r46/r36_11.g6.gz' | sha256sum -c -
          echo '83ca4028f206b2fa4315ef219b8c2c57c7835209673dd8183d8fb4353bd4fdd0  /tmp/r46/r45_24.g6' | sha256sum -c -
          python3 science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py extract /tmp/r46/r36_11.g6.gz 11 25 /tmp/r46/catalogs/A25.g6
          python3 science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py extract /tmp/r46/r36_11.g6.gz 11 26 /tmp/r46/catalogs/A26.g6
          python3 science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py extract /tmp/r46/r45_24.g6 24 116 /tmp/r46/catalogs/B116.g6
          python3 science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py extract /tmp/r46/r45_24.g6 24 117 /tmp/r46/catalogs/B117.g6
          test "$(wc -l < /tmp/r46/catalogs/A25.g6)" -eq 6
          test "$(wc -l < /tmp/r46/catalogs/A26.g6)" -eq 2
          test "$(wc -l < /tmp/r46/catalogs/B116.g6)" -eq 9
          test "$(wc -l < /tmp/r46/catalogs/B117.g6)" -eq 90
      - uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-d11-next-strata-catalogs
          path: /tmp/r46/catalogs
          retention-days: 7

  scan:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {family: a25-b116, aedge: 25, bedge: 116, a: 0}
          - {family: a25-b116, aedge: 25, bedge: 116, a: 1}
          - {family: a25-b116, aedge: 25, bedge: 116, a: 2}
          - {family: a25-b116, aedge: 25, bedge: 116, a: 3}
          - {family: a25-b116, aedge: 25, bedge: 116, a: 4}
          - {family: a25-b116, aedge: 25, bedge: 116, a: 5}
          - {family: a26-b117, aedge: 26, bedge: 117, a: 0}
          - {family: a26-b117, aedge: 26, bedge: 117, a: 1}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ramsey-r46-d11-next-strata-catalogs
          path: /tmp/r46/catalogs
      - name: Compile deterministic pair searcher
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -std=c++17 -include functional science-boundary/ramsey-r46/d11_pair_walksat.cpp -o /tmp/d11-walk
      - name: Scan fixed-A row of pair catalogue
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/out
          ACAT=/tmp/r46/catalogs/A${{ matrix.aedge }}.g6
          BCAT=/tmp/r46/catalogs/B${{ matrix.bedge }}.g6
          A=$(sed -n "$(( ${{ matrix.a }} + 1 ))p" "$ACAT")
          : > /tmp/r46/out/results.jsonl
          hit=0
          b=0
          while IFS= read -r B; do
            seed=$(( 310000000 + ${{ matrix.aedge }} * 100000 + ${{ matrix.bedge }} * 1000 + ${{ matrix.a }} * 100 + b ))
            set +e
            /tmp/d11-walk "$A" "$B" "$seed" 120000 /tmp/r46/out/model.txt > /tmp/r46/out/one.json
            rc=$?
            set -e
            python3 - /tmp/r46/out/one.json /tmp/r46/out/results.jsonl '${{ matrix.family }}' '${{ matrix.a }}' "$b" '${{ matrix.aedge }}' '${{ matrix.bedge }}' <<'PY'
          import json,sys
          src,out,fam,a,b,ae,be=sys.argv[1:]
          d=json.load(open(src));d.update(family=fam,a_ordinal=int(a),b_ordinal=int(b),a_edges=int(ae),b_edges=int(be))
          with open(out,'a') as f:f.write(json.dumps(d,sort_keys=True)+'\n')
          PY
            if [[ "$rc" -eq 0 ]]; then
              python3 science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py decode "$ACAT" "$BCAT" '${{ matrix.a }}' "$b" /tmp/r46/out/model.txt /tmp/r46/out/candidate.json > /tmp/r46/out/internal-verify.json
              hit=1
              break
            elif [[ "$rc" -ne 1 ]]; then
              echo "unexpected searcher exit $rc" >&2
              exit "$rc"
            fi
            b=$((b+1))
          done < "$BCAT"
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          python3 - /tmp/r46/out/results.jsonl <<'PY'
          import json,sys
          rows=[json.loads(x) for x in open(sys.argv[1]) if x.strip()]
          z=min(rows,key=lambda d:d['best'])
          print(json.dumps({'pairs':len(rows),'best':z},sort_keys=True))
          PY
      - name: Authoritative Few Shots verification on hit
        if: steps.scan.outputs.hit == '1'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate
          cp /tmp/r46/out/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/out/few-shots-verify.json
          python3 -c "import json;d=json.load(open('/tmp/r46/out/few-shots-verify.json'));assert d.get('valid') is True and int(d.get('score'))>=36,d"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-d11-next-${{ matrix.family }}-${{ matrix.a }}
          path: /tmp/r46/out
          if-no-files-found: warn
          retention-days: 7

  collect:
    if: always()
    needs: [prepare,scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-d11-next-*
          path: /tmp/parts
      - name: Aggregate constructive ranking
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 - /tmp/parts /tmp/r46/result.json <<'PY'
          import json,pathlib,shutil,sys
          rows=[];hit=None;verified=0
          for p in pathlib.Path(sys.argv[1]).rglob('results.jsonl'):
              rows += [json.loads(x) for x in open(p) if x.strip()]
              c=p.parent/'candidate.json';v=p.parent/'few-shots-verify.json'
              if v.exists():
                  q=json.load(open(v));verified += q.get('valid') is True and int(q.get('score',0))>=36
              if c.exists() and hit is None:hit=(c,v if v.exists() else None)
          rows.sort(key=lambda d:(d['best'],d['family'],d['a_ordinal'],d['b_ordinal']))
          fam={}
          for r in rows:
              f=fam.setdefault(r['family'],{'pairs':0,'best':999999});f['pairs']+=1;f['best']=min(f['best'],r['best'])
          out={'campaign':'d11-next-strata-walksat','families':fam,'pairs_scanned':len(rows),'verified_sat_count':verified,'best_rows':rows[:30]}
          if hit:
              shutil.copyfile(hit[0],'/tmp/r46/candidate.json')
              if hit[1]:shutil.copyfile(hit[1],'/tmp/r46/few-shots-verify.json')
          open(sys.argv[2],'w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='best_rows'},sort_keys=True))
          PY
      - name: Persist heuristic evidence and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/d11-next-strata-walksat.json
          if [[ -f /tmp/r46/candidate.json ]]; then cp /tmp/r46/candidate.json science-boundary/ramsey-r46/results/d11-next-strata-hit.json; fi
          if [[ -f /tmp/r46/few-shots-verify.json ]]; then cp /tmp/r46/few-shots-verify.json science-boundary/ramsey-r46/results/d11-next-strata-hit-verify.json; fi
          git rm .github/workflows/temp-ramsey-r46-d11-next-strata-walksat.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/d11-next-strata-*.json
          git commit -m 'ramsey-r46: record next-strata constructive scan'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-d11-next-strata-summary
          path: /tmp/r46
          retention-days: 7
