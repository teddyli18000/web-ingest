name: temp-aes-g103-joint-prefix48

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-aes-g103-joint-prefix48.yml'

permissions:
  contents: read

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        basis: ['1,2,4', '1,3,4', '2,3,4']
        seed: [1, 2, 3, 4]
        weight: [1, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Search jointly synthesized 48-linear prefix
        run: |
          set -euxo pipefail
          python science-boundary/aes-sbox-circuit/g103_joint_cut_basis_search.py \
            --basis-rows '${{ matrix.basis }}' --prefix-seed '${{ matrix.seed }}' \
            --prefix-budget 48 --prefix-max-support 8 --prefix-elite 24 \
            --extra-weight '${{ matrix.weight }}' --suffix-seeds 1 \
            --suffix-max-support 10 --suffix-elite 24 --target-total 100 \
            --out result | tee run.log
          cat result/summary.json
      - name: Official verifier for any <=100 candidate
        run: |
          set -euxo pipefail
          if [ -f result/full.json ] && [ "$(python -c "import json; print(len(json.load(open('result/full.json'))['gates']))")" -le 100 ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/shot
            cp result/full.json /tmp/shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-g103-prefix48-b${{ matrix.basis }}-w${{ matrix.weight }}-s${{ matrix.seed }}
          path: |
            result
            run.log
            official-verifier.jsonl
