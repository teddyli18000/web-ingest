name: Temp Science Boundary C7 baseline net1 r6 c5 shards

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-baseline-net1-r6-c5-shards.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify Few Shots baseline
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
          cp "$RUNNER_TEMP/few-shots/problems/p004-shannon-capacity-c7/baseline/certificate.json" "$RUNNER_TEMP/base/certificate.json"
          python3 - "$RUNNER_TEMP/base/certificate.json" "$RUNNER_TEMP/base/ids.txt" <<'PY'
          import json,sys
          pts=json.load(open(sys.argv[1],encoding='utf-8'))['points']
          if len(pts)!=134753 or len(set(pts))!=134753: raise SystemExit(('baseline drift',len(pts),len(set(pts))))
          open(sys.argv[2],'w').write(''.join(f'{int(p,7)}\n' for p in pts))
          PY
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/base" | tee "$RUNNER_TEMP/result/base-verify.json"
      - name: Retarget, shard, and compile exact c5 solver
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/patch_r6_c5_anchor_net2_to_net1.py \
            science-boundary/shannon-capacity-c7/code/search_net2_r6_c5_anchor.cpp "$RUNNER_TEMP/net1.cpp"
          python3 science-boundary/shannon-capacity-c7/code/patch_r6_c5_anchor_shard.py \
            "$RUNNER_TEMP/net1.cpp" "$RUNNER_TEMP/search.cpp"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp "$RUNNER_TEMP/search.cpp" -o "$RUNNER_TEMP/r6-c5"
      - name: Exact c5-anchor shard
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          /usr/bin/time -v "$RUNNER_TEMP/r6-c5" "$RUNNER_TEMP/base/ids.txt" '${{ matrix.shard }}' 8 \
            > "$RUNNER_TEMP/result/search.json" 2> "$RUNNER_TEMP/result/search.stderr"
          cat "$RUNNER_TEMP/result/search.json"
          tail -n 80 "$RUNNER_TEMP/result/search.stderr"
      - name: Materialize candidate
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/base/certificate.json" "$RUNNER_TEMP/result/search.json" "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/status.json" <<'PY'
          import json,sys
          bp,sp,outp,stp=sys.argv[1:]
          pts=set(json.load(open(bp,encoding='utf-8'))['points']); s=json.load(open(sp,encoding='utf-8'))
          def dec(z):
              d=[]
              for _ in range(10): d.append(str(z%7)); z//=7
              return ''.join(reversed(d))
          st={'candidate':False,'score':len(pts),'search':s}
          if s.get('kind')=='replace6add7':
              rem=[dec(int(z)) for z in s['remove']]; add=[dec(int(z)) for z in s['add']]
              if len(rem)!=6 or len(set(rem))!=6 or any(p not in pts for p in rem): raise SystemExit(('bad removals',rem))
              for p in rem: pts.remove(p)
              if len(add)!=7 or len(set(add))!=7 or any(p in pts for p in add): raise SystemExit(('bad additions',add))
              pts.update(add)
              if len(pts)!=134754: raise SystemExit(('score',len(pts)))
              json.dump({'points':sorted(pts)},open(outp,'w',encoding='utf-8'),separators=(',',':'));open(outp,'a').write('\n')
              st.update(candidate=True,score=134754)
          json.dump(st,open(stp,'w',encoding='utf-8'),indent=2,sort_keys=True);open(stp,'a').write('\n')
          PY
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify breakthrough with Few Shots verifier
        if: steps.materialize.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1))<=134753: raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-baseline-net1-r6-c5-${{ matrix.shard }}
          path: ${{ runner.temp }}/result
          retention-days: 14
