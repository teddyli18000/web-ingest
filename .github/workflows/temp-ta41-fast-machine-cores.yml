name: temp-ta41-fast-machine-cores
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/fast_machine_core_separation.py'
      - '.github/workflows/temp-ta41-fast-machine-cores.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-fast-machine-cores
  cancel-in-progress: false
jobs:
  explore:
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 2026
          - seed: 4107
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned solver
        run: python -m pip install 'ortools==9.14.6206'
      - name: Accumulate machine level UNSAT cores without unnecessary shrinking
        run: |
          python3 science-boundary/job-shop-ta41/fast_machine_core_separation.py --seconds 580 --oracle-seconds 5 --iterations 3000 --seed '${{ matrix.seed }}' --out 'science-boundary/job-shop-ta41/results/machine-fast-${{ matrix.seed }}'
      - name: Officially verify any improved schedule
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/machine-fast-${{ matrix.seed }}"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist verified learned cores and resulting bound
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'science-boundary/job-shop-ta41/results/machine-fast-${{ matrix.seed }}/'
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): fast learned machine cores seed ${{ matrix.seed }}'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
