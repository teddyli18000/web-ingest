name: temp-ta41-energetic-partial-resource-repair
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-energetic-partial-resource-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-energetic-partial-resource-repair
  cancel-in-progress: false
jobs:
  energetic:
    strategy:
      fail-fast: false
      matrix:
        case: [ta41, ta42js-n7elite1701, ta43js-n7elite1711, ta46js-n7elite1701]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CP, compile-check explicit group-overload witness
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/partial_resource_pair_repair.py
      - name: Construct partial resource energy overloads, guide growing joint release and exact CP completion
        run: |
          set -euo pipefail
          c='${{ matrix.case }}'
          if test "$c" = ta41; then src=ta41; else src="science-boundary/job-shop-ta41/positive-n7-elite-data/$c/start.txt"; fi
          python3 science-boundary/job-shop-ta41/partial_resource_pair_repair.py \
            --start "$src" --method energetic --seed 709 --growth 20 --rounds 10 --cp-seconds 2.5 \
            --out "science-boundary/job-shop-ta41/results/partial-pair-$c-energetic"
      - name: Independently verify any improved ta41 machine order using Few Shots
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/partial-pair-${{ matrix.case }}-energetic"
          if test '${{ matrix.case }}' = ta41 && test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Preserve score and real group-energy diagnostics
        if: always()
        run: |
          set -euo pipefail
          out="science-boundary/job-shop-ta41/results/partial-pair-${{ matrix.case }}-energetic"
          if ! test -d "$out"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(ta41): sound machine energy witness and joint repair ${{ matrix.case }}"
          for attempt in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
