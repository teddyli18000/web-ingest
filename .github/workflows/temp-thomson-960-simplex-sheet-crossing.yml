name: temp Thomson 960 simplex sheet crossing

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-simplex-sheet-crossing.yml'

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Static check
        run: python3 -m py_compile science-boundary/thomson-960/code/search_n961_simplex_sheet_crossing.py
      - uses: actions/download-artifact@v4
        with:
          pattern: thomson-three-occupancy-simplex-*
          path: ${{ runner.temp }}/simplex
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41198272370
      - name: Fixed-occupancy A/H crossing scan
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=444368.3924061973
          python3 science-boundary/thomson-960/code/search_n961_simplex_sheet_crossing.py \
            "$RUNNER_TEMP/simplex/thomson-three-occupancy-simplex-A960/result.json" \
            "$RUNNER_TEMP/simplex/thomson-three-occupancy-simplex-H380/result.json" \
            --live-score "$live" --out "$RUNNER_TEMP/out/crossing.json"
      - name: Build durable simplex summary
        run: |
          python3 - <<'PY'
          import json,os,pathlib,numpy as np
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'simplex'
          paths={
            'R886':root/'thomson-three-occupancy-simplex-R886'/'result.json',
            'A960':root/'thomson-three-occupancy-simplex-A960'/'result.json',
            'H380':root/'thomson-three-occupancy-simplex-H380'/'result.json',
          }
          ds={k:json.load(open(v)) for k,v in paths.items()}
          def align(ref,x):
              H=x.T@ref; U,_,Vt=np.linalg.svd(H); R=U@Vt
              if np.linalg.det(R)<0: U[:,-1]*=-1; R=U@Vt
              y=x@R; d=np.linalg.norm(y-ref,axis=1)
              return float(np.sqrt(np.mean(d*d))),float(np.max(d))
          pairs=[]
          ks=list(ds)
          for i in range(len(ks)):
              for j in range(i+1,len(ks)):
                  a,b=ks[i],ks[j]
                  r,m=align(np.asarray(ds[a]['center_points']),np.asarray(ds[b]['center_points']))
                  pairs.append((a,b,r,m))
          c=json.load(open(pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/'crossing.json'))
          lines=['Thomson N=960 — constant-total three-occupancy simplex — 2026-10-31','',
                 'continuation run = 41198272370',
                 'crossing analysis run = generated by temp-thomson-960-simplex-sheet-crossing',
                 'constraint: q886 + q960 + q380 = 2; all other charges = 1; total charge exactly 960',
                 'common center: q886=q960=q380=2/3','']
          for k,d in ds.items():
              lines.append(f"{k}: vertex={d['vertex_endpoint']['class']} center_Ew={d['center_weighted_energy']:.15f} center_grms={d['center_weighted_grms']:.6g}")
              lines.append('  center projections: '+', '.join(f"del{p['delete_index']}->{p['class']} {p['energy']:.12f}" for p in d['projections']))
          lines += ['','Pairwise labelled Kabsch distances at identical center occupancy:']
          for a,b,r,m in pairs: lines.append(f'  {a} vs {b}: RMS={r:.12g} rad-equivalent chord, max={m:.12g}')
          lines += ['',f"A/H weighted center energy gap = {c['center_energy_gap_H_minus_A']:.15g}",
                    f"A/H aligned center RMS = {c['center_alignment_rms']:.12g}",
                    f"A/H fixed-occupancy interpolation switches = {c['switches']}",
                    f"Best projected N960 energy in crossing scan = {c['best_projection']['energy']:.15f} ({c['best_projection']['class']}), delta_live={c['best_projection']['delta_live']:+.12g}",'',
                    'Interpretation:',
                    '- R886 and A960 continuations reach the same A-like center sheet to numerical/geometric accuracy if their pairwise distance is tiny.',
                    '- H380 remains a distinct weighted local minimum at the exact same charges, proving constant-total multistability rather than a total-charge artifact.',
                    '- The fixed-occupancy A/H interpolation scan tests the geometric basin boundary between those sheets; any third weighted class or new N960 projection is reported above.',
                    '- No value within ~1e-10 of the accepted R score is treated as an improvement.']
          out=pathlib.Path('science-boundary/thomson-960/results/n961-constant-total-simplex-2026-10-31.txt')
          out.write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-simplex-sheet-crossing
          path: ${{ runner.temp }}/out
          retention-days: 10
      - name: Commit durable summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/thomson-960/results/n961-constant-total-simplex-2026-10-31.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'thomson: preserve constant-total occupancy simplex result'
          git pull --rebase origin main
          git push origin HEAD:main
