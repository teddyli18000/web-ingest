name: temp Thomson 960 dependent orbit4 reconstruction

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-dependent-orbit4-reconstruction.yml'

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        second_multiplier: ['1.002','1.01','1.04']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Cross dependent two-flip scar reconstruction
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) second_multiplier=${{ matrix.second_multiplier }} live=$live"
          python3 science-boundary/thomson-960/code/search_dependent_two_flip_homotopy.py \
            "$RUNNER_TEMP/seed/live.json" \
            --first-quad '108,282,511,599' \
            --second-quad '108,511,502,599' \
            --pattern balanced --first-multiplier 1.003 --second-multiplier '${{ matrix.second_multiplier }}' \
            --schedule '100000,30000,10000,6000,4000,3000,2200,1600,1200,900,700,500,300,200,100,30,10,3,1,0.3,0.1,0.03,0.01,0.003,0.001,0' \
            --fixed-maxiter 2400 --stage-maxiter 1800 --final-maxiter 4000 \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('QUADS',d['first_quad'],d['second_quad'])
          print('THRESHOLDS',d['first_threshold'],d['second_threshold'],'MULTS',d['first_multiplier'],d['second_multiplier'])
          print('FIXED',d['fixed_energy'],d['fixed_first_flipped'],d['fixed_second_flipped'],d['fixed_coord'])
          print('LAST_BOTH',None if d['last_both_flipped_state'] is None else {k:v for k,v in d['last_both_flipped_state'].items() if k!='points'})
          print('FIRST_LOST',d['first_lost_state'])
          print('FINAL',{k:v for k,v in d['final'].items() if k!='points'})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-dependent-orbit4-${{ matrix.second_multiplier }}
          path: ${{ runner.temp }}/out
          retention-days: 10
