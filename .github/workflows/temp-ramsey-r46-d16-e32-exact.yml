name: Temp Ramsey R46 exact lucky d16 e32 pilot

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/degree16_lucky_static_sat.py
      - .github/workflows/temp-ramsey-r46-d16-e32-exact.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-d16-e32-exact
  cancel-in-progress: false

jobs:
  solve:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        ordinal: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate complete R(3,6,16) catalogue and self-test encoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r36_16.g6.gz \
            -o /tmp/r46/r36_16.g6.gz
          echo '5fd4e68d880e1d4ed05337b97cba0ce15387e1f545744aed80b91bb4b2186f25  /tmp/r46/r36_16.g6.gz' | sha256sum -c -
          gzip -dc /tmp/r46/r36_16.g6.gz > /tmp/r46/r36_16.g6
          test "$(wc -l < /tmp/r46/r36_16.g6)" -eq 2576
          python3 science-boundary/ramsey-r46/degree16_lucky_static_sat.py --self-test
      - name: Build pinned Kissat 4.0.4
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/arminbiere/kissat.git "$RUNNER_TEMP/kissat"
          git -C "$RUNNER_TEMP/kissat" checkout --quiet 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cd "$RUNNER_TEMP/kissat"
          ./configure >/dev/null
          make -j2 >/dev/null
          test "$(build/kissat --version)" = '4.0.4'
      - name: Generate exact eA=32 lucky branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/out
          python3 science-boundary/ramsey-r46/degree16_lucky_static_sat.py \
            --catalog /tmp/r46/r36_16.g6 --edge-count 32 \
            --ordinal '${{ matrix.ordinal }}' --output /tmp/r46/branch.cnf \
            | tee /tmp/r46/out/generate.json
          python3 - /tmp/r46/out/generate.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['a_edges']==32 and d['b_edge_min']==57 and d['b_edge_max']==64, d
          assert d['edge_stratum_count']==5, d
          PY
          head -n 1 /tmp/r46/branch.cnf
          du -h /tmp/r46/branch.cnf
      - name: Solve exact branch
        id: solve
        shell: bash
        run: |
          set -uo pipefail
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          /usr/bin/time -v timeout --signal=TERM --kill-after=30s 3600 \
            "$RUNNER_TEMP/kissat/build/kissat" /tmp/r46/branch.cnf \
            > /tmp/r46/out/solver.log 2>&1
          rc=$?
          set -e
          finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          case "$rc" in
            10) status=SAT ;;
            20) status=UNSAT ;;
            124|137|143) status=TIMEOUT ;;
            *) status=ERROR ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 - /tmp/r46/out/generate.json /tmp/r46/out/summary.json "$status" "$rc" "$started" "$finished" <<'PY'
          import json,os,sys
          gen,out,status,rc,started,finished=sys.argv[1:]
          d=json.load(open(gen))
          d.update(status=status,solver_exit=int(rc),started=started,finished=finished,
                   kissat_commit='8af8e56f174b778aef3aa45af9f739b2a5f492c2',
                   github_run_id=os.environ['GITHUB_RUN_ID'])
          open(out,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          cat /tmp/r46/out/summary.json
          tail -n 30 /tmp/r46/out/solver.log || true
          [[ "$status" != ERROR ]]
      - name: Decode and verify SAT model locally
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/ramsey-r46/sat_r46.py decode /tmp/r46/out/solver.log /tmp/r46/out/candidate.json
          python3 science-boundary/ramsey-r46/sat_r46.py verify /tmp/r46/out/candidate.json
      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate
          cp /tmp/r46/out/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/out/few-shots-verify.json
          python3 - /tmp/r46/out/few-shots-verify.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('valid') is True and str(d.get('score')) == '36', d
          PY
      - name: Upload exact branch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-d16-e32-${{ matrix.ordinal }}
          path: /tmp/r46/out
          if-no-files-found: warn
          retention-days: 7

  collect:
    if: always()
    needs: solve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-d16-e32-*
          path: /tmp/parts
      - name: Aggregate exact pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 - /tmp/parts /tmp/r46/result.json <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          rows=[]; verified=[]
          for p in sorted(root.rglob('summary.json')):
              rows.append(json.load(open(p)))
              v=p.parent/'few-shots-verify.json'
              if v.exists(): verified.append(json.load(open(v)))
          rows.sort(key=lambda d:d['stratum_ordinal'])
          result={
              'campaign':'lucky-d16-e32-exact-pilot',
              'logical_scope':'all five e(A)=32 types in the lucky degree-16 branch',
              'a_edge_stratum':32,
              'a_type_count':5,
              'b_edge_window':[57,64],
              'rows':rows,
              'statuses':{str(d['stratum_ordinal']):d['status'] for d in rows},
              'complete':len(rows)==5 and [d['stratum_ordinal'] for d in rows]==list(range(5)),
              'all_unsat':len(rows)==5 and all(d['status']=='UNSAT' for d in rows),
              'sat_count':sum(d['status']=='SAT' for d in rows),
              'timeout_count':sum(d['status']=='TIMEOUT' for d in rows),
              'verified_sat_count':sum(v.get('valid') is True and str(v.get('score'))=='36' for v in verified),
          }
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='rows'},sort_keys=True))
          PY
      - name: Persist exact pilot and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/d16-e32-exact-pilot.json
          for cand in /tmp/parts/*/candidate.json; do
            [[ -f "$cand" ]] || continue
            ord=$(basename "$(dirname "$cand")" | sed 's/ramsey-r46-d16-e32-//')
            cp "$cand" "science-boundary/ramsey-r46/results/d16-e32-hit-${ord}.json"
            ver="$(dirname "$cand")/few-shots-verify.json"
            [[ ! -f "$ver" ]] || cp "$ver" "science-boundary/ramsey-r46/results/d16-e32-hit-${ord}-verify.json"
          done
          git rm .github/workflows/temp-ramsey-r46-d16-e32-exact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/d16-e32-*
          git commit -m 'ramsey-r46: record lucky d16 e32 exact pilot'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
