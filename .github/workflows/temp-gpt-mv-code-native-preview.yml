name: Temp GPT MV integrated code-native preview

on:
  push:
    paths:
      - "temp-work/gpt-mv-code-native/**"
      - ".github/workflows/temp-gpt-mv-code-native-preview.yml"
  workflow_dispatch:

concurrency:
  group: temp-gpt-mv-code-native-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: temp-work/gpt-mv-code-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          npm install --no-audit --no-fund
          echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
          ffmpeg -version | head -1
      - name: Render integrated 0-30s preview
        run: |
          node export/render.mjs \
            --width 960 --height 540 --fps 15 \
            --start 0 --end 30 \
            --out out/gpt_code_native_preview_30s.mp4
      - name: Validate integrated preview
        run: |
          set -euo pipefail
          out=out/gpt_code_native_preview_30s.mp4
          ffmpeg -v error -i "$out" -f null -
          meta="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=nw=1 "$out")"
          printf '%s\n' "$meta"
          grep -q '^width=960$' <<<"$meta"
          grep -q '^height=540$' <<<"$meta"
          grep -q '^r_frame_rate=15/1$' <<<"$meta"
          python - <<'PY'
          import json, subprocess
          p='out/gpt_code_native_preview_30s.mp4'
          d=float(json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',p]))['format']['duration'])
          assert 29.9 <= d <= 30.1, d
          print('duration_ok',d)
          PY
          ffmpeg -hide_banner -i "$out" -vf "blackdetect=d=0.30:pix_th=0.015" -an -f null - 2>black.log || true
          ! grep -q 'black_duration' black.log
          ffmpeg -hide_banner -i "$out" -vf "freezedetect=n=0.0005:d=1.6" -an -f null - 2>freeze.log || true
          ! grep -q 'freeze_duration' freeze.log
      - name: Upload integrated preview
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mv-code-native-preview-${{ github.run_id }}
          path: |
            temp-work/gpt-mv-code-native/out/gpt_code_native_preview_30s.mp4
            temp-work/gpt-mv-code-native/out/gpt_code_native_preview_30s.contact.jpg
          retention-days: 14
          if-no-files-found: error
