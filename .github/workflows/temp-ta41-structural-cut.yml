name: temp-ta41-structural-cut
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/structural_cut.py'
      - '.github/workflows/temp-ta41-structural-cut.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-structural-cut
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Derive exact incumbent critical path cuts
        run: |
          python3 science-boundary/job-shop-ta41/structural_cut.py --out science-boundary/job-shop-ta41/results/critical-cut.json
      - name: Preserve validated structural evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/critical-cut.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): measure critical path obstruction cuts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
