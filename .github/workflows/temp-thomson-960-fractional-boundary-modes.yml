name: temp Thomson 960 fractional boundary transverse modes

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-fractional-boundary-modes.yml'

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lambda: '0.15'
            tag: '0150'
          - lambda: '0.125'
            tag: '0125'
          - lambda: '0.10'
            tag: '0100'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Static check
        run: python3 -m py_compile science-boundary/thomson-960/code/search_n961_fractional_boundary_modes.py
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Search transverse exits
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "lambda=${{ matrix.lambda }} live=$live nproc=$(nproc)"
          python3 science-boundary/thomson-960/code/search_n961_fractional_boundary_modes.py \
            "$RUNNER_TEMP/seed/A-natural.json" \
            --lambda-value '${{ matrix.lambda }}' \
            --live-score "$live" \
            --modes '0,1,2,3' \
            --amps '.0015,.003,.006,.012,.02' \
            --k 8 \
            --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/out/result.json" ]; then exit 0; fi
          python3 - <<'PY'
          import json, os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('LAMBDA',d['lambda'])
          print('BASELINE',d['baseline'])
          print('EIGENVALUES',d['eigenvalues'])
          print('BEST',d['best_energy'],d['best_delta_live'])
          for r in d['rows'][:12]:
              print('TOP',r['mode'],r['sign'],r['amp'],r['class'],r['energy'],r['delta_live'],r['coord_counts'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-fractional-boundary-modes-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 10
