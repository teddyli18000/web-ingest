name: Baidu Drive Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Optional web-ingest task ID; blank uses the active task
        required: false
        type: string
      reason:
        description: Dispatch reason for operator/audit context
        required: false
        default: manual
        type: string
  workflow_run:
    workflows: [Baidu Drive File Worker]
    types: [completed]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: baidu-drive-live-state
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      BAIDU_DRIVE_TASK_ID: ${{ inputs.task_id || '' }}
      BAIDU_DRIVE_REASON: ${{ github.event_name == 'workflow_run' && 'file-worker-completed' || inputs.reason || 'manual' }}
      BAIDU_DRIVE_BAIDU_SESSION: ${{ secrets.BAIDU_DRIVE_BAIDU_SESSION }}
      BAIDU_DRIVE_STATE_KEY: ${{ secrets.BAIDU_DRIVE_STATE_KEY }}
    steps:
      - name: Checkout Baidu Drive task
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            baidu-drive

      - name: Checkout pinned Baidu mover core
        uses: actions/checkout@v4
        with:
          repository: teddyli18000/baidu-drive-mover
          ref: a9e76feb18fe9ca1ac680d0ea555aac684d622de
          path: .prepare-core
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .prepare-core/go.mod
          cache-dependency-path: .prepare-core/go.sum

      - name: Build relay preparation executable
        run: |
          mkdir -p .prepare-core/cmd/baidu-drive-prepare
          cp baidu-drive/mover/prepare-main.go .prepare-core/cmd/baidu-drive-prepare/main.go
          cp baidu-drive/mover/action_relay.go .prepare-core/cmd/baidu-drive-prepare/action_relay.go
          cp baidu-drive/mover/action_recovery.go .prepare-core/internal/state/action_recovery.go
          cd .prepare-core
          go build -o "$RUNNER_TEMP/baidu-drive-prepare" ./cmd/baidu-drive-prepare
          echo "BAIDU_DRIVE_PREPARE_BIN=$RUNNER_TEMP/baidu-drive-prepare" >> "$GITHUB_ENV"

      - name: Install pinned OAuth encryption dependency
        run: python3 -m pip install "cryptography==46.0.4"

      - name: Provision ephemeral Baidu and Google credentials
        env:
          BAIDU_DRIVE_BAIDU_SESSION: ${{ secrets.BAIDU_DRIVE_BAIDU_SESSION }}
          BAIDU_DRIVE_RCLONE_CONFIG: ${{ secrets.BAIDU_DRIVE_RCLONE_CONFIG }}
          BAIDU_DRIVE_STATE_KEY: ${{ secrets.BAIDU_DRIVE_STATE_KEY }}
        run: python3 baidu-drive/auth_provision.py prepare

      - name: Prepare, reconcile and schedule relay work
        run: >-
          python3 baidu-drive/prepare_worker.py
          --task-id "$BAIDU_DRIVE_TASK_ID"
          --reason "$BAIDU_DRIVE_REASON"

      - name: Notify only on login-state changes
        if: always()
        run: python3 baidu-drive/auth_notice.py
