name: Temp Ramsey R46 218-edge structural reduction

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/m218_structure.py
      - .github/workflows/temp-ramsey-r46-m218-structure.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-m218-structure
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recompute exact 218-edge degree reduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 science-boundary/ramsey-r46/m218_structure.py --output /tmp/r46/result.json
          python3 - /tmp/r46/result.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['edges']==218
          assert d['aggregate_vector_count']==51
          assert d['killed_n11_le_5_count']==36
          assert d['killed_isolated_high_count']==2
          assert d['survivor_count']==13
          assert d['n11_eq_6']['induced_graph']=='K_{2,2,2}'
          assert d['n11_eq_6']['forced_local_A_edges']==26
          assert d['n11_eq_6']['forced_local_B_edges']==116
          print(json.dumps({'aggregate':51,'survivors':13,'n11_eq_6':4},sort_keys=True))
          PY
      - name: Persist evidence and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/m218-structure.json
          git rm .github/workflows/temp-ramsey-r46-m218-structure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/m218-structure.json
          git commit -m 'ramsey-r46: record exact 218-edge structural reduction'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-m218-structure
          path: /tmp/r46
          if-no-files-found: warn
          retention-days: 7
