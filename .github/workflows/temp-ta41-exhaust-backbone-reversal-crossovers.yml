name: temp-ta41-exhaust-backbone-reversal-crossovers
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/exact_reversal_crossover.cpp'
      - '.github/workflows/temp-ta41-exhaust-backbone-reversal-crossovers.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-exhaust-backbone-reversal-crossovers
  cancel-in-progress: false
jobs:
  crossover:
    strategy:
      fail-fast: false
      matrix:
        arc: [2,5,6,7,12,14,17]
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact original-job machine-permutation evaluator
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror science-boundary/job-shop-ta41/exact_reversal_crossover.cpp -o /tmp/ta41-reversal-cross
      - name: Freeze a different-core-orientation seed and each distant 2006 parent
        run: |
          set -euo pipefail
          for parent in critical8 mixed12 mixed16 mixed20; do
            python3 - '${{ matrix.arc }}' "$parent" <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'science-boundary/job-shop-ta41')
          from search import obtain,setup,evaluate
          arc=int(sys.argv[1]);parent=sys.argv[2]
          routes,durations,baseline=obtain();pos,dur=setup(routes,durations)
          assert evaluate(baseline,pos,dur)==2006
          root=Path('science-boundary/job-shop-ta41/results')
          source=json.loads((root/'consensus-five-parents/consensus-analysis.json').read_text())
          c=source['proven_unsat_core'][arc]
          left=json.loads((root/'reversal-warm-seeds'/('reversal-warm-%02d.json'%arc)).read_text())['machines']
          right=json.loads((root/('neutral-'+parent)/'neutral-certificate.json').read_text())['machines']
          verdict=json.loads((root/('neutral-'+parent)/'neutral-verdict.json').read_text())
          assert verdict['valid'] and verdict['score']=='2006'
          val=evaluate(left,pos,dur);assert val is not None and 2006<val<=2500
          assert evaluate(right,pos,dur)==2006
          m=c['machine']
          assert left[m].index(c['to_job'])<left[m].index(c['from_job'])
          assert right[m].index(c['from_job'])<right[m].index(c['to_job'])
          with Path('/tmp/ta41-reversal-input.txt').open('w') as f:
              print(30,20,file=f)
              for j in range(30):
                  print(' '.join('%d %d'%(mach,durations[j][k])
                        for k,mach in enumerate(routes[j])),file=f)
              for orders in (left,right):
                  for jobs in orders: print(' '.join(map(str,jobs)),file=f)
          (Path('/tmp/ta41-forced-machine.txt')).write_text(str(m))
          PY
            machine="$(cat /tmp/ta41-forced-machine.txt)"
            out="science-boundary/job-shop-ta41/results/reversal-cross-${{ matrix.arc }}-$parent"
            mkdir -p "$out"
            /tmp/ta41-reversal-cross /tmp/ta41-reversal-input.txt "$out" "reversed-core-${{ matrix.arc }}" "$parent" "$machine"
          done
      - name: Independently official-score each best crossover and any improvement
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
          mkdir -p /tmp/ta41-best-crossover
          for parent in critical8 mixed12 mixed16 mixed20; do
            out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/reversal-cross-${{ matrix.arc }}-$parent"
            cp "$out/best-machine-order-certificate.json" /tmp/ta41-best-crossover/certificate.json
            (cd /tmp/few-shots && python3 problems/p009-job-shop-ta41/verify/verify.py /tmp/ta41-best-crossover) | tee "$out/official-best-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          info=json.loads((p/'crossover-analysis.json').read_text())
          val=json.loads((p/'official-best-verdict.json').read_text())
          assert val['valid'] and int(val['score'])==info['best_makespan'],(info,val)
          assert info['candidate_crossover_masks_exhaustively_evaluated'] * 2 == info['all_possible_machine_choices']
          assert info['feasible_acyclic_permutations']+info['cyclic_permutations']==info['candidate_crossover_masks_exhaustively_evaluated']
          PY
            if test -f "$out/certificate.json"; then
              (cd /tmp/few-shots && python3 problems/p009-job-shop-ta41/verify/verify.py "$out") | tee "$out/upstream-verdict.json"
              python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          v=json.loads((Path(sys.argv[1])/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
            fi
          done
      - name: Persist all four verified exact finite families with ref-race retries
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for parent in critical8 mixed12 mixed16 mixed20; do
            dir="science-boundary/job-shop-ta41/results/reversal-cross-${{ matrix.arc }}-$parent"
            test -f "$dir/official-best-verdict.json"
            git add "$dir"
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): exact global recombination from backbone reversal seed ${{ matrix.arc }}'
          for attempt in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'Unable to persist completed crossover certificates' >&2
          exit 1
