name: temp C7p5 full three-layer block decision
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7p5-three-layer.yml
      - science-boundary/shannon-capacity-c7/code/c7p5_three_layer_decision.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temp-c7p5-three-layer
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: I0, axis: 0, start: 4}
          - {seed: I0, axis: 4, start: 5}
          - {seed: X, axis: 1, start: 2}
          - {seed: X, axis: 4, start: 4}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CP-SAT
        run: python -m pip install 'ortools>=9.11,<10' 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Pin public geometry
        run: |
          git init --quiet /tmp/c7-tandon
          git -C /tmp/c7-tandon fetch --quiet --depth 1 https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git c753408492dde92a239708986d16c15dbf6c3235
          git -C /tmp/c7-tandon checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-tandon rev-parse HEAD)" = c753408492dde92a239708986d16c15dbf6c3235
      - name: Exact CP-SAT decision
        run: |
          mkdir -p /tmp/c7-three
          python science-boundary/shannon-capacity-c7/code/c7p5_three_layer_decision.py \
            /tmp/c7-tandon/data/base_c7.json /tmp/c7-three/status.json \
            /tmp/c7-three/witness5.json /tmp/c7-three/certificate.json \
            --seed "${{ matrix.seed }}" --axis "${{ matrix.axis }}" --start "${{ matrix.start }}" \
            --seconds 75 --workers 4
      - name: Replay any 10D improvement
        run: |
          if test -s /tmp/c7-three/certificate.json; then
            git clone --quiet --depth 1 https://github.com/few-shots/few-shots.git /tmp/c7-fewshots
            mkdir -p /tmp/c7-three/shot
            cp /tmp/c7-three/certificate.json /tmp/c7-three/shot/certificate.json
            python /tmp/c7-fewshots/problems/p004-shannon-capacity-c7/verify/verify.py /tmp/c7-three/shot
          else
            echo 'No new candidate to replay with upstream verifier.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7-three-${{ matrix.seed }}-k${{ matrix.axis }}-s${{ matrix.start }}
          path: /tmp/c7-three/
          retention-days: 14
