name: temp Thomson 960 C3 triple glide orbit3

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-c3-triple-glide-orbit3.yml'

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Cross coordinated C3 orbit3 glide
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) live=$live"
          python3 science-boundary/thomson-960/code/search_symmetry_orbit_flips.py \
            "$RUNNER_TEMP/seed/live.json" \
            --quads '21,230,363,74;341,550,683,394;661,870,43,714' \
            --patterns balanced,newdiag,olddiag \
            --multipliers 1.002,1.006,1.015,1.04,1.10,1.22,1.40 \
            --fixed-maxiter 2000 --release-maxiter 3800 \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('QUADS',d['quads'])
          print('THRESHOLDS',d['thresholds'])
          print('BEST',d['best_release_energy'],'DELTA',d['best_delta_live'])
          for b in d['lowest_distinct_release_basins'][:16]:
              print('BASIN',b['energy'],b['delta_live'],b['coord_counts'],'pat',b['pattern'],'m',b['multiplier'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-c3-triple-orbit3
          path: ${{ runner.temp }}/out
          retention-days: 10
