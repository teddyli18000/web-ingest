name: Repository integrity

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "AGENTS.md"
      - "tools/**"
      - ".github/workflows/**"
      - "*/README.md"
      - "*/AGENTS.md"
      - "ai-daily/*.py"
      - "ai-daily/tests/**"
      - "github-trending/*.py"
      - "github-trending/tests/**"
      - "google-trending/*.py"
      - "google-trending/tests/**"
      - "git-mirror/**"
      - "baidu-drive/*.py"
      - "baidu-drive/*.md"
      - "baidu-drive/tests/**"
      - "baidu-drive/mover/**"
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "tools/**"
      - ".github/workflows/**"
      - "*/README.md"
      - "*/AGENTS.md"
      - "ai-daily/*.py"
      - "ai-daily/tests/**"
      - "github-trending/*.py"
      - "github-trending/tests/**"
      - "google-trending/*.py"
      - "google-trending/tests/**"
      - "git-mirror/**"
      - "baidu-drive/*.py"
      - "baidu-drive/*.md"
      - "baidu-drive/tests/**"
      - "baidu-drive/mover/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate repository and Action schedule
        run: python3 tools/check-repository-integrity.py --show
      - name: Validate repository management tools
        run: find tools -maxdepth 2 -type f -name '*.py' -print0 | xargs -0 -r python3 -m py_compile
      - name: Validate AI Daily maintenance code
        run: |
          python3 -m py_compile ai-daily/*.py
          python3 -m unittest discover -s ai-daily/tests -v
      - name: Validate GitHub Trending maintenance code
        run: |
          python3 -m py_compile github-trending/*.py
          python3 -m unittest discover -s github-trending/tests -v
      - name: Validate Google Trending maintenance code
        run: |
          python3 -m py_compile google-trending/*.py
          python3 -m unittest discover -s google-trending/tests -v
      - name: Validate public Git mirror code
        run: |
          python3 -m py_compile git-mirror/*.py
          python3 -m unittest discover -s git-mirror/tests -v
          python3 git-mirror/validate_snapshots.py
      - name: Validate Baidu Drive control and worker code
        run: |
          python3 -m py_compile baidu-drive/*.py
          python3 -m unittest discover -s baidu-drive/tests -v
      - name: Checkout pinned Baidu Drive Mover core
        uses: actions/checkout@v4
        with:
          repository: teddyli18000/baidu-drive-mover
          ref: f4ca661d367aa2a067344efa989f0bfc95b64618
          path: .ci/baidu-drive-mover
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go for mover bridge
        uses: actions/setup-go@v5
        with:
          go-version-file: .ci/baidu-drive-mover/go.mod
          cache-dependency-path: .ci/baidu-drive-mover/go.sum
      - name: Compile Actions mover bridge against pinned core
        run: |
          mkdir -p .ci/baidu-drive-mover/cmd/baidu-drive-action
          cp baidu-drive/mover/action-main.go .ci/baidu-drive-mover/cmd/baidu-drive-action/main.go
          cp baidu-drive/mover/action_recovery.go .ci/baidu-drive-mover/internal/state/action_recovery.go
          cd .ci/baidu-drive-mover
          go test ./internal/state ./internal/app ./internal/download ./internal/drive ./internal/drive/rclone
          go build ./cmd/baidu-drive-action
