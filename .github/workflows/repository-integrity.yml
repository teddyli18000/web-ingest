name: Repository integrity

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "AGENTS.md"
      - "tools/**"
      - ".github/workflows/**"
      - "*/README.md"
      - "github-trending/*.py"
      - "github-trending/tests/**"
      - "google-trending/*.py"
      - "google-trending/tests/**"
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "tools/**"
      - ".github/workflows/**"
      - "*/README.md"
      - "github-trending/*.py"
      - "github-trending/tests/**"
      - "google-trending/*.py"
      - "google-trending/tests/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate repository and Action schedule
        run: python3 tools/check-repository-integrity.py --show
      - name: Validate GitHub Trending maintenance code
        run: |
          python3 -m py_compile github-trending/*.py
          python3 -m unittest discover -s github-trending/tests -v
      - name: Validate Google Trending maintenance code
        run: |
          python3 -m py_compile google-trending/*.py
          python3 -m unittest discover -s google-trending/tests -v
