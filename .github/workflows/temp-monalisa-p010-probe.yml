name: temp-monalisa-p010-probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/mona-lisa-tsp/**'
      - '.github/workflows/temp-monalisa-p010-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          python -m pip install numpy scipy
      - name: Exact baseline verification
        run: python upstream/problems/p010-mona-lisa-tsp/verify/verify.py upstream/problems/p010-mona-lisa-tsp/baseline
      - name: Nearest-neighbor 2-opt probe
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          mkdir -p science-boundary/mona-lisa-tsp/results
          python science-boundary/mona-lisa-tsp/nn_two_opt.py \
            --input upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --output science-boundary/mona-lisa-tsp/results/certificate.json \
            --report science-boundary/mona-lisa-tsp/results/report.json \
            --k 160 --max-passes 4
          python upstream/problems/p010-mona-lisa-tsp/verify/verify.py science-boundary/mona-lisa-tsp/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monalisa-p010-neighbor-probe
          path: science-boundary/mona-lisa-tsp/results/
          if-no-files-found: ignore
