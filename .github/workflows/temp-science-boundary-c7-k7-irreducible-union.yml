name: Temp Science Boundary C7 k7 irreducible union plateau

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-k7-irreducible-union.yml
      - science-boundary/shannon-capacity-c7/code/bpz_global_irreducible_gap_union_plateau.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-science-boundary-c7-k7-irreducible-union
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned source, completed k7 census, and dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/census" "$RUNNER_TEMP/result" "$RUNNER_TEMP/base" "$RUNNER_TEMP/shot"
          gh run download 40994390874 -R teddyli18000/web-ingest -n c7-k7-cover-gap-census -D "$RUNNER_TEMP/census"
          test -f "$RUNNER_TEMP/census/k7.json"
      - name: Exact k7 irreducibility audit
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_gap_irreducibility_audit.py \
            "$RUNNER_TEMP/census/k7.json" "$RUNNER_TEMP/result/audit.json" \
            > "$RUNNER_TEMP/result/audit.stdout" 2> "$RUNNER_TEMP/result/audit.stderr"
          cat "$RUNNER_TEMP/result/audit.stdout"
          python3 - "$RUNNER_TEMP/result/audit.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]));
          if r['k']!=7 or r['input_gap_cases']!=611 or r['irreducible_positive_count']!=12: raise SystemExit(r)
          PY
      - name: Exact global k7 irreducible-union prize and far plateau
        id: plateau
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_global_irreducible_gap_union_plateau.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/audit.json" "$RUNNER_TEMP/result/plateau.json" "$RUNNER_TEMP/base/certificate.json" \
            --workers "$(nproc)" > "$RUNNER_TEMP/result/plateau.stdout" 2> "$RUNNER_TEMP/result/plateau.stderr"
          cat "$RUNNER_TEMP/result/plateau.stdout"
          tail -n 160 "$RUNNER_TEMP/result/plateau.stderr"
          python3 - "$RUNNER_TEMP/result/plateau.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys;r=json.load(open(sys.argv[1]));b=r['best']
          with open(sys.argv[2],'a') as f:
              f.write(f"score={r['candidate_score']}\n")
              f.write(f"gain={b['gain']}\n")
              f.write(f"selected={b['selected']}\n")
          PY
      - name: Verify k7 optimum upstream and convert IDs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/base" | tee "$RUNNER_TEMP/result/seed-verify.json"
          python3 - "$RUNNER_TEMP/result/seed-verify.json" '${{ steps.plateau.outputs.score }}' <<'PY'
          import json,sys;r=json.load(open(sys.argv[1]));want=int(sys.argv[2])
          if not r.get('valid') or int(r.get('score',-1))!=want: raise SystemExit((r,want))
          print('VERIFIED K7 UNION OPTIMUM',r)
          PY
          if [[ '${{ steps.plateau.outputs.score }}' == '134753' ]]; then
            python3 - "$RUNNER_TEMP/base/certificate.json" "$RUNNER_TEMP/base/ids.txt" <<'PY'
          import json,sys
          pts=json.load(open(sys.argv[1]))['points']
          if len(pts)!=134753 or len(set(pts))!=134753:raise SystemExit(('tie',len(pts),len(set(pts))))
          open(sys.argv[2],'w').write(''.join(f'{int(p,7)}\n' for p in pts))
          PY
          fi
      - name: Exact unrestricted net1 through radius4 on tie mother
        id: r4
        if: steps.plateau.outputs.score == '134753'
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/patch_search_net1_r4_compile.py science-boundary/shannon-capacity-c7/code/search_net1_r4_complete.cpp "$RUNNER_TEMP/r4.cpp"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp "$RUNNER_TEMP/r4.cpp" -o "$RUNNER_TEMP/r4"
          export OMP_NUM_THREADS="$(nproc)"
          /usr/bin/time -v "$RUNNER_TEMP/r4" "$RUNNER_TEMP/base/ids.txt" > "$RUNNER_TEMP/result/r4.json" 2> "$RUNNER_TEMP/result/r4.stderr"
          cat "$RUNNER_TEMP/result/r4.json"
          python3 - "$RUNNER_TEMP/result/r4.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys;r=json.load(open(sys.argv[1]));open(sys.argv[2],'a').write(f"found={'true' if r.get('kind')!='none' else 'false'}\n")
          PY
      - name: Build exact radius5 solvers
        if: steps.plateau.outputs.score == '134753' && steps.r4.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/patch_r5_net2_to_net1.py direct science-boundary/shannon-capacity-c7/code/search_net2_r5_direct.cpp "$RUNNER_TEMP/r5d.cpp"
          python3 science-boundary/shannon-capacity-c7/code/patch_r5_net2_to_net1.py lower science-boundary/shannon-capacity-c7/code/search_net2_r5_lower.cpp "$RUNNER_TEMP/r5l.cpp"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp "$RUNNER_TEMP/r5d.cpp" -o "$RUNNER_TEMP/r5d"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp "$RUNNER_TEMP/r5l.cpp" -o "$RUNNER_TEMP/r5l"
      - name: Exact radius5 direct then lower-support
        id: r5
        if: steps.plateau.outputs.score == '134753' && steps.r4.outputs.found != 'true'
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          /usr/bin/time -v "$RUNNER_TEMP/r5d" "$RUNNER_TEMP/base/ids.txt" > "$RUNNER_TEMP/result/r5-direct.json" 2> "$RUNNER_TEMP/result/r5-direct.stderr"
          cat "$RUNNER_TEMP/result/r5-direct.json"
          found=$(python3 -c 'import json,sys;print("true" if json.load(open(sys.argv[1])).get("kind")!="none" else "false")' "$RUNNER_TEMP/result/r5-direct.json")
          if [[ "$found" != true ]]; then
            /usr/bin/time -v "$RUNNER_TEMP/r5l" "$RUNNER_TEMP/base/ids.txt" > "$RUNNER_TEMP/result/r5-lower.json" 2> "$RUNNER_TEMP/result/r5-lower.stderr"
            cat "$RUNNER_TEMP/result/r5-lower.json"
            found=$(python3 -c 'import json,sys;print("true" if json.load(open(sys.argv[1])).get("kind")!="none" else "false")' "$RUNNER_TEMP/result/r5-lower.json")
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - name: Materialize and verify local breakthrough
        if: steps.r4.outputs.found == 'true' || steps.r5.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/base/ids.txt" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot/certificate.json" <<'PY'
          import json,os,sys
          base=set(int(x) for x in open(sys.argv[1]) if x.strip());hit=None
          for fn in ('r4.json','r5-direct.json','r5-lower.json'):
              p=os.path.join(sys.argv[2],fn)
              if os.path.exists(p):
                  r=json.load(open(p))
                  if r.get('kind')!='none':hit=r;break
          if hit is None:raise SystemExit('no hit')
          rem=list(map(int,hit.get('remove',[])));add=list(map(int,hit.get('add',[])));cur=base-set(rem)
          if any(x not in base for x in rem) or any(x in cur for x in add):raise SystemExit(('exchange',hit))
          cur.update(add)
          if len(cur)!=134754:raise SystemExit(('score',len(cur)))
          def enc(z):
              d=[]
              for _ in range(10):d.append(str(z%7));z//=7
              return ''.join(reversed(d))
          json.dump({'points':[enc(z) for z in sorted(cur)]},open(sys.argv[3],'w'),separators=(',',':'));open(sys.argv[3],'a').write('\n')
          PY
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys;r=json.load(open(sys.argv[1]));
          if not r.get('valid') or int(r.get('score',-1))<134754:raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-k7-irreducible-union
          path: |
            ${{ runner.temp }}/result
            ${{ runner.temp }}/base/certificate.json
            ${{ runner.temp }}/shot/certificate.json
          if-no-files-found: warn
          retention-days: 14
