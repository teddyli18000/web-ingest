name: temp Thomson 960 e432-B transverse parallel

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-e432-b-transverse-parallel.yml'

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Rebuild e432-B index-1 saddle
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 science-boundary/thomson-960/code/string_between_seeds.py \
            "$RUNNER_TEMP/seed/e432.json" "$RUNNER_TEMP/seed/B-natural.json" \
            --images 13 --iterations 1200 --eta 0.00020 --max-step 0.00045 \
            --perp-tol 0.00004 --climb-iterations 180 \
            --out "$RUNNER_TEMP/out/string.json"
          python3 science-boundary/thomson-960/code/refine_saddle_eigenfollow.py \
            "$RUNNER_TEMP/out/string.json" --cycles 10 --steps-per-cycle 70 \
            --eta 0.00022 --max-rms-step 0.000008 --final-k 10 \
            --out "$RUNNER_TEMP/out/refined.json"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','refined.json')))
          print('REFINED',d['final_energy'],'grad',d['final_gradient_rms'],'neg',d['negative_internal_modes_below_-1e-3'])
          print('MODES',[(r['index'],r['eigenvalue']) for r in d['final_modes'][:10]])
          if d['negative_internal_modes_below_-1e-3']!=1:
              raise SystemExit('not clean index-1')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e432-B-refined-saddle
          path: ${{ runner.temp }}/out/refined.json
          retention-days: 10

  transverse:
    needs: harvest
    strategy:
      fail-fast: false
      matrix:
        mode: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-B-refined-saddle
          path: ${{ runner.temp }}/saddle
      - run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Scan both signs of one transverse mode
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for s in -1 1; do
            python3 science-boundary/thomson-960/code/search_saddle_transverse.py \
              "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/saddle/refined.json" \
              --transverse-mode '${{ matrix.mode }}' --sign "$s" \
              --transverse-amps 0.0008,0.0015,0.0025,0.0040,0.0065,0.010,0.015 \
              --reaction-amps=-0.0012,0,0.0012 \
              --out "$RUNNER_TEMP/out/m${{ matrix.mode }}-s${s}.json"
          done
      - name: Summarize
        run: |
          python3 - <<'PY'
          import glob,json,os
          best=(1e300,None)
          for p in glob.glob(os.path.join(os.environ['RUNNER_TEMP'],'out','*.json')):
              d=json.load(open(p)); print(os.path.basename(p),'BEST',d['best_float_energy'],'DELTA',d['best_delta_vs_live'])
              if d['best_float_energy']<best[0]: best=(d['best_float_energy'],p)
          print('MODE_BEST',best)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e432-B-transverse-m${{ matrix.mode }}
          path: ${{ runner.temp }}/out
          retention-days: 10
