name: temp C7p5 shifted layer stitching DP
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7p5-slice-stitch.yml
      - science-boundary/shannon-capacity-c7/code/c7p5_slice_stitch_dp.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temp-c7p5-slice-stitch
  cancel-in-progress: false
jobs:
  stitch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        axis: [0, 1, 2, 3, 4]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original module runtime
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Pin public 367-word sources
        run: |
          git init --quiet /tmp/c7-tandon
          git -C /tmp/c7-tandon fetch --quiet --depth 1 https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git c753408492dde92a239708986d16c15dbf6c3235
          git -C /tmp/c7-tandon checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-tandon rev-parse HEAD)" = c753408492dde92a239708986d16c15dbf6c3235
          git init --quiet /tmp/c7-five
          git -C /tmp/c7-five fetch --quiet --depth 1 https://github.com/molind/c7-five.git ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
          git -C /tmp/c7-five checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-five rev-parse HEAD)" = ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
      - name: Exact cyclic template DP
        run: |
          mkdir -p /tmp/c7-stitch
          python science-boundary/shannon-capacity-c7/code/c7p5_slice_stitch_dp.py \
            /tmp/c7-tandon/data/base_c7.json /tmp/c7-five/data/family-f.json \
            /tmp/c7-stitch/result.json /tmp/c7-stitch/certificate.json --axis "${{ matrix.axis }}"
      - name: Replay p004 candidate if any
        run: |
          if test -s /tmp/c7-stitch/certificate.json; then
            git clone --quiet --depth 1 https://github.com/few-shots/few-shots.git /tmp/c7-fewshots
            mkdir -p /tmp/c7-stitch/shot
            cp /tmp/c7-stitch/certificate.json /tmp/c7-stitch/shot/certificate.json
            python /tmp/c7-fewshots/problems/p004-shannon-capacity-c7/verify/verify.py /tmp/c7-stitch/shot
          else
            echo 'No new 10D certificate to replay.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7p5-stitch-axis-${{ matrix.axis }}
          path: /tmp/c7-stitch/
          retention-days: 14
