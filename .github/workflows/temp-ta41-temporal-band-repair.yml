name: temp-ta41-temporal-band-repair
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/temporal_band_repair.py'
      - '.github/workflows/temp-ta41-temporal-band-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-temporal-band-repair
  cancel-in-progress: false
jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        parent: [baseline,critical8,mixed20]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin solver and check syntax
        run: |
          python3 -m py_compile science-boundary/job-shop-ta41/temporal_band_repair.py
          python3 -m pip install 'ortools==9.14.6206'
      - name: Exact synchronous time-band reordering across all 20 machines
        run: |
          python3 science-boundary/job-shop-ta41/temporal_band_repair.py --parent '${{ matrix.parent }}' --total-seconds 320 --case-seconds 18 --out 'science-boundary/job-shop-ta41/results/timeband-${{ matrix.parent }}'
      - name: Official independent judge on any improvement
        if: always()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/timeband-${{ matrix.parent }}"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Preserve precise CP and DAG exclusions with retrying main pushes
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/timeband-${{ matrix.parent }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): test temporal-band repair from ${{ matrix.parent }}'
          for attempt in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
