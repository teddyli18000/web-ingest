name: temp-ta41-core-cover-decision
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/core_cover_decision.py'
      - '.github/workflows/temp-ta41-core-cover-decision.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-core-cover-decision
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP-SAT
        run: python -m pip install 'ortools==9.14.6206'
      - name: Independently test integer core-cover feasibility thresholds
        run: python3 science-boundary/job-shop-ta41/core_cover_decision.py --seconds 120
      - name: Save exact decision-model conclusions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/core-cover-decision.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): direct SAT checks of core hitting-set thresholds'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
