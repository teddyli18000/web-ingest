name: Baidu Drive checkpoint diagnosis (one shot)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/baidu-drive-diagnose-checkpoint-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            baidu-drive/state/checkpoints
      - name: Inspect saved mover task error only
        run: |
          python3 - <<'PY'
          import base64, pathlib, re, sqlite3, tempfile, zlib
          path = pathlib.Path("baidu-drive/state/checkpoints/bd-20261114T085503Z-7eb87d.sqlite.zlib.b64")
          raw = zlib.decompress(base64.b64decode(path.read_text().strip()))
          with tempfile.NamedTemporaryFile() as tmp:
              pathlib.Path(tmp.name).write_bytes(raw)
              db = sqlite3.connect(tmp.name)
              db.row_factory = sqlite3.Row
              tables = [row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'") if not row[0].startswith("sqlite_")]
              print("Tables:", ", ".join(tables))
              for table in ("tasks", "directories", "files", "batches"):
                  if table not in tables:
                      continue
                  cols = [row[1] for row in db.execute(f'PRAGMA table_info("{table}")')]
                  public_cols = [c for c in ("status", "scan_completed", "phase", "task_status", "state") if c in cols]
                  count = db.execute(f'SELECT count(*) FROM "{table}"').fetchone()[0]
                  print(table, "count", count, "state fields", public_cols)
                  if public_cols:
                      selected = ", ".join('"' + col + '"' for col in public_cols)
                      for row in db.execute(f'SELECT {selected} FROM "{table}" LIMIT 5'):
                          print(table, "state", tuple(row))
              for table in tables:
                  cols = [row[1] for row in db.execute(f'PRAGMA table_info("{table}")')]
                  error_cols = [c for c in cols if "error" in c.lower()]
                  if not error_cols:
                      continue
                  print("Error fields in", table, ":", ", ".join(error_cols))
                  for row in db.execute(f'SELECT * FROM "{table}" LIMIT 20'):
                      for col in error_cols:
                          value = str(row[col] or "").strip()
                          if not value:
                              continue
                          value = re.sub(r'https?://\S+', '[redacted URL]', value)
                          value = re.sub(r'(?i)(BDUSS|STOKEN|refresh_token|access_token|client_secret)\s*[:=]\s*[^\s,;]+', r'\1=[redacted]', value)
                          print(f"{table}.{col}: {value[:600]}")
              db.close()
          PY
