name: temp-ta41-verified-4-arc-joint-witness
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-verified-4-arc-joint-witness.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-verified-4-arc-joint-witness
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install exact solver and check independent verifier syntax
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/audit_verified_joint_four_arc_witness.py
      - name: Enumerate every target-directed adjacent-swap sequence and all 16 conditional CP arc subsets
        run: |
          python3 science-boundary/job-shop-ta41/audit_verified_joint_four_arc_witness.py \
            --case-seconds 4 \
            --out science-boundary/job-shop-ta41/results/ta43-joint-4-arc-microstructure.json
      - name: Persist independently auditable complete finite coordination experiment
        if: always()
        run: |
          set -euo pipefail
          file='science-boundary/job-shop-ta41/results/ta43-joint-4-arc-microstructure.json'
          if ! test -f "$file"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): exact four-arc joint-repair positive witness and 9-Kendall minimax barrier'
          for attempt in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
