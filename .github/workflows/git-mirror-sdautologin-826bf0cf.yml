name: Git mirror - sdautologin-826bf0cf

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/git-mirror-sdautologin-826bf0cf.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_URL: "https://git.zqlhub.com/zqlan/SDAutoLogin"
  SOURCE_BRANCH: ""
  MIRROR_DESTINATION: ""
  WORKFLOW_PATH: ".github/workflows/git-mirror-sdautologin-826bf0cf.yml"

concurrency:
  group: git-mirror-sdautologin-826bf0cf
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate git-mirror task
        run: |
          python3 -m py_compile git-mirror/*.py
          python3 -m unittest discover -s git-mirror/tests -v
          python3 git-mirror/validate_snapshots.py

      - name: Import public Git snapshot
        shell: bash
        run: |
          set -euo pipefail
          args=(--source-url "$SOURCE_URL")
          if [ -n "$SOURCE_BRANCH" ]; then
            args+=(--branch "$SOURCE_BRANCH")
          fi
          if [ -n "$MIRROR_DESTINATION" ]; then
            args+=(--destination "$MIRROR_DESTINATION")
          fi
          python3 git-mirror/import_snapshot.py "${args[@]}"

      - name: Mirror latest release when available
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--source-url "$SOURCE_URL")
          if [ -n "$MIRROR_DESTINATION" ]; then
            args+=(--destination "$MIRROR_DESTINATION")
          fi
          python3 git-mirror/collect_latest_release.py "${args[@]}"

      - name: Validate imported mirror
        run: python3 git-mirror/validate_snapshots.py

      - name: Commit mirror and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A mirrored repository may track files that match its own .gitignore.
          # Force-add the snapshot so the outer repository preserves the source tree exactly.
          git add -f git-mirror/data
          git rm -- "$WORKFLOW_PATH"

          git commit -m "data(git-mirror): import sdautologin-826bf0cf mirror"
          git pull --rebase origin main
          git push origin HEAD:main
