name: temp labs100 h18 K23 compressed

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-labs100-h18-k23-compressed.yml'
      - 'science-boundary/labs-100/code/oddperfect_h18_k_compressed.cpp'

concurrency:
  group: temp-labs100-h18-k23-compressed
  cancel-in-progress: false

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build generic exact compressed solver
        run: g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_h18_k_compressed.cpp -o "$RUNNER_TEMP/comp"
      - name: Regress frozen K21 counts
        shell: bash
        run: |
          set -euo pipefail
          OMP_NUM_THREADS="$(nproc)" "$RUNNER_TEMP/comp" 21 19 0 | tee "$RUNNER_TEMP/reg19.log"
          grep -F 'H18K_COMPRESSED K=21 budget=57 kp=19 kc=2 t=0 diff_orbits=30 support_orbits=66 ptests=767448 rankfull=765060 rankproj=2388 ranklo=0 Hmatches_halfC=2388 spectral=0' "$RUNNER_TEMP/reg19.log"
          OMP_NUM_THREADS="$(nproc)" "$RUNNER_TEMP/comp" 21 17 2 | tee "$RUNNER_TEMP/reg17.log"
          grep -F 'H18K_COMPRESSED K=21 budget=57 kp=17 kc=4 t=2 diff_orbits=2191 support_orbits=5784 ptests=13765920 rankfull=13717966 rankproj=3546 ranklo=44408 Hmatches_halfC=92091 spectral=121' "$RUNNER_TEMP/reg17.log"
      - name: Exhaust every K23 norm split and overlap using all CPUs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          cat > "$RUNNER_TEMP/cases.txt" <<'EOF'
          23 0
          21 0
          21 2
          19 0
          19 2
          19 4
          17 0
          17 2
          17 4
          17 6
          15 0
          15 2
          15 4
          15 6
          15 8
          13 0
          13 2
          13 4
          13 6
          13 8
          13 10
          11 0
          11 2
          11 4
          11 6
          11 8
          11 10
          9 0
          9 2
          9 4
          9 6
          9 8
          EOF
          export RUNNER_TEMP
          cat "$RUNNER_TEMP/cases.txt" | xargs -n2 -P"$(nproc)" bash -c '
            kp="$1"; t="$2"
            OMP_NUM_THREADS=1 "$RUNNER_TEMP/comp" 23 "$kp" "$t" > "$RUNNER_TEMP/logs/kp${kp}-t${t}.log" 2> "$RUNNER_TEMP/logs/kp${kp}-t${t}.err"
            test "$(grep -c "^H18K_COMPRESSED K=23 budget=63 kp=${kp} " "$RUNNER_TEMP/logs/kp${kp}-t${t}.log")" -eq 1
          ' _
          for kp in 23 21 19 17 15 13 11 9; do
            cat "$RUNNER_TEMP"/logs/kp${kp}-t*.log > "$RUNNER_TEMP/kp${kp}.all"
            grep '^HIT ' "$RUNNER_TEMP/kp${kp}.all" > "$RUNNER_TEMP/kp${kp}.hits" || true
            echo "KP${kp}_CASES $(grep -c '^H18K_COMPRESSED ' "$RUNNER_TEMP/kp${kp}.all") HITS $(grep -c '^HIT ' "$RUNNER_TEMP/kp${kp}.all" || true)"
            grep '^H18K_COMPRESSED ' "$RUNNER_TEMP/kp${kp}.all"
          done
      - name: Upload exact compressed transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-h18-k23-compressed
          path: |
            ${{ runner.temp }}/logs/
            ${{ runner.temp }}/kp*.all
            ${{ runner.temp }}/kp*.hits
            ${{ runner.temp }}/reg*.log
          if-no-files-found: warn
