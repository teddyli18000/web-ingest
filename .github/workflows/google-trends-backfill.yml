name: Google Trends - historical backfill

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-trends-backfill.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: google-trends-historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate task code
        run: |
          python -m py_compile google-trends/*.py
          python -m unittest discover -s google-trends/tests -v

      - name: Download public GoogleTrendArchive raw daily export
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/googletrendarchive-daily.zip"
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 20 \
            --output "$archive" \
            "https://huggingface.co/datasets/aurman/GoogleTrendArchive/resolve/main/daily_compressed.zip?download=true"
          echo "GOOGLE_TRENDS_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "GOOGLE_TRENDS_ARCHIVE_SHA256=$(sha256sum "$archive" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Import selected historical regions
        run: |
          python google-trends/backfill.py \
            --zip "$GOOGLE_TRENDS_ARCHIVE" \
            --zip-sha256 "$GOOGLE_TRENDS_ARCHIVE_SHA256"

      - name: Capture current direct snapshot
        run: python google-trends/capture.py

      - name: Refresh task README
        run: python google-trends/render_readme.py

      - name: Commit recovered history in yearly batches and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for year_dir in google-trends/data/[0-9][0-9][0-9][0-9]; do
            [ -d "$year_dir" ] || continue
            git add "$year_dir"
            if ! git diff --cached --quiet; then
              year="${year_dir##*/}"
              git commit -m "data(google-trends): recover historical snapshots $year"
            fi
          done

          rm .github/workflows/google-trends-backfill.yml
          git add google-trends/backfill-manifest.json google-trends/README.md .github/workflows/google-trends-backfill.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(google-trends): finalize historical backfill"
          fi

          git pull --rebase origin main
          git push origin HEAD:main
