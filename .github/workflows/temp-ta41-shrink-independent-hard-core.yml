name: temp-ta41-shrink-independent-hard-core
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/shrink_consensus_core.py'
      - '.github/workflows/temp-ta41-shrink-independent-hard-core.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-shrink-independent-hard-core
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact solver version
        run: python -m pip install 'ortools==9.14.6206'
      - name: Rebuild independent hard NoOverlap constraints and shrink 21-core proof
        run: |
          python3 -m py_compile science-boundary/job-shop-ta41/shrink_consensus_core.py
          python3 science-boundary/job-shop-ta41/shrink_consensus_core.py --restarts 6 --per-deletion-seconds 3 --total-seconds 260
      - name: Record every independently checked deletion and final hard proof
        if: always()
        run: |
          set -euo pipefail
          p="science-boundary/job-shop-ta41/results/shared-hard-core-shrink.json"
          test -f "$p"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): independent hard-core reduction of shared 2006 backbone'
          for attempt in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
