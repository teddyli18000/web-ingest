name: temp Thomson 960 e432-B Delaunay flip

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-e432-b-flip.yml'

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Search exact Delaunay flip completion
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          python3 science-boundary/thomson-960/code/search_delaunay_flip_transfer.py \
            "$RUNNER_TEMP/seed/e432.json" "$RUNNER_TEMP/seed/B-natural.json" \
            --alphas 0.18,0.30,0.45,0.62,0.80,0.98,1.15,1.35,1.60,1.90,2.25 \
            --shells 0,1,2,3 --decay 0.55 --maxiter 3400 --live-score "$live" \
            --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('EXACT_FLIPS',len(d['flips']),d['flips'])
          print('BEST',d['best_energy'],'DELTA',d['best_delta_live'])
          for b in d['distinct_low_basins'][:20]: print('BASIN',b['energy'],b['delta_live'],b['coord_counts'],'flip',b['flip'],'shell',b['shell'],'alpha',b['alpha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e432-B-delaunay-flip
          path: ${{ runner.temp }}/out
          retention-days: 10
