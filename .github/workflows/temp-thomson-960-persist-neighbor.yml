name: temp Thomson 960 persist neighbor seed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-persist-neighbor.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download frozen low-neighbor seed
        uses: actions/download-artifact@v4
        with:
          name: thomson-960-soft-neighbor
          path: ${{ runner.temp }}/neighbor
          github-token: ${{ github.token }}
          run-id: 40624209787
      - name: Persist durable seed and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p science-boundary/thomson-960/data
          cp "$RUNNER_TEMP/neighbor/neighbor.json" science-boundary/thomson-960/data/neighbor-soft-003280.json
          rm .github/workflows/temp-thomson-960-persist-neighbor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science-boundary/thomson-960/data/neighbor-soft-003280.json .github/workflows/temp-thomson-960-persist-neighbor.yml
          git commit -m "science: persist Thomson low-neighbor seed"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
