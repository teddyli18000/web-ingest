name: temp-aes-semilinear-all-orbits

on:
  push:
    paths:
      - '.github/workflows/temp-aes-semilinear-all-orbits.yml'
      - 'science-boundary/aes-sbox-circuit/prove_all_semilinear_orbits.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-aes-semilinear-all-orbits
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove all 2040 transforms form exact six-orbits
        run: |
          mkdir -p /tmp/aes-all-semilinear-orbits
          python science-boundary/aes-sbox-circuit/prove_all_semilinear_orbits.py \
            --out /tmp/aes-all-semilinear-orbits/orbits.json \
            | tee /tmp/aes-all-semilinear-orbits/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: aes-all-semilinear-orbits
          path: /tmp/aes-all-semilinear-orbits
