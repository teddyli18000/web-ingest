name: temp-aes-released-rnbp-support-g103

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-aes-released-rnbp-support-g103.yml'

permissions:
  contents: read

jobs:
  synth:
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run exact-support released RNBP on NIST G103
        run: |
          set -euxo pipefail
          python -m py_compile science-boundary/aes-sbox-circuit/released_rnbp_support_synth.py
          python science-boundary/aes-sbox-circuit/released_rnbp_support_synth.py \
            --family nist-g103 --seed '${{ matrix.seed }}' --max-linear 68 \
            --max-support 8 --elite 4 --out result | tee run.log
          cat result/summary.json
      - name: Official verifier if <=100
        run: |
          set -euxo pipefail
          if [ -f result/candidate.json ] && [ "$(python -c "import json; print(len(json.load(open('result/candidate.json'))['gates']))")" -le 100 ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/shot; cp result/candidate.json /tmp/shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-released-rnbp-g103-${{ matrix.seed }}
          path: |
            result
            run.log
            official-verifier.jsonl
