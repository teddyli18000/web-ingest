name: temp-ta41-15-machine-frontier-exact
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/check_15_machine_survivors.py'
      - '.github/workflows/temp-ta41-15-machine-frontier-exact.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-15-machine-frontier-exact
  cancel-in-progress: false
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install independent CP solver
        run: python -m pip install 'ortools==9.14.6206'
      - name: Examine unique 15-machine groups excluded by no learned clauses
        run: |
          python3 science-boundary/job-shop-ta41/check_15_machine_survivors.py --shard '${{ matrix.shard }}' --shards 4 --per-case-seconds 5 --total-seconds 550 --out 'science-boundary/job-shop-ta41/results/k15-shard-${{ matrix.shard }}'
      - name: Official verifier if a <=2005 candidate appears
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/k15-shard-${{ matrix.shard }}"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Record independent masked-subspace evaluation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'science-boundary/job-shop-ta41/results/k15-shard-${{ matrix.shard }}/'
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): test 15-change survivors shard ${{ matrix.shard }}'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
