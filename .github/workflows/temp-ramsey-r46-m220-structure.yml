name: Temp Ramsey R46 exact m220 structural reduction

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/m220_structure.py
      - .github/workflows/temp-ramsey-r46-m220-structure.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recompute exact structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python science-boundary/ramsey-r46/m220_structure.py --output /tmp/r46/result.json
          python - /tmp/r46/result.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]));assert d['aggregate_vector_count']==179,d
          assert d['survivor_count']==144,d
          assert d['n11_eq_3']['degree_sequence_count']==16,d
          assert d['n11_eq_3']['forced_A_edges']==26 and d['n11_eq_3']['forced_B_edges']==116,d
          assert d['degree12_upper_after_no_lucky_d12']==147,d
          PY
      - name: Persist evidence and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/m220-structure.json
          git rm .github/workflows/temp-ramsey-r46-m220-structure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/m220-structure.json
          git commit -m 'ramsey-r46: record exact m220 structural reduction'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-m220-structure
          path: /tmp/r46
          retention-days: 7
