name: temp-ta41-interface-cp
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/machine_interface_cp.py'
      - '.github/workflows/temp-ta41-interface-cp.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-interface-cp
  cancel-in-progress: false
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Pin OR-Tools
        run: python -m pip install 'ortools==9.14.6206'
      - name: Test whole-machine counterfactual subspaces
        run: |
          python3 science-boundary/job-shop-ta41/machine_interface_cp.py --seconds 70
      - name: Independent official verifier on any found candidate
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/machine-interfaces"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Preserve exact subspace outcomes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/machine-interfaces/
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): test whole-machine CP feasibility regions'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
