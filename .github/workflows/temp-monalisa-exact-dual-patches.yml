name: temp-monalisa-exact-dual-patches
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/dual_patch_search.py
      - .github/workflows/temp-monalisa-exact-dual-patches.yml
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed_start: [0, 2, 4, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public inputs and dependencies
        run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          git clone --depth 1 https://github.com/bicobico2/ElimTSP.git elimtsp
          python -m pip install networkx ortools
          python upstream/problems/p010-mona-lisa-tsp/verify/verify.py upstream/problems/p010-mona-lisa-tsp/baseline
      - name: Exact local face optimization with global subtour cuts
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          mkdir -p science-boundary/mona-lisa-tsp/results/dual-${{ matrix.seed_start }}
          python science-boundary/mona-lisa-tsp/dual_patch_search.py \
            --edges elimtsp/results/mona.248972.edg.gz \
            --baseline upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --report science-boundary/mona-lisa-tsp/results/dual-${{ matrix.seed_start }}/report.json \
            --outdir science-boundary/mona-lisa-tsp/results/dual-${{ matrix.seed_start }} \
            --seed-start ${{ matrix.seed_start }} \
            --seeds 2 --radii 3,4,5 --max-faces 300 --seconds 45
      - name: Verify any new candidate independently
        if: always()
        run: |
          for f in science-boundary/mona-lisa-tsp/results/dual-${{ matrix.seed_start }}/candidate-*.json; do
            test -f "$f" || continue
            mkdir -p /tmp/p010-check
            cp "$f" /tmp/p010-check/certificate.json
            python upstream/problems/p010-mona-lisa-tsp/verify/verify.py /tmp/p010-check
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monalisa-exact-dual-${{ matrix.seed_start }}
          path: science-boundary/mona-lisa-tsp/results/dual-${{ matrix.seed_start }}/
          if-no-files-found: ignore
