name: temp-ta41-cp-core-feedback-release
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-cp-core-feedback-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-cp-core-feedback-release
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        method: [degree, core_random, random]
        parent: [baseline, '124']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin original CP solver and syntax-check feedback implementation
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/core_feedback_release.py
      - name: Repeatedly release operations from newly returned CP infeasibility core
        run: |
          python3 science-boundary/job-shop-ta41/core_feedback_release.py \
            --parent '${{ matrix.parent }}' --method '${{ matrix.method }}' \
            --seed 2081 --growth 24 --rounds 10 --cp-seconds 2 --hard-seconds 12 \
            --out 'science-boundary/job-shop-ta41/results/core-feedback-${{ matrix.parent }}-${{ matrix.method }}'
      - name: Official verification for any target 2005 schedule
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/core-feedback-${{ matrix.parent }}-${{ matrix.method }}"
          if test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          d=json.loads((p/'upstream-verdict.json').read_text())
          assert d['valid'] and int(d['score'])<=2005,d
          PY
          fi
      - name: Save independent assumption core history or UNKNOWN
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/core-feedback-${{ matrix.parent }}-${{ matrix.method }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): CP core feedback versus random ${{ matrix.parent }} ${{ matrix.method }}'
          for i in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
