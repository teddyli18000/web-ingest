name: temp Ramsey R46 linked K4-I6 positive control

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-ramsey-r46-linked-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        seed: [21,31,41]
    steps:
      - uses: actions/checkout@v4
      - name: Install exact SAT and parse source
        run: |
          python3 -m pip install --disable-pip-version-check -q python-sat
          python3 -m py_compile science-boundary/ramsey-r46/linked_conflict_sat.py
      - name: Validate selection and SAT encoding using pinned 12-defect graph
        shell: bash
        run: |
          case '${{ matrix.seed }}' in
            21) SEED=science-boundary/ramsey-r46/results/neutral-network-36-12-defects-257edges.json ;;
            31) SEED=science-boundary/ramsey-r46/results/neutral-network-36-12-defects-259edges.json ;;
            41) SEED=science-boundary/ramsey-r46/results/compound-repair-36-12-defects.json ;;
          esac
          python3 science-boundary/ramsey-r46/linked_conflict_sat.py \
            --elite "$SEED" --red 26 --repair 18 \
            --rng ${{ matrix.seed }} --target 12 \
            --check-only --seconds 60 \
            --outdir "$RUNNER_TEMP/linked-control"
          grep -q 'POSITIVE_CONTROL_PASSED' "$RUNNER_TEMP/linked-control/summary.json"
