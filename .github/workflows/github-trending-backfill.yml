name: GitHub Trending - historical backfill

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-trending-backfill.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: github-trending-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate converter
        run: |
          python -m py_compile github-trending/*.py
          python -m unittest discover -s github-trending/tests -v

      - name: Build full canonical history in runner temp
        run: |
          rm -rf "$RUNNER_TEMP/github-trending-backfill"
          python github-trending/backfill.py --output "$RUNNER_TEMP/github-trending-backfill"

      - name: Commit recovered history in yearly batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out="$RUNNER_TEMP/github-trending-backfill"

          while IFS= read -r year; do
            git pull --rebase origin main
            mkdir -p "github-trending/data/$year"
            rsync -a --ignore-existing "$out/data/$year/" "github-trending/data/$year/"
            git add "github-trending/data/$year"
            if git diff --cached --quiet; then
              continue
            fi
            git commit -m "data(github-trending): backfill $year"
            git push origin HEAD:main
          done < <(find "$out/data" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)

          git pull --rebase origin main
          cp "$out/backfill-manifest.json" github-trending/backfill-manifest.json
          python github-trending/render_readme.py
          git add github-trending/backfill-manifest.json github-trending/README.md
          if ! git diff --cached --quiet; then
            git commit -m "data(github-trending): finalize historical backfill"
            git push origin HEAD:main
          fi
