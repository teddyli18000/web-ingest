name: temp labs-100 parity-half near-skew CP-SAT

on:
  push:
    paths:
      - '.github/workflows/temp-labs-100-nearskew-halves-cpsat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned OR-Tools
        run: python3 -m pip install --disable-pip-version-check ortools==9.15.6755
      - name: Reproduce incumbent exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/labs-100/code/cpsat_nearskew_halves.py \
            --asum 10 --target 578 --seconds 30 --workers 4 --seed 1 --smoke \
            | tee /tmp/smoke.txt
          grep -F 'FOUND energy=578 odd=50 even=528 asum=10 bsum=0 nss=True ' /tmp/smoke.txt

  calibrate:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        asum: [0, 4, 8, 10, 12, 16]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned OR-Tools
        run: python3 -m pip install --disable-pip-version-check ortools==9.15.6755
      - name: Search scaled half-sequence model
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/labs-100/code/cpsat_nearskew_halves.py \
            --asum '${{ matrix.asum }}' --target 574 --seconds 90 --workers 4 \
            --seed "$((2000 + ${{ matrix.asum }}))" | tee /tmp/out.txt
      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-nearskew-halves-${{ matrix.asum }}
          path: /tmp/out.txt
          if-no-files-found: warn
