name: Temp Few Shots p004 companion translations

on:
  push:
    paths:
      - .github/workflows/temp-few-shots-p004-translate.yml
      - temp-work/few-shots-p004/translate_ports.cpp
      - temp-work/few-shots-p004/translate_build.py
  workflow_dispatch:
    inputs:
      depth:
        description: Exact private-swap BFS depth
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: temp-few-shots-p004-translate
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch public sources read-only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          git clone --depth 1 --filter=blob:none --sparse https://github.com/nathanielitty/lower-bounds-for-shannon-capacity.git "$RUNNER_TEMP/shannon-source"
          git -C "$RUNNER_TEMP/shannon-source" sparse-checkout set c7
      - name: Compile exact translation search
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -DNDEBUG -march=native -std=c++20 \
            temp-work/few-shots-p004/translate_ports.cpp \
            -o "$RUNNER_TEMP/translate"
      - name: Search all companion translations
        id: search
        shell: bash
        env:
          DEPTH: ${{ github.event.inputs.depth || '2' }}
        run: |
          set -euo pipefail
          /usr/bin/time -v "$RUNNER_TEMP/translate" \
            "$RUNNER_TEMP/shannon-source/c7/R367.txt" \
            "$RUNNER_TEMP/result.json" "$DEPTH"
          cat "$RUNNER_TEMP/result.json"
          if grep -q '"kind":"translate-found"' "$RUNNER_TEMP/result.json"; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Materialize certificate
        if: steps.search.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shot"
          python3 temp-work/few-shots-p004/translate_build.py "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/status.json"
          cat "$RUNNER_TEMP/status.json"
      - name: Verify breakthrough with upstream verifier
        if: steps.search.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/verify.json"
          python3 - "$RUNNER_TEMP/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if not r.get("valid") or int(r["score"])<=134753: raise SystemExit(r)
          print(f"verified breakthrough score={r['score']}")
          PY
      - name: Save verified breakthrough in web-ingest only
        if: steps.search.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp-work/few-shots-p004/breakthrough
          cp "$RUNNER_TEMP/shot/certificate.json" temp-work/few-shots-p004/breakthrough/certificate.json
          cp "$RUNNER_TEMP/result.json" temp-work/few-shots-p004/breakthrough/translate-result.json
          cp "$RUNNER_TEMP/status.json" temp-work/few-shots-p004/breakthrough/translate-status.json
          cp "$RUNNER_TEMP/verify.json" temp-work/few-shots-p004/breakthrough/translate-verify-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp-work/few-shots-p004/breakthrough
          git commit -m "temp: save verified p004 translation breakthrough"
          git fetch origin main && git rebase origin/main && git push origin HEAD:main
      - name: Summarize
        if: always()
        shell: bash
        run: |
          { echo "## Few Shots p004 exact companion translations"; [[ -f "$RUNNER_TEMP/result.json" ]] && { echo '```json'; cat "$RUNNER_TEMP/result.json"; echo '```'; }; [[ -f "$RUNNER_TEMP/verify.json" ]] && { echo '```json'; cat "$RUNNER_TEMP/verify.json"; echo '```'; }; } >> "$GITHUB_STEP_SUMMARY"
