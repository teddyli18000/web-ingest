name: temp-ta41-partial-bidirectional-repair
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-partial-bidirectional-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-partial-bidirectional-repair
  cancel-in-progress: false
jobs:
  partial_repair:
    strategy:
      fail-fast: false
      matrix:
        method: [bidirectional, critical, random]
        case: [ta41, ta42js-n7elite1701, ta43js-n7elite1711, ta46js-n7elite1701]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Pin solver, syntax-check exact partial precedence witness
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/partial_resource_pair_repair.py
      - name: Target-constrained joint resource-arc release, with matched constructive CP caps
        run: |
          set -euo pipefail
          case='${{ matrix.case }}'
          if test "$case" = ta41; then
            input=ta41
          else
            input="science-boundary/job-shop-ta41/positive-n7-elite-data/$case/start.txt"
          fi
          python3 science-boundary/job-shop-ta41/partial_resource_pair_repair.py \
            --start "$input" \
            --method '${{ matrix.method }}' \
            --seed 709 --growth 20 --rounds 10 --cp-seconds 2.5 \
            --out "science-boundary/job-shop-ta41/results/partial-pair-$case-${{ matrix.method }}"
      - name: Official Few Shots verifier for any ta41 score improvement
        if: always()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/partial-pair-${{ matrix.case }}-${{ matrix.method }}"
          if test '${{ matrix.case }}' = ta41 && test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist independently scored feasible solutions, proof witnesses or honest UNKNOWN
        if: always()
        run: |
          set -euo pipefail
          dir="science-boundary/job-shop-ta41/results/partial-pair-${{ matrix.case }}-${{ matrix.method }}"
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(ta41): constructive precompletion resource-pair trial ${{ matrix.case }} ${{ matrix.method }}"
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
