name: temp Thomson 960 C3 triple glide

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-c3-triple-glide.yml'

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: orbit0
            quads: '217,559,551,308;239,857,231,948;537,879,628,871'
          - tag: orbit1
            quads: '59,639,935,603;319,699,283,615;379,959,923,295'
          - tag: orbit2
            quads: '79,134,323,35;399,454,355,643;719,774,675,3'
          - tag: orbit4
            quads: '108,282,511,599;428,602,919,831;748,922,279,191'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Cross coordinated C3 glide orbit
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) tag=${{ matrix.tag }} live=$live"
          python3 science-boundary/thomson-960/code/search_symmetry_orbit_flips.py \
            "$RUNNER_TEMP/seed/live.json" \
            --quads '${{ matrix.quads }}' \
            --patterns balanced,newdiag,olddiag \
            --multipliers 1.003,1.01,1.03,1.08,1.18,1.35 \
            --fixed-maxiter 1800 --release-maxiter 3600 \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('QUADS',d['quads'])
          print('THRESHOLDS',d['thresholds'])
          print('BEST',d['best_release_energy'],'DELTA',d['best_delta_live'])
          for b in d['lowest_distinct_release_basins'][:16]:
              print('BASIN',b['energy'],b['delta_live'],b['coord_counts'],'pat',b['pattern'],'m',b['multiplier'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-c3-triple-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 10
