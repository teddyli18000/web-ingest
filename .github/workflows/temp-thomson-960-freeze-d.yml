name: temp Thomson 960 freeze D

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-freeze-d.yml"

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: thomson-cd-hessian
          path: ${{ runner.temp }}/cd
          github-token: ${{ github.token }}
          run-id: 40732118945
      - name: Validate and persist D
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          src=pathlib.Path(os.environ['RUNNER_TEMP'])/'cd'/'basin-d.json'
          d=json.loads(src.read_text())
          e=float(d['energy'])
          assert len(d['points'])==960
          assert abs(e-444368.4109930845)<2e-7, e
          out=pathlib.Path('science-boundary/thomson-960/data/basin-d-018586.json')
          out.write_text(json.dumps(d,separators=(',',':'))+'\n')
          print('persisting',out,'E=',e)
          PY
          rm .github/workflows/temp-thomson-960-freeze-d.yml
          git config user.name "science-boundary-bot"
          git config user.email "science-boundary-bot@users.noreply.github.com"
          git add science-boundary/thomson-960/data/basin-d-018586.json .github/workflows/temp-thomson-960-freeze-d.yml
          git commit -m "science: freeze Thomson D minimum coordinates"
          git pull --rebase origin main
          git push origin HEAD:main
