name: temp-aes-seed-family-census

on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/seed_family_census.py'
      - '.github/workflows/temp-aes-seed-family-census.yml'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run independently verified seed-family census
        run: |
          set -euxo pipefail
          python science-boundary/aes-sbox-circuit/seed_family_census.py --out seed-family-census.json
          python - <<'PY'
          import json
          x=json.load(open('seed-family-census.json'))
          assert all(v['verified_all_256'] for v in x['seeds'].values())
          assert x['seeds']['nist-g103']['gates']==103
          assert x['seeds']['nist-g104']['gates']==104
          assert x['seeds']['fs-101']['gates']==101
          print('census_validation=ok')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aes-seed-family-census
          path: seed-family-census.json
