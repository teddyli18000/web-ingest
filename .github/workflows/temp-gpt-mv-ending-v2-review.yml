name: Temp GPT MV ending v2 review

on:
  push:
    paths:
      - "temp-work/gpt-mv-code-native/src/main.js"
      - "temp-work/gpt-mv-code-native/src/scenes/ending_v2.js"
      - "temp-work/gpt-mv-code-native/src/scenes/construct_v5.js"
      - "temp-work/gpt-mv-code-native/export/render.mjs"
      - ".github/workflows/temp-gpt-mv-ending-v2-review.yml"
  workflow_dispatch:

concurrency:
  group: temp-gpt-mv-ending-v2-review
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: temp-work/gpt-mv-code-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
      - name: Render ending 45-60s
        run: node export/render.mjs --start 45 --end 60 --width 960 --height 540 --fps 15 --art-source reach-hq --out out/gpt_ending_v2.mp4
      - name: Validate ending media
        run: |
          set -euo pipefail
          test -s out/gpt_ending_v2.mp4
          test -s out/gpt_ending_v2.contact.jpg
          ffmpeg -v error -i out/gpt_ending_v2.mp4 -f null -
          D=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 out/gpt_ending_v2.mp4)
          python - "$D" <<'PY'
          import sys
          d=float(sys.argv[1]); print('duration',d); assert 14.9 <= d <= 15.1
          PY
          ffmpeg -hide_banner -i out/gpt_ending_v2.mp4 -vf "blackdetect=d=0.15:pix_th=0.02,freezedetect=n=0.001:d=1.0" -an -f null - 2>&1 | tee out/qc-ending-v2.txt
          if grep -q 'black_start' out/qc-ending-v2.txt; then echo 'unexpected black interval' >&2; exit 1; fi
      - name: Upload ending review
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mv-ending-v2-${{ github.run_id }}
          path: |
            temp-work/gpt-mv-code-native/out/gpt_ending_v2.mp4
            temp-work/gpt-mv-code-native/out/gpt_ending_v2.contact.jpg
            temp-work/gpt-mv-code-native/out/qc-ending-v2.txt
          retention-days: 14
          if-no-files-found: error
