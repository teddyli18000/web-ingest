name: temp-aes-rnbp-tail-threshold

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-aes-rnbp-tail-threshold.yml'

permissions:
  contents: read

jobs:
  tail:
    strategy:
      fail-fast: false
      matrix:
        slots: [8, 9, 10, 11]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet z3-solver
      - name: Exact tail threshold
        run: |
          set -euxo pipefail
          python science-boundary/aes-sbox-circuit/rnbp_exact_tail.py \
            --family fs-101 --rng-seed 1 --topk 1 --prefix-max-linear 67 \
            --tail-slots '${{ matrix.slots }}' --timeout-ms 480000 --out result | tee run.log
          cat result/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: aes-rnbp-tail-threshold-${{ matrix.slots }}
          path: |
            result
            run.log
