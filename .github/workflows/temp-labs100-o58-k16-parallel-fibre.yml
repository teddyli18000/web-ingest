name: temp labs100 O58 K16 parallel fibre

on:
  push:
    paths:
      - '.github/workflows/temp-labs100-o58-k16-parallel-fibre.yml'
  workflow_dispatch:

concurrency:
  group: temp-labs100-o58-k16-parallel-fibre
  cancel-in-progress: false

jobs:
  compressed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build grouped compressed solver
        run: g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/o58_k16_compressed_groups.cpp -o "$RUNNER_TEMP/groupc"
      - name: Exhaust all kp<=kc K16 branches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/o58"
          export OMP_NUM_THREADS=4
          for cls in center unit five; do : > "$RUNNER_TEMP/o58/${cls}.groups"; done
          for kp in 1 3 5 7; do
            for ((t=1;t<=kp;t+=2)); do
              log="$RUNNER_TEMP/o58/c-kp${kp}-t${t}-center.log"
              "$RUNNER_TEMP/groupc" 16 "$kp" "$t" center > "$log"
              grep '^GROUP ' "$log" >> "$RUNNER_TEMP/o58/center.groups" || true
              grep '^O58_K16_GROUPS ' "$log"
            done
            for ((t=0;t<=kp;t+=2)); do
              for cls in unit five; do
                log="$RUNNER_TEMP/o58/c-kp${kp}-t${t}-${cls}.log"
                "$RUNNER_TEMP/groupc" 16 "$kp" "$t" "$cls" > "$log"
                grep '^GROUP ' "$log" >> "$RUNNER_TEMP/o58/${cls}.groups" || true
                grep '^O58_K16_GROUPS ' "$log"
              done
            done
          done
          for cls in center unit five; do
            test -s "$RUNNER_TEMP/o58/${cls}.groups"
            echo "GROUP_LINES cls=$cls count=$(grep -c '^GROUP ' "$RUNNER_TEMP/o58/${cls}.groups")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: labs100-o58-k16-groups
          path: ${{ runner.temp }}/o58
          if-no-files-found: error

  fibre:
    needs: compressed
    strategy:
      fail-fast: false
      matrix:
        include:
          - cls: center
            lag: 0
          - cls: unit
            lag: 1
          - cls: five
            lag: 5
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: labs100-o58-k16-groups
          path: ${{ runner.temp }}/o58
      - name: Build exact grouped fibre solver
        run: g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/o58_k16_qgroup_groups.cpp -o "$RUNNER_TEMP/groupq"
      - name: Exhaust fibre class
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS=4
          "$RUNNER_TEMP/groupq" '${{ matrix.lag }}' "$RUNNER_TEMP/o58/${{ matrix.cls }}.groups" | tee "$RUNNER_TEMP/q-${{ matrix.cls }}.log"
          grep '^O58_K16_GROUP_FIBRE_SUMMARY ' "$RUNNER_TEMP/q-${{ matrix.cls }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: labs100-o58-k16-fibre-${{ matrix.cls }}
          path: ${{ runner.temp }}/q-${{ matrix.cls }}.log
          if-no-files-found: error
