name: temp Thomson 960 e432 frontier

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-e432-frontier.yml'

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-d2-live-string-9852
          path: ${{ runner.temp }}/seed9852
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41041110943
      - run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Reconstruct natural-label e474 to e432 to B corridor
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 - <<'PY'
          import json,pathlib,os,sys,numpy as np
          sys.path.insert(0,'science-boundary/thomson-960/code')
          import search_topology_morph as tm
          seed=pathlib.Path(os.environ['RUNNER_TEMP'])/'seed9852'; out=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          d=json.loads((seed/'result.json').read_text())
          e474=np.asarray(next(z for z in d['distinct_low_basins'] if z['image']==10 and z['coord_counts']=={'5':35,'6':902,'7':23})['points'],float)
          A=np.asarray(next(z for z in d['distinct_low_basins'] if z['image']==11 and abs(z['energy']-444368.395686226)<2e-5)['points'],float)
          e474/=np.linalg.norm(e474,axis=1)[:,None]; A/=np.linalg.norm(A,axis=1)[:,None]
          R=tm.kabsch(e474,A); L=e474@R
          def save(name,x,E=None):
              x=x/np.linalg.norm(x,axis=1)[:,None]; E=tm.raw_energy(x) if E is None else E
              (out/f'{name}.json').write_text(json.dumps({'name':name,'energy':float(E),'coord_counts':tm.coord_counts(x),'points':x.tolist()},separators=(',',':'))+'\n')
          save('e474',L)
          save('A-natural',A)
          for t,name,targetE,targetCC in [
              (0.49,'e432',444368.4322496275,{'5':35,'6':902,'7':23}),
              (0.50,'B-natural',444368.4029728615,{'5':36,'6':900,'7':24})]:
              x=tm.geodesic(L,A,t); E,y,nit,ok=tm.relax(x,maxiter=3000); cc=tm.coord_counts(y)
              print(name,'t',t,'E',E,'cc',cc,'nit',nit,'ok',ok)
              if abs(E-targetE)>7e-5 or cc!=targetCC: raise RuntimeError((name,E,cc))
              save(name,y,E)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'few-shots'; score,live_dir=tm.find_live(root); live=tm.cert_xyz(live_dir/'certificate.json')
          save('live',live,score); (out/'live-score.txt').write_text(str(score))
          # Report fixed-label geometries.
          for name in ('B-natural','live'):
              q=np.asarray(json.loads((out/f'{name}.json').read_text())['points']); p=np.asarray(json.loads((out/'e432.json').read_text())['points'])
              RR=tm.kabsch(p,q); rms=float(np.sqrt(np.mean(np.sum((p@RR-q)**2,axis=1))))
              print('E432_FIXED_RMS_TO',name,rms)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/out
          retention-days: 7

  expand:
    needs: harvest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: modes-low
            tag: modes-0-5
            seed: 0
          - kind: modes-high
            tag: modes-6-11
            seed: 0
          - kind: moto
            tag: moto-9991
            seed: 9991
          - kind: moto
            tag: moto-9992
            seed: 9992
          - kind: fixed-B
            tag: fixed-B-core
            seed: 10001
          - kind: fixed-B
            tag: fixed-B-broad
            seed: 10002
          - kind: fixed-live
            tag: fixed-live
            seed: 10003
          - kind: core-live
            tag: core-live
            seed: 10004
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
      - run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Expand e432 transition neighborhood
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          case '${{ matrix.kind }}' in
            modes-low)
              python3 science-boundary/thomson-960/code/search_seed_multimode_parallel.py \
                "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/seed/e432.json" \
                --modes 0,1,2,3,4,5 --amps 0.0015,0.003,0.006,0.012,0.022,0.040,0.065 \
                --k 14 --workers "$(nproc)" --maxiter 2900 --keep-basins 28 --out "$RUNNER_TEMP/out/result.json" ;;
            modes-high)
              python3 science-boundary/thomson-960/code/search_seed_multimode_parallel.py \
                "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/seed/e432.json" \
                --modes 6,7,8,9,10,11 --amps 0.0015,0.003,0.006,0.012,0.022,0.040,0.065 \
                --k 14 --workers "$(nproc)" --maxiter 2900 --keep-basins 28 --out "$RUNNER_TEMP/out/result.json" ;;
            moto)
              python3 science-boundary/thomson-960/code/moto_like_saddle_explorer.py \
                "$RUNNER_TEMP/few-shots" --seed-json "$RUNNER_TEMP/seed/e432.json" --seed '${{ matrix.seed }}' \
                --population 16 --select 4 --basis-k 14 --scales 0.002,0.0035,0.006,0.010,0.016,0.026 \
                --mmf-cycles 8 --mmf-steps 65 --mmf-eta 0.00020 --mmf-max-rms 0.000009 \
                --certify-amp 0.0015 --out "$RUNNER_TEMP/out/result.json" ;;
            fixed-B)
              if [[ '${{ matrix.tag }}' == 'fixed-B-core' ]]; then fr='0.025,0.04,0.06,0.09,0.14,0.22'; al='-0.35,-0.15,0.08,0.16,0.28,0.45,0.70,1.0,1.4,1.9'; else fr='0.35,0.55,0.80,1.0'; al='-0.35,-0.15,0.08,0.16,0.28,0.45,0.70,1.0,1.4,1.9'; fi
              python3 science-boundary/thomson-960/code/search_pair_event_transfer.py \
                "$RUNNER_TEMP/seed/e432.json" "$RUNNER_TEMP/seed/B-natural.json" --fixed-correspondence \
                --seed '${{ matrix.seed }}' --starts 1 --maxiter 3000 \
                --ts='0.20,0.45,0.70,0.88,0.96,1.01,1.04,1.08,1.15,1.28,1.50,1.85' \
                --fracs "$fr" --alphas="$al" --live-score "$live" --out "$RUNNER_TEMP/out/result.json" ;;
            fixed-live)
              python3 science-boundary/thomson-960/code/search_pair_event_transfer.py \
                "$RUNNER_TEMP/seed/e432.json" "$RUNNER_TEMP/seed/live.json" --fixed-correspondence \
                --seed '${{ matrix.seed }}' --starts 1 --maxiter 3000 \
                --ts='0.20,0.45,0.70,0.88,0.96,1.01,1.04,1.08,1.15,1.28,1.50' \
                --fracs '0.04,0.08,0.14,0.25,0.45,0.70,1.0' --alphas='-0.25,0.08,0.16,0.30,0.50,0.80,1.15,1.55' \
                --live-score "$live" --out "$RUNNER_TEMP/out/result.json" ;;
            core-live)
              python3 science-boundary/thomson-960/code/search_defect_core_transfer.py \
                "$RUNNER_TEMP/seed/e432.json" "$RUNNER_TEMP/seed/live.json" --seed '${{ matrix.seed }}' --starts 32 \
                --radii 0.045,0.065,0.085,0.12,0.17,0.24 --alphas 0.10,0.20,0.35,0.55,0.80,1.10,1.45,1.90 \
                --maxiter 3000 --live-score "$live" --out "$RUNNER_TEMP/out/result.json" ;;
          esac
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('KIND','${{ matrix.kind }}','BEST',d.get('best_energy',d.get('best_certified_endpoint_energy')),
                'DELTA',d.get('best_delta_live',d.get('best_delta_vs_live')),'LABEL',d.get('best_label'))
          for b in d.get('lowest_distinct_basins',[])[:25]: print('BASIN',b['energy'],b.get('mode'),b.get('sign'),b.get('amp'))
          for b in d.get('distinct_low_basins',[])[:25]: print('BASIN',b['energy'],b.get('coord_counts'),b.get('label'))
          for r in d.get('results',[]):
              print('SADDLE',r['saddle_energy'],'grad',r['saddle_gradient_rms'],'neg',r['negative_modes'])
              for z in r.get('certified_endpoints',[]): print('END',z['energy'],z['delta_vs_live'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e432-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 7
