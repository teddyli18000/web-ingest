name: temp Thomson 960 C3 smooth search

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-c3-smooth.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-thomson-960-c3-smooth
  cancel-in-progress: false

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 202, 303, 404]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Run independent C3 smooth-mode basins
        run: |
          python3 science-boundary/thomson-960/code/search_c3_smooth.py \
            "$RUNNER_TEMP/few-shots" --seed ${{ matrix.seed }} --trials 10 \
            --out "$RUNNER_TEMP/result-${{ matrix.seed }}.json"
          cat "$RUNNER_TEMP/result-${{ matrix.seed }}.json"

  cleanup:
    if: always()
    needs: search
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove disposable workflow
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/temp-thomson-960-c3-smooth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temp-thomson-960-c3-smooth.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: remove completed Thomson C3 search workflow"
            git push origin HEAD:main
          fi
