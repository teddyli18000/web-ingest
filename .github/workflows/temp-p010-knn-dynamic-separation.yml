name: temp-p010-knn-dynamic-separation
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/tsplib_knn_sec_counterexamples.py
      - .github/workflows/temp-p010-knn-dynamic-separation.yml
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        include:
          - {i: eil51, run: 40869449446, a: p010-blind-5case-public}
          - {i: berlin52, run: 40869449446, a: p010-blind-5case-public}
          - {i: st70, run: 40869449446, a: p010-blind-5case-public}
          - {i: eil76, run: 40869449446, a: p010-blind-5case-public}
          - {i: kroA100, run: 40869449446, a: p010-blind-5case-public}
          - {i: rat99, run: 40870679131, a: p010-unseen-v2-public}
          - {i: ch130, run: 40870679131, a: p010-unseen-v2-public}
          - {i: eil101, run: 40870679131, a: p010-unseen-v2-public}
          - {i: pr76, run: 40870679131, a: p010-unseen-v2-public}
          - {i: kroB100, run: 40870679131, a: p010-unseen-v2-public}
          - {i: kroC100, run: 40871715238, a: fold3-public-inputs}
          - {i: kroD100, run: 40871715238, a: fold3-public-inputs}
          - {i: kroE100, run: 40871715238, a: fold3-public-inputs}
          - {i: rd100, run: 40871715238, a: fold3-public-inputs}
          - {i: lin105, run: 40871715238, a: fold3-public-inputs}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch only public masked instance and permitted parent routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/public
          gh run download "${{ matrix.run }}" --repo teddyli18000/web-ingest --name "${{ matrix.a }}" --dir /tmp/public
          python -m pip install numpy scipy ortools
      - name: Constraint-driven full KNN optimization by exact degree two plus separated subtour cuts
        run: |
          pub=$(find /tmp/public -name public.json -path '*/${{ matrix.i }}/*' -print -quit)
          test -s "$pub"
          test "$(find /tmp/public -name private.json | wc -l)" -eq 0
          out="science-boundary/mona-lisa-tsp/results/knn8-sec-${{ matrix.i }}/result.json"
          python science-boundary/mona-lisa-tsp/tsplib_knn_sec_counterexamples.py --public "$pub" --seconds 18 --output "$out"
          test -s "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p010-knn-sec-${{ matrix.i }}
          path: science-boundary/mona-lisa-tsp/results/knn8-sec-*/result.json
          if-no-files-found: ignore
