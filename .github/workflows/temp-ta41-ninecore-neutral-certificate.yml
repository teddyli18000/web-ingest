name: temp-ta41-ninecore-neutral-certificate
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-ninecore-neutral-certificate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-ninecore-neutral-certificate
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Pin solver and syntax-check
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/all_core_orientation_repair.py
      - name: Reconstruct complete schedule crossing all nine necessary core disjunctions
        run: |
          python3 science-boundary/job-shop-ta41/all_core_orientation_repair.py \
            --parent baseline --policy dynamic --seed 4113 --seconds 150 \
            --out science-boundary/job-shop-ta41/results/ninecore-neutral-baseline
      - name: Official Few Shots verification at any score
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/ninecore-neutral-baseline"
          git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
          cd /tmp/few-shots
          if test -f "$dir/certificate.json"; then
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          elif test -f "$dir/neutral-certificate.json"; then
            mkdir -p /tmp/ta41-neutral
            cp "$dir/neutral-certificate.json" /tmp/ta41-neutral/certificate.json
            python3 problems/p009-job-shop-ta41/verify/verify.py /tmp/ta41-neutral | tee "$dir/neutral-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'neutral-verdict.json').read_text())
          assert v['valid'] and int(v['score'])==2006,v
          PY
          else
            echo 'No feasible certificate found: retain uncertainty.'
          fi
      - name: Preserve independently checked schedule
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/ninecore-neutral-baseline'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): freeze official nine-core-crossing 2006 orientation witness'
          for attempt in $(seq 1 50); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 1
          done
          exit 1
