name: Baidu Drive 4 MiB signed link probe (one shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baidu-drive-range-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BAIDU_DRIVE_BAIDU_SESSION: ${{ secrets.BAIDU_DRIVE_BAIDU_SESSION }}
      BAIDU_DRIVE_STATE_KEY: ${{ secrets.BAIDU_DRIVE_STATE_KEY }}
    steps:
      - name: Checkout task-local code and public checkpoint
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            baidu-drive

      - name: Checkout pinned Baidu source client
        uses: actions/checkout@v4
        with:
          repository: teddyli18000/baidu-drive-mover
          ref: a9e76feb18fe9ca1ac680d0ea555aac684d622de
          path: .probe-core
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .probe-core/go.mod
          cache-dependency-path: .probe-core/go.sum

      - name: Read current encrypted browser session privately
        run: |
          python3 -m pip install -q "cryptography==46.0.4"
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "baidu-drive")
          import auth_session, auth_provision, controller
          gh = controller.GitHub(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_TOKEN"])
          cookie = auth_session.read(gh, os.environ["BAIDU_DRIVE_BAIDU_SESSION"], os.environ["BAIDU_DRIVE_STATE_KEY"])
          auth_provision.write_private(Path(os.environ["RUNNER_TEMP"]) / "baidu-probe.cookies", cookie)
          print("Existing Baidu session loaded for a single read-only request.")
          PY

      - name: Probe exactly one 4 MiB signed download with no remote writes
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads(Path("baidu-drive/state/files/bd-20261114T085503Z-7eb87d/218252594820093.json").read_text())
          assert record["file_id"] == "218252594820093" and record["size"] >= 4 << 20
          with open(os.environ["GITHUB_ENV"], "a") as out:
              print("BAIDU_PROBE_REMOTE_PATH=" + record["baidu_staging_path"], file=out)
              print("BAIDU_PROBE_SIZE=" + str(record["size"]), file=out)
          PY
          mkdir -p .probe-core/cmd/baidu-range-probe
          cp baidu-drive/mover/relay_dlink.go .probe-core/cmd/baidu-range-probe/relay_dlink.go
          cat > .probe-core/cmd/baidu-range-probe/main.go <<'GO'
          package main
          import (
            "context"
            "errors"
            "fmt"
            "io"
            "os"
            "strconv"
            "strings"
            "github.com/teddyli18000/baidu-drive-mover/internal/baidu"
          )
          func main() {
            cookie, err := os.ReadFile(os.Getenv("RUNNER_TEMP") + "/baidu-probe.cookies")
            if err != nil { fmt.Println("probe: private cookie input missing"); os.Exit(1) }
            client, err := baidu.NewClient(string(cookie))
            if err != nil { fmt.Println("probe: unable to load current login"); os.Exit(1) }
            size, err := strconv.ParseInt(os.Getenv("BAIDU_PROBE_SIZE"), 10, 64)
            if err != nil || size <= 4<<20 { fmt.Println("probe: invalid task metadata"); os.Exit(1) }
            source := newBaiduSignedRangeSource(client, string(cookie), size)
            const length int64 = 4 << 20
            stream, err := source.OpenDownloadRange(context.Background(), os.Getenv("BAIDU_PROBE_REMOTE_PATH"), 0, length-1)
            if err != nil {
              if errors.Is(err, errBaiduDownloadDenied) { fmt.Println("probe: Baidu refused signed download") 
              } else if errors.Is(err, baidu.ErrAuthRequired) { fmt.Println("probe: Baidu login needs renewal")
              } else if strings.Contains(err.Error(), "filemetas") { fmt.Println("probe: signed link metadata was not available")
              } else if strings.Contains(err.Error(), "stage") { fmt.Println("probe: staged file lookup failed")
              } else if strings.Contains(err.Error(), "Content-Range") { fmt.Println("probe: signed response did not honor Range")
              } else { fmt.Println("probe: other signed source response failure") }
              os.Exit(1)
            }
            defer stream.Body.Close()
            n, err := io.CopyN(io.Discard, stream.Body, length)
            if err != nil || n != length { fmt.Println("probe: incomplete signed 4 MiB response"); os.Exit(1) }
            fmt.Println("probe: success, single authorized 4 MiB source read; no remote data written")
          }
          GO
          cd .probe-core
          go run ./cmd/baidu-range-probe
