name: Riemann-Weil cross-cutoff phase check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riemann-weil-cross-cutoff-phase.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riemann-weil-cross-cutoff-phase-main
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        c: [97, 101, 107]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check python-flint mpmath numpy
      - name: Fetch pinned public verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/akivag613/connes-cvs-.git upstream-connes-cvs
          git -C upstream-connes-cvs checkout --quiet 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c
      - name: Compute rigorous pivots
        run: |
          set -euo pipefail
          python temp-work/riemann-weil-research/experiments/even_schur_pivots.py \
            --upstream-script upstream-connes-cvs/papers/2_guinand_weil_dictionary_tail_order/scripts/arb_ldlt_certify.py \
            --upstream-commit 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c \
            --c '${{ matrix.c }}' --Nmax 80 --prec 5000 \
            --output 'pivots-c${{ matrix.c }}.json'
      - name: Run phase diagnostic
        run: |
          python temp-work/riemann-weil-research/experiments/schur_pivot_phase_spectrum.py \
            --input 'pivots-c${{ matrix.c }}.json' \
            --output 'phase-c${{ matrix.c }}.json' \
            --Nmin 32 --degree 2 --permutations 2500 --seed $((20260902 + ${{ matrix.c }}))
      - name: Upload cross-cutoff result
        uses: actions/upload-artifact@v4
        with:
          name: cutoff-phase-c${{ matrix.c }}
          path: |
            pivots-c${{ matrix.c }}.json
            phase-c${{ matrix.c }}.json
          retention-days: 1

  collect:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: cutoff-phase-c*
          path: cross
      - name: Summarize
        run: |
          python - <<'PY'
          import glob, json, math
          from pathlib import Path
          rows=[]
          for f in sorted(glob.glob('cross/cutoff-phase-c*/phase-c*.json')):
              d=json.loads(Path(f).read_text())
              top=d['top_arithmetic_candidates'][0]
              q2=next((x for x in d['top_arithmetic_candidates'] if x['q']==2 and x['harmonic']==1), None)
              rows.append({
                  'c':d['c'],
                  'sample_count':d['sample_count'],
                  'familywise_permutation_p_value':d['familywise_permutation_p_value'],
                  'top_candidate':top,
                  'q2_fundamental':q2,
                  'predicted_q2_frequency':math.log(2)/math.log(d['c']),
              })
          out={
              'status':'cross_cutoff_schur_phase_check',
              'Nmax':80,
              'Nmin_phase':32,
              'rows':rows,
              'interpretation':'If the c=100 q=2 feature is arithmetic rather than a cutoff-100 alias, a feature should move with log(2)/log(c) across nearby prime cutoffs. This remains exploratory midpoint analysis.',
          }
          p=Path('temp-work/riemann-weil-research/results/cross-cutoff-schur-phase-c97-101-107-N80.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit result safely
        run: |
          set -euo pipefail
          git config user.name 'riemann-weil-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          path='temp-work/riemann-weil-research/results/cross-cutoff-schur-phase-c97-101-107-N80.json'
          git add "$path"
          git diff --cached --quiet && exit 0
          git commit -m 'research: record cross-cutoff Schur phase check'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
