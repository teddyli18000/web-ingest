name: temp Thomson 960 saddle reaction endpoints

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-saddle-reaction.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Download standard refined R-A saddle
        uses: actions/download-artifact@v4
        with:
          name: thomson-saddle-refined-standard
          path: ${{ runner.temp }}/saddle
          github-token: ${{ github.token }}
          run-id: 40632990227
      - name: Descend both reaction-mode sides
        run: |
          python3 science-boundary/thomson-960/code/search_saddle_transverse.py \
            "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/saddle/refined-standard.json" \
            --transverse-mode 1 --sign 1 --transverse-amps 0 \
            --reaction-amps=-0.003,-0.0015,0.0015,0.003 \
            --out "$RUNNER_TEMP/reaction.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'reaction.json')
          d=json.load(open(p)); d.pop('best_points',None)
          print(json.dumps(d,indent=2))
          PY
      - name: Upload reaction endpoints
        uses: actions/upload-artifact@v4
        with:
          name: thomson-saddle-reaction
          path: ${{ runner.temp }}/reaction.json
          retention-days: 7
