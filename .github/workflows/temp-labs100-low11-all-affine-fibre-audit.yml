name: temp labs100 low11 all affine fibre audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-labs100-low11-all-affine-fibre-audit.yml'

concurrency:
  group: temp-labs100-low11-all-affine-fibre-audit
  cancel-in-progress: false

jobs:
  exact-affine-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build committed exact fibre oracle
        run: g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_order25_fibre_mitm.cpp -o "$RUNNER_TEMP/fibre"
      - name: Expand all 11 compressed representatives through AGL(1,Z25)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cands" "$RUNNER_TEMP/out"
          python - "$RUNNER_TEMP/cands" <<'PY'
          import math,sys
          from pathlib import Path
          out=Path(sys.argv[1])
          rows=[x for x in Path('science-boundary/labs-100/data/low11-t6-t8-t10-compressed-survivors.txt').read_text().splitlines() if x.strip() and not x.startswith('#')]
          assert len(rows)==11,len(rows)
          units=[a for a in range(25) if math.gcd(a,25)==1]
          def tr(x,a,b):
              y=[0]*25
              for i,v in enumerate(x): y[(a*i+b)%25]=v
              return y
          meta=[]
          for row in rows:
              tag,kp,left,right=row.split('|')
              p=list(map(int,left.split())); c=list(map(int,right.split()))
              assert len(p)==len(c)==25
              assert sum(v*v for v in p)==int(kp)
              assert sum(p)==10 and sum(c)==0
              for a in units:
                  for b in range(25):
                      pp=tr(p,a,b); cc=tr(c,a,b)
                      n=len(meta); meta.append((tag,a,b))
                      (out/f'{n:04d}.txt').write_text(' '.join(map(str,pp))+'\n'+' '.join(map(str,cc))+'\n')
          assert len(meta)==5500,len(meta)
          Path(sys.argv[1]).parent.joinpath('meta.txt').write_text('\n'.join(f'{i} {tag} {a} {b}' for i,(tag,a,b) in enumerate(meta))+'\n')
          print('AFFINE_IMAGES',len(meta))
          PY
          test "$(find "$RUNNER_TEMP/cands" -name '*.txt' | wc -l)" -eq 5500
      - name: Test defect1 and defect2 using every runner CPU
        shell: bash
        run: |
          set -euo pipefail
          export RUNNER_TEMP
          find "$RUNNER_TEMP/cands" -name '*.txt' -print0 | \
            xargs -0 -P"$(nproc)" -I{} bash -c '
              f="$1"; n=$(basename "$f" .txt)
              h1=$(OMP_NUM_THREADS=1 "$RUNNER_TEMP/fibre" --defect 1 < "$f" 2>/dev/null | sed -n "s/.*compatible_probe_lifts=\([0-9][0-9]*\).*/\1/p")
              h2=$(OMP_NUM_THREADS=1 "$RUNNER_TEMP/fibre" --defect 2 < "$f" 2>/dev/null | sed -n "s/.*compatible_probe_lifts=\([0-9][0-9]*\).*/\1/p")
              test -n "$h1"; test -n "$h2"
              echo "$n $h1 $h2" > "$RUNNER_TEMP/out/$n.txt"
            ' _ {}
          cat "$RUNNER_TEMP"/out/*.txt | sort -n > "$RUNNER_TEMP/affine-fibre.tsv"
          test "$(wc -l < "$RUNNER_TEMP/affine-fibre.tsv")" -eq 5500
          awk '{s1+=$2;s2+=$3;if($2||$3)h++} END{print "AFFINE_FIBRE_SUMMARY images="NR," hit_images="h+0," sum_defect1="s1+0," sum_defect2="s2+0}' "$RUNNER_TEMP/affine-fibre.tsv" | tee "$RUNNER_TEMP/summary.txt"
          awk 'NR==FNR{tag[$1]=$2;next} {n[$1]=$1; h1[$1]=$2; h2[$1]=$3} END{}' "$RUNNER_TEMP/meta.txt" "$RUNNER_TEMP/affine-fibre.tsv" >/dev/null
          python - "$RUNNER_TEMP/meta.txt" "$RUNNER_TEMP/affine-fibre.tsv" "$RUNNER_TEMP/by-rep.txt" <<'PY'
          import sys,collections
          meta={int(x.split()[0]):x.split()[1] for x in open(sys.argv[1])}
          d=collections.defaultdict(lambda:[0,0,0,0])
          for line in open(sys.argv[2]):
              i,h1,h2=map(int,line.split()); row=d[meta[i]]; row[0]+=1; row[1]+=h1; row[2]+=h2; row[3]+=bool(h1 or h2)
          with open(sys.argv[3],'w') as f:
              for tag in sorted(d):
                  n,s1,s2,hit=d[tag]; f.write(f'{tag} images={n} hit_images={hit} sum_defect1={s1} sum_defect2={s2}\n')
          PY
          cat "$RUNNER_TEMP/by-rep.txt"
          if awk '$2!=0 || $3!=0 {found=1} END{exit found?0:1}' "$RUNNER_TEMP/affine-fibre.tsv"; then
            echo 'NONZERO_AFFINE_FIBRE_HIT' | tee "$RUNNER_TEMP/nonzero.txt"
          else
            echo 'ALL_AFFINE_IMAGES_EXCLUDED' | tee "$RUNNER_TEMP/nonzero.txt"
          fi
      - name: Upload exact transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-low11-all-affine-fibre-audit
          path: |
            ${{ runner.temp }}/summary.txt
            ${{ runner.temp }}/by-rep.txt
            ${{ runner.temp }}/nonzero.txt
            ${{ runner.temp }}/affine-fibre.tsv
            ${{ runner.temp }}/meta.txt
          if-no-files-found: warn
