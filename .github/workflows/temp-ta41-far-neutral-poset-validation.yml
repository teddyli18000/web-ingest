name: temp-ta41-far-neutral-poset-validation
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/far_neutral_poset.py'
      - '.github/workflows/temp-ta41-far-neutral-poset-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-far-neutral-poset-validation
  cancel-in-progress: false
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        family: [farA,farB,both,all16]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact CP solver and check syntax
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/far_neutral_poset.py
      - name: Recompute common poset and extract resource bottleneck after novel distant neutral samples
        run: |
          python3 science-boundary/job-shop-ta41/far_neutral_poset.py \
            --family '${{ matrix.family }}' --seconds 135 --hard-seconds 40 \
            --out 'science-boundary/job-shop-ta41/results/far-poset-${{ matrix.family }}'
      - name: Official Few Shots independent verifier on possible <=2005 certificate
        if: always()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/far-poset-${{ matrix.family }}"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);x=json.loads((p/'upstream-verdict.json').read_text())
          assert x['valid'] and int(x['score'])<=2005,x
          PY
          fi
      - name: Commit independently validated core evidence to main
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/far-poset-${{ matrix.family }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): audit newly diversified 2006 consensus ${{ matrix.family }}'
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
