name: temp C7p5 port-aware circular neutral block exploration

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7p5-port-walk.yml
      - science-boundary/shannon-capacity-c7/code/c7p5_port_aware_block_walk.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-c7p5-port-walk
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        random_seed: [2026110551, 2026110552, 2026110553, 2026110554]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact block MILP runtime
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Optimize private owners under 367-preserving exact four-dimensional block moves
        run: |
          mkdir -p /tmp/c7-port
          python science-boundary/shannon-capacity-c7/code/c7p5_port_aware_block_walk.py \
            science-boundary/shannon-capacity-c7/data/circular-phase-367-2026-11-04.json \
            /tmp/c7-port/status.json /tmp/c7-port/certificate.json \
            /tmp/c7-port/best_private367.ids \
            --random-seed "${{ matrix.random_seed }}" --sweeps 5 --seconds 4
      - name: Verify any p004 candidate
        run: |
          if test -s /tmp/c7-port/certificate.json; then
            git clone --quiet --depth 1 https://github.com/few-shots/few-shots.git /tmp/c7-fewshots
            mkdir -p /tmp/c7-port/shot
            cp /tmp/c7-port/certificate.json /tmp/c7-port/shot/certificate.json
            python /tmp/c7-fewshots/problems/p004-shannon-capacity-c7/verify/verify.py /tmp/c7-port/shot
          else
            echo 'No candidate in this walk.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7-port-walk-${{ matrix.random_seed }}
          path: |
            /tmp/c7-port/status.json
            /tmp/c7-port/best_private367.ids
            /tmp/c7-port/certificate.json
          retention-days: 14
