name: temp p004 constructive orientable t11 and 365-point auxiliary
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-p004-t11-construct.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temp-p004-t11-construct
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {state: 0, seed: 202611121}
          - {state: 1, seed: 202611122}
          - {state: 0, seed: 202611123}
          - {state: 1, seed: 202611124}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact slice optimizer and FFT
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Fetch independently pinned public 367-code auxiliaries
        run: |
          git init --quiet /tmp/c7-tandon
          git -C /tmp/c7-tandon fetch --quiet --depth 1 https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git c753408492dde92a239708986d16c15dbf6c3235
          git -C /tmp/c7-tandon checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-tandon rev-parse HEAD)" = c753408492dde92a239708986d16c15dbf6c3235
          git init --quiet /tmp/c7-five
          git -C /tmp/c7-five fetch --quiet --depth 1 https://github.com/molind/c7-five.git ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
          git -C /tmp/c7-five checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-five rev-parse HEAD)" = ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
      - name: Construct fully orientable eleven-port C7^5 code and D-free auxiliary
        run: |
          mkdir -p /tmp/c7-t11
          python science-boundary/shannon-capacity-c7/code/c7p004_orientable_t11_construct.py \
            science-boundary/shannon-capacity-c7/data/circular-neutral-high-port-p004.json \
            /tmp/c7-tandon /tmp/c7-five /tmp/c7-t11 \
            --state "${{ matrix.state }}" --seed "${{ matrix.seed }}" --moves 320 --seconds 2
      - name: Independently replay any constructed ten-dimensional improvement
        run: |
          if test -s /tmp/c7-t11/certificate.json; then
            python science-boundary/shannon-capacity-c7/code/c7p004_independent_bitset_verify.py \
              /tmp/c7-t11/certificate.json | tee /tmp/c7-t11/independent.json
            git clone --quiet --depth 1 https://github.com/few-shots/few-shots.git /tmp/fewshots
            python /tmp/fewshots/problems/p004-shannon-capacity-c7/verify/verify.py \
              /tmp/c7-t11 | tee /tmp/c7-t11/verdict.json
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/c7-t11')
          v=json.loads((p/'verdict.json').read_text())
          assert v['valid'] and int(v['score'])>=134754,v
          print('NEW_P004_RECORD_VERIFIED',json.dumps(v,sort_keys=True))
          PY
          else
            echo 'No 11-port + 365 auxiliary certificate yet.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7-t11-construct-state-${{ matrix.state }}-seed-${{ matrix.seed }}
          path: /tmp/c7-t11/
          retention-days: 14
