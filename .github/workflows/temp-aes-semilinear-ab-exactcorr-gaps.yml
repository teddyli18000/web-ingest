name: temp-aes-semilinear-ab-exactcorr-gaps

on:
  push:
    paths:
      - '.github/workflows/temp-aes-semilinear-ab-exactcorr-gaps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-aes-semilinear-ab-exactcorr-gaps
  cancel-in-progress: false

jobs:
  exact:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {name: id, c: '0x01', k: 0, prefix: 0}
          - {name: id, c: '0x01', k: 0, prefix: 1}
          - {name: id, c: '0x01', k: 0, prefix: 2}
          - {name: id, c: '0x01', k: 0, prefix: 3}
          - {name: id, c: '0x01', k: 0, prefix: 4}
          - {name: 9d, c: '0x9d', k: 3, prefix: 0}
          - {name: 9d, c: '0x9d', k: 3, prefix: 1}
          - {name: 9d, c: '0x9d', k: 3, prefix: 2}
          - {name: 9d, c: '0x9d', k: 3, prefix: 6}
          - {name: 9d, c: '0x9d', k: 3, prefix: 7}
          - {name: 9d, c: '0x9d', k: 3, prefix: 8}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact correction support <=4
        run: |
          out=/tmp/aes-ab-exactcorr-${{ matrix.name }}-${{ matrix.prefix }}
          mkdir -p "$out"
          python science-boundary/aes-sbox-circuit/search_semilinear_exactcorr.py \
            --c ${{ matrix.c }} --k ${{ matrix.k }} --prefix ${{ matrix.prefix }} \
            --max-support 4 --max-pre 19 --max-out 17 --out "$out" | tee "$out/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aes-ab-exactcorr-${{ matrix.name }}-${{ matrix.prefix }}
          path: /tmp/aes-ab-exactcorr-${{ matrix.name }}-${{ matrix.prefix }}
