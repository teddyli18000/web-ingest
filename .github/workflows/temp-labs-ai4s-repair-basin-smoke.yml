name: temp-labs-ai4s-repair-basin-smoke
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-repair-basin-smoke.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-repair-basin-smoke
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Compile and native integer selftests for genuine/virtual parent conditional repairs
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/recombination_20261105/innovation
          g++ -std=c++17 -O3 -Wall -Wextra basin_search/basin_mask_search.cpp -o /tmp/labs_basinmask
          /tmp/labs_basinmask --selftest
      - name: Six-arm blind frozen-source 9-pair pilot at full wall budget
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/recombination_20261105
          mkdir -p innovation/basin_search/results/pilot_v1
          /tmp/labs_basinmask data/combined/combined10.tsv \
            innovation/basin_search/results/pilot_v1/sessions.tsv \
            innovation/basin_search/results/pilot_v1/novel.tsv 4 150
      - name: Independent exact scoring of all outcomes and recorded novel sequences
        run: |
          set -euo pipefail
          python3 -m pip install -q numpy
          cd science-boundary/labs-ai4s-search/recombination_20261105
          python3 innovation/basin_search/validate_basin.py \
            --parents data/combined/combined10.tsv \
            --sessions innovation/basin_search/results/pilot_v1/sessions.tsv \
            --novel innovation/basin_search/results/pilot_v1/novel.tsv \
            --output innovation/basin_search/results/pilot_v1/analysis.json
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('innovation/basin_search/results/pilot_v1/analysis.json')
          x=json.loads(p.read_text())
          assert x['source_pair_families']==9 and x['pair_seed_contexts']==36 and x['full_session_rows']==216
          assert set(x['by_length'])==set(map(str,[46,47,50,59,60,92,99]))
          print('PASS registered original/virtual B six-arm source-pair pilot')
          PY
      - name: Preserve checked raw descendants and provenance under research topic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,platform,subprocess,pathlib
          d=pathlib.Path('science-boundary/labs-ai4s-search/recombination_20261105/innovation/basin_search/results/pilot_v1')
          (d/'provenance.json').write_text(json.dumps({
           'run_source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           'compiler':subprocess.check_output(['g++','--version'],text=True).splitlines()[0],
           'host':platform.platform(),
           'pair_reps':4,'methods':6,'all_wall_ms_per_context':150,
           'parent_file':'data/combined/combined10.tsv',
           'full_repair':'steepest->64 Tabu7->steepest for every candidate',
           'experiment_is_postrepair_guided':'TRUE'},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/recombination_20261105/innovation/basin_search/results/pilot_v1/
          git commit -m 'research(labs-ai4s): preserve verified real/fake elite donor basin-conditioned repair pilot'
          git pull --rebase origin main
          git push origin HEAD:main
