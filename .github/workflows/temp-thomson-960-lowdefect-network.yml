name: temp Thomson 960 low-defect network

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-lowdefect-network.yml'

jobs:
  expand:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: e569-modes-low
            image: 7
            expected: '444368.5698901982'
            search: modes-low
            rng: 0
          - tag: e569-modes-high
            image: 7
            expected: '444368.5698901982'
            search: modes-high
            rng: 0
          - tag: e569-moto-9301
            image: 7
            expected: '444368.5698901982'
            search: moto
            rng: 9301
          - tag: e569-moto-9302
            image: 7
            expected: '444368.5698901982'
            search: moto
            rng: 9302
          - tag: e1132-modes-low
            image: 5
            expected: '444369.1322280594'
            search: modes-low
            rng: 0
          - tag: e1132-modes-high
            image: 5
            expected: '444369.1322280594'
            search: modes-high
            rng: 0
          - tag: e1132-moto-9401
            image: 5
            expected: '444369.1322280594'
            search: moto
            rng: 9401
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone current Few Shots
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Reproduce low-defect seed
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 science-boundary/thomson-960/code/harvest_20_string_image.py \
            "$RUNNER_TEMP/few-shots" science-boundary/thomson-960/data/basin-20-morph-9136.json \
            --seed 7301 --starts 18 --images 11 --iterations 260 \
            --eta 0.00022 --max-step 0.0006 --image-index '${{ matrix.image }}' \
            --expected '${{ matrix.expected }}' --tol 0.00005 --quench-maxiter 2800 \
            --out "$RUNNER_TEMP/out/seed.json"
      - name: Expand low-defect seed
        shell: bash
        run: |
          set -euo pipefail
          echo "nproc=$(nproc) tag=${{ matrix.tag }} search=${{ matrix.search }}"
          if [[ '${{ matrix.search }}' == modes-low ]]; then
            python3 science-boundary/thomson-960/code/search_seed_multimode_parallel.py \
              "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/out/seed.json" \
              --modes 0,1,2,3,4,5 --amps 0.0025,0.005,0.010,0.020,0.038,0.065 \
              --k 14 --workers "$(nproc)" --maxiter 2500 --keep-basins 24 \
              --out "$RUNNER_TEMP/out/result.json"
          elif [[ '${{ matrix.search }}' == modes-high ]]; then
            python3 science-boundary/thomson-960/code/search_seed_multimode_parallel.py \
              "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/out/seed.json" \
              --modes 6,7,8,9,10,11 --amps 0.0025,0.005,0.010,0.020,0.038,0.065 \
              --k 14 --workers "$(nproc)" --maxiter 2500 --keep-basins 24 \
              --out "$RUNNER_TEMP/out/result.json"
          else
            python3 science-boundary/thomson-960/code/moto_like_saddle_explorer.py \
              "$RUNNER_TEMP/few-shots" --seed-json "$RUNNER_TEMP/out/seed.json" \
              --seed '${{ matrix.rng }}' --population 12 --select 3 --basis-k 12 \
              --scales 0.004,0.007,0.012,0.020,0.032 \
              --mmf-cycles 7 --mmf-steps 60 --mmf-eta 0.00025 --mmf-max-rms 0.000012 \
              --certify-amp 0.002 --out "$RUNNER_TEMP/out/result.json"
          fi
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          r=os.path.join(os.environ['RUNNER_TEMP'],'out')
          s=json.load(open(os.path.join(r,'seed.json'))); d=json.load(open(os.path.join(r,'result.json')))
          print('SEED',s['energy'],s['coord_counts'])
          print('BEST',d.get('best_energy',d.get('best_certified_endpoint_energy')),
                'DELTA_LIVE',d.get('best_delta_vs_live'))
          for b in d.get('lowest_distinct_basins',[])[:18]:
              print('BASIN',b['energy'],b['mode'],b['sign'],b['amp'])
          for q in d.get('results',[]):
              print('SADDLE',q['saddle_energy'],'grad',q['saddle_gradient_rms'],'neg',q['negative_modes'])
              for z in q.get('certified_endpoints',[]): print('END',z['energy'],z['delta_vs_live'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-lowdefect-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 7
