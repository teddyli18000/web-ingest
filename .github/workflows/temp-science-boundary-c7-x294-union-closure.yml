name: Temp Science Boundary C7 x294 union closure

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-x294-union-closure.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-x294-union-closure
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        families: [r0+rank3, r0+x, rank3+x]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public sources read-only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          git init "$RUNNER_TEMP/shannon-source"
          git -C "$RUNNER_TEMP/shannon-source" remote add origin https://github.com/nathanielitty/lower-bounds-for-shannon-capacity.git
          git -C "$RUNNER_TEMP/shannon-source" fetch --depth 1 origin fe8966079013abaac21d1c08441500100f8e3b86
          git -C "$RUNNER_TEMP/shannon-source" checkout FETCH_HEAD
      - name: Install MaxSAT solver
        run: python3 -m pip install --disable-pip-version-check python-sat
      - name: Optimize union closure
        id: search
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shot" "$RUNNER_TEMP/result"
          python3 science-boundary/shannon-capacity-c7/code/rank3_x294_union_closure.py \
            "$RUNNER_TEMP/shannon-source/c7/R367.txt" \
            "$RUNNER_TEMP/few-shots/problems/p004-shannon-capacity-c7/baseline/certificate.json" \
            "$RUNNER_TEMP/shot/certificate.json" \
            "$RUNNER_TEMP/result/status.json" \
            --families '${{ matrix.families }}'
          cat "$RUNNER_TEMP/result/status.json"
          [[ -f "$RUNNER_TEMP/shot/certificate.json" ]] && echo found=true >> "$GITHUB_OUTPUT" || echo found=false >> "$GITHUB_OUTPUT"
      - name: Verify breakthrough with upstream verifier
        if: steps.search.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',0))<=134753: raise SystemExit(f'not a verified breakthrough: {r}')
          print(f"VERIFIED score={r['score']}")
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/certificate.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-x294-union-${{ matrix.families }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 14
      - name: Summarize
        if: always()
        shell: bash
        run: |
          echo '## C7 x294 union closure: ${{ matrix.families }}' >> "$GITHUB_STEP_SUMMARY"
          [[ -f "$RUNNER_TEMP/result/status.json" ]] && { echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$RUNNER_TEMP/result/status.json" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; } || true
          [[ -f "$RUNNER_TEMP/result/verify.json" ]] && { echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$RUNNER_TEMP/result/verify.json" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; } || true
