name: temp-ta41-dynamic-critical-replacement-pilot
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-dynamic-critical-replacement-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-dynamic-critical-replacement-pilot
  cancel-in-progress: false
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        policy: [dynamic, static, core, random]
        parent: [baseline, '124']
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check original experiment syntax
        run: python3 -m py_compile science-boundary/job-shop-ta41/dynamic_critical_replacement.py
      - name: Controlled exact-DAG comparison with equal candidate scoring budgets
        run: |
          python3 science-boundary/job-shop-ta41/dynamic_critical_replacement.py \
            --policy '${{ matrix.policy }}' --parent '${{ matrix.parent }}' --seed 4107 \
            --evaluations 18000 --batch 24 --max-uphill 65 --stall 220 \
            --out 'science-boundary/job-shop-ta41/results/dcpr-${{ matrix.parent }}-${{ matrix.policy }}-4107'
      - name: Official Few Shots verification of strictly improved certificate
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/dcpr-${{ matrix.parent }}-${{ matrix.policy }}-4107"
          if test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist exact test or failures to main with retry
        if: always()
        run: |
          set -euo pipefail
          out='science-boundary/job-shop-ta41/results/dcpr-${{ matrix.parent }}-${{ matrix.policy }}-4107'
          if ! test -d "$out"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): dynamic critical path repair pilot ${{ matrix.parent }} ${{ matrix.policy }}'
          for attempt in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
