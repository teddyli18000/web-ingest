name: temp-git-mirror-e2e

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-git-mirror-e2e.yml'

permissions:
  contents: write
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch persistent reconciler for current fixed Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run git-mirror-reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Self-clean through Contents API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/temp-git-mirror-e2e.yml'
          sha="$(gh api --repo "$GITHUB_REPOSITORY" "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq '.sha')"
          gh api --repo "$GITHUB_REPOSITORY" --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='chore(git-mirror): remove E2E probe' \
            -f sha="$sha" \
            -f branch='main' >/dev/null
