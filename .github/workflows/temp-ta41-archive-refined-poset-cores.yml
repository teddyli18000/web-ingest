name: temp-ta41-archive-refined-poset-cores
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/archive_refined_poset_cores.py'
      - '.github/workflows/temp-ta41-archive-refined-poset-cores.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-archive-refined-poset-cores
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        n: [1,2]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Pin OR-Tools and syntax check
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/archive_refined_poset_cores.py
      - name: Save exact hard-verified necessary arc list for all 13/14 parents
        run: |
          python3 science-boundary/job-shop-ta41/archive_refined_poset_cores.py \
            --nneutral '${{ matrix.n }}' \
            --out 'science-boundary/job-shop-ta41/results/refined-poset-${{ matrix.n }}-core.json'
      - name: Preserve independently auditable arc data
        if: always()
        run: |
          set -euo pipefail
          path='science-boundary/job-shop-ta41/results/refined-poset-${{ matrix.n }}-core.json'
          if ! test -f "$path"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): audit thirteen/fourteen-parent consensus core triples'
          for i in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
