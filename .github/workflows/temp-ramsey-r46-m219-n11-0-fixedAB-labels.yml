name: Temp Ramsey R46 m219 n11=0 labeled fixed-AB cover

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/m219_n11_0_fixed_ab_labels.py
      - .github/workflows/temp-ramsey-r46-m219-n11-0-fixedAB-labels.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-m219-n11-0-fixedAB-labels
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SAT stack
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Download authenticated complete/extreme catalogues and build 84-pair manifest
        id: mk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/catalogs
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r36_12.g6.gz -o /tmp/r46/r36_12.g6.gz
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r45extreme.tar.gz -o /tmp/r46/r45extreme.tar.gz
          echo '17e176a0f7e7397dbca7c9cb6295034dd74cf529ca62e7e717226dc1b0b7b96d  /tmp/r46/r36_12.g6.gz' | sha256sum -c -
          echo '9cfac9dbd1c209cfa342e5d5424df2a7a3fbb008ca00bf0a992e5bbe72f925b6  /tmp/r46/r45extreme.tar.gz' | sha256sum -c -
          PYTHONPATH=science-boundary/ramsey-r46 python science-boundary/ramsey-r46/m219_n11_0_fixed_ab_labels.py self-test
          PYTHONPATH=science-boundary/ramsey-r46 python science-boundary/ramsey-r46/m219_n11_0_fixed_ab_labels.py prepare \
            --r36-12 /tmp/r46/r36_12.g6.gz --r45extreme /tmp/r46/r45extreme.tar.gz \
            --outdir /tmp/r46/catalogs --manifest /tmp/r46/manifest.json
          python - /tmp/r46/manifest.json "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d['counts']=={'A28':8,'A29':1,'B101':1,'B102':76,'branches':84},d['counts']
          with open(sys.argv[2],'a') as f:
              f.write('matrix='+json.dumps({'include':d['branches']},separators=(',',':'))+'\n')
          print('branches',len(d['branches']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-m219-fixedAB-catalogs
          path: |
            /tmp/r46/catalogs
            /tmp/r46/manifest.json
          retention-days: 7

  solve:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ramsey-r46-m219-fixedAB-catalogs
          path: /tmp/r46
      - name: Install pinned SAT stack
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Solve one exact graph-pair branch
        id: solve
        shell: bash
        env:
          CASE: ${{ matrix.case }}
          AO: ${{ matrix.a_ordinal }}
          BO: ${{ matrix.b_ordinal }}
          AE: ${{ matrix.a_edges }}
          BE: ${{ matrix.b_edges }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/r46/out
          set +e
          timeout --signal=TERM --kill-after=20s 420 \
            env PYTHONPATH=science-boundary/ramsey-r46 \
            python science-boundary/ramsey-r46/m219_n11_0_fixed_ab_labels.py solve \
              --catalog-dir /tmp/r46/catalogs --case "$CASE" --a-ordinal "$AO" --b-ordinal "$BO" \
              --solver cadical195 --summary /tmp/r46/out/summary.json --output /tmp/r46/out/candidate.json \
              > /tmp/r46/out/solver.log 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) status=SAT ;;
            20) status=UNSAT ;;
            124|137|143) status=TIMEOUT ;;
            *) status=ERROR ;;
          esac
          if [[ ! -f /tmp/r46/out/summary.json ]]; then
            python - /tmp/r46/out/summary.json "$status" "$rc" "$CASE" "$AO" "$BO" "$AE" "$BE" <<'PY'
          import json,sys
          p,status,rc,case,ao,bo,ae,be=sys.argv[1:]
          d={'campaign':'m219-n11-0-fixedAB-labelled','status':status,'solver_exit':int(rc),'case':int(case),
             'a_ordinal':int(ao),'b_ordinal':int(bo),'a_edges':int(ae),'b_edges':int(be)}
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/r46/out/summary.json
          tail -n 20 /tmp/r46/out/solver.log || true
          [[ "$status" != ERROR ]]
      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate
          cp /tmp/r46/out/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/out/few-shots-verify.json
          python3 - /tmp/r46/out/few-shots-verify.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d.get('valid') is True and str(d.get('score'))=='36',d
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-m219-fixedAB-${{ matrix.case }}-${{ matrix.a_ordinal }}-${{ matrix.b_ordinal }}
          path: /tmp/r46/out
          if-no-files-found: warn
          retention-days: 7

  collect:
    if: always()
    needs: [prepare, solve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-m219-fixedAB-*
          path: /tmp/parts
      - name: Aggregate exact 84-pair cover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python - /tmp/parts /tmp/r46/result.json <<'PY'
          import json,pathlib,shutil,sys
          root=pathlib.Path(sys.argv[1]); rows=[]; verifies=[]; hits=[]
          for p in root.rglob('summary.json'):
              d=json.load(open(p)); rows.append(d)
              c=p.parent/'candidate.json'; v=p.parent/'few-shots-verify.json'
              if c.exists(): hits.append((d,c,v if v.exists() else None))
              if v.exists(): verifies.append(json.load(open(v)))
          rows.sort(key=lambda d:(d['case'],d['a_ordinal'],d['b_ordinal']))
          counts={}
          for r in rows: counts[r['status']]=counts.get(r['status'],0)+1
          d={'campaign':'m219-n11-0-fixedAB-labelled','logical_scope':'remaining m=219 degree sequence 12^30 13^6',
             'proof_cover':'8 A28 x 1 B101 plus 1 A29 x 76 B102; degree-13 placements quantified inside each SAT branch',
             'expected_branches':84,'branches_attempted':len(rows),'status_counts':counts,'all_unsat':len(rows)==84 and counts.get('UNSAT',0)==84,
             'sat_count':counts.get('SAT',0),'timeout_count':counts.get('TIMEOUT',0),
             'verified_sat_count':sum(v.get('valid') is True and str(v.get('score'))=='36' for v in verifies),'rows':rows}
          if hits:
              hd,c,v=hits[0]; shutil.copyfile(c,'/tmp/r46/candidate.json')
              if v: shutil.copyfile(v,'/tmp/r46/few-shots-verify.json')
              d['first_hit']={k:hd.get(k) for k in ('case','a_ordinal','b_ordinal','a_edges','b_edges')}
          open(sys.argv[2],'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in d.items() if k!='rows'},sort_keys=True))
          PY
      - name: Persist campaign and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/m219-n11-0-fixedAB-labelled.json
          [[ ! -f /tmp/r46/candidate.json ]] || cp /tmp/r46/candidate.json science-boundary/ramsey-r46/results/m219-n11-0-fixedAB-hit.json
          [[ ! -f /tmp/r46/few-shots-verify.json ]] || cp /tmp/r46/few-shots-verify.json science-boundary/ramsey-r46/results/m219-n11-0-fixedAB-hit-verify.json
          git rm .github/workflows/temp-ramsey-r46-m219-n11-0-fixedAB-labels.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/m219-n11-0-fixedAB-*.json
          git commit -m 'ramsey-r46: record m219 n11=0 labeled fixed-AB cover'
          for attempt in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((attempt*4)); done
          exit 1
