name: Temp Science Boundary C7 Jplus complete net1 r4

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-jplus-net1-r4.yml
      - science-boundary/shannon-capacity-c7/code/bpz_jplus_seed.py
      - science-boundary/shannon-capacity-c7/code/search_net1_r4_complete.cpp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public sources
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
      - name: Materialize and verify Jplus 134753 seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
          python3 science-boundary/shannon-capacity-c7/code/bpz_jplus_seed.py "$RUNNER_TEMP/tan" "$RUNNER_TEMP/base/certificate.json" "$RUNNER_TEMP/result/base-status.json"
          python3 - "$RUNNER_TEMP/base/certificate.json" "$RUNNER_TEMP/base/ids.txt" <<'PY'
          import json,sys
          pts=json.load(open(sys.argv[1],encoding='utf-8'))['points']
          open(sys.argv[2],'w').write(''.join(f'{x}\n' for x in sorted(int(p,7) for p in pts)))
          PY
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/base" | tee "$RUNNER_TEMP/result/base-verify.json"
          python3 - "$RUNNER_TEMP/result/base-verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1)) != 134753: raise SystemExit(r)
          PY
      - name: Complete unrestricted net1 search through radius4
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp science-boundary/shannon-capacity-c7/code/search_net1_r4_complete.cpp -o "$RUNNER_TEMP/net1-r4"
          export OMP_NUM_THREADS="$(nproc)"
          /usr/bin/time -v "$RUNNER_TEMP/net1-r4" "$RUNNER_TEMP/base/ids.txt" > "$RUNNER_TEMP/result/search.json" 2> "$RUNNER_TEMP/result/search.stderr"
          cat "$RUNNER_TEMP/result/search.json"
          tail -n 160 "$RUNNER_TEMP/result/search.stderr"
      - name: Materialize candidate
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/base/certificate.json" "$RUNNER_TEMP/result/search.json" "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/status.json" <<'PY'
          import json,sys
          bp,sp,outp,stp=sys.argv[1:]
          pts=set(json.load(open(bp,encoding='utf-8'))['points']);s=json.load(open(sp,encoding='utf-8'))
          def dec(z):
              d=[]
              for _ in range(10): d.append(str(z%7));z//=7
              return ''.join(reversed(d))
          st={'search':s,'candidate':False,'score':len(pts)}
          if s.get('kind')!='none':
              rem=[dec(int(z)) for z in s.get('remove',[])];adds=[dec(int(z)) for z in s.get('add',[])]
              if len(set(rem))!=len(rem) or any(p not in pts for p in rem): raise SystemExit('bad removals')
              for p in rem: pts.remove(p)
              if len(set(adds))!=len(adds) or any(p in pts for p in adds): raise SystemExit('bad additions')
              pts.update(adds)
              if len(pts)!=134754: raise SystemExit(('score',len(pts),s))
              st.update(candidate=True,score=134754,removed_points=rem,added_points=adds)
              json.dump({'points':sorted(pts)},open(outp,'w',encoding='utf-8'),separators=(',',':'));open(outp,'a').write('\n')
          json.dump(st,open(stp,'w',encoding='utf-8'),indent=2,sort_keys=True);open(stp,'a').write('\n')
          PY
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify breakthrough with Few Shots verifier
        if: steps.materialize.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1)) <= 134753: raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-jplus-complete-net1-r4
          path: ${{ runner.temp }}/result
          retention-days: 14
