name: Temp GPT MV opening v2

on:
  push:
    paths:
      - "temp-work/gpt-mv-code-native/**"
      - ".github/workflows/temp-gpt-mv-opening-v2.yml"
  workflow_dispatch:

concurrency:
  group: temp-gpt-mv-opening-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: temp-work/gpt-mv-code-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          npm install --no-audit --no-fund
          echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Render opening v2
        run: |
          node export/render.mjs \
            --width 960 --height 540 --fps 15 \
            --start 0 --end 15 \
            --out out/gpt_opening_v2.mp4
      - name: Validate media and shot boundaries
        run: |
          set -euo pipefail
          out=out/gpt_opening_v2.mp4
          ffmpeg -v error -i "$out" -f null -
          meta="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=nw=1 "$out")"
          printf '%s\n' "$meta"
          grep -q '^width=960$' <<<"$meta"
          grep -q '^height=540$' <<<"$meta"
          grep -q '^r_frame_rate=15/1$' <<<"$meta"
          python - <<'PY'
          import json, subprocess
          p='out/gpt_opening_v2.mp4'
          d=float(json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',p]))['format']['duration'])
          assert 14.9 <= d <= 15.1, d
          print('duration_ok', d)
          PY
          ffmpeg -hide_banner -i "$out" -vf "blackdetect=d=0.25:pix_th=0.015" -an -f null - 2>black.log || true
          ! grep -q 'black_duration' black.log
          ffmpeg -y -hide_banner -loglevel error -i "$out" \
            -vf "select='eq(n,45)+eq(n,50)+eq(n,55)+eq(n,100)+eq(n,105)+eq(n,110)+eq(n,155)+eq(n,160)+eq(n,165)',scale=480:-2,tile=3x3:padding=5:margin=5:color=white" \
            -frames:v 1 out/gpt_opening_v2_boundaries.jpg
      - name: Upload visual gate
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mv-opening-v2-${{ github.run_id }}
          path: |
            temp-work/gpt-mv-code-native/out/gpt_opening_v2.mp4
            temp-work/gpt-mv-code-native/out/gpt_opening_v2.contact.jpg
            temp-work/gpt-mv-code-native/out/gpt_opening_v2_boundaries.jpg
          retention-days: 14
          if-no-files-found: error
