name: temp-ta41-compact-15-machine-proof
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/compact_distance15.py'
      - '.github/workflows/temp-ta41-compact-15-machine-proof.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-compact-15-machine-proof
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Pin independent CP-SAT verifier
        run: python -m pip install 'ortools==9.14.6206'
      - name: Construct greedy finite proof and independently verify every chosen machine core
        run: python3 science-boundary/job-shop-ta41/compact_distance15.py --per-core-seconds 55
      - name: Persist transparent proof result, including any UNKNOWN
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/compact-15-machine-proof.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): compact independent proof of 15 changed machines'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
