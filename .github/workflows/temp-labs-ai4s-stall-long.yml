name: temp-labs-ai4s-stall-long
on:
  push:
    paths:
      - ".github/workflows/temp-labs-ai4s-stall-long.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-stall-long
  cancel-in-progress: false
jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Compile and exact selftest
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search
          g++ -O3 -std=c++17 audit_20261029/stall_interventions.cpp -o /tmp/labs_stall_long
          /tmp/labs_stall_long --test
      - name: Freeze an N80 N100 slice from each data quality stratum
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search
          mkdir -p audit_20261029/results
          python3 - <<'PY'
          from pathlib import Path
          d=Path("audit_20261029/results")
          for source,dest in [
              ("frontier_deformation/results/2026-10-29-frontier-elite-eval.tsv","long_frontier_subset.tsv"),
              ("frontier_deformation/results/2026-10-29-strong-corpus.tsv","long_historical_subset.tsv"),
          ]:
              s=Path(source).read_text().splitlines()
              subset=[s[0]]+[x for x in s[1:] if x and int(x.split("\t",1)[0]) in (80,100)]
              (d/dest).write_text("\n".join(subset)+"\n")
              print(dest,len(subset)-1)
              assert len(subset)-1==(2 if dest=="long_frontier_subset.tsv" else 10)
          PY
      - name: 2-second treatment per exact frozen state on unseen horizon
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search
          /tmp/labs_stall_long audit_20261029/results/long_frontier_subset.tsv audit_20261029/results/frozen_frontier_long_v2.tsv 2000 1 9 10 400 12000
          /tmp/labs_stall_long audit_20261029/results/long_historical_subset.tsv audit_20261029/results/frozen_historical_long_v2.tsv 2000 1 9 10 400 12000
      - name: Independent exact-output verification and cluster analysis
        run: |
          set -euo pipefail
          python3 -m pip install -q numpy pandas
          cd science-boundary/labs-ai4s-search
          python3 audit_20261029/analyze_stalls.py audit_20261029/results/frozen_frontier_long_v2.tsv audit_20261029/results/frozen_historical_long_v2.tsv --out audit_20261029/results/paired_summary_long_v2.json
          python3 - <<'PY'
          import csv,hashlib,json,pathlib
          d=pathlib.Path("audit_20261029/results")
          hashes={}
          for n,rows in [("frozen_frontier_long_v2.tsv",14),("frozen_historical_long_v2.tsv",70)]:
              p=d/n;rs=list(csv.DictReader(p.open(),delimiter="\t"))
              assert len(rs)==rows
              assert all(int(r['bestE'])<=int(r['frozenBestE']) for r in rs)
              assert all(2.0<=float(r['elapsed_seconds'])<2.25 for r in rs)
              hashes[n]=hashlib.sha256(p.read_bytes()).hexdigest()
          (d/"long_v2_checksums.json").write_text(json.dumps(hashes,indent=2)+"\n")
          PY
      - name: Commit exact verified, provenance-labeled mechanism data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science-boundary/labs-ai4s-search/audit_20261029/results/
          git commit -m "research(labs-ai4s): verify longer-horizon frozen historical and frontier interventions"
          git pull --rebase origin main
          git push origin HEAD:main
