name: temp-aes-shear-joint-and-refactor
on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/make_and_shear_102.py'
      - '.github/workflows/temp-aes-shear-joint-and-refactor.yml'
permissions:
  contents: read
jobs:
  constructive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Generate verified changed-AND 102 seed
        run: |
          set -euxo pipefail
          python science-boundary/aes-sbox-circuit/make_and_shear_102.py --out shear102.json
      - name: Jointly alter both AND operands and preserve new circuit variants
        run: |
          set -euxo pipefail
          python science-boundary/aes-sbox-circuit/enumerate_joint_and_factorizations.py \
            --seed-file shear102.json --seed-label fs101-shear102 \
            --shard '${{ matrix.shard }}' --shards 8 \
            --max-reps 6 --max-kept 400 --keep-delta 0 --out result | tee run.log
          python -c "import json; d=json.load(open('result/summary.json')); assert d['verified_best']; print(d['best_gates'],d['kept_by_size'])"
      - name: Independent all-256 validation and official <=100 verifier
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json,glob,sys
          sys.path.insert(0,'science-boundary/aes-sbox-circuit')
          import released_and_skeleton as ras
          files=glob.glob('result/candidate-*.json')
          for name in files:
              assert ras.independent_check(json.load(open(name)))[0],name
          print(json.dumps({'validated_full_circuits':len(files)}))
          PY
          if [ "$(python -c "import json; print(json.load(open('result/summary.json'))['best_gates'])")" -le 100 ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/p008shot
            cp result/best.json /tmp/p008shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/p008shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-shear-joint-and-${{ matrix.shard }}
          path: |
            result
            run.log
            official-verifier.jsonl
