name: temp Thomson 960 cross-topology Hamiltonian braid hunt

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-cross-topology-braid.yml'

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        seed: [4404, 5505]
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: few-shots/few-shots
          path: few-shots
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy numba
      - name: Compile and check candidate generator
        run: python3 -m py_compile science-boundary/thomson-960/code/search_hamiltonian_scar_braid.py
      - uses: actions/download-artifact@v4
        with:
          pattern: thomson-saddle-chord-886-*
          path: ${{ runner.temp }}/chords
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41857433482
      - name: Search R/A/B/D2 parents with scar-coupled area-preserving transport
        run: |
          python3 science-boundary/thomson-960/code/search_hamiltonian_scar_braid.py \
            few-shots --chord-dir "$RUNNER_TEMP/chords" \
            --seed ${{ matrix.seed }} --trials 320 --maxiter 700 \
            --temp 0.10 --out "$RUNNER_TEMP/out"
      - name: Candidate evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/'result.json'
          if not p.exists():
              print('NO_RESULT_JSON');raise SystemExit(0)
          d=json.loads(p.read_text());rows=[r for r in d['rows'] if 'energy' in r]
          print('SEED',d['seed'],'TRIALS',d['trials_done'],'BEST',d['best_energy'],
                'DELTA',d['best_delta_record'],'CANDIDATES',d['candidates_below_record'])
          for m in ('vortices','dipole','braid','randomcap'):
              z=[r for r in rows if r['mode']==m]
              print('MODE',m,'trials',len(z),'best_delta',
                    min((r['delta_record'] for r in z),default=None),
                    'new_basin_0.05',sum(r['unique'] and r['delta_record']<0.05 for r in z))
          print('POOL',[(v['energy'],v['tag']) for v in d['population']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-cross-topology-braid-seed-${{ matrix.seed }}
          path: ${{ runner.temp }}/out
          retention-days: 10
