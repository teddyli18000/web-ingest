name: Temp Science Boundary C7 FunSearch basin isomorphism

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-funsearch-basin-isomorphism.yml
      - science-boundary/shannon-capacity-c7/code/bpz_t9_funsearch_basin_isomorphism.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Tan source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
      - name: Install numpy
        run: python3 -m pip install --disable-pip-version-check numpy
      - name: Verify explicit basin bijection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          python3 science-boundary/shannon-capacity-c7/code/bpz_t9_funsearch_basin_isomorphism.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/status.json"
          cat "$RUNNER_TEMP/result/status.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-funsearch-basin-isomorphism
          path: ${{ runner.temp }}/result
          retention-days: 14
