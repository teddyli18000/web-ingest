name: temp Thomson 960 shared N961 hub mode return

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-n961-hub-mode-return.yml'

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: modes0-2
            modes: '0,1,2'
          - tag: modes3-5
            modes: '3,4,5'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - run: python3 -m py_compile science-boundary/thomson-960/code/search_n961_hub_mode_return.py
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Search shared-hub soft-mode exits
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) tag=${{ matrix.tag }} live=$live"
          python3 science-boundary/thomson-960/code/search_n961_hub_mode_return.py \
            "$RUNNER_TEMP/seed/A-natural.json" --rank 3 --delete-index 886 \
            --modes '${{ matrix.modes }}' --amps '.004,.008,.014,.022,.035' --k 10 \
            --hub-maxiter 3200 --return-maxiter 3600 --live-score "$live" \
            --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('HUB',d['hub_energy'],'LAMBDAS',d['eigenvalues'])
          print('BEST',d['best_energy'],'DELTA',d['best_delta_live'])
          for r in d['rows'][:20]:
              print('RET',r['mode'],r['sign'],r['amp'],r['class'],r['energy'],r['delta_live'],r['coord_counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-n961-hub-mode-return-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 10
