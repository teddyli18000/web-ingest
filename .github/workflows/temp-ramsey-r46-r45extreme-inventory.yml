name: Temp Ramsey R46 R45 extreme catalogue inventory

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/r45_extreme_inventory.py
      - .github/workflows/temp-ramsey-r46-r45extreme-inventory.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-r45extreme-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and inventory published archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r45extreme.tar.gz \
            -o /tmp/r46/r45extreme.tar.gz
          python science-boundary/ramsey-r46/r45_extreme_inventory.py self-test
          python science-boundary/ramsey-r46/r45_extreme_inventory.py inventory \
            --archive /tmp/r46/r45extreme.tar.gz \
            --out /tmp/r46/inventory.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/r46/inventory.json'))
          print('n=23 edge strata:', d['counts'].get('23', {}))
          assert '23' in d['counts']
          assert '101' in d['counts']['23']
          PY
      - name: Persist exact inventory and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          dest=science-boundary/ramsey-r46/results/r45extreme-inventory.json
          cp /tmp/r46/inventory.json "$dest"
          git rm .github/workflows/temp-ramsey-r46-r45extreme-inventory.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$dest"
          git commit -m 'ramsey-r46: record R45 extreme catalogue inventory'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-r45extreme-inventory
          path: /tmp/r46
          if-no-files-found: warn
          retention-days: 7
