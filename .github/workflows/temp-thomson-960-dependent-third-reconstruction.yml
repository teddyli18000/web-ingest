name: temp Thomson 960 dependent third reconstruction

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-dependent-third-reconstruction.yml'

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        third_multiplier: ['1.002','1.01','1.04']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-dependent-orbit4-1.04
          path: ${{ runner.temp }}/dep
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41058090920
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Cross newly created third event and release
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) third_multiplier=${{ matrix.third_multiplier }} live=$live"
          python3 science-boundary/thomson-960/code/search_dependent_third_flip_homotopy.py \
            "$RUNNER_TEMP/dep/result.json" \
            --third-quad '511,599,282,502' --third-multiplier '${{ matrix.third_multiplier }}' \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('THIRD',d['third_quad'],'T',d['third_threshold'],'MULT',d['third_multiplier'])
          print('FIXED',d['fixed_energy'],d['fixed_signature'],d['fixed_coord'])
          print('LAST_CHAIN',None if d['last_chain_state'] is None else {k:v for k,v in d['last_chain_state'].items() if k!='points'})
          print('FIRST_LOST',d['first_lost_state'])
          print('FINAL',{k:v for k,v in d['final'].items() if k!='points'})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-dependent-third-${{ matrix.third_multiplier }}
          path: ${{ runner.temp }}/out
          retention-days: 10
