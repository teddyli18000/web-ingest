name: Temp Ramsey R46 exact extension check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-ramsey-r46-extension.yml
      - science-boundary/ramsey-r46/extension_check.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-extension
  cancel-in-progress: false

jobs:
  exact-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run exact check on all 37 published graphs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r46"
          /usr/bin/time -v python3 science-boundary/ramsey-r46/extension_check.py \
            --fetch-all \
            --json-out "$RUNNER_TEMP/r46/extension-results.json" \
            | tee "$RUNNER_TEMP/r46/extension-results.log"

      - name: Validate complete result
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/r46/extension-results.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['graphs'] == 37, data
          assert data['all_solver_agreement'] is True, data
          print(f"graphs={data['graphs']} extendable={data['extendable']}")
          for row in data['results']:
              assert row['n'] == 35, row
              assert len(row['sha256']) == 64, row
          PY

      - name: Commit durable result
        shell: bash
        run: |
          set -euo pipefail
          dest="science-boundary/ramsey-r46/results/extension-all-37.json"
          mkdir -p "$(dirname "$dest")"
          cp "$RUNNER_TEMP/r46/extension-results.json" "$dest"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$dest"
          if git diff --cached --quiet; then
            echo "result unchanged"
            exit 0
          fi
          git commit -m "science-boundary: record exact R(4,6) extension sweep"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload exact results
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-extension-results
          path: |
            ${{ runner.temp }}/r46/extension-results.json
            ${{ runner.temp }}/r46/extension-results.log
          retention-days: 7

      - name: Summarize
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/r46/extension-results.json" ]]; then
            python3 - "$RUNNER_TEMP/r46/extension-results.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print(f"## R(4,6) one-vertex extension check\n\n- graphs: {d['graphs']}\n- extendable: {d['extendable']}\n- independent exact solvers agreed: {d['all_solver_agreement']}")
          print("\n| graph | orientation | triangles | independent 5-sets | extendable | seconds |")
          print("|---|---|---:|---:|---|---:|")
          for r in d['results']:
              print(f"| {r['name']} | {r['orientation']} | {r['triangles']} | {r['independent5']} | {r['extendable']} | {r['seconds']} |")
          PY
          fi
