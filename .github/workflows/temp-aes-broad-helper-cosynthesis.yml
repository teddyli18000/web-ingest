name: temp-aes-broad-helper-cosynthesis
on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/semantic_broad_helpers.py'
      - '.github/workflows/temp-aes-broad-helper-cosynthesis.yml'
permissions:
  contents: read
  actions: read
jobs:
  construct:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - parents: 64
            helpers: 48
            extra: ''
          - parents: 110
            helpers: 128
            extra: ''
          - parents: 110
            helpers: 72
            extra: '--include-and'
          - parents: 160
            helpers: 180
            extra: '--include-and'
    steps:
      - uses: actions/checkout@v4
      - name: Import verified nonlinear architecture parents
        uses: actions/download-artifact@v4
        with:
          run-id: 40996646594
          github-token: ${{ github.token }}
          pattern: aes-joint-factor-*
          path: parent-archive
          merge-multiple: false
      - name: Import verified 101-gate neutral parents
        uses: actions/download-artifact@v4
        with:
          run-id: 42252448125
          github-token: ${{ github.token }}
          pattern: aes-care-cone-fs-101-*
          path: parent-archive
          merge-multiple: false
      - name: Include validated nonlinear AND-shear seed
        run: |
          set -euxo pipefail
          mkdir -p parent-archive/shear
          python science-boundary/aes-sbox-circuit/make_and_shear_102.py --out parent-archive/shear/candidate-shear102.json
      - name: Jointly synthesize new helper functions and the complete circuit
        run: |
          set -euxo pipefail
          python -m pip install --quiet ortools
          python -m py_compile science-boundary/aes-sbox-circuit/semantic_broad_helpers.py
          python science-boundary/aes-sbox-circuit/semantic_broad_helpers.py \
            --archive-dir parent-archive --max-source-gates 102 \
            --max-parents '${{ matrix.parents }}' --new-helpers '${{ matrix.helpers }}' \
            --force-new-and ${{ matrix.extra }} --seconds 450 --workers 4 \
            --rng '${{ matrix.helpers }}' --out result | tee run.log
          python -c "import json; d=json.load(open('result/summary.json')); assert d['verified_all_256']; print(d)"
      - name: Independently run official verifier for any <=100 certificate
        run: |
          set -euxo pipefail
          if [ -f result/candidate.json ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/p008shot
            cp result/candidate.json /tmp/p008shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/p008shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-broad-helper-${{ matrix.parents }}-${{ matrix.helpers }}
          path: |
            result
            run.log
            official-verifier.jsonl
