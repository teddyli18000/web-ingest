name: Riemann-Weil prime-edge Schur residuals

on:
  push:
    branches: [main]
    paths:
      - 'temp-work/riemann-weil-research/experiments/prime_edge_schur_residuals.py'
      - '.github/workflows/riemann-weil-prime-edge-residuals.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riemann-weil-prime-edge-residuals-main
  cancel-in-progress: false

jobs:
  edge:
    strategy:
      fail-fast: false
      matrix:
        q: [2, 3, 5, 7, 17, 97]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install interval dependencies
        run: python -m pip install --disable-pip-version-check python-flint mpmath
      - name: Fetch pinned public verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/akivag613/connes-cvs-.git upstream-connes-cvs
          git -C upstream-connes-cvs checkout --quiet 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c
          test "$(git -C upstream-connes-cvs rev-parse HEAD)" = '5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c'
      - name: Compute prime-edge Schur residuals
        run: |
          set -euo pipefail
          python temp-work/riemann-weil-research/experiments/prime_edge_schur_residuals.py \
            --upstream-script upstream-connes-cvs/papers/2_guinand_weil_dictionary_tail_order/scripts/arb_ldlt_certify.py \
            --upstream-commit 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c \
            --q '${{ matrix.q }}' --Nmax 32 --prec 3000 \
            --output 'edge-q${{ matrix.q }}.json'
          python -m json.tool 'edge-q${{ matrix.q }}.json' >/dev/null
      - name: Upload edge result
        uses: actions/upload-artifact@v4
        with:
          name: prime-edge-q${{ matrix.q }}
          path: edge-q${{ matrix.q }}.json
          retention-days: 1

  collect:
    needs: edge
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download edge results
        uses: actions/download-artifact@v4
        with:
          pattern: prime-edge-q*
          path: edges
          merge-multiple: true
      - name: Merge results
        run: |
          python - <<'PY'
          import glob, json, math
          from pathlib import Path
          rows=[]
          for f in sorted(glob.glob('edges/edge-q*.json')):
              d=json.loads(Path(f).read_text())
              mids=[float(x['impulse_magnitude_aq_R2']['mid']) for x in d['rows']]
              absR=[abs(float(x['residual']['mid'])) for x in d['rows']]
              rows.append({
                  'q':d['q'], 'prime':d['prime'], 'exponent':d['exponent'],
                  'a_q':d['a_q_equals_2_over_k_sqrt_q'],
                  'ldlt_signs':d['ldlt_signs'],
                  'max_impulse_mid':max(mids),
                  'max_impulse_at_N':mids.index(max(mids)),
                  'min_abs_residual_mid':min(absR),
                  'min_abs_residual_at_N':absR.index(min(absR)),
                  'largest_impulse_modes_midpoint_order':d['largest_impulse_modes_midpoint_order'],
                  'selected':d['selected'],
              })
          out={
              'status':'prime_edge_schur_residual_map',
              'Nmax':32,
              'prec_bits':3000,
              'rows':sorted(rows,key=lambda r:r['q']),
              'identity':'Delta s_N prime-edge derivative = -a_q R_{N,q}^2, with a_q=2/(k sqrt(q)).',
              'warning':'Finite pinned CvS path only; no RH claim.',
          }
          p=Path('temp-work/riemann-weil-research/results/prime-edge-schur-residual-map-q2-3-5-7-17-97-N32.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({
              'status':out['status'],
              'summary':[
                  {'q':r['q'],'max_impulse_mid':r['max_impulse_mid'],'max_at_N':r['max_impulse_at_N'],
                   'min_abs_R_mid':r['min_abs_residual_mid'],'min_R_at_N':r['min_abs_residual_at_N'],
                   'negative_prefix_count':sum(s<0 for s in r['ldlt_signs'])}
                  for r in out['rows']
              ]
          },indent=2))
          PY
      - name: Commit result safely
        run: |
          set -euo pipefail
          git config user.name 'riemann-weil-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          path='temp-work/riemann-weil-research/results/prime-edge-schur-residual-map-q2-3-5-7-17-97-N32.json'
          git add "$path"
          git diff --cached --quiet && exit 0
          git commit -m 'research: record prime-edge Schur residual map'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
