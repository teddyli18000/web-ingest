name: Temp Science Boundary C7 neutral5 irreducible killer audit

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-neutral5-killer-audit.yml
      - science-boundary/shannon-capacity-c7/code/bpz_neutral5_irreducible_killer_audit.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-neutral5-killer-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned BPZ source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/result"
      - name: Exact neutral5 owner/killer audit
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_neutral5_irreducible_killer_audit.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/audit.json" --workers "$(nproc)" \
            > "$RUNNER_TEMP/result/stdout" 2> "$RUNNER_TEMP/result/stderr"
          cat "$RUNNER_TEMP/result/stdout"
          tail -n 160 "$RUNNER_TEMP/result/stderr"
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-neutral5-killer-audit
          path: ${{ runner.temp }}/result
          retention-days: 14
