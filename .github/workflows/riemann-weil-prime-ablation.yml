name: Riemann-Weil prime-power Schur ablation

on:
  push:
    branches: [main]
    paths:
      - 'temp-work/riemann-weil-research/experiments/prime_power_ablation_schur.py'
      - '.github/workflows/riemann-weil-prime-ablation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riemann-weil-prime-ablation-main
  cancel-in-progress: false

jobs:
  ablate:
    strategy:
      fail-fast: false
      matrix:
        q: [2, 3, 5, 7, 79]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install interval dependencies
        run: python -m pip install --disable-pip-version-check python-flint mpmath
      - name: Fetch pinned public verifier
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/akivag613/connes-cvs-.git upstream-connes-cvs
          git -C upstream-connes-cvs checkout --quiet 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c
          test "$(git -C upstream-connes-cvs rev-parse HEAD)" = '5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c'
      - name: Run prime-power ablation
        run: |
          set -euo pipefail
          python temp-work/riemann-weil-research/experiments/prime_power_ablation_schur.py \
            --upstream-script upstream-connes-cvs/papers/2_guinand_weil_dictionary_tail_order/scripts/arb_ldlt_certify.py \
            --upstream-commit 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c \
            --c 100 --Nmax 80 --prec 5000 --q '${{ matrix.q }}' \
            --output 'ablation-q${{ matrix.q }}.json'
          python -m json.tool 'ablation-q${{ matrix.q }}.json' >/dev/null
      - name: Upload ablation
        uses: actions/upload-artifact@v4
        with:
          name: schur-ablation-q${{ matrix.q }}
          path: ablation-q${{ matrix.q }}.json
          retention-days: 1

  collect:
    needs: ablate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download ablations
        uses: actions/download-artifact@v4
        with:
          pattern: schur-ablation-q*
          path: ablations
          merge-multiple: true
      - name: Merge results
        run: |
          python - <<'PY'
          import glob, json
          from pathlib import Path
          rows=[]
          for f in sorted(glob.glob('ablations/ablation-q*.json')):
              rows.append(json.loads(Path(f).read_text()))
          out={
              'status':'prime_power_schur_ablation_controls',
              'c':100,
              'Nmax':80,
              'prec_bits':5000,
              'rows':rows,
          }
          p=Path('temp-work/riemann-weil-research/results/prime-power-schur-ablation-c100-N80.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(out, indent=2)+'\n')
          print(json.dumps({
              'status':out['status'],
              'summary':[
                  {
                      'q':r['removed_prime_power']['q'],
                      'ablated_undetermined_at':r['ablated_undetermined_at'],
                      'top_response':[
                          {'N':x['N'],'log10_ratio':x.get('log10_abs_ablated_over_baseline_mid')}
                          for x in r['top_response_modes'][:3]
                      ]
                  } for r in rows
              ]
          }, indent=2))
          PY
      - name: Commit result safely
        run: |
          set -euo pipefail
          git config user.name 'riemann-weil-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          path='temp-work/riemann-weil-research/results/prime-power-schur-ablation-c100-N80.json'
          git add "$path"
          git diff --cached --quiet && exit 0
          git commit -m 'research: record prime-power Schur ablations'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
