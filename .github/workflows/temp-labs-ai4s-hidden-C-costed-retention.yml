name: temp-labs-ai4s-hidden-C-costed-retention
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-hidden-C-costed-retention.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-hidden-C-costed-retention
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Compile frozen source and perform all exact total-cost searches, then C-only verifier
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/recombination_20261105/innovation/hidden_C_20261108
          g++ -std=c++17 -O3 hidden_repair.cpp -o /tmp/labs_hidden_retention
          /tmp/labs_hidden_retention selftest
          python3 run_retention.py --exe /tmp/labs_hidden_retention --budget-ms 150
      - name: Preserve only complete exact verified results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/recombination_20261105/innovation/hidden_C_20261108/results/branch_deploy_v1
          git commit -m 'research(labs-ai4s): verify two complete original-X-retained and greedy repair search campaigns'
          ok=0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then ok=1; break; fi
          done
          test "$ok" -eq 1
