name: temp-labs-ai4s-native-plateau-audit
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-native-plateau-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plateau-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Analyze exact native local best updates after different plateau lengths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q numpy pandas
          cd science-boundary/labs-ai4s-search/trajectory_20261104
          python3 analyze_plateau_native.py results/native_mini_v1 --output results/native_plateau_v1
      - name: Validate structural accounting and compressed deliverables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, gzip,csv
          p=pathlib.Path("science-boundary/labs-ai4s-search/trajectory_20261104/results/native_plateau_v1")
          r=json.loads((p/"native_plateau_summary.json").read_text())
          assert r["runs"]==12 and r["episodes"]==5057
          assert r["events"]==60840
          with gzip.open(p/"native_best_transitions.tsv.gz",'rt') as f:
            rows=csv.DictReader(f,delimiter="\t")
            count=0
            for x in rows:
              assert int(x["deltaOdd"])+int(x["deltaEven"])==-int(x["improvement"])
              assert int(x["gap_steps"])>=0
              assert int(x["improvement"])>0
              count+=1
          assert count==60840
          print("VERIFIED",count,"best transitions")
          PY
      - name: Commit audited results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/trajectory_20261104/results/native_plateau_v1/
          git commit -m 'research(labs-ai4s): preserve exact native tabu plateau-break and odd-even structure statistics'
          git pull --rebase origin main
          git push origin HEAD:main
