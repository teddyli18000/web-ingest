name: Temp Ramsey R46 m219 r3 column CSP B0-B1

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/m219_r3_column_csp.cpp
      - .github/workflows/temp-ramsey-r46-m219-r3-column-csp-b01.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-m219-r3-column-csp-b01
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build exact column-domain CSP
        run: g++ -O3 -std=c++17 science-boundary/ramsey-r46/m219_r3_column_csp.cpp -o /tmp/m219csp
      - name: Structural self-test and known-UNSAT cross-check
        shell: bash
        run: |
          set -euo pipefail
          /tmp/m219csp --self-test
          set +e
          /tmp/m219csp 1 4 0 30 /tmp/should-not-exist.json 2>/tmp/check-a1.json
          rc1=$?
          /tmp/m219csp 0 4 1 30 /tmp/should-not-exist2.json 2>/tmp/check-a0.json
          rc2=$?
          set -e
          cat /tmp/check-a1.json
          cat /tmp/check-a0.json
          test "$rc1" -eq 20
          test "$rc2" -eq 20
          test ! -e /tmp/should-not-exist.json
          test ! -e /tmp/should-not-exist2.json

  solve:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        a: [0, 1]
        b: [0, 1]
        seq: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build exact column-domain CSP
        run: g++ -O3 -std=c++17 science-boundary/ramsey-r46/m219_r3_column_csp.cpp -o /tmp/m219csp
      - name: Solve exact sequence branch
        id: solve
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/r46
          set +e
          timeout --signal=TERM --kill-after=15s 630 \
            /tmp/m219csp '${{ matrix.a }}' '${{ matrix.b }}' '${{ matrix.seq }}' 600 \
            /tmp/r46/candidate.json 2>/tmp/r46/summary.json
          rc=$?
          set -e
          case "$rc" in
            10) status=SAT ;;
            20) status=UNSAT ;;
            124|137|143) status=TIMEOUT ;;
            *) status=ERROR ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/r46/summary.json
          test "$status" != ERROR
      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate
          cp /tmp/r46/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/few-shots-verify.json
          python3 - /tmp/r46/few-shots-verify.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('valid') is True and str(d.get('score')) == '36', d
          PY
      - name: Upload exact branch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-m219-r3-column-${{ matrix.a }}-${{ matrix.b }}-${{ matrix.seq }}
          path: /tmp/r46
          if-no-files-found: warn
          retention-days: 7

  collect:
    if: always()
    needs: [validate, solve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-m219-r3-column-*
          path: /tmp/parts
      - name: Aggregate pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 - /tmp/parts /tmp/r46/result.json <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          rows=[]; hits=[]
          for p in root.rglob('summary.json'):
              try: d=json.load(open(p))
              except Exception: continue
              rows.append(d)
              cand=p.parent/'candidate.json'; ver=p.parent/'few-shots-verify.json'
              if cand.exists(): hits.append({'a':d['a'],'b':d['b'],'seq':d['seq'],'candidate':str(cand),'verified':ver.exists()})
          rows.sort(key=lambda d:(d['a'],d['b'],d['seq']))
          result={
            'campaign':'m219-r3-column-csp-b01',
            'logical_scope':'exact sequence-split column-domain CSP pilot for the two hardest B116 ordinals 0 and 1',
            'representation':'24 B-column variables over 11-bit Aut(A)-canonical cross-neighborhood domains',
            'expected_branches':32,
            'rows':rows,
            'complete':len(rows)==32,
            'unsat_count':sum(r['status']=='UNSAT' for r in rows),
            'timeout_count':sum(r['status']=='TIMEOUT' for r in rows),
            'sat_count':sum(r['status']=='SAT' for r in rows),
            'all_unsat':len(rows)==32 and all(r['status']=='UNSAT' for r in rows),
            'hits':hits,
          }
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k not in {'rows','hits'}},sort_keys=True))
          PY
      - name: Persist campaign and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/m219-r3-column-csp-b01.json
          for cand in /tmp/parts/*/candidate.json; do
            [[ -f "$cand" ]] || continue
            tag=$(basename "$(dirname "$cand")" | sed 's/ramsey-r46-m219-r3-column-//')
            cp "$cand" "science-boundary/ramsey-r46/results/m219-r3-column-${tag}-candidate.json"
            ver="$(dirname "$cand")/few-shots-verify.json"
            [[ ! -f "$ver" ]] || cp "$ver" "science-boundary/ramsey-r46/results/m219-r3-column-${tag}-verify.json"
          done
          git rm .github/workflows/temp-ramsey-r46-m219-r3-column-csp-b01.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/m219-r3-column-*
          git commit -m 'ramsey-r46: record m219 r3 column-CSP B0-B1 pilot' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
