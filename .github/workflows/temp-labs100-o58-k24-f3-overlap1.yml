name: temp labs100 O58 K24 F3 one-overlap exact
on:
  push:
    paths:
      - '.github/workflows/temp-labs100-o58-k24-f3-overlap1.yml'
  workflow_dispatch:
concurrency:
  group: temp-labs100-o58-k24-f3-overlap1
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact GF3 producer and generalized fibre oracle
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-100
          g++ -O3 -std=c++20 -DNDEBUG -fopenmp code/o58_k24_overlap1_compressed_exact.cpp -o "$RUNNER_TEMP/producer"
          g++ -O3 -std=c++20 -DNDEBUG -fopenmp code/o58_qgroup_budget_exact.cpp -o "$RUNNER_TEMP/fibre"
      - name: Exact F3 support, signed periodic and negacyclic filters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          python3 science-boundary/labs-100/code/o58_k24_overlap1_supports.py outputs/supports.csv | tee outputs/supports.log
          export OMP_NUM_THREADS="$(nproc)"
          "$RUNNER_TEMP/producer" outputs/supports.csv > outputs/compressed.log
          grep '^SUMMARY ' outputs/compressed.log
          emitted=$(grep -c '^HIT ' outputs/compressed.log || true)
          declared=$(sed -n 's/.* qmin64=\([0-9]*\).*/\1/p' outputs/compressed.log | tail -1)
          [[ "$emitted" == "$declared" ]]
          [[ "$emitted" == 314 ]]
          "$RUNNER_TEMP/fibre" 0 outputs/compressed.log 128 > outputs/fibre.log
          grep '^SUMMARY ' outputs/fibre.log
          grep '^QHIT ' outputs/fibre.log || true
          python3 - <<'PY'
          import re
          x=open('outputs/compressed.log').read()
          m=re.search(r'^SUMMARY supports=(\d+) ptests=(\d+) modular_systems=(\d+) exact=(\d+) minSG=(\d+) minQ=(\d+) qmin64=(\d+) maxfree=(\d+)$',x,re.M)
          assert m
          assert list(map(int,m.groups()))==[4742,2190804,1526988,2739,45,27,314,6],m.groups()
          y=open('outputs/fibre.log').read()
          assert re.search(r'^SUMMARY budget=128 .*$',y,re.M)
          print('K24_F3_Q_AUDIT',re.search(r'^SUMMARY budget=128 .*$',y,re.M).group(0))
          PY
      - name: Archive complete exact transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-o58-k24-f3-overlap1
          path: outputs/
          retention-days: 30
