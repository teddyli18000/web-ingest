name: temp Baidu Drive API probe

on:
  push:
    paths:
      - '.github/workflows/temp-baidu-resume-accepted.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BAIDU_DRIVE_BAIDU_SESSION: ${{ secrets.BAIDU_DRIVE_BAIDU_SESSION }}
      BAIDU_DRIVE_RCLONE_CONFIG: ${{ secrets.BAIDU_DRIVE_RCLONE_CONFIG }}
      BAIDU_DRIVE_STATE_KEY: ${{ secrets.BAIDU_DRIVE_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            baidu-drive
      - run: python3 -m pip install "cryptography==46.0.4"
      - name: Create private runner-only rclone configuration
        run: python3 baidu-drive/auth_provision.py prepare
      - name: Probe Google Drive and report only safe failure categories
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          base = Path(os.environ["RUNNER_TEMP"]) / "baidu-drive-auth"
          args = [
              str(base / "rclone"),
              "--config", str(base / "rclone.conf"),
              "lsjson", "bdm-drive:", "--dirs-only", "--max-depth", "1",
              "--no-modtime", "--no-mimetype",
          ]
          result = subprocess.run(args, capture_output=True, text=True, timeout=90)
          raw = (result.stdout + result.stderr).lower()
          labels = (
              ("invalid_grant", "invalid OAuth refresh grant"),
              ("token has been expired", "expired OAuth token"),
              ("unauthorized", "unauthorized"),
              ("accessnotconfigured", "Drive API not configured"),
              ("api has not been used", "Drive API not enabled"),
              ("access denied", "access denied"),
              ("insufficient authentication scopes", "insufficient OAuth scopes"),
              ("insufficientpermissions", "insufficient permissions"),
              ("403", "HTTP 403"),
              ("401", "HTTP 401"),
              ("400", "HTTP 400"),
              ("429", "HTTP 429"),
              ("failed to create file system", "rclone filesystem initialization error"),
              ("dial tcp", "network connection error"),
              ("timeout", "timeout"),
              ("connection refused", "connection refused"),
              ("permission denied", "permission denied"),
          )
          print("Drive API probe status:", "success" if result.returncode == 0 else "failed")
          found = [label for key, label in labels if key in raw]
          print("Drive API failure categories:", ", ".join(found) if found else "unclassified")
          import re
          lines = [line for line in result.stderr.splitlines() if "error 403:" in line.lower()]
          if lines:
              explanation = lines[-1].split("Error 403:", 1)[-1].split("Details:", 1)[0].strip()
              explanation = re.sub(r"https?://[^\\s]+", "[URL]", explanation)
              explanation = re.sub(r"[\\w.+-]+@[\\w.-]+", "[email]", explanation)
              explanation = re.sub(r"\\b\\d{6,}\\b", "[ID]", explanation)
              print("Sanitized 403 explanation:", explanation[:200])
          PY
