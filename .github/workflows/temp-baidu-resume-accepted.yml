name: temp Baidu resume accepted task

on:
  push:
    paths:
      - '.github/workflows/temp-baidu-resume-accepted.yml'

permissions:
  actions: write
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose persisted mover checkpoint without logging private values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sqlite3
          import tempfile
          import urllib.request
          import zlib
          from pathlib import Path

          task_id = "bd-20261108T061817Z-f542f8"
          url = "https://api.github.com/repos/teddyli18000/web-ingest/contents/baidu-drive/state/checkpoints/" + task_id + ".sqlite.zlib.b64?ref=main"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req, timeout=30) as response:
              item = json.load(response)
          packed = base64.b64decode(base64.b64decode(item["content"]).strip())
          with tempfile.TemporaryDirectory() as folder:
              dbfile = Path(folder) / "checkpoint.db"
              dbfile.write_bytes(zlib.decompress(packed))
              conn = sqlite3.connect(dbfile)
              table = conn.execute("SELECT status, last_error FROM tasks ORDER BY updated_at DESC LIMIT 1").fetchone()
              print("Mover status:", table[0] if table else "not found")
              if table:
                  err = (table[1] or "").lower()
                  phase = err.partition(":")[0].strip()
                  allowed_phases = (
                      "probe prepared drive authorization",
                      "reconcile drive directory tree",
                      "relay cleanup pass",
                      "plan relay staging batch",
                      "stage relay batch",
                      "scan",
                      "create drive tree client",
                  )
                  print("Failure phase:", phase if phase in allowed_phases else "unclassified")
                  for name in ("403","401","429","insufficient permissions","access denied","invalid_grant","token","drive","rclone","baidu","timeout","permission","not found","scope","oauth"):
                      if name in err:
                          print("Indicator:", name)
          PY
      - name: Resume already-accepted blocked Baidu share
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          task_id = "bd-20261108T061817Z-f542f8"
          api = "https://api.github.com/repos/teddyli18000/web-ingest"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def fetch(path):
              req = urllib.request.Request(api + "/contents/" + path + "?ref=main", headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  import base64
                  item = json.load(resp)
              return json.loads(base64.b64decode(item["content"]))

          runtime = fetch("baidu-drive/state/runtime.json")
          task = fetch("baidu-drive/state/tasks/" + task_id + ".json")
          if runtime["active_task"] != task_id or task["status"] not in {"BLOCKED_AUTH_SETUP", "BLOCKED"}:
              print("Task has already moved forward; no dispatch needed.")
          else:
              subprocess.run(
                  ["gh", "workflow", "run", "baidu-drive-worker.yml",
                   "--repo", "teddyli18000/web-ingest", "--ref", "main",
                   "-f", "task_id=" + task_id, "-f", "reason=retry"],
                  check=True,
              )
              print("Resumed accepted Baidu task through the current master.")
          PY
