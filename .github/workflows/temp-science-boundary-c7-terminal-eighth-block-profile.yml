name: Temp Science Boundary C7 omitted terminal blocker profile

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-terminal-eighth-block-profile.yml
      - science-boundary/shannon-capacity-c7/code/bpz_terminal_eighth_block_profile.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Tandon/BPZ source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
      - name: Profile every omitted BPZ terminal block exactly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_terminal_eighth_block_profile.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/status.json" --detail-cap 20 \
            > "$RUNNER_TEMP/result/stdout.txt" 2> "$RUNNER_TEMP/result/stderr.txt"
          cat "$RUNNER_TEMP/result/stdout.txt"
          tail -n 80 "$RUNNER_TEMP/result/stderr.txt"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-terminal-eighth-block-profile
          path: ${{ runner.temp }}/result
          retention-days: 14
