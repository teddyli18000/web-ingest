name: temp-p017-lop-search
on:
  push:
    paths:
      - '.github/workflows/temp-p017-lop-search.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p017-lop-search
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve authoritative verifier and baseline
        run: git clone -q --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
      - name: Verify exact matrix and baseline
        run: |
          python3 /tmp/few-shots/problems/p017-lop-be75eec-500/verify/verify.py /tmp/few-shots/problems/p017-lop-be75eec-500/baseline
          python3 science-boundary/lop-be75eec-500/prepare.py /tmp/few-shots
      - name: Compile C++ search
        run: g++ -std=c++17 -O3 -pthread science-boundary/lop-be75eec-500/search.cpp -o /tmp/lop-search
      - name: Parallel search
        run: |
          mkdir -p science-boundary/lop-be75eec-500/results
          /tmp/lop-search matrix.txt baseline.txt science-boundary/lop-be75eec-500/results/best.json 1000 4 2>&1 | tee science-boundary/lop-be75eec-500/results/search.log
      - name: Independently verify best candidate and record
        run: |
          python3 - <<'PY'
          import json,pathlib
          folder=pathlib.Path('science-boundary/lop-be75eec-500/results')
          p=folder/'best.json'
          if p.exists():
              cert=json.loads(p.read_text())
              assert sorted(cert['order'])==list(range(500))
              (folder/'certificate.json').write_text(json.dumps(cert,separators=(',',':')))
          else:
              baseline=json.loads(pathlib.Path('/tmp/few-shots/problems/p017-lop-be75eec-500/baseline/certificate.json').read_text())
              (folder/'certificate.json').write_text(json.dumps(baseline,separators=(',',':')))
          PY
          python3 /tmp/few-shots/problems/p017-lop-be75eec-500/verify/verify.py science-boundary/lop-be75eec-500/results | tee science-boundary/lop-be75eec-500/results/verification.json
      - name: Commit verified result to research topic
        run: |
          git config user.name 'p017-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/lop-be75eec-500/results/
          git diff --cached --quiet || (git commit -m 'science: persist independently verified p017 search results' && git pull --rebase && git push)
