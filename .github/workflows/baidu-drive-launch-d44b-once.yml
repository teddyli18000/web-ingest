name: Baidu Drive launch alternate share d44b (one shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baidu-drive-launch-d44b-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: baidu-drive-live-state
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout current task controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            baidu-drive
      - name: Archive blocked task and accept alternate public share
        id: accept
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'baidu-drive')
          import controller
          gh = controller.GitHub(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_TOKEN'])
          runtime, _ = gh.read_json(controller.RUNTIME_PATH, default=controller.DEFAULT_RUNTIME)
          old = controller.load_active_task(gh, runtime)
          expected = 'bd-20261114T085503Z-7eb87d'
          if old is None or old['id'] != expected or old['status'] != 'BLOCKED':
              raise RuntimeError('Unexpected live task; refusing to replace it')
          record, _ = gh.read_json(
              'baidu-drive/state/files/' + expected + '/218252594820093.json'
          )
          if record['status'] == 'ACTIVE' or record.get('lease_id'):
              raise RuntimeError('Original transfer is still leased')
          stopped_runtime, stopped_task, _ = controller.apply_command(
              'cancel', controller.default_control(), runtime, old
          )
          controller.save_task(gh, stopped_task, 'archive-before-alternate-public-share')
          stopped_runtime = controller.save_runtime_if_changed(
              gh, runtime, stopped_runtime, 'archive-before-alternate-public-share'
          )
          control = {
              'command': 'start',
              'share_url': 'https://pan.baidu.com/s/1Vstuy6s9NY-OMQBk9k7wRg',
              'extraction_code': 'd44b',
          }
          next_runtime, new_task, message = controller.apply_command(
              'start', control, stopped_runtime, None
          )
          new_task = controller.save_task(gh, new_task, 'start')
          next_runtime = controller.save_runtime_if_changed(
              gh, stopped_runtime, next_runtime, 'start'
          )
          release = gh.ensure_release()
          gh.patch_release(
              release,
              controller.render_release(
                  controller.default_control(), next_runtime, new_task,
                  new_task['status'], message
              ),
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print('task_id=' + new_task['id'], file=out)
          print('Accepted new task:', new_task['id'])
          print('Old blocked task archived; its durable records and checkpoint retained.')
          PY
      - name: Dispatch master scheduler
        env:
          TASK_ID: ${{ steps.accept.outputs.task_id }}
        run: |
          gh workflow run baidu-drive-worker.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "task_id=$TASK_ID" -f "reason=alternate-public-share-start"
          echo "Master dispatched for $TASK_ID"
