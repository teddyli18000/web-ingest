name: temp Ramsey R46 six-tail joint constructive search

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-ramsey-r46-six-tail-joint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-ramsey-r46-six-tail-joint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [20261106, 20261107, 20261108, 20261109]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical array engine
        run: python3 -m pip install --disable-pip-version-check -q numpy
      - name: Construct and jointly optimize six-tail 36-point Ramsey candidates
        run: |
          python3 science-boundary/ramsey-r46/core30_six_tail_joint.py \
            --rng ${{ matrix.seed }} --steps 50000 \
            --outdir "$RUNNER_TEMP/p003-six-tail"
      - name: Independent full-matrix verification and official verifier on zero
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/p003-six-tail/summary.json"; then
            cat "$RUNNER_TEMP/p003-six-tail/summary.json"
          fi
          if test -f "$RUNNER_TEMP/p003-six-tail/best-36.json"; then
            python3 - <<'PY'
          import itertools,json,os
          d=os.path.join(os.environ["RUNNER_TEMP"],"p003-six-tail")
          rows=json.load(open(d+"/best-36.json"))["adjacency"]
          assert len(rows)==36 and all(len(row)==36 for row in rows)
          assert all(rows[i][i]=='0' and all(rows[i][j]==rows[j][i] for j in range(36)) for i in range(36))
          graph=[sum(1<<j for j,bit in enumerate(row) if bit=='1') for row in rows]
          mask=(1<<36)-1
          complement=[mask & ~graph[i] & ~(1<<i) for i in range(36)]
          def cliques(a,c,k):
              if not k:return 1
              z=0
              while c.bit_count()>=k:
                  b=c&-c;v=b.bit_length()-1;c^=b
                  z+=cliques(a,c&a[v],k-1)
              return z
          k4=cliques(graph,mask,4);i6=cliques(complement,mask,6)
          summary=json.load(open(d+"/summary.json"))
          assert k4==summary["best"]["K4"] and i6==summary["best"]["I6"]
          print("Verified independent graph recount: K4=",k4,"I6=",i6,"score=",k4+i6)
          PY
            if python3 - <<'PY'
          import json,os,sys
          d=os.path.join(os.environ["RUNNER_TEMP"],"p003-six-tail")
          summary=json.load(open(d+"/summary.json"))
          sys.exit(0 if summary["best"].get("defects")==0 else 1)
          PY
            then
              git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
              mkdir -p "$RUNNER_TEMP/p003-verify"
              cp "$RUNNER_TEMP/p003-six-tail/best-36.json" "$RUNNER_TEMP/p003-verify/certificate.json"
              python3 "$RUNNER_TEMP/few-shots/problems/p003-ramsey-r46/verify/verify.py" "$RUNNER_TEMP/p003-verify"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p003-six-tail-${{ matrix.seed }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/p003-six-tail/
