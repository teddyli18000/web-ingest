name: temp-ta41-distance-coordination-geometry
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/distance_coordination_geometry.py'
      - '.github/workflows/temp-ta41-distance-coordination-geometry.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-distance-coordination-geometry
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check standalone independent geometry analysis
        run: python3 -m py_compile science-boundary/job-shop-ta41/distance_coordination_geometry.py
      - name: Measure exact neutral-schedule Kendall distances and low-barrier monotone paths
        run: python3 science-boundary/job-shop-ta41/distance_coordination_geometry.py --beam 100 --paths critical8,reversed6
      - name: Store audit-ready path with each adjacent swap
        if: always()
        run: |
          set -euo pipefail
          path='science-boundary/job-shop-ta41/results/geometry-vs-coordination.json'
          if ! test -f "$path"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): measure 2006 neutral Kendall geometry and monotone barrier'
          for attempt in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
