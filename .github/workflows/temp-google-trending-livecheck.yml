name: temp-google-trending-livecheck

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-google-trending-livecheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run current Google Trending capture without committing
        run: |
          python -m unittest discover -s google-trending/tests -v
          python google-trending/capture.py
          python google-trending/validate_archive.py
