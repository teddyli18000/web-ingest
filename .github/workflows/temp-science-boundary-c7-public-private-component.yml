name: Temp Science Boundary C7 public 367 private-swap components
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-public-private-component.yml
      - science-boundary/shannon-capacity-c7/code/public367_private_component_hunt.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temp-science-boundary-c7-public-private-component
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public sources read-only
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git init "$RUNNER_TEMP/c7-five"
          git -C "$RUNNER_TEMP/c7-five" remote add origin https://github.com/molind/c7-five.git
          git -C "$RUNNER_TEMP/c7-five" fetch --depth 1 origin ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
          git -C "$RUNNER_TEMP/c7-five" checkout FETCH_HEAD
      - name: Install dependency
        run: python3 -m pip install --disable-pip-version-check numpy
      - name: Traverse private-swap components
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/public367_private_component_hunt.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/c7-five" "$RUNNER_TEMP/result/status.json" \
            --max-states 100000 \
            > "$RUNNER_TEMP/result/stdout.txt" 2> "$RUNNER_TEMP/result/stderr.txt"
          cat "$RUNNER_TEMP/result/status.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-public367-private-components
          path: ${{ runner.temp }}/result
          retention-days: 14
      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo '## C7 public 367 private-swap component hunt'
            if [[ -f "$RUNNER_TEMP/result/status.json" ]]; then echo '```json'; cat "$RUNNER_TEMP/result/status.json"; echo '```'; fi
            if [[ -f "$RUNNER_TEMP/result/stdout.txt" ]]; then echo '### stdout'; echo '```text'; tail -n 120 "$RUNNER_TEMP/result/stdout.txt"; echo '```'; fi
            if [[ -f "$RUNNER_TEMP/result/stderr.txt" ]]; then echo '### stderr'; echo '```text'; tail -n 80 "$RUNNER_TEMP/result/stderr.txt"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
