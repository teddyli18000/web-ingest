name: Temp GPT MV bust insert review

on:
  push:
    paths:
      - ".github/workflows/temp-gpt-mv-bust-review.yml"
      - "temp-work/gpt-mv-code-native/src/main.js"
      - "temp-work/gpt-mv-code-native/src/components/gpt_bust_plate.js"
      - "temp-work/gpt-mv-code-native/src/scenes/opening_v11.js"
      - "temp-work/gpt-mv-code-native/src/scenes/drafts_v13.js"
  workflow_dispatch:

concurrency:
  group: temp-gpt-mv-bust-review
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: temp-work/gpt-mv-code-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer
        run: |
          npm install --no-audit --no-fund
          echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
      - name: Render opening bust shot
        run: node export/render.mjs --start 3.4 --end 7.15 --width 960 --height 540 --fps 12 --art-source reach-hq --bust-source gpt-bust-matted-v5 --out out/bust_opening.mp4
      - name: Render world bust shot
        run: node export/render.mjs --start 15 --end 18.35 --width 960 --height 540 --fps 12 --art-source reach-hq --bust-source gpt-bust-matted-v5 --out out/bust_world.mp4
      - name: Validate and upload review shots
        run: |
          set -euo pipefail
          ffmpeg -v error -i out/bust_opening.mp4 -f null -
          ffmpeg -v error -i out/bust_world.mp4 -f null -
          test -s out/bust_opening.contact.jpg
          test -s out/bust_world.contact.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-mv-bust-insert-${{ github.run_id }}
          path: |
            temp-work/gpt-mv-code-native/out/bust_opening.mp4
            temp-work/gpt-mv-code-native/out/bust_opening.contact.jpg
            temp-work/gpt-mv-code-native/out/bust_world.mp4
            temp-work/gpt-mv-code-native/out/bust_world.contact.jpg
          retention-days: 14
          if-no-files-found: error
