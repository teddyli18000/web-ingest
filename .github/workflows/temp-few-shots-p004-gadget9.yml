name: Temp Few Shots p004 ninth-pair search

on:
  push:
    paths:
      - .github/workflows/temp-few-shots-p004-gadget9.yml
      - temp-work/few-shots-p004/gadget9.cpp
      - temp-work/few-shots-p004/materialize.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-few-shots-p004-gadget9
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout web-ingest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch public source data read-only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          git clone --depth 1 --filter=blob:none --sparse https://github.com/nathanielitty/lower-bounds-for-shannon-capacity.git "$RUNNER_TEMP/shannon-source"
          git -C "$RUNNER_TEMP/shannon-source" sparse-checkout set c7

      - name: Prepare baseline IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 temp-work/few-shots-p004/materialize.py extract \
            "$RUNNER_TEMP/few-shots/problems/p004-shannon-capacity-c7/baseline/certificate.json" \
            "$RUNNER_TEMP/p004-baseline-ids.txt"

      - name: Compile structural search
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp \
            temp-work/few-shots-p004/gadget9.cpp \
            -o "$RUNNER_TEMP/p004-gadget9"

      - name: Search ninth exchange pair with exact coverage and 2-SAT
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          echo "runner CPUs: $(nproc)"
          free -h
          /usr/bin/time -v "$RUNNER_TEMP/p004-gadget9" \
            "$RUNNER_TEMP/p004-baseline-ids.txt" \
            "$RUNNER_TEMP/shannon-source/c7/R367.txt" \
            > "$RUNNER_TEMP/search-result.json"
          cat "$RUNNER_TEMP/search-result.json"

      - name: Materialize candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shot"
          python3 temp-work/few-shots-p004/materialize.py build \
            "$RUNNER_TEMP/few-shots/problems/p004-shannon-capacity-c7/baseline/certificate.json" \
            "$RUNNER_TEMP/search-result.json" \
            "$RUNNER_TEMP/shot/certificate.json" \
            "$RUNNER_TEMP/search-status.json"
          cat "$RUNNER_TEMP/search-status.json"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify breakthrough with upstream verifier
        if: steps.candidate.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" \
            | tee "$RUNNER_TEMP/verify-result.json"
          python3 - "$RUNNER_TEMP/verify-result.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          if not result.get("valid"):
              raise SystemExit(f"upstream verifier rejected candidate: {result}")
          if int(result["score"]) <= 134753:
              raise SystemExit(f"candidate is not a breakthrough: {result}")
          print(f"verified breakthrough score={result['score']}")
          PY

      - name: Save verified breakthrough in web-ingest only
        if: steps.candidate.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp-work/few-shots-p004/breakthrough
          cp "$RUNNER_TEMP/shot/certificate.json" temp-work/few-shots-p004/breakthrough/certificate.json
          cp "$RUNNER_TEMP/search-result.json" temp-work/few-shots-p004/breakthrough/gadget9-search-result.json
          cp "$RUNNER_TEMP/search-status.json" temp-work/few-shots-p004/breakthrough/gadget9-search-status.json
          cp "$RUNNER_TEMP/verify-result.json" temp-work/few-shots-p004/breakthrough/gadget9-verify-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp-work/few-shots-p004/breakthrough
          git commit -m "temp: save verified p004 ninth-pair breakthrough"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## Few Shots p004 ninth-pair structural search"
            echo
            if [[ -f "$RUNNER_TEMP/search-result.json" ]]; then
              echo '```json'
              cat "$RUNNER_TEMP/search-result.json"
              echo '```'
            fi
            if [[ -f "$RUNNER_TEMP/verify-result.json" ]]; then
              echo
              echo "Upstream verifier:"
              echo '```json'
              cat "$RUNNER_TEMP/verify-result.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
