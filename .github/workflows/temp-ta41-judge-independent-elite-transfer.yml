name: temp-ta41-judge-independent-elite-transfer
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-judge-independent-elite-transfer.yml'
      - 'science-boundary/job-shop-ta41/results/positive-independent-true-n7/results.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-judge-independent-elite-transfer
  cancel-in-progress: false
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Ensure all four full 24-trial results exist
        run: |
          set -euo pipefail
          for policy in tabu static3 dynamic3 true-n7; do
            test -f "science-boundary/job-shop-ta41/results/positive-independent-$policy/results.json"
          done
      - name: Judge independent native-elite transfer with oracle withheld until now
        run: python3 science-boundary/job-shop-ta41/judge_independent_elite_transfer.py
      - name: Preserve audited independent generalization results
        run: |
          set -euo pipefail
          file='science-boundary/job-shop-ta41/results/positive-independent-elite-judged.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'research(ta41): complete blind transfer verdict on independently generated N7 elites'
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
