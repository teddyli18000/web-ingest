name: temp-ta41-endogenous-machine-orientation
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-endogenous-machine-orientation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-endogenous-machine-orientation
  cancel-in-progress: false
jobs:
  global_joint:
    strategy:
      fail-fast: false
      matrix:
        include:
          - structure: none
            objective: static
          - structure: cardinality
            objective: static
          - structure: all
            objective: static
          - structure: all
            objective: none
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP-SAT, compile syntax
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/endogenous_machine_orientation.py
      - name: All 20 machine orders simultaneously free, with optional 15-machine + 21-gateway + source-proven core propagation
        run: |
          python3 science-boundary/job-shop-ta41/endogenous_machine_orientation.py \
            --start ta41 --structure '${{ matrix.structure }}' --objective '${{ matrix.objective }}' \
            --seed 4107 --workers 8 --seconds 95 \
            --out 'science-boundary/job-shop-ta41/results/endogenous-ta41-${{ matrix.structure }}-${{ matrix.objective }}'
      - name: Check any improved machine permutation with authoritative Few Shots verifier
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/endogenous-ta41-${{ matrix.structure }}-${{ matrix.objective }}"
          if test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist verified outcomes and solver performance
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/endogenous-ta41-${{ matrix.structure }}-${{ matrix.objective }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): all endogenous resource groups CP ${{ matrix.structure }} ${{ matrix.objective }}'
          for attempt in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
