name: temp-ta41-job-ejection-portfolio
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/job_ejection_search.py'
      - '.github/workflows/temp-ta41-job-ejection-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-job-ejection-portfolio
  cancel-in-progress: false
jobs:
  explore:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP-SAT
        run: python -m pip install 'ortools==9.14.6206'
      - name: Globally reinsert single jobs and pairs on every machine, preserving survivor order
        run: |
          python3 science-boundary/job-shop-ta41/job_ejection_search.py --shard '${{ matrix.shard }}' --shards 5 --per-subspace-seconds 3 --total-seconds 570 --out 'science-boundary/job-shop-ta41/results/job-eject-${{ matrix.shard }}'
      - name: Independently verify official candidate if produced
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/job-eject-${{ matrix.shard }}"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Preserve completed/partial exact job ejection evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'science-boundary/job-shop-ta41/results/job-eject-${{ matrix.shard }}/'
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): independent job-ejection subspace shard ${{ matrix.shard }}'
            # Parallel matrix jobs and unrelated science agents also update main.
            # Rebase and retry the atomic push rather than losing computed evidence.
            for attempt in $(seq 1 30); do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo 'All 30 main push attempts failed' >&2
            exit 1
          fi
