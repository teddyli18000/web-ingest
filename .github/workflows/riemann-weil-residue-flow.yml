name: Riemann-Weil Schur residue flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riemann-weil-residue-flow.yml'

permissions:
  contents: write

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {c: 13, N: 8,  prec: 1500, dps: 180}
          - {c: 13, N: 12, prec: 2300, dps: 240}
          - {c: 13, N: 16, prec: 3200, dps: 310}
          - {c: 17, N: 12, prec: 2300, dps: 240}
          - {c: 29, N: 8,  prec: 1500, dps: 180}
          - {c: 29, N: 12, prec: 2300, dps: 240}
          - {c: 29, N: 16, prec: 3200, dps: 310}
          - {c: 43, N: 12, prec: 2300, dps: 240}
          - {c: 67, N: 8,  prec: 1500, dps: 180}
          - {c: 67, N: 12, prec: 2300, dps: 240}
          - {c: 67, N: 16, prec: 3200, dps: 310}
          - {c: 100, N: 8,  prec: 1500, dps: 180}
          - {c: 100, N: 12, prec: 2300, dps: 240}
          - {c: 100, N: 16, prec: 3200, dps: 310}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check python-flint mpmath
      - name: Fetch pinned public cutoff-free verifier
        run: |
          git clone --quiet https://github.com/akivag613/connes-cvs-.git upstream-connes-cvs
          git -C upstream-connes-cvs checkout --quiet 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c
      - name: Compute Schur poles and residues
        run: |
          python temp-work/riemann-weil-research/experiments/schur_rational_pole_test.py \
            --upstream-script upstream-connes-cvs/papers/2_guinand_weil_dictionary_tail_order/scripts/arb_ldlt_certify.py \
            --upstream-commit 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c \
            --c ${{ matrix.c }} --N ${{ matrix.N }} --prec ${{ matrix.prec }} --dps ${{ matrix.dps }} \
            --output residue-flow-c${{ matrix.c }}-N${{ matrix.N }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: residue-flow-c${{ matrix.c }}-N${{ matrix.N }}
          path: residue-flow-c${{ matrix.c }}-N${{ matrix.N }}.json
          retention-days: 1

  collect:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: residue-flow-*
          path: downloaded
          merge-multiple: true
      - name: Build compact summary
        run: |
          python - <<'PY'
          import glob, json, math, os
          rows=[]
          for fn in glob.glob('downloaded/residue-flow-*.json'):
              d=json.load(open(fn))
              roots=[]
              for r in d['roots']:
                  if r.get('positive_real_x') and 'residue_at_positive_pole' in r:
                      roots.append((float(r['positive_pole']), -float(r['residue_at_positive_pole'])))
              roots.sort()
              a=math.log(d['c'])/(2*math.pi)
              first=roots[:5]
              rows.append({
                  'c':d['c'],'N':d['N'],'a_logc_over_2pi':a,
                  'schur_pivot_mid':d['schur_pivot_mid'],
                  'all_roots_positive_real':d['all_q_roots_positive_real'],
                  'all_residues_negative':d['all_finite_pole_residues_negative'],
                  'first5_dimensionless_poles':[x for x,_ in first],
                  'first5_physical_poles':[x/a for x,_ in first],
                  'first5_positive_weights_cj':[w for _,w in first],
                  'first5_weight_ratios_to_first':[w/first[0][1] for _,w in first] if first else [],
              })
          rows.sort(key=lambda r:(r['c'],r['N']))
          os.makedirs('downloaded',exist_ok=True)
          json.dump({'status':'exploratory_cutoff_and_band_residue_flow','warning':'Root/residue values are high-precision midpoint diagnostics, not root-isolation certificates. Compare N-stability before interpreting cutoff trends.','rows':rows},open('downloaded/residue-flow-summary.json','w'),indent=2)
          PY
      - name: Commit results safely
        run: |
          set -euo pipefail
          mkdir -p temp-work/riemann-weil-research/results/residue-flow
          cp downloaded/residue-flow-*.json temp-work/riemann-weil-research/results/residue-flow/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-work/riemann-weil-research/results/residue-flow/
          git diff --cached --quiet && exit 0
          git commit -m 'research: record Schur spectral-weight cutoff flow'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
