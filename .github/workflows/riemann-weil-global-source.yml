name: Riemann-Weil global Loewner source

on:
  push:
    branches: [main]
    paths:
      - 'temp-work/riemann-weil-research/experiments/global_loewner_source_verify.py'
      - '.github/workflows/riemann-weil-global-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check mpmath

      - name: Verify global source identity
        run: |
          python temp-work/riemann-weil-research/experiments/global_loewner_source_verify.py \
            --dps 100 --radius 3 \
            --output global-loewner-source-verify.json
          python -m json.tool global-loewner-source-verify.json >/dev/null

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: global-loewner-source-verify
          path: global-loewner-source-verify.json
          retention-days: 7

      - name: Commit result safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp-work/riemann-weil-research/results
          cp global-loewner-source-verify.json \
            temp-work/riemann-weil-research/results/global-loewner-source-verify.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-work/riemann-weil-research/results/global-loewner-source-verify.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'research: record global Loewner source verification'
          git pull --rebase origin main
          git push origin HEAD:main
