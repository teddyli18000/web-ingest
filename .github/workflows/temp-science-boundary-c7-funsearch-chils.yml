name: Temp Science Boundary C7 FunSearch seeded CHILS

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-funsearch-chils.yml
      - science-boundary/shannon-capacity-c7/code/bpz_t9_funsearch_chils.py
      - science-boundary/shannon-capacity-c7/code/bpz_t9_funsearch_representative_case.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-funsearch-chils
  cancel-in-progress: false

jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [0,5,10,15]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public sources read-only
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git init "$RUNNER_TEMP/chils"
          git -C "$RUNNER_TEMP/chils" remote add origin https://github.com/KarlsruheMIS/CHILS.git
          git -C "$RUNNER_TEMP/chils" fetch --depth 1 origin 515952724cd3dcc6c4365a340ecf0f1da782119a
          git -C "$RUNNER_TEMP/chils" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
      - name: Install Python dependency and compile CHILS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy
          make -C "$RUNNER_TEMP/chils" -j"$(nproc)"
          test -x "$RUNNER_TEMP/chils/CHILS"
      - name: Export obstruction-free graph and 366-point seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/search" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
          python3 science-boundary/shannon-capacity-c7/code/bpz_t9_funsearch_chils.py export \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/search/graph.metis" "$RUNNER_TEMP/search/init.sol" "$RUNNER_TEMP/result/export.json" \
            --case '${{ matrix.case }}'
          cat "$RUNNER_TEMP/result/export.json"
      - name: Seeded global CHILS search
        shell: bash
        env:
          OMP_PROC_BIND: spread
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          THREADS="$(nproc)"
          export OMP_NUM_THREADS="$THREADS"
          SEED=$(( 2026102800 + ${{ matrix.case }} * 10007 ))
          /usr/bin/time -v "$RUNNER_TEMP/chils/CHILS" \
            -g "$RUNNER_TEMP/search/graph.metis" \
            -i "$RUNNER_TEMP/search/init.sol" \
            -o "$RUNNER_TEMP/search/best.sol" \
            -p "$THREADS" -c "$THREADS" -t 300 -s 10 -r "$SEED" -v \
            > "$RUNNER_TEMP/result/chils.stdout" 2> "$RUNNER_TEMP/result/chils.stderr"
          test -s "$RUNNER_TEMP/search/best.sol"
          tail -n 80 "$RUNNER_TEMP/result/chils.stdout" || true
      - name: Replay CHILS result and materialize candidate
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/bpz_t9_funsearch_chils.py replay \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/search/best.sol" \
            "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/status.json" \
            --case '${{ matrix.case }}'
          cat "$RUNNER_TEMP/result/status.json"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify breakthrough with Few Shots verifier
        if: steps.replay.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1)) <= 134753: raise SystemExit(r)
          print(f"VERIFIED BREAKTHROUGH score={r['score']}")
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-funsearch-chils-case-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/result
            ${{ runner.temp }}/search/init.sol
            ${{ runner.temp }}/search/best.sol
          retention-days: 14
      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## C7 FunSearch seeded CHILS case ${{ matrix.case }}"
            for f in export.json status.json verify.json; do if [[ -f "$RUNNER_TEMP/result/$f" ]]; then echo '```json'; cat "$RUNNER_TEMP/result/$f"; echo '```'; fi; done
            echo '### CHILS tail'; echo '```text'; tail -n 100 "$RUNNER_TEMP/result/chils.stdout" 2>/dev/null || true; echo '```'
            echo '### CHILS stderr tail'; echo '```text'; tail -n 60 "$RUNNER_TEMP/result/chils.stderr" 2>/dev/null || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
