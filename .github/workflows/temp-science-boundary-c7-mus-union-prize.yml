name: Temp Science Boundary C7 multi-MUS union exact prize

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-mus-union-prize.yml
      - science-boundary/shannon-capacity-c7/code/bpz_mus_union_prize.py
      - science-boundary/shannon-capacity-c7/code/bpz_joint_core_shell_prize.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-mus-union-prize
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned BPZ source, Few Shots verifier, and MaxSAT backend
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
      - name: Exact MUS29 and owner-shell terminal prize
        id: solve
        shell: bash
        env:
          OMP_NUM_THREADS: 1
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_mus_union_prize.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/prize.json" "$RUNNER_TEMP/shot/certificate.json" --workers 4 \
            | tee "$RUNNER_TEMP/result/stdout.txt"
          python3 - "$RUNNER_TEMP/result/prize.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          with open(sys.argv[2],'a') as f:
              f.write('found='+('true' if r.get('candidate_materialized') else 'false')+'\n')
              f.write('score='+str(r.get('candidate_score') or 0)+'\n')
          PY
      - name: Verify breakthrough with Few Shots verifier
        if: steps.solve.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if not r.get('valid') or int(r.get('score',-1))<134754: raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-multi-mus-union-prize
          path: |
            ${{ runner.temp }}/result
            ${{ runner.temp }}/shot
          retention-days: 14
