name: temp C7 fractional nine-factor verification

on:
  push:
    paths:
      - science-boundary/shannon-capacity-c7/code/bpz_fractional_nine_charge.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-c7-fractional-nine
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MILP dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Check out pinned public Tandon/BPZ geometry
        run: |
          git init --quiet /tmp/c7-tandon
          git -C /tmp/c7-tandon fetch --quiet --depth 1 https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git c753408492dde92a239708986d16c15dbf6c3235
          git -C /tmp/c7-tandon checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-tandon rev-parse HEAD)" = 'c753408492dde92a239708986d16c15dbf6c3235'
      - name: Exact nine-factor charge and core-prize verification
        run: |
          python science-boundary/shannon-capacity-c7/code/bpz_fractional_nine_charge.py /tmp/c7-tandon/data/base_c7.json /tmp/fractional-nine-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: c7-fractional-nine-exact
          path: /tmp/fractional-nine-results.json
