name: Temp Science Boundary C7 product-level support3 injection SAT

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-product-level-injection.yml
      - science-boundary/shannon-capacity-c7/code/bpz_product_level_injection_sat.py
      - science-boundary/shannon-capacity-c7/code/bpz_product_level_injection_core_diag.py
      - science-boundary/shannon-capacity-c7/code/bpz_product_level_recolor.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-product-level-injection
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned BPZ source and SAT backend
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/result"
      - name: Exact product-level clique-fiber injection SAT
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_product_level_injection_sat.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/result.json" \
            | tee "$RUNNER_TEMP/result/stdout.txt"
      - name: Diagnose the two-point UNSAT core
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_product_level_injection_core_diag.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/core-diagnostic.json" \
            | tee "$RUNNER_TEMP/result/core-diagnostic.stdout"
      - name: Adaptive local RR recoloring
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_product_level_recolor.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/recolor.json" --max-rounds 100 --max-release 5000 \
            | tee "$RUNNER_TEMP/result/recolor.stdout"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-product-level-support3-injection
          path: ${{ runner.temp }}/result
          retention-days: 14
