name: temp-aes-g103-joint-cut-basis

on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/g103_joint_cut_basis_search.py'
      - '.github/workflows/temp-aes-g103-joint-cut-basis.yml'

permissions:
  contents: read

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        rows: ['1,2,4']
        weight: [1, 3]
        seed: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Jointly synthesize transformed cut prefix and suffix
        run: |
          set -euxo pipefail
          python -m py_compile \
            science-boundary/aes-sbox-circuit/g103_joint_cut_basis_search.py \
            science-boundary/aes-sbox-circuit/g103_cut_basis_census.py \
            science-boundary/aes-sbox-circuit/g103_boundary_prefix_rnbp.py
          python science-boundary/aes-sbox-circuit/g103_joint_cut_basis_search.py \
            --basis-rows '${{ matrix.rows }}' --prefix-seed '${{ matrix.seed }}' \
            --prefix-budget 47 --prefix-max-support 8 --prefix-elite 16 \
            --extra-weight '${{ matrix.weight }}' --suffix-seeds 8 \
            --suffix-max-support 10 --suffix-elite 24 --target-total 100 \
            --out result | tee run.log
          cat result/summary.json
      - name: Official verifier for any <=100 candidate
        run: |
          set -euxo pipefail
          if [ -f result/full.json ] && [ "$(python -c "import json; print(len(json.load(open('result/full.json'))['gates']))")" -le 100 ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/shot
            cp result/full.json /tmp/shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-g103-joint-r${{ matrix.rows }}-w${{ matrix.weight }}-s${{ matrix.seed }}
          path: |
            result
            run.log
            official-verifier.jsonl
