name: temp Thomson 960 capture A-centered cascade summary

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-capture-A-cascade.yml'

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: thomson-A-cascade-*
          path: ${{ runner.temp }}/cascade
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41184659984
      - name: Build durable summary
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'cascade'
          rows=[]
          for p in sorted(root.glob('*/result.json')):
              d=json.loads(p.read_text())
              nodes=d.get('nodes',[])
              classes={}
              trig=max((int(n.get('cascade',{}).get('triggered_count',0)) for n in nodes),default=0)
              for n in nodes:
                  c=n.get('free_class','?'); classes[c]=classes.get(c,0)+1
              rows.append((d.get('tag',p.parent.name),float(d['best_free_energy']),float(d['best_delta_live']),float(d.get('best_cascade_effective',0.0)),len(nodes),trig,classes))
          lines=['Thomson N=960 — A-centered cascade-aware summary — 2026-10-31','',
                 'run = 41184659984','live_score = 444368.3924061973','A_reference = 444368.3956862258','',
                 'tag  best_free_energy  delta_live  best_cascade_effective  nodes  max_triggered  free_classes']
          for r in rows:
              lines.append(f'{r[0]}  {r[1]:.15f}  {r[2]:+.12g}  {r[3]:.9g}  {r[4]}  {r[5]}  {r[6]}')
          best=min(rows,key=lambda r:r[1])
          lines += ['',f'best overall = {best[0]} {best[1]:.15f} delta_live {best[2]:+.12g}',
                    'Interpretation: the tested A-centered dependent scar-walk branches do not expose a lower N=960 basin. Strong remote softening by itself is not sufficient to escape A under this representation.']
          out=pathlib.Path('science-boundary/thomson-960/results/A-centered-cascade-summary-2026-10-31.txt')
          out.write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Commit summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/thomson-960/results/A-centered-cascade-summary-2026-10-31.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'thomson: preserve A-centered cascade outcome'
          git pull --rebase origin main
          git push origin HEAD:main
