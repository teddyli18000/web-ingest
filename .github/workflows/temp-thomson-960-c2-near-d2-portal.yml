name: temp Thomson near D2 C2 unstable portal
on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-c2-near-d2-portal.yml'
jobs:
  near-d2:
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: few-shots/few-shots
          path: few-shots
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy numba
      - name: Download exact near-D2 stationary coordinates from completed C2 genetic experiment
        uses: actions/download-artifact@v4
        with:
          name: thomson-c2-ga-cross-topology-84201
          run-id: 42500890656
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source
      - name: Check archival elite energy and 960 source points
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'source'
          files=list(root.rglob('result.json'))
          print('ARCHIVES',[str(z) for z in files])
          d=next(json.loads(z.read_text()) for z in files
                 if json.loads(z.read_text()).get('sweeps_done')==85)
          elite=min(d['c2_pool'],key=lambda z:abs(z['E']-444368.404283112))
          print('SOURCE',elite['E'],elite['tag'],'npts',len(elite['points']))
          assert abs(elite['E']-444368.404283112)<1e-5
          assert len(elite['points'])==960
          PY
      - name: Independently evaluate Hessian and release every low unstable mode into N960
        run: |
          python3 -m py_compile science-boundary/thomson-960/code/search_c2_near_d2_unstable_portal.py
          python3 science-boundary/thomson-960/code/search_c2_near_d2_unstable_portal.py \
            few-shots --artifact-root "$RUNNER_TEMP/source" \
            --seed 55233 --k 9 --maxiter 1450 \
            --out "$RUNNER_TEMP/out"
      - name: Summarize true physical descents
        if: always()
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/'result.json'
          if not p.exists():print('MISSING_RESULT');raise SystemExit(0)
          d=json.loads(p.read_text())
          print('RESULT',d['source_E'],'full_gradient',d['independent_gradient_rms'],
                'negative_modes',d['negative_indices'],'releases',d['release_count'],
                'best',d['best_energy'],'winning',d['winning_candidates'])
          print('SPECTRUM',d['lowest_modes'])
          print('ELITES',[(z['E'],z['tag']) for z in d['new_elites'][:15]])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-near-d2-stationary-portal
          path: ${{ runner.temp }}/out
          retention-days: 14
