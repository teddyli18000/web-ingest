name: temp-aes-semantic-32and-recombination
on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/semantic_32and_recombination.py'
      - '.github/workflows/temp-aes-semantic-32and-recombination.yml'
permissions:
  contents: read
  actions: read
jobs:
  constructive:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        include:
          - parents: 8
            rng: 31
          - parents: 16
            rng: 32
          - parents: 25
            rng: 33
          - parents: 28
            rng: 34
    steps:
      - uses: actions/checkout@v4
      - name: Download separately valid 32-AND parent circuits
        uses: actions/download-artifact@v4
        with:
          run-id: 42252448125
          github-token: ${{ github.token }}
          pattern: aes-care-cone-nist-*
          path: parent-archive
          merge-multiple: false
      - name: Jointly recombine NIST architecture and alternative factorizations
        run: |
          set -euxo pipefail
          python -m pip install --quiet ortools
          python -m py_compile science-boundary/aes-sbox-circuit/semantic_32and_recombination.py
          python science-boundary/aes-sbox-circuit/semantic_32and_recombination.py \
            --archive-dir parent-archive --baseline nist-g103 \
            --extra nist-a32-g104 nist-a32-g105 nist-a33-g105 \
            --max-source-gates 105 --max-parents '${{ matrix.parents }}' \
            --seconds 360 --workers 4 --rng '${{ matrix.rng }}' --out result | tee run.log
          python -c "import json; d=json.load(open('result/summary.json')); assert d['verified_all_256']; print(d)"
      - name: Official verifier for any <=100 gate candidate
        run: |
          set -euxo pipefail
          if [ -f result/candidate.json ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/p008shot
            cp result/candidate.json /tmp/p008shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/p008shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-semantic-32and-recombination-${{ matrix.parents }}
          path: |
            result
            run.log
            official-verifier.jsonl
