name: temp Thomson 960 e432 reaction bands

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-e432-reaction-bands.yml'

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        band: [low12, mid12_24, high24_48, captured48, residual48, no_low12, no_low24]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Search one reaction spectral band
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "band=${{ matrix.band }} nproc=$(nproc) live=$live"
          python3 science-boundary/thomson-960/code/search_reaction_spectral_band.py \
            "$RUNNER_TEMP/seed/e432.json" "$RUNNER_TEMP/seed/B-natural.json" \
            --band '${{ matrix.band }}' --k 48 --fd-step 3e-6 \
            --scales=-1.5,-1.0,-0.65,0.45,0.70,0.90,1.05,1.20,1.45,1.80 \
            --maxiter 3200 --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('BAND',d['band'],'POWER',d['band_power'],'NATIVE_RMS',d['band_native_rms'])
          print('BEST',d['best_energy'],'DELTA',d['best_delta_live'])
          for b in d['distinct_low_basins'][:16]: print('BASIN',b['energy'],b['delta_live'],b['coord_counts'],'scale',b['scale'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e432-reaction-band-${{ matrix.band }}
          path: ${{ runner.temp }}/out
          retention-days: 10
