name: Riemann-Weil endpoint susceptibility

on:
  push:
    branches: [main]
    paths:
      - 'temp-work/riemann-weil-research/experiments/schur_endpoint_susceptibility.py'
      - '.github/workflows/riemann-weil-endpoint-susceptibility.yml'

permissions:
  contents: write

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - c: 13
            N: 80
            prec: 4000
          - c: 100
            N: 120
            prec: 7000
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check python-flint mpmath
      - name: Fetch pinned public verifier
        run: |
          git clone --quiet https://github.com/akivag613/connes-cvs-.git upstream-connes-cvs
          git -C upstream-connes-cvs checkout --quiet 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c
          test "$(git -C upstream-connes-cvs rev-parse HEAD)" = "5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c"
      - name: Compute susceptibility
        run: |
          python temp-work/riemann-weil-research/experiments/schur_endpoint_susceptibility.py \
            --upstream-script upstream-connes-cvs/papers/2_guinand_weil_dictionary_tail_order/scripts/arb_ldlt_certify.py \
            --upstream-commit 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c \
            --c ${{ matrix.c }} --Nmax ${{ matrix.N }} --prec ${{ matrix.prec }} \
            --output endpoint-susceptibility-c${{ matrix.c }}-N${{ matrix.N }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-susceptibility-c${{ matrix.c }}-N${{ matrix.N }}
          path: endpoint-susceptibility-c${{ matrix.c }}-N${{ matrix.N }}.json
          retention-days: 1

  collect:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: endpoint-susceptibility-*
          path: downloaded
          merge-multiple: true
      - name: Commit results safely
        run: |
          set -euo pipefail
          mkdir -p temp-work/riemann-weil-research/results
          cp downloaded/endpoint-susceptibility-*.json temp-work/riemann-weil-research/results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-work/riemann-weil-research/results/endpoint-susceptibility-*.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: record endpoint susceptibility results'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
