name: temp-aes-semilinear-9d

on:
  push:
    paths:
      - '.github/workflows/temp-aes-semilinear-9d.yml'
      - 'science-boundary/aes-sbox-circuit/search_semilinear_outer.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-aes-semilinear-9d
  cancel-in-progress: false

jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        prefix: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install solver
        run: python -m pip install --disable-pip-version-check z3-solver==4.13.4.0
      - name: Joint semilinear outer search
        run: |
          out=/tmp/aes-semilinear-9d-${{ matrix.prefix }}
          mkdir -p "$out"
          python science-boundary/aes-sbox-circuit/search_semilinear_outer.py \
            --c 0x9d --k 3 --prefix ${{ matrix.prefix }} \
            --timeout-ms 1200 --max-pre 19 --max-out 17 \
            --out "$out" | tee "$out/run.log"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aes-semilinear-9d-${{ matrix.prefix }}
          path: /tmp/aes-semilinear-9d-${{ matrix.prefix }}
