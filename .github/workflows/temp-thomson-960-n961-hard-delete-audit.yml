name: temp Thomson 960 N961 hard delete audit

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-n961-hard-delete-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Static check
        run: python3 -m py_compile science-boundary/thomson-960/code/audit_n961_hub_hard_deletions.py
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Audit exact hub deletions
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) live=$live"
          python3 science-boundary/thomson-960/code/audit_n961_hub_hard_deletions.py \
            "$RUNNER_TEMP/seed/A-natural.json" --indices '886,960' \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('HUB',d['hub_energy'])
          for r in d['rows']:
              print('DELETE',r['delete_index'],r['class'],r['energy'],r['delta_live'],r['coord_counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-n961-hard-delete-audit
          path: ${{ runner.temp }}/out
          retention-days: 10
