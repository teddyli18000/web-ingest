name: temp-aes-fs101-suffix-cone-min

on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/fs101_suffix_cone_min.py'
      - '.github/workflows/temp-aes-fs101-suffix-cone-min.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust one-gate compression of each suffix output cone
        run: |
          set -euxo pipefail
          python -m py_compile science-boundary/aes-sbox-circuit/fs101_suffix_cone_min.py
          python science-boundary/aes-sbox-circuit/fs101_suffix_cone_min.py --out result | tee run.log
          cat result/summary.json
      - name: Official verifier if <=100 candidate appears
        run: |
          set -euxo pipefail
          if [ -f result/candidate.json ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/shot
            cp result/candidate.json /tmp/shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-fs101-suffix-cone-min
          path: |
            result
            run.log
            official-verifier.jsonl
