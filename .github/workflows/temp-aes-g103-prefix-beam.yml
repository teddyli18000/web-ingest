name: temp-aes-g103-prefix-beam

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-aes-g103-prefix-beam.yml'
      - 'science-boundary/aes-sbox-circuit/g103_prefix_beam.py'

permissions:
  contents: read

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - basis: '1,2,4'
            label: b124-w8
            width: 8
            reducers: 8
            guides: 2
            reserve: 2
          - basis: '1,2,4'
            label: b124-w20
            width: 20
            reducers: 10
            guides: 4
            reserve: 4
          - basis: '1,2,4'
            label: b124-w40
            width: 40
            reducers: 12
            guides: 6
            reserve: 8
          - basis: '1,3,4'
            label: b134-w8
            width: 8
            reducers: 8
            guides: 2
            reserve: 2
          - basis: '1,3,4'
            label: b134-w20
            width: 20
            reducers: 10
            guides: 4
            reserve: 4
          - basis: '1,3,4'
            label: b134-w40
            width: 40
            reducers: 12
            guides: 6
            reserve: 8
          - basis: '2,3,4'
            label: b234-w8
            width: 8
            reducers: 8
            guides: 2
            reserve: 2
          - basis: '2,3,4'
            label: b234-w20
            width: 20
            reducers: 10
            guides: 4
            reserve: 4
          - basis: '2,3,4'
            label: b234-w40
            width: 40
            reducers: 12
            guides: 6
            reserve: 8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Search diverse 48-linear G103 prefix frontier
        run: |
          set -euxo pipefail
          python -m py_compile \
            science-boundary/aes-sbox-circuit/g103_prefix_beam.py \
            science-boundary/aes-sbox-circuit/g103_joint_cut_basis_search.py \
            science-boundary/aes-sbox-circuit/g103_cut_basis_census.py
          python science-boundary/aes-sbox-circuit/g103_prefix_beam.py \
            --basis-rows '${{ matrix.basis }}' --budget 48 --max-support 8 \
            --beam-width '${{ matrix.width }}' \
            --reducer-branch '${{ matrix.reducers }}' \
            --guide-branch '${{ matrix.guides }}' \
            --bridge-reserve '${{ matrix.reserve }}' \
            --out result | tee run.log
          cat result/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: aes-g103-prefix-beam-${{ matrix.label }}
          path: |
            result
            run.log
