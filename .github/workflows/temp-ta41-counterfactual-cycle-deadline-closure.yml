name: temp-ta41-counterfactual-cycle-deadline-closure
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-counterfactual-cycle-deadline-closure.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-counterfactual-cycle-deadline-closure
  cancel-in-progress: false
jobs:
  closure:
    strategy:
      fail-fast: false
      matrix:
        policy: [dynamic, static, random]
        case: [ta43js-n7elite1711, ta46js-n7elite1701]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact solver and syntax-check graph mincut closure and joint repair
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/counterfactual_joint_cut.py
      - name: Predict resource cycle and replacement overlength paths before complete CP repairs
        run: |
          python3 science-boundary/job-shop-ta41/counterfactual_joint_cut.py \
            --start 'science-boundary/job-shop-ta41/positive-n7-elite-data/${{ matrix.case }}/start.txt' \
            --policy '${{ matrix.policy }}' --seed 333 \
            --roots 18 --rounds 6 --growth 5 \
            --cp-seconds 1.2 --total-seconds 80 --max-released 95 \
            --out 'science-boundary/job-shop-ta41/results/counterfactual-closure-${{ matrix.case }}-${{ matrix.policy }}'
      - name: Retain independent score verified full solutions and all partial-order model decisions
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/counterfactual-closure-${{ matrix.case }}-${{ matrix.policy }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): predicted cycle and critical-path replacement repair ${{ matrix.case }} ${{ matrix.policy }}'
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
