name: Temp Science Boundary C7^5 global 368 core-strengthened SAT

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7p5-368-core.yml
      - science-boundary/shannon-capacity-c7/code/c7p5_368_core_strengthened.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7p5-368-core
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public sources read-only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          git init "$RUNNER_TEMP/c7-five"
          git -C "$RUNNER_TEMP/c7-five" remote add origin https://github.com/molind/c7-five.git
          git -C "$RUNNER_TEMP/c7-five" fetch --depth 1 origin ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
          git -C "$RUNNER_TEMP/c7-five" checkout FETCH_HEAD
      - name: Install exact cardinality solver
        run: python3 -m pip install --disable-pip-version-check python-sat
      - name: Solve target 368 with all translated exact core cuts
        id: solve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shot" "$RUNNER_TEMP/result"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/c7p5_368_core_strengthened.py \
            "$RUNNER_TEMP/c7-five" "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/status.json" \
            > "$RUNNER_TEMP/result/stdout.txt" 2> "$RUNNER_TEMP/result/stderr.txt"
          cat "$RUNNER_TEMP/result/status.json"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify squared breakthrough with Few Shots verifier
        if: steps.solve.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1))<=134753: raise SystemExit(r)
          print(f"VERIFIED BREAKTHROUGH score={r['score']}")
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7p5-global-368-core-strengthened
          path: ${{ runner.temp }}/result
          retention-days: 14
      - name: Summarize
        if: always()
        shell: bash
        run: |
          { echo '## Global exact C7^5 target 368 with translated core cuts'; for f in status.json verify.json; do if [[ -f "$RUNNER_TEMP/result/$f" ]]; then echo '```json'; cat "$RUNNER_TEMP/result/$f"; echo '```'; fi; done; echo '### stderr'; echo '```text'; tail -n 100 "$RUNNER_TEMP/result/stderr.txt" 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
