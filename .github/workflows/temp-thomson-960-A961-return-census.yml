name: temp Thomson 960 A961 return census

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-A961-return-census.yml'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Enumerate return deletions around the A-to-R size bridge
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) live=$live"
          python3 science-boundary/thomson-960/code/search_live_size_bounce.py \
            "$RUNNER_TEMP/seed/A-natural.json" --mode add --rank 3 \
            --return-branches 32 --first-maxiter 3000 --return-maxiter 3400 \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize 24-dislocation side exits
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('SOURCE',d['source'],'BEST',d['best_energy'],'DELTA',d['best_delta_live'])
          for r in d['returns']:
              if r['coord_counts']=={'5':36,'6':900,'7':24} or r['energy']<444368.45:
                  print('24EXIT',{k:v for k,v in r.items() if k!='points'})
          print('ALLBEST')
          for r in d['returns'][:12]: print({k:v for k,v in r.items() if k!='points'})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-A961-return-census
          path: ${{ runner.temp }}/out
          retention-days: 10
