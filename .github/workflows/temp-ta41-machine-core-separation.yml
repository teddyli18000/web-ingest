name: temp-ta41-machine-core-separation
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/machine_core_separation.py'
      - '.github/workflows/temp-ta41-machine-core-separation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-machine-core-separation
  cancel-in-progress: false
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Pin solver
        run: python -m pip install 'ortools==9.14.6206'
      - name: Generate minimal machine-order obstruction cores
        run: python3 science-boundary/job-shop-ta41/machine_core_separation.py --seconds 540 --oracle-seconds 8 --iterations 150 --seed 4107
      - name: Independent official evaluation if a candidate exists
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/machine-cores"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Commit learned machine-group constraints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/machine-cores/
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): learn whole-machine UNSAT core hypergraph'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
