name: temp-aes-semilinear-5b-gaps

on:
  push:
    paths:
      - '.github/workflows/temp-aes-semilinear-5b-gaps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-aes-semilinear-5b-gaps
  cancel-in-progress: false

jobs:
  exactcorr3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact correction support <=4, prefix 3
        run: |
          out=/tmp/aes-5b-exactcorr-3
          mkdir -p "$out"
          python science-boundary/aes-sbox-circuit/search_semilinear_exactcorr.py \
            --c 0x5b --k 3 --prefix 3 --max-support 4 \
            --max-pre 19 --max-out 17 --out "$out" | tee "$out/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aes-5b-gap-exactcorr-3
          path: /tmp/aes-5b-exactcorr-3

  exactcorr6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact correction support <=4, prefix 6
        run: |
          out=/tmp/aes-5b-exactcorr-6
          mkdir -p "$out"
          python science-boundary/aes-sbox-circuit/search_semilinear_exactcorr.py \
            --c 0x5b --k 3 --prefix 6 --max-support 4 \
            --max-pre 19 --max-out 17 --out "$out" | tee "$out/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aes-5b-gap-exactcorr-6
          path: /tmp/aes-5b-exactcorr-6

  support5p3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rank-four support-5, prefix 3
        run: |
          out=/tmp/aes-5b-support5-3
          mkdir -p "$out"
          python science-boundary/aes-sbox-circuit/search_semilinear_support5.py \
            --c 0x5b --k 3 --prefix 3 --max-pre 19 --max-out 17 \
            --out "$out" | tee "$out/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aes-5b-gap-support5-3
          path: /tmp/aes-5b-support5-3
