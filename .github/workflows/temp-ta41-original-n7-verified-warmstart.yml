name: temp-ta41-original-n7-verified-warmstart
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-original-n7-verified-warmstart.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-original-n7-verified-warmstart
  cancel-in-progress: false
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        seed: [4107, 4113]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Pin genuine AGPL N7 author code and make only official-2006 initialization addition
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/Qiming01/Job-Shop-Scheduling.git /tmp/n7
          git -C /tmp/n7 fetch --depth=1 origin 7e120ebada21cb604c871e0657814bf6e32611f8
          git -C /tmp/n7 checkout --detach 7e120ebada21cb604c871e0657814bf6e32611f8
          python3 science-boundary/job-shop-ta41/patch_original_n7_warmstart.py /tmp/n7
          g++ -std=c++20 -O3 -include climits -DN7_WARMSTART_SUPPORT -I/tmp/n7/include \
            science-boundary/job-shop-ta41/original_n7_driver.cpp \
            /tmp/n7/src/graph.cpp /tmp/n7/src/instance.cpp \
            /tmp/n7/src/schedule.cpp /tmp/n7/src/tabu_search.cpp \
            -o /tmp/n7_tabu
          python3 -m py_compile science-boundary/job-shop-ta41/verify_unmodified_n7.py
      - name: Published N7 search at equal 2006 initial quality, fixed 65 seconds
        run: |
          python3 science-boundary/job-shop-ta41/verify_unmodified_n7.py \
            --upstream /tmp/n7 --driver /tmp/n7_tabu --warmstart \
            --seed '${{ matrix.seed }}' --seconds 65 \
            --out 'science-boundary/job-shop-ta41/results/true-n7-warm-${{ matrix.seed }}'
      - name: Independently grade any score <=2005 with official Few Shots
        if: always()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/true-n7-warm-${{ matrix.seed }}"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Preserve externally reproducible source patch and validated outcomes
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/true-n7-warm-${{ matrix.seed }}'
          if ! test -d "$dir"; then exit 0; fi
          rm -f "$dir/upstream-schedule.csv" "$dir/instance.txt" "$dir/verified-parent-orders.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): published original N7 Tabu with verified 2006 initialization seed ${{ matrix.seed }}'
          for attempt in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
