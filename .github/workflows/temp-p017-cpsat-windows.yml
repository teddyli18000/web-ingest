name: temp-p017-cpsat-windows
on:
  push:
    paths:
      - '.github/workflows/temp-p017-cpsat-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p017-cpsat-windows
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install CP-SAT solver
        run: python3 -m pip install --quiet ortools
      - name: Retrieve official verifier and exact matrix
        run: |
          git clone -q --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
          python3 science-boundary/lop-be75eec-500/prepare.py /tmp/few-shots
      - name: Select strongest locally verified starting candidate
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('science-boundary/lop-be75eec-500/results')
          paths=[pathlib.Path('/tmp/few-shots/problems/p017-lop-be75eec-500/baseline/certificate.json')]
          for name in ('best.json','subset-best.json','paired-best.json','cpsat-best.json'):
            path=root/name
            if path.exists(): paths.append(path)
          vals=list(map(int,pathlib.Path('matrix.txt').read_text().split()))
          M=[vals[1+i*500:1+(i+1)*500] for i in range(500)]
          options=[]
          for path in paths:
            p=json.loads(path.read_text())['order']
            assert sorted(p)==list(range(500))
            s=sum(M[p[i]][p[j]] for i in range(500) for j in range(i+1,500))
            options.append((s,p,str(path)))
          s,p,name=max(options)
          pathlib.Path('baseline.txt').write_text(' '.join(map(str,p)))
          print('START',s,name)
          PY
      - name: Optimize large coordinated windows
        run: |
          mkdir -p science-boundary/lop-be75eec-500/results
          python3 science-boundary/lop-be75eec-500/cpsat_windows.py matrix.txt baseline.txt science-boundary/lop-be75eec-500/results/cpsat-best.json 580 4 2>&1 | tee science-boundary/lop-be75eec-500/results/cpsat-search.log
      - name: Independent official verification
        run: |
          python3 - <<'PY'
          import json,pathlib
          r=pathlib.Path('science-boundary/lop-be75eec-500/results')
          source=r/'cpsat-best.json'
          if not source.exists():
            source.write_text(json.dumps({'order':list(map(int,pathlib.Path('baseline.txt').read_text().split()))},separators=(',',':')))
          (r/'certificate.json').write_text(source.read_text())
          PY
          python3 /tmp/few-shots/problems/p017-lop-be75eec-500/verify/verify.py science-boundary/lop-be75eec-500/results | tee science-boundary/lop-be75eec-500/results/cpsat-verification.json
      - name: Commit verified candidate
        run: |
          git config user.name 'p017-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/lop-be75eec-500/results/
          if ! git diff --cached --quiet; then
            git commit -m 'science: persist CP-SAT constructive LOP search'
            git pull --rebase
            git push
          fi
