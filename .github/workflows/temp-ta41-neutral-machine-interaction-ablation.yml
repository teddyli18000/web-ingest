name: temp-ta41-neutral-machine-interaction-ablation
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-neutral-machine-interaction-ablation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-neutral-machine-interaction-ablation
  cancel-in-progress: false
jobs:
  ablation:
    strategy:
      fail-fast: false
      matrix:
        seed: [4107,4113,5001,5002]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Pin author-native source N7 and original CP-neutral predecessor
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/audit_neutral_machine_interaction.py
          git clone --depth=1 https://github.com/Qiming01/Job-Shop-Scheduling.git /tmp/n7
          git -C /tmp/n7 fetch --depth=1 origin 7e120ebada21cb604c871e0657814bf6e32611f8
          git -C /tmp/n7 checkout --detach 7e120ebada21cb604c871e0657814bf6e32611f8
          python3 science-boundary/job-shop-ta41/patch_original_n7_warmstart.py /tmp/n7
          g++ -std=c++20 -O3 -include climits -DN7_WARMSTART_SUPPORT -I/tmp/n7/include \
            science-boundary/job-shop-ta41/original_n7_blind_driver.cpp \
            /tmp/n7/src/graph.cpp /tmp/n7/src/instance.cpp /tmp/n7/src/schedule.cpp /tmp/n7/src/tabu_search.cpp \
            -o /tmp/n7_true_blind
      - name: Factorial 00 01 10 11 neutral two-machine intervention, equal 14-second published N7 each
        run: |
          python3 science-boundary/job-shop-ta41/audit_neutral_machine_interaction.py \
            --driver /tmp/n7_true_blind --seed '${{ matrix.seed }}' --seconds 14 \
            --out 'science-boundary/job-shop-ta41/results/neutral-pair-interaction-ta46-seed${{ matrix.seed }}'
      - name: Save 16 independent legal machine-order outcomes and interaction audit
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/neutral-pair-interaction-ta46-seed${{ matrix.seed }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): pairwise noncritical neutral machine factorial ablation seed${{ matrix.seed }}'
          for attempt in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
