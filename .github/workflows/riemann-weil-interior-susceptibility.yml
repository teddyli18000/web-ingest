name: Riemann-Weil interior susceptibility

on:
  push:
    branches: [main]
    paths:
      - 'temp-work/riemann-weil-research/experiments/interior_prime_susceptibility.py'
      - '.github/workflows/riemann-weil-interior-susceptibility.yml'

permissions:
  contents: write

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - N: 24
            prec: 1600
            dps: 130
          - N: 32
            prec: 2200
            dps: 180
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check python-flint mpmath
      - name: Fetch pinned public verifier
        run: |
          git clone --quiet https://github.com/akivag613/connes-cvs-.git upstream-connes-cvs
          git -C upstream-connes-cvs checkout --quiet 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c
      - name: Compute interior susceptibility
        run: |
          python temp-work/riemann-weil-research/experiments/interior_prime_susceptibility.py \
            --upstream-script upstream-connes-cvs/papers/2_guinand_weil_dictionary_tail_order/scripts/arb_ldlt_certify.py \
            --upstream-commit 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c \
            --c 100 --N ${{ matrix.N }} --prec ${{ matrix.prec }} --dps ${{ matrix.dps }} \
            --output interior-susceptibility-c100-N${{ matrix.N }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: interior-susceptibility-c100-N${{ matrix.N }}
          path: interior-susceptibility-c100-N${{ matrix.N }}.json
          retention-days: 1

  collect:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: interior-susceptibility-*
          path: downloaded
          merge-multiple: true
      - name: Commit results safely
        run: |
          set -euo pipefail
          mkdir -p temp-work/riemann-weil-research/results
          cp downloaded/interior-susceptibility-*.json temp-work/riemann-weil-research/results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-work/riemann-weil-research/results/interior-susceptibility-*.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: record interior susceptibility results'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
