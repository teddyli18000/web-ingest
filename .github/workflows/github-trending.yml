name: GitHub Trending

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-trending.yml"
      - "github-trending/capture.py"
      - "github-trending/archive_lib.py"
      - "github-trending/tests/**"
  schedule:
    # 09:27, 10:27, 11:27 Singapore/Beijing time (UTC+8).
    # Staggered after ai-daily's 08:05 start + 65 min timeout + 15 min repo buffer.
    - cron: "27 1-3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: github-trending-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate task code
        run: |
          python -m py_compile github-trending/*.py
          python -m unittest discover -s github-trending/tests -v

      - name: Capture GitHub Trending
        run: python github-trending/capture.py

      - name: Refresh task README
        run: python github-trending/render_readme.py

      - name: Commit snapshot
        run: |
          git add github-trending/data github-trending/README.md
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(github-trending): capture $(TZ=Asia/Singapore date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
