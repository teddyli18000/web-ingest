name: Temp Science Boundary C7 rank3 xzero

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-rank3-xzero.yml
      - science-boundary/shannon-capacity-c7/code/rank3_square_relax.py
      - science-boundary/shannon-capacity-c7/code/generalized9.py
      - science-boundary/shannon-capacity-c7/code/neutral2_sweep.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-rank3-xzero
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout web-ingest
        uses: actions/checkout@v4

      - name: Fetch public sources read-only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          git init "$RUNNER_TEMP/shannon-source"
          git -C "$RUNNER_TEMP/shannon-source" remote add origin https://github.com/nathanielitty/lower-bounds-for-shannon-capacity.git
          git -C "$RUNNER_TEMP/shannon-source" fetch --depth 1 origin fe8966079013abaac21d1c08441500100f8e3b86
          git -C "$RUNNER_TEMP/shannon-source" checkout FETCH_HEAD

      - name: Install MaxSAT solver
        run: python3 -m pip install --disable-pip-version-check python-sat

      - name: Optimize zero-square-cost expansion
        id: search
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shot" "$RUNNER_TEMP/result"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/rank3_square_relax.py \
            "$RUNNER_TEMP/shannon-source/c7/R367.txt" \
            "$RUNNER_TEMP/few-shots/problems/p004-shannon-capacity-c7/baseline/certificate.json" \
            "$RUNNER_TEMP/shot/certificate.json" \
            "$RUNNER_TEMP/result/model.json" \
            "$RUNNER_TEMP/result/status.json" \
            --max-port-square-conflicts 0
          cat "$RUNNER_TEMP/result/status.json"
          [[ -f "$RUNNER_TEMP/shot/certificate.json" ]] && echo found=true >> "$GITHUB_OUTPUT" || echo found=false >> "$GITHUB_OUTPUT"

      - name: Verify breakthrough with upstream verifier
        if: steps.search.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',0)) <= 134753:
              raise SystemExit(f'not a verified breakthrough: {r}')
          print(f"VERIFIED score={r['score']}")
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/certificate.json"

      - name: Upload scientific result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-rank3-xzero
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 14

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo '## C7 rank3 x294 zero-conflict expansion'
            if [[ -f "$RUNNER_TEMP/result/status.json" ]]; then
              echo '```json'
              cat "$RUNNER_TEMP/result/status.json"
              echo '```'
            fi
            if [[ -f "$RUNNER_TEMP/result/verify.json" ]]; then
              echo 'Upstream verifier:'
              echo '```json'
              cat "$RUNNER_TEMP/result/verify.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
