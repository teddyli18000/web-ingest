name: Temp Ramsey R46 d11 extreme unconstrained gluing

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py
      - .github/workflows/temp-ramsey-r46-d11-extreme-unconstrained.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract authenticated extreme catalogues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/catalogs
          curl --fail --location --retry 4 --silent --show-error https://users.cecs.anu.edu.au/~bdm/data/r36_11.g6.gz -o /tmp/r46/r36_11.g6.gz
          curl --fail --location --retry 4 --silent --show-error https://users.cecs.anu.edu.au/~bdm/data/r45_24.g6 -o /tmp/r46/r45_24.g6
          echo '628c53df90910b2aae9a9559a62605593ff6fcdac66e9f23f95a134a4a696f36  /tmp/r46/r36_11.g6.gz' | sha256sum -c -
          echo '83ca4028f206b2fa4315ef219b8c2c57c7835209673dd8183d8fb4353bd4fdd0  /tmp/r46/r45_24.g6' | sha256sum -c -
          python3 science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py extract /tmp/r46/r36_11.g6.gz 11 26 /tmp/r46/catalogs/A26.g6 | tee /tmp/r46/a.json
          python3 science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py extract /tmp/r46/r45_24.g6 24 116 /tmp/r46/catalogs/B116.g6 | tee /tmp/r46/b.json
          test "$(wc -l < /tmp/r46/catalogs/A26.g6)" -eq 2
          test "$(wc -l < /tmp/r46/catalogs/B116.g6)" -eq 9
          python3 science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py generate /tmp/r46/catalogs/A26.g6 /tmp/r46/catalogs/B116.g6 0 0 /tmp/r46/test.cnf /tmp/r46/test-meta.json
          head -n 1 /tmp/r46/test.cnf
      - uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-d11-extreme-catalogs
          path: /tmp/r46/catalogs
          retention-days: 7

  solve:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        a: [0,1]
        b: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ramsey-r46-d11-extreme-catalogs
          path: /tmp/r46/catalogs
      - name: Build pinned Kissat 4.0.4
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git "$RUNNER_TEMP/kissat"
          git -C "$RUNNER_TEMP/kissat" checkout -q 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cd "$RUNNER_TEMP/kissat"
          ./configure >/dev/null
          make -j2 >/dev/null
          build/kissat --version
      - name: Generate exact unconstrained gluing CNF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/out
          python3 science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py generate \
            /tmp/r46/catalogs/A26.g6 /tmp/r46/catalogs/B116.g6 \
            '${{ matrix.a }}' '${{ matrix.b }}' /tmp/r46/out/glue.cnf /tmp/r46/out/meta.json
          head -n 1 /tmp/r46/out/glue.cnf
      - name: Solve exact pair
        id: solve
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=20s 720 \
            "$RUNNER_TEMP/kissat/build/kissat" /tmp/r46/out/glue.cnf > /tmp/r46/out/solver.log 2>&1
          rc=$?
          set -e
          case "$rc" in 10) status=SAT;;20) status=UNSAT;;124|137|143) status=TIMEOUT;;*) status=ERROR;;esac
          python3 - /tmp/r46/out/result.json /tmp/r46/out/meta.json "$status" "$rc" "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          out,meta,st,rc,run=sys.argv[1:]
          d=json.load(open(meta));d.update(status=st,solver_exit=int(rc),github_run_id=run,kissat_commit='8af8e56f174b778aef3aa45af9f739b2a5f492c2')
          open(out,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/r46/out/result.json
          tail -n 40 /tmp/r46/out/solver.log || true
          [[ "$status" != ERROR ]]
      - name: Decode and internally verify SAT model
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py decode \
            /tmp/r46/catalogs/A26.g6 /tmp/r46/catalogs/B116.g6 \
            '${{ matrix.a }}' '${{ matrix.b }}' /tmp/r46/out/solver.log /tmp/r46/out/candidate.json | tee /tmp/r46/out/internal-verify.json
      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate
          cp /tmp/r46/out/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/out/few-shots-verify.json
          python3 -c "import json;d=json.load(open('/tmp/r46/out/few-shots-verify.json'));assert d.get('valid') is True and int(d.get('score'))>=36,d"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-d11-unconstrained-${{ matrix.a }}-${{ matrix.b }}
          path: /tmp/r46/out
          if-no-files-found: warn
          retention-days: 7

  collect:
    if: always()
    needs: [prepare,solve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-d11-unconstrained-*
          path: /tmp/parts
      - name: Aggregate campaign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 - /tmp/parts /tmp/r46/result.json <<'PY'
          import json,pathlib,shutil,sys
          rows=[];hit=None;verified=0
          for p in pathlib.Path(sys.argv[1]).rglob('result.json'):
              d=json.load(open(p));rows.append(d)
              c=p.parent/'candidate.json';v=p.parent/'few-shots-verify.json'
              if v.exists():
                  q=json.load(open(v));verified += q.get('valid') is True and int(q.get('score',0))>=36
              if c.exists() and hit is None:hit=(c,v if v.exists() else None)
          rows.sort(key=lambda d:(d['a_ordinal'],d['b_ordinal']))
          counts={}
          for r in rows:counts[r['status']]=counts.get(r['status'],0)+1
          out={'campaign':'d11-extreme-unconstrained-glue','logical_scope':'all 2 A26 x 9 B116 fixed pairs, with no m/c/degree-sequence restriction','expected_branches':18,'branches_attempted':len(rows),'status_counts':counts,'all_unsat':len(rows)==18 and counts.get('UNSAT',0)==18,'verified_sat_count':verified,'rows':rows}
          if hit:
              shutil.copyfile(hit[0],'/tmp/r46/candidate.json')
              if hit[1]:shutil.copyfile(hit[1],'/tmp/r46/few-shots-verify.json')
          open(sys.argv[2],'w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},sort_keys=True))
          PY
      - name: Persist evidence and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/d11-extreme-unconstrained-glue.json
          if [[ -f /tmp/r46/candidate.json ]]; then
            cp /tmp/r46/candidate.json science-boundary/ramsey-r46/results/d11-extreme-unconstrained-hit.json
          fi
          if [[ -f /tmp/r46/few-shots-verify.json ]]; then
            cp /tmp/r46/few-shots-verify.json science-boundary/ramsey-r46/results/d11-extreme-unconstrained-hit-verify.json
          fi
          git rm .github/workflows/temp-ramsey-r46-d11-extreme-unconstrained.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/d11-extreme-unconstrained-*.json
          git commit -m 'ramsey-r46: record unconstrained extreme d11 gluing'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-d11-extreme-unconstrained-summary
          path: /tmp/r46
          retention-days: 7
