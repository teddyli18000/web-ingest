name: temp Thomson 960 capture saddle occupancy rays

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-capture-saddle-rays.yml'

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: thomson-weighted-saddle-ray-*
          path: ${{ runner.temp }}/rays
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41719943255
      - name: Repair legacy JSON framing and preserve compact scientific result
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rays'
          out=pathlib.Path('science-boundary/thomson-960/results/n961-weighted-saddle-occupancy-rays-2026-11-04.txt')
          lines=['Thomson N=960: fixed-total-charge N961 saddle continuation rays (2026-11-04)',
            'Run: https://github.com/teddyli18000/web-ingest/actions/runs/41719943255',
            'Input index-one saddle: https://github.com/teddyli18000/web-ingest/actions/runs/41332447336',
            'Current Few Shots p007 record R=444368.3924061973',
            'Fixed total charge 960: labels (886,960,380), ray towards a zero-charge deletion vertex.',
            'All coordinates and complete Newton histories retained in the three source Actions artifacts.',
            'Workflow red due only to summary JSONDecodeError: three saved branch.json files ended in literal backslash-n; the original continuation and artifact upload steps succeeded.',
            'The source writer was corrected in commit e2deae614409ce8296a3821d8a08849a655dde3a.',
            '']
          best=None
          for lab in (886,960,380):
              p=root/f'thomson-weighted-saddle-ray-{lab}'/'branch.json'
              raw=p.read_text()
              data, pos=json.JSONDecoder().raw_decode(raw)
              suffix=raw[pos:]
              assert suffix in ('','\\n','\n')
              rows=data['rows']
              lines.append(f"RAY {lab}: {len(rows)} attempted points; last_accepted_s={data['last_accepted_s']}; JSON suffix={suffix!r}")
              for r in rows:
                  low=r.get('hessian_lowest',[])
                  es=','.join(f'{v:+.8f}' for v in low[:3])
                  cols=[f"  s={r['s']:>5} status={r['status']} Ew={r['energy']:.12f} grms={r['gradient_rms']:.5g} lows=[{es}]"]
                  if r.get('newton_steps'):
                      last=r['newton_steps'][-1]
                      if r['status']!='index_one': cols.append('newton_last='+str(last))
                  lines.extend(cols)
                  if r.get('status')=='index_one':
                      assert r['negative_internal_modes']==1
                      assert low[0]<-1e-3 and low[1]>1e-3
                  for pr in r.get('projections',[]):
                      lines.append(f"    delete {pr['delete_index']}: {pr['class']} E={pr['energy']:.12f} delta_R={pr['delta_live']:+.11g} success={pr['success']}")
                      if best is None or pr['energy']<best['energy']: best={'ray':lab,'s':r['s'],**pr}
                  for side in r.get('unstable_sides',[]):
                      ps=[]
                      for pr in side['projections']:
                          ps.append(f"{pr['delete_index']}:{pr['class']}:{pr['delta_live']:+.9g}")
                          if best is None or pr['energy']<best['energy']: best={'ray':lab,'s':r['s'],'side':side['sign'],**pr}
                      lines.append(f"    unstable_side {side['sign']} Ew={side['weighted_energy']:.12f} projections={'; '.join(ps)}")
              lines.append('')
          lines.append('BEST_REAL_N960_PROJECTION '+json.dumps(best,sort_keys=True))
          lines.append('BEST_BEATS_CURRENT_RECORD_BY_2e-7 '+str(best['energy']<444368.3924061973-2e-7))
          lines.append('Interpretation: index-one branches on tested rays persist until last accepted parameter, and no fold is proved by unsuccessful Newton solve; the charged-particle geometric auxiliary problem is distinct from original N960 scoring.')
          out.write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Commit preserved result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/thomson-960/results/n961-weighted-saddle-occupancy-rays-2026-11-04.txt
          git commit -m "thomson: preserve 3 occupancy saddle rays and real N960 projections"
          git pull --rebase origin main
          git push origin HEAD:main
