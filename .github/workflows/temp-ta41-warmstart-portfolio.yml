name: temp-ta41-warmstart-portfolio
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/incumbent_warmstart_cp.py'
      - '.github/workflows/temp-ta41-warmstart-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-warmstart-portfolio
  cancel-in-progress: false
jobs:
  optimize:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: allfree
            seed: 4107
          - variant: fixed4
            seed: 138
          - variant: fixed5a
            seed: 2026
          - variant: fixed5b
            seed: 903
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP solver
        run: python -m pip install 'ortools==9.14.6206'
      - name: Optimize from 2006 feasible schedule rather than empty 2005 feasibility
        run: |
          python3 science-boundary/job-shop-ta41/incumbent_warmstart_cp.py --variant '${{ matrix.variant }}' --seed '${{ matrix.seed }}' --seconds 390 --workers 4 --out 'science-boundary/job-shop-ta41/results/warmstart-${{ matrix.variant }}'
      - name: Independently check candidate against official Few Shots judge
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/warmstart-${{ matrix.variant }}"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist objective result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'science-boundary/job-shop-ta41/results/warmstart-${{ matrix.variant }}/'
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): incumbent-guided CP objective ${{ matrix.variant }}'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
