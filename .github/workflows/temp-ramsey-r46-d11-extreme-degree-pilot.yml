name: Temp Ramsey R46 d11 extreme degree-bounded pilot

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/d11_extreme_glue_degree_dimacs.py
      - science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py
      - .github/workflows/temp-ramsey-r46-d11-extreme-degree-pilot.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-d11-extreme-degree-pilot
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate and extract extreme endpoint catalogues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/catalogs
          curl --fail --location --retry 4 --silent --show-error https://users.cecs.anu.edu.au/~bdm/data/r36_11.g6.gz -o /tmp/r46/r36_11.g6.gz
          curl --fail --location --retry 4 --silent --show-error https://users.cecs.anu.edu.au/~bdm/data/r45_24.g6 -o /tmp/r46/r45_24.g6
          echo '628c53df90910b2aae9a9559a62605593ff6fcdac66e9f23f95a134a4a696f36  /tmp/r46/r36_11.g6.gz' | sha256sum -c -
          echo '83ca4028f206b2fa4315ef219b8c2c57c7835209673dd8183d8fb4353bd4fdd0  /tmp/r46/r45_24.g6' | sha256sum -c -
          python3 science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py extract /tmp/r46/r36_11.g6.gz 11 26 /tmp/r46/catalogs/A26.g6
          python3 science-boundary/ramsey-r46/d11_extreme_glue_dimacs.py extract /tmp/r46/r45_24.g6 24 116 /tmp/r46/catalogs/B116.g6
          test "$(wc -l < /tmp/r46/catalogs/A26.g6)" -eq 2
          test "$(wc -l < /tmp/r46/catalogs/B116.g6)" -eq 9
          PYTHONPATH=science-boundary/ramsey-r46 python3 science-boundary/ramsey-r46/d11_extreme_glue_degree_dimacs.py self-test
          python3 -m py_compile science-boundary/ramsey-r46/d11_extreme_glue_degree_dimacs.py
      - uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-d11-extreme-degree-catalogs
          path: /tmp/r46/catalogs
          retention-days: 7

  solve:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {a: 0, b: 0}
          - {a: 0, b: 1}
          - {a: 1, b: 0}
          - {a: 1, b: 1}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ramsey-r46-d11-extreme-degree-catalogs
          path: /tmp/r46/catalogs
      - name: Build pinned Kissat 4.0.4
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git "$RUNNER_TEMP/kissat"
          git -C "$RUNNER_TEMP/kissat" checkout -q 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cd "$RUNNER_TEMP/kissat"
          ./configure >/dev/null
          make -j2 >/dev/null
          build/kissat --version
      - name: Generate universal degree-bounded fixed-pair CNF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/out
          PYTHONPATH=science-boundary/ramsey-r46 python3 science-boundary/ramsey-r46/d11_extreme_glue_degree_dimacs.py generate \
            /tmp/r46/catalogs/A26.g6 /tmp/r46/catalogs/B116.g6 '${{ matrix.a }}' '${{ matrix.b }}' \
            /tmp/r46/out/branch.cnf /tmp/r46/out/meta.json
          head -n 1 /tmp/r46/out/branch.cnf
          du -h /tmp/r46/out/branch.cnf
      - name: Solve exact branch
        id: solve
        shell: bash
        run: |
          set -uo pipefail
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          /usr/bin/time -v timeout --signal=TERM --kill-after=20s 1200 \
            "$RUNNER_TEMP/kissat/build/kissat" /tmp/r46/out/branch.cnf \
            > /tmp/r46/out/solver.log 2>&1
          rc=$?
          set -e
          finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          case "$rc" in
            10) status=SAT ;;
            20) status=UNSAT ;;
            124|137|143) status=TIMEOUT ;;
            *) status=ERROR ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 - /tmp/r46/out/meta.json /tmp/r46/out/summary.json "$status" "$rc" "$started" "$finished" <<'PY'
          import json,os,sys
          meta,out,status,rc,started,finished=sys.argv[1:]
          d=json.load(open(meta)); d.update(status=status,solver_exit=int(rc),started=started,finished=finished,
              solver='kissat-4.0.4',kissat_commit='8af8e56f174b778aef3aa45af9f739b2a5f492c2',github_run_id=os.environ['GITHUB_RUN_ID'])
          open(out,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in d.items() if k not in ('row_bounds','column_bounds')},sort_keys=True))
          PY
          tail -n 40 /tmp/r46/out/solver.log || true
          [[ "$status" != ERROR ]]
      - name: Decode SAT model
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=science-boundary/ramsey-r46 python3 science-boundary/ramsey-r46/d11_extreme_glue_degree_dimacs.py decode \
            /tmp/r46/catalogs/A26.g6 /tmp/r46/catalogs/B116.g6 '${{ matrix.a }}' '${{ matrix.b }}' \
            /tmp/r46/out/solver.log /tmp/r46/out/candidate.json | tee /tmp/r46/out/internal-verify.json
      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate
          cp /tmp/r46/out/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/out/few-shots-verify.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/r46/out/few-shots-verify.json'))
          assert d.get('valid') is True and int(d.get('score')) >= 36, d
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-d11-extreme-degree-${{ matrix.a }}-${{ matrix.b }}
          path: /tmp/r46/out
          if-no-files-found: warn
          retention-days: 7

  collect:
    if: always()
    needs: [prepare, solve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-d11-extreme-degree-*-*
          path: /tmp/parts
      - name: Aggregate exact pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 - /tmp/parts /tmp/r46/result.json <<'PY'
          import json,pathlib,shutil,sys
          rows=[]; hits=[]; ver=[]
          for p in pathlib.Path(sys.argv[1]).rglob('summary.json'):
              d=json.load(open(p)); rows.append(d)
              c=p.parent/'candidate.json'; v=p.parent/'few-shots-verify.json'
              if c.exists(): hits.append((d,c,v if v.exists() else None))
              if v.exists(): ver.append(json.load(open(v)))
          rows.sort(key=lambda d:(d['a_ordinal'],d['b_ordinal']))
          counts={}
          for r in rows: counts[r['status']]=counts.get(r['status'],0)+1
          d={'campaign':'d11-extreme-degree-bounded-pilot','logical_scope':'four historically hard A26/B116 pairs, universal degree 11..17 and m>=219 only',
             'expected_branches':4,'branches_attempted':len(rows),'status_counts':counts,
             'all_unsat':len(rows)==4 and counts.get('UNSAT',0)==4,'sat_count':counts.get('SAT',0),'timeout_count':counts.get('TIMEOUT',0),
             'verified_sat_count':sum(v.get('valid') is True and int(v.get('score'))>=36 for v in ver),'rows':rows}
          if hits:
              _,c,v=hits[0]; shutil.copyfile(c,'/tmp/r46/candidate.json')
              if v: shutil.copyfile(v,'/tmp/r46/few-shots-verify.json')
          open(sys.argv[2],'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in d.items() if k!='rows'},sort_keys=True))
          PY
      - name: Persist pilot and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/d11-extreme-degree-pilot.json
          [[ ! -f /tmp/r46/candidate.json ]] || cp /tmp/r46/candidate.json science-boundary/ramsey-r46/results/d11-extreme-degree-hit.json
          [[ ! -f /tmp/r46/few-shots-verify.json ]] || cp /tmp/r46/few-shots-verify.json science-boundary/ramsey-r46/results/d11-extreme-degree-hit-verify.json
          git rm .github/workflows/temp-ramsey-r46-d11-extreme-degree-pilot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/d11-extreme-degree-*.json
          git commit -m 'ramsey-r46: record degree-bounded extreme d11 pilot'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-d11-extreme-degree-pilot
          path: /tmp/r46
          retention-days: 7
