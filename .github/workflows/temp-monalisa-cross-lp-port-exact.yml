name: temp-monalisa-cross-lp-port-exact
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/lp_wiring_region_exact.py
      - .github/workflows/temp-monalisa-cross-lp-port-exact.yml
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {regions: 1, selector: persistent, budget: 64}
          - {regions: 1, selector: random, budget: 64}
          - {regions: 3, selector: persistent, budget: 128}
          - {regions: 3, selector: random, budget: 128}
          - {regions: 8, selector: persistent, budget: 192}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public original data
        run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          python -m pip install numpy networkx ortools matplotlib
          mkdir -p /tmp/p010-source/tour /tmp/p010-source/lp
          root=https://www.math.uwaterloo.ca/tsp/data/ml
          for score in 5757199 5757200 5757203 5757204 5757205 5757241 5757245; do
            curl -fsSL --retry 2 "$root/tour/monalisa_${score}.tour" -o "/tmp/p010-source/tour/monalisa_${score}.tour"
          done
          for variant in 6nsub 5zsub 4zsub; do
            curl -fsSL --retry 2 "$root/x/mona.${variant}.x" -o "/tmp/p010-source/lp/mona.${variant}.x"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path('/tmp/p010-source/tour');l=Path('/tmp/p010-source/lp')
          tours={f'historic_{s}':str(t/f'monalisa_{s}.tour') for s in (5757199,5757200,5757203,5757204,5757205,5757241,5757245)}
          lps={'2012-04-18':str(l/'mona.6nsub.x'),'2012-01-21':str(l/'mona.5zsub.x'),'2011-07-15':str(l/'mona.4zsub.x')}
          Path('/tmp/p010-source/tours.json').write_text(json.dumps(tours))
          Path('/tmp/p010-source/lps.json').write_text(json.dumps(lps))
          PY
      - name: Test cross-component exact Hamiltonian optimization
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          dir=science-boundary/mona-lisa-tsp/results/cross-lp-${{ matrix.regions }}-${{ matrix.selector }}-${{ matrix.budget }}
          mkdir -p "$dir"
          python science-boundary/mona-lisa-tsp/lp_wiring_region_exact.py \
            --baseline upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --tours /tmp/p010-source/tours.json --lps /tmp/p010-source/lps.json \
            --components science-boundary/mona-lisa-tsp/data/historical-wiring-components-all.json \
            --selector ${{ matrix.selector }} --attachment cross \
            --nregions ${{ matrix.regions }} --lp-budget ${{ matrix.budget }} \
            --seconds 150 --workers 4 --report "$dir/report.json" --candidate "$dir/certificate.json"
          if test -s "$dir/certificate.json"; then
            python upstream/problems/p010-mona-lisa-tsp/verify/verify.py "$dir"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monalisa-cross-lp-${{ matrix.regions }}-${{ matrix.selector }}-${{ matrix.budget }}
          path: science-boundary/mona-lisa-tsp/results/cross-lp-*/
          if-no-files-found: ignore
