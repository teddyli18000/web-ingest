name: Baidu Drive Scheduler

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Active web-ingest transfer task ID
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: baidu-drive-scheduler-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout scheduler control code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            baidu-drive

      - name: Reconcile file leases and fill free worker slots
        run: >-
          python3 baidu-drive/scheduler_runner.py
          --task-id '${{ inputs.task_id }}'
