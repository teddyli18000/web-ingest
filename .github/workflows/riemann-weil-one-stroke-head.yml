name: Riemann-Weil one-stroke head gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riemann-weil-one-stroke-head.yml'
      - 'temp-work/riemann-weil-research/experiments/zhu_one_stroke_head_probe.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: L0800
            L: '0.8'
          - tag: L5threshold
            L: 'log5over2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install 'mpmath==1.3.0'
      - name: Run independent midpoint head gate
        run: |
          python temp-work/riemann-weil-research/experiments/zhu_one_stroke_head_probe.py \
            --L '${{ matrix.L }}' \
            --T 200 \
            --N 24 \
            --panels 800 \
            --gauss 32 \
            --dps 60 \
            --output temp-work/riemann-weil-research/results/one-stroke-head-${{ matrix.tag }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: one-stroke-head-${{ matrix.tag }}
          path: temp-work/riemann-weil-research/results/one-stroke-head-${{ matrix.tag }}.json
          if-no-files-found: error

  collect:
    needs: probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: one-stroke-head-*
          path: /tmp/head-results
          merge-multiple: true
      - name: Install results and commit once
        run: |
          mkdir -p temp-work/riemann-weil-research/results
          cp /tmp/head-results/*.json temp-work/riemann-weil-research/results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-work/riemann-weil-research/results/one-stroke-head-*.json
          if git diff --cached --quiet; then
            echo 'No new result files to commit.'
            exit 0
          fi
          git commit -m 'research: record next-window one-stroke head gate'
          git pull --rebase origin main
          git push origin HEAD:main
