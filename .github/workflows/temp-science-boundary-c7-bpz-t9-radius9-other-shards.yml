name: Temp Science Boundary C7 BPZ t9 radius9 remaining-case shards
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-bpz-t9-radius9-other-shards.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temp-science-boundary-c7-bpz-t9-radius9-other-shards
  cancel-in-progress: false
jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {case: 0, phase: early, start: 82, end: 256}
          - {case: 0, phase: tail, start: 256, end: 15086}
          - {case: 1, phase: early, start: 32, end: 256}
          - {case: 1, phase: tail, start: 256, end: 15085}
          - {case: 2, phase: early, start: 78, end: 256}
          - {case: 2, phase: tail, start: 256, end: 15086}
          - {case: 3, phase: early, start: 16, end: 256}
          - {case: 3, phase: tail, start: 256, end: 15085}
          - {case: 4, phase: early, start: 13, end: 256}
          - {case: 4, phase: tail, start: 256, end: 15085}
          - {case: 5, phase: early, start: 75, end: 256}
          - {case: 5, phase: tail, start: 256, end: 15086}
          - {case: 6, phase: early, start: 17, end: 256}
          - {case: 6, phase: tail, start: 256, end: 15085}
          - {case: 7, phase: early, start: 81, end: 256}
          - {case: 7, phase: tail, start: 256, end: 15086}
          - {case: 8, phase: early, start: 64, end: 256}
          - {case: 8, phase: tail, start: 256, end: 15086}
          - {case: 9, phase: early, start: 14, end: 256}
          - {case: 9, phase: tail, start: 256, end: 15085}
          - {case: 10, phase: early, start: 29, end: 256}
          - {case: 10, phase: tail, start: 256, end: 15086}
          - {case: 12, phase: early, start: 13, end: 256}
          - {case: 12, phase: tail, start: 256, end: 15085}
          - {case: 13, phase: early, start: 32, end: 256}
          - {case: 13, phase: tail, start: 256, end: 15086}
          - {case: 14, phase: early, start: 34, end: 256}
          - {case: 14, phase: tail, start: 256, end: 15085}
          - {case: 15, phase: early, start: 28, end: 256}
          - {case: 15, phase: tail, start: 256, end: 15086}
          - {case: 16, phase: early, start: 14, end: 256}
          - {case: 16, phase: tail, start: 256, end: 15085}
          - {case: 17, phase: early, start: 29, end: 256}
          - {case: 17, phase: tail, start: 256, end: 15086}
          - {case: 18, phase: early, start: 16, end: 256}
          - {case: 18, phase: tail, start: 256, end: 15085}
          - {case: 19, phase: early, start: 32, end: 256}
          - {case: 19, phase: tail, start: 256, end: 15086}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public sources read-only
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git init "$RUNNER_TEMP/c7-five"
          git -C "$RUNNER_TEMP/c7-five" remote add origin https://github.com/molind/c7-five.git
          git -C "$RUNNER_TEMP/c7-five" fetch --depth 1 origin ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
          git -C "$RUNNER_TEMP/c7-five" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
      - name: Install dependency and compile exact DFS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy
          g++ -O3 -DNDEBUG -march=native -std=c++20 "$RUNNER_TEMP/c7-five/search/exchange_dfs.cpp" -o "$RUNNER_TEMP/exchange-dfs"
      - name: Exact radius9 shard
        id: search
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/science-boundary/shannon-capacity-c7/code
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shot" "$RUNNER_TEMP/result"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_t9_exchange_continue.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/c7-five" "$RUNNER_TEMP/exchange-dfs" \
            "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/status.json" \
            --case '${{ matrix.case }}' --budget 8 --root-start '${{ matrix.start }}' --root-end '${{ matrix.end }}' --cutoff 540 \
            > "$RUNNER_TEMP/result/stdout.txt" 2> "$RUNNER_TEMP/result/stderr.txt"
          cat "$RUNNER_TEMP/result/status.json"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Require exact shard completion or witness
        if: steps.search.outputs.found != 'true'
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/result/status.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          if not s.get('complete_tail',False):
              q=s.get('search',{})
              raise SystemExit(f"INCOMPLETE case={s.get('case_index')} interval=[{s.get('requested_root_start')},{s.get('requested_root_end')}), next_root={q.get('next_root')}")
          print('exact shard exhausted')
          PY
      - name: Verify breakthrough with Few Shots verifier
        if: steps.search.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1)) <= 134753:
              raise SystemExit(f'candidate not a verified breakthrough: {r}')
          print(f"VERIFIED BREAKTHROUGH score={r['score']}")
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-bpz-t9-radius9-case-${{ matrix.case }}-${{ matrix.phase }}-${{ matrix.start }}-${{ matrix.end }}
          path: ${{ runner.temp }}/result
          retention-days: 14
      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## C7 t9 radius9 case=${{ matrix.case }} ${{ matrix.phase }} roots [${{ matrix.start }},${{ matrix.end }})"
            for f in status.json verify.json; do
              if [[ -f "$RUNNER_TEMP/result/$f" ]]; then echo '```json'; cat "$RUNNER_TEMP/result/$f"; echo '```'; fi
            done
            if [[ -f "$RUNNER_TEMP/result/stderr.txt" ]]; then echo '```text'; tail -n 60 "$RUNNER_TEMP/result/stderr.txt"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
