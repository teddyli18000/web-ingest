name: temp-labs-ai4s-macro-native-full
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-macro-native-full.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-macro-native-full
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Pin, patch and build public unrestricted lMAts
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/borkob/git_labs.git "$RUNNER_TEMP/git_labs"
          PIN=1aa123407636e48630174e0bf122037e369c1d68
          git -C "$RUNNER_TEMP/git_labs" fetch -q --depth 1 origin "$PIN"
          git -C "$RUNNER_TEMP/git_labs" checkout -q --detach "$PIN"
          test "$(git -C "$RUNNER_TEMP/git_labs" rev-parse HEAD)" = "$PIN"
          SRC="$RUNNER_TEMP/git_labs/solvers/lMAts-lRRts/src"
          python3 science-boundary/labs-ai4s-search/trajectory_20261104/patch_macro_mts.py "$SRC"
          make -s -j1 -C "$SRC"
          test -x "$SRC/lMAts"
      - name: Runtime-matched 144 full native solver searches
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/trajectory_20261104
          python3 run_macro_mts.py \
            --exe "$RUNNER_TEMP/git_labs/solvers/lMAts-lRRts/src/lMAts" \
            --out results/macro_full_v1 --lengths 64,80,99,100 --reps 6 \
            --seconds 14 --workers 4 --arms 0,1,2,3,4,5
      - name: Independent exact energies, matched seeds, paired source-run intervals
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check numpy
          cd science-boundary/labs-ai4s-search/trajectory_20261104
          python3 analyze_macro_mts.py results/macro_full_v1/results.tsv --out results/macro_full_v1/paired_analysis.json
          python3 - <<'PY'
          import csv,json,pathlib,hashlib
          root=pathlib.Path('results/macro_full_v1')
          rows=list(csv.DictReader((root/'results.tsv').open(),delimiter='\t'))
          assert len(rows)==144
          assert {(int(r['n']),int(r['seed'])) for r in rows}.__len__()==24
          for r in rows:
             assert not r['error'] and int(r['oddE'])+int(r['evenE'])==int(r['bestE'])
             assert float(r['actual_seconds'])>=14
             assert (int(r['macro_proposals'])==0) if int(r['arm'])==0 else (int(r['macro_proposals'])>0)
          summary=json.loads((root/'summary.json').read_text())
          assert summary['valid']==144
          (root/'provenance.json').write_text(json.dumps({
           'source_sha':'1aa123407636e48630174e0bf122037e369c1d68',
           'native_solver':'old 2009 lMAts (not 2025 GPU)',
           'unadjusted_multiple_comparisons':True,
           'dataset_sha256':hashlib.sha256((root/'results.tsv').read_bytes()).hexdigest()
          },indent=2)+'\n')
          print('VERIFIED 144 paired, fixed runtime jobs')
          PY
      - name: Persist exact-verified six-arm experiment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/trajectory_20261104/results/macro_full_v1/
          git commit -m 'research(labs-ai4s): reproduce 144 costed native MTS coordinated-macro treatments'
          git pull --rebase origin main
          git push origin HEAD:main
