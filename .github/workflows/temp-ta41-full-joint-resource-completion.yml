name: temp-ta41-full-joint-resource-completion
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-full-joint-resource-completion.yml'
      - 'science-boundary/job-shop-ta41/joint_soft_pair_completion.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-full-joint-resource-completion
  cancel-in-progress: false
jobs:
  construct:
    strategy:
      fail-fast: false
      matrix:
        policy: [uniform, static, energetic, cp-core]
        case: [ta41, ta43js-n7elite1711, ta46js-n7elite1701]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned OR-Tools and syntax-check fully soft resource decisions
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/joint_soft_pair_completion.py
      - name: Complete full legal schedule under hard improved deadline while allowing any machine resource reorientation
        run: |
          set -euo pipefail
          c='${{ matrix.case }}'
          if test "$c" = ta41; then src=ta41; else src="science-boundary/job-shop-ta41/positive-n7-elite-data/$c/start.txt"; fi
          python3 science-boundary/job-shop-ta41/joint_soft_pair_completion.py \
            --start "$src" --policy '${{ matrix.policy }}' --seed 101 \
            --seconds 60 --core-seconds 3 \
            --out "science-boundary/job-shop-ta41/results/joint-global-$c-${{ matrix.policy }}"
      - name: Official Few Shots verifier on any improved ta41 machine orders
        if: always()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/joint-global-${{ matrix.case }}-${{ matrix.policy }}"
          if test '${{ matrix.case }}' = ta41 && test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist scored complete candidates or honest solver outcomes
        if: always()
        run: |
          set -euo pipefail
          dir="science-boundary/job-shop-ta41/results/joint-global-${{ matrix.case }}-${{ matrix.policy }}"
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(ta41): full target-constrained joint resource completion ${{ matrix.case }} ${{ matrix.policy }}"
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
