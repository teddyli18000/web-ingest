name: temp-ta41-15-machine-coverage-constructive-ihs
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-15-machine-coverage-constructive-ihs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-15-machine-coverage-constructive-ihs
  cancel-in-progress: false
jobs:
  coverage:
    strategy:
      fail-fast: false
      matrix:
        policy: [dynamic, static, random]
        case: [ta41, ta43js-n7elite1711, ta46js-n7elite1701]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP-SAT and assert independently proven ta41 15-machine barrier is present
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/machine_coverage_joint_ihs.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('science-boundary/job-shop-ta41/results/machine-budget14/decision.json')
          x=json.loads(p.read_text())
          assert x['status']=='INFEASIBLE' and x['maximum_changed_machine_orders']==14
          PY
      - name: Construct joint cross-machine constraint release, original hard NoOverlap score target
        run: |
          set -euo pipefail
          c='${{ matrix.case }}'
          if test "$c" = ta41; then input=ta41; else input="science-boundary/job-shop-ta41/positive-n7-elite-data/$c/start.txt"; fi
          python3 science-boundary/job-shop-ta41/machine_coverage_joint_ihs.py \
            --start "$input" --policy '${{ matrix.policy }}' --seed 20261108 \
            --iterations-per-stage 20 --master-seconds 0.5 --cp-seconds 0.65 \
            --seconds 145 \
            --out 'science-boundary/job-shop-ta41/results/machine-coverage-${{ matrix.case }}-${{ matrix.policy }}'
      - name: Official Few Shots verifier on constructed ta41 record candidate
        if: always()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/machine-coverage-${{ matrix.case }}-${{ matrix.policy }}"
          if test '${{ matrix.case }}' = ta41 && test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Commit source-verified constructive result or preserved honest unresolved trace
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/machine-coverage-${{ matrix.case }}-${{ matrix.policy }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): 15-machine coordinated release ${{ matrix.case }} ${{ matrix.policy }}'
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
