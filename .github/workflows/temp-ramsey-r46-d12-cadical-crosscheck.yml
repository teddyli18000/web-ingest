name: Temp Ramsey R46 d12 CaDiCaL crosscheck

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-ramsey-r46-d12-cadical-crosscheck.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-d12-cadical-crosscheck
  cancel-in-progress: false

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact SAT dependencies
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17' 'networkx==3.5'
      - name: Cross-check shard with CaDiCaL195
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/out/candidates
          python science-boundary/ramsey-r46/d12_cadical_crosscheck.py \
            --solver cadical195 \
            --timeout 180 \
            --shard-index "$SHARD" \
            --shard-count 8 \
            --output "/tmp/r46/out/shard-${SHARD}.json" \
            --candidate-dir /tmp/r46/out/candidates
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d12-cadical-shard-${{ matrix.shard }}
          path: /tmp/r46/out
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17' 'networkx==3.5'
      - uses: actions/download-artifact@v4
        with:
          pattern: d12-cadical-shard-*
          path: /tmp/r46/merged
          merge-multiple: true
      - name: Validate original closure and merge independent cross-check
        shell: bash
        run: |
          set -euo pipefail
          python science-boundary/ramsey-r46/verify_d12_lucky_closure.py \
            | tee /tmp/r46/merged/d12-lucky-closure-verifier.txt
          python science-boundary/ramsey-r46/merge_d12_cadical_crosscheck.py \
            --input-dir /tmp/r46/merged \
            --output /tmp/r46/merged/d12-cadical195-crosscheck.json
      - name: Verify any SAT candidates with Few Shots
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(/tmp/r46/merged/candidates/ordinal-*.json)
          if (( ${#candidates[@]} == 0 )); then
            echo 'No SAT candidates.'
            exit 0
          fi
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          for cand in "${candidates[@]}"; do
            ordinal="$(basename "$cand" .json | sed 's/ordinal-//')"
            work="/tmp/candidate-${ordinal}"
            mkdir -p "$work"
            cp "$cand" "$work/certificate.json"
            python3 /tmp/few-shots/problems/p003-ramsey-r46/verify/verify.py "$work" \
              | tee "/tmp/r46/merged/few-shots-ordinal-${ordinal}.json"
            python3 - "/tmp/r46/merged/few-shots-ordinal-${ordinal}.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d.get('valid') is True and str(d.get('score')) == '36', d
          PY
          done
      - name: Persist evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/merged/d12-cadical195-crosscheck.json \
            science-boundary/ramsey-r46/results/d12-cadical195-crosscheck.json
          cp /tmp/r46/merged/d12-lucky-closure-verifier.txt \
            science-boundary/ramsey-r46/results/d12-lucky-closure-verifier.txt
          shopt -s nullglob
          for f in /tmp/r46/merged/candidates/ordinal-*.json /tmp/r46/merged/few-shots-ordinal-*.json; do
            cp "$f" science-boundary/ramsey-r46/results/
          done
          git rm .github/workflows/temp-ramsey-r46-d12-cadical-crosscheck.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/d12-cadical195-crosscheck.json \
                  science-boundary/ramsey-r46/results/d12-lucky-closure-verifier.txt \
                  science-boundary/ramsey-r46/results/ordinal-*.json || true
          git commit -m 'ramsey-r46: record independent lucky-d12 crosscheck'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
      - name: Upload merged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d12-cadical-crosscheck-merged
          path: /tmp/r46/merged
          if-no-files-found: warn
          retention-days: 7
