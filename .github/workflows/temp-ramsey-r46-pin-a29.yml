name: Temp Ramsey R46 pin unique A29 graph

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-ramsey-r46-pin-a29.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-pin-a29
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and authenticate unique A29
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17' 'networkx==3.5'
          mkdir -p /tmp/r46
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r36_12.g6.gz -o /tmp/r46/r36_12.g6.gz
          echo '17e176a0f7e7397dbca7c9cb6295034dd74cf529ca62e7e717226dc1b0b7b96d  /tmp/r46/r36_12.g6.gz' | sha256sum -c -
          python science-boundary/ramsey-r46/d12_fixed_ab_sat.py extract-g6 \
            --input /tmp/r46/r36_12.g6.gz --n 12 --edges 29 --out /tmp/r46/a29.g6
          test "$(wc -l < /tmp/r46/a29.g6)" -eq 1
          sha256sum /tmp/r46/a29.g6 | tee /tmp/r46/a29.sha256
          python3 - /tmp/r46/a29.g6 /tmp/r46/aut.json <<'PY'
          import json,networkx as nx,sys
          from pathlib import Path
          sys.path.insert(0,'science-boundary/ramsey-r46')
          from d12_fixed_ab_sat import decode_graph6,validate_A
          g6=Path(sys.argv[1]).read_text().strip(); adj,e=decode_graph6(g6); validate_A(adj)
          G=nx.Graph(); G.add_nodes_from(range(12))
          for i in range(12):
              for j in range(i+1,12):
                  if (adj[i]>>j)&1: G.add_edge(i,j)
          autos=[]
          for m in nx.algorithms.isomorphism.GraphMatcher(G,G).isomorphisms_iter():
              autos.append([m[i] for i in range(12)])
          d={'graph6':g6,'n':12,'edges':e,'degree_sequence':sorted(dict(G.degree()).values()),
             'automorphism_group_size':len(autos),'automorphisms':autos}
          Path(sys.argv[2]).write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in d.items() if k!='automorphisms'},sort_keys=True))
          PY
      - name: Persist pinned input and provenance
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/a29.g6 science-boundary/ramsey-r46/data/r36_12_e29.g6
          cp /tmp/r46/aut.json science-boundary/ramsey-r46/results/r36-12-e29-automorphisms.json
          sha=$(cut -d' ' -f1 /tmp/r46/a29.sha256)
          printf '\n## `r36_12_e29.g6`\n\nPinned unique 12-vertex Ramsey `(3,6)` graph with 29 edges, the unique neighbourhood side in the lucky degree-12 reduction.\n\n- Authoritative source: Brendan McKay complete `r36_12.g6.gz` catalogue.\n- Source SHA-256: `17e176a0f7e7397dbca7c9cb6295034dd74cf529ca62e7e717226dc1b0b7b96d`.\n- Complete catalogue edge histogram has exactly one 29-edge record.\n- Pinned one-line file SHA-256: `%s`.\n- Its exact automorphism enumeration is in `../results/r36-12-e29-automorphisms.json`.\n' "$sha" >> science-boundary/ramsey-r46/data/README.md
          git rm .github/workflows/temp-ramsey-r46-pin-a29.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/data/r36_12_e29.g6 \
                  science-boundary/ramsey-r46/data/README.md \
                  science-boundary/ramsey-r46/results/r36-12-e29-automorphisms.json
          git commit -m 'ramsey-r46: pin unique R36(12) A29 graph'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
