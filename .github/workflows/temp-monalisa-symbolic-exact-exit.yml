name: temp-monalisa-symbolic-exact-exit
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/symbolic_global_circuit.py
      - .github/workflows/temp-monalisa-symbolic-exact-exit.yml
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        minimum_gain: [4, 2, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verifier and exact solver
        run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          git clone --depth 1 https://github.com/bicobico2/ElimTSP.git elimtsp
          python -m pip install ortools
          python upstream/problems/p010-mona-lisa-tsp/verify/verify.py upstream/problems/p010-mona-lisa-tsp/baseline
      - name: Enumerate all positive local motifs without exponential enumeration
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          mkdir -p science-boundary/mona-lisa-tsp/results/exact-exit-${{ matrix.minimum_gain }}
          python science-boundary/mona-lisa-tsp/symbolic_hypercube_2opt.py \
            --graph elimtsp/results/mona.248972.edg.gz \
            --baseline upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --moves science-boundary/mona-lisa-tsp/data/all-face-neutral-moves.json \
            --proof science-boundary/mona-lisa-tsp/data/universal-family-check.json \
            --report science-boundary/mona-lisa-tsp/results/exact-exit-${{ matrix.minimum_gain }}/symbolic.json \
            --positive-file science-boundary/mona-lisa-tsp/results/exact-exit-${{ matrix.minimum_gain }}/positive-motifs.json \
            --candidate science-boundary/mona-lisa-tsp/results/exact-exit-${{ matrix.minimum_gain }}/certificate.json \
            --samples 3
      - name: Exact single-cycle exit search
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          python science-boundary/mona-lisa-tsp/symbolic_global_circuit.py \
            --baseline upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --moves science-boundary/mona-lisa-tsp/data/all-face-neutral-moves.json \
            --motifs science-boundary/mona-lisa-tsp/results/exact-exit-${{ matrix.minimum_gain }}/positive-motifs.json \
            --report science-boundary/mona-lisa-tsp/results/exact-exit-${{ matrix.minimum_gain }}/circuit.json \
            --certificate science-boundary/mona-lisa-tsp/results/exact-exit-${{ matrix.minimum_gain }}/certificate.json \
            --minimum-gain ${{ matrix.minimum_gain }} --seconds 180 --workers 4
          if test -f science-boundary/mona-lisa-tsp/results/exact-exit-${{ matrix.minimum_gain }}/certificate.json; then
            python upstream/problems/p010-mona-lisa-tsp/verify/verify.py science-boundary/mona-lisa-tsp/results/exact-exit-${{ matrix.minimum_gain }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monalisa-symbolic-exact-exit-${{ matrix.minimum_gain }}
          path: science-boundary/mona-lisa-tsp/results/exact-exit-${{ matrix.minimum_gain }}/
          if-no-files-found: ignore
