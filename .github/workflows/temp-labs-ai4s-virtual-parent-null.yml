name: temp-labs-ai4s-virtual-parent-null
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-virtual-parent-null.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-virtual-parent-null
  cancel-in-progress: false
jobs:
  null-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Build classical original-energy virtual-parent information ablation
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search
          g++ -O3 -std=c++17 -Wall -Wextra \
            recombination_20261105/innovation/virtual_donor.cpp \
            -o /tmp/labs_virtual_parent
          /tmp/labs_virtual_parent --selftest
      - name: Truly unseen seed true-B versus Hamming-matched fake-B parent checks
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/recombination_20261105
          mkdir -p innovation/results/virtual_parent_v1
          for spec in \
            "selected60:c60_1-c60_4:60:11000" \
            "holdout60a:c60_0-c60_3:40:12000" \
            "holdout60b:c60_2-c60_5:40:13000" \
            "holdout59:c59_0-c59_2:40:14000" \
            "arch46:c46_0-c46_1:20:15000" \
            "arch47:c47_0-c47_2:20:16000" \
            "arch50:c50_0-c50_1:20:17000" \
            "frontier92:c92_0-c92_1:20:18000" \
            "frontier99:c99_0-c99_1:20:19000"; do
            IFS=: read -r label pair reps offset <<< "$spec"
            /tmp/labs_virtual_parent data/combined/combined10.tsv \
              "innovation/results/virtual_parent_v1/${label}_sessions.tsv" \
              "innovation/results/virtual_parent_v1/${label}_children.tsv" \
              "$reps" 120 "$pair" "$offset"
          done
      - name: Independently score entire full repair outcomes and all novel high quality descendants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check numpy
          cd science-boundary/labs-ai4s-search/recombination_20261105
          for label in selected60 holdout60a holdout60b holdout59 arch46 arch47 arch50 frontier92 frontier99; do
            python3 innovation/validate_virtual.py \
              --parents data/combined/combined10.tsv \
              --sessions "innovation/results/virtual_parent_v1/${label}_sessions.tsv" \
              --novel "innovation/results/virtual_parent_v1/${label}_children.tsv" \
              --out "innovation/results/virtual_parent_v1/${label}_analysis.json"
          done
      - name: Verify all session counts, no missing source trials, and immutable hashes
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/recombination_20261105
          python3 - <<'PY'
          import csv,json,hashlib,pathlib,platform,subprocess
          d=pathlib.Path('innovation/results/virtual_parent_v1')
          counts={'selected60':60,'holdout60a':40,'holdout60b':40,'holdout59':40,
                  'arch46':20,'arch47':20,'arch50':20,'frontier92':20,'frontier99':20}
          for label,reps in counts.items():
            rows=list(csv.DictReader((d/(label+'_sessions.tsv')).open(),delimiter='\t'))
            assert len(rows)==reps*10,(label,len(rows))
            analysis=json.loads((d/(label+'_analysis.json')).read_text())
            assert analysis['rows']==reps*10 and analysis['source_seed_pair_units']==reps
            assert all(float(x['elapsed_ms'])>=120 for x in rows)
            assert len({(int(x['rep']),int(x['arm'])) for x in rows})==reps*10
          p={'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'compiler':subprocess.check_output(['g++','--version'],text=True).splitlines()[0],
             'platform':platform.platform(),
             'design':'280 independent unseen seed replicates, 9 certified source pairs across 7 lengths, 10 arms, equal 120ms per treatment, fully charged proposal+Tabu+quench',
             'counts':counts,
             'data_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in d.glob('*.tsv')}}
          (d/'provenance.json').write_text(json.dumps(p,indent=2)+'\n')
          print('CERTIFIED 2800 time matched repaired source-real vs virtual-parent outcomes')
          PY
      - name: Persist independently validated research state on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/recombination_20261105/innovation/results/virtual_parent_v1/
          git commit -m 'research(labs-ai4s): verify 2800 full-repair true second-parent versus virtual donor ablation trials'
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "SUCCESS committed complete virtual-donor source-null test"
              exit 0
            fi
            sleep 3
          done
          exit 1
