name: temp-ta41-audit-partial-resource-oracle
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-audit-partial-resource-oracle.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-audit-partial-resource-oracle
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Download complete publicly documented reference answers separately for validation
        run: |
          git clone --depth=1 https://github.com/ScheduleOpt/benchmarks.git /tmp/scheduleopt
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/audit_partial_resource_witnesses.py
      - name: Verify every target-2005 type precompletion resource witness is hit by an independently verified better schedule
        run: |
          python3 science-boundary/job-shop-ta41/audit_partial_resource_witnesses.py \
            --reference-root /tmp/scheduleopt \
            --out science-boundary/job-shop-ta41/results/partial-resource-oracle-audit.json
      - name: Save audited necessity and prediction quality (never search with oracle)
        if: always()
        run: |
          set -euo pipefail
          out='science-boundary/job-shop-ta41/results/partial-resource-oracle-audit.json'
          if ! test -f "$out"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): cross-check precompletion resource-disjunction proofs against 12 independent hidden improved machine orders'
          for i in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
