name: temp-ta41-independent-n7-elite-positives
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-independent-n7-elite-positives.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-independent-n7-elite-positives
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Pin real published N7 and benchmark sources
        run: |
          git clone --depth=1 https://github.com/Qiming01/Job-Shop-Scheduling.git /tmp/n7
          git -C /tmp/n7 fetch --depth=1 origin 7e120ebada21cb604c871e0657814bf6e32611f8
          git -C /tmp/n7 checkout --detach 7e120ebada21cb604c871e0657814bf6e32611f8
          git clone --depth=1 https://github.com/ScheduleOpt/benchmarks.git /tmp/scheduleopt
          g++ -std=c++20 -O3 -include climits -I/tmp/n7/include \
            science-boundary/job-shop-ta41/original_n7_cold_30x20_driver.cpp \
            /tmp/n7/src/graph.cpp /tmp/n7/src/instance.cpp /tmp/n7/src/schedule.cpp /tmp/n7/src/tabu_search.cpp \
            -o /tmp/n7_cold
      - name: Build 12 independent elite starts from N7 random active search, not known answers
        run: |
          python3 science-boundary/job-shop-ta41/create_independent_n7_positive.py \
            --reference-root /tmp/scheduleopt --driver /tmp/n7_cold \
            --seconds 20 --seeds 1701 1711 \
            --out science-boundary/job-shop-ta41/positive-n7-elite-data
      - name: Persist independently verified valid hard positive starts
        if: always()
        run: |
          set -euo pipefail
          path='science-boundary/job-shop-ta41/positive-n7-elite-data'
          if ! test -f "$path/manifest.json"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): preserve blind 30x20 positives from independent author N7 local optima'
          for i in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
