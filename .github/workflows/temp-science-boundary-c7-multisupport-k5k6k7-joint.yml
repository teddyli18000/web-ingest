name: Temp Science Boundary C7 k5-k6-k7 multisupport joint prize

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-multisupport-k5k6k7-joint.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-multisupport-k5k6k7-joint
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned source, verifier, and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"

      - name: Rebuild exact neutral5 outside-only audit
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_neutral5_irreducible_killer_audit.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/k5-audit.json" --workers "$(nproc)" \
            > "$RUNNER_TEMP/result/k5.stdout" 2> "$RUNNER_TEMP/result/k5.stderr"
          cat "$RUNNER_TEMP/result/k5.stdout"
          python3 - "$RUNNER_TEMP/result/k5-audit.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if r.get('outside_only_count') != 30: raise SystemExit(r)
          PY

      - name: Rebuild exact k6 cover-gap census
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_support_clique_cover_gap_census.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/k6.json" --k 6 --workers "$(nproc)" \
            > "$RUNNER_TEMP/result/k6.stdout" 2> "$RUNNER_TEMP/result/k6.stderr"
          cat "$RUNNER_TEMP/result/k6.stdout"
          python3 - "$RUNNER_TEMP/result/k6.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if r.get('k') != 6 or r.get('cover_gap_count') != 32: raise SystemExit(r)
          PY

      - name: Rebuild exact k7 cover-gap and irreducibility census
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_support_clique_cover_gap_census.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/k7.json" --k 7 --workers "$(nproc)" \
            > "$RUNNER_TEMP/result/k7.stdout" 2> "$RUNNER_TEMP/result/k7.stderr"
          cat "$RUNNER_TEMP/result/k7.stdout"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_gap_irreducibility_audit.py \
            "$RUNNER_TEMP/result/k7.json" "$RUNNER_TEMP/result/k7-audit.json" \
            > "$RUNNER_TEMP/result/k7-audit.stdout" 2> "$RUNNER_TEMP/result/k7-audit.stderr"
          cat "$RUNNER_TEMP/result/k7-audit.stdout"
          python3 - "$RUNNER_TEMP/result/k7.json" "$RUNNER_TEMP/result/k7-audit.json" <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1])); a=json.load(open(sys.argv[2]))
          if c.get('k') != 7 or c.get('cover_gap_count') != 611: raise SystemExit(c)
          if a.get('k') != 7 or a.get('input_gap_cases') != 611 or a.get('irreducible_positive_count') != 12: raise SystemExit(a)
          PY

      - name: Exact terminal-union multisupport joint prize
        id: prize
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_terminal_union_multisupport_joint_prize.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/prize.json" "$RUNNER_TEMP/shot/certificate.json" \
            --owner-file "$RUNNER_TEMP/result/k5-audit.json" \
            --owner-file "$RUNNER_TEMP/result/k6.json" \
            --owner-file "$RUNNER_TEMP/result/k7-audit.json" \
            > "$RUNNER_TEMP/result/prize.stdout" 2> "$RUNNER_TEMP/result/prize.stderr"
          cat "$RUNNER_TEMP/result/prize.stdout"
          tail -n 200 "$RUNNER_TEMP/result/prize.stderr"
          python3 - "$RUNNER_TEMP/result/prize.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          with open(sys.argv[2],'a') as f:
              f.write(f"score={r['score']}\n")
              f.write(f"objective={r['objective']}\n")
              f.write(f"found={'true' if r.get('candidate_materialized') else 'false'}\n")
          PY

      - name: Verify breakthrough with Few Shots verifier
        if: steps.prize.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if not r.get('valid') or int(r.get('score',-1)) < 134754: raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY

      - name: Upload exact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-multisupport-k5-k6-k7-joint
          path: |
            ${{ runner.temp }}/result
            ${{ runner.temp }}/shot
          if-no-files-found: warn
          retention-days: 14
