name: temp-aes-g103-crosscut-window

on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/g103_crosscut_window_resynth.py'
      - '.github/workflows/temp-aes-g103-crosscut-window.yml'

permissions:
  contents: read

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - basis: '1,2,4'
            start: 24
            label: b124-s24
          - basis: '1,2,4'
            start: 26
            label: b124-s26
          - basis: '1,2,4'
            start: 28
            label: b124-s28
          - basis: '1,2,4'
            start: 30
            label: b124-s30
          - basis: '1,2,4'
            start: 31
            label: b124-s31
          - basis: '1,3,4'
            start: 28
            label: b134-s28
          - basis: '1,3,4'
            start: 30
            label: b134-s30
          - basis: '1,3,4'
            start: 31
            label: b134-s31
          - basis: '2,3,4'
            start: 28
            label: b234-s28
          - basis: '2,3,4'
            start: 30
            label: b234-s30
          - basis: '2,3,4'
            start: 31
            label: b234-s31
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Jointly resynthesize late nonlinear and output window
        run: |
          set -euxo pipefail
          python -m py_compile \
            science-boundary/aes-sbox-circuit/g103_crosscut_window_resynth.py \
            science-boundary/aes-sbox-circuit/temporal_window_resynth.py
          python science-boundary/aes-sbox-circuit/g103_crosscut_window_resynth.py \
            --basis-rows '${{ matrix.basis }}' --start '${{ matrix.start }}' \
            --beam 360 --max-candidates 56 --restarts 6 --delta 3 --seed 17 \
            --out result | tee run.log
          cat result/summary.json
      - name: Official verifier for any <=100 candidate
        run: |
          set -euxo pipefail
          if [ -f result/candidate.json ] && [ "$(python -c "import json; print(len(json.load(open('result/candidate.json'))['gates']))")" -le 100 ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/shot
            cp result/candidate.json /tmp/shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-g103-crosscut-${{ matrix.label }}
          path: |
            result
            run.log
            official-verifier.jsonl
