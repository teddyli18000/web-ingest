name: temp-aes-g103-suffix-linear-cadical

on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/g103_suffix_linear_cadical.py'
      - '.github/workflows/temp-aes-g103-suffix-linear-cadical.yml'

permissions:
  contents: read

jobs:
  solve:
    strategy:
      fail-fast: false
      matrix:
        include:
          - basis: '1,2,4'
            label: identity19
            gates: 19
          - basis: '1,2,4'
            label: identity20
            gates: 20
          - basis: '1,2,4'
            label: identity22
            gates: 22
          - basis: '1,3,4'
            label: basis134-19
            gates: 19
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet python-sat
      - name: Solve reduced 17-bit suffix SLP
        run: |
          set -euxo pipefail
          python -m py_compile science-boundary/aes-sbox-circuit/g103_suffix_linear_cadical.py
          python science-boundary/aes-sbox-circuit/g103_suffix_linear_cadical.py \
            --basis-rows '${{ matrix.basis }}' --gates '${{ matrix.gates }}' \
            --conf-budget 10000000 --out result | tee run.log
          cat result/summary.json
      - name: Official verifier for any <=100 candidate
        run: |
          set -euxo pipefail
          if [ -f result/full.json ] && [ "$(python -c "import json; print(len(json.load(open('result/full.json'))['gates']))")" -le 100 ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/shot
            cp result/full.json /tmp/shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-g103-linear-cadical-${{ matrix.label }}
          path: |
            result
            run.log
            official-verifier.jsonl
