name: Temp Science Boundary C7 plateau multi-union MaxSAT

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-plateau-multi-maxsat.yml
      - science-boundary/shannon-capacity-c7/code/c7_10d_private_guided_walk.cpp
      - science-boundary/shannon-capacity-c7/code/patch_private_guided_snapshot.py
      - science-boundary/shannon-capacity-c7/code/recombine_multi_independent_sets_maxsat.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify Few Shots baseline
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
          cp "$RUNNER_TEMP/few-shots/problems/p004-shannon-capacity-c7/baseline/certificate.json" "$RUNNER_TEMP/baseline/certificate.json"
          python3 - "$RUNNER_TEMP/baseline/certificate.json" "$RUNNER_TEMP/baseline/ids.txt" <<'PY'
          import json,sys
          pts=json.load(open(sys.argv[1],encoding='utf-8'))['points']
          if len(pts)!=134753 or len(set(pts))!=134753: raise SystemExit('baseline drift')
          open(sys.argv[2],'w').write(''.join(f'{int(p,7)}\n' for p in pts))
          PY
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/baseline" | tee "$RUNNER_TEMP/result/baseline-verify.json"
      - name: Build snapshot-capable walker and install exact MaxSAT
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check python-sat
          python3 science-boundary/shannon-capacity-c7/code/patch_private_guided_snapshot.py \
            science-boundary/shannon-capacity-c7/code/c7_10d_private_guided_walk.cpp "$RUNNER_TEMP/walk-snapshot.cpp"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp "$RUNNER_TEMP/walk-snapshot.cpp" -o "$RUNNER_TEMP/walk"
      - name: Generate and verify four distant 134753 ties
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          for seed in 48101 48102 48103 48104; do
            mkdir -p "$RUNNER_TEMP/tie-$seed"
            /usr/bin/time -v "$RUNNER_TEMP/walk" \
              "$RUNNER_TEMP/baseline/ids.txt" "$RUNNER_TEMP/result/winner-$seed.ids" \
              10000 "$seed" 64 "$RUNNER_TEMP/tie-$seed/ids.txt" \
              > "$RUNNER_TEMP/result/walk-$seed.json" 2> "$RUNNER_TEMP/result/walk-$seed.stderr"
            test ! -f "$RUNNER_TEMP/result/winner-$seed.ids"
            python3 - "$RUNNER_TEMP/tie-$seed/ids.txt" "$RUNNER_TEMP/tie-$seed/certificate.json" <<'PY'
          import json,sys
          ids=[int(x) for x in open(sys.argv[1]) if x.strip()]
          if len(ids)!=134753 or len(set(ids))!=134753: raise SystemExit(('tie-size',len(ids),len(set(ids))))
          def enc(z):
              d=[]
              for _ in range(10): d.append(str(z%7));z//=7
              return ''.join(reversed(d))
          json.dump({'points':[enc(z) for z in sorted(ids)]},open(sys.argv[2],'w',encoding='utf-8'),separators=(',',':'));open(sys.argv[2],'a').write('\n')
          PY
            cd "$RUNNER_TEMP/few-shots"
            python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/tie-$seed" | tee "$RUNNER_TEMP/result/tie-$seed-verify.json"
            python3 - "$RUNNER_TEMP/result/tie-$seed-verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1))!=134753: raise SystemExit(r)
          PY
            cd "$GITHUB_WORKSPACE"
          done
      - name: Exact five-state union MIS by MaxSAT
        id: solve
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/recombine_multi_independent_sets_maxsat.py \
            "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/multi-maxsat.json" \
            "$RUNNER_TEMP/baseline/certificate.json" \
            "$RUNNER_TEMP/tie-48101/certificate.json" \
            "$RUNNER_TEMP/tie-48102/certificate.json" \
            "$RUNNER_TEMP/tie-48103/certificate.json" \
            "$RUNNER_TEMP/tie-48104/certificate.json" \
            --target 134754
          cat "$RUNNER_TEMP/result/multi-maxsat.json"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify breakthrough with Few Shots verifier
        if: steps.solve.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1))<=134753: raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-plateau-multi-maxsat
          path: ${{ runner.temp }}/result
          retention-days: 14
