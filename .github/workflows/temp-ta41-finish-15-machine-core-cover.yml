name: temp-ta41-finish-15-machine-core-cover
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/finish_machine_core_cover.py'
      - '.github/workflows/temp-ta41-finish-15-machine-core-cover.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-finish-15-machine-core-cover
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned independent CP-SAT backend
        run: python -m pip install 'ortools==9.14.6206'
      - name: Verify sole missing fixed-machine core and enumerate exact hypergraph
        run: python3 science-boundary/job-shop-ta41/finish_machine_core_cover.py --seconds 420
      - name: Official Few Shots verifier if a paradoxical candidate emerges
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/machine-core-15-completion"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Preserve finite proof and all uncertainties
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/machine-core-15-completion/
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): close last missing 14-machine group core'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
