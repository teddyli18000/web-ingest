name: temp-ta41-multi-parent-job-cohort
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/multi_parent_cohort.py'
      - '.github/workflows/temp-ta41-multi-parent-job-cohort.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-multi-parent-job-cohort
  cancel-in-progress: false
jobs:
  explore:
    strategy:
      fail-fast: false
      matrix:
        parent: [baseline, critical8, mixed20]
        mode: [deadline, optimize]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned exact constraint solver and check code compiles
        run: |
          python3 -m py_compile science-boundary/job-shop-ta41/multi_parent_cohort.py
          python3 -m pip install 'ortools==9.14.6206'
      - name: Compare direct-deadline and incumbent-warmstarted multi-parent job cohort search
        run: |
          python3 science-boundary/job-shop-ta41/multi_parent_cohort.py --parent '${{ matrix.parent }}' --mode '${{ matrix.mode }}' --seed 4107 --seconds 280 --case-seconds 14 --out 'science-boundary/job-shop-ta41/results/cohort-${{ matrix.parent }}-${{ matrix.mode }}'
      - name: Independently verify a breakthrough with Few Shots
        if: always()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/cohort-${{ matrix.parent }}-${{ matrix.mode }}"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Save only evidence and candidate to main, with conflict retries
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/cohort-${{ matrix.parent }}-${{ matrix.mode }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): multi-parent cohort ${{ matrix.parent }} ${{ matrix.mode }}'
          for attempt in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
