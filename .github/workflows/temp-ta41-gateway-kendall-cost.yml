name: temp-ta41-gateway-kendall-cost
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/gateway_kendall_cost.py'
      - '.github/workflows/temp-ta41-gateway-kendall-cost.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-gateway-kendall-cost
  cancel-in-progress: false
jobs:
  gateway:
    strategy:
      fail-fast: false
      matrix:
        arc: [120,124,127]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned OR-Tools CP
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/gateway_kendall_cost.py
      - name: Minimize distance to exact certified core reversal at score <=2006
        run: |
          python3 science-boundary/job-shop-ta41/gateway_kendall_cost.py \
            --arc '${{ matrix.arc }}' --seconds 180 \
            --out 'science-boundary/job-shop-ta41/results/gateway-${{ matrix.arc }}'
      - name: Verify official candidate schedule
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/gateway-${{ matrix.arc }}"
          if test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2006,v
          PY
          fi
      - name: Save verified gateway minimum/uncertainty for each core arc
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/gateway-${{ matrix.arc }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): minimum gateway reversal Kendall cost arc ${{ matrix.arc }}'
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
