name: temp-aes-g103-cut-basis-consistency

on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/g103_cut_basis_consistency.py'
      - '.github/workflows/temp-aes-g103-cut-basis-consistency.yml'

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        basis: ['1,2,4','1,3,4','2,3,4']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euxo pipefail
          python science-boundary/aes-sbox-circuit/g103_cut_basis_consistency.py \
            --basis-rows '${{ matrix.basis }}' | tee audit.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: aes-g103-cut-basis-consistency-${{ matrix.basis }}
          path: audit.jsonl
