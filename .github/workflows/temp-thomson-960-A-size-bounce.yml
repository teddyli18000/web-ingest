name: temp Thomson 960 A size bounce

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-A-size-bounce.yml'

jobs:
  bounce:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: add
            rank: 0
          - mode: add
            rank: 3
          - mode: remove
            rank: 0
          - mode: remove
            rank: 3
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Neighbor-size bounce from A
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) mode=${{ matrix.mode }} rank=${{ matrix.rank }} live=$live"
          python3 science-boundary/thomson-960/code/search_live_size_bounce.py \
            "$RUNNER_TEMP/seed/A-natural.json" --mode '${{ matrix.mode }}' --rank '${{ matrix.rank }}' \
            --return-branches 4 --first-maxiter 2600 --return-maxiter 3200 \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('SOURCE',d['source'])
          print('BEST',d['best_energy'],'DELTA',d['best_delta_live'])
          for r in d['returns']:
              print('RETURN',{k:v for k,v in r.items() if k!='points'})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-A-size-bounce-${{ matrix.mode }}-${{ matrix.rank }}
          path: ${{ runner.temp }}/out
          retention-days: 10
