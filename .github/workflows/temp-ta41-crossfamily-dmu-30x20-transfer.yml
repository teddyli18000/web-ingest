name: temp-ta41-crossfamily-dmu-30x20-transfer
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-crossfamily-dmu-30x20-transfer.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-crossfamily-dmu-30x20-transfer
  cancel-in-progress: false
jobs:
  group:
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: dmu16-20
            source_seed: 1901
            policy: dynamic
          - batch: dmu16-20
            source_seed: 1901
            policy: static
          - batch: dmu16-20
            source_seed: 1901
            policy: random
          - batch: dmu16-20
            source_seed: 1911
            policy: dynamic
          - batch: dmu16-20
            source_seed: 1911
            policy: static
          - batch: dmu16-20
            source_seed: 1911
            policy: random
          - batch: dmu56-60
            source_seed: 1901
            policy: dynamic
          - batch: dmu56-60
            source_seed: 1901
            policy: static
          - batch: dmu56-60
            source_seed: 1901
            policy: random
          - batch: dmu56-60
            source_seed: 1911
            policy: dynamic
          - batch: dmu56-60
            source_seed: 1911
            policy: static
          - batch: dmu56-60
            source_seed: 1911
            policy: random
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP solver and verify 10 new source-N7 starts per family
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/benchmark_machine_group_transfer.py science-boundary/job-shop-ta41/machine_group_order_repair.py
          test "$(find science-boundary/job-shop-ta41/positive-n7-${{ matrix.batch }} -name start.txt | wc -l)" -eq 10
      - name: 10 matched independent-start trials with strict 5 second deadline
        run: |
          python3 science-boundary/job-shop-ta41/benchmark_machine_group_transfer.py \
            --cases-dir 'science-boundary/job-shop-ta41/positive-n7-${{ matrix.batch }}' \
            --expected-instances 5 --initial-seed '${{ matrix.source_seed }}' \
            --policy '${{ matrix.policy }}' \
            --total-seconds 5 --cp-seconds 0.7 --master-seconds 0.15 \
            --repair-objective minimal-change \
            --out 'science-boundary/job-shop-ta41/results/dmu-transfer-${{ matrix.batch }}-${{ matrix.source_seed }}-${{ matrix.policy }}'
      - name: Preserve complete blinded independent DAG scores
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/dmu-transfer-${{ matrix.batch }}-${{ matrix.source_seed }}-${{ matrix.policy }}'
          if ! test -f "$dir/summary.json"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): blinded crossfamily DMU 30x20 whole-machine transfer ${{ matrix.batch }} ${{ matrix.source_seed }} ${{ matrix.policy }}'
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
  original_n7:
    strategy:
      fail-fast: false
      matrix:
        batch: [dmu16-20,dmu56-60]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Build unchanged 2025 source-author native N7 kernel with warmstart
        run: |
          git clone --depth=1 https://github.com/Qiming01/Job-Shop-Scheduling.git /tmp/n7
          git -C /tmp/n7 fetch --depth=1 origin 7e120ebada21cb604c871e0657814bf6e32611f8
          git -C /tmp/n7 checkout --detach 7e120ebada21cb604c871e0657814bf6e32611f8
          python3 science-boundary/job-shop-ta41/patch_original_n7_warmstart.py /tmp/n7
          g++ -std=c++20 -O3 -include climits -DN7_WARMSTART_SUPPORT -I/tmp/n7/include \
            science-boundary/job-shop-ta41/original_n7_blind_driver.cpp \
            /tmp/n7/src/graph.cpp /tmp/n7/src/instance.cpp /tmp/n7/src/schedule.cpp /tmp/n7/src/tabu_search.cpp \
            -o /tmp/n7_true_blind
      - name: Original author N7 on exact same 10 independent source starts per family and seeds
        run: |
          python3 science-boundary/job-shop-ta41/benchmark_true_n7_positive.py \
            --cases 'science-boundary/job-shop-ta41/positive-n7-${{ matrix.batch }}' \
            --driver /tmp/n7_true_blind --seconds 5 --seeds 4107 4113 \
            --out 'science-boundary/job-shop-ta41/results/dmu-source-n7-${{ matrix.batch }}'
      - name: Persist original source algorithm full operation-time validation
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/dmu-source-n7-${{ matrix.batch }}'
          if ! test -f "$dir/results.json"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): native N7 source 5 second DMU 30x20 crossover baseline ${{ matrix.batch }}'
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
