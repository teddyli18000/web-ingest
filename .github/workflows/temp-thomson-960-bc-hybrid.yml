name: temp Thomson 960 B-C hybrid saddle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-bc-hybrid.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Reproduce basin C
        run: |
          python3 science-boundary/thomson-960/code/harvest_basin_c.py \
            "$RUNNER_TEMP/few-shots" \
            --neighbor-json science-boundary/thomson-960/data/neighbor-soft-003280.json \
            --scale 0.95 --out "$RUNNER_TEMP/basin-c.json"
      - name: Optimize B-C string without climbing
        run: |
          python3 science-boundary/thomson-960/code/string_between_seeds.py \
            science-boundary/thomson-960/data/basin-b-010566.json \
            "$RUNNER_TEMP/basin-c.json" \
            --images 7 --iterations 180 --climb-iterations 0 \
            --eta 0.00025 --max-step 0.0007 \
            --out "$RUNNER_TEMP/string-bc.json"
      - name: Hybrid-refine B-C string maximum
        run: |
          python3 science-boundary/thomson-960/code/refine_saddle_hybrid.py \
            "$RUNNER_TEMP/string-bc.json" --outer 6 --penalty 200000 \
            --perp-maxiter 600 --newton-damping 0.8 \
            --out "$RUNNER_TEMP/hybrid-bc.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'hybrid-bc.json')
          d=json.load(open(p)); d.pop('saddle_points',None); d.pop('eigenvectors_physical',None)
          d['history']=d['history'][-2:]
          print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-basin-c-and-saddle-bc
          path: |
            ${{ runner.temp }}/basin-c.json
            ${{ runner.temp }}/string-bc.json
            ${{ runner.temp }}/hybrid-bc.json
          retention-days: 7
