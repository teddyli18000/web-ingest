name: temp-labs-ai4s-strong-harvest
on:
  push:
    paths:
      - ".github/workflows/temp-labs-ai4s-strong-harvest.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-strong-harvest
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Checkout and compile published unrestricted memetic tabu reference
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/borkob/git_labs.git "$RUNNER_TEMP/git_labs"
          cd "$RUNNER_TEMP/git_labs/solvers/lMAts-lRRts/src"
          make -j1
          test -x ./lMAts
          echo "Source reference: $(git rev-parse HEAD)"
      - name: Run twenty-five seeded published memetic-tabu searches
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/labs-ai4s-search/frontier_deformation/strong_collect.py \
            --solver "$RUNNER_TEMP/git_labs/solvers/lMAts-lRRts/src/lMAts" \
            --duration 30 --seeds 5 --workers 4
          rev="$(git -C "$RUNNER_TEMP/git_labs" rev-parse HEAD)"
          python3 - "$rev" <<'PY'
          import sys,json,pathlib
          p=pathlib.Path("science-boundary/labs-ai4s-search/frontier_deformation/results/2026-10-29-strong-corpus.json")
          data=json.loads(p.read_text())
          data["source_commit_sha"]=sys.argv[1]
          data.pop("solver_revision_recorded_externally",None)
          p.write_text(json.dumps(data,indent=2)+"\n")
          PY
      - name: Exact duplicate and energy independent verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,pathlib
          p=pathlib.Path("science-boundary/labs-ai4s-search/frontier_deformation/results/2026-10-29-strong-corpus.tsv")
          seen=set()
          with p.open() as f:
            records=list(csv.DictReader(f,delimiter="\t"))
          for r in records:
            n=int(r["n"]); seq=r["bits"];assert len(seq)==n
            z=[1 if c=="1" else -1 for c in seq]
            e=sum(sum(z[i]*z[i+k] for i in range(n-k))**2 for k in range(1,n))
            assert e==int(r["energy"])
            assert (n,r["canonical"]) not in seen
            seen.add((n,r["canonical"]))
          print("verified",len(records),"exact candidates")
          PY
      - name: Commit only verified public scientific results to owning topic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science-boundary/labs-ai4s-search/frontier_deformation/results/2026-10-29-strong-corpus.tsv
          git add science-boundary/labs-ai4s-search/frontier_deformation/results/2026-10-29-strong-corpus.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(labs-ai4s): record independently verified published memetic tabu states"
          git pull --rebase origin main
          git push origin HEAD:main
