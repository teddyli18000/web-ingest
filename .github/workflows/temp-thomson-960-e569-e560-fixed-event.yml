name: temp Thomson 960 e569-e560 fixed event

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-e569-e560-fixed-event.yml'

jobs:
  continue-event:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: geo
            fracs: '1.0'
            alphas: '-0.30,0.08,0.16,0.30,0.50,0.80,1.20,1.70'
            ts: '0.80,0.92,0.98,1.01,1.025,1.05,1.08,1.12,1.18,1.28,1.45,1.70,2.00,2.40'
          - profile: core
            fracs: '0.02,0.04,0.06,0.08,0.12'
            alphas: '-0.50,-0.20,0.05,0.10,0.18,0.30,0.50,0.80,1.20,1.80,2.50'
            ts: ''
          - profile: meso
            fracs: '0.15,0.22,0.35,0.50'
            alphas: '-0.50,-0.20,0.05,0.10,0.18,0.30,0.50,0.80,1.20,1.80,2.50'
            ts: ''
          - profile: broad
            fracs: '0.70,1.0'
            alphas: '-0.50,-0.20,0.05,0.10,0.18,0.30,0.50,0.80,1.20,1.80,2.50'
            ts: ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Reproduce e569 and e560 with physical labels
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 science-boundary/thomson-960/code/harvest_20_string_image.py \
            "$RUNNER_TEMP/few-shots" science-boundary/thomson-960/data/basin-20-morph-9136.json \
            --seed 7301 --starts 18 --images 11 --iterations 260 --eta 0.00022 --max-step 0.0006 \
            --image-index 7 --expected 444368.5698901982 --tol 0.00005 --quench-maxiter 2800 \
            --out "$RUNNER_TEMP/out/e569.json"
          python3 science-boundary/thomson-960/code/search_seed_multimode_parallel.py \
            "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/out/e569.json" \
            --modes 5 --amps 0.020 --k 8 --workers "$(nproc)" --maxiter 2600 --keep-basins 4 \
            --out "$RUNNER_TEMP/out/e560-step.json"
          python3 - <<'PY'
          import json,pathlib,os,sys,numpy as np
          sys.path.insert(0,'science-boundary/thomson-960/code')
          import search_topology_morph as tm
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          d=json.loads((out/'e560-step.json').read_text()); target=444368.56093335064
          b=min(d['lowest_distinct_basins'],key=lambda z:abs(z['energy']-target))
          if abs(b['energy']-target)>5e-5: raise RuntimeError(b['energy'])
          x=np.asarray(b['points'],float); x/=np.linalg.norm(x,axis=1)[:,None]
          cc=tm.coord_counts(x)
          if cc!={'5':30,'6':912,'7':18}: raise RuntimeError(cc)
          (out/'e560.json').write_text(json.dumps({'name':'e560','energy':b['energy'],'coord_counts':cc,'points':x.tolist()},separators=(',',':'))+'\n')
          score,_=tm.find_live(pathlib.Path(os.environ['RUNNER_TEMP'])/'few-shots')
          (out/'live-score.txt').write_text(str(score))
          print('E560',b['energy'],cc,'LIVE',score)
          PY
      - name: Continue the physical e569-to-e560 event through e560
        shell: bash
        run: |
          set -euo pipefail
          live=$(cat "$RUNNER_TEMP/out/live-score.txt")
          python3 science-boundary/thomson-960/code/search_pair_event_transfer.py \
            "$RUNNER_TEMP/out/e569.json" "$RUNNER_TEMP/out/e560.json" \
            --fixed-correspondence --seed 9960 --starts 1 --maxiter 3000 \
            --ts='${{ matrix.ts }}' --fracs '${{ matrix.fracs }}' --alphas='${{ matrix.alphas }}' \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('PROFILE','${{ matrix.profile }}','CORR',d['correspondence'],'BEST',d['best_energy'],'DELTA_LIVE',d['best_delta_live'],'LABEL',d['best_label'])
          for b in d['distinct_low_basins'][:20]: print('BASIN',b['energy'],b['coord_counts'],b['label'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e569-e560-fixed-${{ matrix.profile }}
          path: ${{ runner.temp }}/out
          retention-days: 7
