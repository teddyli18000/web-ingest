name: temp-ta41-reversed-core-neutral-basin
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/reversed_core_basin.py'
      - '.github/workflows/temp-ta41-reversed-core-neutral-basin.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-reversed-core-neutral-basin
  cancel-in-progress: false
jobs:
  explore:
    strategy:
      fail-fast: false
      matrix:
        parent: [rev5,rev6,rev7]
        mode: [cohorts,timebands]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify code syntax and install pinned CP solver
        run: |
          python3 -m py_compile science-boundary/job-shop-ta41/reversed_core_basin.py
          python3 -m pip install 'ortools==9.14.6206'
      - name: Exact global repair around 2006 schedules outside previous shared precedence core
        run: |
          python3 science-boundary/job-shop-ta41/reversed_core_basin.py --parent '${{ matrix.parent }}' --mode '${{ matrix.mode }}' --seconds 320 --case-seconds 18 --out 'science-boundary/job-shop-ta41/results/reversed-basin-${{ matrix.parent }}-${{ matrix.mode }}'
      - name: Official Few Shots verification on any breakthrough
        if: always()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/reversed-basin-${{ matrix.parent }}-${{ matrix.mode }}"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist evidence under own topic with atomic main push retries
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/reversed-basin-${{ matrix.parent }}-${{ matrix.mode }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): escaped shared-core basin ${{ matrix.parent }} ${{ matrix.mode }}'
          for attempt in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
