name: temp labs-100 elite near-skew crossover cubes

on:
  push:
    paths:
      - '.github/workflows/temp-labs-100-nearskew-elite-cubes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cube:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 578-622
            dim: 24
            a: '++++++--+++++-----++-++--+--++++++++++---+-++--++++-+--++----+--+-+-+-+-++---++---++-+-++-+-++--+-+-'
