            b: '++++++++----+---++-------+-+--+++----++----+-++--++--++----+-++--+-++-++-----+-+-+--++-+++-+--+-+-+-'
          - name: 650-678b
            dim: 24
            a: '++--+++++--+++++-+++++--+++++------+++-+---+--+-+-++++++---+----+--+-+-++-+-++--+-+---+-+--++-+-++--'
            b: '++----+++---+++++-+-+-+--+----+-+-++-+++-++--+--++--++---++---+---++++++-+---++++++++-+-++-++-++-+--'
          - name: 650-682
