          - name: 674-678a
            dim: 25
            a: '++--++-+-++--+-++-+-+-+-+-+--++--+++--+-+-+--+-++-+++----+++++++--+--++--++++++++++++----++-----++--'
            b: '++++--+++++--++----+++-------++------+--++++++-+---+----+-+-++---+-+-++--+-+-+--+--+-++--++-+-++--+-'
          - name: 674-678b
            dim: 21
            a: '++--++-+-++--+-++-+-+-+-+-+--++--+++--+-+-+--+-++-+++----+++++++--+--++--++++++++++++----++-----++--'
            b: '++----+++---+++++-+-+-+--+----+-+-++-+++-++--+--++--++---++---+---++++++-+---++++++++-+-++-++-++-+--'
          - name: 678a-678b
            dim: 24
            a: '++++--+++++--++----+++-------++------+--++++++-+---+----+-+-++---+-+-++--+-+-+--+--+-++--++-+-++--+-'
            b: '++----+++---+++++-+-+-+--+----+-+-++-+++-++--+--++--++---++---+---++++++-+---++++++++-+-++-++-++-+--'
          - name: 678a-686
            dim: 25
            a: '++++--+++++--++----+++-------++------+--++++++-+---+----+-+-++---+-+-++--+-+-+--+--+-++--++-+-++--+-'
            b: '++++----+++------++++++-++++++-++++---+++--+++--++--++--+--++-++-++-+---+-+-+++-+-+--+-+-++-++-+--+-'
          - name: 678b-682
            dim: 23
            a: '++----+++---+++++-+-+-+--+----+-+-++-+++-++--+--++--++---++---+---++++++-+---++++++++-+-++-++-++-+--'
            b: '++++++++----+---++-------+-+--+++----++----+-++--++--++----+-++--+-++-++-----+-+-+--++-+++-+--+-+-+-'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build exact cube scanner
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20 -DNDEBUG science-boundary/labs-100/code/nearskew_cube.cpp -o /tmp/nearskew-cube
      - name: Exhaust crossover cube
        shell: bash
        run: |
          set -euo pipefail
          /tmp/nearskew-cube '${{ matrix.a }}' '${{ matrix.b }}' 25 | tee /tmp/cube.txt
          grep -F 'CUBE dims=${{ matrix.dim }} ' /tmp/cube.txt
          seq=$(sed -n 's/^BESTSEQ //p' /tmp/cube.txt | tail -n1)
          python3 science-boundary/labs-100/code/verify.py -- "$seq"
      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: labs100-elite-cube-${{ matrix.name }}
          path: /tmp/cube.txt
