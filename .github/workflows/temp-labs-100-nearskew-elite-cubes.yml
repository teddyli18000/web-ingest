            b: '++--+++++--+++++-+++++--+++++------+++-+---+--+-+-++++++---+----+--+-+-++-+-++--+-+---+-+--++-+-++--'
          - name: 622-674
            dim: 24
            a: '++--+--+++++++++++++++-------++++--+--+--+--+++--+---++-++---+++---++-+--+-+-+--+-+-+-+-+-+-+--+++--'
            b: '++--++-+-++--+-++-+-+-+-+-+--++--+++--+-+-+--+-++-+++----+++++++--+--++--++++++++++++----++-----++--'
          - name: 622-678a
            dim: 21
            a: '++--+--+++++++++++++++-------++++--+--+--+--+++--+---++-++---+++---++-+--+-+-+--+-+-+-+-+-+-+--+++--'
            b: '++++--+++++--++----+++-------++------+--++++++-+---+----+-+-++---+-+-++--+-+-+--+--+-++--++-+-++--+-'
          - name: 622-678b
            dim: 19
