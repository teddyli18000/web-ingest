name: temp-ta41-upstream-nds-cpp-baseline
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/reproduce_nds_cpp.py'
      - '.github/workflows/temp-ta41-upstream-nds-cpp-baseline.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-upstream-nds-cpp-baseline
  cancel-in-progress: false
jobs:
  nds:
    strategy:
      fail-fast: false
      matrix:
        method: [random,heuristic]
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned authors' original C++ implementation
        run: |
          git clone --depth=1 https://github.com/dawoz/NDS-S.git /tmp/nds-s
          git -C /tmp/nds-s fetch --depth=1 origin c58783b0271f95d9a56252d8841fa2a78535a4d2
          git -C /tmp/nds-s checkout --detach c58783b0271f95d9a56252d8841fa2a78535a4d2
          git -C /tmp/nds-s rev-parse HEAD
      - name: Install lightweight original C++ compiler imports (no model training)
        run: |
          python3 -m pip install cppimport pybind11 numpy mako
          python3 -m py_compile science-boundary/job-shop-ta41/reproduce_nds_cpp.py
      - name: Verify ta41 data exactly and reproduce upstream destroy-repair baseline
        run: |
          python3 science-boundary/job-shop-ta41/reproduce_nds_cpp.py --nds-repo /tmp/nds-s --method '${{ matrix.method }}' --q 10 --rollouts 16 --recreate 6 --seed 4107 --seconds 290 --out 'science-boundary/job-shop-ta41/results/nds-cpp-${{ matrix.method }}'
      - name: Independently judge all <=2005 improvement certificates
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/nds-cpp-${{ matrix.method }}"
          if test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);x=json.loads((p/'upstream-verdict.json').read_text())
          assert x['valid'] and int(x['score'])<=2005,x
          PY
          fi
      - name: Commit reproducible outcome or failure evidence
        if: always()
        run: |
          set -euo pipefail
          out='science-boundary/job-shop-ta41/results/nds-cpp-${{ matrix.method }}'
          if ! test -d "$out"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): authors original NDS C++ ${{ matrix.method }} repair'
          for i in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
