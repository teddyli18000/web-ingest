name: Temp Science Boundary C7 neutral5 by k6 witness sweep

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-neutral5-k6-witness-sweep.yml
      - science-boundary/shannon-capacity-c7/code/bpz_neutral5_k6_witness_sweep.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-science-boundary-c7-neutral5-k6-witness-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned sources, Few Shots, dependencies, and completed neutral5 audit artifact
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/audit" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
          gh run download 40994810518 -R teddyli18000/web-ingest -n c7-neutral5-killer-audit -D "$RUNNER_TEMP/audit"
          test -f "$RUNNER_TEMP/audit/audit.json"
      - name: Exact audited neutral5 x k6 witness replay
        id: sweep
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_neutral5_k6_witness_sweep.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/audit/audit.json" "$RUNNER_TEMP/result/status.json" "$RUNNER_TEMP/shot/certificate.json" \
            > "$RUNNER_TEMP/result/stdout" 2> "$RUNNER_TEMP/result/stderr"
          cat "$RUNNER_TEMP/result/stdout"
          tail -n 120 "$RUNNER_TEMP/result/stderr"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify breakthrough with Few Shots verifier
        if: steps.sweep.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1))<134754: raise SystemExit(r)
          PY
      - name: Upload exact sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-neutral5-k6-witness-sweep
          path: |
            ${{ runner.temp }}/result
            ${{ runner.temp }}/shot
          retention-days: 14
