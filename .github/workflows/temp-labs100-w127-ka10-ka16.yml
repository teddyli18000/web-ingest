name: temp labs100 W127 ka10 ka16 exact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-labs100-w127-ka10-ka16.yml'

concurrency:
  group: temp-labs100-w127-ka10-ka16
  cancel-in-progress: false

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build exact kernels
        run: |
          g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_w127_ka10_kernel_mitm.cpp -o /tmp/ka10
          g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_w127_ka16_kernel_mitm.cpp -o /tmp/ka16
          g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_h20_w127_h10_profiles.cpp -o /tmp/h10_profiles
          g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_h20_w127_ngp10.cpp -o /tmp/ngp10
      - name: Exact ka10 exclusion using all CPUs
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          echo "runner_cpus=$OMP_NUM_THREADS"
          /tmp/ka10 2>&1 | tee "$RUNNER_TEMP/ka10.log"
          grep -q '^SUMMARY support_pair_orbits=3909436 cross=18960355 target=0 ' "$RUNNER_TEMP/ka10.log"
      - name: Exact ka16 projection using all CPUs
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          cd "$RUNNER_TEMP"
          /tmp/ka16 2>&1 | tee ka16.log
          grep -q '^SUMMARY supports=6578 c_reps=824362 cross=35894201 target=4 ' ka16.log
          test "$(wc -l < ka16_survivors.txt)" -eq 4
      - name: Regenerate order10 cross plus NGP profiles using all CPUs
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          /tmp/h10_profiles "$RUNNER_TEMP/h10"
          /tmp/ngp10 "$RUNNER_TEMP/h10" | tee "$RUNNER_TEMP/ngp10.log"
          grep -q '^SUMMARY input_pairs=63660 projected_NGP_survivors=4220$' "$RUNNER_TEMP/ngp10.log"
      - name: Prove all four ka16 projected survivors fail the order10 lift
        shell: bash
        run: |
          set -euo pipefail
          python science-boundary/labs-100/code/oddperfect_w127_ka16_order10_compat.py \
            "$RUNNER_TEMP/ka16_survivors.txt" "$RUNNER_TEMP/h10_ngp10_survivors.txt" \
            | tee "$RUNNER_TEMP/ka16-order10-compat.log"
          grep -q '^SUMMARY survivors=4 profiles=4220 compatible_pairs=0$' "$RUNNER_TEMP/ka16-order10-compat.log"
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-w127-ka10-ka16
          path: |
            ${{ runner.temp }}/ka10.log
            ${{ runner.temp }}/ka16.log
            ${{ runner.temp }}/ka16_survivors.txt
            ${{ runner.temp }}/ngp10.log
            ${{ runner.temp }}/ka16-order10-compat.log
          if-no-files-found: warn
