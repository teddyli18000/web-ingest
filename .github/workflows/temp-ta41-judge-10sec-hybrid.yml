name: temp-ta41-judge-10sec-hybrid
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-judge-10sec-hybrid.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-judge-10sec-hybrid
  cancel-in-progress: false
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Require exact paired 5s and 10s native + CP + native hybrid trial outputs
        run: |
          set -euo pipefail
          python3 -m py_compile science-boundary/job-shop-ta41/judge_job_release_portfolio.py
          for seed in 4107 4113; do
            test -f "science-boundary/job-shop-ta41/results/job-radius-ladder-s$seed/results.json"
            test -f "science-boundary/job-shop-ta41/results/positive-cp-to-n7-hybrid-s$seed/results.json"
            test -f "science-boundary/job-shop-ta41/results/positive-independent-true-n7-10s-s$seed/results.json"
          done
      - name: Judge five-second CP + authentic N7 and ten-second authentic N7 on equal elite starts
        run: python3 science-boundary/job-shop-ta41/judge_job_release_portfolio.py
      - name: Save prospective untouched holdout and all matched controls
        run: |
          set -euo pipefail
          path='science-boundary/job-shop-ta41/results/job-release-10sec-hybrid-judged.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'research(ta41): grade direct CP/N7 sequential 10s vs native N7 10s on 24 independent source elite tests'
          for attempt in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
