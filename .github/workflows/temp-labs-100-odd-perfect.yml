name: temp labs-100 odd-perfect calibration
on:
  push:
    paths:
      - 'science-boundary/labs-100/code/odd_perfect.cpp'
      - '.github/workflows/temp-labs-100-odd-perfect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and run
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20 -fopenmp -DNDEBUG science-boundary/labs-100/code/odd_perfect.cpp -o /tmp/odd-perfect
          set +e
          /tmp/odd-perfect --runs 16 --threads 4 --proposals 20000 --repair 80 --seed 1 | tee /tmp/odd-perfect.txt
          rc=${PIPESTATUS[0]}
          set -e
          grep -F 'FINAL energy=' /tmp/odd-perfect.txt
          exit 0
