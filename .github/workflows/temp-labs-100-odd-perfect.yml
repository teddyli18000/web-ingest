name: temp labs-100 exact target search
on:
  push:
    paths:
      - 'science-boundary/labs-100/code/cpsat_target.py'
      - '.github/workflows/temp-labs-100-odd-perfect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpsat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install OR-Tools
        run: |
          python3 -m pip install --disable-pip-version-check ortools
          python3 -c 'import ortools; print("ortools", ortools.__version__)'
      - name: Search odd-perfect target 574
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/labs-100/code/cpsat_target.py --target 574 --seconds 600 --workers 4 --seed 1 | tee /tmp/cpsat.txt
          grep -E '^(STATUS|FOUND|NO_CERTIFICATE)' /tmp/cpsat.txt
