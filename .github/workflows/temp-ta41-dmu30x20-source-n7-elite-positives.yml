name: temp-ta41-dmu30x20-source-n7-elite-positives
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-dmu30x20-source-n7-elite-positives.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-dmu30x20-source-n7-elite-positives
  cancel-in-progress: false
jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: dmu16-20
            names: 'dmu16 dmu17 dmu18 dmu19 dmu20'
          - batch: dmu56-60
            names: 'dmu56 dmu57 dmu58 dmu59 dmu60'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - name: Pin authentic original native N7 optimizer and authoritative ScheduleOpt DMU 30x20 data
        run: |
          git clone --depth=1 https://github.com/Qiming01/Job-Shop-Scheduling.git /tmp/n7
          git -C /tmp/n7 fetch --depth=1 origin 7e120ebada21cb604c871e0657814bf6e32611f8
          git -C /tmp/n7 checkout --detach 7e120ebada21cb604c871e0657814bf6e32611f8
          git clone --depth=1 https://github.com/ScheduleOpt/benchmarks.git /tmp/scheduleopt
          g++ -std=c++20 -O3 -include climits -I/tmp/n7/include \
            science-boundary/job-shop-ta41/original_n7_cold_30x20_driver.cpp \
            /tmp/n7/src/graph.cpp /tmp/n7/src/instance.cpp /tmp/n7/src/schedule.cpp /tmp/n7/src/tabu_search.cpp \
            -o /tmp/n7_cold
      - name: Blind 20-second N7 cold basins for ten new 30x20 DMU source instances, no target oracle passed
        run: |
          python3 -m py_compile science-boundary/job-shop-ta41/create_independent_n7_positive.py
          python3 science-boundary/job-shop-ta41/create_independent_n7_positive.py \
            --reference-root /tmp/scheduleopt --driver /tmp/n7_cold \
            --instances ${{ matrix.names }} --seconds 20 --seeds 1901 1911 \
            --out 'science-boundary/job-shop-ta41/positive-n7-${{ matrix.batch }}'
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          batch='${{ matrix.batch }}'
          p=Path(f'science-boundary/job-shop-ta41/positive-n7-{batch}/provenance.json')
          p.write_text(json.dumps({'source_Reference_ScheduleOpt_commit':subprocess.check_output(
            ['git','-C','/tmp/scheduleopt','rev-parse','HEAD'],text=True).strip(),
            'source_real_N7_commit':'7e120ebada21cb604c871e0657814bf6e32611f8',
            'original_N7_runtime_per_case_seconds':20,
            'reference_orders_not_in_start_txt':True},indent=2)+'\n')
          PY
      - name: Persist independently verified full 600-operation 30x20 DMU elite starts
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/positive-n7-${{ matrix.batch }}'
          if ! test -f "$dir/manifest.json"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): 20-second genuine source N7 independent DMU 30x20 positives ${{ matrix.batch }}'
          for i in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
