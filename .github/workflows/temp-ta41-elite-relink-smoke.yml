name: temp-ta41-elite-relink-smoke
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-elite-relink-smoke.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-elite-relink-smoke
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile and lint source-backed candidate scoring
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra science-boundary/job-shop-ta41/elite_replacement_relink.cpp -o /tmp/relink
          python3 -m py_compile science-boundary/job-shop-ta41/run_elite_relink.py
      - name: Check both paths, all eight official 2006 starting certificates
        run: |
          set -euo pipefail
          for mode in greedy dynamic2; do
            python3 science-boundary/job-shop-ta41/run_elite_relink.py \
              --mode "$mode" --seed 4107 --evaluations 10000 \
              --binary /tmp/relink --out "science-boundary/job-shop-ta41/results/relink-smoke-$mode"
          done
      - name: Independently validate any new full schedule with official Few Shots
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
          for mode in greedy dynamic2; do
            root="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/relink-smoke-$mode"
            if test -f "$root/certificate.json"; then
              cd /tmp/few-shots
              python3 problems/p009-job-shop-ta41/verify/verify.py "$root" | tee "$root/upstream-verdict.json"
              python3 - "$root" <<'PY'
          import json,sys
          from pathlib import Path
          x=json.loads((Path(sys.argv[1])/'upstream-verdict.json').read_text())
          assert x['valid'] and int(x['score'])<=2005,x
          PY
            elif test -f "$root/neutral-certificate.json"; then
              mkdir -p /tmp/verify-neutral
              cp "$root/neutral-certificate.json" /tmp/verify-neutral/certificate.json
              cd /tmp/few-shots
              python3 problems/p009-job-shop-ta41/verify/verify.py /tmp/verify-neutral | tee "$root/upstream-neutral-verdict.json"
              python3 - "$root" <<'PY'
          import json,sys
          from pathlib import Path
          x=json.loads((Path(sys.argv[1])/'upstream-neutral-verdict.json').read_text())
          assert x['valid'] and int(x['score'])==2006,x
          PY
            fi
          done
      - name: Preserve pilot evidence
        if: always()
        run: |
          set -euo pipefail
          for mode in greedy dynamic2; do
            dir="science-boundary/job-shop-ta41/results/relink-smoke-$mode"
            rm -f "$dir/elite-pool.txt" "$dir/raw.txt"
            if test -d "$dir"; then git add "$dir"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(ta41): verify original elite path-relink vs replacement prediction smoke'
          for i in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
