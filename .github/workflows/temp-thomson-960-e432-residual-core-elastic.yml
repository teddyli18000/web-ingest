name: temp Thomson 960 e432 residual core elastic

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-e432-residual-core-elastic.yml'

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: shell1
            shell: '1'
            decay: '1.0'
          - tag: shell2
            shell: '2'
            decay: '1.0'
          - tag: shell3
            shell: '3'
            decay: '1.0'
          - tag: shell4
            shell: '4'
            decay: '1.0'
          - tag: shell4-decay065
            shell: '4'
            decay: '0.65'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Search high-frequency residual coupling
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) tag=${{ matrix.tag }} live=$live"
          python3 science-boundary/thomson-960/code/search_residual_core_elastic_split.py \
            "$RUNNER_TEMP/seed/e432.json" "$RUNNER_TEMP/seed/B-natural.json" \
            --shell '${{ matrix.shell }}' --decay '${{ matrix.decay }}' --k 48 \
            --core-scales '0.35,0.50,0.65,0.80,1.0,1.25' \
            --far-scales '0.35,0.50,0.65,0.80,1.0,1.25' \
            --captured-scales '0,0.5,1.0' \
            --maxiter 3400 --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('POWER',d['captured48_power'],d['residual_core_power'],d['residual_far_power'],'BEST',d['best_energy'],'DELTA',d['best_delta_live'])
          for b in d['distinct_low_basins'][:24]:
              print('BASIN',b['energy'],b['delta_live'],b['coord_counts'],'a',b['core_scale'],'b',b['far_scale'],'h',b['captured_scale'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e432-residual-core-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 10
