name: Riemann-Weil Schur prime-phase spectrum

on:
  push:
    branches: [main]
    paths:
      - 'temp-work/riemann-weil-research/experiments/schur_pivot_phase_spectrum.py'
      - 'temp-work/riemann-weil-research/results/even-schur-pivots-c100-N120.json'
      - '.github/workflows/riemann-weil-schur-phase.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riemann-weil-schur-phase-main
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run phase spectrum
        run: |
          set -euo pipefail
          python temp-work/riemann-weil-research/experiments/schur_pivot_phase_spectrum.py \
            --input temp-work/riemann-weil-research/results/even-schur-pivots-c100-N120.json \
            --output temp-work/riemann-weil-research/results/schur-pivot-phase-spectrum-c100-N120.json \
            --Nmin 32 --degree 2 --permutations 4000
          python -m json.tool temp-work/riemann-weil-research/results/schur-pivot-phase-spectrum-c100-N120.json >/dev/null
      - name: Commit result safely
        run: |
          set -euo pipefail
          git config user.name 'riemann-weil-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          path='temp-work/riemann-weil-research/results/schur-pivot-phase-spectrum-c100-N120.json'
          git add "$path"
          git diff --cached --quiet && exit 0
          git commit -m 'research: record Schur prime-phase spectrum'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
