name: temp Baidu rclone bootstrap probe

on:
  push:
    paths:
      - '.github/workflows/temp-baidu-rclone-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            baidu-drive
      - name: Install cipher dependency
        run: python3 -m pip install "cryptography==46.0.4"
      - name: Download and verify pinned Linux rclone
        run: |
          python3 - <<'PY'
          import sys
          import tempfile
          from pathlib import Path
          sys.path.insert(0, "baidu-drive")
          from auth_provision import install_rclone
          with tempfile.TemporaryDirectory() as temp:
              install_rclone(Path(temp) / "rclone")
          print("Pinned Linux rclone bootstrap succeeded.")
          PY
      - name: Trigger Baidu Drive master after successful bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run baidu-drive-worker.yml --repo teddyli18000/web-ingest --ref main -f reason=auth-updated
