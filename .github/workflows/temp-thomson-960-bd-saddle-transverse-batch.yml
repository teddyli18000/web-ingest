name: temp Thomson 960 B-D saddle transverse batch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-bd-saddle-transverse-batch.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Download certified B-D saddle
        uses: actions/download-artifact@v4
        with:
          name: thomson-bd-landau-certified
          path: ${{ runner.temp }}/bd
          github-token: ${{ github.token }}
          run-id: 40740593797
      - name: Report runner capacity
        run: |
          echo "nproc=$(nproc)"
          free -h
          ls -lh "$RUNNER_TEMP/bd"
      - name: Expand transverse modes and auto second-hop new basins
        run: |
          python3 science-boundary/thomson-960/code/run_bd_saddle_transverse_batch.py \
            "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/bd/bd-landau-polished.json" \
            --outdir "$RUNNER_TEMP/bd-transverse" \
            --modes 1,2,3,4,5,6,7,8 \
            --transverse-amps 0.002,0.004,0.007,0.011,0.017,0.026,0.040 \
            --reaction-amps=-0.00015,0,0.00015
      - name: Print compact result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bd-transverse/bd-transverse-batch.json" ]; then
            python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'bd-transverse','bd-transverse-batch.json')
          d=json.load(open(p))
          print('NEW_BASINS',d['new_basin_count'])
          print('BEST',d['best_energy'],d['best_delta_vs_live'])
          print('TOP',[(x.get('known_label') or 'NEW',x['energy'],x['source_mode'],x['source_sign'],x['transverse_amp'],x['reaction_amp'],x['twin_count']) for x in d['top_representatives']])
          print('SECOND',[(x['tag'],x.get('best_energy'),x.get('best_delta')) for x in d['second_hop']])
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-bd-saddle-transverse-batch
          retention-days: 7
          path: ${{ runner.temp }}/bd-transverse/
