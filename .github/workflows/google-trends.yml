name: Google Trends - Trending Now

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-trends.yml"
      - "google-trends/*.py"
      - "google-trends/config.json"
      - "google-trends/tests/**"
  schedule:
    # 12:07, 13:07, 14:07 Asia/Singapore (UTC+8).
    - cron: "7 4-6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: google-trends-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate task code
        run: |
          python -m py_compile google-trends/*.py
          python -m unittest discover -s google-trends/tests -v

      - name: Capture Google Trending Now
        run: python google-trends/capture.py

      - name: Refresh and validate archive
        run: |
          python google-trends/render_readme.py
          python google-trends/validate_archive.py

      - name: Commit snapshot
        run: |
          git add google-trends/data google-trends/README.md
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(google-trends): capture $(TZ=Asia/Singapore date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
