name: temp-labs-ai4s-parent-cohort-audit
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-parent-cohort-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Independent exact score and eightfold diversity verifier for 29 true elite parents
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/recombination_20261105
          python3 innovation/basin_search/audit_cohort.py data/combined/combined10.tsv \
            --output innovation/basin_search/results/cohort_geometry.json
          python3 - <<'PY'
          import json
          d=json.load(open('innovation/basin_search/results/cohort_geometry.json'))
          assert d['total_unique_parent_orbits']==29
          assert d['by_length']['92']['orbit_hamming_range']==[38,38]
          assert d['by_length']['99']['orbit_hamming_range']==[41,41]
          assert all(z['pairs']>0 for z in d['by_length'].values())
          print('VERIFIED all seven independent-length orbit-distance corpora')
          PY
      - name: Persist independent cohort provenance and exact geometry
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/recombination_20261105/innovation/basin_search/results/cohort_geometry.json
          git commit -m 'research(labs-ai4s): verify 29 independent parent orbit geometries'
          git pull --rebase origin main
          git push origin HEAD:main
