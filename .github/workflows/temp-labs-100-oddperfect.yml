name: temp labs-100 odd-perfect manifold campaign

on:
  push:
    paths:
      - .github/workflows/temp-labs-100-oddperfect.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-labs-100-oddperfect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, seed: 1000003, tenure_lo: 5, tenure_hi: 15 }
          - { shard: 1, seed: 11000027, tenure_lo: 5, tenure_hi: 15 }
          - { shard: 2, seed: 21000047, tenure_lo: 5, tenure_hi: 15 }
          - { shard: 3, seed: 31000069, tenure_lo: 5, tenure_hi: 15 }
          - { shard: 4, seed: 41000087, tenure_lo: 10, tenure_hi: 30 }
          - { shard: 5, seed: 51000103, tenure_lo: 10, tenure_hi: 30 }
          - { shard: 6, seed: 61000121, tenure_lo: 10, tenure_hi: 30 }
          - { shard: 7, seed: 71000143, tenure_lo: 10, tenure_hi: 30 }
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile odd-perfect searcher
        run: |
          g++ -O3 -march=native -std=c++20 -fopenmp -DNDEBUG \
            science-boundary/labs-100/code/oddperfect_walk.cpp \
            -o /tmp/labs100-oddperfect
      - name: Search shard and independently rescore its best sequence
        shell: bash
        run: |
          set -uo pipefail
          log=/tmp/oddperfect-${{ matrix.shard }}.txt
          set +e
          /tmp/labs100-oddperfect \
            --runs 128 \
            --steps 100000 \
            --threads 4 \
            --seed ${{ matrix.seed }} \
            --tenure-lo ${{ matrix.tenure_lo }} \
            --tenure-hi ${{ matrix.tenure_hi }} \
            --mode random \
            --target 574 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -gt 1 ]; then
            exit "$rc"
          fi
          seq=$(sed -n 's/^SUMMARY .* seq=//p' "$log" | tail -n 1)
          claimed=$(sed -n 's/^SUMMARY .* best=\([0-9][0-9]*\) .*$/\1/p' "$log" | tail -n 1)
          test ${#seq} -eq 100
          score=$(python3 science-boundary/labs-100/code/verify.py "$seq")
          printf 'claimed=%s\nverified=%s\nsequence=%s\n' "$claimed" "$score" "$seq" | tee /tmp/verify-${{ matrix.shard }}.txt
          test "$score" = "$claimed"
      - name: Upload shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: labs100-oddperfect-${{ matrix.shard }}
          path: |
            /tmp/oddperfect-${{ matrix.shard }}.txt
            /tmp/verify-${{ matrix.shard }}.txt
