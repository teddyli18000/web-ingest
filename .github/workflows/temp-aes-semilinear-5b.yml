name: temp-aes-semilinear-5b

on:
  push:
    paths:
      - '.github/workflows/temp-aes-semilinear-5b.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-aes-semilinear-5b
  cancel-in-progress: false

jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        mode: [exactcorr, support5]
        prefix: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Search third semilinear cost class
        run: |
          out=/tmp/aes-5b-${{ matrix.mode }}-${{ matrix.prefix }}
          mkdir -p "$out"
          if [ "${{ matrix.mode }}" = exactcorr ]; then
            python science-boundary/aes-sbox-circuit/search_semilinear_exactcorr.py \
              --c 0x5b --k 3 --prefix ${{ matrix.prefix }} \
              --max-support 4 --max-pre 19 --max-out 17 --out "$out" | tee "$out/run.log"
          else
            python science-boundary/aes-sbox-circuit/search_semilinear_support5.py \
              --c 0x5b --k 3 --prefix ${{ matrix.prefix }} \
              --max-pre 19 --max-out 17 --out "$out" | tee "$out/run.log"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aes-5b-${{ matrix.mode }}-${{ matrix.prefix }}
          path: /tmp/aes-5b-${{ matrix.mode }}-${{ matrix.prefix }}
