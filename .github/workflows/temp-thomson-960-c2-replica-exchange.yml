name: temp Thomson 960 C2 replica-exchange record hunt

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-c2-replica-exchange.yml'

jobs:
  c2-record-hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        seed: [7001, 8002]
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: few-shots/few-shots
          path: few-shots
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy numba
      - name: Compile and run C2 symmetry-recovery self-test
        run: |
          python3 -m py_compile \
            science-boundary/thomson-960/code/search_hamiltonian_scar_braid.py \
            science-boundary/thomson-960/code/search_c2_defect_replica_exchange.py
      - name: Six-temperature C2 replica exchange with full-space release
        run: |
          python3 science-boundary/thomson-960/code/search_c2_defect_replica_exchange.py \
            few-shots --seed ${{ matrix.seed }} --steps 120 --maxiter 630 \
            --out "$RUNNER_TEMP/out"
      - name: Report actual N960 candidates
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          f=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/'result.json'
          if f.exists():
              d=json.loads(f.read_text())
              print('SEED',d['seed'],'SWEEPS',d['steps_done'],
                    'BEST_C2',d['best_c2_energy'],'BEST_FULL',d['best_full_energy'],
                    'RELEASES',d['full_releases'],'CANDIDATES',d['candidates'])
              print('LOW_C2_POOL',d['pool'][:12])
              rows=[r for r in d['rows'] if 'energy_full' in r]
              print('LOW_FULL',sorted(((r['energy_full'],r['energy_c2'],r['mode'],r['step']) for r in rows))[:12])
          else:
              print('NO_RESULT')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-c2-replica-exchange-seed-${{ matrix.seed }}
          path: ${{ runner.temp }}/out
          retention-days: 10
