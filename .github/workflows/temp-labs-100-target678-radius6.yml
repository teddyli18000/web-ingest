name: temp labs-100 E678 radius-6 target-class shell

on:
  push:
    paths:
      - '.github/workflows/temp-labs-100-target678-radius6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-radius6:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust exact Hamming radius 6 around target-class E678
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20 -fopenmp -DNDEBUG \
            science-boundary/labs-100/code/sphere_shell.cpp \
            -o /tmp/labs100-sphere-shell
          seed='---------+--+-+--+--+-++-++++---+----++---++-+++-++---+---++-++--+-+++-++-+---++++---+++++---+-+-+-+'
          /tmp/labs100-sphere-shell "$seed" 6 | tee /tmp/target678-radius6.txt
          grep -F 'BASE energy=678' /tmp/target678-radius6.txt
          grep -F 'RADIUS radius=6 tested=1192052400 ' /tmp/target678-radius6.txt
      - name: Upload exact-shell evidence
        uses: actions/upload-artifact@v4
        with:
          name: labs100-target678-radius6
          path: /tmp/target678-radius6.txt
