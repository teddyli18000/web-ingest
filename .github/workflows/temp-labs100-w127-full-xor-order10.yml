name: temp labs100 W127 full XOR order10 partition audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-labs100-w127-full-xor-order10.yml'

concurrency:
  group: temp-labs100-w127-full-xor-order10
  cancel-in-progress: false

jobs:
  forbidden-half:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install OR-Tools and build exact order10 generators
        run: |
          python -m pip install --disable-pip-version-check 'ortools>=9.14,<10'
          g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_h20_w127_h10_profiles.cpp -o /tmp/h10_profiles
          g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_h20_w127_ngp10.cpp -o /tmp/ngp10
      - name: Regenerate the same 4220 rows used only to define the partition
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          /tmp/h10_profiles "$RUNNER_TEMP/h10"
          /tmp/ngp10 "$RUNNER_TEMP/h10" | tee "$RUNNER_TEMP/ngp10.log"
          grep -q '^SUMMARY input_pairs=63660 projected_NGP_survivors=4220$' "$RUNNER_TEMP/ngp10.log"
      - name: Solve the complementary outside-table half for ka12 and ka14
        shell: bash
        run: |
          set -uo pipefail
          echo "runner_cpus=$(nproc)"
          set +e
          python science-boundary/labs-100/code/oddperfect_e558_xor_order10_cpsat.py \
            --mode forbidden --ka 12 --profiles "$RUNNER_TEMP/h10_ngp10_survivors.txt" \
            --seconds 540 --workers 2 --seed 120128 >"$RUNNER_TEMP/ka12-forbidden.log" 2>&1 & p12=$!
          python science-boundary/labs-100/code/oddperfect_e558_xor_order10_cpsat.py \
            --mode forbidden --ka 14 --profiles "$RUNNER_TEMP/h10_ngp10_survivors.txt" \
            --seconds 540 --workers 2 --seed 140128 >"$RUNNER_TEMP/ka14-forbidden.log" 2>&1 & p14=$!
          wait $p12; r12=$?
          wait $p14; r14=$?
          set -e
          cat "$RUNNER_TEMP/ka12-forbidden.log"
          cat "$RUNNER_TEMP/ka14-forbidden.log"
          echo "exit_ka12=$r12 exit_ka14=$r14" | tee "$RUNNER_TEMP/status.txt"
          if grep -q '"independent_check": true' "$RUNNER_TEMP/ka12-forbidden.log" "$RUNNER_TEMP/ka14-forbidden.log"; then
            echo 'FOUND_E558_OUTSIDE_PROFILE_TABLE'
          fi
      - name: Upload partition-audit transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-w127-full-xor-order10-forbidden
          path: |
            ${{ runner.temp }}/ngp10.log
            ${{ runner.temp }}/ka12-forbidden.log
            ${{ runner.temp }}/ka14-forbidden.log
            ${{ runner.temp }}/status.txt
          if-no-files-found: warn
