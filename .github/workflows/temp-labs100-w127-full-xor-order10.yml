name: temp labs100 W127 full XOR plus order10

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-labs100-w127-full-xor-order10.yml'

concurrency:
  group: temp-labs100-w127-full-xor-order10
  cancel-in-progress: false

jobs:
  exact-last-two:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install OR-Tools and build exact order10 generators
        run: |
          python -m pip install --disable-pip-version-check 'ortools>=9.14,<10'
          g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_h20_w127_h10_profiles.cpp -o /tmp/h10_profiles
          g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/oddperfect_h20_w127_ngp10.cpp -o /tmp/ngp10
      - name: Regenerate the 4220 exact order10 profiles
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          /tmp/h10_profiles "$RUNNER_TEMP/h10"
          /tmp/ngp10 "$RUNNER_TEMP/h10" | tee "$RUNNER_TEMP/ngp10.log"
          grep -q '^SUMMARY input_pairs=63660 projected_NGP_survivors=4220$' "$RUNNER_TEMP/ngp10.log"
      - name: Solve ka12 and ka14 concurrently with two workers each
        shell: bash
        run: |
          set -uo pipefail
          echo "runner_cpus=$(nproc)"
          set +e
          python science-boundary/labs-100/code/oddperfect_e558_xor_order10_cpsat.py \
            --ka 12 --profiles "$RUNNER_TEMP/h10_ngp10_survivors.txt" --seconds 720 --workers 2 --seed 120127 \
            >"$RUNNER_TEMP/ka12.log" 2>&1 & p12=$!
          python science-boundary/labs-100/code/oddperfect_e558_xor_order10_cpsat.py \
            --ka 14 --profiles "$RUNNER_TEMP/h10_ngp10_survivors.txt" --seconds 720 --workers 2 --seed 140127 \
            >"$RUNNER_TEMP/ka14.log" 2>&1 & p14=$!
          wait $p12; r12=$?
          wait $p14; r14=$?
          set -e
          cat "$RUNNER_TEMP/ka12.log"
          cat "$RUNNER_TEMP/ka14.log"
          echo "exit_ka12=$r12 exit_ka14=$r14" | tee "$RUNNER_TEMP/status.txt"
          # UNKNOWN exits 2 and is evidence only about this search, not exclusion.
          # Any independently checked FEASIBLE candidate is surfaced as success for immediate freezing.
          if grep -q '"independent_check": true' "$RUNNER_TEMP/ka12.log" "$RUNNER_TEMP/ka14.log"; then
            echo 'FOUND_E558_CANDIDATE'
          fi
      - name: Upload exact transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-w127-full-xor-order10
          path: |
            ${{ runner.temp }}/ngp10.log
            ${{ runner.temp }}/ka12.log
            ${{ runner.temp }}/ka14.log
            ${{ runner.temp }}/status.txt
          if-no-files-found: warn
