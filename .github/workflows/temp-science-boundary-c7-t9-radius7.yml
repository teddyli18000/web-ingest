name: Temp Science Boundary C7 t9 exact 7-for-8
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-t9-radius7.yml
      - science-boundary/shannon-capacity-c7/code/bpz_t9_radius7_sat.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public sources read-only
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
      - name: Install exact solver
        run: python3 -m pip install --disable-pip-version-check python-sat
      - name: Decide exact radius-7 exchange
        id: solve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_t9_radius7_sat.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/status.json" \
            > "$RUNNER_TEMP/result/stdout.txt" 2> "$RUNNER_TEMP/result/stderr.txt"
          cat "$RUNNER_TEMP/result/status.json"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify 134770 breakthrough
        if: steps.solve.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert r.get('valid') and int(r['score'])>134753, r
          print('VERIFIED BREAKTHROUGH',r)
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-t9-exact-radius7
          path: ${{ runner.temp }}/result
          retention-days: 14
      - name: Summarize
        if: always()
        shell: bash
        run: |
          { echo '## C7 t9 exact 7-for-8 exchange'; for f in status.json verify.json; do if [[ -f "$RUNNER_TEMP/result/$f" ]]; then echo '```json'; cat "$RUNNER_TEMP/result/$f"; echo '```'; fi; done; echo '### stdout'; tail -n 60 "$RUNNER_TEMP/result/stdout.txt" 2>/dev/null || true; echo '### stderr'; tail -n 60 "$RUNNER_TEMP/result/stderr.txt" 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"
