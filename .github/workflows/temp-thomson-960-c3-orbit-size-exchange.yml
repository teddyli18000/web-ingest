name: temp Thomson C3 orbit three-point size-exchange record search

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-c3-orbit-size-exchange.yml'

jobs:
  c3-orbit-exchange:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [13031, 13032]
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: few-shots/few-shots
          path: few-shots
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy numba
      - name: Fetch and independently confirm 960-point old-T source
        run: |
          python3 - <<'PY'
          import os,pathlib,urllib.request,numpy as np
          url="https://www-wales.ch.cam.ac.uk/~wales/CCD/Thomson/site/s_1/dat/points_960_1.dat"
          raw=urllib.request.urlopen(url,timeout=60).read()
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"oldT.dat"
          out.write_bytes(raw)
          x=np.loadtxt(out)
          assert x.shape==(960,3)
          x=x/np.linalg.norm(x,axis=1)[:,None]
          dots=x@x.T
          np.fill_diagonal(dots,-1)
          E=np.sum(np.triu(1/np.sqrt(2-2*dots),1))
          print("INDEPENDENT_T_SCORE",E,flush=True)
          assert abs(E-444368.4373479895)<.001
          PY
      - name: Verify C3 orbit cardinalities and corrected removal-energy identity
        run: |
          python3 -m py_compile science-boundary/thomson-960/code/search_c3_orbit_size_exchange.py
          python3 science-boundary/thomson-960/code/search_c3_orbit_size_exchange.py \
            few-shots --t-file "$RUNNER_TEMP/oldT.dat" \
            --seed ${{ matrix.seed }} --cycles 2 --polish-iter 550 \
            --out "$RUNNER_TEMP/smoke"
      - name: Generate C3-symmetric whole-orbit ±3 topology changes and physical N960 releases
        run: |
          python3 science-boundary/thomson-960/code/search_c3_orbit_size_exchange.py \
            few-shots --t-file "$RUNNER_TEMP/oldT.dat" \
            --seed ${{ matrix.seed }} --cycles 80 --polish-iter 700 \
            --out "$RUNNER_TEMP/out"
      - name: Compare genuinely new N960 low-energy families
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          for label in ("smoke","out"):
              path=root/label/"result.json"
              if not path.exists():
                  print("MISSING",label);continue
              d=json.loads(path.read_text())
              print("RESULT",label,"seed",d["seed"],
                    "cycles",d["cycles_done"],"best_N960",d["best_N960"],
                    "delta",d["delta_record"],"candidates",d["winning_candidates"],
                    "full_releases",d["full_releases"])
              print("C3_NEW_BASIN_ENERGIES",d["unique_c3_energies"][:30])
              print("FULL_NEW_BASINS",[(v["energy"],v["source"],v["direction"])
                       for v in d["new_full_basins"][:15]])
              print("ELITES",[(v["energy"],v["tag"]) for v in d["pool"]])
              for direction in ("plus","minus"):
                  row=[x for x in d["rows"] if x["direction"]==direction]
                  print("DIRECTION",direction,"n",len(row),
                        "best_full",min((x["free_end_E"] for x in row
                          if x["free_end_E"] is not None),default=None))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-c3-three-particle-orbit-exchange-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/out
            ${{ runner.temp }}/smoke
          retention-days: 10
