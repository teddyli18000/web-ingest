name: Baidu Drive isolated share diagnostic d44b (one shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baidu-drive-share-d44b-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BAIDU_DRIVE_BAIDU_SESSION: ${{ secrets.BAIDU_DRIVE_BAIDU_SESSION }}
      BAIDU_DRIVE_STATE_KEY: ${{ secrets.BAIDU_DRIVE_STATE_KEY }}
    steps:
      - name: Checkout authentication helper
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            baidu-drive/auth_session.py
            baidu-drive/auth_cipher.py
            baidu-drive/controller.py

      - name: Checkout pinned Baidu client
        uses: actions/checkout@v4
        with:
          repository: teddyli18000/baidu-drive-mover
          ref: a9e76feb18fe9ca1ac680d0ea555aac684d622de
          path: .source
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Go and crypto dependency
        uses: actions/setup-go@v5
        with:
          go-version-file: .source/go.mod
          cache-dependency-path: .source/go.sum

      - name: Load current browser login privately
        run: |
          python3 -m pip -q install 'cryptography==46.0.4'
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'baidu-drive')
          import auth_session, controller
          gh = controller.GitHub(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_TOKEN'])
          value = auth_session.read(gh, os.environ['BAIDU_DRIVE_BAIDU_SESSION'], os.environ['BAIDU_DRIVE_STATE_KEY'])
          dest = Path(os.environ['RUNNER_TEMP']) / 'share-probe-cookie'
          dest.write_text(value, encoding='utf-8')
          dest.chmod(0o600)
          print('Existing Baidu session loaded.')
          PY

      - name: Inspect up to four share listing pages (no staging, downloads or Drive)
        run: |
          mkdir -p .source/cmd/share-probe-once
          cat > .source/cmd/share-probe-once/main.go <<'GO'
          package main
          import (
             "context"
             "errors"
             "fmt"
             "os"
             "time"
             "github.com/teddyli18000/baidu-drive-mover/internal/baidu"
             "github.com/teddyli18000/baidu-drive-mover/internal/manifest"
          )
          var errFirstPage = errors.New("first page observed")
          type firstPageSink struct { pageCount int; files int; dirs int; bytes int64; maxFile int64; minFile int64 }
          func (s *firstPageSink) UpsertManifestPage(_ context.Context,_ string, dirs []manifest.Directory, files []manifest.File) error {
             s.pageCount++
             s.dirs+=len(dirs)
             s.files+=len(files)
             for _,f:=range files {
                s.bytes+=f.Size
                if f.Size>s.maxFile {s.maxFile=f.Size}
                if s.minFile==0 || f.Size<s.minFile {s.minFile=f.Size}
             }
             if len(files)>0 || s.pageCount>=4 { return errFirstPage }
             return nil
          }
          func main(){
             content, err:=os.ReadFile(os.Getenv("RUNNER_TEMP")+"/share-probe-cookie")
             if err!=nil {fmt.Println("probe: local login missing");os.Exit(1)}
             cli,err:=baidu.NewClient(string(content))
             if err!=nil || !cli.HasLoginCookies(){fmt.Println("probe: browser session invalid");os.Exit(1)}
             link,err:=baidu.ParseShareLink("https://pan.baidu.com/s/1Vstuy6s9NY-OMQBk9k7wRg")
             if err!=nil {fmt.Println("probe: public link invalid");os.Exit(1)}
             link.Password="d44b"
             ctx,cancel:=context.WithTimeout(context.Background(),75*time.Second)
             defer cancel()
             share,err:=cli.AccessSharePage(ctx,link)
             if err!=nil {fmt.Printf("probe: share page failed: %T\n",err);os.Exit(1)}
             fmt.Println("probe: share page parsed successfully")
             if err:=cli.VerifyPassword(ctx,link,share,link.Password);err!=nil {
                fmt.Printf("probe: extraction code verification failed: %T\n",err);os.Exit(1)
             }
             fmt.Println("probe: extraction code accepted")
             sink:=&firstPageSink{}
             err=cli.Scan(ctx,"probe-d44b",link,share,sink)
             if err!=nil && !errors.Is(err,errFirstPage){fmt.Printf("probe: share listing failed: %T\n",err);os.Exit(1)}
             fmt.Printf("probe: first listing page observed=%d files=%d directories=%d total_file_bytes=%d max_file_bytes=%d min_file_bytes=%d\n",sink.pageCount,sink.files,sink.dirs,sink.bytes,sink.maxFile,sink.minFile)
          }
          GO
          cd .source
          go run ./cmd/share-probe-once
