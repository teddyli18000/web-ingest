name: Riemann-Weil exact stencil flow

on:
  push:
    branches: [main]
    paths:
      - 'temp-work/riemann-weil-research/experiments/exact_stencil_schur_flow.py'
      - '.github/workflows/riemann-weil-exact-stencil-flow.yml'

permissions:
  contents: write

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - N: 16
            prec: 2800
            dps: 300
            h: '1e-24'
          - N: 24
            prec: 3900
            dps: 370
            h: '1e-34'
          - N: 32
            prec: 5400
            dps: 470
            h: '1e-44'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check python-flint mpmath
      - name: Fetch pinned public verifier
        run: |
          git clone --quiet https://github.com/akivag613/connes-cvs-.git upstream-connes-cvs
          git -C upstream-connes-cvs checkout --quiet 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c
      - name: Compare exact stencil with Schur normal
        run: |
          python temp-work/riemann-weil-research/experiments/exact_stencil_schur_flow.py \
            --upstream-script upstream-connes-cvs/papers/2_guinand_weil_dictionary_tail_order/scripts/arb_ldlt_certify.py \
            --upstream-commit 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c \
            --c0 100 --N ${{ matrix.N }} --prec ${{ matrix.prec }} --dps ${{ matrix.dps }} --h '${{ matrix.h }}' \
            --output exact-stencil-flow-c100-N${{ matrix.N }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-stencil-flow-c100-N${{ matrix.N }}
          path: exact-stencil-flow-c100-N${{ matrix.N }}.json
          retention-days: 1

  collect:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: exact-stencil-flow-*
          path: downloaded
          merge-multiple: true
      - name: Commit results safely
        run: |
          set -euo pipefail
          mkdir -p temp-work/riemann-weil-research/results
          cp downloaded/exact-stencil-flow-*.json temp-work/riemann-weil-research/results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-work/riemann-weil-research/results/exact-stencil-flow-*.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: record exact-stencil Schur-flow comparison'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
