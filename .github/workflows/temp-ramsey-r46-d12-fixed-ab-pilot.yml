name: Temp Ramsey R46 D12 fixed A/B pilot

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/d12_fixed_ab_sat.py
      - .github/workflows/temp-ramsey-r46-d12-fixed-ab-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-ramsey-r46-d12-fixed-ab-pilot
  cancel-in-progress: false

jobs:
  pilot:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned exact solver
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Prepare exact A=23 and B=101 catalogues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/out /tmp/r46/candidates
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r36_12.g6.gz -o /tmp/r46/r36_12.g6.gz
          echo '17e176a0f7e7397dbca7c9cb6295034dd74cf529ca62e7e717226dc1b0b7b96d  /tmp/r46/r36_12.g6.gz' | sha256sum -c -
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r45extreme.tar.gz -o /tmp/r46/r45extreme.tar.gz
          echo '9cfac9dbd1c209cfa342e5d5424df2a7a3fbb008ca00bf0a992e5bbe72f925b6  /tmp/r46/r45extreme.tar.gz' | sha256sum -c -
          python science-boundary/ramsey-r46/d12_fixed_ab_sat.py self-test
          python science-boundary/ramsey-r46/d12_fixed_ab_sat.py extract-g6 \
            --input /tmp/r46/r36_12.g6.gz --n 12 --edges 23 --out /tmp/r46/a23.g6
          python science-boundary/ramsey-r46/d12_fixed_ab_sat.py extract-tar \
            --archive /tmp/r46/r45extreme.tar.gz --n 23 --edges 101 --out /tmp/r46/b101.g6
          echo "A23 count=$(wc -l < /tmp/r46/a23.g6)"
          echo "B101 count=$(wc -l < /tmp/r46/b101.g6)"
          test "$(wc -l < /tmp/r46/b101.g6)" -eq 1
      - name: Solve first 200 A types against unique B101
        shell: bash
        run: |
          set -euo pipefail
          shard='${{ matrix.shard }}'
          total=$(wc -l < /tmp/r46/a23.g6)
          limit=$(( total < 200 ? total : 200 ))
          : > /tmp/r46/rows.jsonl
          for ((a=shard; a<limit; a+=4)); do
            summary="/tmp/r46/out/a${a}.json"
            candidate="/tmp/r46/candidates/a${a}.json"
            set +e
            timeout --signal=TERM --kill-after=5s 30 \
              python science-boundary/ramsey-r46/d12_fixed_ab_sat.py solve \
                --a-catalog /tmp/r46/a23.g6 --b-catalog /tmp/r46/b101.g6 \
                --a-ordinal "$a" --b-ordinal 0 --a-edges 23 --b-edges 101 \
                --solver cadical195 --summary "$summary" --output "$candidate" \
                >"/tmp/r46/a${a}.log" 2>&1
            rc=$?
            set -e
            if [[ -f "$summary" ]]; then cat "$summary" | tr -d '\n' >> /tmp/r46/rows.jsonl; echo >> /tmp/r46/rows.jsonl; fi
            case "$rc" in
              0) echo "SAT at A ordinal $a"; cat "$summary"; break ;;
              20) echo "A $a UNSAT" ;;
              124|137|143) echo "A $a TIMEOUT" ;;
              *) echo "A $a ERROR rc=$rc"; cat "/tmp/r46/a${a}.log"; exit "$rc" ;;
            esac
          done
      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-d12-fixed-ab-pilot-${{ matrix.shard }}
          path: |
            /tmp/r46/rows.jsonl
            /tmp/r46/out
            /tmp/r46/candidates
            /tmp/r46/*.log
          if-no-files-found: warn
          retention-days: 7
