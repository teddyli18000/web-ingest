name: temp-ta41-cross-basin-poset-intersection
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/cross_basin_poset.py'
      - '.github/workflows/temp-ta41-cross-basin-poset-intersection.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-cross-basin-poset-intersection
  cancel-in-progress: false
jobs:
  intersect:
    strategy:
      fail-fast: false
      matrix:
        cohort: [oldplusnine, gateways, oldnew, all12, diverse7]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP-SAT and lint
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/cross_basin_poset.py
      - name: Analyze intersection precedence of officially verified 2006 schedules
        run: |
          python3 science-boundary/job-shop-ta41/cross_basin_poset.py \
            --cohort '${{ matrix.cohort }}' --seconds 190 --recheck-seconds 70 \
            --out 'science-boundary/job-shop-ta41/results/cross-poset-${{ matrix.cohort }}'
      - name: Official verification if an actual <=2005 machine order appears
        if: always()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/cross-poset-${{ matrix.cohort }}"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          d=Path(sys.argv[1]);x=json.loads((d/'upstream-verdict.json').read_text())
          assert x['valid'] and int(x['score'])<=2005,x
          PY
          fi
      - name: Persist certified cores, negative/unknown outcomes and reproducibility
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/cross-poset-${{ matrix.cohort }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): cross-basin consensus poset ${{ matrix.cohort }}'
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
