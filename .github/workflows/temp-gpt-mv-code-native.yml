name: Temp GPT MV code-native gate

on:
  push:
    paths:
      - "temp-work/gpt-mv-code-native/**"
      - ".github/workflows/temp-gpt-mv-code-native.yml"
  workflow_dispatch:

concurrency:
  group: temp-gpt-mv-code-native
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: temp-work/gpt-mv-code-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg and browser renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Render code-native gate
        run: |
          node export/render.mjs --width 640 --height 360 --fps 12 --start 0 --end 15 --out out/gpt_code_native_gate01.mp4
      - name: Validate full media
        run: |
          set -euo pipefail
          out=out/gpt_code_native_gate01.mp4
          ffmpeg -v error -i "$out" -f null -
          meta="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=nw=1 "$out")"
          printf '%s\n' "$meta"
          grep -q '^width=640$' <<<"$meta"
          grep -q '^height=360$' <<<"$meta"
          grep -q '^r_frame_rate=12/1$' <<<"$meta"
          python - <<'PY'
          import json, subprocess
          p='out/gpt_code_native_gate01.mp4'
          d=float(json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',p]))['format']['duration'])
          assert 14.9 <= d <= 15.1, d
          print('duration_ok',d)
          PY
          ffmpeg -hide_banner -i "$out" -vf "blackdetect=d=0.30:pix_th=0.015" -an -f null - 2>black.log || true
          ! grep -q 'black_duration' black.log
      - name: Upload review gate
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mv-code-native-${{ github.run_id }}
          path: |
            temp-work/gpt-mv-code-native/out/gpt_code_native_gate01.mp4
            temp-work/gpt-mv-code-native/out/gpt_code_native_gate01.contact.jpg
          retention-days: 14
          if-no-files-found: error
