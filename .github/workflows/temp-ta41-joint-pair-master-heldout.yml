name: temp-ta41-joint-pair-master-heldout
on:
  push:
    branches:
      - research/p009-precompletion-joint-repair-audit-20261110
    paths:
      - .github/workflows/temp-ta41-joint-pair-master-heldout.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        family: [ta48, ta49, ta50]
    steps:
      - uses: actions/checkout@v4
      - name: Pinned solver
        run: python3 -m pip install 'ortools==9.14.6206'
      - name: True pairwise joint selection vs baseline (no oracle)
        run: |
          python3 -m py_compile science-boundary/job-shop-ta41/prospective_joint_pair_master.py
          python3 science-boundary/job-shop-ta41/prospective_joint_pair_master.py \
            --family '${{ matrix.family }}' --mode joint --seconds 5 --seeds 4107 4113 \
            --out science-boundary/job-shop-ta41/results/joint-pair-heldout-${{ matrix.family }}-joint
          python3 science-boundary/job-shop-ta41/prospective_joint_pair_master.py \
            --family '${{ matrix.family }}' --mode static --seconds 5 --seeds 4107 4113 \
            --out science-boundary/job-shop-ta41/results/joint-pair-heldout-${{ matrix.family }}-static
      - name: Save comparative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p009-joint-pair-${{ matrix.family }}
          path: science-boundary/job-shop-ta41/results/joint-pair-heldout-${{ matrix.family }}-*/summary.json
          if-no-files-found: warn
