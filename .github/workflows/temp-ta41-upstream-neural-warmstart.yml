name: temp-ta41-upstream-neural-warmstart
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/reproduce_nds_neural_warmstart.py'
      - '.github/workflows/temp-ta41-upstream-neural-warmstart.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-upstream-neural-warmstart
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned original neural deconstruction search and pretrained weights
        run: |
          git clone --depth=1 https://github.com/dawoz/NDS-S.git /tmp/nds-s
          git -C /tmp/nds-s fetch --depth=1 origin c58783b0271f95d9a56252d8841fa2a78535a4d2
          git -C /tmp/nds-s checkout --detach c58783b0271f95d9a56252d8841fa2a78535a4d2
          test -f /tmp/nds-s/models/jssp30x20/checkpoint-1000.pt
      - name: Install upstream CPU inference packages
        run: |
          python3 -m pip install torch torch-geometric hydra-core omegaconf cppimport pybind11 numpy matplotlib wandb pytz
          python3 -m py_compile science-boundary/job-shop-ta41/reproduce_nds_neural_warmstart.py
      - name: Run official pretrained policy with verified 2006 warm start
        run: |
          OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=1 PYTHONPATH='/tmp/nds-s' \
            python3 science-boundary/job-shop-ta41/reproduce_nds_neural_warmstart.py \
            --nds-repo /tmp/nds-s --out /tmp/nds-warmstart --seconds 120 --q 10 --recreate 5 --rollouts 8
      - name: Independently replay activity-list to verify machine-order score
        run: |
          python3 science-boundary/job-shop-ta41/verify_nds_neural_output.py \
            --nds-repo /tmp/nds-s \
            --results /tmp/nds-warmstart/results.csv \
            --solutions /tmp/nds-warmstart/solutions.csv \
            --out science-boundary/job-shop-ta41/results/nds-neural-warmstart
      - name: Official verifier for any certificate at 2005 or better
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/nds-neural-warmstart"
          if test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Save only verified experimental outcome with main push retry
        if: always()
        run: |
          set -euo pipefail
          out='science-boundary/job-shop-ta41/results/nds-neural-warmstart'
          if ! test -d "$out"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): pretrained NDS-S warmstart from verified 2006'
          for i in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
