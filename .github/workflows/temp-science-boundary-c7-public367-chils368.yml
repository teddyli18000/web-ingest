name: Temp Science Boundary C7 full C7p5 seeded CHILS 368

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-public367-chils368.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-public367-chils368
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public sources and verifier
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git init "$RUNNER_TEMP/c7-five"
          git -C "$RUNNER_TEMP/c7-five" remote add origin https://github.com/molind/c7-five.git
          git -C "$RUNNER_TEMP/c7-five" fetch --depth 1 origin ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
          git -C "$RUNNER_TEMP/c7-five" checkout FETCH_HEAD
          git init "$RUNNER_TEMP/chils"
          git -C "$RUNNER_TEMP/chils" remote add origin https://github.com/KarlsruheMIS/CHILS.git
          git -C "$RUNNER_TEMP/chils" fetch --depth 1 origin 515952724cd3dcc6c4365a340ecf0f1da782119a
          git -C "$RUNNER_TEMP/chils" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          python3 -m pip install --disable-pip-version-check numpy
          make -C "$RUNNER_TEMP/chils" -j"$(nproc)"
          test -x "$RUNNER_TEMP/chils/CHILS"
          mkdir -p "$RUNNER_TEMP/search/seeds" "$RUNNER_TEMP/search/best" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"

      - name: Build and independently validate public 367 corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/public367_corpus.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/c7-five" "$RUNNER_TEMP/result/corpus.json" \
            | tee "$RUNNER_TEMP/result/corpus.stdout"
          python3 - "$RUNNER_TEMP/result/corpus.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if r.get('distinct_exact_sets',0) < 2: raise SystemExit(r)
          print('validated distinct 367 seeds',r['distinct_exact_sets'])
          PY

      - name: Export full C7p5 graph and all seeds
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/public367_chils368.py export \
            "$RUNNER_TEMP/result/corpus.json" "$RUNNER_TEMP/search/graph.metis" \
            "$RUNNER_TEMP/search/seeds" "$RUNNER_TEMP/result/export.json" \
            > "$RUNNER_TEMP/result/export.stdout" 2> "$RUNNER_TEMP/result/export.stderr"
          cat "$RUNNER_TEMP/result/export.stdout"
          python3 - "$RUNNER_TEMP/result/export.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if r.get('graph_vertices') != 16807 or r.get('degree') != 242 or r.get('seed_count',0) < 2: raise SystemExit(r)
          PY

      - name: Full-CPU seeded CHILS across every public 367 basin
        shell: bash
        env:
          OMP_PROC_BIND: spread
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          THREADS="$(nproc)"
          export OMP_NUM_THREADS="$THREADS"
          COUNT=$(find "$RUNNER_TEMP/search/seeds" -name '*.sol' -type f | wc -l)
          test "$COUNT" -gt 0
          BUDGET=18000
          PER=$((BUDGET / COUNT))
          if [[ "$PER" -lt 180 ]]; then PER=180; fi
          if [[ "$PER" -gt 900 ]]; then PER=900; fi
          echo "seed_count=$COUNT per_seed_seconds=$PER threads=$THREADS" | tee "$RUNNER_TEMP/result/chils-budget.txt"
          idx=0
          for init in "$RUNNER_TEMP/search/seeds"/*.sol; do
            bn=$(basename "$init")
            out="$RUNNER_TEMP/search/best/$bn"
            seed=$((2026103000 + idx * 10007))
            echo "=== CHILS seed $idx file=$bn random=$seed t=$PER ===" | tee -a "$RUNNER_TEMP/result/chils-summary.txt"
            /usr/bin/time -v "$RUNNER_TEMP/chils/CHILS" \
              -g "$RUNNER_TEMP/search/graph.metis" -i "$init" -o "$out" \
              -p "$THREADS" -c "$THREADS" -t "$PER" -s 10 -r "$seed" -v \
              > "$RUNNER_TEMP/result/chils-${idx}.stdout" 2> "$RUNNER_TEMP/result/chils-${idx}.stderr"
            test -s "$out"
            n=$(wc -l < "$out")
            echo "seed=$idx best=$n" | tee -a "$RUNNER_TEMP/result/chils-summary.txt"
            if [[ "$n" -ge 368 ]]; then
              echo "candidate_368_seed=$idx size=$n" | tee -a "$RUNNER_TEMP/result/chils-summary.txt"
              break
            fi
            idx=$((idx+1))
          done

      - name: Replay all outputs and materialize 368-square candidate
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/public367_chils368.py replay \
            "$RUNNER_TEMP/search/best" "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/status.json" \
            | tee "$RUNNER_TEMP/result/replay.stdout"
          cat "$RUNNER_TEMP/result/status.json"
          python3 - "$RUNNER_TEMP/result/status.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          with open(sys.argv[2],'a') as f:
              f.write(f"best={r['best_size']}\n")
              f.write(f"found={'true' if r.get('candidate_368') else 'false'}\n")
          PY

      - name: Verify 135424 breakthrough with Few Shots verifier
        if: steps.replay.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if not r.get('valid') or int(r.get('score',-1)) != 135424: raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY

      - name: Upload search result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-public367-chils368
          path: |
            ${{ runner.temp }}/result
            ${{ runner.temp }}/search/seeds
            ${{ runner.temp }}/search/best
            ${{ runner.temp }}/shot
          if-no-files-found: warn
          retention-days: 14
