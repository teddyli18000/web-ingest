name: temp-ta41-hard-verify-replacement-cores
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/verify_dynamic_core_hinges.py'
      - '.github/workflows/temp-ta41-hard-verify-replacement-cores.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-hard-verify-replacement-cores
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP solver and check Python source
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/verify_dynamic_core_hinges.py
      - name: Independently rebuild and hard-prove 16 newly emerged resource-conflict cores
        run: |
          python3 science-boundary/job-shop-ta41/verify_dynamic_core_hinges.py --assumption-seconds 5 --hard-seconds 12
      - name: Persist validated scientific outcome with main retries
        if: always()
        run: |
          set -euo pipefail
          path='science-boundary/job-shop-ta41/results/dynamic-core-hinge-independent-hard.json'
          if ! test -f "$path"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): audit 16 post-release replacement cores with independent hard models'
          for attempt in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
