name: temp-aes-fs101-suffix-triple-sat

on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/fs101_suffix_group_sat.py'
      - '.github/workflows/temp-aes-fs101-suffix-triple-sat.yml'

permissions:
  contents: read

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        group: ['3,4,5','3,4,6','3,4,7','3,5,6','3,5,7','3,6,7','4,5,6','4,5,7','4,6,7','5,6,7']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SAT bindings
        run: python -m pip install --quiet python-sat
      - name: Jointly replace this triple of output cones with one fewer gate
        run: |
          set -euxo pipefail
          python -m py_compile science-boundary/aes-sbox-circuit/fs101_suffix_group_sat.py
          python science-boundary/aes-sbox-circuit/fs101_suffix_group_sat.py \
            --group '${{ matrix.group }}' --conf-budget 1000000 --out result | tee run.log
          cat result/summary.json
      - name: Official verifier if <=100 candidate appears
        run: |
          set -euxo pipefail
          if [ -f result/candidate.json ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/shot
            cp result/candidate.json /tmp/shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-fs101-suffix-triple-${{ strategy.job-index }}
          path: |
            result
            run.log
            official-verifier.jsonl
