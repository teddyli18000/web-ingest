name: temp-monalisa-global-split-repair
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/split_merge_search.py
      - .github/workflows/temp-monalisa-global-split-repair.yml
permissions:
  contents: read
jobs:
  reconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        face_start: [0, 50, 100, 150, 200, 250]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          git clone --depth 1 https://github.com/bicobico2/ElimTSP.git elimtsp
          python -m pip install networkx
          python upstream/problems/p010-mona-lisa-tsp/verify/verify.py upstream/problems/p010-mona-lisa-tsp/baseline
      - name: Nonlocal two-edge connection search
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          mkdir -p science-boundary/mona-lisa-tsp/results/split-${{ matrix.face_start }}
          python science-boundary/mona-lisa-tsp/split_merge_search.py \
            --edges elimtsp/results/mona.248972.edg.gz \
            --baseline upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --report science-boundary/mona-lisa-tsp/results/split-${{ matrix.face_start }}/report.json \
            --output science-boundary/mona-lisa-tsp/results/split-${{ matrix.face_start }}/certificate.json \
            --face-start ${{ matrix.face_start }} --max-faces 50
      - name: Independent candidate verification
        if: always()
        run: |
          if test -f science-boundary/mona-lisa-tsp/results/split-${{ matrix.face_start }}/certificate.json; then
            python upstream/problems/p010-mona-lisa-tsp/verify/verify.py science-boundary/mona-lisa-tsp/results/split-${{ matrix.face_start }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monalisa-global-split-${{ matrix.face_start }}
          path: science-boundary/mona-lisa-tsp/results/split-${{ matrix.face_start }}/
          if-no-files-found: ignore
