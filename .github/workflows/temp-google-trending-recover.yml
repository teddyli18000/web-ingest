name: temp-google-trending-recover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-google-trending-recover.yml"

permissions:
  contents: write

concurrency:
  group: google-trending-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Capture and validate current day
        run: |
          python -m unittest discover -s google-trending/tests -v
          python google-trending/capture.py
          python google-trending/validate_archive.py
          python google-trending/render_readme.py

      - name: Commit recovered snapshot and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add google-trending/data google-trending/README.md
          git rm -f \
            .github/workflows/temp-google-trending-livecheck.yml \
            .github/workflows/temp-google-trending-sparse-livecheck.yml \
            .github/workflows/temp-google-trending-recover.yml

          git commit -m "data(google-trending): recover 2026-11-12"
          git pull --rebase origin main
          git push origin HEAD:main
