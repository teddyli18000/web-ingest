name: Temp Science Boundary C7 exact k8 irreducible support SAT

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-k8-irreducible-support-sat.yml
      - science-boundary/shannon-capacity-c7/code/bpz_irreducible_support_sat.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-k8-irreducible-support-sat
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned BPZ source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/result"
      - name: k7 SAT self-check against known irreducible frontier
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/bpz_irreducible_support_sat.py build \
            "$RUNNER_TEMP/tan" 7 "$RUNNER_TEMP/work/k7.cnf" "$RUNNER_TEMP/result/k7-meta.json" \
            | tee "$RUNNER_TEMP/result/k7-build.stdout"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_irreducible_support_sat.py worker \
            "$RUNNER_TEMP/work/k7.cnf" cadical195 "$RUNNER_TEMP/result/k7-solver.json" \
            > "$RUNNER_TEMP/result/k7-solver.stdout" 2> "$RUNNER_TEMP/result/k7-solver.stderr"
          python3 science-boundary/shannon-capacity-c7/code/bpz_irreducible_support_sat.py replay \
            "$RUNNER_TEMP/result/k7-meta.json" "$RUNNER_TEMP/result/k7-solver.json" "$RUNNER_TEMP/result/k7-replay.json"
          python3 - "$RUNNER_TEMP/result/k7-replay.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if not r.get('candidate') or r.get('support_union_size',99)>7 or r.get('witness_size',0)<8: raise SystemExit(('k7 self-check failed',r))
          print('k7 self-check SAT',r['owners'],r['witness'])
          PY
      - name: Build exact k8 target9 instance
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_irreducible_support_sat.py build \
            "$RUNNER_TEMP/tan" 8 "$RUNNER_TEMP/work/k8.cnf" "$RUNNER_TEMP/result/k8-meta.json" \
            > "$RUNNER_TEMP/result/k8-build.stdout" 2> "$RUNNER_TEMP/result/k8-build.stderr"
          cat "$RUNNER_TEMP/result/k8-build.stdout"
          tail -n 80 "$RUNNER_TEMP/result/k8-build.stderr"
      - name: Race exact k8 SAT backends
        id: exact
        shell: bash
        run: |
          set -euo pipefail
          solvers=(cadical195 maplechrono)
          pids=()
          for s in "${solvers[@]}"; do
            python3 science-boundary/shannon-capacity-c7/code/bpz_irreducible_support_sat.py worker \
              "$RUNNER_TEMP/work/k8.cnf" "$s" "$RUNNER_TEMP/result/k8-$s.json" \
              > "$RUNNER_TEMP/result/k8-$s.stdout" 2> "$RUNNER_TEMP/result/k8-$s.stderr" &
            pids+=("$!")
          done
          winner=""
          while :; do
            for s in "${solvers[@]}"; do
              f="$RUNNER_TEMP/result/k8-$s.json"
              if [[ -s "$f" ]] && grep -Eq '"status": "(sat|unsat)"' "$f"; then winner="$f"; break 2; fi
            done
            alive=0
            for p in "${pids[@]}"; do if kill -0 "$p" 2>/dev/null; then alive=1; fi; done
            if [[ "$alive" -eq 0 ]]; then break; fi
            sleep 2
          done
          if [[ -z "$winner" ]]; then
            echo 'No k8 SAT/UNSAT answer' >&2
            for s in "${solvers[@]}"; do cat "$RUNNER_TEMP/result/k8-$s.stderr" 2>/dev/null || true; done
            exit 1
          fi
          cp "$winner" "$RUNNER_TEMP/result/k8-winner.json"
          for p in "${pids[@]}"; do kill "$p" 2>/dev/null || true; done
          wait || true
          python3 science-boundary/shannon-capacity-c7/code/bpz_irreducible_support_sat.py replay \
            "$RUNNER_TEMP/result/k8-meta.json" "$RUNNER_TEMP/result/k8-winner.json" "$RUNNER_TEMP/result/k8-replay.json"
          cat "$RUNNER_TEMP/result/k8-replay.json"
          python3 - "$RUNNER_TEMP/result/k8-replay.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          with open(sys.argv[2],'a') as f:f.write('found=' + ('true' if r.get('candidate') else 'false') + '\n')
          PY
      - name: Upload exact support frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-k8-irreducible-support-sat
          path: ${{ runner.temp }}/result
          retention-days: 14
