name: Temp Science Boundary C7 t9 ReduMIS
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-t9-redumis.yml
      - science-boundary/shannon-capacity-c7/code/bpz_t9_redumis.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [1, 2]
        config: [standard, full_standard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned sources read-only
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git init "$RUNNER_TEMP/kamis"
          git -C "$RUNNER_TEMP/kamis" remote add origin https://github.com/KarlsruheMIS/KaMIS.git
          git -C "$RUNNER_TEMP/kamis" fetch --depth 1 origin 78d065d3087dc590e887c0aa3c608b5cafd30ac6
          git -C "$RUNNER_TEMP/kamis" checkout FETCH_HEAD
          git -C "$RUNNER_TEMP/kamis" submodule update --init --recursive --depth 1
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
      - name: Install bridge dependency and build KaMIS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check python-sat
          cd "$RUNNER_TEMP/kamis"
          ./compile_withcmake.sh
          test -x deploy/redumis
      - name: Export exact obstruction graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
          python3 science-boundary/shannon-capacity-c7/code/bpz_t9_kamis.py export \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/run/graph" "$RUNNER_TEMP/run/mapping.json" "$RUNNER_TEMP/result/graph-meta.json"
      - name: Run ReduMIS
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v "$RUNNER_TEMP/kamis/deploy/redumis" "$RUNNER_TEMP/run/graph" \
            --seed=${{ matrix.seed }} --config=${{ matrix.config }} --time_limit=240 \
            --output="$RUNNER_TEMP/run/solution.txt" --console_log \
            > "$RUNNER_TEMP/result/solver.log" 2> "$RUNNER_TEMP/result/solver.stderr"
          test -s "$RUNNER_TEMP/run/solution.txt"
          python3 - "$RUNNER_TEMP/run/solution.txt" <<'PY' | tee "$RUNNER_TEMP/result/size.txt"
          import sys
          a=[int(x) for x in open(sys.argv[1]) if x.strip()]
          print('entries',len(a),'selected',sum(a))
          PY
      - name: Replay solution
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/bpz_t9_redumis.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/run/mapping.json" "$RUNNER_TEMP/run/solution.txt" \
            "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/status.json"
          cat "$RUNNER_TEMP/result/status.json"
          cp "$RUNNER_TEMP/run/solution.txt" "$RUNNER_TEMP/result/solution.txt"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify 134770 candidate
        if: steps.replay.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert r.get('valid') and int(r['score'])>134753, r
          print('VERIFIED BREAKTHROUGH',r)
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-t9-redumis-${{ matrix.config }}-seed-${{ matrix.seed }}
          path: ${{ runner.temp }}/result
          retention-days: 14
      - name: Summarize
        if: always()
        shell: bash
        run: |
          { echo "## C7 t9 ReduMIS ${{ matrix.config }} seed ${{ matrix.seed }}"; for f in size.txt status.json verify.json; do if [[ -f "$RUNNER_TEMP/result/$f" ]]; then echo '```text'; cat "$RUNNER_TEMP/result/$f"; echo '```'; fi; done; tail -n 30 "$RUNNER_TEMP/result/solver.log" 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"
