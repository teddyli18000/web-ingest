name: temp Thomson 960 N961 fractional projection boundary

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-n961-fractional-projection-boundary.yml'

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Static check
        run: python3 -m py_compile science-boundary/thomson-960/code/scan_n961_fractional_projection_boundary.py
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Scan fractional projection boundary
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) live=$live"
          python3 science-boundary/thomson-960/code/scan_n961_fractional_projection_boundary.py \
            "$RUNNER_TEMP/seed/A-natural.json" --live-score "$live" \
            --schedule '1,.8,.6,.4,.25,.15,.1,.075,.06,.05,.04,.03,.025,.02,.015,.01,.007,.005,.003,.001,0' \
            --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('TRANSITIONS',d['transitions'])
          print('BEST',d['best'])
          for r in d['rows']:
              print('L',r['lambda'],r['projection_class'],r['projection_energy'],r['projection_delta_live'],r['projection_signature']['coord'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-n961-fractional-projection-boundary
          path: ${{ runner.temp }}/out
          retention-days: 10
