name: temp C7p5 circular three-basin exact recombination

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7p5-circular-triple.yml
      - science-boundary/shannon-capacity-c7/code/c7p5_circular_triple_union_milp.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-c7p5-circular-triple
  cancel-in-progress: false

jobs:
  milp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        scenario: [I0_X, I0_F0, X_F0, F0_F17]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact MILP solver
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Fetch immutable public geometry snapshots
        run: |
          git init --quiet /tmp/c7-tandon
          git -C /tmp/c7-tandon fetch --quiet --depth 1 https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git c753408492dde92a239708986d16c15dbf6c3235
          git -C /tmp/c7-tandon checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-tandon rev-parse HEAD)" = c753408492dde92a239708986d16c15dbf6c3235
          git init --quiet /tmp/c7-five
          git -C /tmp/c7-five fetch --quiet --depth 1 https://github.com/molind/c7-five.git ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
          git -C /tmp/c7-five checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-five rev-parse HEAD)" = ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
      - name: Validate all source codes
        run: |
          mkdir -p /tmp/c7-triple
          python science-boundary/shannon-capacity-c7/code/c7p5_circular_hall_io.py prepare \
            science-boundary/shannon-capacity-c7/data/circular-phase-367-2026-11-04.json \
            /tmp/c7-tandon/data/base_c7.json /tmp/c7-five/data/family-f.json \
            /tmp/c7-triple/inputs
      - name: Optimize 20 entire three-basin unions under each scenario
        run: |
          python science-boundary/shannon-capacity-c7/code/c7p5_circular_triple_union_milp.py \
            /tmp/c7-triple/inputs /tmp/c7-triple/status.json \
            /tmp/c7-triple/witness5.ids /tmp/c7-triple/novel367.ids \
            --scenario "${{ matrix.scenario }}" --trials 20 --seconds 10
      - name: Verify any 368 witness independently and with Few Shots p004
        run: |
          if test -s /tmp/c7-triple/witness5.ids; then
            python science-boundary/shannon-capacity-c7/code/c7p5_circular_hall_io.py verify \
              /tmp/c7-triple/witness5.ids /tmp/c7-triple/shot
            git clone --quiet --depth 1 https://github.com/few-shots/few-shots.git /tmp/c7-fewshots
            python /tmp/c7-fewshots/problems/p004-shannon-capacity-c7/verify/verify.py /tmp/c7-triple/shot
          else
            echo 'No 368+ five-dimensional witness in tested triple-basin unions.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7-circular-triple-${{ matrix.scenario }}
          path: |
            /tmp/c7-triple/status.json
            /tmp/c7-triple/witness5.ids
            /tmp/c7-triple/novel367.ids
            /tmp/c7-triple/shot/certificate.json
          retention-days: 14
