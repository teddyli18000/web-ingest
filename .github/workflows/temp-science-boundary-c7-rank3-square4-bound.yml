name: Temp Science Boundary C7 rank3 four-square bound

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-rank3-square4-bound.yml
      - science-boundary/shannon-capacity-c7/code/rank3_square4_bound.cpp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-rank3-square4-bound
  cancel-in-progress: false

jobs:
  bound:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned public source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/shannon-source"
          git -C "$RUNNER_TEMP/shannon-source" remote add origin https://github.com/nathanielitty/lower-bounds-for-shannon-capacity.git
          git -C "$RUNNER_TEMP/shannon-source" fetch --depth 1 origin fe8966079013abaac21d1c08441500100f8e3b86
          git -C "$RUNNER_TEMP/shannon-source" checkout FETCH_HEAD

      - name: Compile exact bounds
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -DNDEBUG -std=c++20 science-boundary/shannon-capacity-c7/code/rank3_square3_bound.cpp -o "$RUNNER_TEMP/square3"
          g++ -O3 -DNDEBUG -std=c++20 science-boundary/shannon-capacity-c7/code/rank3_square4_bound.cpp -o "$RUNNER_TEMP/square4"

      - name: Recheck threshold 3 prerequisite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          "$RUNNER_TEMP/square3" "$RUNNER_TEMP/shannon-source/c7/R367.txt" | tee "$RUNNER_TEMP/result/threshold3.json"
          python3 - "$RUNNER_TEMP/result/threshold3.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r.get('threshold3_reduces_to_threshold0') is True, r
          assert r.get('max_pairwise_compatible_ports_unlocked_by_three_deletions') <= 3, r
          PY

      - name: Compute exact threshold 4 bound
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v "$RUNNER_TEMP/square4" "$RUNNER_TEMP/shannon-source/c7/R367.txt" \
            | tee "$RUNNER_TEMP/result/threshold4.json"
          python3 - "$RUNNER_TEMP/result/threshold4.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          # If false, this is not a workflow failure: it is a scientifically
          # useful 5-port witness that should be followed by targeted MaxSAT.
          print(r)
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-rank3-square4-bound
          path: ${{ runner.temp }}/result
          retention-days: 14

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo '## C7 rank3 four-square compatibility bound'
            for f in threshold3.json threshold4.json; do
              if [[ -f "$RUNNER_TEMP/result/$f" ]]; then echo '```json'; cat "$RUNNER_TEMP/result/$f"; echo '```'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
