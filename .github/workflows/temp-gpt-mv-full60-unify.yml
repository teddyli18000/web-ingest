name: Temp GPT MV full 60 unify

on:
  push:
    paths:
      - "temp-work/gpt-mv-code-native/src/main.js"
      - "temp-work/gpt-mv-code-native/src/scenes/opening_v10.js"
      - "temp-work/gpt-mv-code-native/src/scenes/drafts_v12.js"
      - "temp-work/gpt-mv-code-native/src/scenes/construct_v6.js"
      - "temp-work/gpt-mv-code-native/src/scenes/construct_v5.js"
      - "temp-work/gpt-mv-code-native/src/scenes/ending_v3.js"
      - "temp-work/gpt-mv-code-native/src/components/gpt_art.js"
      - "temp-work/gpt-mv-code-native/src/components/gpt_poses.js"
      - "temp-work/gpt-mv-code-native/assets/gpt/**"
      - "temp-work/gpt-mv-code-native/export/render.mjs"
      - ".github/workflows/temp-gpt-mv-full60-unify.yml"
  workflow_dispatch:

concurrency:
  group: temp-gpt-mv-full60-unify
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: temp-work/gpt-mv-code-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Render full 0-60s visual gate
        run: node export/render.mjs --start 0 --end 60 --width 960 --height 540 --fps 15 --art-source reach-hq --out out/gpt_full60_unify.mp4
      - name: Validate media
        run: |
          set -euo pipefail
          test -s out/gpt_full60_unify.mp4
          test -s out/gpt_full60_unify.contact.jpg
          ffmpeg -v error -i out/gpt_full60_unify.mp4 -f null -
          D=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 out/gpt_full60_unify.mp4)
          python - "$D" <<'PY'
          import sys
          d=float(sys.argv[1]); print('duration',d); assert 59.9 <= d <= 60.1
          PY
          ffmpeg -hide_banner -i out/gpt_full60_unify.mp4 -vf "blackdetect=d=0.15:pix_th=0.02,freezedetect=n=0.001:d=1.0" -an -f null - 2>&1 | tee out/qc.txt
          if grep -q 'black_start' out/qc.txt; then echo 'unexpected black interval' >&2; exit 1; fi
      - name: Upload visual review
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mv-full60-unify-${{ github.run_id }}
          path: |
            temp-work/gpt-mv-code-native/out/gpt_full60_unify.mp4
            temp-work/gpt-mv-code-native/out/gpt_full60_unify.contact.jpg
            temp-work/gpt-mv-code-native/out/qc.txt
          retention-days: 14
          if-no-files-found: error
