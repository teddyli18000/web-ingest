name: temp Thomson 960 Riesz exponent homotopy candidate hunt

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-riesz-homotopy.yml'

jobs:
  riesz-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        seed: [22301, 22302]
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: few-shots/few-shots
          path: few-shots
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy numba
      - name: Compile Riesz energy and analytic gradient
        run: |
          python3 -m py_compile science-boundary/thomson-960/code/search_riesz_exponent_cycles.py
      - name: Independent pair-energy gradient checks at three exponents, then one pilot cycle
        run: |
          python3 science-boundary/thomson-960/code/search_riesz_exponent_cycles.py \
            few-shots \
            --elite-json science-boundary/thomson-960/data/scar-braid-elites-2202-2026-11-06.json \
            --seed ${{ matrix.seed }} --cycles 1 --maxiter 450 \
            --out "$RUNNER_TEMP/smoke"
      - name: Search N960 via logarithmic-like and hard-packing-like potential landscapes
        run: |
          python3 science-boundary/thomson-960/code/search_riesz_exponent_cycles.py \
            few-shots \
            --elite-json science-boundary/thomson-960/data/scar-braid-elites-2202-2026-11-06.json \
            --seed ${{ matrix.seed }} --cycles 140 --maxiter 550 \
            --out "$RUNNER_TEMP/out"
      - name: Candidate outcome and exponent comparison
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])
          for item in ('smoke/result.json','out/result.json'):
              p=out/item
              if not p.exists():
                  print('NO_RESULT',item);continue
              d=json.loads(p.read_text());rows=[r for r in d['rows'] if 'energy' in r]
              print('RESULT',item,'cycles',d['cycles_done'],'best',d['best_energy'],
                    'delta',d['delta_record'],'subrecord_candidates',d['subrecord_candidates'])
              by={}
              for e in sorted(set(r['exponent'] for r in rows)):
                  q=[r for r in rows if r['exponent']==e]
                  by[e]={'n':len(q),'best':min(x['energy'] for x in q),
                         'new':sum(x['new_basin'] for x in q)}
              print('PER_EXPONENT',by)
              print('POOL',[(p['energy'],p['tag']) for p in d['pool']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-riesz-homotopy-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/out
            ${{ runner.temp }}/smoke
          retention-days: 10
