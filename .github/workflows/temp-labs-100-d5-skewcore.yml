name: temp labs-100 d5 skew-core exact search

on:
  push:
    paths:
      - 'science-boundary/labs-100/code/skewcore_d5_bnb.cpp'
      - '.github/workflows/temp-labs-100-d5-skewcore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d5-target:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        b2: [-1, 1]
        b3: [-1, 1]
        b4: [-1, 1]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact E<=574 feasibility in normalized d=5 skew95 branch
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20 -fopenmp -DNDEBUG \
            science-boundary/labs-100/code/skewcore_d5_bnb.cpp -o /tmp/d5
          /tmp/d5 \
            --b2 '${{ matrix.b2 }}' --b3 '${{ matrix.b3 }}' --b4 '${{ matrix.b4 }}' \
            --cap 524 --threads "$(nproc)" --split 9 --seconds 1500
