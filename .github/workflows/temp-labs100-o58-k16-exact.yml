name: temp labs100 O58 K16 exact

on:
  push:
    paths:
      - '.github/workflows/temp-labs100-o58-k16-exact.yml'
  workflow_dispatch:

concurrency:
  group: temp-labs100-o58-k16-exact
  cancel-in-progress: false

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build exact O58 K16 solvers
        run: |
          g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/o58_k16_compressed_exact.cpp -o "$RUNNER_TEMP/o58c"
          g++ -O3 -march=native -fopenmp science-boundary/labs-100/code/o58_k16_qgroup_exact.cpp -o "$RUNNER_TEMP/o58q"
      - name: Exhaust compressed K16 branches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/o58"
          : > "$RUNNER_TEMP/o58/center.hits"
          : > "$RUNNER_TEMP/o58/unit.hits"
          : > "$RUNNER_TEMP/o58/five.hits"
          export OMP_NUM_THREADS=4
          for kp in 1 3 5 7; do
            kc=$((16-kp))
            m=$kp
            for ((t=1;t<=m;t+=2)); do
              log="$RUNNER_TEMP/o58/c-kp${kp}-t${t}-center.log"
              "$RUNNER_TEMP/o58c" 16 "$kp" "$t" center | tee "$log"
              grep '^HIT ' "$log" >> "$RUNNER_TEMP/o58/center.hits" || true
            done
            for ((t=0;t<=m;t+=2)); do
              for cls in unit five; do
                log="$RUNNER_TEMP/o58/c-kp${kp}-t${t}-${cls}.log"
                "$RUNNER_TEMP/o58c" 16 "$kp" "$t" "$cls" | tee "$log"
                grep '^HIT ' "$log" >> "$RUNNER_TEMP/o58/${cls}.hits" || true
              done
            done
          done
          # The compressed program intentionally caps retained HIT output at 10k.
          # A qgroup exclusion is valid only if every counted qhit was actually retained.
          awk '/^O58_K16_COMPRESSED /{for(i=1;i<=NF;i++)if($i~/^qhits=/){split($i,a,"="); s+=a[2]}} END{print s+0}' "$RUNNER_TEMP"/o58/c-*.log > "$RUNNER_TEMP/o58/qhits.total"
          cat "$RUNNER_TEMP/o58/"*.hits | wc -l | tr -d ' ' > "$RUNNER_TEMP/o58/hitlines.total"
          test "$(cat "$RUNNER_TEMP/o58/qhits.total")" = "$(cat "$RUNNER_TEMP/o58/hitlines.total")"
          echo "COMPRESSED_COMPLETE qhits=$(cat "$RUNNER_TEMP/o58/qhits.total")"
      - name: Exact fibre-Q audit by defect class
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS=4
          "$RUNNER_TEMP/o58q" 0 "$RUNNER_TEMP/o58/center.hits" | tee "$RUNNER_TEMP/o58/q-center.log"
          "$RUNNER_TEMP/o58q" 1 "$RUNNER_TEMP/o58/unit.hits"   | tee "$RUNNER_TEMP/o58/q-unit.log"
          "$RUNNER_TEMP/o58q" 5 "$RUNNER_TEMP/o58/five.hits"   | tee "$RUNNER_TEMP/o58/q-five.log"
          cat "$RUNNER_TEMP/o58/q-"*.log
      - name: Upload exact transcripts
        uses: actions/upload-artifact@v4
        with:
          name: labs100-o58-k16-exact
          path: ${{ runner.temp }}/o58
          if-no-files-found: error
