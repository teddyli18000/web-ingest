name: Temp Science Boundary C7 terminal-union all-k6 joint prize

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-terminal-union-k6-joint.yml
      - science-boundary/shannon-capacity-c7/code/bpz_terminal_union_k6_joint_prize.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-terminal-union-k6-joint
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
      - name: Exact k6 cover-gap census
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_support_clique_cover_gap_census.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/k6.json" --k 6 --workers "$(nproc)" \
            > "$RUNNER_TEMP/result/k6.stdout" 2> "$RUNNER_TEMP/result/k6.stderr"
          cat "$RUNNER_TEMP/result/k6.stdout"
      - name: Exact joint terminal-union plus all-k6 core-release MaxSAT
        id: joint
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_terminal_union_k6_joint_prize.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/k6.json" "$RUNNER_TEMP/result/status.json" "$RUNNER_TEMP/shot/certificate.json" \
            > "$RUNNER_TEMP/result/stdout" 2> "$RUNNER_TEMP/result/stderr"
          cat "$RUNNER_TEMP/result/stdout"
          tail -n 200 "$RUNNER_TEMP/result/stderr"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify breakthrough with Few Shots verifier
        if: steps.joint.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys;r=json.load(open(sys.argv[1]));
          if not r.get('valid') or int(r.get('score',-1))<134754:raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-terminal-union-allk6-joint
          path: |
            ${{ runner.temp }}/result
            ${{ runner.temp }}/shot/certificate.json
          if-no-files-found: warn
          retention-days: 14
