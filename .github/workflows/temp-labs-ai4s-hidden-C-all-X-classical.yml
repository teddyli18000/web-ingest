name: temp-labs-ai4s-hidden-C-all-X-classical
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-hidden-C-all-X-classical.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-hidden-C-all-X-classical
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Entire search stays C-blind, exact score after full 150ms policies
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/recombination_20261105/innovation/hidden_C_20261108
          g++ -std=c++17 -O3 hidden_repair.cpp -o /tmp/labs_hidden_allX
          /tmp/labs_hidden_allX selftest
          python3 run_all_x.py --exe /tmp/labs_hidden_allX --budget-ms 150
      - name: Commit independently verified 864 full original-state restarts and comparative C-orbit verdict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/recombination_20261105/innovation/hidden_C_20261108/results/all_x_20261109
          git commit -m 'research(labs-ai4s): validate all-X static classical restart vs alternating multi-state repair under full cost'
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main
            if git push origin HEAD:main; then ok=1; break; fi
          done
          test "$ok" -eq 1
