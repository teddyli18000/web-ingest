name: Baidu Drive control repair (one shot)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-baidu-drive-control-repair.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: baidu-drive-live-state
  cancel-in-progress: false

jobs:
  replace-blocked-task:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout current control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            baidu-drive
      - name: Archive blocked task and start requested transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          sys.path.insert(0, "baidu-drive")
          import controller

          gh = controller.GitHub(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_TOKEN"])
          runtime, _ = gh.read_json(controller.RUNTIME_PATH, default=controller.DEFAULT_RUNTIME)
          old_id = "bd-20261114T112405Z-caff29"
          if runtime.get("active_task") != old_id:
              print("Active task differs from the known blocked task; no changes made.")
              raise SystemExit(0)
          old = controller.load_active_task(gh, runtime)
          if (old["status"] != "BLOCKED" or old["files_done"] != 0
                  or old["bytes_done"] != 0 or old["relay_active_workers"] != 0):
              raise RuntimeError("Blocked task changed; refusing to replace it")
          release = gh.ensure_release()
          if controller.parse_control(release.get("body", ""))["command"] != "none":
              raise RuntimeError("Another user request is pending")

          archived_runtime, archived, _ = controller.apply_command(
              "cancel", controller.default_control(), runtime, old
          )
          archived = controller.save_task(gh, archived, "archive blocked source")
          archived_runtime = controller.save_runtime_if_changed(
              gh, runtime, archived_runtime, "archive blocked source"
          )
          new_control = {
              "command": "start",
              "share_url": old["source_url"],
              "extraction_code": old["extraction_code"] or "-",
          }
          active_runtime, new_task, _ = controller.apply_command(
              "start", new_control, archived_runtime, None
          )
          new_task = controller.save_task(gh, new_task, "start requested replacement")
          active_runtime = controller.save_runtime_if_changed(
              gh, archived_runtime, active_runtime, "start replacement"
          )
          state, message = controller.status_projection(new_task)
          gh.patch_release(
              release,
              controller.render_release(controller.default_control(), active_runtime, new_task, state, message),
          )
          subprocess.run([
              "gh", "workflow", "run", "baidu-drive-worker.yml",
              "--repo", os.environ["GITHUB_REPOSITORY"],
              "--ref", "main", "-f", f"task_id={new_task['id']}",
              "-f", "reason=start"
          ], check=True)
          print(f"New transfer dispatched: {new_task['id']}")
          PY
