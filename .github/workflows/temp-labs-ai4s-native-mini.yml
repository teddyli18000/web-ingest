name: temp-labs-ai4s-native-mini
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-native-mini.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-native-mini
  cancel-in-progress: false
jobs:
  native-mini:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Compile source-pinned native GA + Tabu with trace events
        shell: bash
        run: |
          set -euo pipefail
          PIN=1aa123407636e48630174e0bf122037e369c1d68
          git clone -q --depth 1 https://github.com/borkob/git_labs.git "$RUNNER_TEMP/git_labs"
          git -C "$RUNNER_TEMP/git_labs" fetch -q --depth 1 origin "$PIN"
          git -C "$RUNNER_TEMP/git_labs" checkout -q --detach "$PIN"
          test "$(git -C "$RUNNER_TEMP/git_labs" rev-parse HEAD)" = "$PIN"
          echo "LABS_SOURCE_COMMIT=$PIN" >> "$GITHUB_ENV"
          SRC="$RUNNER_TEMP/git_labs/solvers/lMAts-lRRts/src"
          python3 science-boundary/labs-ai4s-search/trajectory_20261104/instrument_mts.py "$SRC"
          make -s -j1 -C "$SRC"
      - name: Sample full six-length exploratory cohort
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/trajectory_20261104
          python3 collect_native.py --solver "$RUNNER_TEMP/git_labs/solvers/lMAts-lRRts/src/lMAts" \
            --output results/native_mini_v1 --lengths 48,64,80,92,99,100 --seeds 2 \
            --duration 12 --workers 4 --genstride 128 --stepstride 32
      - name: Verify all native events, analyze odd-even compensation, and test length holdouts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check numpy pandas scikit-learn
          cd science-boundary/labs-ai4s-search/trajectory_20261104
          python3 verify_native_fast.py results/native_mini_v1 --summary results/native_mini_v1/exact_verification.json
          python3 analyze_native.py results/native_mini_v1 --out results/native_mini_analysis
          python3 mechanism_native.py results/native_mini_analysis/episodes.tsv.gz \
            results/native_mini_analysis/global_records.tsv --out results/native_mini_analysis
          python3 predict_native.py results/native_mini_analysis/episodes.tsv.gz --out results/native_mini_analysis
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('results/native_mini_analysis')
          a=json.loads((root/'structural_summary.json').read_text())
          b=json.loads((root/'mechanism_native.json').read_text())
          p=json.loads((root/'crosslength_ablation.json').read_text())
          assert a['runs']==12 and a['sampled_episodes']>0
          assert b['episode_and_record_counts']['episodes']==a['sampled_episodes']
          assert p['train_rows']>0 and p['test_rows']>0
          print('SCIENCE VALIDATED',a['sampled_episodes'],'episodes',a['global_records'],'records')
          PY
      - name: Commit only fully validated source-native traces and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/trajectory_20261104/results/native_mini_v1/
          git add science-boundary/labs-ai4s-search/trajectory_20261104/results/native_mini_analysis/
          git commit -m 'research(labs-ai4s): verify native historical MTS transitions and structural modes across six lengths'
          git pull --rebase origin main
          git push origin HEAD:main
