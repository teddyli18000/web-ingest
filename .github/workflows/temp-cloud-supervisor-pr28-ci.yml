name: One-shot cloud supervisor handoff validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-cloud-supervisor-pr28-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed supervisor integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/cloud-drive-supervisor
          persist-credentials: false
          fetch-depth: 1
      - name: Check master journal, worker handoff and repository scheduling
        run: |
          python3 tools/check-repository-integrity.py
          python3 -m py_compile tools/cloud-drive/*.py baidu-drive/*.py
          python3 -m unittest discover -s tools/cloud-drive/tests -v
      - name: Check Baidu preparation, restart and lease regression tests
        run: |
          python3 -m pip install -q "cryptography==46.0.4"
          python3 -m unittest discover -s baidu-drive/tests -v
