name: temp Thomson 960 cross-topology crossover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-cross-topology.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        parent: [record, neighbor]
        seed: [4101, 4202]
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Cross 24-dislocation parent with merged D2 20-dislocation parent
        run: |
          python3 science-boundary/thomson-960/code/search_cross_topology.py \
            "$RUNNER_TEMP/few-shots" \
            --parent-a ${{ matrix.parent }} \
            --neighbor-json science-boundary/thomson-960/data/neighbor-soft-003280.json \
            --seed ${{ matrix.seed }} --screen 72 --relax-top 4 \
            --out "$RUNNER_TEMP/result-${{ matrix.parent }}-${{ matrix.seed }}.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'result-${{ matrix.parent }}-${{ matrix.seed }}.json')
          d=json.load(open(p)); d.pop('best_points',None)
          print(json.dumps(d,indent=2))
          PY
      - name: Upload crossover result
        uses: actions/upload-artifact@v4
        with:
          name: thomson-cross-${{ matrix.parent }}-${{ matrix.seed }}
          path: ${{ runner.temp }}/result-${{ matrix.parent }}-${{ matrix.seed }}.json
          retention-days: 7
