name: temp-ta41-optalcp-preview-control
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/optalcp_preview_control.py'
      - '.github/workflows/temp-ta41-optalcp-preview-control.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-optalcp-preview-control
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install publicly permitted OptalCP free preview
        run: |
          python3 -m pip install git+https://github.com/ScheduleOpt/optalcp-py-bin-preview@latest
          python3 -m py_compile science-boundary/job-shop-ta41/optalcp_preview_control.py
      - name: Test a genuinely different NoOverlap propagation engine
        run: python3 science-boundary/job-shop-ta41/optalcp_preview_control.py --seconds 180
      - name: Persist objective-only baseline honestly
        if: always()
        run: |
          set -euo pipefail
          path='science-boundary/job-shop-ta41/results/optalcp-preview.json'
          if ! test -f "$path"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): OptalCP preview objective-only cross-solver comparison'
          for attempt in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
