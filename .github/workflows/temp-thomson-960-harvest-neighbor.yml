name: temp Thomson 960 harvest soft neighbor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-harvest-neighbor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Harvest canonical soft neighbor
        run: |
          python3 science-boundary/thomson-960/code/harvest_soft_neighbor.py \
            "$RUNNER_TEMP/few-shots" --amp 0.010 \
            --out "$RUNNER_TEMP/neighbor.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'neighbor.json')
          d=json.load(open(p)); d.pop('points',None)
          print(json.dumps(d,indent=2))
          PY
      - name: Upload neighbor
        uses: actions/upload-artifact@v4
        with:
          name: thomson-960-soft-neighbor
          path: ${{ runner.temp }}/neighbor.json
          retention-days: 7
