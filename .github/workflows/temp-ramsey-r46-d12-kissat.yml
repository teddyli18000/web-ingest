name: Temp Ramsey R46 Kissat lucky d12 pair

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/d12_fixed_ab_sym_dimacs.py
      - .github/workflows/temp-ramsey-r46-d12-kissat.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-d12-kissat
  cancel-in-progress: false

jobs:
  solve:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symmetry: [generators, all-ab]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encoder dependencies and authenticate fixed pair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17' 'networkx==3.5'
          echo '3598adba0f769168ae666fb1d0e4ddc653b646a48d12e6b4d5ddfa70ed2c4ce9  science-boundary/ramsey-r46/data/r36_12_e29.g6' | sha256sum -c -
          echo 'bf403d6b148c60a26d2536ade61d74d552972f701f3fdbb143478d97652c20ec  science-boundary/ramsey-r46/data/r45_23_e101.g6' | sha256sum -c -
          python science-boundary/ramsey-r46/d12_fixed_ab_sym_dimacs.py self-test
      - name: Build pinned Kissat 4.0.4
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/arminbiere/kissat.git "$RUNNER_TEMP/kissat"
          git -C "$RUNNER_TEMP/kissat" checkout --quiet 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cd "$RUNNER_TEMP/kissat"
          ./configure >/dev/null
          make -j2 >/dev/null
          test "$(build/kissat --version)" = '4.0.4'
      - name: Generate exact symmetry-reduced DIMACS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python science-boundary/ramsey-r46/d12_fixed_ab_sym_dimacs.py generate \
            --a-catalog science-boundary/ramsey-r46/data/r36_12_e29.g6 \
            --b-catalog science-boundary/ramsey-r46/data/r45_23_e101.g6 \
            --symmetry '${{ matrix.symmetry }}' \
            --output /tmp/r46/branch.cnf --meta /tmp/r46/generate.json
          head -n 1 /tmp/r46/branch.cnf
          du -h /tmp/r46/branch.cnf
      - name: Solve exact pair with standalone Kissat
        id: solve
        shell: bash
        run: |
          set -uo pipefail
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          /usr/bin/time -v timeout --signal=TERM --kill-after=20s 2100 \
            "$RUNNER_TEMP/kissat/build/kissat" /tmp/r46/branch.cnf \
            > /tmp/r46/solver.log 2>&1
          rc=$?
          set -e
          finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          case "$rc" in
            10) status=SAT ;;
            20) status=UNSAT ;;
            124|137|143) status=TIMEOUT ;;
            *) status=ERROR ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 - /tmp/r46/generate.json /tmp/r46/summary.json "$status" "$rc" "$started" "$finished" <<'PY'
          import json,os,sys
          gen,out,status,rc,started,finished=sys.argv[1:]
          d=json.load(open(gen)); d.update(status=status,solver_exit=int(rc),started=started,finished=finished,
              solver='kissat-4.0.4',kissat_commit='8af8e56f174b778aef3aa45af9f739b2a5f492c2',github_run_id=os.environ['GITHUB_RUN_ID'])
          open(out,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          cat /tmp/r46/summary.json
          tail -n 40 /tmp/r46/solver.log || true
          [[ "$status" != ERROR ]]
      - name: Decode and independently verify SAT certificate
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          python science-boundary/ramsey-r46/d12_fixed_ab_sym_dimacs.py decode \
            --a-catalog science-boundary/ramsey-r46/data/r36_12_e29.g6 \
            --b-catalog science-boundary/ramsey-r46/data/r45_23_e101.g6 \
            --solver-log /tmp/r46/solver.log --output /tmp/r46/candidate.json
      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate
          cp /tmp/r46/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/few-shots-verify.json
          python3 - /tmp/r46/few-shots-verify.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d.get('valid') is True and str(d.get('score')) == '36', d
          PY
      - name: Upload solver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-d12-kissat-${{ matrix.symmetry }}
          path: /tmp/r46
          if-no-files-found: warn
          retention-days: 7

  collect:
    if: always()
    needs: solve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-d12-kissat-*
          path: /tmp/parts
      - name: Aggregate standalone-solver decisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 - /tmp/parts /tmp/r46/result.json <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); rows=[]; verified=[]
          for p in sorted(root.rglob('summary.json')):
              rows.append(json.load(open(p)))
              v=p.parent/'few-shots-verify.json'
              if v.exists(): verified.append(json.load(open(v)))
          result={'campaign':'lucky-d12-kissat-symmetry','rows':rows,
                  'sat_count':sum(r.get('status')=='SAT' for r in rows),
                  'unsat_count':sum(r.get('status')=='UNSAT' for r in rows),
                  'timeout_count':sum(r.get('status')=='TIMEOUT' for r in rows),
                  'verified_sat_count':sum(v.get('valid') is True and str(v.get('score'))=='36' for v in verified),
                  'exact_decision':('SAT' if any(r.get('status')=='SAT' for r in rows) else 'UNSAT' if any(r.get('status')=='UNSAT' for r in rows) else 'UNKNOWN')}
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='rows'},sort_keys=True))
          PY
      - name: Persist campaign and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/d12-kissat-symmetry.json
          for cand in /tmp/parts/*/candidate.json; do
            [[ -f "$cand" ]] || continue
            mode=$(basename "$(dirname "$cand")" | sed 's/ramsey-r46-d12-kissat-//')
            cp "$cand" "science-boundary/ramsey-r46/results/d12-kissat-${mode}-candidate.json"
            ver="$(dirname "$cand")/few-shots-verify.json"
            [[ ! -f "$ver" ]] || cp "$ver" "science-boundary/ramsey-r46/results/d12-kissat-${mode}-verify.json"
          done
          git rm .github/workflows/temp-ramsey-r46-d12-kissat.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/d12-kissat-*
          git commit -m 'ramsey-r46: record Kissat lucky d12 campaign'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
