name: temp-aes-neutral-cone-evolution
on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/neutral_cone_evolution.py'
      - '.github/workflows/temp-aes-neutral-cone-evolution.yml'
permissions:
  contents: read
jobs:
  constructive:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: fs-101
            rng: 0
          - seed: fs-101
            rng: 1
          - seed: fs-101
            rng: 2
          - seed: fs-101
            rng: 3
          - seed: nist-g103
            rng: 4
          - seed: nist-g104
            rng: 5
    steps:
      - uses: actions/checkout@v4
      - name: Construct alternative AES nonlinear-basis circuits
        run: |
          set -euxo pipefail
          python -m py_compile science-boundary/aes-sbox-circuit/neutral_cone_evolution.py
          python science-boundary/aes-sbox-circuit/neutral_cone_evolution.py \
            --seed '${{ matrix.seed }}' --rng '${{ matrix.rng }}' \
            --seconds 300 --max-pool 70 --roots-per-step 6 --solutions-per-cone 30 \
            --out result | tee run.log
          python -c "import json; d=json.load(open('result/summary.json')); assert d['best_all_256']; print(d)"
      - name: Verify any 100-gate candidate on official p008 verifier
        run: |
          set -euxo pipefail
          if [ -f result/candidate.json ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/p008shot
            cp result/candidate.json /tmp/p008shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/p008shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-neutral-cone-${{ matrix.seed }}-${{ matrix.rng }}
          path: |
            result
            run.log
            official-verifier.jsonl
