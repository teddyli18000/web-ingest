name: temp-ta41-diagnose-machine-core-information
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-diagnose-machine-core-information.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-diagnose-machine-core-information
  cancel-in-progress: false
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        case: [ta43js-n7elite1711, ta46js-n7elite1701, dmu17-n7elite1901, dmu60-n7elite1911, ta41]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Pin full resource solver and validate core-redundancy testing code
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/audit_machine_core_information.py
      - name: Compare unshrunk CP assumptions with full-resource independently shrinking cores
        run: |
          case='${{ matrix.case }}'
          if test "$case" = ta41; then src=ta41
          elif [[ "$case" == dmu6* ]]; then src="science-boundary/job-shop-ta41/positive-n7-dmu56-60/$case/start.txt"
          elif [[ "$case" == dmu* ]]; then src="science-boundary/job-shop-ta41/positive-n7-dmu16-20/$case/start.txt"
          else src="science-boundary/job-shop-ta41/positive-n7-elite-data/$case/start.txt"
          fi
          python3 science-boundary/job-shop-ta41/audit_machine_core_information.py \
            --start "$src" --seed 333 --open-sizes 3 5 \
            --initial-seconds 0.7 --check-seconds 0.35 --final-seconds 2 \
            --out "science-boundary/job-shop-ta41/results/audit-machine-core-information-$case.json"
      - name: Save only independently CP-certified results and explicit UNKNOWN
        if: always()
        run: |
          set -euo pipefail
          file='science-boundary/job-shop-ta41/results/audit-machine-core-information-${{ matrix.case }}.json'
          if ! test -f "$file"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): audit CP core compression vs trivial complement of opened machine set ${{ matrix.case }}'
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
