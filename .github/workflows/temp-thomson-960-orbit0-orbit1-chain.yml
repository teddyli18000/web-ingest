name: temp Thomson 960 orbit0 orbit1 glide chain

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-orbit0-orbit1-chain.yml'

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        multiplier: ['1.002','1.01','1.04']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-live-orbit0-restraint
          path: ${{ runner.temp }}/branch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41056185398
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Add same-scar second glide and continue branch
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) multiplier=${{ matrix.multiplier }} live=$live"
          python3 science-boundary/thomson-960/code/search_branch_second_glide.py \
            "$RUNNER_TEMP/branch/result.json" \
            --second-quad '319,699,283,615' \
            --pattern balanced --multiplier '${{ matrix.multiplier }}' \
            --schedule '10000,6000,4000,3000,2200,1600,1200,900,700,500,300,200,100,30,10,3,1,0.3,0.1,0.03,0.01,0.003,0.001,0' \
            --fixed-maxiter 2200 --stage-maxiter 1800 --final-maxiter 4000 \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('SOURCE',d['source_branch_kappa'],d['source_branch_energy'])
          print('QUADS',d['first_quad'],d['second_quad'],'THR2',d['second_threshold'],'M',d['multiplier'])
          print('FIXED',d['fixed_energy'],d['fixed_first_flipped'],d['fixed_second_flipped'],d['fixed_coord'])
          print('LAST_BOTH',None if d['last_both_flipped_state'] is None else {k:v for k,v in d['last_both_flipped_state'].items() if k!='points'})
          print('FIRST_LOST',d['first_lost_state'])
          print('FINAL',{k:v for k,v in d['final'].items() if k!='points'})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-orbit0-orbit1-chain-${{ matrix.multiplier }}
          path: ${{ runner.temp }}/out
          retention-days: 10
