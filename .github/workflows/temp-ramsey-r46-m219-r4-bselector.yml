name: Temp Ramsey R46 m219 r4 B-selector cover

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/m219_r4_bselector_sat.py
      - .github/workflows/temp-ramsey-r46-m219-r4-bselector.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SAT stack
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Prepare authenticated A25/A26/B116/B117 catalogues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/catalogs
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r36_11.g6.gz -o /tmp/r46/r36_11.g6.gz
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r45_24.g6 -o /tmp/r46/r45_24.g6
          echo '628c53df90910b2aae9a9559a62605593ff6fcdac66e9f23f95a134a4a696f36  /tmp/r46/r36_11.g6.gz' | sha256sum -c -
          echo '83ca4028f206b2fa4315ef219b8c2c57c7835209673dd8183d8fb4353bd4fdd0  /tmp/r46/r45_24.g6' | sha256sum -c -
          PYTHONPATH=science-boundary/ramsey-r46 python - /tmp/r46/r36_11.g6.gz /tmp/r46/r45_24.g6 /tmp/r46/catalogs <<'PY'
          import pathlib,sys
          import d12_fixed_ab_sat as b
          a=pathlib.Path(sys.argv[1]); bb=pathlib.Path(sys.argv[2]); out=pathlib.Path(sys.argv[3]); out.mkdir(parents=True,exist_ok=True)
          got={
            'A25':b.extract_g6_stratum(a,11,25,out/'A25.g6'),
            'A26':b.extract_g6_stratum(a,11,26,out/'A26.g6'),
            'B116':b.extract_g6_stratum(bb,24,116,out/'B116.g6'),
            'B117':b.extract_g6_stratum(bb,24,117,out/'B117.g6'),
          }
          assert got=={'A25':6,'A26':2,'B116':9,'B117':90},got
          print(got)
          PY
          PYTHONPATH=science-boundary/ramsey-r46 python science-boundary/ramsey-r46/m219_r4_bselector_sat.py --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-m219-r4-catalogs
          path: /tmp/r46/catalogs
          retention-days: 7

  solve:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {case: 0, a: 0}
          - {case: 0, a: 1}
          - {case: 0, a: 2}
          - {case: 0, a: 3}
          - {case: 0, a: 4}
          - {case: 0, a: 5}
          - {case: 1, a: 0}
          - {case: 1, a: 1}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ramsey-r46-m219-r4-catalogs
          path: /tmp/r46/catalogs
      - run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Solve one exact fixed-A / B-catalogue-selector branch
        id: solve
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/r46/out
          set +e
          timeout --signal=TERM --kill-after=20s 600 env PYTHONPATH=science-boundary/ramsey-r46 \
            python science-boundary/ramsey-r46/m219_r4_bselector_sat.py \
              --catalog-dir /tmp/r46/catalogs --case '${{ matrix.case }}' --a-ordinal '${{ matrix.a }}' \
              --summary /tmp/r46/out/summary.json --output /tmp/r46/out/candidate.json \
              > /tmp/r46/out/solver.log 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) status=SAT ;;
            20) status=UNSAT ;;
            124|137|143) status=TIMEOUT ;;
            *) status=ERROR ;;
          esac
          if [[ ! -f /tmp/r46/out/summary.json ]]; then
            python - /tmp/r46/out/summary.json "$status" "$rc" '${{ matrix.case }}' '${{ matrix.a }}' <<'PY'
          import json,sys
          p,st,rc,case,a=sys.argv[1:]
          open(p,'w').write(json.dumps({'campaign':'m219-r4-Bselector','status':st,'solver_exit':int(rc),'case':int(case),'a_ordinal':int(a)},indent=2,sort_keys=True)+'\n')
          PY
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/r46/out/summary.json
          tail -n 20 /tmp/r46/out/solver.log || true
          [[ "$status" != ERROR ]]
      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate
          cp /tmp/r46/out/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/out/few-shots-verify.json
          python3 - /tmp/r46/out/few-shots-verify.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d.get('valid') is True and str(d.get('score'))=='36',d
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-m219-r4-${{ matrix.case }}-${{ matrix.a }}
          path: /tmp/r46/out
          if-no-files-found: warn
          retention-days: 7

  collect:
    if: always()
    needs: [prepare, solve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-m219-r4-*
          path: /tmp/parts
      - name: Aggregate exact eight-branch cover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python - /tmp/parts /tmp/r46/result.json <<'PY'
          import json,pathlib,shutil,sys
          rows=[];hits=[];vers=[]
          for p in pathlib.Path(sys.argv[1]).rglob('summary.json'):
              d=json.load(open(p)); rows.append(d); c=p.parent/'candidate.json'; v=p.parent/'few-shots-verify.json'
              if c.exists(): hits.append((d,c,v if v.exists() else None))
              if v.exists(): vers.append(json.load(open(v)))
          rows.sort(key=lambda d:(d['case'],d['a_ordinal'])); counts={}
          for r in rows: counts[r['status']]=counts.get(r['status'],0)+1
          d={'campaign':'m219-r4-Bselector','logical_scope':'the two m219 degree sequences not forced to contain an r=3 anchor, conditional on existence of an r=4 anchor',
             'proof_cover':'6 A25 branches with one-hot choice among 9 B116 graphs plus 2 A26 branches with one-hot choice among 90 B117 graphs; both global sequences and all class placements quantified inside SAT',
             'expected_branches':8,'branches_attempted':len(rows),'status_counts':counts,
             'all_unsat':len(rows)==8 and counts.get('UNSAT',0)==8,'sat_count':counts.get('SAT',0),'timeout_count':counts.get('TIMEOUT',0),
             'verified_sat_count':sum(v.get('valid') is True and str(v.get('score'))=='36' for v in vers),'rows':rows}
          if hits:
              hd,c,v=hits[0]; shutil.copyfile(c,'/tmp/r46/candidate.json')
              if v: shutil.copyfile(v,'/tmp/r46/few-shots-verify.json')
          open(sys.argv[2],'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in d.items() if k!='rows'},sort_keys=True))
          PY
      - name: Persist campaign and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/m219-r4-Bselector.json
          [[ ! -f /tmp/r46/candidate.json ]] || cp /tmp/r46/candidate.json science-boundary/ramsey-r46/results/m219-r4-hit.json
          [[ ! -f /tmp/r46/few-shots-verify.json ]] || cp /tmp/r46/few-shots-verify.json science-boundary/ramsey-r46/results/m219-r4-hit-verify.json
          git rm .github/workflows/temp-ramsey-r46-m219-r4-bselector.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/m219-r4-*.json
          git commit -m 'ramsey-r46: record eight-branch m219 r4 cover'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
