name: Temp Science Boundary C7 neutral5 by k6 full-pool prize

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-neutral5-k6-fullpool.yml
      - science-boundary/shannon-capacity-c7/code/bpz_neutral5_k6_fullpool_prize.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-science-boundary-c7-neutral5-k6-fullpool
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned sources, audit artifact, and dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/audit" "$RUNNER_TEMP/result" "$RUNNER_TEMP/base" "$RUNNER_TEMP/shot"
          gh run download 40994810518 -R teddyli18000/web-ingest -n c7-neutral5-killer-audit -D "$RUNNER_TEMP/audit"
          test -f "$RUNNER_TEMP/audit/audit.json"
      - name: Exact full-pool neutral5 by k6 prize
        id: prize
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_neutral5_k6_fullpool_prize.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/audit/audit.json" "$RUNNER_TEMP/result/prize.json" "$RUNNER_TEMP/base/certificate.json" \
            --workers "$(nproc)" > "$RUNNER_TEMP/result/prize.stdout" 2> "$RUNNER_TEMP/result/prize.stderr"
          cat "$RUNNER_TEMP/result/prize.stdout"
          tail -n 160 "$RUNNER_TEMP/result/prize.stderr"
          python3 - "$RUNNER_TEMP/result/prize.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); b=r['best']
          with open(sys.argv[2],'a') as f:
              f.write(f"has_cert={'true' if r.get('candidate_materialized') else 'false'}\n")
              f.write(f"score={r.get('candidate_score',-1)}\n")
              f.write(f"gain={b['gain']}\n")
              f.write(f"selected={b['selected']}\n")
          PY
      - name: Verify prize optimum mother or breakthrough upstream
        if: steps.prize.outputs.has_cert == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/base" | tee "$RUNNER_TEMP/result/seed-verify.json"
          python3 - "$RUNNER_TEMP/result/seed-verify.json" '${{ steps.prize.outputs.score }}' <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); want=int(sys.argv[2])
          if not r.get('valid') or int(r.get('score',-1))!=want: raise SystemExit((r,want))
          print('verified full-pool optimum',r)
          PY
          if [[ '${{ steps.prize.outputs.score }}' == '134753' ]]; then
            python3 - "$RUNNER_TEMP/base/certificate.json" "$RUNNER_TEMP/base/ids.txt" <<'PY'
          import json,sys
          pts=json.load(open(sys.argv[1]))['points']
          if len(pts)!=134753 or len(set(pts))!=134753: raise SystemExit(('tie',len(pts),len(set(pts))))
          open(sys.argv[2],'w').write(''.join(f'{int(p,7)}\n' for p in pts))
          PY
          fi
      - name: Exact unrestricted net1 through radius4 on neutral optimum
        id: r4
        if: steps.prize.outputs.has_cert == 'true' && steps.prize.outputs.score == '134753'
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/patch_search_net1_r4_compile.py \
            science-boundary/shannon-capacity-c7/code/search_net1_r4_complete.cpp "$RUNNER_TEMP/r4.cpp"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp "$RUNNER_TEMP/r4.cpp" -o "$RUNNER_TEMP/r4"
          export OMP_NUM_THREADS="$(nproc)"
          /usr/bin/time -v "$RUNNER_TEMP/r4" "$RUNNER_TEMP/base/ids.txt" > "$RUNNER_TEMP/result/r4.json" 2> "$RUNNER_TEMP/result/r4.stderr"
          cat "$RUNNER_TEMP/result/r4.json"
          python3 - "$RUNNER_TEMP/result/r4.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys;r=json.load(open(sys.argv[1]));open(sys.argv[2],'a').write(f"found={'true' if r.get('kind')!='none' else 'false'}\n")
          PY
      - name: Build exact radius5 solvers
        if: steps.r4.outputs.found != 'true' && steps.prize.outputs.score == '134753'
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/patch_r5_net2_to_net1.py direct science-boundary/shannon-capacity-c7/code/search_net2_r5_direct.cpp "$RUNNER_TEMP/r5d.cpp"
          python3 science-boundary/shannon-capacity-c7/code/patch_r5_net2_to_net1.py lower science-boundary/shannon-capacity-c7/code/search_net2_r5_lower.cpp "$RUNNER_TEMP/r5l.cpp"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp "$RUNNER_TEMP/r5d.cpp" -o "$RUNNER_TEMP/r5d"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp "$RUNNER_TEMP/r5l.cpp" -o "$RUNNER_TEMP/r5l"
      - name: Exact radius5 direct
        id: r5d
        if: steps.r4.outputs.found != 'true' && steps.prize.outputs.score == '134753'
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          /usr/bin/time -v "$RUNNER_TEMP/r5d" "$RUNNER_TEMP/base/ids.txt" > "$RUNNER_TEMP/result/r5-direct.json" 2> "$RUNNER_TEMP/result/r5-direct.stderr"
          cat "$RUNNER_TEMP/result/r5-direct.json"
          python3 - "$RUNNER_TEMP/result/r5-direct.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys;r=json.load(open(sys.argv[1]));open(sys.argv[2],'a').write(f"found={'true' if r.get('kind')!='none' else 'false'}\n")
          PY
      - name: Exact radius5 lower support
        id: r5l
        if: steps.r4.outputs.found != 'true' && steps.r5d.outputs.found != 'true' && steps.prize.outputs.score == '134753'
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          /usr/bin/time -v "$RUNNER_TEMP/r5l" "$RUNNER_TEMP/base/ids.txt" > "$RUNNER_TEMP/result/r5-lower.json" 2> "$RUNNER_TEMP/result/r5-lower.stderr"
          cat "$RUNNER_TEMP/result/r5-lower.json"
          python3 - "$RUNNER_TEMP/result/r5-lower.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys;r=json.load(open(sys.argv[1]));open(sys.argv[2],'a').write(f"found={'true' if r.get('kind')!='none' else 'false'}\n")
          PY
      - name: Materialize local improvement
        id: local
        if: steps.prize.outputs.score == '134753'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/base/ids.txt" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot/certificate.json" "$GITHUB_OUTPUT" <<'PY'
          import json,os,sys
          base=set(int(x) for x in open(sys.argv[1]) if x.strip()); rd=sys.argv[2]; out=sys.argv[3]; gout=sys.argv[4]; hit=None
          for fn in ('r4.json','r5-direct.json','r5-lower.json'):
              p=os.path.join(rd,fn)
              if os.path.exists(p):
                  r=json.load(open(p))
                  if r.get('kind')!='none': hit=r; break
          found=False
          if hit:
              rem=list(map(int,hit.get('remove',[]))); add=list(map(int,hit.get('add',[]))); cur=base-set(rem)
              if any(x not in base for x in rem) or any(x in cur for x in add): raise SystemExit(('exchange',hit))
              cur.update(add)
              if len(cur)!=134754: raise SystemExit(('score',len(cur)))
              def enc(z):
                  d=[]
                  for _ in range(10): d.append(str(z%7)); z//=7
                  return ''.join(reversed(d))
              json.dump({'points':[enc(z) for z in sorted(cur)]},open(out,'w'),separators=(',',':'));open(out,'a').write('\n');found=True
          open(gout,'a').write(f"found={'true' if found else 'false'}\n")
          PY
      - name: Verify local breakthrough
        if: steps.local.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/local-verify.json"
          python3 - "$RUNNER_TEMP/result/local-verify.json" <<'PY'
          import json,sys;r=json.load(open(sys.argv[1]));
          if not r.get('valid') or int(r.get('score',-1))<134754: raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-neutral5-k6-fullpool
          path: |
            ${{ runner.temp }}/result
            ${{ runner.temp }}/base/certificate.json
            ${{ runner.temp }}/shot/certificate.json
          if-no-files-found: warn
          retention-days: 14
