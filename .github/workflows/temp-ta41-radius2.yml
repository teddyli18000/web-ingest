name: temp-ta41-radius2
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/exact_radius2.py'
      - '.github/workflows/temp-ta41-radius2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-radius2
  cancel-in-progress: false
jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Exhaustive noncommuting and commuting 2-swap enumeration
        run: |
          python3 science-boundary/job-shop-ta41/exact_radius2.py
      - name: Independent official verification on improvement
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/radius2"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);s=json.loads((p/'upstream-verdict.json').read_text())
          assert s['valid'] and int(s['score'])<=2005,s
          PY
          fi
      - name: Save exact local neighborhood result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/radius2/
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): exact 2-swap neighborhood exclusion or certificate'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
