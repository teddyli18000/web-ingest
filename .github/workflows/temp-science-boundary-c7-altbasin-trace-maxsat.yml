name: Temp Science Boundary C7 alternate-basin trace MaxSAT

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-altbasin-trace-maxsat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git init "$RUNNER_TEMP/shannon-source"
          git -C "$RUNNER_TEMP/shannon-source" remote add origin https://github.com/nathanielitty/lower-bounds-for-shannon-capacity.git
          git -C "$RUNNER_TEMP/shannon-source" fetch --depth 1 origin fe8966079013abaac21d1c08441500100f8e3b86
          git -C "$RUNNER_TEMP/shannon-source" checkout FETCH_HEAD
      - name: Install dependencies and materialize alternate 134753 basins
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/jp" "$RUNNER_TEMP/rank3" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot-jp" "$RUNNER_TEMP/shot-rank3"
          python3 science-boundary/shannon-capacity-c7/code/bpz_jplus_seed.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/jp/certificate.json" "$RUNNER_TEMP/result/jp-status.json"
          python3 science-boundary/shannon-capacity-c7/code/neutral2_rank3_tie_seed.py \
            "$RUNNER_TEMP/shannon-source/c7/R367.txt" "$RUNNER_TEMP/rank3/certificate.json" "$RUNNER_TEMP/result/rank3-status.json"
          python3 - "$RUNNER_TEMP/jp/certificate.json" "$RUNNER_TEMP/jp/ids.txt" "$RUNNER_TEMP/rank3/certificate.json" "$RUNNER_TEMP/rank3/ids.txt" <<'PY'
          import json,sys
          for cp,ip in ((sys.argv[1],sys.argv[2]),(sys.argv[3],sys.argv[4])):
              pts=json.load(open(cp,encoding='utf-8'))['points']
              if len(pts)!=134753 or len(set(pts))!=134753: raise SystemExit((cp,len(pts),len(set(pts))))
              open(ip,'w').write(''.join(f'{x}\n' for x in sorted(int(p,7) for p in pts)))
          PY
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/jp" | tee "$RUNNER_TEMP/result/jp-verify.json"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/rank3" | tee "$RUNNER_TEMP/result/rank3-verify.json"
          python3 - "$RUNNER_TEMP/result/jp-verify.json" "$RUNNER_TEMP/result/rank3-verify.json" <<'PY'
          import json,sys
          for p in sys.argv[1:]:
              r=json.load(open(p,encoding='utf-8'))
              if not r.get('valid') or int(r.get('score',-1))!=134753: raise SystemExit((p,r))
          PY
      - name: Build traced guided 1/2-swap plateau walker
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/patch_private_guided12_trace.py \
            science-boundary/shannon-capacity-c7/code/c7_10d_private_guided12_walk.cpp "$RUNNER_TEMP/guided12-trace.cpp"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp "$RUNNER_TEMP/guided12-trace.cpp" -o "$RUNNER_TEMP/walk"
      - name: Run deterministic traces from both alternate basins
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          for basin in jp rank3; do
            : > "$RUNNER_TEMP/result/$basin-trace-all.txt"
            for seed in 73101 73102 73103 73104; do
              /usr/bin/time -v "$RUNNER_TEMP/walk" \
                "$RUNNER_TEMP/$basin/ids.txt" "$RUNNER_TEMP/result/$basin-direct-$seed.ids" \
                10000 "$seed" 20 64 "$RUNNER_TEMP/result/$basin-trace-$seed.txt" \
                > "$RUNNER_TEMP/result/$basin-walk-$seed.json" 2> "$RUNNER_TEMP/result/$basin-walk-$seed.stderr"
              lines=$(wc -l < "$RUNNER_TEMP/result/$basin-trace-$seed.txt")
              python3 - "$RUNNER_TEMP/result/$basin-walk-$seed.json" "$lines" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); lines=int(sys.argv[2])
          want=int(r.get('accepted1',-1))+2*int(r.get('accepted2',-1))
          if lines!=want: raise SystemExit((r,lines,want))
          PY
              cat "$RUNNER_TEMP/result/$basin-trace-$seed.txt" >> "$RUNNER_TEMP/result/$basin-trace-all.txt"
            done
          done
      - name: Exact MaxSAT over all Jplus trace additions
        id: jp
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/optimize_plateau_trace_maxsat.py \
            "$RUNNER_TEMP/jp/ids.txt" "$RUNNER_TEMP/result/jp-trace-all.txt" \
            "$RUNNER_TEMP/shot-jp/ids.txt" "$RUNNER_TEMP/result/jp-trace-maxsat.json" --target 134754
          cat "$RUNNER_TEMP/result/jp-trace-maxsat.json"
          if [[ -f "$RUNNER_TEMP/shot-jp/ids.txt" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Exact MaxSAT over all rank3 trace additions
        id: rank3
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/optimize_plateau_trace_maxsat.py \
            "$RUNNER_TEMP/rank3/ids.txt" "$RUNNER_TEMP/result/rank3-trace-all.txt" \
            "$RUNNER_TEMP/shot-rank3/ids.txt" "$RUNNER_TEMP/result/rank3-trace-maxsat.json" --target 134754
          cat "$RUNNER_TEMP/result/rank3-trace-maxsat.json"
          if [[ -f "$RUNNER_TEMP/shot-rank3/ids.txt" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Materialize and verify any exact MaxSAT breakthrough
        if: steps.jp.outputs.found == 'true' || steps.rank3.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for basin in jp rank3; do
            if [[ -f "$RUNNER_TEMP/shot-$basin/ids.txt" ]]; then
              python3 - "$RUNNER_TEMP/shot-$basin/ids.txt" "$RUNNER_TEMP/shot-$basin/certificate.json" <<'PY'
          import json,sys
          ids=[int(x) for x in open(sys.argv[1]) if x.strip()]
          def enc(z):
              d=[]
              for _ in range(10): d.append(str(z%7)); z//=7
              return ''.join(reversed(d))
          json.dump({'points':[enc(z) for z in ids]},open(sys.argv[2],'w',encoding='utf-8'),separators=(',',':'));open(sys.argv[2],'a').write('\n')
          PY
              cd "$RUNNER_TEMP/few-shots"
              python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot-$basin" | tee "$RUNNER_TEMP/result/$basin-breakthrough-verify.json"
              cd "$GITHUB_WORKSPACE"
              python3 - "$RUNNER_TEMP/result/$basin-breakthrough-verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1))<=134753: raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY
              cp "$RUNNER_TEMP/shot-$basin/certificate.json" "$RUNNER_TEMP/result/$basin-candidate.json"
            fi
          done
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-altbasin-trace-maxsat
          path: ${{ runner.temp }}/result
          retention-days: 14
