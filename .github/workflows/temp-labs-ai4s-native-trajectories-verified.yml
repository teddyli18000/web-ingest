name: temp-labs-ai4s-native-trajectories-verified
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-native-trajectories-verified.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-native-trajectories-verified
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Clone pinned original unrestricted memetic-Tabu and instrument natively
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch master https://github.com/borkob/git_labs.git "$RUNNER_TEMP/git_labs"
          PIN=1aa123407636e48630174e0bf122037e369c1d68
          git -C "$RUNNER_TEMP/git_labs" fetch -q --depth 1 origin "$PIN"
          git -C "$RUNNER_TEMP/git_labs" checkout -q --detach "$PIN"
          test "$(git -C "$RUNNER_TEMP/git_labs" rev-parse HEAD)" = "$PIN"
          echo "LABS_SOURCE_COMMIT=$PIN" >> "$GITHUB_ENV"
          SRC="$RUNNER_TEMP/git_labs/solvers/lMAts-lRRts/src"
          python3 science-boundary/labs-ai4s-search/trajectory_20261104/instrument_mts.py "$SRC"
          make -s -j1 -C "$SRC"
          test -x "$SRC/lMAts"
      - name: Native trajectory pilots on 6 lengths with independent seeds
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/trajectory_20261104
          SRC="$RUNNER_TEMP/git_labs/solvers/lMAts-lRRts/src/lMAts"
          python3 collect_native.py --solver "$SRC" \
            --output results/native_pilot_v2 \
            --lengths 48,64,80,92,99,100 --seeds 2 --duration 30 --workers 4 \
            --genstride 16 --stepstride 24
      - name: Recompute every state and run structural and heldout-length audits
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check numpy pandas scikit-learn
          cd science-boundary/labs-ai4s-search/trajectory_20261104
          python3 verify_native_fast.py results/native_pilot_v2 \
            --summary results/native_pilot_v2/exact_verification.json
          python3 analyze_native.py results/native_pilot_v2 --out results/native_analysis_v2
          python3 predict_native.py results/native_analysis_v2/episodes.tsv.gz \
            --out results/native_analysis_v2
          python3 - <<'PY'
          import json,pathlib
          d=pathlib.Path('results/native_analysis_v2')
          s=json.loads((d/'structural_summary.json').read_text())
          p=json.loads((d/'crosslength_ablation.json').read_text())
          assert s['runs']==12 and s['sampled_episodes']>0
          assert s['global_records']>0 and s['intermediate_snapshots']>0
          assert p['train_rows']>0 and p['test_rows']>0
          print('VALIDATED native episodes',s['sampled_episodes'],'records',s['global_records'])
          PY
      - name: Publish only exact-checked raw data and analyses
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/trajectory_20261104/results/native_pilot_v2/
          git add science-boundary/labs-ai4s-search/trajectory_20261104/results/native_analysis_v2/
          git commit -m 'research(labs-ai4s): verify original MTS search trajectories and heldout-length spectrum ablations'
          git pull --rebase origin main
          git push origin HEAD:main
