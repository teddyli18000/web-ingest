name: temp-labs-ai4s-macro-native-smoke
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-macro-native-smoke.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-macro-native-smoke
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Source-pinned original public lMAts and compile macro arms
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/borkob/git_labs.git "$RUNNER_TEMP/git_labs"
          PIN=1aa123407636e48630174e0bf122037e369c1d68
          git -C "$RUNNER_TEMP/git_labs" fetch -q --depth 1 origin "$PIN"
          git -C "$RUNNER_TEMP/git_labs" checkout -q --detach "$PIN"
          test "$(git -C "$RUNNER_TEMP/git_labs" rev-parse HEAD)" = "$PIN"
          SRC="$RUNNER_TEMP/git_labs/solvers/lMAts-lRRts/src"
          python3 science-boundary/labs-ai4s-search/trajectory_20261104/patch_macro_mts.py "$SRC"
          make -s -j1 -C "$SRC"
          test -x "$SRC/lMAts"
      - name: Validate trigger, exact solver energy, and original baseline run
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/trajectory_20261104
          python3 run_macro_mts.py \
            --exe "$RUNNER_TEMP/git_labs/solvers/lMAts-lRRts/src/lMAts" \
            --out results/macro_smoke_v1 --lengths 64,99 --reps 1 \
            --seconds 6 --workers 4 --arms 0,1,2,3,4,5
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('results/macro_smoke_v1')
          m=json.loads((root/'summary.json').read_text())
          rows=list(csv.DictReader((root/'results.tsv').open(),delimiter='\t'))
          assert len(rows)==12 and m['valid']==12
          assert m['total_macro_events']>0
          assert all(int(r['bestE'])==int(r['oddE'])+int(r['evenE']) for r in rows)
          assert all(float(r['actual_seconds'])>=6 for r in rows)
          for n in (64,99):
            assert all(int(r['macro_proposals'])>0 for r in rows if int(r['n'])==n and int(r['arm'])>0)
          print('SMOKE VERIFIED 12 exact outputs and all 10 active macro arms')
          PY
      - name: Publish validated native macro smoke data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/trajectory_20261104/results/macro_smoke_v1/
          git commit -m 'research(labs-ai4s): validate native MTS macro perturbation smoke and exact score'
          git pull --rebase origin main
          git push origin HEAD:main
