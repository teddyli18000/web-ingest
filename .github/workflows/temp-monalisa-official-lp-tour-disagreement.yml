name: temp-monalisa-official-lp-tour-disagreement
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/historical_lp_disagreement.py
      - .github/workflows/temp-monalisa-official-lp-tour-disagreement.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain independent official scorer and numerical libs
        run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          python -m pip install numpy matplotlib
          mkdir -p /tmp/p010-source/tour /tmp/p010-source/lp
      - name: Download original Waterloo Concorde LP and historical tours
        run: |
          set -euxo pipefail
          root=https://www.math.uwaterloo.ca/tsp/data/ml
          for score in 5757199 5757200 5757203 5757204 5757205 5757241 5757245; do
            curl -fsSL --retry 3 --connect-timeout 30 --max-time 120 "$root/tour/monalisa_${score}.tour" -o "/tmp/p010-source/tour/monalisa_${score}.tour"
          done
          for variant in 6nsub 5zsub 4zsub; do
            curl -fsSL --retry 3 --connect-timeout 30 --max-time 120 "$root/x/mona.${variant}.x" -o "/tmp/p010-source/lp/mona.${variant}.x"
          done
          head -n 2 /tmp/p010-source/lp/mona.6nsub.x
          wc -l /tmp/p010-source/lp/*.x
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path('/tmp/p010-source/tour')
          l=Path('/tmp/p010-source/lp')
          tours={f'historic_{score}':str(t/f'monalisa_{score}.tour') for score in (5757199,5757200,5757203,5757204,5757205,5757241,5757245)}
          lps={'2012-04-18':str(l/'mona.6nsub.x'),
               '2012-01-21':str(l/'mona.5zsub.x'),
               '2011-07-15':str(l/'mona.4zsub.x')}
          Path('/tmp/p010-source/tours.json').write_text(json.dumps(tours))
          Path('/tmp/p010-source/lps.json').write_text(json.dumps(lps))
          PY
      - name: Audit all historical tour lengths, LP degree constraints and spatial overlap
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          mkdir -p science-boundary/mona-lisa-tsp/results/history-lp science-boundary/mona-lisa-tsp/figures science-boundary/mona-lisa-tsp/data
          python science-boundary/mona-lisa-tsp/historical_lp_disagreement.py \
            --baseline upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --tours /tmp/p010-source/tours.json \
            --lps /tmp/p010-source/lps.json \
            --out science-boundary/mona-lisa-tsp/data/historical-lp-overlap.json \
            --regions science-boundary/mona-lisa-tsp/data/historical-lp-regions.csv \
            --map science-boundary/mona-lisa-tsp/figures/historical-lp-overlap.png
      - name: Persist verified reproducible compact findings on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/mona-lisa-tsp/data/historical-lp-overlap.json science-boundary/mona-lisa-tsp/data/historical-lp-regions.csv science-boundary/mona-lisa-tsp/figures/historical-lp-overlap.png
          git commit -m 'science(p010): preserve independently verified historical strong-tour vs Concorde fractional LP overlap'
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monalisa-historical-lp-comparison
          path: |
            science-boundary/mona-lisa-tsp/data/historical-lp-overlap.json
            science-boundary/mona-lisa-tsp/data/historical-lp-regions.csv
            science-boundary/mona-lisa-tsp/figures/historical-lp-overlap.png
          if-no-files-found: ignore
