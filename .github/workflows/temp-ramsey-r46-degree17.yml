name: Temp Ramsey R46 degree-17 static SAT

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-ramsey-r46-degree17.yml
      - science-boundary/ramsey-r46/degree17_static_sat.py
      - science-boundary/ramsey-r46/data/r36_17.g6
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-degree17
  cancel-in-progress: false

jobs:
  solve:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate pinned complete catalog
        shell: bash
        run: |
          set -euo pipefail
          echo '3286c5366ddc70f349c3f7e798d7acbc79dc026c7abe0c8f406cad41ca990361  science-boundary/ramsey-r46/data/r36_17.g6' | sha256sum -c -
          test "$(wc -l < science-boundary/ramsey-r46/data/r36_17.g6)" -eq 7
      - name: Build pinned Kissat 4.0.4
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/arminbiere/kissat.git "$RUNNER_TEMP/kissat"
          git -C "$RUNNER_TEMP/kissat" checkout 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cd "$RUNNER_TEMP/kissat"
          ./configure
          make -j2
          build/kissat --version
      - name: Generate static symmetry-broken branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 science-boundary/ramsey-r46/degree17_static_sat.py \
            --catalog science-boundary/ramsey-r46/data/r36_17.g6 \
            --index '${{ matrix.index }}' \
            --output /tmp/r46/branch.cnf \
            | tee /tmp/r46/generate.json
          head -n 1 /tmp/r46/branch.cnf
          du -h /tmp/r46/branch.cnf
      - name: Solve static branch
        id: solve
        shell: bash
        run: |
          set -uo pipefail
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          /usr/bin/time -v timeout --signal=TERM --kill-after=30s 6600 \
            "$RUNNER_TEMP/kissat/build/kissat" /tmp/r46/branch.cnf \
            > /tmp/r46/solver.log 2>&1
          rc=$?
          set -e
          finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          case "$rc" in
            10) status=SAT ;;
            20) status=UNSAT ;;
            124|137|143) status=TIMEOUT ;;
            *) status=ERROR ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 - /tmp/r46/generate.json /tmp/r46/summary.json "$status" "$rc" "$started" "$finished" <<'PY'
          import json,os,sys
          gen_path,out,status,rc,started,finished=sys.argv[1:]
          d=json.load(open(gen_path,encoding='utf-8'))
          d.update(status=status,solver_exit=int(rc),started=started,finished=finished,
                   kissat_commit='8af8e56f174b778aef3aa45af9f739b2a5f492c2',
                   github_run_id=os.environ['GITHUB_RUN_ID'],encoding='static-full-ramsey+lex-B-cross')
          open(out,'w',encoding='utf-8').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          cat /tmp/r46/summary.json
          tail -n 80 /tmp/r46/solver.log || true
          [[ "$status" != ERROR ]]
      - name: Decode SAT model
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/ramsey-r46/sat_r46.py decode \
            /tmp/r46/solver.log /tmp/r46/candidate.json
      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate
          cp /tmp/r46/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/few-shots-verify.json
          python3 - /tmp/r46/few-shots-verify.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d.get('valid') is True and d.get('score')=='36', d
          PY
      - name: Upload branch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-degree17-static-${{ matrix.index }}
          path: |
            /tmp/r46/generate.json
            /tmp/r46/summary.json
            /tmp/r46/solver.log
            /tmp/r46/candidate.json
            /tmp/r46/few-shots-verify.json
          if-no-files-found: ignore
          retention-days: 7

  collect:
    if: always()
    needs: solve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-degree17-static-*
          path: /tmp/branches
      - name: Aggregate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 - /tmp/branches /tmp/r46/result.json <<'PY'
          import json,os,pathlib,shutil,sys
          root,out=map(pathlib.Path,sys.argv[1:]); rows=[]; hit=None
          for p in root.rglob('summary.json'):
              d=json.load(open(p)); d['_dir']=str(p.parent); rows.append(d)
              if d.get('status')=='SAT': hit=d
          rows.sort(key=lambda d:d['catalog_index'])
          result={'campaign':'degree-17-static-complete-r36-17-catalog',
                  'run_id':os.environ['GITHUB_RUN_ID'],
                  'catalog_sha256':'3286c5366ddc70f349c3f7e798d7acbc79dc026c7abe0c8f406cad41ca990361',
                  'branches_completed':len(rows),
                  'all_unsat':len(rows)==7 and all(d.get('status')=='UNSAT' for d in rows),
                  'found':hit is not None,
                  'branches':[{k:v for k,v in d.items() if k!='_dir'} for d in rows]}
          if hit:
              src=pathlib.Path(hit['_dir'])
              shutil.copyfile(src/'candidate.json','/tmp/r46/candidate.json')
              q=src/'few-shots-verify.json'
              if q.exists(): shutil.copyfile(q,'/tmp/r46/few-shots-verify.json')
              result['hit_index']=hit['catalog_index']
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='branches'},sort_keys=True))
          PY
      - name: Persist degree-17 static result
        shell: bash
        run: |
          set -euo pipefail
          dest=science-boundary/ramsey-r46/results
          cp /tmp/r46/result.json "$dest/degree17-static-sat.json"
          [[ ! -f /tmp/r46/candidate.json ]] || cp /tmp/r46/candidate.json "$dest/degree17-static-hit.json"
          [[ ! -f /tmp/r46/few-shots-verify.json ]] || cp /tmp/r46/few-shots-verify.json "$dest/degree17-static-hit-verify.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$dest"
          git commit -m 'ramsey-r46: record static degree-17 SAT sweep' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-degree17-static-aggregate
          path: /tmp/r46
          retention-days: 7
