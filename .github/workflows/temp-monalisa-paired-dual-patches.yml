name: temp-monalisa-paired-dual-patches
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/paired_nonlocal_patches.py
      - .github/workflows/temp-monalisa-paired-dual-patches.yml
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        pair_start: [0, 3, 6, 9, 12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public source graph and exact verifier
        run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          git clone --depth 1 https://github.com/bicobico2/ElimTSP.git elimtsp
          python -m pip install networkx ortools
          python upstream/problems/p010-mona-lisa-tsp/verify/verify.py upstream/problems/p010-mona-lisa-tsp/baseline
      - name: Search coupled distant dual regions with exact connectivity
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          mkdir -p science-boundary/mona-lisa-tsp/results/nonlocal-${{ matrix.pair_start }}
          python science-boundary/mona-lisa-tsp/paired_nonlocal_patches.py \
            --edges elimtsp/results/mona.248972.edg.gz \
            --baseline upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --neutral-moves science-boundary/mona-lisa-tsp/data/neutral-moves.json \
            --outdir science-boundary/mona-lisa-tsp/results/nonlocal-${{ matrix.pair_start }} \
            --report science-boundary/mona-lisa-tsp/results/nonlocal-${{ matrix.pair_start }}/report.json \
            --pair-start ${{ matrix.pair_start }} --max-pairs 3 --radii 1,2,3 --max-faces 420 --seconds 30
          for f in science-boundary/mona-lisa-tsp/results/nonlocal-${{ matrix.pair_start }}/candidate-*.json; do
            test -f "$f" || continue
            mkdir -p /tmp/p010-check
            cp "$f" /tmp/p010-check/certificate.json
            python upstream/problems/p010-mona-lisa-tsp/verify/verify.py /tmp/p010-check
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monalisa-nonlocal-dual-${{ matrix.pair_start }}
          path: science-boundary/mona-lisa-tsp/results/nonlocal-${{ matrix.pair_start }}/
          if-no-files-found: ignore
