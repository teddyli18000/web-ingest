name: temp Thomson 960 D-node transition network v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-d-network.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Download A-B hybrid saddle
        uses: actions/download-artifact@v4
        with:
          name: thomson-saddle-ab-hybrid
          path: ${{ runner.temp }}/ab
          github-token: ${{ github.token }}
          run-id: 40634347073
      - name: Reproduce D and C
        run: |
          python3 science-boundary/thomson-960/code/harvest_saddle_branch.py \
            "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/ab/hybrid-ab.json" \
            --mode 2 --sign -1 --transverse-amp 0.012 --reaction-amp 0 \
            --out "$RUNNER_TEMP/basin-d.json"
          python3 science-boundary/thomson-960/code/harvest_basin_c.py \
            "$RUNNER_TEMP/few-shots" \
            --neighbor-json science-boundary/thomson-960/data/neighbor-soft-003280.json \
            --scale 0.95 --out "$RUNNER_TEMP/basin-c.json"
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-dc-nodes
          retention-days: 7
          path: |
            ${{ runner.temp }}/basin-d.json
            ${{ runner.temp }}/basin-c.json

  bd:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-dc-nodes
          path: ${{ runner.temp }}/nodes
      - name: B-D minimum-energy path and conservative hybrid
        run: |
          python3 science-boundary/thomson-960/code/string_between_seeds.py \
            science-boundary/thomson-960/data/basin-b-010566.json "$RUNNER_TEMP/nodes/basin-d.json" \
            --images 13 --iterations 420 --climb-iterations 0 --eta 0.00020 --max-step 0.00045 \
            --perp-tol 2e-5 --out "$RUNNER_TEMP/string-bd.json"
          python3 science-boundary/thomson-960/code/refine_saddle_hybrid.py \
            "$RUNNER_TEMP/string-bd.json" --outer 7 --penalty 300000 --perp-maxiter 650 \
            --newton-damping 0.15 --max-reaction-rms 0.00003 --out "$RUNNER_TEMP/hybrid-bd.json"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'hybrid-bd.json')))
          print('BD_FINAL',d['final_energy'],d['final_gradient_rms'],d['negative_internal_modes_below_-1e-3'],[m['eigenvalue'] for m in d['final_modes'][:5]])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-bd-edge
          retention-days: 7
          path: |
            ${{ runner.temp }}/string-bd.json
            ${{ runner.temp }}/hybrid-bd.json

  dc:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-dc-nodes
          path: ${{ runner.temp }}/nodes
      - name: Adaptive D-C endpoint zoom and conservative hybrid
        run: |
          python3 science-boundary/thomson-960/code/refine_endpoint_string.py \
            "$RUNNER_TEMP/nodes/basin-d.json" "$RUNNER_TEMP/nodes/basin-c.json" \
            --images 17 --iterations 160 --levels 5 --eta 0.00018 --max-step 0.00020 \
            --out "$RUNNER_TEMP/adaptive-dc.json"
          python3 science-boundary/thomson-960/code/refine_saddle_hybrid.py \
            "$RUNNER_TEMP/adaptive-dc.json" --outer 8 --penalty 400000 --perp-maxiter 650 \
            --newton-damping 0.10 --max-reaction-rms 0.00001 --out "$RUNNER_TEMP/hybrid-dc.json"
          python3 - <<'PY'
          import json,os
          a=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'adaptive-dc.json')))
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'hybrid-dc.json')))
          print('DC_ADAPTIVE',a['resolved_interior_maximum'],a['probe_energy'],[(x['max_index'],x['rms_span'],x['max_energy']) for x in a['levels']])
          print('DC_FINAL',d['final_energy'],d['final_gradient_rms'],d['negative_internal_modes_below_-1e-3'],[m['eigenvalue'] for m in d['final_modes'][:5]])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-dc-edge
          retention-days: 7
          path: |
            ${{ runner.temp }}/adaptive-dc.json
            ${{ runner.temp }}/hybrid-dc.json

  bc:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-dc-nodes
          path: ${{ runner.temp }}/nodes
      - name: Fine B-C path and conservative hybrid
        run: |
          python3 science-boundary/thomson-960/code/string_between_seeds.py \
            science-boundary/thomson-960/data/basin-b-010566.json "$RUNNER_TEMP/nodes/basin-c.json" \
            --images 17 --iterations 520 --climb-iterations 0 --eta 0.00016 --max-step 0.00035 \
            --perp-tol 2e-5 --out "$RUNNER_TEMP/string-bc.json"
          python3 science-boundary/thomson-960/code/refine_saddle_hybrid.py \
            "$RUNNER_TEMP/string-bc.json" --outer 8 --penalty 400000 --perp-maxiter 650 \
            --newton-damping 0.10 --max-reaction-rms 0.00001 --out "$RUNNER_TEMP/hybrid-bc.json"
          python3 - <<'PY'
          import json,os
          s=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'string-bc.json')))
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'hybrid-bc.json')))
          print('BC_STRING',s['endpoint_collapsed'],max(s['path_energies']),s['max_path_perpendicular_gradient_rms'])
          print('BC_FINAL',d['final_energy'],d['final_gradient_rms'],d['negative_internal_modes_below_-1e-3'],[m['eigenvalue'] for m in d['final_modes'][:5]])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-bc-edge-v2
          retention-days: 7
          path: |
            ${{ runner.temp }}/string-bc.json
            ${{ runner.temp }}/hybrid-bc.json
