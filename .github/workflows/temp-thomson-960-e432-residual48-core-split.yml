name: temp Thomson 960 e432 residual48 core split

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-e432-residual48-core-split.yml'

jobs:
  split:
    strategy:
      fail-fast: false
      matrix:
        shell: [0, 1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Split >48 reaction residual by scar core
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "shell=${{ matrix.shell }} nproc=$(nproc) live=$live"
          python3 science-boundary/thomson-960/code/search_residual48_core_split.py \
            "$RUNNER_TEMP/seed/e432.json" "$RUNNER_TEMP/seed/B-natural.json" \
            --k 48 --fd-step 3e-6 --shell '${{ matrix.shell }}' --decay 1.0 \
            --core-scales=-0.6,0,0.35,0.55,0.70,0.85,1.0,1.2,1.5 \
            --far-scales=-0.4,0,0.25,0.5,0.7,0.9,1.0,1.2 \
            --maxiter 3400 --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('SHELL',d['shell'],'ACTIVE',d['active_vertices'],'RESIDUAL_POWER',d['residual_power'],
                'CORE_POWER',d['core_residual_power'],'FAR_POWER',d['far_residual_power'])
          print('BEST',d['best_energy'],'DELTA',d['best_delta_live'])
          for b in d['distinct_low_basins'][:20]:
              print('BASIN',b['energy'],b['delta_live'],b['coord_counts'],'core',b['core_scale'],'far',b['far_scale'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e432-residual48-core-shell${{ matrix.shell }}
          path: ${{ runner.temp }}/out
          retention-days: 10
