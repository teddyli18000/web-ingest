name: Temp Science Boundary C7 rank3 square stats

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-rank3-square-stats.yml
      - science-boundary/shannon-capacity-c7/code/rank3_square_stats.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-rank3-square-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/shannon-source"
          git -C "$RUNNER_TEMP/shannon-source" remote add origin https://github.com/nathanielitty/lower-bounds-for-shannon-capacity.git
          git -C "$RUNNER_TEMP/shannon-source" fetch --depth 1 origin fe8966079013abaac21d1c08441500100f8e3b86
          git -C "$RUNNER_TEMP/shannon-source" checkout FETCH_HEAD
      - name: Install SAT dependency
        run: python3 -m pip install --disable-pip-version-check python-sat
      - name: Compute obstruction statistics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          python3 science-boundary/shannon-capacity-c7/code/rank3_square_stats.py \
            "$RUNNER_TEMP/shannon-source/c7/R367.txt" \
            "$RUNNER_TEMP/result/stats.json"
      - name: Upload stats
        uses: actions/upload-artifact@v4
        with:
          name: c7-rank3-square-stats
          path: ${{ runner.temp }}/result/stats.json
          retention-days: 14
      - name: Summarize
        shell: bash
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/result/stats.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
