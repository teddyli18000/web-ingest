name: temp ramsey r46 extension maxsat

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-ramsey-r46-extension-maxsat.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-ramsey-r46-extension-maxsat
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PySAT
        run: python -m pip install --disable-pip-version-check python-sat
      - name: Rank all 37 known cores by exact frozen-core extension cost
        run: |
          set -euxo pipefail
          python science-boundary/ramsey-r46/extension_maxsat.py \
            --solver g3 \
            --json-out /tmp/extension-maxsat.json \
            | tee /tmp/extension-maxsat.log
      - name: Upload exact ranking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-extension-maxsat
          path: |
            /tmp/extension-maxsat.json
            /tmp/extension-maxsat.log
          if-no-files-found: warn
