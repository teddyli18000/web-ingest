name: temp-aes-released-rnbp-support-fast

on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/released_rnbp_support_fast.py'
      - '.github/workflows/temp-aes-released-rnbp-support-fast.yml'

permissions:
  contents: read

jobs:
  synth:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: fs-101, seed: 1, maxlin: 67}
          - {family: fs-101, seed: 2, maxlin: 67}
          - {family: nist-g103, seed: 1, maxlin: 68}
          - {family: nist-g103, seed: 2, maxlin: 68}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run target-generated exact-support RNBP
        run: |
          set -euxo pipefail
          python -m py_compile science-boundary/aes-sbox-circuit/released_rnbp_support_fast.py
          python science-boundary/aes-sbox-circuit/released_rnbp_support_fast.py \
            --family '${{ matrix.family }}' --seed '${{ matrix.seed }}' \
            --max-linear '${{ matrix.maxlin }}' --max-support 9 --elite 6 \
            --out result | tee run.log
          cat result/summary.json
      - name: Official verifier if <=100
        run: |
          set -euxo pipefail
          if [ -f result/candidate.json ] && [ "$(python -c "import json; print(len(json.load(open('result/candidate.json'))['gates']))")" -le 100 ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/shot; cp result/candidate.json /tmp/shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-rnbp-fast-${{ matrix.family }}-s${{ matrix.seed }}
          path: |
            result
            run.log
            official-verifier.jsonl
