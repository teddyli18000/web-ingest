name: temp-ta41-verify-21-gateway-necessity
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-verify-21-gateway-necessity.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-verify-21-gateway-necessity
  cancel-in-progress: false
jobs:
  independently_prove:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Independently rebuild 600-operation job-shop model and prove 21 gateway necessity
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/verify_mandatory_adjacent_gateways.py
          python3 science-boundary/job-shop-ta41/verify_mandatory_adjacent_gateways.py
      - name: Commit independently checked exact necessary structural condition
        run: |
          set -euo pipefail
          file='science-boundary/job-shop-ta41/results/ta41-mandatory-adjacent-gateways-independently-proved.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'research(ta41): independently prove at least one of 21 baseline adjacent inversions is mandatory'
          for i in $(seq 1 50); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
