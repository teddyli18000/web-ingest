name: Riemann-Weil Schur flow components

on:
  push:
    branches: [main]
    paths:
      - 'temp-work/riemann-weil-research/experiments/schur_flow_component_decomposition.py'
      - '.github/workflows/riemann-weil-schur-flow-components.yml'

permissions:
  contents: write

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - N: 16
            prec: 1800
            dps: 180
          - N: 24
            prec: 2600
            dps: 220
          - N: 32
            prec: 3600
            dps: 260
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install interval dependencies
        run: python -m pip install --disable-pip-version-check python-flint mpmath
      - name: Fetch pinned public verifier
        run: |
          git clone --quiet https://github.com/akivag613/connes-cvs-.git upstream-connes-cvs
          git -C upstream-connes-cvs checkout --quiet 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c
      - name: Decompose Schur log-flow
        run: |
          python temp-work/riemann-weil-research/experiments/schur_flow_component_decomposition.py \
            --upstream-script upstream-connes-cvs/papers/2_guinand_weil_dictionary_tail_order/scripts/arb_ldlt_certify.py \
            --upstream-commit 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c \
            --c0 100 --N ${{ matrix.N }} --prec ${{ matrix.prec }} --dps ${{ matrix.dps }} \
            --hs '1e-6,1e-8' \
            --output schur-flow-components-c100-N${{ matrix.N }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: schur-flow-components-c100-N${{ matrix.N }}
          path: schur-flow-components-c100-N${{ matrix.N }}.json
          retention-days: 1

  collect:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: schur-flow-components-*
          path: downloaded
          merge-multiple: true
      - name: Commit results safely
        run: |
          set -euo pipefail
          mkdir -p temp-work/riemann-weil-research/results
          cp downloaded/schur-flow-components-*.json temp-work/riemann-weil-research/results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-work/riemann-weil-research/results/schur-flow-components-*.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: record Schur-flow component decomposition'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
