name: temp-ta41-core-simultaneous-reversal-lb
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/core_simultaneous_reversal_lb.py'
      - '.github/workflows/temp-ta41-core-simultaneous-reversal-lb.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-core-simultaneous-reversal-lb
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: old21
            k: 1
          - core: old21
            k: 2
          - core: all12
            k: 1
          - core: all12
            k: 2
          - core: refined14
            k: 1
          - core: refined14
            k: 2
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CP solver and syntax check
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/core_simultaneous_reversal_lb.py
      - name: Prove or refute stronger multiple-pair coordinated reversal requirement
        run: |
          python3 science-boundary/job-shop-ta41/core_simultaneous_reversal_lb.py \
            --core '${{ matrix.core }}' --max-flips '${{ matrix.k }}' --seconds 130 \
            --out 'science-boundary/job-shop-ta41/results/core-multiflip-${{ matrix.core }}-k${{ matrix.k }}'
      - name: Officially verify actual <=2005 schedule if solver constructs one
        if: always()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/core-multiflip-${{ matrix.core }}-k${{ matrix.k }}"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Save exact statuses and certified core-pair data
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/core-multiflip-${{ matrix.core }}-k${{ matrix.k }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): simultaneous core pair reversal ${{ matrix.core }} k${{ matrix.k }}'
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
