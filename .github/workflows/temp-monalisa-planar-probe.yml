name: temp-monalisa-planar-probe
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/planar_face_probe.py
      - .github/workflows/temp-monalisa-planar-probe.yml
permissions:
  contents: read
jobs:
  planar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact verifier, baseline and published sparse graph
        run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          git clone --depth 1 https://github.com/bicobico2/ElimTSP.git elimtsp
          python -m pip install networkx
          python upstream/problems/p010-mona-lisa-tsp/verify/verify.py upstream/problems/p010-mona-lisa-tsp/baseline
      - name: Planar-dual experiment
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          python science-boundary/mona-lisa-tsp/planar_face_probe.py \
            --edges elimtsp/results/mona.248972.edg.gz \
            --baseline upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --report science-boundary/mona-lisa-tsp/results/planar-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monalisa-p010-planar-report
          path: science-boundary/mona-lisa-tsp/results/planar-report.json
          if-no-files-found: ignore
