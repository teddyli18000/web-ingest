name: temp-ta41-upstream-neural-nds30x20
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/verify_nds_neural_output.py'
      - '.github/workflows/temp-ta41-upstream-neural-nds30x20.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-upstream-neural-nds30x20
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Pin and clone authors' actual pretrained 30x20 model repository
        run: |
          git clone --depth=1 https://github.com/dawoz/NDS-S.git /tmp/nds-s
          git -C /tmp/nds-s fetch --depth=1 origin c58783b0271f95d9a56252d8841fa2a78535a4d2
          git -C /tmp/nds-s checkout --detach c58783b0271f95d9a56252d8841fa2a78535a4d2
          test -f /tmp/nds-s/models/jssp30x20/checkpoint-1000.pt
      - name: Install pretrained inference dependencies (no training)
        run: |
          python3 -m pip install torch torch-geometric hydra-core omegaconf cppimport pybind11 numpy wandb pytz
      - name: Evaluate official model once on exact ta41 at CPU scale
        run: |
          set -euo pipefail
          mkdir -p /tmp/nds-eval
          cd /tmp/nds-s
          inst='data/jssp/30_20 __ta41__lb1906_ub2005.csv'
          OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=1 python3 -m ndss.eval jssp.yaml \
            env_params.num_jobs=30 \
            env_params.num_machines=20 \
            env_params.num_nodes_to_remove=10 \
            tester_params.use_cuda=False \
            tester_params.test_data_load.filename="$inst" \
            tester_params.test_episodes=1 \
            tester_params.test_batch_size=1 \
            tester_params.model_load.0.path=models/jssp30x20 \
            tester_params.model_load.0.epoch=1000 \
            tester_params.max_runtime=125 \
            tester_params.rollout_size=8 \
            tester_params.aug_factor=1 \
            logger_params.filepath=/tmp/nds-eval \
            logger_params.desc=""
      - name: Convert original neural solution to official machine-order certificate and rescore
        run: |
          python3 science-boundary/job-shop-ta41/verify_nds_neural_output.py \
            --nds-repo /tmp/nds-s \
            --results /tmp/nds-eval/results.csv \
            --solutions /tmp/nds-eval/solutions.csv \
            --out science-boundary/job-shop-ta41/results/nds-neural30x20
      - name: Official Few Shots verifier on improvement
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/nds-neural30x20"
          if test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist replay-verified neural benchmark outcome
        if: always()
        run: |
          set -euo pipefail
          out='science-boundary/job-shop-ta41/results/nds-neural30x20'
          if ! test -d "$out"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): independently replay authors pretrained NDS-S 30x20'
          for i in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
