name: temp Thomson 960 oscillating-size bounce

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-size-bounce.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-thomson-960-size-bounce
  cancel-in-progress: false

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        route: [down, up]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Run oscillating-size route
        run: |
          python3 science-boundary/thomson-960/code/search_size_bounce.py \
            "$RUNNER_TEMP/few-shots" --route ${{ matrix.route }} --p 5 --parents 2 \
            --out "$RUNNER_TEMP/result-${{ matrix.route }}.json"
          python3 - <<'PY'
          import json, os
          route='${{ matrix.route }}'
          p=os.path.join(os.environ['RUNNER_TEMP'],f'result-{route}.json')
          d=json.load(open(p))
          # Avoid dumping 960x3 points to logs; print only scalar result.
          print({k:v for k,v in d.items() if k!='best_points'})
          PY
      - name: Upload candidate result
        uses: actions/upload-artifact@v4
        with:
          name: thomson-size-bounce-${{ matrix.route }}
          path: ${{ runner.temp }}/result-${{ matrix.route }}.json
          retention-days: 7

  cleanup:
    if: always()
    needs: search
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove disposable workflow
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/temp-thomson-960-size-bounce.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temp-thomson-960-size-bounce.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: remove completed Thomson size-bounce workflow"
            git push origin HEAD:main
          fi
