name: Resume repaired Baidu locatedownload transfer (one shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-baidu-resume-locatedownload.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: baidu-drive-live-state
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            baidu-drive
      - name: Retry the same blocked task, preserving upload checkpoint
        run: |
          python3 - <<'PY'
          import os,subprocess,sys
          sys.path.insert(0,"baidu-drive")
          import controller
          gh=controller.GitHub(os.environ["GITHUB_REPOSITORY"],os.environ["GITHUB_TOKEN"])
          runtime,_=gh.read_json(controller.RUNTIME_PATH,default=controller.DEFAULT_RUNTIME)
          task_id="bd-20261114T114727Z-caff29"
          if runtime.get("active_task") != task_id:
              raise RuntimeError("Active task changed; refusing to resume a different task")
          task=controller.load_active_task(gh,runtime)
          if task["status"] != "BLOCKED" or int(task.get("relay_active_workers") or 0)!=0:
              raise RuntimeError("Task is not in the expected safely blocked state")
          release=gh.ensure_release()
          if controller.parse_control(release.get("body",""))["command"]!="none":
              raise RuntimeError("Another Release request is pending")
          updated_runtime,updated_task,_=controller.apply_command(
              "retry",{"command":"retry"},runtime,task
          )
          updated_task=controller.save_task(gh,updated_task,"resume signed locatedownload")
          updated_runtime=controller.save_runtime_if_changed(
              gh,runtime,updated_runtime,"resume signed locatedownload"
          )
          state,message=controller.status_projection(updated_task)
          gh.patch_release(
              release,
              controller.render_release(controller.default_control(),updated_runtime,updated_task,state,message),
          )
          subprocess.run([
              "gh","workflow","run","baidu-drive-worker.yml","--ref","main",
              "--repo",os.environ["GITHUB_REPOSITORY"],
              "-f",f"task_id={task_id}","-f","reason=retry",
          ],check=True)
          print("Existing blocked task resumed using verified signed source")
          PY
