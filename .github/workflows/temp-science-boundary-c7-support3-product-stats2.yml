name: Temp Science Boundary C7 support3 product graph stats v2

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-support3-product-stats2.yml
      - science-boundary/shannon-capacity-c7/code/bpz_support3_product_graph_stats.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-support3-product-stats-v2
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned BPZ source and dependency
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/result"
      - name: Exact factor and product graph census
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_support3_product_graph_stats.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/stats.json" \
            | tee "$RUNNER_TEMP/result/stats.stdout"
          cat "$RUNNER_TEMP/result/stats.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-support3-product-graph-stats-v2
          path: ${{ runner.temp }}/result
          retention-days: 14
