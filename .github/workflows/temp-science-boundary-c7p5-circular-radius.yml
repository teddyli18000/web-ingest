name: temp C7p5 circular connected exchanges up to radius five

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7p5-circular-radius.yml
      - science-boundary/shannon-capacity-c7/code/c7p5_circular_connected_exchange.cpp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-c7p5-circular-radius
  cancel-in-progress: false

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        radius: [3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned independent code inputs
        run: |
          git init --quiet /tmp/c7-tandon
          git -C /tmp/c7-tandon fetch --quiet --depth 1 https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git c753408492dde92a239708986d16c15dbf6c3235
          git -C /tmp/c7-tandon checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-tandon rev-parse HEAD)" = c753408492dde92a239708986d16c15dbf6c3235
          git init --quiet /tmp/c7-five
          git -C /tmp/c7-five fetch --quiet --depth 1 https://github.com/molind/c7-five.git ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
          git -C /tmp/c7-five checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-five rev-parse HEAD)" = ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
      - name: Decode and independently replay the new circular 367 seed
        run: |
          mkdir -p /tmp/c7-radius
          python science-boundary/shannon-capacity-c7/code/c7p5_circular_hall_io.py prepare \
            science-boundary/shannon-capacity-c7/data/circular-phase-367-2026-11-04.json \
            /tmp/c7-tandon/data/base_c7.json /tmp/c7-five/data/family-f.json \
            /tmp/c7-radius/inputs
      - name: Exact complete connected-support exchange enumeration
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra \
            science-boundary/shannon-capacity-c7/code/c7p5_circular_connected_exchange.cpp \
            -o /tmp/c7-radius/connected
          /usr/bin/time -v /tmp/c7-radius/connected \
            "${{ matrix.radius }}" /tmp/c7-radius/inputs/circle.ids \
            /tmp/c7-radius/status.json /tmp/c7-radius/witness5.ids
      - name: Independently verify every improvement
        run: |
          if test -s /tmp/c7-radius/witness5.ids; then
            python science-boundary/shannon-capacity-c7/code/c7p5_circular_hall_io.py verify \
              /tmp/c7-radius/witness5.ids /tmp/c7-radius/shot
            git clone --quiet --depth 1 https://github.com/few-shots/few-shots.git /tmp/c7-fewshots
            python /tmp/c7-fewshots/problems/p004-shannon-capacity-c7/verify/verify.py /tmp/c7-radius/shot
          else
            echo 'No radius-${{ matrix.radius }} improvement.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7-circle-connected-radius-${{ matrix.radius }}
          path: |
            /tmp/c7-radius/status.json
            /tmp/c7-radius/witness5.ids
            /tmp/c7-radius/shot/certificate.json
          retention-days: 14
