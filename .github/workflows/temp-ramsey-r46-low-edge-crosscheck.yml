name: Temp Ramsey R46 low-edge crosscheck

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-ramsey-r46-low-edge-crosscheck.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-low-edge-crosscheck
  cancel-in-progress: false

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact SAT dependencies
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17' 'networkx==3.5'
      - name: Audit the structural m217 cover
        shell: bash
        run: |
          set -euo pipefail
          test -s science-boundary/ramsey-r46/data/r45extreme_n23_e101_unique.g6
          mkdir -p /tmp/r46/lowedge/m216 /tmp/r46/lowedge/m217 /tmp/r46/lowedge/candidates
          python science-boundary/ramsey-r46/verify_m217_closure.py \
            | tee /tmp/r46/lowedge/m217-closure-verifier.txt
          python science-boundary/ramsey-r46/m216_fixed_pair_sat.py self-test
      - name: Solve m216 independently with CaDiCaL and Glucose42
        id: m216
        shell: bash
        run: |
          set -euo pipefail
          sat=0
          for solver in cadical195 glucose42; do
            set +e
            python science-boundary/ramsey-r46/m216_fixed_pair_sat.py solve \
              --a-catalog science-boundary/ramsey-r46/data/r36_12_e29.g6 \
              --b-catalog science-boundary/ramsey-r46/data/r45extreme_n23_e101_unique.g6 \
              --solver "$solver" \
              --summary "/tmp/r46/lowedge/m216/${solver}.json" \
              --output "/tmp/r46/lowedge/candidates/m216-${solver}.json"
            rc=$?
            set -e
            case "$rc" in
              20) echo "m216 $solver UNSAT" ;;
              0) echo "m216 $solver SAT"; sat=1 ;;
              *) echo "unexpected m216 $solver rc=$rc"; exit 1 ;;
            esac
          done
          echo "sat=$sat" >> "$GITHUB_OUTPUT"
      - name: Cross-check all 39 m217 branches with Glucose42
        id: m217
        shell: bash
        run: |
          set -euo pipefail
          sat=0
          for ordinal in $(seq 0 38); do
            set +e
            python science-boundary/ramsey-r46/m217_fixed_pair_sat.py solve \
              --a-catalog science-boundary/ramsey-r46/data/r36_12_e29.g6 \
              --b-catalog science-boundary/ramsey-r46/data/r45extreme_n23_e101_unique.g6 \
              --ordinal "$ordinal" --solver glucose42 \
              --summary "/tmp/r46/lowedge/m217/ordinal-${ordinal}.json" \
              --output "/tmp/r46/lowedge/candidates/m217-${ordinal}.json"
            rc=$?
            set -e
            case "$rc" in
              20) ;;
              0) echo "m217 ordinal $ordinal SAT"; sat=1 ;;
              *) echo "unexpected m217 ordinal $ordinal rc=$rc"; exit 1 ;;
            esac
          done
          echo "sat=$sat" >> "$GITHUB_OUTPUT"
      - name: Merge exact low-edge evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/r46/lowedge')
          m216 = [json.loads(p.read_text()) for p in sorted((root/'m216').glob('*.json'))]
          assert {r['solver'] for r in m216} == {'cadical195','glucose42'}, m216
          m216_status = {r['solver']: r['status'] for r in m216}
          rows = [json.loads((root/'m217'/f'ordinal-{i}.json').read_text()) for i in range(39)]
          assert [int(r['branch_ordinal']) for r in rows] == list(range(39))
          m217_counts = {s: sum(r['status']==s for r in rows) for s in ('UNSAT','SAT')}
          exact = set(m216_status.values()) == {'UNSAT'} and m217_counts == {'UNSAT': 39, 'SAT': 0}
          result = {
              'campaign': 'ramsey-r46-low-edge-exclusion-through-217',
              'edge_counts_198_215': 'excluded by exact endpoint-extrema degree-sum relaxation',
              'm216_degree_sequence': {'12': 36},
              'm216_solvers': m216_status,
              'm217_degree_sequence': {'12': 34, '13': 2},
              'm217_existing_solver': 'cadical195: 39/39 UNSAT in results/m217-fixed-pair-39.json',
              'm217_crosscheck_solver': 'glucose42',
              'm217_crosscheck_counts': m217_counts,
              'all_edge_counts_le_217_excluded': exact,
              'consequence_if_exact': 'any Ramsey(4,6,36) graph has at least 218 edges' if exact else None,
              'm216_rows': m216,
              'm217_rows': rows,
          }
          (root/'low-edge-closure.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps({k: result[k] for k in ('m216_solvers','m217_crosscheck_counts','all_edge_counts_le_217_excluded','consequence_if_exact')}, indent=2))
          assert exact, result
          PY
      - name: Verify any SAT certificate with Few Shots
        if: steps.m216.outputs.sat == '1' || steps.m217.outputs.sat == '1'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          shopt -s nullglob
          for cand in /tmp/r46/lowedge/candidates/*.json; do
            work="/tmp/verify-$(basename "$cand" .json)"
            mkdir -p "$work"
            cp "$cand" "$work/certificate.json"
            python3 /tmp/few-shots/problems/p003-ramsey-r46/verify/verify.py "$work" \
              | tee "/tmp/r46/lowedge/$(basename "$cand" .json)-few-shots.json"
          done
      - name: Persist exact result and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/lowedge/low-edge-closure.json science-boundary/ramsey-r46/results/low-edge-closure-through-217.json
          cp /tmp/r46/lowedge/m217-closure-verifier.txt science-boundary/ramsey-r46/results/m217-closure-verifier.txt
          cp /tmp/r46/lowedge/m216/cadical195.json science-boundary/ramsey-r46/results/m216-fixed-pair-cadical195.json
          cp /tmp/r46/lowedge/m216/glucose42.json science-boundary/ramsey-r46/results/m216-fixed-pair-glucose42.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          src=Path('/tmp/r46/lowedge/m217')
          rows=[json.loads((src/f'ordinal-{i}.json').read_text()) for i in range(39)]
          out={'campaign':'m217-fixed-A29-B101-orbit-pair-glucose42','all_unsat':all(r['status']=='UNSAT' for r in rows),'branches_attempted':39,'rows':rows}
          Path('science-boundary/ramsey-r46/results/m217-fixed-pair-39-glucose42.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          assert out['all_unsat']
          PY
          git rm .github/workflows/temp-ramsey-r46-low-edge-crosscheck.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/low-edge-closure-through-217.json \
                  science-boundary/ramsey-r46/results/m217-closure-verifier.txt \
                  science-boundary/ramsey-r46/results/m216-fixed-pair-cadical195.json \
                  science-boundary/ramsey-r46/results/m216-fixed-pair-glucose42.json \
                  science-boundary/ramsey-r46/results/m217-fixed-pair-39-glucose42.json
          git commit -m 'ramsey-r46: certify exact exclusion through 217 edges'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-low-edge-crosscheck
          path: /tmp/r46/lowedge
          if-no-files-found: warn
          retention-days: 7
