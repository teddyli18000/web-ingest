name: temp Thomson 960 dependent third-flip census

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-dependent-third-census.yml'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - uses: actions/download-artifact@v4
        with:
          name: thomson-dependent-orbit4-1.04
          path: ${{ runner.temp }}/dep
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41058090920
      - name: Census newly legal third events
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "nproc=$(nproc)"
          python3 science-boundary/thomson-960/code/census_dependent_third_flip.py \
            "$RUNNER_TEMP/seed/live.json" "$RUNNER_TEMP/dep/result.json" \
            --out "$RUNNER_TEMP/out/census.json"
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-dependent-third-census
          path: ${{ runner.temp }}/out
          retention-days: 10
