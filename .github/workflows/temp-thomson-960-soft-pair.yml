name: temp Thomson 960 soft-pair escapes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-soft-pair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        pair: [0, 3]
        phase: [0, 10, 20, 30, 40, 50]
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Follow low Hessian doublet and relax
        run: |
          python3 science-boundary/thomson-960/code/search_soft_pair.py \
            "$RUNNER_TEMP/few-shots" \
            --pair-start ${{ matrix.pair }} --phase-deg ${{ matrix.phase }} \
            --out "$RUNNER_TEMP/result-p${{ matrix.pair }}-a${{ matrix.phase }}.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'], 'result-p${{ matrix.pair }}-a${{ matrix.phase }}.json')
          d=json.load(open(p))
          d.pop('best_points',None)
          print(json.dumps(d,indent=2))
          PY
      - name: Upload candidate result
        uses: actions/upload-artifact@v4
        with:
          name: thomson-soft-p${{ matrix.pair }}-a${{ matrix.phase }}
          path: ${{ runner.temp }}/result-p${{ matrix.pair }}-a${{ matrix.phase }}.json
          retention-days: 7
