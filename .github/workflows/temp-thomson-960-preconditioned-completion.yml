name: temp Thomson 960 preconditioned completion

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-preconditioned-completion.yml'

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: remote-a
            quad: '415,459,18,547'
          - tag: remote-b
            quad: '172,804,190,613'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Search preconditioned completion
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) tag=${{ matrix.tag }} live=$live"
          python3 science-boundary/thomson-960/code/search_preconditioned_completion.py \
            "$RUNNER_TEMP/seed/e432.json" "$RUNNER_TEMP/seed/B-natural.json" \
            --prefix-t 0.31 --quad '${{ matrix.quad }}' \
            --patterns balanced,newdiag,olddiag \
            --multipliers 1.01,1.05,1.12,1.25,1.50 \
            --fixed-maxiter 1800 --prefix-release-maxiter 1800 --release-maxiter 3400 \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('PREFIX_SUPPORT',len(d['prefix_support']),d['prefix_support'])
          print('QUAD',d['quad'],'THRESHOLDS',d['thresholds'])
          print('BEST',d['best_release_energy'],'DELTA',d['best_delta_live'])
          for b in d['lowest_distinct_release_basins'][:16]:
              print('BASIN',b['energy'],b['delta_live'],b['coord_counts'],'pat',b['pattern'],'m',b['multiplier'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-preconditioned-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 10
