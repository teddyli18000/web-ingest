name: temp-aes-g103-suffix-two-new-focus

on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/g103_suffix_two_new_focus.py'
      - '.github/workflows/temp-aes-g103-suffix-two-new-focus.yml'

permissions:
  contents: read

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - basis: '1,2,4'
            gates: 19
          - basis: '1,3,4'
            gates: 19
          - basis: '2,3,4'
            gates: 19
          - basis: '1,2,4'
            gates: 20
          - basis: '1,3,4'
            gates: 20
          - basis: '2,3,4'
            gates: 20
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Search focused exact two-new-helper family
        run: |
          set -euxo pipefail
          python -m py_compile \
            science-boundary/aes-sbox-circuit/g103_suffix_guide_subset.py \
            science-boundary/aes-sbox-circuit/g103_suffix_two_new_focus.py
          python science-boundary/aes-sbox-circuit/g103_suffix_two_new_focus.py \
            --basis-rows '${{ matrix.basis }}' --gates '${{ matrix.gates }}' \
            --required-drop '0,5,8' --out result | tee run.log
          cat result/summary.json
      - name: Official verifier for any <=100 candidate
        run: |
          set -euxo pipefail
          if [ -f result/full.json ] && [ "$(python -c "import json; print(len(json.load(open('result/full.json'))['gates']))")" -le 100 ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/shot
            cp result/full.json /tmp/shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-g103-suffix-two-new-${{ matrix.basis }}-k${{ matrix.gates }}
          path: |
            result
            run.log
            official-verifier.jsonl
