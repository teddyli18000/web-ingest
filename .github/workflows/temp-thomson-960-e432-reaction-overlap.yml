name: temp Thomson 960 e432 reaction overlap

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-e432-reaction-overlap.yml'

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Project e432-B displacement onto Hessian modes
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 science-boundary/thomson-960/code/analyze_reaction_mode_overlap.py \
            "$RUNNER_TEMP/seed/e432.json" "$RUNNER_TEMP/seed/B-natural.json" \
            --k 48 --fd-step 3e-6 --out "$RUNNER_TEMP/out/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e432-reaction-overlap
          path: ${{ runner.temp }}/out
          retention-days: 10
