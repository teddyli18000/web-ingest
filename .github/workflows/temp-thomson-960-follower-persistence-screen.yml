name: temp Thomson 960 follower persistence screen

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-follower-persistence-screen.yml'

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: f4
            sequence: 'f4'
          - tag: f5
            sequence: 'f5'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-dependent-orbit4-1.04
          path: ${{ runner.temp }}/two
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41058090920
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Force softened follower and release
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          python3 science-boundary/thomson-960/code/search_forced_follower_cascade.py \
            "$RUNNER_TEMP/two/result.json" --sequence '${{ matrix.sequence }}' \
            --q3-multiplier 1.04 --follower-multiplier 1.01 \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          f=d['final']; first=d['stages'][0]
          print('SEQ',d['sequence'],'K100',first['energy'],first['followers'],'FINAL',f['class'],f['energy'],'DELTA',f['delta_live'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-follower-persistence-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 10
