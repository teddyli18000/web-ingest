name: Temp Science Boundary C7 BPZ t9 KaMIS

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-bpz-t9-kamis.yml
      - science-boundary/shannon-capacity-c7/code/bpz_t9_kamis.py
      - science-boundary/shannon-capacity-c7/code/bpz_t9_obstruction_mis.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-bpz-t9-kamis
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned public sources read-only
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD

          git init "$RUNNER_TEMP/kamis"
          git -C "$RUNNER_TEMP/kamis" remote add origin https://github.com/KarlsruheMIS/KaMIS.git
          git -C "$RUNNER_TEMP/kamis" fetch --depth 1 origin 78d065d3087dc590e887c0aa3c608b5cafd30ac6
          git -C "$RUNNER_TEMP/kamis" checkout FETCH_HEAD
          git -C "$RUNNER_TEMP/kamis" submodule update --init --recursive --depth 1

          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7

      - name: Install bridge dependency
        run: python3 -m pip install --disable-pip-version-check python-sat

      - name: Build KaMIS v3.2
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kamis"
          ./compile_withcmake.sh
          test -x deploy/struction

      - name: Export exact obstruction graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kamis-run" "$RUNNER_TEMP/shot" "$RUNNER_TEMP/result"
          python3 science-boundary/shannon-capacity-c7/code/bpz_t9_kamis.py export \
            "$RUNNER_TEMP/tan" \
            "$RUNNER_TEMP/kamis-run/c7-t9-obstruction.graph" \
            "$RUNNER_TEMP/kamis-run/mapping.json" \
            "$RUNNER_TEMP/result/graph-meta.json"
          cat "$RUNNER_TEMP/result/graph-meta.json"
          if [[ -x "$RUNNER_TEMP/kamis/deploy/graphchecker" ]]; then
            "$RUNNER_TEMP/kamis/deploy/graphchecker" "$RUNNER_TEMP/kamis-run/c7-t9-obstruction.graph"
          fi

      - name: Run exact KaMIS struction
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v "$RUNNER_TEMP/kamis/deploy/struction" \
            "$RUNNER_TEMP/kamis-run/c7-t9-obstruction.graph" \
            --cyclicStrong \
            --time_limit=720 \
            --output="$RUNNER_TEMP/kamis-run/solution.txt" \
            > "$RUNNER_TEMP/result/solver.log" 2> "$RUNNER_TEMP/result/solver.stderr"
          cat "$RUNNER_TEMP/result/solver.log"
          tail -n 80 "$RUNNER_TEMP/result/solver.stderr" || true
          test -s "$RUNNER_TEMP/kamis-run/solution.txt"

      - name: Replay KaMIS solution and materialize candidate
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/bpz_t9_kamis.py materialize \
            "$RUNNER_TEMP/tan" \
            "$RUNNER_TEMP/kamis-run/mapping.json" \
            "$RUNNER_TEMP/kamis-run/solution.txt" \
            "$RUNNER_TEMP/result/solver.log" \
            "$RUNNER_TEMP/shot/certificate.json" \
            "$RUNNER_TEMP/result/status.json"
          cat "$RUNNER_TEMP/result/status.json"
          cp "$RUNNER_TEMP/kamis-run/solution.txt" "$RUNNER_TEMP/result/solution.txt"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi

      - name: Verify 134770 breakthrough with Few Shots verifier
        if: steps.materialize.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1)) <= 134753:
              raise SystemExit(f'candidate not a verified breakthrough: {r}')
          print(f"VERIFIED BREAKTHROUGH score={r['score']}")
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"

      - name: Upload reproducibility result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-bpz-t9-kamis-v3.2
          path: ${{ runner.temp }}/result
          retention-days: 14

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo '## C7 BPZ t9 KaMIS v3.2'
            for f in graph-meta.json status.json verify.json; do
              if [[ -f "$RUNNER_TEMP/result/$f" ]]; then echo '```json'; cat "$RUNNER_TEMP/result/$f"; echo '```'; fi
            done
            if [[ -f "$RUNNER_TEMP/result/solver.log" ]]; then echo '### KaMIS'; echo '```text'; tail -n 40 "$RUNNER_TEMP/result/solver.log"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
