name: temp Thomson 960 hybrid-saddle higher branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-hybrid-branches.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        mode: [5, 6, 7]
        sign: [-1, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Download hybrid R-A saddle
        uses: actions/download-artifact@v4
        with:
          name: thomson-saddle-hybrid
          path: ${{ runner.temp }}/saddle
          github-token: ${{ github.token }}
          run-id: 40633736125
      - name: Search higher transverse exits
        run: |
          python3 science-boundary/thomson-960/code/search_saddle_transverse.py \
            "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/saddle/hybrid.json" \
            --transverse-mode ${{ matrix.mode }} --sign ${{ matrix.sign }} \
            --transverse-amps 0.004,0.008,0.014,0.022 \
            --reaction-amps=-0.0005,0,0.0005 \
            --out "$RUNNER_TEMP/result-m${{ matrix.mode }}-s${{ matrix.sign }}.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'result-m${{ matrix.mode }}-s${{ matrix.sign }}.json')
          d=json.load(open(p)); d.pop('best_points',None)
          print(json.dumps(d,indent=2))
          PY
      - name: Upload branch result
        uses: actions/upload-artifact@v4
        with:
          name: thomson-hybrid-branch-m${{ matrix.mode }}-s${{ matrix.sign }}
          path: ${{ runner.temp }}/result-m${{ matrix.mode }}-s${{ matrix.sign }}.json
          retention-days: 7
