name: temp-monalisa-all-quads
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/all_face_catalogue.py
      - science-boundary/mona-lisa-tsp/complete_face_repair.cpp
      - .github/workflows/temp-monalisa-all-quads.yml
permissions:
  contents: read
jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        start: [0, 1200, 2400, 3600, 4800, 6000, 7200, 8400, 9600, 10800, 12000, 13200]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact problem data and planar source
        run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          git clone --depth 1 https://github.com/bicobico2/ElimTSP.git elimtsp
          python -m pip install networkx
          python upstream/problems/p010-mona-lisa-tsp/verify/verify.py upstream/problems/p010-mona-lisa-tsp/baseline
          g++ -std=c++17 -O3 -march=x86-64 -Wall -Wextra science-boundary/mona-lisa-tsp/complete_face_repair.cpp -o /tmp/full-repair
      - name: Enumerate every alternating quadrilateral face
        run: |
          python science-boundary/mona-lisa-tsp/all_face_catalogue.py \
            --graph elimtsp/results/mona.248972.edg.gz \
            --tour upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --output-graph /tmp/mona-edges.txt \
            --output-faces /tmp/mona-faces.txt \
            --output-tour /tmp/mona-tour.txt \
            --report /tmp/all-faces-summary.json
      - name: Exhaustively reconnect both subtours anywhere in reduced graph
        run: |
          mkdir -p science-boundary/mona-lisa-tsp/results/full-face-${{ matrix.start }}
          /tmp/full-repair /tmp/mona-edges.txt /tmp/mona-faces.txt /tmp/mona-tour.txt \
            ${{ matrix.start }} 1200 \
            science-boundary/mona-lisa-tsp/results/full-face-${{ matrix.start }}/summary.json \
            science-boundary/mona-lisa-tsp/results/full-face-${{ matrix.start }}/neutrals.tsv \
            science-boundary/mona-lisa-tsp/results/full-face-${{ matrix.start }}/candidate-tour.txt
          cp /tmp/all-faces-summary.json science-boundary/mona-lisa-tsp/results/full-face-${{ matrix.start }}/catalogue-summary.json
          if test -s science-boundary/mona-lisa-tsp/results/full-face-${{ matrix.start }}/candidate-tour.txt; then
            python -c 'import json,sys; t=list(map(int,open(sys.argv[1]))); assert len(t)==100000 and len(set(t))==100000; json.dump({"tour":t},open(sys.argv[2],"w"),separators=(",",":"))' \
              science-boundary/mona-lisa-tsp/results/full-face-${{ matrix.start }}/candidate-tour.txt \
              science-boundary/mona-lisa-tsp/results/full-face-${{ matrix.start }}/certificate.json
            python upstream/problems/p010-mona-lisa-tsp/verify/verify.py science-boundary/mona-lisa-tsp/results/full-face-${{ matrix.start }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monalisa-all-faces-${{ matrix.start }}
          path: science-boundary/mona-lisa-tsp/results/full-face-${{ matrix.start }}/
          if-no-files-found: ignore
