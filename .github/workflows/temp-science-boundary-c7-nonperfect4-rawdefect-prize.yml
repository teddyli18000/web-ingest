name: Temp Science Boundary C7 nonperfect4 raw-defect prize

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-nonperfect4-rawdefect-prize.yml
      - science-boundary/shannon-capacity-c7/code/bpz_nonperfect4_rawdefect_prize.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-nonperfect4-rawdefect-prize
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Tan/BPZ source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          python3 -m pip install --disable-pip-version-check python-sat
      - name: Exact packed prize screen
        shell: bash
        env:
          OMP_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_nonperfect4_rawdefect_prize.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/status.json" --workers "$(nproc)" \
            > "$RUNNER_TEMP/result/solver.stdout" 2> "$RUNNER_TEMP/result/solver.stderr"
          cat "$RUNNER_TEMP/result/solver.stdout"
          tail -n 100 "$RUNNER_TEMP/result/solver.stderr"
          python3 - "$RUNNER_TEMP/result/status.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['connected_four_sets']==16166, r
          assert r['nonperfect_four_sets']==68, r
          assert r['rectangles']==340, r
          print('max_weak_gain',r['max_weak_gain'],'max_strong_witness_gain',r['max_strong_witness_gain'],'positive',len(r['positive_weak']))
          PY
      - name: Upload reproducibility bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-nonperfect4-rawdefect-prize
          path: ${{ runner.temp }}/result
          retention-days: 14
