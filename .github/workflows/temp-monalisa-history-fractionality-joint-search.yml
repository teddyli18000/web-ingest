name: temp-monalisa-history-fractionality-joint-search
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/compare_disagreement_lp_selectors.py
      - .github/workflows/temp-monalisa-history-fractionality-joint-search.yml
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        selector: [history, fraction, intersection, joint, random]
        budget: [192, 512]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch original official historical tour and LP data
        run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          python -m pip install numpy matplotlib networkx ortools
          mkdir -p /tmp/p010-source/tour /tmp/p010-source/lp
          root=https://www.math.uwaterloo.ca/tsp/data/ml
          for score in 5757199 5757200 5757203 5757204 5757205 5757241 5757245; do
            curl -fsSL --retry 3 --max-time 120 "$root/tour/monalisa_${score}.tour" -o "/tmp/p010-source/tour/monalisa_${score}.tour"
          done
          curl -fsSL --retry 3 --max-time 120 "$root/x/mona.6nsub.x" -o /tmp/p010-source/lp/mona.6nsub.x
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path('/tmp/p010-source/tour')
          tours={f'historic_{s}':str(t/f'monalisa_{s}.tour') for s in (5757199,5757200,5757203,5757204,5757205,5757241,5757245)}
          Path('/tmp/p010-source/tours.json').write_text(json.dumps(tours))
          PY
      - name: Matched edge-budget exact connected TSP and integer 2-factor comparison
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          dir=science-boundary/mona-lisa-tsp/results/joint-lp-${{ matrix.selector }}-${{ matrix.budget }}
          mkdir -p "$dir"
          python science-boundary/mona-lisa-tsp/compare_disagreement_lp_selectors.py \
            --baseline upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --tours /tmp/p010-source/tours.json \
            --lp /tmp/p010-source/lp/mona.6nsub.x \
            --selector ${{ matrix.selector }} --budget ${{ matrix.budget }} \
            --seconds 90 --workers 4 --seed 20261029 \
            --report "$dir/report.json" --certificate "$dir/certificate.json"
          if test -s "$dir/certificate.json"; then
            python upstream/problems/p010-mona-lisa-tsp/verify/verify.py "$dir"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monalisa-history-fraction-joint-${{ matrix.selector }}-${{ matrix.budget }}
          path: science-boundary/mona-lisa-tsp/results/joint-lp-${{ matrix.selector }}-${{ matrix.budget }}/
          if-no-files-found: ignore
