name: temp Thomson 960 composed global shears

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-composed-shears.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - id: sim01
            kind: simultaneous
            seq: "0,1"
          - id: sim012
            kind: simultaneous
            seq: "0,1,2"
          - id: seq01
            kind: sequential
            seq: "0,1"
          - id: seq02
            kind: sequential
            seq: "0,2"
          - id: seq012
            kind: sequential
            seq: "0,1,2"
          - id: seq021
            kind: sequential
            seq: "0,2,1"
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Compose C3-equivalent record-to-neighbor shear events
        run: |
          python3 science-boundary/thomson-960/code/search_composed_shears.py \
            "$RUNNER_TEMP/few-shots" \
            --neighbor-json science-boundary/thomson-960/data/neighbor-soft-003280.json \
            --kind ${{ matrix.kind }} --sequence '${{ matrix.seq }}' \
            --out "$RUNNER_TEMP/result-${{ matrix.id }}.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'result-${{ matrix.id }}.json')
          d=json.load(open(p)); d.pop('best_points',None)
          print(json.dumps(d,indent=2))
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: thomson-composed-${{ matrix.id }}
          path: ${{ runner.temp }}/result-${{ matrix.id }}.json
          retention-days: 7
