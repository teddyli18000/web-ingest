name: temp-aes-delete-alias-compensate
on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/delete_alias_compensate.py'
      - '.github/workflows/temp-aes-delete-alias-compensate.yml'
permissions:
  contents: read
jobs:
  coupled-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust a shard of paired deletion and repair
        run: |
          set -euxo pipefail
          python -m py_compile science-boundary/aes-sbox-circuit/delete_alias_compensate.py
          python science-boundary/aes-sbox-circuit/delete_alias_compensate.py \
            --source fs-101 --shard '${{ matrix.shard }}' --shards 8 --out result | tee run.log
          python -c "import json; d=json.load(open('result/summary.json')); assert d['status'] in ('exhausted','found'); print(d)"
      - name: Independent official Few Shots verifier for a candidate
        run: |
          set -euxo pipefail
          if [ -f result/candidate.json ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/p008shot
            cp result/candidate.json /tmp/p008shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/p008shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-delete-alias-compensate-${{ matrix.shard }}
          path: |
            result
            run.log
            official-verifier.jsonl
