name: temp-ta41-real-n7-hidden-positive
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-real-n7-hidden-positive.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-real-n7-hidden-positive
  cancel-in-progress: false
jobs:
  original-n7:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned AGPL N7 paper-author implementation and unchanged search engine
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/Qiming01/Job-Shop-Scheduling.git /tmp/n7
          git -C /tmp/n7 fetch --depth=1 origin 7e120ebada21cb604c871e0657814bf6e32611f8
          git -C /tmp/n7 checkout --detach 7e120ebada21cb604c871e0657814bf6e32611f8
          python3 science-boundary/job-shop-ta41/patch_original_n7_warmstart.py /tmp/n7
          python3 - <<'PY'
          from pathlib import Path
          p=Path('science-boundary/job-shop-ta41/original_n7_driver.cpp')
          text=p.read_text()
          assert text.count('if(solver.makespan()!=2006)')==1
          assert text.count('solver.makespan()<=2005')==1
          text=text.replace('if(solver.makespan()!=2006)','if(solver.makespan()<=0)')
          text=text.replace('solver.makespan()<=2005 || ','')
          text=text.replace('verified 2006 C++ DAG','verified general 30x20 initial machine-order DAG')
          Path('/tmp/positive_n7_driver.cpp').write_text(text)
          PY
          g++ -std=c++20 -O3 -include climits -DN7_WARMSTART_SUPPORT -I/tmp/n7/include \
            /tmp/positive_n7_driver.cpp /tmp/n7/src/graph.cpp /tmp/n7/src/instance.cpp \
            /tmp/n7/src/schedule.cpp /tmp/n7/src/tabu_search.cpp -o /tmp/n7_positive
          python3 -m py_compile science-boundary/job-shop-ta41/benchmark_true_n7_positive.py
      - name: Run original N7 tabu with exactly the same 24 hidden-answer starts
        run: |
          python3 science-boundary/job-shop-ta41/benchmark_true_n7_positive.py \
            --cases science-boundary/job-shop-ta41/positive-control-data \
            --driver /tmp/n7_positive --seconds 5 --seeds 4107 4113 \
            --out science-boundary/job-shop-ta41/results/positive-original-n7
      - name: Preserve independently verified original published N7 control
        if: always()
        run: |
          set -euo pipefail
          out='science-boundary/job-shop-ta41/results/positive-original-n7'
          if ! test -d "$out"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): genuine published N7 on same 24 hidden-answer controls'
          for attempt in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
