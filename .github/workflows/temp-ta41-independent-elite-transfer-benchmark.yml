name: temp-ta41-independent-elite-transfer-benchmark
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-independent-elite-transfer-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-independent-elite-transfer-benchmark
  cancel-in-progress: false
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        policy: [tabu, static3, dynamic3, true-n7]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate 12 independently constructed native N7 local optima are present
        run: |
          set -euo pipefail
          python3 -m py_compile science-boundary/job-shop-ta41/benchmark_hidden_positive.py
          python3 -m py_compile science-boundary/job-shop-ta41/benchmark_true_n7_positive.py
          test "$(find science-boundary/job-shop-ta41/positive-n7-elite-data -name start.txt | wc -l)" -eq 12
      - name: Compile real published author's N7 only for its own reference arm
        if: matrix.policy == 'true-n7'
        run: |
          git clone --depth=1 https://github.com/Qiming01/Job-Shop-Scheduling.git /tmp/n7
          git -C /tmp/n7 fetch --depth=1 origin 7e120ebada21cb604c871e0657814bf6e32611f8
          git -C /tmp/n7 checkout --detach 7e120ebada21cb604c871e0657814bf6e32611f8
          python3 science-boundary/job-shop-ta41/patch_original_n7_warmstart.py /tmp/n7
          g++ -std=c++20 -O3 -include climits -DN7_WARMSTART_SUPPORT -I/tmp/n7/include \
            science-boundary/job-shop-ta41/original_n7_blind_driver.cpp \
            /tmp/n7/src/graph.cpp /tmp/n7/src/instance.cpp /tmp/n7/src/schedule.cpp /tmp/n7/src/tabu_search.cpp \
            -o /tmp/n7_true_blind
      - name: Evaluate three coordinated/search baselines with identical 350k exact DAG scores per trial
        if: matrix.policy != 'true-n7'
        run: |
          python3 science-boundary/job-shop-ta41/benchmark_hidden_positive.py \
            --cases science-boundary/job-shop-ta41/positive-n7-elite-data \
            --policy '${{ matrix.policy }}' --evaluations 350000 --seeds 4107 4113 \
            --out 'science-boundary/job-shop-ta41/results/positive-independent-${{ matrix.policy }}'
      - name: Evaluate published true N7 with exactly the same independent elite starts at 5 sec each
        if: matrix.policy == 'true-n7'
        run: |
          python3 science-boundary/job-shop-ta41/benchmark_true_n7_positive.py \
            --cases science-boundary/job-shop-ta41/positive-n7-elite-data \
            --driver /tmp/n7_true_blind --seconds 5 --seeds 4107 4113 \
            --out science-boundary/job-shop-ta41/results/positive-independent-true-n7
      - name: Persist complete independently validated constructive results and checkpoint failures
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/positive-independent-${{ matrix.policy }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): blind independent N7 elite cross-basin transfer ${{ matrix.policy }}'
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
