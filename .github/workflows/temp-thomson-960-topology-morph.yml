name: temp Thomson 960 topology morph

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-topology-morph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  morph:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [5011, 5027]
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Geodesic morph from merged D2 topology to live record
        run: |
          python3 science-boundary/thomson-960/code/search_topology_morph.py \
            "$RUNNER_TEMP/few-shots" --seed ${{ matrix.seed }} \
            --out "$RUNNER_TEMP/morph-${{ matrix.seed }}.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'morph-${{ matrix.seed }}.json')
          d=json.load(open(p)); d.pop('best_points',None)
          print(json.dumps(d,indent=2))
          PY
      - name: Upload morph result
        uses: actions/upload-artifact@v4
        with:
          name: thomson-morph-${{ matrix.seed }}
          path: ${{ runner.temp }}/morph-${{ matrix.seed }}.json
          retention-days: 7
