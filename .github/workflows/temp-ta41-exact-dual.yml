name: temp-ta41-exact-dual
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/core_dual_proof.py'
      - '.github/workflows/temp-ta41-exact-dual.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-exact-dual
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install dual LP backend
        run: python -m pip install 'ortools==9.14.6206'
      - name: Solve core packing and verify exact rational dual certificate
        run: |
          python3 science-boundary/job-shop-ta41/core_dual_proof.py
      - name: Save audit-ready dual evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/core-dual.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): validate exact rational core packing bound'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
