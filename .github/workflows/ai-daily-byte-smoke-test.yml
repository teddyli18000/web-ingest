name: AI Daily - Byte Mirror Smoke Test

on:
  push:
    paths:
      - ".github/workflows/ai-daily-byte-smoke-test.yml"

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch through collector
        run: |
          python ai-daily/fetch_aihot_daily.py \
            --date 2026-08-30 \
            --attempts 1

      - name: Fetch source independently and compare bytes
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/json" \
            -A "web-ingest/1.0 (+https://github.com/teddyli18000/web-ingest)" \
            "https://aihot.virxact.com/api/v1/dailies/2026-08-30" \
            -o /tmp/aihot-source.json

          cmp /tmp/aihot-source.json ai-daily/data/2026/08/30/aihot-daily.json
          sha256sum /tmp/aihot-source.json ai-daily/data/2026/08/30/aihot-daily.json

      - name: Commit verified byte mirror
        run: |
          git add ai-daily/data/2026/08/30/aihot-daily.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ai-daily): store verified byte-identical mirror"
          git push
