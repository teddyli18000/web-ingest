name: Google Trending - GitHub mirror backfill

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-trending-github-mirror-backfill.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: google-trending-github-mirror-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository and mirror importer
        run: |
          python3 tools/check-repository-integrity.py --show
          python3 -m py_compile google-trending/*.py tools/tmp/google-trending-github-mirror-backfill.py
          python3 -m unittest discover -s google-trending/tests -v

      - name: Mirror missing historical region snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/tmp/google-trending-github-mirror-backfill.py

      - name: Validate archive and refresh dashboard
        run: |
          python3 google-trending/validate_archive.py
          python3 google-trending/render_readme.py

      - name: Commit mirrored history in archive-sized chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for year in 2024 2025 2026; do
            if [ -d "google-trending/data/$year" ]; then
              git add "google-trending/data/$year"
              if ! git diff --cached --quiet; then
                git commit -m "data(google-trending): mirror missing $year history"
              fi
            fi
          done

          git add google-trending/mirror-manifest.json google-trending/README.md tools/reports/google-trending-mirror-backfill-2026-09-01.md
          rm -f tools/tmp/google-trending-github-mirror-backfill.py
          rm -f .github/workflows/google-trending-github-mirror-backfill.yml
          git add -A tools/tmp .github/workflows/google-trending-github-mirror-backfill.yml

          if ! git diff --cached --quiet; then
            git commit -m "chore(google-trending): finalize GitHub mirror backfill"
          fi

          git pull --rebase origin main
          git push origin HEAD:main
