name: Temp GPT MV final check

on:
  push:
    paths:
      - "temp-work/gpt-mv-reboot/hero/render.py"
      - "temp-work/gpt-mv-reboot/hero/render_v2.py"
      - "temp-work/gpt-mv-reboot/hero/sequence.py"
      - "temp-work/gpt-mv-reboot/hero/requirements.txt"
      - ".github/workflows/temp-gpt-mv-final-check.yml"
  workflow_dispatch:

concurrency:
  group: temp-gpt-mv-final-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check -r temp-work/gpt-mv-reboot/hero/requirements.txt
      - name: Render final deterministic fixture sequence
        run: |
          python temp-work/gpt-mv-reboot/hero/sequence.py \
            --fixtures --width 640 --height 360 --fps 12 \
            --out temp-work/gpt-mv-reboot/out/hero/gpt_sequence_final_check.mp4
      - name: Validate media and motion
        run: |
          set -euo pipefail
          out=temp-work/gpt-mv-reboot/out/hero/gpt_sequence_final_check.mp4
          ffmpeg -v error -i "$out" -f null -
          meta="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=nw=1 "$out")"
          printf '%s\n' "$meta"
          grep -q '^width=640$' <<<"$meta"
          grep -q '^height=360$' <<<"$meta"
          grep -q '^r_frame_rate=12/1$' <<<"$meta"
          python - <<'PY'
          import json, subprocess
          p='temp-work/gpt-mv-reboot/out/hero/gpt_sequence_final_check.mp4'
          d=float(json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',p]))['format']['duration'])
          assert 53.9 <= d <= 54.1, d
          print('duration_ok', d)
          PY
          ffmpeg -hide_banner -i "$out" -vf "freezedetect=n=0.0005:d=1.2,blackdetect=d=0.35:pix_th=0.02" -an -f null - 2>sanity.log || true
          ! grep -q 'freeze_duration' sanity.log
          ! grep -q 'black_duration' sanity.log
