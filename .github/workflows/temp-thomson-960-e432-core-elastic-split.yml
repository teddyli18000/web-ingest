name: temp Thomson 960 e432 core-elastic split

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-e432-core-elastic-split.yml'

jobs:
  split:
    strategy:
      fail-fast: false
      matrix:
        shell: [0, 1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Split short-scar core and elastic field
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          python3 science-boundary/thomson-960/code/search_scar_core_elastic_split.py \
            "$RUNNER_TEMP/seed/e432.json" "$RUNNER_TEMP/seed/B-natural.json" \
            --shells '${{ matrix.shell }}' --core-scales 0.45,0.75,1.0,1.25,1.6 \
            --far-scales 0,0.35,0.7,1.0,1.3 --decay 1.0 --maxiter 3400 \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('CORE',d['core_vertices'],d['core_degrees'],'REACTION_RMS',d['reaction_rms'])
          print('BEST',d['best_energy'],'DELTA',d['best_delta_live'])
          for b in d['distinct_low_basins'][:16]: print('BASIN',b['energy'],b['delta_live'],b['coord_counts'],'shell',b['shell'],'core',b['core_scale'],'far',b['far_scale'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e432-core-elastic-shell${{ matrix.shell }}
          path: ${{ runner.temp }}/out
          retention-days: 10
