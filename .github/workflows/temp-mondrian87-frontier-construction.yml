name: temp-mondrian87-frontier-construction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-mondrian87-frontier-construction.yml'
      - 'science-boundary/mondrian-87/frontier.cpp'

permissions:
  contents: read

concurrency:
  group: temp-mondrian87-frontier-construction
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: 101, k: 19, low: 388, high: 392}
          - {seed: 103, k: 19, low: 388, high: 392}
          - {seed: 107, k: 20, low: 368, high: 372}
          - {seed: 109, k: 21, low: 351, high: 352}
          - {seed: 113, k: 22, low: 334, high: 336}
          - {seed: 127, k: 23, low: 319, high: 322}
          - {seed: 131, k: 25, low: 293, high: 295}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Build independent complete-tiling constructor
        run: |
          g++ -O3 -std=c++20 science-boundary/mondrian-87/frontier.cpp -o /tmp/frontier
      - name: Construct defect at most 17
        run: |
          set +e
          /tmp/frontier ${{ matrix.seed }} ${{ matrix.k }} ${{ matrix.low }} ${{ matrix.high }} 90 50000000 | tee search.log
          code=${PIPESTATUS[0]}
          test "$code" -le 1
      - name: Verify candidate with the official verifier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lines=Path('search.log').read_text().splitlines()
          if lines and lines[0].startswith('FOUND'):
              rects=[list(map(int,token.split(','))) for token in lines[1].split()]
              Path('found').mkdir(exist_ok=True)
              Path('found/certificate.json').write_text(json.dumps({'rectangles':rects}))
          PY
          if test -f found/certificate.json; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            python /tmp/few-shots/problems/p016-mondrian-87/verify/verify.py found
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mondrian87-frontier-${{ matrix.seed }}-${{ matrix.k }}
          path: |
            search.log
            found/
