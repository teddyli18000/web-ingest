name: Temp Science Boundary C7 terminal-pair shared blockers

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-terminal-pair-shared-blockers.yml
      - science-boundary/shannon-capacity-c7/code/bpz_terminal_pair_shared_blockers.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Tan/BPZ source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
      - name: Exact shared-blocker interface audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_terminal_pair_shared_blockers.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/status.json" \
            > "$RUNNER_TEMP/result/stdout" 2> "$RUNNER_TEMP/result/stderr"
          cat "$RUNNER_TEMP/result/stdout"
          tail -n 100 "$RUNNER_TEMP/result/stderr"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-terminal-pair-shared-blockers
          path: ${{ runner.temp }}/result
          retention-days: 14
