name: Temp Science Boundary C7 support clique-cover gap census

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-support-clique-gap.yml
      - science-boundary/shannon-capacity-c7/code/bpz_support_clique_cover_gap_census.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-support-clique-gap
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Tan/BPZ source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
      - name: Exact k5 self-check and k6 gap census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_support_clique_cover_gap_census.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/k5.json" --k 5 --workers "$(nproc)" \
            > "$RUNNER_TEMP/result/k5.stdout" 2> "$RUNNER_TEMP/result/k5.stderr"
          cat "$RUNNER_TEMP/result/k5.stdout"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_support_clique_cover_gap_census.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/k6.json" --k 6 --workers "$(nproc)" \
            > "$RUNNER_TEMP/result/k6.stdout" 2> "$RUNNER_TEMP/result/k6.stderr"
          cat "$RUNNER_TEMP/result/k6.stdout"
          tail -n 100 "$RUNNER_TEMP/result/k6.stderr"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-support-clique-cover-gap
          path: ${{ runner.temp }}/result
          retention-days: 14
