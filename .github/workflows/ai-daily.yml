name: AI Daily - AIHOT

on:
  schedule:
    # Primary publication window. The goal is to have the complete snapshot on main before
    # the downstream GPT automation's first 08:15 local check.
    # Local times are Asia/Singapore / Beijing (UTC+8).
    - cron: "51 23 * * *" # 07:51 local on the following calendar day
    - cron: "57 23 * * *" # 07:57 local on the following calendar day
    - cron: "3 0 * * *"   # 08:03
    - cron: "9 0 * * *"   # 08:09
    - cron: "13 0 * * *"  # 08:13
    # Recovery slots only while the downstream GPT automation is still retrying.
    - cron: "29 0 * * *"  # 08:29
    - cron: "3 1 * * *"   # 09:03
    - cron: "11 2 * * *"  # 10:11
    - cron: "27 3 * * *"  # 11:27
  workflow_dispatch:
    inputs:
      date:
        description: "Optional Beijing date to backfill (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ai-daily-aihot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          # A scheduled event can sit in GitHub's queue for a long time. Always read the
          # latest main at job start so a delayed retry sees snapshots written by an earlier slot.
          ref: main
          fetch-depth: 0

      - name: Check whether the scheduled snapshot already exists
        id: snapshot
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$TARGET_DATE" ]; then
            day="$TARGET_DATE"
          else
            day="$(TZ=Asia/Shanghai date +%F)"
          fi

          year="${day:0:4}"
          month="${day:5:2}"
          date_part="${day:8:2}"
          dir="ai-daily/data/$year/$month/$date_part"

          present=false
          if [ "$EVENT_NAME" = "schedule" ] \
             && [ -f "$dir/aihot-daily.json" ] \
             && [ -f "$dir/aihot-daily.html" ]; then
            present=true
          fi

          echo "date=$day" >> "$GITHUB_OUTPUT"
          echo "present=$present" >> "$GITHUB_OUTPUT"
          if [ "$present" = "true" ]; then
            echo "AIHOT snapshot for $day already exists; this delayed/recovery slot is a no-op."
          fi

      - name: Fetch AIHOT daily
        if: steps.snapshot.outputs.present != 'true'
        id: fetch
        env:
          TARGET_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$TARGET_DATE" ]; then
            python3 ai-daily/fetch_aihot_daily.py \
              --date "$TARGET_DATE" \
              --attempts 1
            exit 0
          fi

          local_hm="$(TZ=Asia/Shanghai date +%H%M)"
          if [[ "$local_hm" < "0815" ]]; then
            # Publication race window: keep a runner warm and re-check every 10 seconds so
            # the first downstream 08:15 check normally sees a committed complete snapshot.
            attempts=70
            retry_seconds=10
          else
            # Once the first consumer check has passed, use only short bounded recovery attempts.
            attempts=5
            retry_seconds=30
          fi

          echo "AIHOT fetch mode: local=$local_hm attempts=$attempts retry=${retry_seconds}s"
          python3 ai-daily/fetch_aihot_daily.py \
            --attempts "$attempts" \
            --retry-seconds "$retry_seconds"

      - name: Commit snapshot
        if: steps.snapshot.outputs.present != 'true'
        run: |
          set -euo pipefail
          git add ai-daily/data
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(ai-daily): mirror AIHOT daily ${{ steps.fetch.outputs.report_date }}"
          git pull --rebase origin main
          git push origin HEAD:main
