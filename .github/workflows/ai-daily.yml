name: AI Daily - AIHOT recovery

on:
  schedule:
    # Short recovery opportunities immediately before useful downstream retries.
    # Local times are Asia/Singapore / Beijing (UTC+8).
    - cron: "13 1 * * *"  # 09:13, before the 09:15 consumer retry
    - cron: "13 2 * * *"  # 10:13, before the 10:15 consumer retry
    - cron: "13 3 * * *"  # 11:13, before the 11:15 consumer retry
    - cron: "37 3 * * *"  # 11:37, final chance before the 12:15 consumer retry
  workflow_dispatch:
    inputs:
      date:
        description: "Optional Beijing date to backfill (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ai-daily-aihot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record schedule timing
        if: github.event_name == 'schedule'
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### AI Daily recovery timing"
            echo
            echo "- cron: \`${SCHEDULE_EXPR}\`"
            echo "- runner observed: $(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether the snapshot already exists
        id: snapshot
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$TARGET_DATE" ]; then
            day="$TARGET_DATE"
          else
            day="$(TZ=Asia/Shanghai date +%F)"
          fi

          year="${day:0:4}"
          month="${day:5:2}"
          date_part="${day:8:2}"
          dir="ai-daily/data/$year/$month/$date_part"

          present=false
          if [ "$EVENT_NAME" = "schedule" ] \
             && [ -f "$dir/aihot-daily.json" ] \
             && [ -f "$dir/aihot-daily.html" ]; then
            present=true
          fi

          echo "date=$day" >> "$GITHUB_OUTPUT"
          echo "present=$present" >> "$GITHUB_OUTPUT"
          if [ "$present" = "true" ]; then
            echo "AIHOT snapshot for $day already exists; recovery is a no-op."
          fi

      - name: Fetch AIHOT daily
        if: steps.snapshot.outputs.present != 'true'
        id: fetch
        env:
          TARGET_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$TARGET_DATE" ]; then
            python3 ai-daily/fetch_aihot_daily.py \
              --date "$TARGET_DATE" \
              --attempts 1 \
              --request-timeout 15
            exit 0
          fi

          attempts=2
          retry_seconds=10
          echo "AIHOT fetch mode: short recovery attempts=$attempts retry=${retry_seconds}s timeout=10s"
          python3 ai-daily/fetch_aihot_daily.py \
            --attempts "$attempts" \
            --retry-seconds "$retry_seconds" \
            --request-timeout 10

      - name: Commit snapshot
        if: steps.snapshot.outputs.present != 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          git add ai-daily/data
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(ai-daily): mirror AIHOT daily ${{ steps.fetch.outputs.report_date }}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Github_test AI Daily Bot 1
        if: github.event_name == 'schedule' && (steps.commit.outputs.pushed == 'true' || (github.run_attempt > 1 && steps.snapshot.outputs.present == 'true'))
        env:
          AI_DAILY_DISPATCH_TOKEN: ${{ secrets.AI_DAILY_DISPATCH_TOKEN }}
          REPORT_DATE: ${{ steps.fetch.outputs.report_date || steps.snapshot.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ai-daily/trigger_github_test_archive.py --date "$REPORT_DATE"
