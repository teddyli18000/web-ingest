name: AI Daily - AIHOT

on:
  schedule:
    # 08:05 Beijing time (UTC+8). AIHOT normally publishes at 08:00.
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional Beijing date to backfill (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ai-daily-aihot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch AIHOT daily
        id: fetch
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python ai-daily/fetch_aihot_daily.py \
              --date "$TARGET_DATE" \
              --attempts 1
          else
            python ai-daily/fetch_aihot_daily.py \
              --attempts 12 \
              --retry-seconds 300
          fi

      - name: Commit snapshot
        run: |
          git add ai-daily/data
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(ai-daily): mirror AIHOT daily ${{ steps.fetch.outputs.report_date }}"
          git push
