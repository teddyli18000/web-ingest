name: temp-aes-temporal-window-sweep

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-aes-temporal-window-sweep.yml'

permissions:
  contents: read

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate overlapping temporal windows for this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euxo pipefail
          python - <<'PY' > windows.txt
          import os,sys
          sys.path.insert(0,'science-boundary/aes-sbox-circuit')
          import released_and_skeleton as ras
          import temporal_window_resynth as tw
          c=ras.load_circuit('fs-101')
          s=tw.original_schedule(c)
          shard=int(os.environ['SHARD']); rows=[]
          for start in range(len(s)):
              for span in range(0,7):
                  end=start+span
                  if end>=len(s): continue
                  linear=sum(s[start:end+1])
                  if linear < 3 or linear > 14: continue
                  # prioritize genuinely cross-boundary windows but retain pure intervals
                  rows.append((start,end,linear,span))
          rows.sort(key=lambda x:(x[2],x[3],x[0]))
          for i,(a,b,n,span) in enumerate(rows):
              if i%8==shard: print(a,b,n,span)
          print(f'# total={len(rows)} shard={shard}',file=sys.stderr)
          PY
          cat windows.txt
      - name: Search each window at one fewer linear gate
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p results logs
          run_one() {
            a="$1"; b="$2"; n="$3"; span="$4"
            tag="s${a}-e${b}-l${n}-a${span}"
            python science-boundary/aes-sbox-circuit/temporal_window_resynth.py \
              --family fs-101 --start "$a" --end "$b" --delta 1 \
              --beam 360 --max-candidates 48 --restarts 3 --seed 101 \
              --out "results/$tag" > "logs/$tag.log" 2>&1
          }
          export -f run_one
          grep -v '^#' windows.txt | xargs -r -n4 -P4 bash -c 'run_one "$0" "$1" "$2" "$3"'
          grep -h '"status"' logs/*.log || true
      - name: Aggregate, independently verify, and retain best candidate
        run: |
          set -euxo pipefail
          python - <<'PY'
          import glob,json,pathlib,shutil,sys
          sys.path.insert(0,'science-boundary/aes-sbox-circuit')
          import released_and_skeleton as ras
          rows=[]; candidates=[]
          for sf in glob.glob('results/*/summary.json'):
              s=json.load(open(sf)); rows.append(s)
              cf=str(pathlib.Path(sf).with_name('candidate.json'))
              if pathlib.Path(cf).exists():
                  c=json.load(open(cf)); assert ras.independent_check(c)[0],cf
                  candidates.append((len(c['gates']),cf,s))
          rows.sort(key=lambda r:(r['start'],r['end']))
          candidates.sort(key=lambda x:(x[0],x[1]))
          agg={'shard':${{ matrix.shard }},'tested':len(rows),
               'found':sum(r['status']=='found' for r in rows),
               'best_gates':candidates[0][0] if candidates else None,
               'generated_states':sum(r.get('generated',0) for r in rows),
               'windows':[{'start':r['start'],'end':r['end'],'linear':r['orig_linear'],
                           'status':r['status'],'generated':r.get('generated',0)} for r in rows]}
          json.dump(agg,open('aggregate.json','w'),indent=2)
          if candidates:
              shutil.copy2(candidates[0][1],'best-candidate.json')
          print(json.dumps({k:v for k,v in agg.items() if k!='windows'}))
          PY
      - name: Official verifier if a <=100 candidate exists
        run: |
          set -euxo pipefail
          if [ -f best-candidate.json ] && [ "$(python -c "import json; print(len(json.load(open('best-candidate.json'))['gates']))")" -le 100 ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/shot
            cp best-candidate.json /tmp/shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-temporal-window-sweep-${{ matrix.shard }}
          path: |
            windows.txt
            aggregate.json
            best-candidate.json
            official-verifier.jsonl
            results/*/summary.json
