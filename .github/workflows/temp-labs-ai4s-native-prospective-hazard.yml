name: temp-labs-ai4s-native-prospective-hazard
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-native-prospective-hazard.yml
      - science-boundary/labs-ai4s-search/trajectory_20261104/prospective_hazard.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hazard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Prospective nonleaking native solver hazard from all accepted snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q numpy pandas scikit-learn
          cd science-boundary/labs-ai4s-search/trajectory_20261104
          for spec in 8-16 16-32 32-64 64-64; do
            stall="${spec%-*}"; horizon="${spec#*-}"
            python3 prospective_hazard.py results/native_mini_v1 \
              --out "results/native_hazard_${spec}" --horizon "$horizon" --stall "$stall"
          done
      - name: Verify observed horizon coverage and all 12 source-run strata
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/trajectory_20261104
          python3 - <<'PY'
          import json,gzip,csv,pathlib
          for spec in ('8-16','16-32','32-64','64-64'):
            root=pathlib.Path('results')/('native_hazard_'+spec)
            s=json.loads((root/'prospective_hazard.json').read_text())
            if s['all_rows']==0:
              print(spec,'NO ELIGIBLE SAMPLE; scientific coverage failure')
              continue
            with gzip.open(root/'prospective_hazard_samples.tsv.gz','rt') as f:
              records=list(csv.DictReader(f,delimiter='\t'))
            assert len(records)==s['all_rows']
            assert len(s['by_run'])==12
            assert all(int(z['stall_age'])>=int(spec.split('-')[0]) for z in records)
            assert all(int(z['positive']) in (0,1) for z in records)
            print('VERIFIED',spec,'n=',len(records),'pos=',sum(int(z['positive']) for z in records))
          PY
      - name: Commit independent audited hazard evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/trajectory_20261104/results/native_hazard_*/
          git commit -m 'research(labs-ai4s): validate truly prospective native-Tabu stalled improvement hazard'
          git pull --rebase origin main
          git push origin HEAD:main
