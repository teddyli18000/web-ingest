name: Temp Science Boundary C7 BPZ t9 orientation diagnostic
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-bpz-t9-orientation-diag.yml
      - science-boundary/shannon-capacity-c7/code/bpz_t9_orientation_diag.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temp-science-boundary-c7-bpz-t9-orientation-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned BPZ/Tan source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
      - name: Exhaust 512 orientations for each nine-private state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          python3 science-boundary/shannon-capacity-c7/code/bpz_t9_orientation_diag.py "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/status.json"
          cat "$RUNNER_TEMP/result/status.json"
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: c7-bpz-t9-orientation-diag
          path: ${{ runner.temp }}/result/status.json
          retention-days: 14
      - name: Summarize
        shell: bash
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/result/status.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
