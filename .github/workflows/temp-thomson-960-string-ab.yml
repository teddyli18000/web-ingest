name: temp Thomson 960 A-B spherical string

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-string-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  string:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Reproduce basin B from durable A
        run: |
          python3 science-boundary/thomson-960/code/harvest_basin_b.py \
            science-boundary/thomson-960/data/neighbor-soft-003280.json \
            --mode 2 --sign -1 --amp 0.012 \
            --out "$RUNNER_TEMP/basin-b.json"
      - name: Optimize A-B spherical string
        run: |
          python3 science-boundary/thomson-960/code/string_between_seeds.py \
            science-boundary/thomson-960/data/neighbor-soft-003280.json \
            "$RUNNER_TEMP/basin-b.json" \
            --images 7 --iterations 160 --climb-iterations 120 \
            --eta 0.00025 --max-step 0.0007 \
            --out "$RUNNER_TEMP/string-ab.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'string-ab.json')
          d=json.load(open(p)); d.pop('saddle_points',None)
          print(json.dumps(d,indent=2))
          PY
      - name: Upload A-B string result
        uses: actions/upload-artifact@v4
        with:
          name: thomson-string-ab
          path: ${{ runner.temp }}/string-ab.json
          retention-days: 7
