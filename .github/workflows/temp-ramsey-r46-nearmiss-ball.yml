name: Temp Ramsey R46 near-miss Hamming balls

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-nearmiss-ball
  cancel-in-progress: false

jobs:
  solve:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        radius: [1, 2, 3, 4, 5, 6, 8, 10]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PySAT
        run: python -m pip install --disable-pip-version-check python-sat

      - name: Solve exact labelled Hamming ball
        id: solve
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/r46
          set +e
          timeout --signal=TERM --kill-after=30s 4800 \
            python science-boundary/ramsey-r46/lazy_ball36.py \
              --seed-graph science-boundary/ramsey-r46/results/algorithm22-calibration-best-14.json \
              --radius '${{ matrix.radius }}' \
              --solver cadical195 \
              --output /tmp/r46/candidate.json \
              --summary /tmp/r46/summary.json \
            | tee /tmp/r46/search.log
          rc=${PIPESTATUS[0]}
          set -e
          case "$rc" in
            0) status=SAT ;;
            20) status=UNSAT ;;
            30) status=ITERATION_LIMIT ;;
            124|137|143) status=TIMEOUT ;;
            *) status=ERROR ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "solver_exit=$rc" >> "$GITHUB_OUTPUT"
          if [[ ! -f /tmp/r46/summary.json ]]; then
            printf '{"radius":%s,"status":"%s","solver_exit":%s,"github_run_id":"%s"}\n' \
              '${{ matrix.radius }}' "$status" "$rc" "$GITHUB_RUN_ID" > /tmp/r46/summary.json
          else
            python3 - /tmp/r46/summary.json "$status" "$rc" <<'PY'
          import json, os, sys
          p,status,rc=sys.argv[1:]
          d=json.load(open(p))
          d['workflow_status']=status
          d['solver_exit']=int(rc)
          d['github_run_id']=os.environ['GITHUB_RUN_ID']
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          fi
          cat /tmp/r46/summary.json
          [[ "$status" != ERROR ]]

      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate
          cp /tmp/r46/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/few-shots-verify.json
          python3 - /tmp/r46/few-shots-verify.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('valid') is True and d.get('score') == '36', d
          PY

      - name: Upload radius result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-nearmiss-ball-r${{ matrix.radius }}
          path: /tmp/r46
          if-no-files-found: warn
          retention-days: 7

  collect:
    if: always()
    needs: solve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download radius results
        uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-nearmiss-ball-r*
          path: /tmp/balls
      - name: Aggregate
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 - /tmp/balls /tmp/r46/summary.json <<'PY'
          import json, os, pathlib, shutil, sys
          root,out=map(pathlib.Path,sys.argv[1:])
          rows=[]; hit=None
          for p in root.rglob('summary.json'):
              d=json.load(open(p))
              d['_dir']=str(p.parent)
              rows.append(d)
              if d.get('status')=='SAT' or d.get('workflow_status')=='SAT':
                  hit=d
          rows.sort(key=lambda d:d['radius'])
          result={'campaign':'exact-hamming-balls-around-algorithm22-nearmiss-14',
                  'run_id':os.environ['GITHUB_RUN_ID'],
                  'radii_completed':[d['radius'] for d in rows],
                  'results':[{k:v for k,v in d.items() if k!='_dir'} for d in rows],
                  'found':hit is not None}
          if hit:
              cert=pathlib.Path(hit['_dir'])/'candidate.json'
              shutil.copyfile(cert,'/tmp/r46/candidate.json')
              verify=pathlib.Path(hit['_dir'])/'few-shots-verify.json'
              if verify.exists(): shutil.copyfile(verify,'/tmp/r46/few-shots-verify.json')
              result['hit_radius']=hit['radius']
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='results'},sort_keys=True))
          PY
      - name: Persist exact ball results
        shell: bash
        run: |
          set -euo pipefail
          dest=science-boundary/ramsey-r46/results
          cp /tmp/r46/summary.json "$dest/nearmiss-14-hamming-balls.json"
          if [[ -f /tmp/r46/candidate.json ]]; then
            cp /tmp/r46/candidate.json "$dest/nearmiss-14-hamming-ball-hit.json"
          fi
          if [[ -f /tmp/r46/few-shots-verify.json ]]; then
            cp /tmp/r46/few-shots-verify.json "$dest/nearmiss-14-hamming-ball-hit-verify.json"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$dest"
          git commit -m 'ramsey-r46: record exact near-miss Hamming-ball sweep' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 4))
          done
          exit 1
      - name: Upload campaign aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-nearmiss-ball-aggregate
          path: /tmp/r46
          if-no-files-found: warn
          retention-days: 7
