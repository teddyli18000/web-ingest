name: temp-ta41-three-job-global-reinsertion
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/triple_job_ejection.py'
      - '.github/workflows/temp-ta41-three-job-global-reinsertion.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-three-job-global-reinsertion
  cancel-in-progress: false
jobs:
  explore:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned OR-Tools
        run: python -m pip install 'ortools==9.14.6206'
      - name: Search diverse exact globally reinserted job triples
        run: |
          python3 science-boundary/job-shop-ta41/triple_job_ejection.py --count 200 --shard '${{ matrix.shard }}' --shards 5 --per-case-seconds 4 --total-seconds 540 --out 'science-boundary/job-shop-ta41/results/triples-${{ matrix.shard }}'
      - name: Verify any improved certificate using Few Shots official verifier
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/triples-${{ matrix.shard }}"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist reproducible experimental outcomes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'science-boundary/job-shop-ta41/results/triples-${{ matrix.shard }}/'
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): search diverse globally coupled 3-job cohorts ${{ matrix.shard }}'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
