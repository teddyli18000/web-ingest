name: temp p004 constructive independent row-column auxiliaries
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7p004-two-aux.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: temp-c7p004-two-aux
  cancel-in-progress: false
jobs:
  construct:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {left: neutral14a, right: neutral14a, row: port12a, column: port12b, l: 9, r: 9}
          - {left: neutral14b, right: neutral14b, row: port12b, column: port12a, l: 9, r: 9}
          - {left: neutral14a, right: neutral14b, row: neutral14a, column: neutral14b, l: 9, r: 10}
          - {left: neutral14b, right: neutral14a, row: neutral14b, column: neutral14a, l: 10, r: 11}
          - {left: neutral14a, right: neutral14b, row: port12b, column: port12a, l: 11, r: 12}
          - {left: neutral14b, right: neutral14a, row: port12a, column: port12b, l: 12, r: 14}
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3' 'ortools>=9.11,<10'
      - name: Recover immutable public 367-word auxiliary sources
        run: |
          mkdir -p /tmp/c7-two-aux/aux /tmp/c7-two-aux/a /tmp/c7-two-aux/b
          gh run download 42024771296 --repo "${{ github.repository }}" --name c7-port-walk-2026110552 --dir /tmp/c7-two-aux/a
          gh run download 42024771296 --repo "${{ github.repository }}" --name c7-port-walk-2026110554 --dir /tmp/c7-two-aux/b
          cp /tmp/c7-two-aux/a/best_private367.ids /tmp/c7-two-aux/aux/port12a.ids
          cp /tmp/c7-two-aux/b/best_private367.ids /tmp/c7-two-aux/aux/port12b.ids
      - name: Jointly construct with independent row and column five-dimensional auxiliaries
        run: |
          python science-boundary/shannon-capacity-c7/code/c7p004_two_aux_fibers_construct.py \
            science-boundary/shannon-capacity-c7/data/circular-neutral-high-port-p004.json \
            /tmp/c7-two-aux/aux /tmp/c7-two-aux/results \
            --left "${{ matrix.left }}" --right "${{ matrix.right }}" \
            --row "${{ matrix.row }}" --column "${{ matrix.column }}" \
            --l "${{ matrix.l }}" --r "${{ matrix.r }}" \
            --seconds 200 --workers 4
      - name: Authoritative p004 verifier on constructed breakthrough
        run: |
          if test -s /tmp/c7-two-aux/results/certificate.json; then
            git clone --quiet --depth 1 https://github.com/few-shots/few-shots.git /tmp/fewshots
            python /tmp/fewshots/problems/p004-shannon-capacity-c7/verify/verify.py /tmp/c7-two-aux/results
          else
            echo 'No >134753 candidate from this two-auxiliary combination.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7-two-aux-${{ matrix.left }}-${{ matrix.right }}-${{ matrix.row }}-${{ matrix.column }}
          path: |
            /tmp/c7-two-aux/results/status.json
            /tmp/c7-two-aux/results/certificate.json
          retention-days: 14
