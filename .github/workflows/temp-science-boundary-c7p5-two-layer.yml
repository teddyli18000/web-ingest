name: temp C7p5 exact two-layer MIS repair
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7p5-two-layer.yml
      - science-boundary/shannon-capacity-c7/code/c7p5_two_layer_repair.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temp-c7p5-two-layer
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [I0, X]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MILP packages
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Fetch immutable public BPZ data
        run: |
          git init --quiet /tmp/c7-tandon
          git -C /tmp/c7-tandon fetch --quiet --depth 1 https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git c753408492dde92a239708986d16c15dbf6c3235
          git -C /tmp/c7-tandon checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-tandon rev-parse HEAD)" = c753408492dde92a239708986d16c15dbf6c3235
      - name: Solve exact reoptimization of adjacent layer pairs
        run: |
          mkdir -p /tmp/c7-p004
          python science-boundary/shannon-capacity-c7/code/c7p5_two_layer_repair.py \
            /tmp/c7-tandon/data/base_c7.json /tmp/c7-p004/status.json /tmp/c7-p004/certificate.json \
            --seed-name "${{ matrix.seed }}" --sweeps 2 --seconds 5
      - name: Verify any record candidate with upstream p004 judge
        run: |
          if test -s /tmp/c7-p004/certificate.json; then
            git clone --quiet --depth 1 https://github.com/few-shots/few-shots.git /tmp/c7-fewshots
            mkdir -p /tmp/c7-p004/shot
            cp /tmp/c7-p004/certificate.json /tmp/c7-p004/shot/certificate.json
            python /tmp/c7-fewshots/problems/p004-shannon-capacity-c7/verify/verify.py /tmp/c7-p004/shot
          else
            echo 'No candidate above the 134753 record to verify.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7p5-two-layer-${{ matrix.seed }}
          path: /tmp/c7-p004/
          retention-days: 14
