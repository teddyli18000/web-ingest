name: temp-ta41-real-vs-fake-second-elite-dmu
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-real-vs-fake-second-elite-dmu.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-real-vs-fake-second-elite-dmu
  cancel-in-progress: false
jobs:
  independent_parent_information:
    strategy:
      fail-fast: false
      matrix:
        batch: [dmu16-20, dmu56-60]
        mode: [real, count-matched-fake]
        source:
          - primary: 1901
            secondary: 1911
          - primary: 1911
            secondary: 1901
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP and verify source-only paired elite information model
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/machine_group_order_repair.py science-boundary/job-shop-ta41/benchmark_machine_group_transfer.py
          test "$(find science-boundary/job-shop-ta41/positive-n7-${{ matrix.batch }} -name start.txt | wc -l)" -eq 10
      - name: Keep A as sole candidate start; use independent B only to rank source-legal machine releases, fake B matches exact per-machine disagreement counts
        run: |
          python3 science-boundary/job-shop-ta41/benchmark_machine_group_transfer.py \
            --policy dynamic --target-drop 4 \
            --auxiliary-mode '${{ matrix.mode }}' \
            --auxiliary-partner-seed '${{ matrix.source.secondary }}' \
            --auxiliary-weight 3 \
            --initial-seed '${{ matrix.source.primary }}' \
            --cases-dir 'science-boundary/job-shop-ta41/positive-n7-${{ matrix.batch }}' \
            --expected-instances 5 --total-seconds 5 --cp-seconds .7 --master-seconds .15 \
            --out 'science-boundary/job-shop-ta41/results/dmu-elite-information-${{ matrix.batch }}-${{ matrix.source.primary }}-${{ matrix.mode }}'
      - name: Preserve all 600-op certificates, marginal-matched fake labels and true paired metrics
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/dmu-elite-information-${{ matrix.batch }}-${{ matrix.source.primary }}-${{ matrix.mode }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): real-vs-count-matched-fake N7 elite B 5s crossfamily ${{ matrix.batch }} ${{ matrix.source.primary }} ${{ matrix.mode }}'
          for i in $(seq 1 50); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
