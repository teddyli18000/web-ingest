name: Temp GPT MV first 30 integrated director gate

on:
  push:
    paths:
      - "temp-work/gpt-mv-code-native/src/scenes/opening_v12.js"
      - "temp-work/gpt-mv-code-native/src/scenes/drafts_v14.js"
      - "temp-work/gpt-mv-code-native/src/main.js"
      - ".github/workflows/temp-gpt-mv-first30-integrated.yml"
  workflow_dispatch:

concurrency:
  group: temp-gpt-mv-first30-integrated
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integrated-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    defaults:
      run:
        working-directory: temp-work/gpt-mv-code-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare renderer
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
      - name: Render 1080p boundary frames
        run: node export/shot_stills.mjs out/first30_boundaries "14.45,14.72,14.95,15.02,15.20,29.50,29.75,29.95,30.03,30.20"
      - name: Render integrated first 30 seconds
        run: node export/render.mjs --start 0 --end 30 --width 960 --height 540 --fps 15 --art-source reach-hq --bust-source gpt-bust-matted-v5 --out out/first30.mp4
      - name: Validate timing and decode
        run: |
          set -euo pipefail
          ffmpeg -v error -i out/first30.mp4 -f null -
          test "$(find out/first30_boundaries -name '*.png' | wc -l)" -eq 10
          D="$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 out/first30.mp4)"
          python - "$D" <<'PY'
          import sys
          duration=float(sys.argv[1])
          print('duration',duration)
          assert abs(duration-30)<0.1
          PY
      - name: Upload integrated director review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mv-first30-integrated-${{ github.run_id }}
          path: |
            temp-work/gpt-mv-code-native/out/first30.mp4
            temp-work/gpt-mv-code-native/out/first30.contact.jpg
            temp-work/gpt-mv-code-native/out/first30_boundaries/*.png
          retention-days: 14
          if-no-files-found: warn
