name: temp-ta41-project-group-cores
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/group_core_projection.py'
      - '.github/workflows/temp-ta41-project-group-cores.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-project-group-cores
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate all group-core hitting sets without CP solver
        run: python3 science-boundary/job-shop-ta41/group_core_projection.py
      - name: Save finite counterexample to over-abstracting machine cores
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/group-core-projection.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): measure loss of information in grouped cores'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
