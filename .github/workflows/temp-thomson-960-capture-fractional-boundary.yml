name: temp Thomson 960 capture fractional boundary result

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-capture-fractional-boundary.yml'

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: thomson-n961-fractional-projection-boundary
          path: ${{ runner.temp }}/boundary
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41185718113
      - name: Capture concise durable result
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          src=pathlib.Path(os.environ['RUNNER_TEMP'])/'boundary'/'result.json'
          d=json.loads(src.read_text())
          lines=[
            'Thomson N=960 — N961 fractional projection boundary — 2026-10-31',
            '',
            f"live_score = {d['live_score']}",
            f"transitions = {d['transitions']}",
            f"best = {d['best']}",
            '',
            'lambda  class  energy  delta_live  coord',
          ]
          for r in d['rows']:
            lines.append(f"{r['lambda']:.12g}  {r['projection_class']}  {r['projection_energy']:.15f}  {r['projection_delta_live']:+.12g}  {r['projection_signature']['coord']}")
          out=pathlib.Path('science-boundary/thomson-960/results/n961-fractional-projection-boundary-2026-10-31.txt')
          out.write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/thomson-960/results/n961-fractional-projection-boundary-2026-10-31.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'thomson: preserve N961 fractional projection boundary'
          git push origin HEAD:main
