name: temp-aes-core5-affine-rescue-0-4

on:
  push:
    paths:
      - '.github/workflows/temp-aes-core5-affine-rescue-0-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-aes-core5-affine-rescue-0-4
  cancel-in-progress: false

jobs:
  exact:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        case: [0,1,2,3,4]
        first: [0,1,2,3]
        fifth: [0,1,2,3]
        exclude:
          - {case: 1, first: 3}
          - {case: 2, first: 0}
          - {case: 2, first: 2}
          - {case: 3, first: 3}
          - {case: 4, first: 0}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact affine mandatory rescue shard
        run: |
          out=/tmp/aes-core5-affine-rescue-${{ matrix.case }}-${{ matrix.first }}-${{ matrix.fifth }}
          mkdir -p "$out"
          python science-boundary/aes-sbox-circuit/run_core5_affine_mandatory_firstshard.py \
            --case ${{ matrix.case }} \
            --first-shard ${{ matrix.first }} --first-shards 4 \
            --fifth-shard ${{ matrix.fifth }} --fifth-shards 4 \
            --out "$out" | tee "$out/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aes-core5-affine-rescue-${{ matrix.case }}-${{ matrix.first }}-${{ matrix.fifth }}
          path: /tmp/aes-core5-affine-rescue-${{ matrix.case }}-${{ matrix.first }}-${{ matrix.fifth }}
