name: temp-ta41-ihs-heldout-transfer
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-ihs-heldout-transfer.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-ihs-heldout-transfer
  cancel-in-progress: false
jobs:
  transfer:
    strategy:
      fail-fast: false
      matrix:
        policy: [dynamic, static]
        case: [ta42js-n7elite1701, ta44js-n7elite1711, ta45js-n7elite1701, ta47js-n7elite1711]
        seed: [333, 1129]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP solver and syntax check
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/joint_conflict_hitting_repair.py
      - name: Prospective held-out source-independent 30x20 blind construction
        run: |
          python3 science-boundary/job-shop-ta41/joint_conflict_hitting_repair.py \
            --start 'science-boundary/job-shop-ta41/positive-n7-elite-data/${{ matrix.case }}/start.txt' \
            --policy '${{ matrix.policy }}' --seed '${{ matrix.seed }}' \
            --root-pool 80 --roots 12 --iterations 110 \
            --cp-seconds 0.25 --hit-seconds 0.25 --seconds 100 \
            --out 'science-boundary/job-shop-ta41/results/ihs-transfer-${{ matrix.case }}-${{ matrix.policy }}-s${{ matrix.seed }}'
      - name: Save exact complete score or honest failed search
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/ihs-transfer-${{ matrix.case }}-${{ matrix.policy }}-s${{ matrix.seed }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): prospective independent-elite IHS transfer ${{ matrix.case }} ${{ matrix.policy }} s${{ matrix.seed }}'
          for i in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
