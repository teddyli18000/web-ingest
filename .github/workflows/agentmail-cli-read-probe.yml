name: agentmail-cli-read-probe

on:
  push:
    branches:
      - agentmail-probe-20260902
    paths:
      - .github/workflows/agentmail-cli-read-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install current CLI
        run: |
          set -euo pipefail
          npm install --global @tencent-qqmail/agently-cli@1.0.18
          agently-cli --version
      - name: Inspect read-side command surface
        env:
          AGENTLY_ACCESS_TOKEN: public-probe-placeholder
        run: |
          set -euo pipefail
          echo '=== list help ==='
          agently-cli message +list --help || true
          echo '=== list dry-run ==='
          agently-cli message +list --limit 7 --dir inbox --cursor cur_probe --dry-run || true
          echo '=== read help ==='
          agently-cli message +read --help || true
          echo '=== read dry-run ==='
          agently-cli message +read --id msg_probe --dry-run || true
          echo '=== attachment download help ==='
          agently-cli attachment +download --help || true
          echo '=== attachment download dry-run ==='
          agently-cli attachment +download --msg msg_probe --att att_probe --dry-run || true
