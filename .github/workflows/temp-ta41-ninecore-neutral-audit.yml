name: temp-ta41-ninecore-neutral-audit
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/analyze_ninecore_neutral.py'
      - '.github/workflows/temp-ta41-ninecore-neutral-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-ninecore-neutral-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Independently evaluate critical-path geometry and all core cut hits
        run: |
          python3 -m py_compile science-boundary/job-shop-ta41/analyze_ninecore_neutral.py
          python3 science-boundary/job-shop-ta41/analyze_ninecore_neutral.py
      - name: Retain compact exact analysis for next research iteration
        run: |
          set -euo pipefail
          path='science-boundary/job-shop-ta41/results/ninecore-neutral-analysis.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): independently replay nine-core neutral path replacements'
          for attempt in $(seq 1 25); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 1
          done
          exit 1
