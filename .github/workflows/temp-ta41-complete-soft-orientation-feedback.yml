name: temp-ta41-complete-soft-orientation-feedback
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/soft_reorientation_feedback.py'
      - '.github/workflows/temp-ta41-complete-soft-orientation-feedback.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-complete-soft-orientation-feedback
  cancel-in-progress: false
jobs:
  optimize:
    strategy:
      fail-fast: false
      matrix:
        parent: [baseline,'124']
        policy: [dynamic,static,core,random]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned solver
        run: |
          python3 -m py_compile science-boundary/job-shop-ta41/soft_reorientation_feedback.py
          python3 -m pip install 'ortools==9.14.6206'
      - name: Minimize Cmax with GLOBAL freely reoriented machine precedence (weighted guidance only)
        run: |
          python3 science-boundary/job-shop-ta41/soft_reorientation_feedback.py \
            --parent '${{ matrix.parent }}' --policy '${{ matrix.policy }}' \
            --seed 4107 --seconds 130 \
            --out 'science-boundary/job-shop-ta41/results/soft-orientation-${{ matrix.parent }}-${{ matrix.policy }}'
      - name: Official Few Shots verification for any strict improvement
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/soft-orientation-${{ matrix.parent }}-${{ matrix.policy }}"
          if test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist result and uncertainty to main with retry
        if: always()
        run: |
          set -euo pipefail
          out='science-boundary/job-shop-ta41/results/soft-orientation-${{ matrix.parent }}-${{ matrix.policy }}'
          if ! test -d "$out"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): global soft-precedence reorientation ${{ matrix.parent }} ${{ matrix.policy }}'
          for i in $(seq 1 60); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 1
          done
          exit 1
