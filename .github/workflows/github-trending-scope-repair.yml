name: GitHub Trending canonical scope repair
# One-shot workflow. This revision intentionally triggers the already-validated repair.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/github-trending-scope-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-trending-scope-repair
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate normalization code
        run: |
          python -m py_compile github-trending/*.py
          python -m unittest discover -s github-trending/tests -v
      - name: Canonicalize recovered historical scopes
        run: |
          python github-trending/repair_scopes.py
          python github-trending/render_readme.py
      - name: Commit repair in year-sized chunks and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for year_dir in github-trending/data/[0-9][0-9][0-9][0-9]; do
            [ -d "$year_dir" ] || continue
            git add "$year_dir"
            if ! git diff --cached --quiet; then
              year="${year_dir##*/}"
              git commit -m "repair(github-trending): canonicalize scopes $year"
            fi
          done

          rm .github/workflows/github-trending-scope-repair.yml
          git add github-trending/backfill-manifest.json github-trending/README.md .github/workflows/github-trending-scope-repair.yml
          if ! git diff --cached --quiet; then
            git commit -m "repair(github-trending): finalize canonical scopes"
          fi

          git push origin HEAD:main
