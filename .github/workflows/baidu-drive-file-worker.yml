name: Baidu Drive File Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Active web-ingest transfer task ID
        required: true
        type: string
      file_id:
        description: Relay file ID
        required: true
        type: string
      lease_id:
        description: Persisted scheduler lease ID
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: baidu-drive-file-${{ inputs.task_id }}-${{ inputs.file_id }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout relay control code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            baidu-drive

      - name: Checkout pinned Baidu mover core
        uses: actions/checkout@v4
        with:
          repository: teddyli18000/baidu-drive-mover
          ref: a9e76feb18fe9ca1ac680d0ea555aac684d622de
          path: .relay-core
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .relay-core/go.mod
          cache-dependency-path: .relay-core/go.sum

      - name: Build direct relay executable
        run: |
          mkdir -p .relay-core/cmd/baidu-drive-relay
          cp baidu-drive/mover/relay-main.go .relay-core/cmd/baidu-drive-relay/main.go
          cp baidu-drive/mover/relay_core.go .relay-core/cmd/baidu-drive-relay/relay_core.go
          cp baidu-drive/mover/relay_locatedownload.go .relay-core/cmd/baidu-drive-relay/relay_locatedownload.go
          cp baidu-drive/mover/relay_session.go .relay-core/cmd/baidu-drive-relay/relay_session.go
          cp baidu-drive/mover/relay_secret.go .relay-core/cmd/baidu-drive-relay/relay_secret.go
          cp baidu-drive/mover/relay_hash.go .relay-core/cmd/baidu-drive-relay/relay_hash.go
          cp baidu-drive/mover/relay_drive_objects.go .relay-core/cmd/baidu-drive-relay/relay_drive_objects.go
          cp baidu-drive/mover/relay_reconcile.go .relay-core/cmd/baidu-drive-relay/relay_reconcile.go
          cd .relay-core
          go build -o "$RUNNER_TEMP/baidu-drive-relay" ./cmd/baidu-drive-relay
          echo "BAIDU_DRIVE_RELAY_BIN=$RUNNER_TEMP/baidu-drive-relay" >> "$GITHUB_ENV"

      - name: Install pinned OAuth encryption dependency
        run: python3 -m pip install "cryptography==46.0.4"

      - name: Provision ephemeral Baidu and Google credentials
        env:
          BAIDU_DRIVE_BAIDU_SESSION: ${{ secrets.BAIDU_DRIVE_BAIDU_SESSION }}
          BAIDU_DRIVE_RCLONE_CONFIG: ${{ secrets.BAIDU_DRIVE_RCLONE_CONFIG }}
          BAIDU_DRIVE_STATE_KEY: ${{ secrets.BAIDU_DRIVE_STATE_KEY }}
        run: python3 baidu-drive/auth_provision.py relay

      - name: Relay one leased file with independent lease renewal
        id: relay
        env:
          TASK_ID: ${{ inputs.task_id }}
          FILE_ID: ${{ inputs.file_id }}
          LEASE_ID: ${{ inputs.lease_id }}
        run: |
          python3 baidu-drive/lease_heartbeat.py --task-id "$TASK_ID" --file-id "$FILE_ID" --lease-id "$LEASE_ID" &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          python3 baidu-drive/relay_worker.py --task-id "$TASK_ID" --file-id "$FILE_ID" --lease-id "$LEASE_ID"

      - name: Wake shared master supervisor after this file worker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_TASK_ID: ${{ inputs.task_id }}
        run: |
          gh workflow run cloud-drive-supervisor.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "task_id=$TRANSFER_TASK_ID" -f "reason=file-worker-completed"
