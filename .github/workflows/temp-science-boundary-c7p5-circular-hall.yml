name: temp C7p5 circular exact Hall-gluing sweep

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7p5-circular-hall.yml
      - science-boundary/shannon-capacity-c7/code/c7p5_circular_hall_translation.cpp
      - science-boundary/shannon-capacity-c7/code/c7p5_circular_hall_io.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-c7p5-circular-hall
  cancel-in-progress: false

jobs:
  hall:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partner: [circle, I0, X, F0]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable public source snapshots
        run: |
          git init --quiet /tmp/c7-tandon
          git -C /tmp/c7-tandon fetch --quiet --depth 1 https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git c753408492dde92a239708986d16c15dbf6c3235
          git -C /tmp/c7-tandon checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-tandon rev-parse HEAD)" = c753408492dde92a239708986d16c15dbf6c3235
          git init --quiet /tmp/c7-five
          git -C /tmp/c7-five fetch --quiet --depth 1 https://github.com/molind/c7-five.git ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
          git -C /tmp/c7-five checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/c7-five rev-parse HEAD)" = ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
      - name: Validate all 39 codes and circular independent orbit profile
        run: |
          mkdir -p /tmp/c7-hall
          python science-boundary/shannon-capacity-c7/code/c7p5_circular_hall_io.py prepare \
            science-boundary/shannon-capacity-c7/data/circular-phase-367-2026-11-04.json \
            /tmp/c7-tandon/data/base_c7.json /tmp/c7-five/data/family-f.json \
            /tmp/c7-hall/inputs
      - name: Compile and exhaust all 16,807 relative translations with exact Hall matching
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra \
            science-boundary/shannon-capacity-c7/code/c7p5_circular_hall_translation.cpp \
            -o /tmp/c7-hall/hall
          /usr/bin/time -v /tmp/c7-hall/hall \
            /tmp/c7-hall/inputs/circle.ids \
            /tmp/c7-hall/inputs/${{ matrix.partner }}.ids \
            "${{ matrix.partner }}" /tmp/c7-hall/status.json /tmp/c7-hall/witness5.ids
      - name: Independently verify any breakthrough in 5D and upstream 10D
        run: |
          if test -s /tmp/c7-hall/witness5.ids; then
            python science-boundary/shannon-capacity-c7/code/c7p5_circular_hall_io.py verify \
              /tmp/c7-hall/witness5.ids /tmp/c7-hall/shot
            git clone --quiet --depth 1 https://github.com/few-shots/few-shots.git /tmp/c7-fewshots
            python /tmp/c7-fewshots/problems/p004-shannon-capacity-c7/verify/verify.py /tmp/c7-hall/shot
          else
            echo 'All tested translations Hall-saturated; no candidate.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7-circular-hall-${{ matrix.partner }}
          path: |
            /tmp/c7-hall/status.json
            /tmp/c7-hall/witness5.ids
            /tmp/c7-hall/shot/certificate.json
          retention-days: 14
