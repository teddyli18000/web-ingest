name: Temp Science Boundary C7 global box 368

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-global-box368.yml
      - science-boundary/shannon-capacity-c7/code/c7p5_box_cpsat_368.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-global-box368
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned source, verifier, and CP-SAT
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          python3 -m pip install --disable-pip-version-check ortools
          mkdir -p "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
      - name: Global exact target-368 CP-SAT with 32-point boxes
        id: solve
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/c7p5_box_cpsat_368.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/box368.json" \
            "$RUNNER_TEMP/result/witness5.json" "$RUNNER_TEMP/shot/certificate.json" \
            --seconds 19800 --workers 4 \
            2>&1 | tee "$RUNNER_TEMP/result/box368.stdout"
          python3 - "$RUNNER_TEMP/result/box368.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          with open(sys.argv[2],'a') as f:
              f.write('found='+('true' if r.get('candidate_368') else 'false')+'\n')
          PY
      - name: Verify 135424 breakthrough with Few Shots verifier
        if: steps.solve.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if not r.get('valid') or int(r.get('score',-1))<135424: raise SystemExit(r)
          print('VERIFIED GLOBAL C7^5=368 SQUARE BREAKTHROUGH',r)
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-global-box368
          path: |
            ${{ runner.temp }}/result
            ${{ runner.temp }}/shot
          retention-days: 14
