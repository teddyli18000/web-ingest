name: temp-ta41-core-reversal-global-branches
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/consensus_core_reversal.py'
      - '.github/workflows/temp-ta41-core-reversal-global-branches.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-core-reversal-global-branches
  cancel-in-progress: false
jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Pin full CP-SAT engine
        run: python -m pip install 'ortools==9.14.6206'
      - name: Branch on each unavoidable reversal of five-parent shared 21-arc core
        run: |
          python3 -m py_compile science-boundary/job-shop-ta41/consensus_core_reversal.py
          python3 science-boundary/job-shop-ta41/consensus_core_reversal.py --shard '${{ matrix.shard }}' --shards 7 --stage-a-seconds 12 --stage-b-seconds 16 --stage-c-seconds 60 --out 'science-boundary/job-shop-ta41/results/core-reversal-${{ matrix.shard }}'
      - name: Verify every new neutral seed and any <=2005 improvement
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/core-reversal-${{ matrix.shard }}"
          if ls "$dir"/neutral-core-*.json >/dev/null 2>&1 || test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
          fi
          mkdir -p /tmp/ta41-check
          for f in "$dir"/neutral-core-*.json; do
            if ! test -f "$f"; then continue; fi
            cp "$f" /tmp/ta41-check/certificate.json
            (cd /tmp/few-shots && python3 problems/p009-job-shop-ta41/verify/verify.py /tmp/ta41-check) > /tmp/verdict.json
            python3 - /tmp/verdict.json <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v['valid'] and int(v['score'])==2006,v
          PY
          done
          if test -f "$dir/certificate.json"; then
            (cd /tmp/few-shots && python3 problems/p009-job-shop-ta41/verify/verify.py "$dir") | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          v=json.loads((Path(sys.argv[1])/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Preserve stage-wise evidence including inconclusive UNKNOWN
        if: always()
        run: |
          set -euo pipefail
          dir="science-boundary/job-shop-ta41/results/core-reversal-${{ matrix.shard }}"
          test -f "$dir/forced-reversal.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): complete 21-way mandatory reversal branch shard ${{ matrix.shard }}'
          for attempt in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'Could not persist branch outcomes' >&2
          exit 1
