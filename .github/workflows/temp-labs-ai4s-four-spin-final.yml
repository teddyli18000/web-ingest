name: LABS four-spin isolated experiment
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-four-spin-final.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        n: [46, 47, 50]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Compile and test exact four-spin Hamiltonian
        run: |
          cd science-boundary/labs-ai4s-search/recombination_20261105/innovation/hidden_C_20261108
          g++ -O3 -std=c++17 four_spin_isolated.cpp -o /tmp/fourspin
          /tmp/fourspin selftest
      - name: Run isolated n4 baseline on same C-blind scenarios
        run: |
          set -e
          cd science-boundary/labs-ai4s-search/recombination_20261105/innovation/hidden_C_20261108
          n=${{ matrix.n }}
          if [ "$n" = 50 ]; then src=test50_forced_v1; else src=states_new_N$n; fi
          mkdir -p results/four_spin_N$n
          /tmp/fourspin bench results/$src/scenario-input.tsv results/four_spin_N$n/events.tsv results/four_spin_N$n/sessions.tsv 150
          python3 verify_four_spin.py --input results/$src/scenario-input.tsv --vault results/$src/target-vault.tsv --parents ../../data/combined/combined10.tsv --events results/four_spin_N$n/events.tsv --sessions results/four_spin_N$n/sessions.tsv --output results/four_spin_N$n
      - uses: actions/upload-artifact@v4
        with:
          name: fourspin-${{ matrix.n }}
          path: science-boundary/labs-ai4s-search/recombination_20261105/innovation/hidden_C_20261108/results/four_spin_N${{ matrix.n }}/
