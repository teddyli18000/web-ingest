name: temp-labs-ai4s-audit-stalls
on:
  push:
    paths:
      - ".github/workflows/temp-labs-ai4s-audit-stalls.yml"
      - "science-boundary/labs-ai4s-search/audit_20261029/stall_interventions.cpp"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-audit-stalls
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Compile tests and audit-directed studies
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search
          mkdir -p audit_20261029/results
          g++ -O3 -std=c++17 frontier_deformation/deform.cpp -o /tmp/labs_deform_audit
          /tmp/labs_deform_audit --selftest
          g++ -O3 -std=c++17 mask_novelty.cpp -o /tmp/labs_mask_allend
          g++ -O3 -std=c++17 -Wall -Wextra audit_20261029/stall_interventions.cpp -o /tmp/labs_stall_audit
          /tmp/labs_stall_audit --test
      - name: All four raw endpoints versus selected winner
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search
          /tmp/labs_mask_allend audit_20261029/results/endpoint_audit_n100.csv 100 40 100 771129 10 8
      - name: Frozen-history seven-arm frontier and historical state experiments
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search
          /tmp/labs_stall_audit frontier_deformation/results/2026-10-29-frontier-elite-eval.tsv audit_20261029/results/frozen_frontier_v1.tsv 80 2 9 10 400 12000
          /tmp/labs_stall_audit frontier_deformation/results/2026-10-29-strong-corpus.tsv audit_20261029/results/frozen_historical_v1.tsv 80 2 9 10 400 12000
      - name: Verify outcomes, statistics and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check numpy pandas
          cd science-boundary/labs-ai4s-search
          python3 audit_20261029/analyze_stalls.py audit_20261029/results/frozen_frontier_v1.tsv audit_20261029/results/frozen_historical_v1.tsv --out audit_20261029/results/paired_summary_v1.json
          python3 - <<'PY'
          import csv, hashlib,json,os,platform,pathlib,subprocess
          base=pathlib.Path("audit_20261029/results")
          for name,count in [("frozen_frontier_v1.tsv",294),("frozen_historical_v1.tsv",350)]:
              rows=list(csv.DictReader((base/name).open(),delimiter="\t"))
              assert len(rows)==count,(name,len(rows))
              assert all(int(r['bestE'])<=int(r['frozenBestE']) for r in rows)
              assert all(float(r['elapsed_seconds'])>0 for r in rows)
          rows=list(csv.DictReader((base/"endpoint_audit_n100.csv").open()))
          assert len(rows)==300
          assert all(0<=int(r["all_endpoint_return_count"])<=32 for r in rows)
          d={'source_sha':subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            'kernel':platform.platform(),'compiler':subprocess.check_output(["g++","--version"],text=True).splitlines()[0],
            'files':{p.name:{'rows':sum(1 for _ in p.open())-1,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                for p in base.glob("*") if p.is_file() and p.suffix in ('.csv','.tsv')},
            'protocol':'audit_20261029/README.md, 80 ms, two warmups/source, per-orbit cluster uncertainty'}
          (base/"run_metadata.json").write_text(json.dumps(d,indent=2)+"\n")
          print(json.dumps(d,indent=2))
          PY
      - name: Commit verified results only under owning science topic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science-boundary/labs-ai4s-search/audit_20261029/results/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(labs-ai4s): commit verified frozen-history intervention audit data"
          git pull --rebase origin main
          git push origin HEAD:main
