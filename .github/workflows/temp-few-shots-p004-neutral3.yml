name: Temp Few Shots p004 neutral3 search

on:
  push:
    paths:
      - .github/workflows/temp-few-shots-p004-neutral3.yml
      - temp-work/few-shots-p004/neutral3.cpp
      - temp-work/few-shots-p004/neutral3_sat.py
      - temp-work/few-shots-p004/generalized9.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-few-shots-p004-neutral3
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch public source data read-only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          git clone --depth 1 --filter=blob:none --sparse https://github.com/nathanielitty/lower-bounds-for-shannon-capacity.git "$RUNNER_TEMP/shannon-source"
          git -C "$RUNNER_TEMP/shannon-source" sparse-checkout set c7
      - name: Compile exact neutral3 search
        run: g++ -O3 -DNDEBUG -march=native -std=c++20 temp-work/few-shots-p004/neutral3.cpp -o "$RUNNER_TEMP/neutral3"
      - name: Enumerate exact simultaneous 3-for-3 parent exchanges
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v "$RUNNER_TEMP/neutral3" "$RUNNER_TEMP/shannon-source/c7/R367.txt" "$RUNNER_TEMP/neutral3.json"
          python3 - <<'PY'
          import json,os
          p=os.environ['RUNNER_TEMP']+'/neutral3.json'
          r=json.load(open(p))
          print(json.dumps({k:r.get(k) for k in ('kind','owner_triples','states','evaluated','max_private','max_private_centers','best_overlap')},sort_keys=True))
          PY
      - name: Install SAT solver
        run: python3 -m pip install --disable-pip-version-check python-sat
      - name: Test strongest neutral3 states with generalized endpoint SAT
        id: sat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shot"
          /usr/bin/time -v python3 temp-work/few-shots-p004/neutral3_sat.py \
            "$RUNNER_TEMP/shannon-source/c7/R367.txt" \
            "$RUNNER_TEMP/neutral3.json" \
            "$RUNNER_TEMP/few-shots/problems/p004-shannon-capacity-c7/baseline/certificate.json" \
            "$RUNNER_TEMP/shot/certificate.json" \
            "$RUNNER_TEMP/status.json"
          cat "$RUNNER_TEMP/status.json"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify breakthrough with upstream verifier
        if: steps.sat.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/verify.json"
          python3 - "$RUNNER_TEMP/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r['score'])<=134753: raise SystemExit(r)
          print(f"verified breakthrough score={r['score']}")
          PY
      - name: Save verified breakthrough in web-ingest only
        if: steps.sat.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp-work/few-shots-p004/breakthrough
          cp "$RUNNER_TEMP/shot/certificate.json" temp-work/few-shots-p004/breakthrough/certificate.json
          cp "$RUNNER_TEMP/status.json" temp-work/few-shots-p004/breakthrough/neutral3-status.json
          cp "$RUNNER_TEMP/verify.json" temp-work/few-shots-p004/breakthrough/neutral3-verify-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp-work/few-shots-p004/breakthrough
          git commit -m "temp: save verified p004 neutral3 breakthrough"
          git fetch origin main && git rebase origin/main && git push origin HEAD:main
      - name: Summarize
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/status.json" ]]; then cat "$RUNNER_TEMP/status.json" >> "$GITHUB_STEP_SUMMARY"; fi
          if [[ -f "$RUNNER_TEMP/verify.json" ]]; then cat "$RUNNER_TEMP/verify.json" >> "$GITHUB_STEP_SUMMARY"; fi
