name: temp-labs-ai4s-native-trajectories
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-native-trajectories.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-native-trajectories
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Checkout pinned public native memetic-Tabu solver
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/borkob/git_labs.git "$RUNNER_TEMP/git_labs"
          PIN=1aa123407636e48630174e0bf122037e369c1d68
          cd "$RUNNER_TEMP/git_labs"
          if [ "$(git rev-parse HEAD)" != "$PIN" ]; then
            git fetch --depth 1 origin "$PIN"
            git checkout --detach "$PIN"
          fi
          test "$(git rev-parse HEAD)" = "$PIN"
          echo "LABS_SOURCE_COMMIT=$PIN" >> "$GITHUB_ENV"
      - name: Compile native baseline, apply auditable patch, then recompile
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/git_labs/solvers/lMAts-lRRts/src"
          cd "$SRC"
          make -j1
          test -x ./lMAts
          cp ./lMAts "$RUNNER_TEMP/lMAts_native"
          cd "$GITHUB_WORKSPACE"
          python3 science-boundary/labs-ai4s-search/trajectory_20261104/instrument_mts.py "$SRC"
          cd "$SRC"
          make -j1
          test -x ./lMAts
          cp ./lMAts "$RUNNER_TEMP/lMAts_traced"
      - name: Exact scorer smoke on traced native solver, then collect full pilot
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/trajectory_20261104
          python3 collect_native.py --solver "$RUNNER_TEMP/lMAts_traced" \
            --output results/native_smoke --lengths 48,100 --seeds 1 \
            --duration 5 --workers 2 --genstride 1 --stepstride 8
          python3 collect_native.py --solver "$RUNNER_TEMP/lMAts_traced" \
            --output results/native_pilot --lengths 48,64,80,92,99,100 --seeds 2 \
            --duration 45 --workers 4 --genstride 4 --stepstride 32
      - name: Independent full event scoring and bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/trajectory_20261104
          python3 - <<'PY'
          import gzip,json,pathlib,hashlib
          from collect_native import energy
          for sub,want in [('native_smoke',2),('native_pilot',12)]:
            root=pathlib.Path('results')/sub
            manifest=json.loads((root/'manifest.json').read_text())
            assert manifest['valid']==want
            for run in manifest['jobs']:
              p=root/run['trace'];assert hashlib.sha256(p.read_bytes()).hexdigest()==run['sha256']
              with gzip.open(p,'rt') as f:
                h=f.readline().rstrip().split('\t');assert len(h)==11
                count=0;seen_starts=set();ends=set()
                for line in f:
                  z=dict(zip(h,line.rstrip('\n').split('\t')))
                  if z['event']=='TS_START':seen_starts.add(z['episode'])
                  if z['event']=='TS_END':ends.add(z['episode'])
                  if z['event'] in ('TS_START','TS_END','TS_BEST','GA_RECORD'):
                    assert energy(z['seq'])==int(z['energy'])
                    assert energy(z['best_seq'])==int(z['best_energy'])
                  count+=1
                assert count==run['total_events']
                assert seen_starts==ends
            print(sub,'validated',want,'complete raw traces')
          PY
      - name: Commit verified raw lossless traces and metadata to owning research topic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/trajectory_20261104/results/native_smoke/
          git add science-boundary/labs-ai4s-search/trajectory_20261104/results/native_pilot/
          git commit -m 'research(labs-ai4s): preserve source-pinned native MTS trajectory events and exact verification'
          git pull --rebase origin main
          git push origin HEAD:main
