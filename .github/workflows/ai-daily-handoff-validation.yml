name: Temporary AI Daily handoff validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ai-daily-handoff-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Print final controlled handoff evidence
        env:
          AI_DAILY_DISPATCH_TOKEN: ${{ secrets.AI_DAILY_DISPATCH_TOKEN }}
          REPORT_DATE: "2026-09-03"
          HANDOFF_AFTER: "2026-09-03T08:14:30Z"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime

          token = os.environ["AI_DAILY_DISPATCH_TOKEN"]
          report_date = os.environ["REPORT_DATE"]
          handoff_after = datetime.fromisoformat(
              os.environ["HANDOFF_AFTER"].replace("Z", "+00:00")
          )
          base = "https://api.github.com/repos/teddyli18000/Github_test"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "web-ingest/ai-daily-handoff-validation",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise RuntimeError(f"unexpected HTTP {response.status} for {path}")
                  return json.load(response)

          def parse_time(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          archive_payload = get_json(
              "/actions/workflows/ai-daily-archive.yml/runs"
              "?event=workflow_dispatch&branch=master&per_page=50"
          )
          candidates = [
              run
              for run in archive_payload.get("workflow_runs", [])
              if parse_time(run["created_at"]) >= handoff_after
          ]
          if not candidates:
              raise RuntimeError("no Bot 1 workflow_dispatch run found after controlled handoff")
          archive_run = max(candidates, key=lambda run: run["created_at"])
          if archive_run.get("status") != "completed" or archive_run.get("conclusion") != "success":
              raise RuntimeError("controlled Bot 1 run is not a completed success")
          if archive_run.get("event") != "workflow_dispatch" or archive_run.get("head_branch") != "master":
              raise RuntimeError("controlled Bot 1 run has unexpected event/ref")

          mail_payload = get_json(
              "/actions/workflows/ai-daily-mail.yml/runs"
              "?event=workflow_dispatch&branch=master&per_page=100"
          )
          title = f"AI Daily Mail | {report_date}"
          mail_runs = [
              run
              for run in mail_payload.get("workflow_runs", [])
              if run.get("display_title") == title
          ]
          if len(mail_runs) != 1:
              raise RuntimeError(
                  f"expected exactly one Bot 2 run for {report_date}, found {len(mail_runs)}"
              )
          mail_run = mail_runs[0]

          print(f"REPORT_DATE={report_date}")
          print(f"BOT1_RUN_ID={archive_run['id']}")
          print(f"BOT1_RUN_URL={archive_run['html_url']}")
          print(f"BOT1_EVENT={archive_run['event']}")
          print(f"BOT1_BRANCH={archive_run['head_branch']}")
          print(f"BOT1_CONCLUSION={archive_run['conclusion']}")
          print(f"BOT2_RUN_ID={mail_run['id']}")
          print(f"BOT2_RUN_URL={mail_run['html_url']}")
          print(f"BOT2_STATUS={mail_run['status']}")
          print(f"BOT2_CONCLUSION={mail_run['conclusion']}")
          print("BOT2_RUN_COUNT_FOR_DATE=1")
          print("DUPLICATE_MAIL_RUN_CREATED=false")
          PY
