name: Temporary AI Daily handoff validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ai-daily-handoff-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Record final controlled handoff evidence
        env:
          AI_DAILY_DISPATCH_TOKEN: ${{ secrets.AI_DAILY_DISPATCH_TOKEN }}
          REPORT_DATE: "2026-09-03"
          HANDOFF_AFTER: "2026-09-03T08:14:30Z"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime

          token = os.environ["AI_DAILY_DISPATCH_TOKEN"]
          report_date = os.environ["REPORT_DATE"]
          handoff_after = datetime.fromisoformat(
              os.environ["HANDOFF_AFTER"].replace("Z", "+00:00")
          )
          base = "https://api.github.com/repos/teddyli18000/Github_test"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "web-ingest/ai-daily-handoff-validation",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise RuntimeError(f"unexpected HTTP {response.status} for {path}")
                  return json.load(response)

          def parse_time(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          archive_payload = get_json(
              "/actions/workflows/ai-daily-archive.yml/runs"
              "?event=workflow_dispatch&branch=master&per_page=50"
          )
          candidates = [
              run
              for run in archive_payload.get("workflow_runs", [])
              if parse_time(run["created_at"]) >= handoff_after
          ]
          if not candidates:
              raise RuntimeError("no Bot 1 workflow_dispatch run found after controlled handoff")
          archive_run = max(candidates, key=lambda run: run["created_at"])

          deadline = time.monotonic() + 120
          while archive_run.get("status") != "completed" and time.monotonic() < deadline:
              time.sleep(3)
              archive_run = get_json(f"/actions/runs/{archive_run['id']}")
          if archive_run.get("status") != "completed":
              raise RuntimeError(f"Bot 1 run {archive_run['id']} did not complete")
          if archive_run.get("conclusion") != "success":
              raise RuntimeError(
                  f"Bot 1 run {archive_run['id']} concluded {archive_run.get('conclusion')!r}"
              )
          if archive_run.get("event") != "workflow_dispatch":
              raise RuntimeError(f"Bot 1 event was {archive_run.get('event')!r}")
          if archive_run.get("head_branch") != "master":
              raise RuntimeError(f"Bot 1 branch was {archive_run.get('head_branch')!r}")

          mail_payload = get_json(
              "/actions/workflows/ai-daily-mail.yml/runs"
              "?event=workflow_dispatch&branch=master&per_page=100"
          )
          title = f"AI Daily Mail | {report_date}"
          mail_runs = [
              run
              for run in mail_payload.get("workflow_runs", [])
              if run.get("display_title") == title
          ]
          if len(mail_runs) != 1:
              raise RuntimeError(
                  f"expected exactly one Bot 2 run for {report_date}, found {len(mail_runs)}"
              )
          mail_run = mail_runs[0]

          summary = os.environ["GITHUB_STEP_SUMMARY"]
          validation_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write("### Controlled AI Daily handoff evidence\n\n")
              handle.write(f"- evidence run: {validation_url}\n")
              handle.write(f"- report date / dispatch input: `{report_date}`\n")
              handle.write(f"- Bot 1: {archive_run['html_url']}\n")
              handle.write(f"- Bot 1 run id: `{archive_run['id']}`\n")
              handle.write(f"- Bot 1 event: `{archive_run['event']}`\n")
              handle.write(f"- Bot 1 branch: `{archive_run['head_branch']}`\n")
              handle.write(f"- Bot 1 conclusion: `{archive_run['conclusion']}`\n")
              handle.write(f"- Bot 2: {mail_run['html_url']}\n")
              handle.write(f"- Bot 2 run id: `{mail_run['id']}`\n")
              handle.write(f"- Bot 2 status: `{mail_run['status']}`\n")
              handle.write(f"- Bot 2 conclusion: `{mail_run['conclusion']}`\n")
              handle.write(f"- Bot 2 runs for `{report_date}`: `1`\n")
              handle.write("- duplicate Bot 2/mail run created by handoff: `false`\n")
          PY
