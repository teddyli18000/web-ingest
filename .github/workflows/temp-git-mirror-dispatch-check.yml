name: temp-git-mirror-dispatch-check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-git-mirror-dispatch-check.yml'

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch persistent Git Mirror reconciler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run git-mirror-reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-git-mirror-dispatch-check.yml
          git commit -m "chore(git-mirror): remove dispatch check"
          git pull --rebase origin main
          git push origin HEAD:main
