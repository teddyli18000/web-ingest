name: temp-aes-lb32-preout-smoke

on:
  push:
    paths:
      - '.github/workflows/temp-aes-lb32-preout-smoke.yml'
      - 'science-boundary/aes-sbox-circuit/screen_semilinear_preout_budget.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-aes-lb32-preout-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact LB32 pre+output budget smoke
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/aes-lb32-preout-smoke
          mkdir -p "$out"
          python science-boundary/aes-sbox-circuit/screen_semilinear_preout_budget.py \
            --c 0x30 --k 3 --prefix 0 --budget 31 --out "$out" \
            | tee "$out/run.log"
          python - <<'PY'
          import json
          p='/tmp/aes-lb32-preout-smoke/summary.json'
          d=json.load(open(p))
          assert d['budget'] == 31
          assert d['counts']['orientations'] == 3**7
          print(json.dumps({'validated_summary': d}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aes-lb32-preout-smoke
          path: /tmp/aes-lb32-preout-smoke
