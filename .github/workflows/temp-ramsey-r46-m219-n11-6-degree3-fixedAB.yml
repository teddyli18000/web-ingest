name: Temp Ramsey R46 m219 n11=6 degree3 fixed-AB cover

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/m219_n11_6_degree3_fixed_ab.py
      - .github/workflows/temp-ramsey-r46-m219-n11-6-degree3-fixedAB.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-m219-n11-6-degree3-fixedAB
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SAT stack
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Download authenticated A26/B116 complete catalogues and prepare cover
        id: mk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/catalogs
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r36_11.g6.gz -o /tmp/r46/r36_11.g6.gz
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r45_24.g6 -o /tmp/r46/r45_24.g6
          echo '628c53df90910b2aae9a9559a62605593ff6fcdac66e9f23f95a134a4a696f36  /tmp/r46/r36_11.g6.gz' | sha256sum -c -
          echo '83ca4028f206b2fa4315ef219b8c2c57c7835209673dd8183d8fb4353bd4fdd0  /tmp/r46/r45_24.g6' | sha256sum -c -
          PYTHONPATH=science-boundary/ramsey-r46 python science-boundary/ramsey-r46/m219_n11_6_degree3_fixed_ab.py self-test
          PYTHONPATH=science-boundary/ramsey-r46 python science-boundary/ramsey-r46/m219_n11_6_degree3_fixed_ab.py prepare \
            --r36-11 /tmp/r46/r36_11.g6.gz --r45-24 /tmp/r46/r45_24.g6 \
            --outdir /tmp/r46/catalogs --manifest /tmp/r46/manifest.json
          python - /tmp/r46/manifest.json "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d['counts']=={'A26':2,'B116':9,'sequences':3,'branches':54},d['counts']
          with open(sys.argv[2],'a') as f:f.write('matrix='+json.dumps({'include':d['branches']},separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-m219-n11-6-degree3-catalogs
          path: |
            /tmp/r46/catalogs
            /tmp/r46/manifest.json
          retention-days: 7

  solve:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ramsey-r46-m219-n11-6-degree3-catalogs
          path: /tmp/r46
      - name: Install pinned SAT stack
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Solve one exact fixed-AB branch
        id: solve
        shell: bash
        env:
          SEQ: ${{ matrix.sequence }}
          AO: ${{ matrix.a_ordinal }}
          BO: ${{ matrix.b_ordinal }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/r46/out
          set +e
          timeout --signal=TERM --kill-after=20s 420 \
            env PYTHONPATH=science-boundary/ramsey-r46 \
            python science-boundary/ramsey-r46/m219_n11_6_degree3_fixed_ab.py solve \
              --catalog-dir /tmp/r46/catalogs --sequence "$SEQ" --a-ordinal "$AO" --b-ordinal "$BO" \
              --solver cadical195 --summary /tmp/r46/out/summary.json --output /tmp/r46/out/candidate.json \
              > /tmp/r46/out/solver.log 2>&1
          rc=$?
          set -e
          case "$rc" in 0) status=SAT;;20) status=UNSAT;;124|137|143) status=TIMEOUT;;*) status=ERROR;;esac
          if [[ ! -f /tmp/r46/out/summary.json ]]; then
            python - /tmp/r46/out/summary.json "$status" "$rc" "$SEQ" "$AO" "$BO" <<'PY'
          import json,sys
          p,status,rc,seq,ao,bo=sys.argv[1:]
          open(p,'w').write(json.dumps({'campaign':'m219-n11-6-degree3-fixedAB','status':status,'solver_exit':int(rc),
            'sequence':int(seq),'a_ordinal':int(ao),'b_ordinal':int(bo)},indent=2,sort_keys=True)+'\n')
          PY
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/r46/out/summary.json; tail -n20 /tmp/r46/out/solver.log || true
          [[ "$status" != ERROR ]]
      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate; cp /tmp/r46/out/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/out/few-shots-verify.json
          python3 - /tmp/r46/out/few-shots-verify.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d.get('valid') is True and str(d.get('score'))=='36',d
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-m219-n11-6-degree3-${{ matrix.sequence }}-${{ matrix.a_ordinal }}-${{ matrix.b_ordinal }}
          path: /tmp/r46/out
          if-no-files-found: warn
          retention-days: 7

  collect:
    if: always()
    needs: [prepare, solve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-m219-n11-6-degree3-*
          path: /tmp/parts
      - name: Aggregate exact 54-branch cover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python - /tmp/parts /tmp/r46/result.json <<'PY'
          import json,pathlib,shutil,sys
          root=pathlib.Path(sys.argv[1]);rows=[];verifies=[];hits=[]
          for p in root.rglob('summary.json'):
              d=json.load(open(p));rows.append(d);c=p.parent/'candidate.json';v=p.parent/'few-shots-verify.json'
              if c.exists():hits.append((d,c,v if v.exists() else None))
              if v.exists():verifies.append(json.load(open(v)))
          rows.sort(key=lambda d:(d['sequence'],d['a_ordinal'],d['b_ordinal']))
          counts={}
          for r in rows:counts[r['status']]=counts.get(r['status'],0)+1
          d={'campaign':'m219-n11-6-degree3-fixedAB','logical_scope':'all m=219 n11=6 graphs except L=K_{2,2,2}',
             'proof_cover':'any non-K222 L has a degree-3 d11 anchor; its pair is one of 2 A26 x 9 B116, with class placements quantified inside SAT',
             'expected_branches':54,'branches_attempted':len(rows),'status_counts':counts,'all_unsat':len(rows)==54 and counts.get('UNSAT',0)==54,
             'sat_count':counts.get('SAT',0),'timeout_count':counts.get('TIMEOUT',0),
             'verified_sat_count':sum(v.get('valid') is True and str(v.get('score'))=='36' for v in verifies),'rows':rows}
          if hits:
              hd,c,v=hits[0];shutil.copyfile(c,'/tmp/r46/candidate.json')
              if v:shutil.copyfile(v,'/tmp/r46/few-shots-verify.json')
              d['first_hit']={k:hd.get(k) for k in ('sequence','a_ordinal','b_ordinal')}
          open(sys.argv[2],'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n');print(json.dumps({k:v for k,v in d.items() if k!='rows'},sort_keys=True))
          PY
      - name: Persist campaign and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/m219-n11-6-degree3-fixedAB.json
          [[ ! -f /tmp/r46/candidate.json ]] || cp /tmp/r46/candidate.json science-boundary/ramsey-r46/results/m219-n11-6-degree3-hit.json
          [[ ! -f /tmp/r46/few-shots-verify.json ]] || cp /tmp/r46/few-shots-verify.json science-boundary/ramsey-r46/results/m219-n11-6-degree3-hit-verify.json
          git rm .github/workflows/temp-ramsey-r46-m219-n11-6-degree3-fixedAB.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/m219-n11-6-degree3-*.json
          git commit -m 'ramsey-r46: record m219 n11=6 degree3 fixed-AB cover'
          for attempt in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((attempt*4)); done
          exit 1
