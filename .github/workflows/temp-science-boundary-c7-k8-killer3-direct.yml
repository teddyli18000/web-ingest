name: Temp Science Boundary C7 direct exact k8 killer <=3

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-k8-killer3-direct.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-k8-killer3-direct
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned source and install SAT backends
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/result"
      - name: Build exact k8 support union with at most three killer colors
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_irreducible_support_sat.py build \
            "$RUNNER_TEMP/tan" 8 "$RUNNER_TEMP/k8.cnf" "$RUNNER_TEMP/k8.meta.json" --max-killer-colors 3 \
            > "$RUNNER_TEMP/result/build.stdout" 2> "$RUNNER_TEMP/result/build.stderr"
          cat "$RUNNER_TEMP/result/build.stdout"
      - name: Race four exact SAT backends
        shell: bash
        run: |
          set -euo pipefail
          solvers=(cadical195 glucose4 maplechrono minisat22)
          pids=()
          for s in "${solvers[@]}"; do
            (python3 science-boundary/shannon-capacity-c7/code/bpz_irreducible_support_sat.py worker \
              "$RUNNER_TEMP/k8.cnf" "$s" "$RUNNER_TEMP/$s.json" \
              > "$RUNNER_TEMP/result/$s.stdout" 2> "$RUNNER_TEMP/result/$s.stderr") &
            pids+=("$!")
          done
          winner=""
          while [[ -z "$winner" ]]; do
            alive=0
            for s in "${solvers[@]}"; do
              f="$RUNNER_TEMP/$s.json"
              if [[ -s "$f" ]]; then
                st=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("status",""))' "$f")
                if [[ "$st" == sat || "$st" == unsat ]]; then winner="$f"; break; fi
              fi
            done
            [[ -n "$winner" ]] && break
            for p in "${pids[@]}";do kill -0 "$p" 2>/dev/null && alive=$((alive+1)) || true;done
            if [[ "$alive" -eq 0 ]];then echo 'all backends failed' >&2;exit 1;fi
            sleep 2
          done
          cp "$winner" "$RUNNER_TEMP/result/winner.json"
          for p in "${pids[@]}";do kill "$p" 2>/dev/null || true;done
          wait || true
          python3 science-boundary/shannon-capacity-c7/code/bpz_irreducible_support_sat.py replay \
            "$RUNNER_TEMP/k8.meta.json" "$RUNNER_TEMP/result/winner.json" "$RUNNER_TEMP/result/replay.json"
          cat "$RUNNER_TEMP/result/replay.json"
      - name: Upload exact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-k8-killer3-direct-exact
          path: ${{ runner.temp }}/result
          retention-days: 14
