name: temp-ta41-implicit-hitting-set-positive
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-implicit-hitting-set-positive.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-implicit-hitting-set-positive
  cancel-in-progress: false
jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        policy: [uniform, static, random]
        case: [ta43js-n7elite1711, ta46js-n7elite1701]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned OR-Tools and syntax-check constructive core hit set
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/constructive_implicit_hitting_set.py
      - name: Oracle-blind iterative minimum correction set with target legal schedule output
        run: |
          set -euo pipefail
          python3 science-boundary/job-shop-ta41/constructive_implicit_hitting_set.py \
            --start "science-boundary/job-shop-ta41/positive-n7-elite-data/${{ matrix.case }}/start.txt" \
            --policy '${{ matrix.policy }}' --seed 4107 --seconds 75 \
            --cp-seconds 0.5 --hit-seconds 0.45 \
            --out "science-boundary/job-shop-ta41/results/ihs-${{ matrix.case }}-${{ matrix.policy }}"
      - name: Persist honest full results, complete witness or UNKNOWN
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/ihs-${{ matrix.case }}-${{ matrix.policy }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(ta41): oracle-blind partial-order IHS constructive ${{ matrix.case }} ${{ matrix.policy }}"
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
