name: temp-ta41-fds-temporal-split-conflict-resolution
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-fds-temporal-split-conflict-resolution.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-fds-temporal-split-conflict-resolution
  cancel-in-progress: false
jobs:
  dual_time_choice:
    strategy:
      fail-fast: false
      matrix:
        case: [ta41, ta43js-n7elite1711, ta46js-n7elite1701]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP-SAT and check FDS-inspired joint conditional machine core soundness code
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/temporal_split_resource_cores.py
      - name: Test both source-critical operation time-domain branches, resolve joint machine-core clauses, independently audit unbranched group core
        run: |
          c='${{ matrix.case }}'
          if test "$c" = ta41; then input=ta41; else input="science-boundary/job-shop-ta41/positive-n7-elite-data/$c/start.txt"; fi
          python3 science-boundary/job-shop-ta41/temporal_split_resource_cores.py \
            --start "$input" --splits 24 --seconds .25 --audit-seconds .8 \
            --seed 20261109 \
            --out "science-boundary/job-shop-ta41/results/time-split-conflict-$c.json"
      - name: Persist complete precompletion explanations without false global UNSAT claims
        if: always()
        run: |
          set -euo pipefail
          file='science-boundary/job-shop-ta41/results/time-split-conflict-${{ matrix.case }}.json'
          if ! test -f "$file"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): 2015 FDS time-bound two-sided resource-core logical resolution ${{ matrix.case }}'
          for i in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
