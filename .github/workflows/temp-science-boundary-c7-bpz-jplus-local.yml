name: Temp Science Boundary C7 BPZ Jplus local search

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-bpz-jplus-local.yml
      - science-boundary/shannon-capacity-c7/code/bpz_jplus_seed.py
      - science-boundary/shannon-capacity-c7/code/search_exact.cpp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-bpz-jplus-local
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned public sources read-only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7

          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD

      - name: Materialize BPZ Jplus seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jplus" "$RUNNER_TEMP/result"
          python3 science-boundary/shannon-capacity-c7/code/bpz_jplus_seed.py \
            "$RUNNER_TEMP/tan" \
            "$RUNNER_TEMP/jplus/certificate.json" \
            "$RUNNER_TEMP/result/seed-status.json"
          cat "$RUNNER_TEMP/result/seed-status.json"

      - name: Verify Jplus seed with Few Shots verifier
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/jplus" \
            | tee "$RUNNER_TEMP/result/seed-verify.json"
          python3 - "$RUNNER_TEMP/result/seed-verify.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1)) != 134753:
              raise SystemExit(f'Jplus seed verification failed: {r}')
          print('verified Jplus seed score=134753')
          PY

      - name: Prepare Jplus IDs and compile exact local search
        shell: bash
        run: |
          set -euo pipefail
          python3 temp-work/few-shots-p004/materialize.py extract \
            "$RUNNER_TEMP/jplus/certificate.json" \
            "$RUNNER_TEMP/jplus-ids.txt"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp \
            science-boundary/shannon-capacity-c7/code/search_exact.cpp \
            -o "$RUNNER_TEMP/search-exact"

      - name: Exact local search through remove-2-add-3 around Jplus
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          /usr/bin/time -v "$RUNNER_TEMP/search-exact" "$RUNNER_TEMP/jplus-ids.txt" \
            > "$RUNNER_TEMP/result/search.json" \
            2> "$RUNNER_TEMP/result/search.stderr"
          cat "$RUNNER_TEMP/result/search.json"
          tail -n 30 "$RUNNER_TEMP/result/search.stderr"

      - name: Materialize local candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shot"
          python3 temp-work/few-shots-p004/materialize.py build \
            "$RUNNER_TEMP/jplus/certificate.json" \
            "$RUNNER_TEMP/result/search.json" \
            "$RUNNER_TEMP/shot/certificate.json" \
            "$RUNNER_TEMP/result/search-status.json"
          cat "$RUNNER_TEMP/result/search-status.json"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify breakthrough with Few Shots verifier
        if: steps.candidate.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" \
            | tee "$RUNNER_TEMP/result/candidate-verify.json"
          python3 - "$RUNNER_TEMP/result/candidate-verify.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1)) <= 134753:
              raise SystemExit(f'candidate not a verified breakthrough: {r}')
          print(f"VERIFIED BREAKTHROUGH score={r['score']}")
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"

      - name: Upload reproducibility bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-bpz-jplus-local
          path: |
            ${{ runner.temp }}/result
            ${{ runner.temp }}/jplus/certificate.json
          retention-days: 14

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo '## C7 BPZ J+ seed and exact local search'
            for f in seed-status.json seed-verify.json search.json search-status.json candidate-verify.json; do
              if [[ -f "$RUNNER_TEMP/result/$f" ]]; then
                echo
                echo "### $f"
                echo '```json'
                cat "$RUNNER_TEMP/result/$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
