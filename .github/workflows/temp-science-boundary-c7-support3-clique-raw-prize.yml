name: Temp Science Boundary C7 support3 clique raw prize

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-support3-clique-raw-prize.yml
      - science-boundary/shannon-capacity-c7/code/bpz_support3_clique_raw_prize.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-support3-clique-raw-prize
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned BPZ source and install solvers
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          python3 -m pip install --disable-pip-version-check python-sat ortools
          mkdir -p "$RUNNER_TEMP/result"
      - name: Exact clique-compressed full support3 raw-core prize
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_support3_clique_raw_prize.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/raw-prize.json" \
            --workers 4 --time-limit 19800 \
            2>&1 | tee "$RUNNER_TEMP/result/raw-prize.stdout"
          cat "$RUNNER_TEMP/result/raw-prize.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-support3-clique-raw-prize
          path: ${{ runner.temp }}/result
          retention-days: 14
