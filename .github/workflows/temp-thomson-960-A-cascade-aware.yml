name: temp Thomson 960 A-centered cascade-aware scar walk

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-A-cascade-aware.yml'

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: A-inverse-orbit2
            quad: '35,323,79,134'
          - tag: A-soft-novel1
            quad: '379,959,295,923'
          - tag: A-inverse-orbit3
            quad: '74,363,21,230'
          - tag: A-soft-novel3
            quad: '319,699,283,615'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Search A-centered dependent topology paths
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) tag=${{ matrix.tag }} live=$live"
          python3 science-boundary/thomson-960/code/search_cascade_aware_scar_walk_beam.py \
            "$RUNNER_TEMP/seed/A-natural.json" --first-quad '${{ matrix.quad }}' --tag '${{ matrix.tag }}' \
            --live-score "$live" --depth 5 --beam 4 --branch 5 --max-graph-distance 2 \
            --remote-distance 2 --probe-kappa 100 --first-multiplier 1.003 --step-multiplier 1.01 \
            --fixed-maxiter 1300 --probe-maxiter 900 --release-maxiter 2600 \
            --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('TAG',d['tag'],'BEST',d['best_free_energy'],'DELTA',d['best_delta_live'],'CASCADE',d['best_cascade_effective'],'NODES',len(d['nodes']))
          for r in sorted(d['nodes'],key=lambda z:z['free_energy'])[:15]:
              print('END','d',r['depth'],'fix',r['fixed_energy'],'free',r['free_class'],r['free_energy'],
                    'cascade',r['cascade_effective'],'trig',r['cascade']['triggered_count'],
                    'path',[(m['delete'],m['add'],m['threshold']) for m in r['path']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-A-cascade-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 10
