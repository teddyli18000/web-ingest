name: Temp Science Boundary C7 k8 killer3 box CP-SAT

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-k8-killer3-box.yml
      - science-boundary/shannon-capacity-c7/code/bpz_k8_killer3_box_cpsat.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-k8-killer3-box
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned source and CP-SAT
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          python3 -m pip install --disable-pip-version-check ortools python-sat
          mkdir -p "$RUNNER_TEMP/result"
      - name: Exact global k8 positive defect with at most three killer colors
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_k8_killer3_box_cpsat.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/k8-killer3.json" \
            --seconds 19800 --workers 4 \
            2>&1 | tee "$RUNNER_TEMP/result/k8-killer3.stdout"
          cat "$RUNNER_TEMP/result/k8-killer3.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-k8-killer3-box
          path: ${{ runner.temp }}/result
          retention-days: 14
