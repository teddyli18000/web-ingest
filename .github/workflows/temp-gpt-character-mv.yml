# One-shot render trigger; remove this workflow after validated output.
name: Temporary GPT character MV render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "temp-work/gpt-signal-mv/render.py"
      - "temp-work/gpt-signal-mv/requirements.txt"

permissions:
  contents: read

concurrency:
  group: temp-gpt-character-mv
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: temp-work/gpt-signal-mv/requirements.txt

      - name: Install renderer dependencies
        run: python -m pip install -r temp-work/gpt-signal-mv/requirements.txt

      - name: Render film
        working-directory: temp-work/gpt-signal-mv
        run: python render.py --out out/gpt-between-the-next-word.mp4

      - name: Validate full decode and record manifest
        working-directory: temp-work/gpt-signal-mv
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -v error -i out/gpt-between-the-next-word.mp4 -f null -
          test -s out/gpt-between-the-next-word.mp4
          test -s out/gpt-between-the-next-word.poster.png
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "video_bytes=$(stat -c%s out/gpt-between-the-next-word.mp4)"
            sha256sum out/gpt-between-the-next-word.mp4 out/gpt-between-the-next-word.poster.png
          } > out/manifest.txt
          cat out/manifest.txt

      - name: Upload film artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpt-between-the-next-word-${{ github.run_id }}
          path: |
            temp-work/gpt-signal-mv/out/gpt-between-the-next-word.mp4
            temp-work/gpt-signal-mv/out/gpt-between-the-next-word.poster.png
            temp-work/gpt-signal-mv/out/manifest.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
