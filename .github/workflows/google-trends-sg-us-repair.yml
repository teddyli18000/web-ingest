name: Google Trends SG-US scope repair

on:
  push:
    branches:
      - agent/google-trends-sg-us
    paths:
      - ".github/workflows/google-trends-sg-us-repair.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: google-trends-sg-us-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test task code
        run: |
          python -m py_compile google-trends/*.py
          python -m unittest discover -s google-trends/tests -v

      - name: Prune archive to configured SG and US scope
        run: |
          python google-trends/prune_to_config.py
          python google-trends/render_readme.py
          python google-trends/validate_archive.py
          python tools/check-repository-integrity.py --show

      - name: Commit repaired archive
        run: |
          git add -A google-trends
          if git diff --cached --quiet; then
            echo "Archive already matches config."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "repair(google-trends): keep SG and US only"
          git pull --rebase origin agent/google-trends-sg-us
          git push origin HEAD:agent/google-trends-sg-us
