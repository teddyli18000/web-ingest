name: Temporary p015 soft 269 search
on:
  push:
    paths:
      - .github/workflows/temp-p015-soft.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temp-p015-soft
  cancel-in-progress: false
jobs:
  maxcoverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: 501, drop: 0}
          - {seed: 502, drop: 1}
          - {seed: 503, drop: 2}
          - {seed: 504, drop: 3}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OR-Tools
        run: python -m pip install ortools==9.14.6206
      - name: Obtain independent checker and baseline
        run: |
          curl -fsSL https://raw.githubusercontent.com/few-shots/few-shots/main/problems/p015-covering-15-9-7/baseline/certificate.json -o /tmp/p015-baseline.json
          curl -fsSL https://raw.githubusercontent.com/few-shots/few-shots/main/problems/p015-covering-15-9-7/verify/verify.py -o /tmp/p015-verify.py
      - name: Optimize all 5005 candidate blocks at fixed 269
        run: |
          python science-boundary/covering-15-9-7/soft269.py --input /tmp/p015-baseline.json --out p015-soft-result --drop ${{ matrix.drop }} --seed ${{ matrix.seed }} --seconds 950 --workers 4
          python /tmp/p015-verify.py p015-soft-result | tee p015-soft-result/upstream-verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p015-soft269-seed-${{ matrix.seed }}
          path: p015-soft-result/
