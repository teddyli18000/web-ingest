name: Google Trending - one-shot gap recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-trending-gap-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: google-trending-gap-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate recovery code
        run: |
          python -m py_compile google-trending/*.py temp-work/google-trending-gap-recovery/recover.py
          python -m unittest discover -s google-trending/tests -v

      - name: Recover verified gaps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python temp-work/google-trending-gap-recovery/recover.py

      - name: Validate archive and refresh dashboard
        run: |
          python google-trending/validate_archive.py
          python google-trending/render_readme.py

      - name: Commit recovery and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add google-trending/data google-trending/mirror-manifest.json google-trending/README.md
          git rm -r temp-work/google-trending-gap-recovery .github/workflows/google-trending-gap-recovery.yml

          if git diff --cached --quiet; then
            echo "No recovery changes to commit."
            exit 0
          fi

          git commit -m "data(google-trending): recover verified gaps"
          git pull --rebase origin main
          git push origin HEAD:main
