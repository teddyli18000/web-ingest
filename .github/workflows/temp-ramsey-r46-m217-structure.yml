name: Temp Ramsey R46 217-edge structural reduction

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/m217_structure.py
      - .github/workflows/temp-ramsey-r46-m217-structure.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-m217-structure
  cancel-in-progress: false

jobs:
  reduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self-test exact counting logic
        run: python science-boundary/ramsey-r46/m217_structure.py self-test
      - name: Fetch complete public catalogues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r35_12.g6 \
            -o /tmp/r46/r35_12.g6
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r36_13.g6.gz \
            -o /tmp/r46/r36_13.g6.gz
          echo '12d94cdedc18c56f55cc1fc08ddad4852f43e5d3ea20bf0e00cdbedfc5036604  /tmp/r46/r36_13.g6.gz' | sha256sum -c -
          sha256sum /tmp/r46/r35_12.g6 /tmp/r46/r36_13.g6.gz | tee /tmp/r46/sources.sha256
      - name: Run exact structural reduction
        shell: bash
        run: |
          set -euo pipefail
          python science-boundary/ramsey-r46/m217_structure.py scan \
            --r35-12 /tmp/r46/r35_12.g6 \
            --r36-13 /tmp/r46/r36_13.g6.gz \
            --output /tmp/r46/result.json
          python3 - /tmp/r46/result.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['edge_relaxation_first_feasible']==216
          assert d['m216_only_degree_sequence']=={'12':36}
          assert d['m217_only_degree_sequence']=={'12':34,'13':2}
          assert d['m217_degree13_vertices_adjacent_impossible']['contradiction'] is True
          assert d['r35_12']['records']==12 and d['r35_12']['max_edges']==24
          assert d['r36_13']['records']==275086
          print(json.dumps({
            'm217_only_degree_sequence':d['m217_only_degree_sequence'],
            'filtered_count':d['r36_13']['filtered_all_degrees_4_or_5_edges_ge_27_count'],
            'filtered_hist':d['r36_13']['filtered_edge_histogram'],
          },sort_keys=True))
          PY
      - name: Persist evidence and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/m217-structure.json
          git rm .github/workflows/temp-ramsey-r46-m217-structure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/m217-structure.json
          git commit -m 'ramsey-r46: record exact 217-edge structural reduction'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-m217-structure
          path: /tmp/r46
          if-no-files-found: warn
          retention-days: 7
