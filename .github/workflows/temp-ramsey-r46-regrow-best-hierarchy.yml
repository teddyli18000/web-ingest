name: Temp Ramsey R46 nested regrow hierarchy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-ramsey-r46-regrow-best-hierarchy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - tag: k3
            vertices: '2 35 13'
          - tag: k4
            vertices: '2 35 13 5'
          - tag: k5
            vertices: '2 35 13 5 9'
          - tag: k6
            vertices: '2 35 13 5 9 10'
          - tag: k7
            vertices: '2 35 13 5 9 10 34'
          - tag: k8
            vertices: '2 35 13 5 9 10 34 25'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact regrow CNF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 science-boundary/ramsey-r46/regrow_vertices_sat.py generate \
            science-boundary/ramsey-r46/results/methodb36-best.json \
            /tmp/r46/regrow.cnf /tmp/r46/meta.json ${{ matrix.vertices }}
          head -n 1 /tmp/r46/regrow.cnf
      - name: Build pinned Kissat 4.0.4
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/arminbiere/kissat.git "$RUNNER_TEMP/kissat"
          git -C "$RUNNER_TEMP/kissat" checkout --quiet 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cd "$RUNNER_TEMP/kissat" && ./configure >/dev/null && make -j2 >/dev/null
      - name: Solve exact nested regrow
        id: solve
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=15s 900 "$RUNNER_TEMP/kissat/build/kissat" /tmp/r46/regrow.cnf > /tmp/r46/solver.log 2>&1
          rc=$?
          set -e
          case "$rc" in 10) status=SAT;; 20) status=UNSAT;; 124|137|143) status=TIMEOUT;; *) status=ERROR;; esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 - /tmp/r46/meta.json /tmp/r46/summary.json "$status" "$rc" '${{ matrix.tag }}' <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); d.update(campaign='methodb36-best-nested-regrow',status=sys.argv[3],solver_exit=int(sys.argv[4]),tag=sys.argv[5])
          open(sys.argv[2],'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'tag':d['tag'],'removed':d['removed'],'variables':d['variables'],'clauses':d['clauses'],'status':d['status']},sort_keys=True))
          PY
          tail -n 20 /tmp/r46/solver.log || true
          test "$status" != ERROR
      - name: Decode and locally verify SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/ramsey-r46/regrow_vertices_sat.py decode \
            science-boundary/ramsey-r46/results/methodb36-best.json /tmp/r46/meta.json /tmp/r46/solver.log /tmp/r46/candidate.json
          python3 science-boundary/ramsey-r46/regrow_vertices_sat.py verify /tmp/r46/candidate.json
      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate && cp /tmp/r46/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/few-shots-verify.json
          python3 - /tmp/r46/few-shots-verify.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d.get('valid') is True and str(d.get('score'))=='36',d
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-best-regrow-${{ matrix.tag }}
          path: /tmp/r46
          retention-days: 7

  collect:
    if: always()
    needs: solve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-best-regrow-k*
          path: /tmp/parts
      - name: Aggregate hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          rows=[json.load(open(p)) for p in pathlib.Path('/tmp/parts').rglob('summary.json')]
          rows.sort(key=lambda d:len(d['removed']))
          out={'campaign':'methodb36-best-nested-regrow','expected':6,'rows':rows,'complete':len(rows)==6,
               'sat_count':sum(r['status']=='SAT' for r in rows),'unsat_count':sum(r['status']=='UNSAT' for r in rows),
               'timeout_count':sum(r['status']=='TIMEOUT' for r in rows)}
          pathlib.Path('science-boundary/ramsey-r46/results/methodb36-best-nested-regrow.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          for p in pathlib.Path('/tmp/parts').rglob('candidate.json'):
            tag=p.parent.name.removeprefix('ramsey-r46-best-regrow-')
            pathlib.Path(f'science-boundary/ramsey-r46/results/methodb36-best-regrow-{tag}-candidate.json').write_bytes(p.read_bytes())
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},sort_keys=True))
          PY
          git rm .github/workflows/temp-ramsey-r46-regrow-best-hierarchy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/methodb36-best-*
          git commit -m 'ramsey-r46: record nested best-nearmiss regrow hierarchy' || exit 0
          for attempt in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((attempt*4)); done
          exit 1
