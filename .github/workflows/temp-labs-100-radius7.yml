name: temp labs-100 radius 7

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-labs-100-radius7.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-labs-100-radius7
  cancel-in-progress: false

jobs:
  exact-radius7:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust exact Hamming radius 7
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20 -fopenmp -DNDEBUG \
            science-boundary/labs-100/code/sphere_shell.cpp \
            -o /tmp/labs100-sphere-shell
          incumbent='++++++--+++++-----++-++--+--++++++++++---+-++--++++-+--++----+--+-+-+-+-++---++---++-+-++-+-++--+-+-'
          /tmp/labs100-sphere-shell "$incumbent" 7 | tee /tmp/radius7.txt
          grep -F 'BASE energy=578' /tmp/radius7.txt
          grep -F 'RADIUS radius=7 tested=16007560800 ' /tmp/radius7.txt
      - name: Upload exact-shell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-radius7
          path: /tmp/radius7.txt
          if-no-files-found: warn
