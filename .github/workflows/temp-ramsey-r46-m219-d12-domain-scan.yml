name: Temp Ramsey R46 m219 d12 domain scan

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/m219_d12_domain_scan.py
      - .github/workflows/temp-ramsey-r46-m219-d12-domain-scan.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download authenticated R(3,6,12) catalogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          curl --fail --location --retry 4 --silent --show-error https://users.cecs.anu.edu.au/~bdm/data/r36_12.g6.gz -o /tmp/r46/r36_12.g6.gz
          echo '17e176a0f7e7397dbca7c9cb6295034dd74cf529ca62e7e717226dc1b0b7b96d  /tmp/r46/r36_12.g6.gz' | sha256sum -c -
      - name: Scan exact local domains
        shell: bash
        run: |
          set -euo pipefail
          python science-boundary/ramsey-r46/m219_d12_domain_scan.py --catalog /tmp/r46/r36_12.g6.gz --output /tmp/r46/result.json | tee /tmp/r46/summary.txt
      - name: Persist evidence and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/m219-d12-domain-scan.json
          git rm .github/workflows/temp-ramsey-r46-m219-d12-domain-scan.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/m219-d12-domain-scan.json
          git commit -m 'ramsey-r46: record d12 A28/A29 domain scan'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-m219-d12-domain-scan
          path: /tmp/r46
          retention-days: 7
