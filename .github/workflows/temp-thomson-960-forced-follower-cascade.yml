name: temp Thomson 960 forced follower cascade

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-forced-follower-cascade.yml'

jobs:
  intervene:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: alt-only
            sequence: 'alt'
          - tag: alt-o3
            sequence: 'alt,o3'
          - tag: alt-o2
            sequence: 'alt,o2'
          - tag: alt-o3-o2
            sequence: 'alt,o3,o2'
          - tag: o3-alt-o2
            sequence: 'o3,alt,o2'
          - tag: o3-o2-alt
            sequence: 'o3,o2,alt'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-dependent-orbit4-1.04
          path: ${{ runner.temp }}/two
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41058090920
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Force follower order and release
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) tag=${{ matrix.tag }} seq=${{ matrix.sequence }} live=$live"
          python3 science-boundary/thomson-960/code/search_forced_follower_cascade.py \
            "$RUNNER_TEMP/two/result.json" --sequence '${{ matrix.sequence }}' \
            --q3-multiplier 1.04 --follower-multiplier 1.01 \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          f=d['final']
          print('SEQ',d['sequence'],'APPLIED',d['applied'],'FINAL',f['class'],f['energy'],'DELTA',f['delta_live'],'CC',f['coord_counts'])
          print('FOLLOWERS',f['followers'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-forced-follower-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 10
