name: Temp GPT MV character lab

on:
  push:
    paths:
      - "temp-work/gpt-mv-code-native/assets/gpt/bust_v3.webp"
      - "temp-work/gpt-mv-code-native/src/components/gpt_bust_plate.js"
      - "temp-work/gpt-mv-code-native/src/character_lab.js"
      - "temp-work/gpt-mv-code-native/character_lab.html"
      - "temp-work/gpt-mv-code-native/export/character_lab.mjs"
      - ".github/workflows/temp-gpt-mv-character-lab.yml"
  workflow_dispatch:

concurrency:
  group: temp-gpt-mv-character-lab
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: temp-work/gpt-mv-code-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer dependency
        run: |
          npm install --no-audit --no-fund
          echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Render 1080p clean character lab
        run: node export/character_lab.mjs out/gpt_character_lab.png
      - name: Validate image contract
        run: |
          set -euo pipefail
          test -s out/gpt_character_lab.png
          test -s out/gpt_character_lab.json
          grep -q 'gpt-bust-matted-v5' out/gpt_character_lab.json
          python - <<'PY'
          import struct
          p='out/gpt_character_lab.png'
          with open(p,'rb') as f:
              sig=f.read(24)
          assert sig[:8] == b'\x89PNG\r\n\x1a\n', 'not png'
          w,h=struct.unpack('>II',sig[16:24])
          print('png_size',w,h)
          assert (w,h)==(1920,1080), (w,h)
          import json
          with open('out/gpt_character_lab.json') as f:
              stats=json.load(f)['alpha']
          assert stats['width']==550 and stats['height']==640
          assert stats['transparent']>0 and stats['opaque']>0
          left,top,right,bottom=stats['bounds']
          assert 0<=left<right<=550 and 0<=top<bottom<=640
          print('alpha',stats)
          assert not stats['edgeLeakLikely'], 'character plate still contains rectangular background/edge contamination'
          PY
      - name: Upload visual gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mv-character-lab-${{ github.run_id }}
          path: |
            temp-work/gpt-mv-code-native/out/gpt_character_lab.png
            temp-work/gpt-mv-code-native/out/gpt_character_lab.json
            temp-work/gpt-mv-code-native/assets/gpt/bust_v3.webp
          retention-days: 14
          if-no-files-found: error
