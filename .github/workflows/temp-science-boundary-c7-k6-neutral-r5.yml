name: Temp Science Boundary C7 neutral mother net1 through r5

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-k6-neutral-r5.yml
      - science-boundary/shannon-capacity-c7/code/bpz_k6_neutral_best_seed.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-k6-neutral-r5
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned sources and rebuild verified neutral mother
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
          python3 science-boundary/shannon-capacity-c7/code/bpz_k6_neutral_best_seed.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/base/certificate.json" "$RUNNER_TEMP/result/seed.json"
          python3 - "$RUNNER_TEMP/base/certificate.json" "$RUNNER_TEMP/base/ids.txt" <<'PY'
          import json,sys
          pts=json.load(open(sys.argv[1],encoding='utf-8'))['points']
          if len(pts)!=134753 or len(set(pts))!=134753: raise SystemExit(('seed drift',len(pts),len(set(pts))))
          open(sys.argv[2],'w').write(''.join(f'{int(p,7)}\n' for p in pts))
          PY
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/base" | tee "$RUNNER_TEMP/result/seed-verify.json"
          python3 - "$RUNNER_TEMP/result/seed-verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1))!=134753: raise SystemExit(r)
          if r.get('canonical_hash')!='636cbc9a3368fccd6bac3155aa0a73eaf9ddd5d9f053ba74ca00f748437b9d94': raise SystemExit(('hash drift',r))
          PY
      - name: Exact unrestricted net1 through radius4
        id: r4
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/patch_search_net1_r4_compile.py \
            science-boundary/shannon-capacity-c7/code/search_net1_r4_complete.cpp "$RUNNER_TEMP/net1-r4.cpp"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp "$RUNNER_TEMP/net1-r4.cpp" -o "$RUNNER_TEMP/net1-r4"
          export OMP_NUM_THREADS="$(nproc)"
          /usr/bin/time -v "$RUNNER_TEMP/net1-r4" "$RUNNER_TEMP/base/ids.txt" > "$RUNNER_TEMP/result/r4.json" 2> "$RUNNER_TEMP/result/r4.stderr"
          cat "$RUNNER_TEMP/result/r4.json"
          tail -n 100 "$RUNNER_TEMP/result/r4.stderr"
          python3 - "$RUNNER_TEMP/result/r4.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          with open(sys.argv[2],'a') as f:f.write(f"found={'true' if r.get('kind')!='none' else 'false'}\n")
          PY
      - name: Build exact net1 radius5 solvers
        if: steps.r4.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/patch_r5_net2_to_net1.py direct \
            science-boundary/shannon-capacity-c7/code/search_net2_r5_direct.cpp "$RUNNER_TEMP/net1-r5-direct.cpp"
          python3 science-boundary/shannon-capacity-c7/code/patch_r5_net2_to_net1.py lower \
            science-boundary/shannon-capacity-c7/code/search_net2_r5_lower.cpp "$RUNNER_TEMP/net1-r5-lower.cpp"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp "$RUNNER_TEMP/net1-r5-direct.cpp" -o "$RUNNER_TEMP/net1-r5-direct"
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp "$RUNNER_TEMP/net1-r5-lower.cpp" -o "$RUNNER_TEMP/net1-r5-lower"
      - name: Exact net1 radius5 direct coverage5-owner sets
        id: r5direct
        if: steps.r4.outputs.found != 'true'
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          /usr/bin/time -v "$RUNNER_TEMP/net1-r5-direct" "$RUNNER_TEMP/base/ids.txt" > "$RUNNER_TEMP/result/r5-direct.json" 2> "$RUNNER_TEMP/result/r5-direct.stderr"
          cat "$RUNNER_TEMP/result/r5-direct.json"
          tail -n 100 "$RUNNER_TEMP/result/r5-direct.stderr"
          python3 - "$RUNNER_TEMP/result/r5-direct.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys;r=json.load(open(sys.argv[1]));open(sys.argv[2],'a').write(f"found={'true' if r.get('kind')!='none' else 'false'}\n")
          PY
      - name: Exact net1 radius5 connected lower-support owner sets
        id: r5lower
        if: steps.r4.outputs.found != 'true' && steps.r5direct.outputs.found != 'true'
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          /usr/bin/time -v "$RUNNER_TEMP/net1-r5-lower" "$RUNNER_TEMP/base/ids.txt" > "$RUNNER_TEMP/result/r5-lower.json" 2> "$RUNNER_TEMP/result/r5-lower.stderr"
          cat "$RUNNER_TEMP/result/r5-lower.json"
          tail -n 100 "$RUNNER_TEMP/result/r5-lower.stderr"
          python3 - "$RUNNER_TEMP/result/r5-lower.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys;r=json.load(open(sys.argv[1]));open(sys.argv[2],'a').write(f"found={'true' if r.get('kind')!='none' else 'false'}\n")
          PY
      - name: Materialize first breakthrough
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/base/ids.txt" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot/certificate.json" "$GITHUB_OUTPUT" <<'PY'
          import json,os,sys
          bp,rd,outp,gout=sys.argv[1:]
          base=set(int(x) for x in open(bp) if x.strip()); hit=None
          for fn in ('r4.json','r5-direct.json','r5-lower.json'):
              p=os.path.join(rd,fn)
              if not os.path.exists(p): continue
              s=json.load(open(p,encoding='utf-8'))
              if s.get('kind')!='none': hit=s;break
          found=False
          if hit:
              rem=list(map(int,hit.get('remove',[])));add=list(map(int,hit.get('add',[])))
              if any(x not in base for x in rem):raise SystemExit(('bad removals',hit))
              cur=base-set(rem)
              if any(x in cur for x in add):raise SystemExit(('bad additions',hit))
              cur.update(add)
              if len(cur)!=134754:raise SystemExit(('score',len(cur),hit))
              def enc(z):
                  d=[]
                  for _ in range(10):d.append(str(z%7));z//=7
                  return ''.join(reversed(d))
              json.dump({'points':[enc(z) for z in sorted(cur)]},open(outp,'w',encoding='utf-8'),separators=(',',':'));open(outp,'a').write('\n');found=True
          with open(gout,'a') as f:f.write(f"found={'true' if found else 'false'}\n")
          PY
      - name: Verify breakthrough with Few Shots verifier
        if: steps.materialize.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys;r=json.load(open(sys.argv[1]));
          if not r.get('valid') or int(r.get('score',-1))<134754:raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-k6-neutral-net1-r5
          path: ${{ runner.temp }}/result
          retention-days: 14
