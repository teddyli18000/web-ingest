name: Temp GPT MV review exporter check

on:
  push:
    paths:
      - "temp-work/gpt-mv-reboot/hero/review.py"
      - "temp-work/gpt-mv-reboot/hero/render.py"
      - "temp-work/gpt-mv-reboot/hero/render_v2.py"
      - "temp-work/gpt-mv-reboot/hero/sequence.py"
      - "temp-work/gpt-mv-reboot/hero/requirements.txt"
      - ".github/workflows/temp-gpt-mv-review-check.yml"
  workflow_dispatch:

concurrency:
  group: temp-gpt-mv-review-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check -r temp-work/gpt-mv-reboot/hero/requirements.txt
      - name: Render exact review sheet
        run: |
          python temp-work/gpt-mv-reboot/hero/review.py \
            --fixtures --width 320 --height 180 --fps 12 \
            --sheet temp-work/gpt-mv-reboot/out/review/check.jpg \
            --times 1.0,12.8,31.6,37.5,43.5,52.8 --cols 3
      - name: Render one absolute-time segment
        run: |
          python temp-work/gpt-mv-reboot/hero/review.py \
            --fixtures --width 640 --height 360 --fps 12 \
            --segment temp-work/gpt-mv-reboot/out/review/return.mp4 \
            --start 30.45 --end 33.10
      - name: Validate segment
        run: |
          set -euo pipefail
          out=temp-work/gpt-mv-reboot/out/review/return.mp4
          ffmpeg -v error -i "$out" -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=nw=1 "$out"
          test -s temp-work/gpt-mv-reboot/out/review/check.jpg
          python - <<'PY'
          import json, subprocess
          p='temp-work/gpt-mv-reboot/out/review/return.mp4'
          d=float(json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',p]))['format']['duration'])
          assert 2.55 <= d <= 2.75, d
          print('segment_duration_ok', d)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-mv-review-exporter-${{ github.run_id }}
          path: temp-work/gpt-mv-reboot/out/review/
          retention-days: 7
