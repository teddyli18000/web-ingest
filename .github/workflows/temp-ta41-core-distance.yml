name: temp-ta41-core-distance
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/core_hitting_set.py'
      - '.github/workflows/temp-ta41-core-distance.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-core-distance
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact covering backend
        run: python -m pip install 'ortools==9.14.6206'
      - name: Extract disjoint-core certificates and solve minimum hitting set
        run: |
          python3 science-boundary/job-shop-ta41/core_hitting_set.py --seconds 150
      - name: Save computational proof evidence on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/core-distance.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): certify lower bound on incumbent escape distance'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
