name: temp Thomson 960 C3 replica-exchange genetic record hunt

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-c3-replica-genetic.yml'

jobs:
  c3-genetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    strategy:
      fail-fast: false
      matrix:
        seed: [72701, 72702, 72703]
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: few-shots/few-shots
          path: few-shots
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy numba
      - name: Compile C3 symmetry constrained recombination and smoke test
        run: |
          python3 -m py_compile science-boundary/thomson-960/code/search_c3_replica_genetic.py
          python3 science-boundary/thomson-960/code/search_c3_replica_genetic.py \
            few-shots --seed ${{ matrix.seed }} --sweeps 2 --maxiter 400 \
            --out "$RUNNER_TEMP/smoke"
      - name: Search new C3 orbit arrangements by six-temperature replica + genetic crossover
        run: |
          python3 science-boundary/thomson-960/code/search_c3_replica_genetic.py \
            few-shots --seed ${{ matrix.seed }} --sweeps 115 --maxiter 670 \
            --out "$RUNNER_TEMP/out"
      - name: Evaluate true 960-energy output and whether donor combination worked
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for p in (root/'smoke'/'result.json',root/'out'/'result.json'):
              if not p.exists(): print('MISSING',p);continue
              d=json.loads(p.read_text())
              print('RESULT',p.parent.name,'seed',d['seed'],
                    'sweeps',d['sweeps_done'],'best_c3',d['best_c3'],
                    'best_full',d['best_full'],
                    'full_releases',d['full_releases'],
                    'candidates',d['subrecord_candidates'],
                    'new_full',d['new_full_basins'])
              print('C3_ELITES',[(z['energy'],z['tag']) for z in d['c3_elites']])
              print('FULL_ELITES',d['full_elites'])
              for m in ('scar-flow','scar-noise','global-noise',
                        'cut-splice','registered-patch'):
                  z=[r for r in d['rows'] if r['mode']==m]
                  print('OP',m,'n',len(z),
                        'best',min((r['energy_c3'] for r in z),default=None),
                        'new_c3',sum(r['c3_unique'] for r in z))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-c3-replica-genetic-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/out
            ${{ runner.temp }}/smoke
          retention-days: 10
