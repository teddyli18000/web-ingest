name: temp-ta41-whole-machine-core-construction
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-whole-machine-core-construction.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-whole-machine-core-construction
  cancel-in-progress: false
jobs:
  construct:
    strategy:
      fail-fast: false
      matrix:
        case: [ta43js-n7elite1711, ta46js-n7elite1701, ta41]
        policy: [dynamic, static, random]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check complete machine-free partial order construction
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/whole_machine_release_ihs.py
      - name: Full 29-adjacency release per selected machine and 20-machine joint exact completion
        run: |
          c='${{ matrix.case }}'
          if test "$c" = ta41; then src=ta41; else src="science-boundary/job-shop-ta41/positive-n7-elite-data/$c/start.txt"; fi
          python3 science-boundary/job-shop-ta41/whole_machine_release_ihs.py \
            --start "$src" --policy '${{ matrix.policy }}' \
            --seed 20261108 --per-stage 18 \
            --cp-seconds 1.4 --master-seconds 0.30 --seconds 165 \
            --out "science-boundary/job-shop-ta41/results/whole-machine-${{ matrix.case }}-${{ matrix.policy }}"
      - name: Official Few Shots if a ta41 record exists
        if: always()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/whole-machine-${{ matrix.case }}-${{ matrix.policy }}"
          if test '${{ matrix.case }}' = ta41 && test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist full exact reconstruction and conditional core diagnostics
        if: always()
        run: |
          set -euo pipefail
          dir="science-boundary/job-shop-ta41/results/whole-machine-${{ matrix.case }}-${{ matrix.policy }}"
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(ta41): full machine-order release ${{ matrix.case }} ${{ matrix.policy }}"
          for attempt in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
