name: temp Thomson 960 weighted A-H transition state

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-weighted-ah-transition-state.yml'

jobs:
  transition-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Static check
        run: |
          python3 -m py_compile \
            science-boundary/thomson-960/code/string_n961_weighted_simplex.py \
            science-boundary/thomson-960/code/refine_n961_weighted_saddle.py \
            science-boundary/thomson-960/code/validate_n961_weighted_edge.py
      - uses: actions/download-artifact@v4
        with:
          pattern: thomson-three-occupancy-simplex-*
          path: ${{ runner.temp }}/simplex
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41198272370
      - name: Weighted geodesic string
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 science-boundary/thomson-960/code/string_n961_weighted_simplex.py \
            "$RUNNER_TEMP/simplex/thomson-three-occupancy-simplex-A960/result.json" \
            "$RUNNER_TEMP/simplex/thomson-three-occupancy-simplex-H380/result.json" \
            --images 11 --iterations 260 --climb-iterations 180 \
            --out "$RUNNER_TEMP/out/string.json"
      - name: Refine to weighted index-one stationary point
        run: |
          python3 science-boundary/thomson-960/code/refine_n961_weighted_saddle.py \
            "$RUNNER_TEMP/out/string.json" --outer 8 --k 6 \
            --out "$RUNNER_TEMP/out/refined.json"
      - name: Independently classify Hessian sides and N960 exits
        run: |
          python3 science-boundary/thomson-960/code/validate_n961_weighted_edge.py \
            "$RUNNER_TEMP/out/refined.json" \
            "$RUNNER_TEMP/simplex/thomson-three-occupancy-simplex-A960/result.json" \
            "$RUNNER_TEMP/simplex/thomson-three-occupancy-simplex-H380/result.json" \
            --k 14 --amps '.00003,.00006,.00012,.00025,.0005' \
            --live-score 444368.3924061973 --out "$RUNNER_TEMP/out/validated.json"
      - name: Summarize
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          for name in ('string.json','refined.json','validated.json'):
              f=p/name
              if not f.exists():
                  print(name,'MISSING'); continue
              d=json.load(open(f))
              print('\n===',name,'===')
              if name=='string.json':
                  print('string climbing',d['climbing_energy'],'grad',d['climbing_gradient_rms'],'perp',d['climbing_perpendicular_gradient_rms'])
                  print('path max perp',max(d['path_perpendicular_gradient_rms']))
              elif name=='refined.json':
                  print('refined',d['final_energy'],'grad',d['final_gradient_rms'],'neg',d['negative_internal_modes_below_-1e-3'])
                  print('lows',d['final_eigenvalues'][:8])
              else:
                  print('validated seed grad',d['seed_physical_gradient_rms'],'neg',d['negative_modes'])
                  print('eigs',d['eigenvalues'][:8])
                  print('best projection',d['best_projection'])
                  sheets={r['weighted_class'] for r in d['descent_rows']}
                  print('descended sheets',sorted(sheets))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-weighted-ah-transition-state
          path: ${{ runner.temp }}/out
          retention-days: 10
