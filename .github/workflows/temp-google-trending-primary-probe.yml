name: temp-google-trending-primary-probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-google-trending-primary-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compare primary locale variants
        shell: bash
        run: |
          set -euo pipefail
          for geo in SG US GB HK; do
            for hl in en en-US; do
              out="$RUNNER_TEMP/$geo-$hl.json"
              npx --yes google-trends-now@1.1.1 trending \
                --geo "$geo" --hours 24 --sort relevance --limit all \
                --format json --fallback none --retries 2 --timeout-ms 30000 \
                --hl "$hl" > "$out"
              node - "$geo" "$hl" "$out" <<'NODE'
          const fs = require("fs");
          const [geo, hl, file] = process.argv.slice(2);
          const x = JSON.parse(fs.readFileSync(file, "utf8"));
          console.log(JSON.stringify({
            geo, hl,
            source: x.source,
            fetch_status: x.fetch_status,
            error: x.error ?? null,
            item_count: Array.isArray(x.items) ? x.items.length : null,
            raw_shape: Array.isArray(x.raw) ? x.raw.map(v => Array.isArray(v) ? v.length : typeof v) : null
          }));
          NODE
            done
          done
