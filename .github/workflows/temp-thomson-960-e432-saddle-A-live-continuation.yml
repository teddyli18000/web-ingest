name: temp Thomson 960 e432 saddle A live continuation

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-e432-saddle-A-live-continuation.yml'

jobs:
  continue:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: near-A
            ts: '0.35,0.50,0.65,0.78,0.88'
          - tag: near-R
            ts: '0.90,0.96,1.0,1.04,1.10'
          - tag: beyond-R1
            ts: '1.15,1.25,1.38,1.52,1.70'
          - tag: beyond-R2
            ts: '1.85,2.05,2.30,2.60,3.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-B-refined-saddle
          path: ${{ runner.temp }}/saddle
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41045248541
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Continue A direction through current record
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "nproc=$(nproc) tag=${{ matrix.tag }} ts=${{ matrix.ts }}"
          python3 science-boundary/thomson-960/code/search_saddle_A_live_continuation.py \
            "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/saddle/refined.json" \
            "$RUNNER_TEMP/seed/A-natural.json" "$RUNNER_TEMP/seed/live.json" \
            --ts '${{ matrix.ts }}' --scales '0.90,0.97,1.0,1.03,1.10' \
            --maxiter 3000 --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('GEOM A_RMS',d['A_rms'],'R_RMS',d['R_rms'],'DELTA_RMS',d['A_to_R_delta_rms'],'COS',d['cos_A_R'])
          print('BEST',d['best_energy'],'DELTA',d['best_delta_vs_live'])
          for b in d['distinct_low_basins'][:20]: print('BASIN',b['energy'],b['delta_vs_live'],b['coord_counts'],'t',b['t'],'s',b['scale'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e432-saddle-A-live-${{ matrix.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 10
