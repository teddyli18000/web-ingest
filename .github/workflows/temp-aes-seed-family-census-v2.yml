name: temp-aes-seed-family-census-v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/seed_family_census.py'
      - '.github/workflows/temp-aes-seed-family-census-v2.yml'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and fingerprint public AES seed families
        run: |
          set -euxo pipefail
          python science-boundary/aes-sbox-circuit/seed_family_census.py --out seed-family-census-v2.json
          python - <<'PY'
          import json
          x=json.load(open('seed-family-census-v2.json'))
          assert len(x['seeds']) >= 10
          assert all(v['verified_all_256'] for v in x['seeds'].values())
          assert x['seeds']['fs-101']['gates']==101
          assert x['seeds']['nist-a33-g105']['gates']==105
          assert x['seeds']['jain-106-d34']['gates']==106
          print('census_v2_validation=ok')
          for name,s in sorted(x['seeds'].items(), key=lambda kv:(kv[1]['gates'],kv[0])):
              print(name,s['gates'],s['ops'],s['recursive_and_shape_hash'][:16])
          print('REFERENCE_PAIRS')
          for k,v in sorted(x['pairs'].items()):
              if ('fs-101' in k or 'nist-a32-g104' in k or 'jain-106-d34' in k):
                  print(k,v)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aes-seed-family-census-v2
          path: seed-family-census-v2.json
