name: Temp Science Boundary C7p5 exact zero-orbit alpha census

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7p5-zero-orbit-alpha.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7p5-zero-orbit-alpha
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install exact solver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check python-sat
          mkdir -p "$RUNNER_TEMP/result"

      - name: Exact 50-orbit independence census on all cores
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/c7p5_zero_orbit_alpha_census.py \
            "$RUNNER_TEMP/result/orbits.json" --workers "$(nproc)" \
            > "$RUNNER_TEMP/result/stdout.txt" 2> "$RUNNER_TEMP/result/stderr.txt"
          cat "$RUNNER_TEMP/result/stdout.txt"
          tail -n 200 "$RUNNER_TEMP/result/stderr.txt"
          python3 - "$RUNNER_TEMP/result/orbits.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if r.get('orbit_count')!=50 or r.get('partition_vertices')!=16564:
              raise SystemExit(r)
          print('alpha<8 orbit indices',r['alpha_lt8'])
          PY

      - name: Upload exact census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7p5-zero-orbit-alpha
          path: ${{ runner.temp }}/result
          if-no-files-found: warn
          retention-days: 14
