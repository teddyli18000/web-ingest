name: One-shot shared supervisor smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-cloud-supervisor-smoke.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch production shared supervisor for live no-op/slot audit
        run: gh workflow run cloud-drive-supervisor.yml --ref main --repo "$GITHUB_REPOSITORY"
