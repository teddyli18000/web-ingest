name: temp C7p5 circular 367 full two-layer neutral walks

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7p5-circular-layer-walk.yml
      - science-boundary/shannon-capacity-c7/code/c7p5_circular_two_layer_walk.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-c7p5-circular-layer-walk
  cancel-in-progress: false

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        random_seed: [2026110501, 2026110502, 2026110503, 2026110504]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact block-MIS optimizer
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Solve all adjacent two-layer blocks from independent new 367 source
        run: |
          mkdir -p /tmp/c7-circular-walk
          python science-boundary/shannon-capacity-c7/code/c7p5_circular_two_layer_walk.py \
            science-boundary/shannon-capacity-c7/data/circular-phase-367-2026-11-04.json \
            /tmp/c7-circular-walk/status.json \
            /tmp/c7-circular-walk/certificate.json \
            /tmp/c7-circular-walk/farthest367.ids \
            --random-seed "${{ matrix.random_seed }}" --sweeps 4 --seconds 6
      - name: Verify any new p004 certificate independently and upstream
        run: |
          if test -s /tmp/c7-circular-walk/certificate.json; then
            mkdir -p /tmp/c7-circular-walk/shot
            cp /tmp/c7-circular-walk/certificate.json /tmp/c7-circular-walk/shot/certificate.json
            git clone --quiet --depth 1 https://github.com/few-shots/few-shots.git /tmp/c7-fewshots
            python /tmp/c7-fewshots/problems/p004-shannon-capacity-c7/verify/verify.py /tmp/c7-circular-walk/shot
          else
            echo 'No 368-point five-dimensional source found.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7p5-circular-layer-walk-${{ matrix.random_seed }}
          path: |
            /tmp/c7-circular-walk/status.json
            /tmp/c7-circular-walk/farthest367.ids
            /tmp/c7-circular-walk/certificate.json
          retention-days: 14
