name: temp-ta41-coupled-precedence
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/coupled_precedence.py'
      - '.github/workflows/temp-ta41-coupled-precedence.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-coupled-precedence
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Certify minimum collateral changes for every critical arc
        run: |
          python3 science-boundary/job-shop-ta41/coupled_precedence.py --out science-boundary/job-shop-ta41/results/coupled-precedence.json
      - name: Save exact analysis on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/coupled-precedence.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): certify critical-arc coupling and reversal bounds'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
