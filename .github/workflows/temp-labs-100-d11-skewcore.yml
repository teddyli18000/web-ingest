name: temp labs-100 d11 skew-core exact search

on:
  push:
    paths:
      - 'science-boundary/labs-100/code/skewcore_d11_bnb.cpp'
      - '.github/workflows/temp-labs-100-d11-skewcore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d11-target:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bits: ['--++--++-', '++++-+-+-', '-+++-+++-', '---++-++-', '+-++---+-', '+-+----+-', '--+---++-', '-+--++++-', '-+-+++++-', '-++--+++-', '----+-++-', '++-+++-+-', '+--++--+-', '+++--+-+-', '++--++-+-', '+---+--+-']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact E<=574 feasibility in large normalized d=11 skew89 branches
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20 -fopenmp -DNDEBUG \
            science-boundary/labs-100/code/skewcore_d11_bnb.cpp -o /tmp/d11
          /tmp/d11 --bits '${{ matrix.bits }}' --cap 524 \
            --threads "$(nproc)" --split 12 --seconds 1500
