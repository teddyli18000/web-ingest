name: temp-ta41-independent-cardinality-decision
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/independent_cardinality_decision.py'
      - '.github/workflows/temp-ta41-independent-cardinality-decision.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-independent-cardinality-decision
  cancel-in-progress: false
jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CP-SAT
        run: python -m pip install 'ortools==9.14.6206'
      - name: Independently test <=14 changed machine orders, no prior core cuts
        run: python3 science-boundary/job-shop-ta41/independent_cardinality_decision.py --k 14 --seconds 540 --workers 4
      - name: Official independent evaluation on positive candidate
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/machine-budget14"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Preserve a proof or honest UNKNOWN
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/machine-budget14/
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): independently decide distance <=14'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
