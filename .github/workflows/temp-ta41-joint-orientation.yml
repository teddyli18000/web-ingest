name: temp-ta41-joint-orientation
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/joint_reorientation_cp.py'
      - '.github/workflows/temp-ta41-joint-orientation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-joint-orientation
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CP-SAT solver
        run: python -m pip install 'ortools==9.14.6206'
      - name: Solve exact coupled incumbent-arc reorientation model
        run: |
          python3 science-boundary/job-shop-ta41/joint_reorientation_cp.py --seconds 540 --workers 4
      - name: Independently verify all improvements
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/joint-reorientation"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist result on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/joint-reorientation/
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): test exact coupled reorientation with UNSAT cuts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
