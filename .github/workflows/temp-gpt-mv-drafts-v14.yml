name: Temp GPT MV second act v14 director gate

on:
  push:
    paths:
      - "temp-work/gpt-mv-code-native/src/scenes/drafts_v14.js"
      - "temp-work/gpt-mv-code-native/src/main.js"
      - "temp-work/gpt-mv-code-native/export/shot_stills.mjs"
      - "temp-work/gpt-mv-code-native/export/render.mjs"
      - ".github/workflows/temp-gpt-mv-drafts-v14.yml"
  workflow_dispatch:

concurrency:
  group: temp-gpt-mv-drafts-v14
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  director-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: temp-work/gpt-mv-code-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
      - name: Validate source syntax
        run: |
          node --check src/scenes/drafts_v14.js
          node --check src/main.js
          node --check export/shot_stills.mjs
      - name: Render 1080p story beats and cut boundaries
        run: node export/shot_stills.mjs out/drafts_v14_stills "14.72,15.08,15.90,17.15,18.10,19.10,20.75,21.70,22.40,23.70,24.80,25.90,26.75,27.70,28.75,29.75,30.15"
      - name: Render second-act video
        run: node export/render.mjs --start 15 --end 30 --width 960 --height 540 --fps 15 --art-source reach-hq --bust-source gpt-bust-matted-v5 --out out/drafts_v14.mp4
      - name: Validate media and stills
        run: |
          set -euo pipefail
          ffmpeg -v error -i out/drafts_v14.mp4 -f null -
          test "$(find out/drafts_v14_stills -maxdepth 1 -name '*.png' | wc -l)" -eq 17
          python - <<'PY'
          import json,subprocess
          p='out/drafts_v14.mp4'
          v=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=width,height,r_frame_rate','-show_entries','format=duration','-of','json',p]))
          assert abs(float(v['format']['duration'])-15)<.1
          assert v['streams'][0]['width']==960 and v['streams'][0]['height']==540
          print('validated',v['format']['duration'])
          PY
      - name: Upload director review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mv-drafts-v14-${{ github.run_id }}
          path: |
            temp-work/gpt-mv-code-native/out/drafts_v14.mp4
            temp-work/gpt-mv-code-native/out/drafts_v14.contact.jpg
            temp-work/gpt-mv-code-native/out/drafts_v14_stills/*.png
          retention-days: 14
          if-no-files-found: warn
