name: temp-mondrian87-topology-repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-mondrian87-topology-repair.yml'

permissions:
  contents: read

concurrency:
  group: temp-mondrian87-topology-repair
  cancel-in-progress: false

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: 211, window: 390}
          - {seed: 223, window: 390}
          - {seed: 227, window: 391}
          - {seed: 229, window: 391}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare connected-patch constructive solver
        run: |
          python -m pip install ortools
          python -m py_compile science-boundary/mondrian-87/{patch_repair,cpsat_search}.py
      - name: Construct valid defect-17 tiling with neighborhood topology changes
        run: |
          set -o pipefail
          python science-boundary/mondrian-87/patch_repair.py \
            --seed ${{ matrix.seed }} --window ${{ matrix.window }} \
            --seconds 720 --outdir found | tee search.log
      - name: Official Few Shots verification of constructed tilings
        run: |
          if test -d found; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/mondrian-candidate
            for f in found/certificate_*.json; do
              cp "$f" /tmp/mondrian-candidate/certificate.json
              python /tmp/few-shots/problems/p016-mondrian-87/verify/verify.py /tmp/mondrian-candidate
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mondrian87-patch-${{ matrix.seed }}-${{ matrix.window }}
          path: |
            search.log
            found/
