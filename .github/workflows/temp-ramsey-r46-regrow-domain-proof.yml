name: Temp Ramsey R46 finite-domain regrow proof

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/regrow_domain_proof.py
      - science-boundary/ramsey-r46/results/methodb36-best-regrow-domain-proof.json
      - .github/workflows/temp-ramsey-r46-regrow-domain-proof.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned verifier dependency
        run: python -m pip install --disable-pip-version-check 'networkx==3.5'
      - name: Recompute exact k2-k8 finite-domain proof
        shell: bash
        run: |
          set -euo pipefail
          python science-boundary/ramsey-r46/regrow_domain_proof.py \
            science-boundary/ramsey-r46/results/methodb36-best.json \
            --output /tmp/regrow-domain-proof.json
          cmp /tmp/regrow-domain-proof.json science-boundary/ramsey-r46/results/methodb36-best-regrow-domain-proof.json
      - name: Retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-ramsey-r46-regrow-domain-proof.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ramsey-r46: verify exact finite-domain regrow proof'
          for attempt in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((attempt*4)); done
          exit 1
