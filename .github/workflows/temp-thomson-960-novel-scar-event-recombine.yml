name: temp Thomson 960 novel defect-event recombination

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-novel-scar-event-recombine.yml'

jobs:
  novel-event-recombine:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [9091, 9092, 9093]
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: few-shots/few-shots
          path: few-shots
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy numba
      - name: Check new event recombination code
        run: |
          python3 -m py_compile \
            science-boundary/thomson-960/code/search_recombined_novel_scar_fields.py \
            science-boundary/thomson-960/code/search_hamiltonian_scar_braid.py
      - name: Search nonlinear coordinated W/R/A/B scar rewrite
        run: |
          python3 science-boundary/thomson-960/code/search_recombined_novel_scar_fields.py \
            few-shots \
            --elite-json science-boundary/thomson-960/data/scar-braid-elites-2202-2026-11-06.json \
            --seed ${{ matrix.seed }} --trials 400 --maxiter 700 \
            --out "$RUNNER_TEMP/out"
      - name: Candidate generation summary
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          f=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/'result.json'
          if not f.exists():
              print('MISSING RESULT'); raise SystemExit(0)
          d=json.loads(f.read_text())
          print('SEED',d['seed'],'TRIALS',d['trials_done'],'BEST',d['best_energy'],
                'DELTA',d['best_delta'],'CANDIDATES',d['sub_record_candidates'])
          print('PARENT',d['parent_diagnostics'])
          print('FIELD_COSINES',d['field_cosines'])
          for m in ['W-single','W-pair','W-triple','W-A-coupled',
                    'W-B-coupled','W-A-commutator','W-ABA']:
              rows=[r for r in d['rows'] if r['pattern']==m]
              print('OPERATOR',m,'n',len(rows),'best',
                    min((r['energy'] for r in rows),default=None),
                    'new_below_R+0.05',sum(r['new'] and r['delta_record']<.05 for r in rows))
          print('ELITES',[(p['energy'],p['tag']) for p in d['elite_pool']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-recombined-scar-events-${{ matrix.seed }}
          path: ${{ runner.temp }}/out
          retention-days: 10
