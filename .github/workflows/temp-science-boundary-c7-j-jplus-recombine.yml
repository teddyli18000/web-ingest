name: Temp Science Boundary C7 J/Jplus exact recombination

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-j-jplus-recombine.yml
      - science-boundary/shannon-capacity-c7/code/bpz_j_jplus_pair.py
      - science-boundary/shannon-capacity-c7/code/recombine_two_independent_sets.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recombine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Tan source and Few Shots verifier
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
      - name: Materialize J and Jplus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/J" "$RUNNER_TEMP/Jp" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
          python3 science-boundary/shannon-capacity-c7/code/bpz_j_jplus_pair.py \
            "$RUNNER_TEMP/tan" \
            "$RUNNER_TEMP/J/certificate.json" "$RUNNER_TEMP/Jp/certificate.json" \
            "$RUNNER_TEMP/J/ids.txt" "$RUNNER_TEMP/Jp/ids.txt" \
            "$RUNNER_TEMP/result/pair-status.json"
      - name: Verify both 134753 inputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/J" | tee "$RUNNER_TEMP/result/j-verify.json"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/Jp" | tee "$RUNNER_TEMP/result/jp-verify.json"
          python3 - "$RUNNER_TEMP/result/j-verify.json" "$RUNNER_TEMP/result/jp-verify.json" <<'PY'
          import json,sys
          for p in sys.argv[1:]:
              r=json.load(open(p,encoding='utf-8'))
              if not r.get('valid') or int(r.get('score',-1)) != 134753:
                  raise SystemExit((p,r))
          PY
      - name: Exact bipartite-union recombination
        id: recombine
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/recombine_two_independent_sets.py \
            "$RUNNER_TEMP/J/certificate.json" "$RUNNER_TEMP/Jp/certificate.json" \
            "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/recombine.json"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify breakthrough with Few Shots verifier
        if: steps.recombine.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1)) <= 134753:
              raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-j-jplus-recombine
          path: ${{ runner.temp }}/result
          retention-days: 14
