name: Riemann-Weil Schur rational pole test

on:
  push:
    branches: [main]
    paths:
      - 'temp-work/riemann-weil-research/experiments/schur_rational_pole_test.py'
      - '.github/workflows/riemann-weil-rational-poles.yml'

permissions:
  contents: write

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - N: 4
            prec: 900
            dps: 120
          - N: 8
            prec: 1500
            dps: 180
          - N: 12
            prec: 2300
            dps: 240
          - N: 16
            prec: 3200
            dps: 310
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check python-flint mpmath
      - name: Fetch pinned public verifier
        run: |
          git clone --quiet https://github.com/akivag613/connes-cvs-.git upstream-connes-cvs
          git -C upstream-connes-cvs checkout --quiet 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c
      - name: Test rational poles and residues
        run: |
          python temp-work/riemann-weil-research/experiments/schur_rational_pole_test.py \
            --upstream-script upstream-connes-cvs/papers/2_guinand_weil_dictionary_tail_order/scripts/arb_ldlt_certify.py \
            --upstream-commit 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c \
            --c 100 --N ${{ matrix.N }} --prec ${{ matrix.prec }} --dps ${{ matrix.dps }} \
            --output schur-rational-poles-c100-N${{ matrix.N }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: schur-rational-poles-c100-N${{ matrix.N }}
          path: schur-rational-poles-c100-N${{ matrix.N }}.json
          retention-days: 1

  collect:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: schur-rational-poles-*
          path: downloaded
          merge-multiple: true
      - name: Commit results safely
        run: |
          set -euo pipefail
          mkdir -p temp-work/riemann-weil-research/results
          cp downloaded/schur-rational-poles-*.json temp-work/riemann-weil-research/results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-work/riemann-weil-research/results/schur-rational-poles-*.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: record Schur rational pole diagnostics'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
