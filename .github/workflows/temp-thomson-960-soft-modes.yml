name: temp Thomson 960 soft-mode spectrum

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-soft-modes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Compute lowest full-space tangent modes
        run: |
          python3 science-boundary/thomson-960/code/diagnose_soft_modes.py \
            "$RUNNER_TEMP/few-shots" --k 14 --fd-step 3e-6 \
            --out "$RUNNER_TEMP/soft-modes.json"
          cat "$RUNNER_TEMP/soft-modes.json"
      - name: Upload spectrum
        uses: actions/upload-artifact@v4
        with:
          name: thomson-960-soft-modes
          path: ${{ runner.temp }}/soft-modes.json
          retention-days: 7
