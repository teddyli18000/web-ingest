name: Riemann-Weil tail budget

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riemann-weil-tail-budget.yml'
      - 'temp-work/riemann-weil-research/experiments/zhu_tail_budget_arb.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tail:
    strategy:
      fail-fast: false
      matrix:
        N: [132, 133, 134, 135, 136]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Arb binding
        run: python -m pip install 'python-flint==0.8.0'
      - name: Compute rigorous Arb tail budget
        run: |
          target=1e-17
          if [ '${{ matrix.N }}' -ge 135 ]; then target=1e-19; fi
          python temp-work/riemann-weil-research/experiments/zhu_tail_budget_arb.py \
            --N '${{ matrix.N }}' \
            --L log5over2 \
            --T 200 \
            --symbol-bound 20 \
            --prec 384 \
            --target "$target" \
            --output temp-work/riemann-weil-research/results/tail-budget-L5-N${{ matrix.N }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: tail-budget-N${{ matrix.N }}
          path: temp-work/riemann-weil-research/results/tail-budget-L5-N${{ matrix.N }}.json
          if-no-files-found: error

  collect:
    needs: tail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: tail-budget-N*
          path: /tmp/tail-results
          merge-multiple: true
      - name: Commit tail certificates once
        run: |
          mkdir -p temp-work/riemann-weil-research/results
          cp /tmp/tail-results/*.json temp-work/riemann-weil-research/results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-work/riemann-weil-research/results/tail-budget-L5-N*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record rigorous next-window tail budgets'
          git pull --rebase origin main
          git push origin HEAD:main
