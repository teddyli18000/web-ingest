name: temp-p010-monalisa-factor-pareto-frontier
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/lp_wiring_sec_frontier.py
      - .github/workflows/temp-p010-monalisa-factor-pareto-frontier.yml
permissions:
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve original strong published tours, LP primal snapshots and official verifier
        run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          python -m pip install numpy scipy networkx matplotlib ortools
          python -m py_compile science-boundary/mona-lisa-tsp/lp_wiring_sec_frontier.py
          mkdir -p /tmp/p010/tour /tmp/p010/lp
          root=https://www.math.uwaterloo.ca/tsp/data/ml
          for score in 5757199 5757200 5757203 5757204 5757205 5757241 5757245; do
            curl -fsSL --retry 3 "$root/tour/monalisa_${score}.tour" -o "/tmp/p010/tour/monalisa_${score}.tour"
          done
          for variant in 6nsub 5zsub 4zsub; do
            curl -fsSL --retry 3 "$root/x/mona.${variant}.x" -o "/tmp/p010/lp/mona.${variant}.x"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path('/tmp/p010/tour');l=Path('/tmp/p010/lp')
          Path('/tmp/p010/tours.json').write_text(json.dumps({f'historic_{s}':str(t/f'monalisa_{s}.tour') for s in (5757199,5757200,5757203,5757204,5757205,5757241,5757245)}))
          Path('/tmp/p010/lps.json').write_text(json.dumps({'2012-04-18':str(l/'mona.6nsub.x'),'2012-01-21':str(l/'mona.5zsub.x'),'2011-07-15':str(l/'mona.4zsub.x')}))
          PY
      - name: Preserve all Pareto steps of exact SEC separated degree-two factors
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          dir=science-boundary/mona-lisa-tsp/results/monalisa-factor-frontier
          mkdir -p "$dir"
          python -u science-boundary/mona-lisa-tsp/lp_wiring_sec_frontier.py \
            --baseline upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --tours /tmp/p010/tours.json --lps /tmp/p010/lps.json \
            --components science-boundary/mona-lisa-tsp/data/historical-wiring-components-all.json \
            --selector persistent --attachment all --nregions 8 --lp-budget 1322 \
            --seconds 240 --workers 4             --report "$dir/report.json" --candidate "$dir/certificate.json" \
            --factor-report "$dir/last-factor.json" --frontier-dir "$dir/snapshots"
          test -s "$dir/report.json"
          test "$(find "$dir/snapshots" -name 'factor-*.json' | wc -l)" -ge 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p010-100k-factor-cost-subtour-frontier
          path: science-boundary/mona-lisa-tsp/results/monalisa-factor-frontier/
          if-no-files-found: ignore
