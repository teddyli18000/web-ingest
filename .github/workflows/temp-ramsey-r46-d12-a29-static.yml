name: Temp Ramsey R46 D12 A29 static split SAT

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/d12_static_split_sat.py
      - science-boundary/ramsey-r46/d12_fixed_ab_sat.py
      - .github/workflows/temp-ramsey-r46-d12-a29-static.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ramsey-r46-d12-a29-static
  cancel-in-progress: false

jobs:
  solve:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        b_edges: [101, 102, 103, 104, 105, 106, 107]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned exact solver
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Prepare unique A29 type and self-test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          curl --fail --location --retry 3 --silent --show-error \
            https://users.cecs.anu.edu.au/~bdm/data/r36_12.g6.gz -o /tmp/r46/r36_12.g6.gz
          echo '17e176a0f7e7397dbca7c9cb6295034dd74cf529ca62e7e717226dc1b0b7b96d  /tmp/r46/r36_12.g6.gz' | sha256sum -c -
          python science-boundary/ramsey-r46/d12_fixed_ab_sat.py self-test
          python science-boundary/ramsey-r46/d12_static_split_sat.py self-test
          python science-boundary/ramsey-r46/d12_fixed_ab_sat.py extract-g6 \
            --input /tmp/r46/r36_12.g6.gz --n 12 --edges 29 --out /tmp/r46/a29.g6
          test "$(wc -l < /tmp/r46/a29.g6)" -eq 1
      - name: Solve exact B edge stratum
        id: solve
        shell: bash
        run: |
          set -uo pipefail
          be='${{ matrix.b_edges }}'
          mkdir -p /tmp/r46/out
          set +e
          timeout --signal=TERM --kill-after=20s 4800 \
            python science-boundary/ramsey-r46/d12_static_split_sat.py solve \
              --a-catalog /tmp/r46/a29.g6 --a-ordinal 0 --a-edges 29 --b-edges "$be" \
              --solver cadical195 --summary "/tmp/r46/out/b${be}.json" \
              --output "/tmp/r46/out/b${be}-candidate.json" \
              > "/tmp/r46/out/b${be}.log" 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) status=SAT ;;
            20) status=UNSAT ;;
            124|137|143) status=TIMEOUT ;;
            *) status=ERROR ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "b=$be status=$status rc=$rc"
          tail -n 20 "/tmp/r46/out/b${be}.log" || true
          [[ "$status" != ERROR ]]
      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          be='${{ matrix.b_edges }}'
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate
          cp "/tmp/r46/out/b${be}-candidate.json" /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee "/tmp/r46/out/b${be}-verify.json"
          python3 - "/tmp/r46/out/b${be}-verify.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d.get('valid') is True and d.get('score') == '36', d
          PY
      - name: Upload exact branch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-d12-a29-b${{ matrix.b_edges }}
          path: /tmp/r46/out
          if-no-files-found: warn
          retention-days: 7

  collect:
    if: always()
    needs: solve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-d12-a29-b*
          path: /tmp/parts
      - name: Aggregate branches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python3 - /tmp/parts /tmp/r46/result.json <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); rows=[]; candidates=[]
          for p in root.rglob('b*.json'):
              if 'candidate' in p.name or 'verify' in p.name: continue
              try: d=json.load(open(p))
              except Exception: continue
              if 'status' in d: rows.append(d)
          rows.sort(key=lambda d:d['b_edges'])
          for p in root.rglob('*candidate.json'): candidates.append(str(p))
          result={'campaign':'d12-a29-static-split','target_b_edges':list(range(101,108)),
                  'rows':rows,'completed_b_edges':[d['b_edges'] for d in rows],
                  'all_unsat':len(rows)==7 and all(d['status']=='UNSAT' for d in rows),
                  'sat_count':sum(d['status']=='SAT' for d in rows),'candidate_paths':candidates}
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='rows'},sort_keys=True))
          PY
      - name: Persist completed exact results and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/d12-a29-static-split.json
          git rm .github/workflows/temp-ramsey-r46-d12-a29-static.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/d12-a29-static-split.json
          git commit -m 'ramsey-r46: record D12 A29 static split campaign'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
