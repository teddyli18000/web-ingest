name: temp Thomson 960 e553 to D2 morphs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-thomson-960-e553-d2-morph.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  morph:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [6201, 6202, 6203, 6204]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Clone live Few Shots main
        run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Download e553 source artifact
        uses: actions/download-artifact@v4
        with:
          name: thomson-e564-scaffold-f0
          path: ${{ runner.temp }}/source
          github-token: ${{ github.token }}
          run-id: 40991851757
      - name: Extract e553 seed
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,os
          p=glob.glob(os.path.join(os.environ['RUNNER_TEMP'],'source','*.json'))[0]
          d=json.load(open(p)); b=min(d['lowest_distinct_release_basins'],key=lambda z:z['release_energy'])
          json.dump({'energy':b['release_energy'],'coord_counts':b['release_coord'],'points':b['points']},open(os.path.join(os.environ['RUNNER_TEMP'],'seed.json'),'w'),separators=(',',':'))
          print('seed',b['release_energy'],b['release_coord'])
          PY
      - name: Focused e553 to D2 morph
        shell: bash
        run: |
          python3 science-boundary/thomson-960/code/search_seed_to_d2_morph.py \
            "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/seed.json" \
            --seed "${{ matrix.seed }}" --ts 0.30,0.38,0.44,0.48,0.52,0.56,0.60,0.66 \
            --out "$RUNNER_TEMP/e553-d2-${{ matrix.seed }}.json"
          python3 - <<'PY'
          import glob,json
          p=glob.glob('/home/runner/work/_temp/e553-d2-*.json')[0]; d=json.load(open(p))
          print('ALIGN',d['icp_nn_rms'],d['hungarian_rms'],'BEST',d['best_energy'])
          for b in d['lowest_distinct_basins']:
              print('BASIN',b['energy'],b['coord_counts'],b['t'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e553-d2-${{ matrix.seed }}
          path: ${{ runner.temp }}/e553-d2-${{ matrix.seed }}.json
          retention-days: 7
