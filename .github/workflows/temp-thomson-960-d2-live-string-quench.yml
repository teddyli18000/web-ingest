name: temp Thomson 960 D2-live string quench

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-d2-live-string-quench.yml'

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        seed: [9851, 9852, 9853, 9854]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Materialize D2 and live
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 - <<'PY'
          import json,pathlib,os,sys
          sys.path.insert(0,'science-boundary/thomson-960/code')
          import search_topology_morph as tm
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'few-shots'; out=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          d2=tm.cert_xyz(root/tm.D2_REL)
          (out/'d2.json').write_text(json.dumps({'name':'D2','energy':tm.raw_energy(d2),'coord_counts':tm.coord_counts(d2),'points':d2.tolist()},separators=(',',':'))+'\n')
          score,live_dir=tm.find_live(root); live=tm.cert_xyz(live_dir/'certificate.json')
          (out/'live.json').write_text(json.dumps({'name':'live','energy':tm.raw_energy(live),'score':score,'coord_counts':tm.coord_counts(live),'points':live.tolist()},separators=(',',':'))+'\n')
          print('D2',tm.raw_energy(d2),tm.coord_counts(d2),'LIVE',score,tm.coord_counts(live))
          PY
      - name: Relax D2-live string and quench images
        run: |
          echo "nproc=$(nproc) seed=${{ matrix.seed }}"
          python3 science-boundary/thomson-960/code/search_pair_string_quench.py \
            "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/out/d2.json" "$RUNNER_TEMP/out/live.json" \
            --seed '${{ matrix.seed }}' --starts 20 --images 13 --iterations 340 \
            --eta 0.00020 --max-step 0.00050 --quench-maxiter 3000 --retain-window 0.40 \
            --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('BEST',d['best_energy'],'DELTA_LIVE',d['best_delta_live'],'MAX_PERP',d['max_path_perp'])
          for b in d['novel_low_basins'][:20]: print('NOVEL',b['energy'],b['delta_live'],b['coord_counts'],'image',b['image'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-d2-live-string-${{ matrix.seed }}
          path: ${{ runner.temp }}/out
          retention-days: 7
