name: temp Ramsey R46 rooted SAT encoding witness smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-ramsey-r46-rooted-witness-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        degree: [14,15]
    steps:
      - uses: actions/checkout@v4
      - name: Install SAT
        run: python3 -m pip install --disable-pip-version-check -q python-sat
      - name: Prove CNF agrees with the known full legal graph
        run: |
          python3 science-boundary/ramsey-r46/rooted_fusion35_36.py \
            --mode control35 --degree ${{ matrix.degree }} \
            --seed 7 --check-only --outdir "$RUNNER_TEMP/rooted-encoding"
          cat "$RUNNER_TEMP/rooted-encoding/summary.json"
