name: temp-ta41-independent-group-core-audit
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/independent_group_core_audit.py'
      - '.github/workflows/temp-ta41-independent-group-core-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-independent-group-core-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CP solver
        run: python -m pip install 'ortools==9.14.6206'
      - name: Independently reconstruct 114 hard grouped cores and enumerate exact 20-bit group covers
        run: python3 science-boundary/job-shop-ta41/independent_group_core_audit.py --seconds 4
      - name: Preserve independent proof and unresolved cores
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/machine-core-independent-all.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): independently audit all grouped infeasibility cores'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
