name: temp Thomson 960 D2-live defect core transfer

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-d2-live-defect-core.yml'

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        seed: [9861, 9862, 9863]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Materialize D2 and live
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 - <<'PY'
          import json,pathlib,os,sys
          sys.path.insert(0,'science-boundary/thomson-960/code')
          import search_topology_morph as tm
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'few-shots'; out=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          d2=tm.cert_xyz(root/tm.D2_REL)
          (out/'d2.json').write_text(json.dumps({'name':'D2','energy':tm.raw_energy(d2),'coord_counts':tm.coord_counts(d2),'points':d2.tolist()},separators=(',',':'))+'\n')
          score,live_dir=tm.find_live(root); live=tm.cert_xyz(live_dir/'certificate.json')
          (out/'live.json').write_text(json.dumps({'name':'live','energy':tm.raw_energy(live),'score':score,'coord_counts':tm.coord_counts(live),'points':live.tolist()},separators=(',',':'))+'\n')
          (out/'live-score.txt').write_text(str(score))
          print('D2',tm.raw_energy(d2),tm.coord_counts(d2),'LIVE',score,tm.coord_counts(live))
          PY
      - name: Search core-aware transfers
        run: |
          live=$(cat "$RUNNER_TEMP/out/live-score.txt")
          echo "nproc=$(nproc) seed=${{ matrix.seed }} live=$live"
          python3 science-boundary/thomson-960/code/search_defect_core_transfer.py \
            "$RUNNER_TEMP/out/d2.json" "$RUNNER_TEMP/out/live.json" \
            --seed '${{ matrix.seed }}' --starts 28 \
            --radii 0.08,0.12,0.18,0.26 --alphas 0.20,0.38,0.62,0.90,1.20,1.55 \
            --maxiter 3000 --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('BEST',d['best_energy'],'DELTA_LIVE',d['best_delta_live'],'LABEL',d['best_label'])
          print('CORES',len(d['cores']))
          for i,c in enumerate(d['cores']): print('CORE',i,c)
          for b in d['distinct_low_basins'][:20]: print('BASIN',b['energy'],b['delta_live'],b['coord_counts'],b['label'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-d2-live-defect-core-${{ matrix.seed }}
          path: ${{ runner.temp }}/out
          retention-days: 7
