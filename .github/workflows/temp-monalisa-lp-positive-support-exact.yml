name: temp-monalisa-lp-positive-support-exact
on:
  workflow_dispatch:
  push:
    paths:
      - science-boundary/mona-lisa-tsp/lp_positive_support_exact.py
      - .github/workflows/temp-monalisa-lp-positive-support-exact.yml
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        regions: [1, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain source routes, LP vectors, authoritative verifier
        run: |
          git clone --depth 1 https://github.com/few-shots/few-shots.git upstream
          python -m pip install numpy matplotlib networkx ortools
          mkdir -p /tmp/p010/tour /tmp/p010/lp
          root=https://www.math.uwaterloo.ca/tsp/data/ml
          for score in 5757199 5757200 5757203 5757204 5757205 5757241 5757245; do
            curl -fsSL --retry 2 "$root/tour/monalisa_${score}.tour" -o "/tmp/p010/tour/monalisa_${score}.tour"
          done
          for variant in 6nsub 5zsub 4zsub; do
            curl -fsSL --retry 2 "$root/x/mona.${variant}.x" -o "/tmp/p010/lp/mona.${variant}.x"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path('/tmp/p010/tour');l=Path('/tmp/p010/lp')
          Path('/tmp/p010/tours.json').write_text(json.dumps({f'historic_{s}':str(t/f'monalisa_{s}.tour') for s in (5757199,5757200,5757203,5757204,5757205,5757241,5757245)}))
          Path('/tmp/p010/lps.json').write_text(json.dumps({'2012-04-18':str(l/'mona.6nsub.x'),'2012-01-21':str(l/'mona.5zsub.x'),'2011-07-15':str(l/'mona.4zsub.x')}))
          PY
      - name: Globally connected exact tour under full LP-positive support in competitor regions
        env:
          FEWSHOTS_ROOT: ${{ github.workspace }}/upstream
        run: |
          dir=science-boundary/mona-lisa-tsp/results/lp-positive-${{ matrix.regions }}
          mkdir -p "$dir"
          python science-boundary/mona-lisa-tsp/lp_positive_support_exact.py \
            --baseline upstream/problems/p010-mona-lisa-tsp/baseline/certificate.json \
            --tours /tmp/p010/tours.json --lps /tmp/p010/lps.json \
            --components science-boundary/mona-lisa-tsp/data/historical-wiring-components-all.json \
            --selector persistent --attachment all --nregions ${{ matrix.regions }} \
            --lp-budget 0 --seconds 200 --workers 4 \
            --report "$dir/report.json" --candidate "$dir/certificate.json"
          if test -s "$dir/certificate.json"; then
            python upstream/problems/p010-mona-lisa-tsp/verify/verify.py "$dir"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monalisa-lp-positive-${{ matrix.regions }}
          path: science-boundary/mona-lisa-tsp/results/lp-positive-*/
          if-no-files-found: ignore
