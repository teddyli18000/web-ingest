name: temp labs-100 near-skew tight-bound probe

on:
  push:
    paths:
      - '.github/workflows/temp-labs-100-nearskew-tight-bound-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build tight-bound probe
        run: |
          g++ -O3 -march=native -std=c++20 -DNDEBUG \
            science-boundary/labs-100/code/nearskew_tight_bound_probe.cpp \
            -o /tmp/probe
      - name: Cross-check DP and analytic chain bounds, then benchmark
        shell: bash
        run: |
          set -euo pipefail
          /tmp/probe 100 88310001 | tee /tmp/probe.txt
          grep -F 'FULL ' /tmp/probe.txt | grep -F 'exact=1'
          grep -F 'BENCH depth=28 ' /tmp/probe.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: labs100-nearskew-tight-bound-probe-v2
          path: /tmp/probe.txt
          if-no-files-found: warn
