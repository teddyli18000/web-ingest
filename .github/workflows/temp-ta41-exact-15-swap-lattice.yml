name: temp-ta41-exact-15-swap-lattice
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/exact_swap_lattice.py'
      - '.github/workflows/temp-ta41-exact-15-swap-lattice.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-exact-15-swap-lattice
  cancel-in-progress: false
jobs:
  lattice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run exact dynamic programming across all 32768 combinations of 15 score-neutral micro-swaps
        run: |
          python3 -m py_compile science-boundary/job-shop-ta41/exact_swap_lattice.py
          python3 science-boundary/job-shop-ta41/exact_swap_lattice.py
      - name: Persist mathematically complete finite path result
        if: always()
        run: |
          set -euo pipefail
          path='science-boundary/job-shop-ta41/results/exact-15-swap-coordination-lattice.json'
          if ! test -f "$path"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): exhaustive monotone coordination barrier in 15-swap hypercube'
          for attempt in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
