name: temp-ta41-warm-backbone-descent
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/warm_backbone_descent.py'
      - '.github/workflows/temp-ta41-warm-backbone-descent.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-warm-backbone-descent
  cancel-in-progress: false
jobs:
  explore:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arc: 7, seed: 2024}
          - {arc: 14, seed: 1024}
          - {arc: 2, seed: 41}
          - {arc: 6, seed: 777}
          - {arc: 12, seed: 1200}
          - {arc: 5, seed: 350}
          - {arc: 17, seed: 418}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CP-SAT solver
        run: python -m pip install 'ortools==9.14.6206'
      - name: Descend from feasible core-reversed resource schedules
        run: |
          python3 -m py_compile science-boundary/job-shop-ta41/warm_backbone_descent.py
          python3 science-boundary/job-shop-ta41/warm_backbone_descent.py --arc '${{ matrix.arc }}' --seed '${{ matrix.seed }}' --stages 4 --phase-seconds 75 --out 'science-boundary/job-shop-ta41/results/warm-backbone-${{ matrix.arc }}'
      - name: Independently verify any improved core-breaking schedule
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/warm-backbone-${{ matrix.arc }}"
          if test -f "$dir/best-reversed-order.json" || test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
          fi
          if test -f "$dir/best-reversed-order.json"; then
            mkdir -p /tmp/ta41-warm
            cp "$dir/best-reversed-order.json" /tmp/ta41-warm/certificate.json
            (cd /tmp/few-shots && python3 problems/p009-job-shop-ta41/verify/verify.py /tmp/ta41-warm) | tee "$dir/best-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          d=json.loads((p/'warm-descent.json').read_text())
          v=json.loads((p/'best-verdict.json').read_text())
          assert v['valid'] and int(v['score'])==d['best_reversed_schedule_score'],(v,d)
          PY
          fi
          if test -f "$dir/certificate.json"; then
            (cd /tmp/few-shots && python3 problems/p009-job-shop-ta41/verify/verify.py "$dir") | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          v=json.loads((Path(sys.argv[1])/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Persist score progression with robust main push
        if: always()
        run: |
          set -euo pipefail
          dir="science-boundary/job-shop-ta41/results/warm-backbone-${{ matrix.arc }}"
          test -f "$dir/warm-descent.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): warm optimize legal inverted backbone arc ${{ matrix.arc }}'
          for attempt in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
