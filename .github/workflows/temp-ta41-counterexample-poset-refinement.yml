name: temp-ta41-counterexample-poset-refinement
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/counterexample_poset_refinement.py'
      - '.github/workflows/temp-ta41-counterexample-poset-refinement.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-counterexample-poset-refinement
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP-SAT and compile check
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/counterexample_poset_refinement.py
      - name: Alternate fully soft core-cut CP counterexamples and 2005 poset-core refinements
        run: |
          python3 science-boundary/job-shop-ta41/counterexample_poset_refinement.py \
            --rounds 2 --solve-seconds 150 --core-seconds 55 --recheck-seconds 35 \
            --out 'science-boundary/job-shop-ta41/results/iterative-poset-refinement'
      - name: Officially verify each 2006 neutral and any 2005 improvement
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/iterative-poset-refinement"
          if ! test -d "$out"; then exit 0; fi
          git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
          for cert in "$out"/neutral-*/certificate.json "$out"/certificate.json; do
            if ! test -f "$cert"; then continue; fi
            dir="$(dirname "$cert")"
            (
              cd /tmp/few-shots
              python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" > "$dir/upstream-verdict.json"
            )
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score']) <= (2005 if p.name=='iterative-poset-refinement' else 2006),v
          PY
          done
      - name: Save objective, genuine neutral witnesses, verified cores and uncertainty
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/iterative-poset-refinement'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): iterate consensus conflict refinement and neutral counterexamples'
          for attempt in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
