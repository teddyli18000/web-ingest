name: temp-ta41-multishift-hidden-positives
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-multishift-hidden-positives.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-multishift-hidden-positives
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Pull 30x20 archived published positive solutions
        run: |
          git clone --depth=1 https://github.com/ScheduleOpt/benchmarks.git /tmp/scheduleopt
          python3 -m py_compile science-boundary/job-shop-ta41/create_multishift_positive_cases.py
      - name: Generate and independently verify 12 multi-machine hidden answer controls
        run: |
          python3 science-boundary/job-shop-ta41/create_multishift_positive_cases.py \
            --reference-root /tmp/scheduleopt \
            --out science-boundary/job-shop-ta41/positive-control-data
      - name: Persist positive control fixtures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/positive-control-data
          git commit -m 'research(ta41): verified 16/32 multi-inversion hidden-answer counterfactual controls'
          for attempt in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
