name: temp p004 constructive high-port individualized fibers
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7p004-high-port.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: temp-c7p004-high-port
  cancel-in-progress: false
jobs:
  construct:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {parent: neutral14a, aux: port12a, t: 14, rank: 0}
          - {parent: neutral14b, aux: port12b, t: 14, rank: 0}
          - {parent: neutral14a, aux: port12b, t: 13, rank: 0}
          - {parent: neutral14b, aux: port12a, t: 13, rank: 0}
          - {parent: neutral14a, aux: neutral14b, t: 12, rank: 0}
          - {parent: neutral14b, aux: neutral14a, t: 12, rank: 0}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ortools>=9.11,<10' 'numpy>=1.26,<3'
      - name: Recover public auxiliary witnesses
        run: |
          mkdir -p /tmp/c7-high/aux /tmp/c7-high/a /tmp/c7-high/b
          gh run download 42024771296 --repo "${{ github.repository }}" --name c7-port-walk-2026110552 --dir /tmp/c7-high/a
          gh run download 42024771296 --repo "${{ github.repository }}" --name c7-port-walk-2026110554 --dir /tmp/c7-high/b
          cp /tmp/c7-high/a/best_private367.ids /tmp/c7-high/aux/port12a.ids
          cp /tmp/c7-high/b/best_private367.ids /tmp/c7-high/aux/port12b.ids
      - name: Maximize actual 10D size via up to 14 jointly variable row-column ports
        run: |
          python science-boundary/shannon-capacity-c7/code/c7p004_joint_fibers_construct.py \
            science-boundary/shannon-capacity-c7/data/circular-neutral-high-port-p004.json \
            /tmp/c7-high/aux /tmp/c7-high/results \
            --parent "${{ matrix.parent }}" --aux "${{ matrix.aux }}" \
            --t "${{ matrix.t }}" --rank "${{ matrix.rank }}" \
            --seconds 220 --workers 4 --seed 2026110614
      - name: Official p004 replay on any record
        run: |
          if test -s /tmp/c7-high/results/certificate.json; then
            git clone --quiet --depth 1 https://github.com/few-shots/few-shots.git /tmp/fewshots
            python /tmp/fewshots/problems/p004-shannon-capacity-c7/verify/verify.py /tmp/c7-high/results
          else
            echo 'No >134753 record in this specific high-port model.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7-highport-${{ matrix.parent }}-${{ matrix.aux }}-t${{ matrix.t }}
          path: |
            /tmp/c7-high/results/status.json
            /tmp/c7-high/results/certificate.json
            /tmp/c7-high/results/best_certificate.json
          retention-days: 14
