name: temp-ta41-cascade-smoke
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-cascade-smoke.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-cascade-smoke
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        policy: [tabu, static3, dynamic3]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Compile optimized C++ and check wrapper syntax
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -Wall -Wextra science-boundary/job-shop-ta41/predictive_cascade_search.cpp -o /tmp/cascade
          python3 -m py_compile science-boundary/job-shop-ta41/run_predictive_cascade.py
      - name: Smoke-test model, exact graph, and policy
        run: |
          python3 science-boundary/job-shop-ta41/run_predictive_cascade.py \
            --parent baseline --policy '${{ matrix.policy }}' --seed 4107 \
            --evaluations 2500 --binary /tmp/cascade \
            --out 'science-boundary/job-shop-ta41/results/cascade-smoke-${{ matrix.policy }}'
      - name: Independently validate any candidate through Few Shots
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/cascade-smoke-${{ matrix.policy }}"
          if test -f "$root/certificate.json" || test -f "$root/neutral-certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            if test -f "$root/certificate.json"; then
              python3 problems/p009-job-shop-ta41/verify/verify.py "$root" | tee "$root/upstream-verdict.json"
              python3 - "$root" <<'PY'
          import json,sys
          from pathlib import Path
          r=Path(sys.argv[1]);x=json.loads((r/'upstream-verdict.json').read_text())
          assert x['valid'] and int(x['score'])<=2005,x
          PY
            fi
            if test -f "$root/neutral-certificate.json"; then
              mkdir -p /tmp/check-neutral
              cp "$root/neutral-certificate.json" /tmp/check-neutral/certificate.json
              python3 problems/p009-job-shop-ta41/verify/verify.py /tmp/check-neutral | tee "$root/upstream-neutral-verdict.json"
              python3 - "$root" <<'PY'
          import json,sys
          from pathlib import Path
          r=Path(sys.argv[1]);x=json.loads((r/'upstream-neutral-verdict.json').read_text())
          assert x['valid'] and int(x['score'])==2006,x
          PY
            fi
          fi
      - name: Persist tested evidence
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/cascade-smoke-${{ matrix.policy }}'
          test -d "$dir" || exit 0
          rm -f "$dir/input.txt" "$dir/raw-result.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): verify compiled critical-path cascade smoke ${{ matrix.policy }}'
          for attempt in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
