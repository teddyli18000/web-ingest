name: temp-ta41-augmented-source-blind-IHS
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-augmented-source-blind-ihs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-augmented-source-blind-ihs
  cancel-in-progress: false
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        policy: [dynamic, static, random]
        case: [ta43js-n7elite1711, ta46js-n7elite1701, ta41]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check and pin exact solver
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/joint_conflict_hitting_repair.py
      - name: Oracle-blind overshoot before completion, with identical root list and extra release budget
        run: |
          c='${{ matrix.case }}'
          if test "$c" = ta41; then input=ta41; else input="science-boundary/job-shop-ta41/positive-n7-elite-data/$c/start.txt"; fi
          python3 science-boundary/job-shop-ta41/joint_conflict_hitting_repair.py \
            --start "$input" --policy '${{ matrix.policy }}' --seed 333 \
            --root-pool 80 --roots 14 --iterations 100 --seconds 165 \
            --cp-seconds 0.35 --hit-seconds 0.4 \
            --augment-every 10 --augment-budgets 12 24 48 \
            --out 'science-boundary/job-shop-ta41/results/ihs-overshoot-${{ matrix.case }}-${{ matrix.policy }}'
      - name: Few Shots official checker if ta41 improves
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/ihs-overshoot-${{ matrix.case }}-${{ matrix.policy }}"
          if test '${{ matrix.case }}' = ta41 && test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Commit exact scores, counterfactual diagnoses and verified certificate
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/ihs-overshoot-${{ matrix.case }}-${{ matrix.policy }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): blind augmented conflict-aware joint repair ${{ matrix.case }} ${{ matrix.policy }}'
          for i in $(seq 1 40); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
