name: Temp Science Boundary C7 public367 union CP-SAT 368

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-public367-union-cpsat.yml
      - science-boundary/shannon-capacity-c7/code/public367_union_cpsat.py
      - science-boundary/shannon-capacity-c7/code/public367_corpus.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-public367-union-cpsat
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public sources, verifier, and CP-SAT
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git init "$RUNNER_TEMP/c7-five"
          git -C "$RUNNER_TEMP/c7-five" remote add origin https://github.com/molind/c7-five.git
          git -C "$RUNNER_TEMP/c7-five" fetch --depth 1 origin ae81e0d24b356aef3d388238f6fb4d02c4aa32a5
          git -C "$RUNNER_TEMP/c7-five" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          python3 -m pip install --disable-pip-version-check ortools numpy
          mkdir -p "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
      - name: Rebuild and validate public 367 corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/public367_corpus.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/c7-five" "$RUNNER_TEMP/result/corpus.json" \
            | tee "$RUNNER_TEMP/result/corpus.stdout"
      - name: Exact target-368 CP-SAT on 1525-node union graph
        id: solve
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/public367_union_cpsat.py \
            "$RUNNER_TEMP/result/corpus.json" "$RUNNER_TEMP/result/cpsat.json" \
            "$RUNNER_TEMP/result/witness5.json" "$RUNNER_TEMP/shot/certificate.json" \
            --seconds 10800 --workers 4 --seed 20261031 \
            | tee "$RUNNER_TEMP/result/cpsat.stdout"
          python3 - "$RUNNER_TEMP/result/cpsat.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          with open(sys.argv[2],'a') as f:
              f.write('found='+('true' if r.get('candidate_368') else 'false')+'\n')
          PY
      - name: Verify 135424 breakthrough with Few Shots verifier
        if: steps.solve.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if not r.get('valid') or int(r.get('score',-1))<135424: raise SystemExit(r)
          print('VERIFIED C7^5=368 SQUARE BREAKTHROUGH',r)
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-public367-union-cpsat
          path: |
            ${{ runner.temp }}/result
            ${{ runner.temp }}/shot
          retention-days: 14
