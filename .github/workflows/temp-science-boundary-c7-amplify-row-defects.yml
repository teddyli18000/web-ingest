# trigger-v2: force push-event execution via Git-data ref update
name: Temp Science Boundary C7 amplify row defects

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-amplify-row-defects.yml
      - science-boundary/shannon-capacity-c7/code/bpz_amplify_row_defects.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-amplify-row-defects
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned BPZ/Tan source and Few Shots verifier
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          mkdir -p "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot"
      - name: Exact maximum-closure amplification scan
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_amplify_row_defects.py \
            "$RUNNER_TEMP/tan" \
            "$RUNNER_TEMP/result/search.json" \
            "$RUNNER_TEMP/shot/certificate.json" \
            > "$RUNNER_TEMP/result/search.stdout" \
            2> "$RUNNER_TEMP/result/search.stderr"
          cat "$RUNNER_TEMP/result/search.stdout"
          tail -n 100 "$RUNNER_TEMP/result/search.stderr"
          if [[ -f "$RUNNER_TEMP/shot/certificate.json" ]]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify breakthrough with Few Shots verifier
        if: steps.scan.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/result/verify.json"
          python3 - "$RUNNER_TEMP/result/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1)) <= 134753:
              raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH',r)
          PY
          cp "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/result/candidate.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-amplify-row-defects
          path: ${{ runner.temp }}/result
          retention-days: 14
