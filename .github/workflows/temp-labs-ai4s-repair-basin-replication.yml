name: temp-labs-ai4s-repair-basin-replication
on:
  push:
    paths:
      - .github/workflows/temp-labs-ai4s-repair-basin-replication.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-labs-ai4s-repair-basin-replication
  cancel-in-progress: false
jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Native exact LABS selftest and six-arm fixed source reproduction
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/recombination_20261105/innovation
          g++ -std=c++17 -O3 basin_search/basin_mask_search.cpp -o /tmp/labs_basin_replay
          /tmp/labs_basin_replay --selftest
      - name: 864 independent unseen-seed, full-cost 250ms repair sessions
        run: |
          set -euo pipefail
          cd science-boundary/labs-ai4s-search/recombination_20261105
          mkdir -p innovation/basin_search/results/replay_v1
          /tmp/labs_basin_replay data/combined/combined10.tsv \
            innovation/basin_search/results/replay_v1/sessions.tsv \
            innovation/basin_search/results/replay_v1/novel.tsv 16 250 4
      - name: Independently verify every retained source/outcome and clustered method comparisons
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check numpy
          cd science-boundary/labs-ai4s-search/recombination_20261105
          python3 innovation/basin_search/validate_basin.py \
            --parents data/combined/combined10.tsv \
            --sessions innovation/basin_search/results/replay_v1/sessions.tsv \
            --novel innovation/basin_search/results/replay_v1/novel.tsv \
            --output innovation/basin_search/results/replay_v1/verified.json
          python3 innovation/basin_search/analyze_replay.py \
            innovation/basin_search/results/replay_v1/sessions.tsv \
            innovation/basin_search/results/replay_v1/novel.tsv \
            --output innovation/basin_search/results/replay_v1/paired_analysis.json
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('innovation/basin_search/results/replay_v1')
          v=json.loads((p/'verified.json').read_text())
          a=json.loads((p/'paired_analysis.json').read_text())
          assert v['full_session_rows']==864 and a['full_session_rows']==864
          assert v['pair_seed_contexts']==144 and a['source_pair_seed_contexts']==144
          assert v['source_pair_families']==9 and a['groups']['all']['pairs']==9
          assert all(z['evaluated'] if isinstance(z,dict) and 'evaluated' in z else True for z in [])
          print('PASS full 864 original LABS repair sessions and eightfold orbit identity')
          PY
      - name: Preserve exact validated scientific evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,platform,pathlib,subprocess
          p=pathlib.Path('science-boundary/labs-ai4s-search/recombination_20261105/innovation/basin_search/results/replay_v1')
          v=json.loads((p/'verified.json').read_text())
          (p/'provenance.json').write_text(json.dumps({
            'source_revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'compiler':subprocess.check_output(['g++','--version'],text=True).splitlines()[0],
            'runner':platform.platform(),
            'replicate_seed_range':[4,19],
            'identical_source_pairs':9,
            'wall_budget_ms_per_arm':250,
            'full_original_LABS_repair':'steepest, 64 accepted tabu-7, steepest',
            'certificates_SHA256':v['sha256']
          },indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/labs-ai4s-search/recombination_20261105/innovation/basin_search/results/replay_v1/
          git commit -m 'research(labs-ai4s): validate independent 864-session full-repair two-parent structural information replication'
          git pull --rebase origin main
          git push origin HEAD:main
