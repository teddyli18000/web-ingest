name: Temp GPT MV full 60 v12-v14 review

on:
  push:
    paths:
      - ".github/workflows/temp-gpt-mv-full60-v12-v14.yml"
  workflow_dispatch:

concurrency:
  group: temp-gpt-mv-full60-v12-v14
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: temp-work/gpt-mv-code-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare full film renderer
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
      - name: Render complete 60-second current timeline
        run: node export/render.mjs --start 0 --end 60 --width 960 --height 540 --fps 15 --art-source reach-hq --bust-source gpt-bust-matted-v5 --out out/gpt_full60_v12_v14.mp4
      - name: Validate export
        run: |
          set -euo pipefail
          test -s out/gpt_full60_v12_v14.mp4
          test -s out/gpt_full60_v12_v14.contact.jpg
          ffmpeg -v error -i out/gpt_full60_v12_v14.mp4 -f null -
          D="$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 out/gpt_full60_v12_v14.mp4)"
          python - "$D" <<'PY'
          import sys
          duration=float(sys.argv[1])
          print('duration',duration)
          assert abs(duration-60)<0.1
          PY
          ffmpeg -hide_banner -i out/gpt_full60_v12_v14.mp4 -vf "blackdetect=d=0.15:pix_th=0.02,freezedetect=n=0.001:d=1.0" -an -f null - 2>&1 | tee out/full60_qc.txt
          if grep -q 'black_start' out/full60_qc.txt; then echo 'unexpected black interval'; exit 1; fi
      - name: Upload film review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mv-full60-v12-v14-${{ github.run_id }}
          path: |
            temp-work/gpt-mv-code-native/out/gpt_full60_v12_v14.mp4
            temp-work/gpt-mv-code-native/out/gpt_full60_v12_v14.contact.jpg
            temp-work/gpt-mv-code-native/out/full60_qc.txt
          retention-days: 14
          if-no-files-found: warn
