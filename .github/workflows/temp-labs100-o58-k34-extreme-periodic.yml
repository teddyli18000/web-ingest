name: temp labs100 O58 K34 extreme periodic exhaustive
on:
  push:
    paths:
      - '.github/workflows/temp-labs100-o58-k34-extreme-periodic.yml'
  workflow_dispatch:
concurrency:
  group: temp-labs100-o58-k34-extreme-periodic
  cancel-in-progress: false
jobs:
  periodic:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact solver
        run: |
          set -euo pipefail
          g++ -O3 -std=c++20 -fopenmp science-boundary/labs-100/code/o58_k34_extreme_periodic_exact.cpp -o "$RUNNER_TEMP/k34-exact"
      - name: Smoke test support quotient and finite GF3 enumeration
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          "$RUNNER_TEMP/k34-exact" 15 | tee smoke.log
          grep -q 'reps_tested=15' smoke.log
          grep -q 'SG_le_48=' smoke.log
      - name: Exhaust all 25-choose-9 supports up to AGL
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          "$RUNNER_TEMP/k34-exact" | tee k34-exact.log
          grep -q 'reps_tested=4113 reps_total=4113' k34-exact.log
          grep '^K34_PERIODIC_EXACT ' k34-exact.log
      - name: Archive exact transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-o58-k34-extreme-periodic
          path: |
            smoke.log
            k34-exact.log
          retention-days: 30
