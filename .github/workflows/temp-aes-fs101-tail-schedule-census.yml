name: temp-aes-fs101-tail-schedule-census

on:
  workflow_dispatch:
  push:
    paths:
      - 'science-boundary/aes-sbox-circuit/fs101_tail_schedule_census.py'
      - '.github/workflows/temp-aes-fs101-tail-schedule-census.yml'

permissions:
  contents: read

jobs:
  census:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust one-gate-saving schedules from FS101 AND31
        run: |
          set -euxo pipefail
          python -m pip install --quiet python-sat
          python -m py_compile science-boundary/aes-sbox-circuit/fs101_tail_schedule_census.py
          python science-boundary/aes-sbox-circuit/fs101_tail_schedule_census.py \
            --start 31 --shard '${{ matrix.shard }}' --shards 4 --conf-budget 300000 \
            --out result | tee run.log
          cat result/summary.json
      - name: Official verifier if <=100 candidate appears
        run: |
          set -euxo pipefail
          if [ -f result/candidate.json ]; then
            git clone --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            mkdir -p /tmp/shot
            cp result/candidate.json /tmp/shot/certificate.json
            python /tmp/few-shots/problems/p008-aes-sbox-circuit/verify/verify.py /tmp/shot | tee official-verifier.jsonl
          else
            echo '{"candidate":null}' | tee official-verifier.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aes-fs101-tail-schedule-census-${{ matrix.shard }}
          path: |
            result
            run.log
            official-verifier.jsonl
