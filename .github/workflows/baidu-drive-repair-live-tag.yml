name: Baidu Drive live tag repair (one shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baidu-drive-repair-live-tag.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair stale Release workflow reference and resume accepted task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/baidu-drive-live" --jq '.object.sha')"
          target="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$current" != "$target" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/baidu-drive-live" \
              -f sha="$target" -F force=true >/dev/null
            echo "Live release dispatch tag updated to current main."
          fi
          active="$(gh api "repos/$GITHUB_REPOSITORY/contents/baidu-drive/state/runtime.json?ref=main" --jq '.content' | base64 -d | jq -r '.active_task // empty')"
          if [[ -n "$active" ]]; then
            gh workflow run baidu-drive-worker.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f "task_id=$active" -f reason=retry
            echo "Resumed accepted task: $active"
          fi
