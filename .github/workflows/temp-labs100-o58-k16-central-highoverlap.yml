name: temp labs100 O58 K16 central high overlaps
on:
  push:
    paths:
      - '.github/workflows/temp-labs100-o58-k16-central-highoverlap.yml'
  workflow_dispatch:
concurrency:
  group: temp-labs100-o58-k16-central-highoverlap
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact uncapped producer and fibre oracle
        shell: bash
        run: |
          set -euo pipefail
          cd science-boundary/labs-100
          python3 code/odd_energy_defect_projection.py | tail -5
          g++ -O3 -std=c++20 -DNDEBUG -fopenmp code/o58_k16_compressed_uncapped.cpp -o "$RUNNER_TEMP/o58-compressed"
          g++ -O3 -std=c++20 -DNDEBUG -fopenmp code/o58_k16_qgroup_exact.cpp -o "$RUNNER_TEMP/o58-fibre"
      - name: High-overlap exact split audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          cat > outputs/tasks.txt <<'TASKS'
          16 5 4 unit
          16 5 4 five
          16 5 5 center
          16 7 6 unit
          16 7 6 five
          16 7 7 center
          TASKS
          export OMP_NUM_THREADS=1
          export OUTROOT="$PWD/outputs"
          export PRODUCER="$RUNNER_TEMP/o58-compressed"
          export FIBRE="$RUNNER_TEMP/o58-fibre"
          xargs -P "$(nproc)" -n 4 bash -c '
            set -euo pipefail
            kp="$2"; t="$3"; cls="$4"
            prefix="$OUTROOT/kp${kp}-t${t}-${cls}"
            "$PRODUCER" "$1" "$kp" "$t" "$cls" > "${prefix}.compressed.log"
            actual=$(grep -c "^HIT " "${prefix}.compressed.log" || true)
            declared=$(sed -n "s/.* qhits=\([0-9]*\).*/\1/p" "${prefix}.compressed.log" | tail -1)
            [[ "$actual" == "$declared" ]]
            lag=0
            [[ "$cls" == unit ]] && lag=1
            [[ "$cls" == five ]] && lag=5
            if (( actual > 0 )); then
              "$FIBRE" "$lag" "${prefix}.compressed.log" > "${prefix}.fibre.log"
            else
              printf "INPUT hits=0 groups=0\nSUMMARY groups=0 outer=0 half=0 qpass=0\n" > "${prefix}.fibre.log"
            fi
            printf "DONE kp=%s t=%s cls=%s hits=%s %s\n" "$kp" "$t" "$cls" "$actual" "$(grep "^SUMMARY " "${prefix}.fibre.log")"
          ' _ < outputs/tasks.txt | tee outputs/progress.txt
          grep -h '^O58_K16_COMPRESSED\|^SUMMARY \|^QHIT ' outputs/*.log > outputs/all-summaries.txt
          cat outputs/all-summaries.txt
      - name: Persist all exact transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-o58-k16-central-highoverlap
          path: outputs/
          retention-days: 30
