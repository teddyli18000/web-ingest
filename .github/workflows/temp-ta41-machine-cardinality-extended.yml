name: temp-ta41-machine-cardinality-extended
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-machine-cardinality-extended.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-machine-cardinality-extended
  cancel-in-progress: false
jobs:
  exclude:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact CP backend
        run: python -m pip install 'ortools==9.14.6206'
      - name: Extend the cardinality frontier until first UNKNOWN or feasible schedule
        run: |
          python3 science-boundary/job-shop-ta41/noncritical_machine_cardinality.py --levels 9 --seconds 4 --total-seconds 650 --out science-boundary/job-shop-ta41/results/machine-cardinality-extended
      - name: Verify any candidate against authoritative upstream
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/machine-cardinality-extended"
          if test -f "$dir/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$dir" | tee "$dir/upstream-verdict.json"
            python3 - "$dir" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Preserve verified structural boundary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/machine-cardinality-extended/
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): extend necessary whole-machine perturbation bound'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
