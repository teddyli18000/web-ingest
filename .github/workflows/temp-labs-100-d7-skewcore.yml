name: temp labs-100 d7 skew-core exact search

on:
  push:
    paths:
      - 'science-boundary/labs-100/code/skewcore_d7_bnb.cpp'
      - '.github/workflows/temp-labs-100-d7-skewcore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d7-target:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bits: ['+--+-', '-+++-', '++-+-', '--++-']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact E<=574 feasibility in large normalized d=7 skew93 branches
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -march=native -std=c++20 -fopenmp -DNDEBUG \
            science-boundary/labs-100/code/skewcore_d7_bnb.cpp -o /tmp/d7
          /tmp/d7 --bits '${{ matrix.bits }}' --cap 524 \
            --threads "$(nproc)" --split 10 --seconds 1500
