name: temp-aes-public5-splice-v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-aes-public5-splice-v2.yml'
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Screen all public five-AND cores against live 102
        run: python3 science-boundary/aes-sbox-circuit/screen_public5_splices_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aes-public5-splice-v2
          path: /tmp/aes-public5-splice-v2
