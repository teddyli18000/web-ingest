name: Riemann-Weil boundary Pick Weyl disk

on:
  push:
    branches: [main]
    paths:
      - 'temp-work/riemann-weil-research/experiments/boundary_pick_weyl_disk.py'
      - '.github/workflows/riemann-weil-boundary-pick.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riemann-weil-boundary-pick
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - c: 13
            nmax: 32
            prec: 3200
            dps: 850
          - c: 100
            nmax: 32
            prec: 5200
            dps: 1400
    steps:
      - name: Checkout research workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check python-flint mpmath

      - name: Fetch pinned cutoff-free verifier
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/akivag613/connes-cvs-.git upstream-connes-cvs
          git -C upstream-connes-cvs checkout --quiet 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c
          test "$(git -C upstream-connes-cvs rev-parse HEAD)" = "5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c"

      - name: Compute boundary Pick Weyl disks
        run: |
          python temp-work/riemann-weil-research/experiments/boundary_pick_weyl_disk.py \
            --upstream-script upstream-connes-cvs/papers/2_guinand_weil_dictionary_tail_order/scripts/arb_ldlt_certify.py \
            --upstream-commit 5a66d0cd177ef8b8ad1c2c93165b8d56ca40292c \
            --c ${{ matrix.c }} --Nmax ${{ matrix.nmax }} \
            --prec ${{ matrix.prec }} --dps ${{ matrix.dps }} \
            --output boundary-pick-c${{ matrix.c }}-N${{ matrix.nmax }}.json
          python -m json.tool boundary-pick-c${{ matrix.c }}-N${{ matrix.nmax }}.json >/dev/null

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: boundary-pick-c${{ matrix.c }}-N${{ matrix.nmax }}
          path: boundary-pick-c${{ matrix.c }}-N${{ matrix.nmax }}.json
          retention-days: 7

  collect:
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download diagnostics
        uses: actions/download-artifact@v4
        with:
          pattern: boundary-pick-*
          path: collected
          merge-multiple: true

      - name: Commit results and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp-work/riemann-weil-research/results
          cp collected/boundary-pick-*.json temp-work/riemann-weil-research/results/
          rm -f .github/workflows/riemann-weil-boundary-pick.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-work/riemann-weil-research/results .github/workflows/riemann-weil-boundary-pick.yml
          git commit -m 'research: record boundary Pick Weyl-disk probe'
          git pull --rebase origin main
          git push origin HEAD:main
