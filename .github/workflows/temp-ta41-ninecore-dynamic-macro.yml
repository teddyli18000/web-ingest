name: temp-ta41-ninecore-dynamic-macro
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-ninecore-dynamic-macro.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-ninecore-dynamic-macro
  cancel-in-progress: false
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        policy: [dynamic,static,core,random]
        seed: [4107,4113]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate official new 2006 parent and program
        run: |
          python3 -m py_compile science-boundary/job-shop-ta41/replacement_macro_pilot.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('science-boundary/job-shop-ta41/results/ninecore-neutral-baseline')
          v=json.loads((p/'neutral-verdict.json').read_text())
          assert v['valid'] and int(v['score'])==2006
          x=json.loads((p/'neutral-certificate.json').read_text())
          assert len(x['machines'])==20 and all(len(m)==30 for m in x['machines'])
          PY
      - name: Dynamic replacement of new bottlenecks from nine-core-crossing neutral basin
        run: |
          python3 science-boundary/job-shop-ta41/replacement_macro_pilot.py \
            --parent ninecore --policy '${{ matrix.policy }}' --seed '${{ matrix.seed }}' \
            --evaluations 22000 --first 8 --second 14 --first-uphill 180 --accept-uphill 24 \
            --out 'science-boundary/job-shop-ta41/results/macro-ninecore-${{ matrix.policy }}-${{ matrix.seed }}'
      - name: Official Few Shots independent scorer on improved schedule
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/macro-ninecore-${{ matrix.policy }}-${{ matrix.seed }}"
          if test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Save matched experiment and any certificate under main
        if: always()
        run: |
          set -euo pipefail
          out='science-boundary/job-shop-ta41/results/macro-ninecore-${{ matrix.policy }}-${{ matrix.seed }}'
          if ! test -d "$out"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): new nine-core neutral basin path replacement ${{ matrix.policy }} ${{ matrix.seed }}'
          for i in $(seq 1 60); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 1
          done
          exit 1
