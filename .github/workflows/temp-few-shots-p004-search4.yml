name: Temp Few Shots p004 exact 4-for-5 search

on:
  push:
    paths:
      - .github/workflows/temp-few-shots-p004-search4.yml
      - temp-work/few-shots-p004/search4.cpp
      - temp-work/few-shots-p004/materialize.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-few-shots-p004-search4
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream problem read-only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
      - name: Prepare baseline IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 temp-work/few-shots-p004/materialize.py extract "$RUNNER_TEMP/few-shots/problems/p004-shannon-capacity-c7/baseline/certificate.json" "$RUNNER_TEMP/ids.txt"
      - name: Compile exact search
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -DNDEBUG -march=native -std=c++20 -fopenmp temp-work/few-shots-p004/search4.cpp -o "$RUNNER_TEMP/search4"
      - name: Search exact 4-for-5 exchanges
        id: search
        shell: bash
        env:
          OMP_PROC_BIND: "true"
          OMP_PLACES: cores
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS="$(nproc)"
          free -h
          /usr/bin/time -v "$RUNNER_TEMP/search4" "$RUNNER_TEMP/ids.txt" > "$RUNNER_TEMP/result.json"
          cat "$RUNNER_TEMP/result.json"
          mkdir -p "$RUNNER_TEMP/shot"
          python3 temp-work/few-shots-p004/materialize.py build "$RUNNER_TEMP/few-shots/problems/p004-shannon-capacity-c7/baseline/certificate.json" "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/shot/certificate.json" "$RUNNER_TEMP/status.json"
          [[ -f "$RUNNER_TEMP/shot/certificate.json" ]] && echo found=true >> "$GITHUB_OUTPUT" || echo found=false >> "$GITHUB_OUTPUT"
      - name: Verify breakthrough with upstream verifier
        if: steps.search.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot" | tee "$RUNNER_TEMP/verify.json"
          python3 - "$RUNNER_TEMP/verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if not r.get("valid") or int(r["score"])<=134753: raise SystemExit(r)
          print(f"verified breakthrough score={r['score']}")
          PY
      - name: Save verified breakthrough in web-ingest only
        if: steps.search.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp-work/few-shots-p004/breakthrough
          cp "$RUNNER_TEMP/shot/certificate.json" temp-work/few-shots-p004/breakthrough/certificate.json
          cp "$RUNNER_TEMP/result.json" temp-work/few-shots-p004/breakthrough/search4-result.json
          cp "$RUNNER_TEMP/status.json" temp-work/few-shots-p004/breakthrough/search4-status.json
          cp "$RUNNER_TEMP/verify.json" temp-work/few-shots-p004/breakthrough/search4-verify-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp-work/few-shots-p004/breakthrough
          git commit -m "temp: save verified p004 4-for-5 breakthrough"
          git fetch origin main && git rebase origin/main && git push origin HEAD:main
      - name: Summarize
        if: always()
        shell: bash
        run: |
          { echo "## Few Shots p004 exact 4-for-5"; [[ -f "$RUNNER_TEMP/result.json" ]] && { echo '```json'; cat "$RUNNER_TEMP/result.json"; echo '```'; }; [[ -f "$RUNNER_TEMP/verify.json" ]] && { echo '```json'; cat "$RUNNER_TEMP/verify.json"; echo '```'; }; } >> "$GITHUB_STEP_SUMMARY"
