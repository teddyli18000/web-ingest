name: temp-google-trending-rss-check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-google-trending-rss-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Probe Trending Now fallback and direct RSS
        shell: bash
        run: |
          set -euo pipefail
          npx --yes google-trends-now@1.1.1 trending --geo SG --hours 24 --sort relevance --limit all --format json --fallback rss --retries 2 --timeout-ms 30000 > "$RUNNER_TEMP/trending.json"
          npx --yes google-trends-now@1.1.1 rss --geo SG --limit all --format json --retries 2 --timeout-ms 30000 > "$RUNNER_TEMP/rss.json"
          node - "$RUNNER_TEMP/trending.json" "$RUNNER_TEMP/rss.json" <<'NODE'
          const fs = require("fs");
          for (const file of process.argv.slice(2)) {
            const x = JSON.parse(fs.readFileSync(file, "utf8"));
            console.log(JSON.stringify({
              probe: file.endsWith("/rss.json") ? "rss" : "trending",
              source: x.source,
              fetch_status: x.fetch_status,
              error: x.error ?? null,
              item_count: Array.isArray(x.items) ? x.items.length : null
            }));
          }
          NODE
