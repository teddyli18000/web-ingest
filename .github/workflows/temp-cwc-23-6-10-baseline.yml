name: Temporary CWC A(23,6,10) baseline verification

on:
  push:
    branches: [main]
    paths:
      - 'science-boundary/constant-weight-23-6-10/code/**'
      - 'science-boundary/constant-weight-23-6-10/tests/**'
      - '.github/workflows/temp-cwc-23-6-10-baseline.yml'

permissions:
  contents: write

concurrency:
  group: temp-cwc-23-6-10-baseline
  cancel-in-progress: false

jobs:
  verify-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s science-boundary/constant-weight-23-6-10/tests -v
      - name: Retrieve, independently check, and benchmark Brouwer's certificate
        run: python science-boundary/constant-weight-23-6-10/code/reproduce_baseline.py
      - uses: actions/upload-artifact@v4
        with:
          name: cwc-23-6-10-baseline
          path: |
            science-boundary/constant-weight-23-6-10/baseline/certificate.json
            science-boundary/constant-weight-23-6-10/results/baseline-check.json
      - name: Preserve checked artifacts on main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/constant-weight-23-6-10/baseline/certificate.json science-boundary/constant-weight-23-6-10/results/baseline-check.json
          if ! git diff --cached --quiet; then
            git commit -m "science: preserve verified A(23,6,10) baseline"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
