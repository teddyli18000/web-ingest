name: temp-ta41-blind-counterfactual-ihs
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-blind-counterfactual-ihs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-blind-counterfactual-ihs
  cancel-in-progress: false
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        policy: [dynamic, static, random]
        case: [ta43js-n7elite1711, ta46js-n7elite1701]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Pinned exact CP and correctness smoke check
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/joint_conflict_hitting_repair.py
      - name: Full oracle-blind candidate-root screening and joint conflict cover
        run: |
          python3 science-boundary/job-shop-ta41/joint_conflict_hitting_repair.py \
            --start 'science-boundary/job-shop-ta41/positive-n7-elite-data/${{ matrix.case }}/start.txt' \
            --policy '${{ matrix.policy }}' --seed 333 \
            --root-pool 80 --roots 14 --iterations 100 \
            --cp-seconds 0.35 --hit-seconds 0.4 --seconds 150 \
            --out 'science-boundary/job-shop-ta41/results/ihs-blind-${{ matrix.case }}-${{ matrix.policy }}'
      - name: Preserve per-root traces and independent complete-DAG construction
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/ihs-blind-${{ matrix.case }}-${{ matrix.policy }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): oracle-blind precompletion IHS ${{ matrix.case }} ${{ matrix.policy }}'
          for attempt in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
