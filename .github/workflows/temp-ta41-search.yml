name: temp-ta41-search
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/**'
      - '.github/workflows/temp-ta41-search.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-search
  cancel-in-progress: false
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Explore ta41
        run: |
          python3 science-boundary/job-shop-ta41/search.py --seconds 720 --seed 41 --output science-boundary/job-shop-ta41/results/seed41
          python3 science-boundary/job-shop-ta41/search.py --seconds 720 --seed 1009 --output science-boundary/job-shop-ta41/results/seed1009
      - name: Verify against independent Few Shots verifier
        run: |
          git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
          cd /tmp/few-shots
          python3 problems/p009-job-shop-ta41/verify/verify.py "$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/seed41"
          python3 problems/p009-job-shop-ta41/verify/verify.py "$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/seed1009"
      - name: Save research results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): record independently verified tabu search results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
