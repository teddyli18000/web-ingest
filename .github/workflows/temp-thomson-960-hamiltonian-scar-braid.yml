name: temp Thomson 960 Hamiltonian scar-braid candidate search

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-hamiltonian-scar-braid.yml'

jobs:
  candidate-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [1101, 2202, 3303]
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: few-shots/few-shots
          path: few-shots
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy numba
      - name: Compile candidate generator
        run: python3 -m py_compile science-boundary/thomson-960/code/search_hamiltonian_scar_braid.py
      - uses: actions/download-artifact@v4
        with:
          pattern: thomson-saddle-chord-886-*
          path: ${{ runner.temp }}/chords
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41857433482
      - name: Search complete N960 geometries and preserve any record breaker
        run: |
          python3 science-boundary/thomson-960/code/search_hamiltonian_scar_braid.py \
            few-shots --chord-dir "$RUNNER_TEMP/chords" \
            --seed ${{ matrix.seed }} --trials 240 --maxiter 650 \
            --temp 0.075 --out "$RUNNER_TEMP/out"
      - name: Evaluate candidate quality
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,json
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/'result.json'
          if not p.exists():
              print('NO_RESULT'); raise SystemExit(0)
          d=json.loads(p.read_text())
          rows=[r for r in d['rows'] if 'energy' in r]
          mode={}
          for m in ('vortices','dipole','braid','randomcap'):
              z=[r for r in rows if r['mode']==m]
              mode[m]={'trials':len(z),'min_delta':min((r['delta_record'] for r in z),default=None),
                       'near_record_0.05':sum(r['delta_record']<0.05 for r in z),
                       'distinct_0.05':sum(r['delta_record']<0.05 and r['unique'] for r in z)}
          print('SEED',d['seed'],'TRIALS',d['trials_done'],
                'BEST',d['best_energy'],'DELTA',d['best_delta_record'],
                'CANDIDATES',d['candidates_below_record'])
          print('MODE',json.dumps(mode,sort_keys=True))
          print('POOL',[(a['energy'],a['tag']) for a in d['population']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thomson-scar-braid-seed-${{ matrix.seed }}
          path: ${{ runner.temp }}/out
          retention-days: 10
