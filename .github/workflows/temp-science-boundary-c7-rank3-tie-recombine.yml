name: Temp Science Boundary C7 rank3 tie exact recombination

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-rank3-tie-recombine.yml
      - science-boundary/shannon-capacity-c7/code/neutral2_rank3_tie_seed.py
      - science-boundary/shannon-capacity-c7/code/recombine_two_independent_sets.py
      - science-boundary/shannon-capacity-c7/code/bpz_jplus_seed.py
      - science-boundary/shannon-capacity-c7/code/generalized9.py
      - science-boundary/shannon-capacity-c7/code/neutral2_maxsat.py
      - science-boundary/shannon-capacity-c7/code/neutral2_sweep.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recombine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
          git -C "$RUNNER_TEMP/few-shots" sparse-checkout set problems/p004-shannon-capacity-c7
          git init "$RUNNER_TEMP/shannon-source"
          git -C "$RUNNER_TEMP/shannon-source" remote add origin https://github.com/nathanielitty/lower-bounds-for-shannon-capacity.git
          git -C "$RUNNER_TEMP/shannon-source" fetch --depth 1 origin fe8966079013abaac21d1c08441500100f8e3b86
          git -C "$RUNNER_TEMP/shannon-source" checkout FETCH_HEAD
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
      - name: Install exact MaxSAT dependency
        run: python3 -m pip install --disable-pip-version-check python-sat
      - name: Materialize rank3 tie and Jplus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rank3" "$RUNNER_TEMP/Jp" "$RUNNER_TEMP/result" "$RUNNER_TEMP/shot-baseline" "$RUNNER_TEMP/shot-jp"
          python3 science-boundary/shannon-capacity-c7/code/neutral2_rank3_tie_seed.py \
            "$RUNNER_TEMP/shannon-source/c7/R367.txt" \
            "$RUNNER_TEMP/rank3/certificate.json" "$RUNNER_TEMP/result/rank3-status.json"
          python3 science-boundary/shannon-capacity-c7/code/bpz_jplus_seed.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/Jp/certificate.json" "$RUNNER_TEMP/result/jp-status.json"
      - name: Verify all three 134753 inputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py problems/p004-shannon-capacity-c7/baseline | tee "$RUNNER_TEMP/result/baseline-verify.json"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/rank3" | tee "$RUNNER_TEMP/result/rank3-verify.json"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/Jp" | tee "$RUNNER_TEMP/result/jp-verify.json"
          python3 - "$RUNNER_TEMP/result/baseline-verify.json" "$RUNNER_TEMP/result/rank3-verify.json" "$RUNNER_TEMP/result/jp-verify.json" <<'PY'
          import json,sys
          for p in sys.argv[1:]:
              r=json.load(open(p,encoding='utf-8'))
              if not r.get('valid') or int(r.get('score',-1)) != 134753:
                  raise SystemExit((p,r))
          PY
      - name: Exact rank3 x baseline recombination
        id: rb
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/recombine_two_independent_sets.py \
            "$RUNNER_TEMP/rank3/certificate.json" \
            "$RUNNER_TEMP/few-shots/problems/p004-shannon-capacity-c7/baseline/certificate.json" \
            "$RUNNER_TEMP/shot-baseline/certificate.json" "$RUNNER_TEMP/result/rank3-baseline.json"
          cat "$RUNNER_TEMP/result/rank3-baseline.json"
          if [[ -f "$RUNNER_TEMP/shot-baseline/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify rank3 x baseline breakthrough
        if: steps.rb.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot-baseline" | tee "$RUNNER_TEMP/result/rank3-baseline-verify.json"
          python3 - "$RUNNER_TEMP/result/rank3-baseline-verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1)) <= 134753: raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH rank3 x baseline',r)
          PY
          cp "$RUNNER_TEMP/shot-baseline/certificate.json" "$RUNNER_TEMP/result/candidate-rank3-baseline.json"
      - name: Exact rank3 x Jplus recombination
        id: rj
        shell: bash
        run: |
          set -euo pipefail
          python3 science-boundary/shannon-capacity-c7/code/recombine_two_independent_sets.py \
            "$RUNNER_TEMP/rank3/certificate.json" "$RUNNER_TEMP/Jp/certificate.json" \
            "$RUNNER_TEMP/shot-jp/certificate.json" "$RUNNER_TEMP/result/rank3-jplus.json"
          cat "$RUNNER_TEMP/result/rank3-jplus.json"
          if [[ -f "$RUNNER_TEMP/shot-jp/certificate.json" ]]; then echo found=true >> "$GITHUB_OUTPUT"; else echo found=false >> "$GITHUB_OUTPUT"; fi
      - name: Verify rank3 x Jplus breakthrough
        if: steps.rj.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/few-shots"
          python3 problems/p004-shannon-capacity-c7/verify/verify.py "$RUNNER_TEMP/shot-jp" | tee "$RUNNER_TEMP/result/rank3-jplus-verify.json"
          python3 - "$RUNNER_TEMP/result/rank3-jplus-verify.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if not r.get('valid') or int(r.get('score',-1)) <= 134753: raise SystemExit(r)
          print('VERIFIED BREAKTHROUGH rank3 x Jplus',r)
          PY
          cp "$RUNNER_TEMP/shot-jp/certificate.json" "$RUNNER_TEMP/result/candidate-rank3-jplus.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-rank3-tie-recombine
          path: ${{ runner.temp }}/result
          retention-days: 14
