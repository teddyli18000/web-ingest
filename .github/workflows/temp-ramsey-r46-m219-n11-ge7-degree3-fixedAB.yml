name: Temp Ramsey R46 m219 n11>=7 degree3 fixed-AB cover

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/m219_n11_ge7_degree3_fixed_ab.py
      - .github/workflows/temp-ramsey-r46-m219-n11-ge7-degree3-fixedAB.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Prepare authenticated A26/B116 catalogues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46/catalogs
          curl --fail --location --retry 3 --silent --show-error https://users.cecs.anu.edu.au/~bdm/data/r36_11.g6.gz -o /tmp/r46/r36_11.g6.gz
          curl --fail --location --retry 3 --silent --show-error https://users.cecs.anu.edu.au/~bdm/data/r45_24.g6 -o /tmp/r46/r45_24.g6
          echo '628c53df90910b2aae9a9559a62605593ff6fcdac66e9f23f95a134a4a696f36  /tmp/r46/r36_11.g6.gz' | sha256sum -c -
          echo '83ca4028f206b2fa4315ef219b8c2c57c7835209673dd8183d8fb4353bd4fdd0  /tmp/r46/r45_24.g6' | sha256sum -c -
          PYTHONPATH=science-boundary/ramsey-r46 python science-boundary/ramsey-r46/m219_n11_ge7_degree3_fixed_ab.py --self-test
          PYTHONPATH=science-boundary/ramsey-r46 python science-boundary/ramsey-r46/m219_n11_6_degree3_fixed_ab.py prepare \
            --r36-11 /tmp/r46/r36_11.g6.gz --r45-24 /tmp/r46/r45_24.g6 --outdir /tmp/r46/catalogs --manifest /tmp/r46/unused.json
      - uses: actions/upload-artifact@v4
        with:
          name: ramsey-r46-m219-n11-ge7-degree3-catalogs
          path: /tmp/r46/catalogs
          retention-days: 7

  solve:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        a: [0,1]
        b: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: ramsey-r46-m219-n11-ge7-degree3-catalogs
          path: /tmp/r46/catalogs
      - run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev17'
      - name: Solve one exact pair covering all nine global degree sequences
        id: solve
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/r46/out
          set +e
          timeout --signal=TERM --kill-after=20s 420 env PYTHONPATH=science-boundary/ramsey-r46 \
            python science-boundary/ramsey-r46/m219_n11_ge7_degree3_fixed_ab.py \
            --catalog-dir /tmp/r46/catalogs --a-ordinal '${{ matrix.a }}' --b-ordinal '${{ matrix.b }}' \
            --summary /tmp/r46/out/summary.json --output /tmp/r46/out/candidate.json > /tmp/r46/out/solver.log 2>&1
          rc=$?; set -e
          case "$rc" in 0) status=SAT;;20) status=UNSAT;;124|137|143) status=TIMEOUT;;*) status=ERROR;;esac
          if [[ ! -f /tmp/r46/out/summary.json ]]; then
            python - /tmp/r46/out/summary.json "$status" "$rc" '${{ matrix.a }}' '${{ matrix.b }}' <<'PY'
          import json,sys
          p,st,rc,a,b=sys.argv[1:];open(p,'w').write(json.dumps({'campaign':'m219-n11-ge7-degree3-fixedAB','status':st,'solver_exit':int(rc),'a_ordinal':int(a),'b_ordinal':int(b)},indent=2)+'\n')
          PY
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/r46/out/summary.json; tail -n20 /tmp/r46/out/solver.log || true
          [[ "$status" != ERROR ]]
      - name: Authoritative Few Shots verification on SAT
        if: steps.solve.outputs.status == 'SAT'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/few-shots/few-shots.git /tmp/few-shots
          git -C /tmp/few-shots sparse-checkout set problems/p003-ramsey-r46
          mkdir -p /tmp/candidate; cp /tmp/r46/out/candidate.json /tmp/candidate/certificate.json
          cd /tmp/few-shots
          python3 problems/p003-ramsey-r46/verify/verify.py /tmp/candidate | tee /tmp/r46/out/few-shots-verify.json
          python3 - /tmp/r46/out/few-shots-verify.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]));assert d.get('valid') is True and str(d.get('score'))=='36',d
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-m219-n11-ge7-degree3-${{ matrix.a }}-${{ matrix.b }}
          path: /tmp/r46/out
          if-no-files-found: warn
          retention-days: 7

  collect:
    if: always()
    needs: [prepare,solve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: ramsey-r46-m219-n11-ge7-degree3-*
          path: /tmp/parts
      - name: Aggregate exact 18-pair cover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          python - /tmp/parts /tmp/r46/result.json <<'PY'
          import json,pathlib,shutil,sys
          rows=[];hits=[];vers=[]
          for p in pathlib.Path(sys.argv[1]).rglob('summary.json'):
            d=json.load(open(p));rows.append(d);c=p.parent/'candidate.json';v=p.parent/'few-shots-verify.json'
            if c.exists():hits.append((d,c,v if v.exists() else None))
            if v.exists():vers.append(json.load(open(v)))
          rows.sort(key=lambda d:(d['a_ordinal'],d['b_ordinal']));counts={}
          for r in rows:counts[r['status']]=counts.get(r['status'],0)+1
          d={'campaign':'m219-n11-ge7-degree3-fixedAB','logical_scope':'all m219 n11=7..11 degree sequences having a degree-3 vertex in the d11-induced graph',
             'proof_cover':'2 A26 x 9 B116; nine global degree sequences quantified by one-hot selector inside each branch','expected_branches':18,
             'branches_attempted':len(rows),'status_counts':counts,'all_unsat':len(rows)==18 and counts.get('UNSAT',0)==18,
             'sat_count':counts.get('SAT',0),'timeout_count':counts.get('TIMEOUT',0),'verified_sat_count':sum(v.get('valid') is True and str(v.get('score'))=='36' for v in vers),'rows':rows}
          if hits:
            hd,c,v=hits[0];shutil.copyfile(c,'/tmp/r46/candidate.json');
            if v:shutil.copyfile(v,'/tmp/r46/few-shots-verify.json')
          open(sys.argv[2],'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n');print(json.dumps({k:v for k,v in d.items() if k!='rows'},sort_keys=True))
          PY
      - name: Persist campaign and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/m219-n11-ge7-degree3-fixedAB.json
          [[ ! -f /tmp/r46/candidate.json ]] || cp /tmp/r46/candidate.json science-boundary/ramsey-r46/results/m219-n11-ge7-degree3-hit.json
          [[ ! -f /tmp/r46/few-shots-verify.json ]] || cp /tmp/r46/few-shots-verify.json science-boundary/ramsey-r46/results/m219-n11-ge7-degree3-hit-verify.json
          git rm .github/workflows/temp-ramsey-r46-m219-n11-ge7-degree3-fixedAB.yml
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/m219-n11-ge7-degree3-*.json
          git commit -m 'ramsey-r46: record combined n11>=7 degree3 cover'
          for i in 1 2 3 4 5;do git pull --rebase origin main && git push origin HEAD:main && exit 0;sleep $((i*4));done;exit 1
