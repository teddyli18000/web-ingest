name: temp-p017-paired-insertion
on:
  push:
    paths:
      - '.github/workflows/temp-p017-paired-insertion.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p017-paired-insertion
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch authoritative matrix and baseline
        run: |
          git clone -q --depth 1 https://github.com/few-shots/few-shots.git /tmp/few-shots
          python3 science-boundary/lop-be75eec-500/prepare.py /tmp/few-shots
      - name: Select highest-scoring verified starting permutation
        run: |
          python3 - <<'PY'
          import pathlib,json,subprocess
          root=pathlib.Path('science-boundary/lop-be75eec-500/results')
          numbers=list(map(int,pathlib.Path('matrix.txt').read_text().split()))
          W=[numbers[1+i*500:1+(i+1)*500] for i in range(500)]
          paths=[pathlib.Path('/tmp/few-shots/problems/p017-lop-be75eec-500/baseline/certificate.json')]
          paths.extend(p for name in ['best.json','subset-best.json','paired-best.json'] if (p:=root/name).exists())
          def sc(p):return sum(W[p[i]][p[j]] for i in range(500) for j in range(i+1,500))
          vals=[]
          for path in paths:
            p=json.loads(path.read_text())['order']
            assert sorted(p)==list(range(500))
            vals.append((sc(p),p,str(path)))
          s,p,path=max(vals)
          pathlib.Path('baseline.txt').write_text(' '.join(map(str,p)))
          print('START',path,s)
          PY
      - name: Compile paired-insertion optimizer
        run: g++ -std=c++17 -O3 -march=native -pthread science-boundary/lop-be75eec-500/paired_insert.cpp -o /tmp/pairs
      - name: Search long-range coupled pairs
        run: |
          mkdir -p science-boundary/lop-be75eec-500/results
          /tmp/pairs matrix.txt baseline.txt science-boundary/lop-be75eec-500/results/paired-best.json 520 4 2>&1 | tee science-boundary/lop-be75eec-500/results/paired-search.log
      - name: Independent official score verification
        run: |
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('science-boundary/lop-be75eec-500/results')
          result=root/'paired-best.json'
          if not result.exists():
            result.write_text(json.dumps({'order':list(map(int,pathlib.Path('baseline.txt').read_text().split()))},separators=(',',':')))
          (root/'certificate.json').write_text(result.read_text())
          PY
          python3 /tmp/few-shots/problems/p017-lop-be75eec-500/verify/verify.py science-boundary/lop-be75eec-500/results | tee science-boundary/lop-be75eec-500/results/paired-verification.json
      - name: Commit verified experiment
        run: |
          git config user.name 'p017-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/lop-be75eec-500/results/
          if ! git diff --cached --quiet; then
            git commit -m 'science: persist coupled-pair LOP search outcomes'
            git pull --rebase
            git push
          fi
