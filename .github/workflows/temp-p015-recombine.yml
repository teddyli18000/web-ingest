name: Temporary p015 global recombination
on:
  push:
    paths:
      - .github/workflows/temp-p015-recombine.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temp-p015-recombine
  cancel-in-progress: false
jobs:
  recombine:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: 2401, parents: 2, diversity: 4, near: ""}
          - {seed: 2402, parents: 2, diversity: 3, near: "--near"}
          - {seed: 2403, parents: 3, diversity: 4, near: ""}
          - {seed: 2404, parents: 3, diversity: 3, near: "--near"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install constraint solver
        run: python -m pip install ortools==9.14.6206
      - name: Retrieve upstream baseline and verifier
        run: |
          curl -fsSL https://raw.githubusercontent.com/few-shots/few-shots/main/problems/p015-covering-15-9-7/baseline/certificate.json -o /tmp/p015-baseline.json
          curl -fsSL https://raw.githubusercontent.com/few-shots/few-shots/main/problems/p015-covering-15-9-7/verify/verify.py -o /tmp/p015-verify.py
      - name: Global recombination
        run: |
          python science-boundary/covering-15-9-7/recombine.py --input /tmp/p015-baseline.json --out p015-recombined --seed ${{ matrix.seed }} --rounds 8 --parents ${{ matrix.parents }} --seconds 120 --workers 4 --diversity ${{ matrix.diversity }} ${{ matrix.near }}
          python /tmp/p015-verify.py p015-recombined | tee p015-recombined/upstream-verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p015-recombination-${{ matrix.seed }}
          path: p015-recombined/
