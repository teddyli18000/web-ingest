name: temp Thomson scar-elite topology for next generation

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-scar-elite-topology.yml'

jobs:
  describe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: few-shots/few-shots
          path: few-shots
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - name: Identify what makes new low-energy parents structurally different
        run: |
          python3 - <<'PY'
          import json,pathlib,sys,numpy as np
          sys.path.insert(0,'science-boundary/thomson-960/code')
          import search_size_beam as sb
          from search_learned_event_grammar import defect_signature
          root=pathlib.Path('few-shots')
          score,shot=sb.find_live(root)
          d2=root/'problems/p007-thomson-problem/shots/Abreto/thomson960-d2-ga/certificate.json'
          item=json.loads(pathlib.Path('science-boundary/thomson-960/data/scar-braid-elites-2202-2026-11-06.json').read_text())
          starts=[('record_R',score,sb.load_cert(shot/'certificate.json')),
                  ('D2',444368.4040805305,sb.load_cert(d2))]
          starts +=[(x['origin_tag'],x['energy'],np.asarray(x['points'],float))
                    for x in item['minima']]
          lines=['Constructive scar-braid elite defect signatures (2026-11-06)',
                 'Point-wise energies independently repolished in capture run 42253037254.',
                 'Use these signatures to choose structurally different N960 parents and coordinated scar rearrangements, NOT as an exclusion certificate.',
                 '']
          for name,E,x in starts:
              s=defect_signature(x)
              row={'name':name,'energy':float(E),'delta_record':float(E-score),
                   'coord':s['coord'],'component_types':s['components'],'twins':s['twins']}
              lines.append(json.dumps(row,separators=(',',':')))
              print(name,'E',E,'coord',s['coord'],'components',s['components'],'twins',s['twins'])
          out=pathlib.Path('science-boundary/thomson-960/results/scar-braid-novel-topology-2026-11-06.txt')
          out.write_text('\n'.join(lines)+'\n')
          PY
      - name: Persist structural parent selection evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/thomson-960/results/scar-braid-novel-topology-2026-11-06.txt
          git commit -m "thomson: compare verified novel scar parent defect structures"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
