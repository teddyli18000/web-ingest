name: AI Daily smoke test

on:
  push:
    branches:
      - agent/ai-daily-prewarm
    paths:
      - .github/workflows/ai-daily-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-daily-prewarm
          fetch-depth: 0

      - name: Validate repository schedule
        run: python tools/check-repository-integrity.py --show

      - name: Exercise AIHOT collector against isolated runner storage
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$RUNNER_TEMP/ai-daily"
          mkdir -p "$sandbox"
          cp ai-daily/fetch_aihot_daily.py "$sandbox/fetch_aihot_daily.py"

          python3 "$sandbox/fetch_aihot_daily.py" --date 2026-09-01 --attempts 1
          test -s "$sandbox/data/2026/09/01/aihot-daily.json"
          test -s "$sandbox/data/2026/09/01/aihot-daily.html"

          # A second immediate fetch must accept the already-written bytes as identical.
          python3 "$sandbox/fetch_aihot_daily.py" --date 2026-09-01 --attempts 1

      - name: Verify scheduled no-op prerequisite
        shell: bash
        run: |
          set -euo pipefail
          test -s ai-daily/data/2026/09/01/aihot-daily.json
          test -s ai-daily/data/2026/09/01/aihot-daily.html
          echo "Complete same-day snapshot is detectable for scheduled early exit."
