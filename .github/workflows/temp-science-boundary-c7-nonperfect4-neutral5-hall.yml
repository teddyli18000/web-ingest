name: Temp Science Boundary C7 nonperfect4 x neutral5 Hall screen

on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-c7-nonperfect4-neutral5-hall.yml
      - science-boundary/shannon-capacity-c7/code/bpz_nonperfect4_neutral5_hall_screen.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-science-boundary-c7-nonperfect4-neutral5-hall
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Tan/BPZ source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tan"
          git -C "$RUNNER_TEMP/tan" remote add origin https://github.com/tandonravi/C7-Shannon-Capacity-Heterogeneous-Recursion.git
          git -C "$RUNNER_TEMP/tan" fetch --depth 1 origin c753408492dde92a239708986d16c15dbf6c3235
          git -C "$RUNNER_TEMP/tan" checkout FETCH_HEAD
      - name: Exact Hall-relaxation screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          /usr/bin/time -v python3 science-boundary/shannon-capacity-c7/code/bpz_nonperfect4_neutral5_hall_screen.py \
            "$RUNNER_TEMP/tan" "$RUNNER_TEMP/result/status.json" --workers "$(nproc)" \
            > "$RUNNER_TEMP/result/stdout" 2> "$RUNNER_TEMP/result/stderr"
          cat "$RUNNER_TEMP/result/stdout"
          tail -n 100 "$RUNNER_TEMP/result/stderr"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c7-nonperfect4-neutral5-hall
          path: ${{ runner.temp }}/result
          retention-days: 14
