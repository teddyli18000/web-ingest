name: temp-ta41-gateway-coordinated-micro-repair
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-gateway-coordinated-micro-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-gateway-coordinated-micro-repair
  cancel-in-progress: false
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - gateway: 124
            r: 1
            budget: 20
          - gateway: 124
            r: 2
            budget: 40
          - gateway: 120
            r: 1
            budget: 20
          - gateway: 127
            r: 1
            budget: 20
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CP solver
        run: |
          python3 -m pip install 'ortools==9.14.6206'
          python3 -m py_compile science-boundary/job-shop-ta41/synchronous_small_inversions.py
      - name: Test exact joint micro-repairs AFTER necessary gateway inversion
        run: |
          python3 science-boundary/job-shop-ta41/synchronous_small_inversions.py \
            --parent '${{ matrix.gateway }}' --target 2005 \
            --per-machine '${{ matrix.r }}' --min-swaps 0 \
            --max-swaps '${{ matrix.budget }}' --min-machines 0 --seconds 145 \
            --out 'science-boundary/job-shop-ta41/results/gateway-repair-${{ matrix.gateway }}-r${{ matrix.r }}'
      - name: Official Few Shots verifier if <=2005 found
        if: always()
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/science-boundary/job-shop-ta41/results/gateway-repair-${{ matrix.gateway }}-r${{ matrix.r }}"
          if test -f "$out/certificate.json"; then
            git clone --depth=1 https://github.com/few-shots/few-shots.git /tmp/few-shots
            cd /tmp/few-shots
            python3 problems/p009-job-shop-ta41/verify/verify.py "$out" | tee "$out/upstream-verdict.json"
            python3 - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);v=json.loads((p/'upstream-verdict.json').read_text())
          assert v['valid'] and int(v['score'])<=2005,v
          PY
          fi
      - name: Preserve exact result with main retry
        if: always()
        run: |
          set -euo pipefail
          dir='science-boundary/job-shop-ta41/results/gateway-repair-${{ matrix.gateway }}-r${{ matrix.r }}'
          if ! test -d "$dir"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(ta41): atomic gateway repair ${{ matrix.gateway }} r${{ matrix.r }}'
          for i in $(seq 1 30); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
