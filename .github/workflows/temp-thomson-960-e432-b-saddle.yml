name: temp Thomson 960 e432-B saddle

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-e432-b-saddle.yml'

jobs:
  saddle:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - run: git clone --depth 1 https://github.com/few-shots/few-shots.git "$RUNNER_TEMP/few-shots"
      - name: Relax e432-B perpendicular string
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 science-boundary/thomson-960/code/string_between_seeds.py \
            "$RUNNER_TEMP/seed/e432.json" "$RUNNER_TEMP/seed/B-natural.json" \
            --images 13 --iterations 1200 --eta 0.00020 --max-step 0.00045 \
            --perp-tol 0.00004 --climb-iterations 180 \
            --out "$RUNNER_TEMP/out/string.json"
      - name: Refine candidate by hybrid eigenvector following
        run: |
          python3 science-boundary/thomson-960/code/refine_saddle_eigenfollow.py \
            "$RUNNER_TEMP/out/string.json" --cycles 10 --steps-per-cycle 70 \
            --eta 0.00022 --max-rms-step 0.000008 --final-k 8 \
            --out "$RUNNER_TEMP/out/refined.json"
      - name: Descend reaction sides and scan transverse modes when index-1-like
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','refined.json')))
          print('REFINED',d['final_energy'],'grad',d['final_gradient_rms'],'neg',d['negative_internal_modes_below_-1e-3'])
          print('MODES',[(r['index'],r['eigenvalue']) for r in d['final_modes'][:8]])
          PY
          neg=$(python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','refined.json'))); print(d['negative_internal_modes_below_-1e-3'])
          PY
          )
          if [[ "$neg" != "1" ]]; then
            echo "Not clean index-1; retain diagnostic and stop transverse scan."
            exit 0
          fi
          for m in 1 2 3 4; do
            for s in -1 1; do
              python3 science-boundary/thomson-960/code/search_saddle_transverse.py \
                "$RUNNER_TEMP/few-shots" "$RUNNER_TEMP/out/refined.json" \
                --transverse-mode "$m" --sign "$s" \
                --transverse-amps 0.0012,0.0025,0.0045,0.0075,0.012 \
                --reaction-amps=-0.0012,0,0.0012 \
                --out "$RUNNER_TEMP/out/transverse-m${m}-s${s}.json"
            done
          done
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,glob,os
          r=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','string.json')))
          q=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','refined.json')))
          print('STRING_CONV',r['string_converged'],'MAX_PERP',r['max_path_perpendicular_gradient_rms'],'CLIMB',r['climbing_energy'],r['climbing_gradient_rms'])
          print('REFINED',q['final_energy'],q['final_gradient_rms'],q['negative_internal_modes_below_-1e-3'])
          best=(1e300,None)
          for p in glob.glob(os.path.join(os.environ['RUNNER_TEMP'],'out','transverse-*.json')):
              d=json.load(open(p)); print('TRANSVERSE',os.path.basename(p),d['best_float_energy'],d['best_delta_vs_live'])
              if d['best_float_energy']<best[0]: best=(d['best_float_energy'],p)
          if best[1]: print('BEST_TRANSVERSE',best)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-e432-B-saddle
          path: ${{ runner.temp }}/out
          retention-days: 10
