name: temp-ta41-judge-hidden-positive-benchmark
on:
  push:
    paths:
      - '.github/workflows/temp-ta41-judge-hidden-positive-benchmark.yml'
      - 'science-boundary/job-shop-ta41/results/positive-original-n7/results.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-judge-hidden-positive-benchmark
  cancel-in-progress: false
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Ensure all native and source-matched positive controls are ready
        run: |
          set -euo pipefail
          test -f science-boundary/job-shop-ta41/results/positive-original-n7/results.json
          for policy in tabu static3 dynamic3; do
            test -f science-boundary/job-shop-ta41/results/positive-cascade-$policy/results.json
          done
      - name: Independent post-search score aggregation, compare all matched starts
        run: python3 science-boundary/job-shop-ta41/judge_hidden_positive.py
      - name: Save verified fair-budget comparison
        run: |
          set -euo pipefail
          file='science-boundary/job-shop-ta41/results/positive-joint-benchmark-judged.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'research(ta41): blinded positive-control paired objective and source-N7 judgment'
          for i in $(seq 1 35); do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
