name: Temp Ramsey R46 m219 n11=0 high-A scan

on:
  push:
    branches: [main]
    paths:
      - science-boundary/ramsey-r46/m219_n11_0_catalog_scan.py
      - .github/workflows/temp-ramsey-r46-m219-n11-0-scan.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download authenticated complete A catalogues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46
          curl --fail --location --retry 4 --silent --show-error https://users.cecs.anu.edu.au/~bdm/data/r36_13.g6.gz -o /tmp/r46/r36_13.g6.gz
          curl --fail --location --retry 4 --silent --show-error https://users.cecs.anu.edu.au/~bdm/data/r36_14.g6.gz -o /tmp/r46/r36_14.g6.gz
          echo '12d94cdedc18c56f55cc1fc08ddad4852f43e5d3ea20bf0e00cdbedfc5036604  /tmp/r46/r36_13.g6.gz' | sha256sum -c -
          echo 'cd041a1c465e28affc104f9131a3d0e5ff88432f7bcdd6a4640d55ec25c157a0  /tmp/r46/r36_14.g6.gz' | sha256sum -c -
      - name: Scan high-edge strata
        shell: bash
        run: |
          set -euo pipefail
          python science-boundary/ramsey-r46/m219_n11_0_catalog_scan.py \
            --r36-13 /tmp/r46/r36_13.g6.gz --r36-14 /tmp/r46/r36_14.g6.gz \
            --output /tmp/r46/result.json | tee /tmp/r46/summary.txt
      - name: Persist result and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r46/result.json science-boundary/ramsey-r46/results/m219-n11-0-highA-scan.json
          git rm .github/workflows/temp-ramsey-r46-m219-n11-0-scan.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-boundary/ramsey-r46/results/m219-n11-0-highA-scan.json
          git commit -m 'ramsey-r46: record m219 n11=0 high-A scan'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsey-r46-m219-n11-0-highA-scan
          path: /tmp/r46
          retention-days: 7
