name: temp Thomson 960 orbit0 orbit4 cross scar

on:
  push:
    paths:
      - '.github/workflows/temp-thomson-960-orbit0-orbit4-cross-scar.yml'

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: p0-far
            quad_b: '108,282,511,599'
          - phase: p1-near
            quad_b: '428,602,919,831'
          - phase: p2-far
            quad_b: '748,922,279,191'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: thomson-e432-seed
          path: ${{ runner.temp }}/seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: teddyli18000/web-ingest
          run-id: 41043461011
      - name: Continue cross-scar paired glide under common restraint
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          live=$(cat "$RUNNER_TEMP/seed/live-score.txt")
          echo "nproc=$(nproc) phase=${{ matrix.phase }} live=$live"
          python3 science-boundary/thomson-960/code/search_cross_scar_pair_homotopy.py \
            "$RUNNER_TEMP/seed/live.json" \
            --quad-a '217,559,551,308' --quad-b '${{ matrix.quad_b }}' \
            --pattern balanced --multiplier-a 1.003 --multiplier-b 1.003 \
            --schedule '100000,30000,10000,6000,4000,3000,2200,1600,1200,900,700,500,300,200,100,30,10,3,1,0.3,0.1,0.03,0.01,0.003,0.001,0' \
            --fixed-maxiter 2200 --stage-maxiter 1800 --final-maxiter 4000 \
            --live-score "$live" --out "$RUNNER_TEMP/out/result.json"
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'out','result.json')))
          print('QUADS',d['quad_a'],d['quad_b'],'THRESHOLDS',d['threshold_a'],d['threshold_b'])
          print('FIXED',d['fixed_energy'],d['fixed_a_flipped'],d['fixed_b_flipped'],d['fixed_coord'])
          print('LAST_BOTH',None if d['last_both_flipped_state'] is None else {k:v for k,v in d['last_both_flipped_state'].items() if k!='points'})
          print('FIRST_LOST',d['first_lost_state'])
          print('FINAL',{k:v for k,v in d['final'].items() if k!='points'})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thomson-orbit0-orbit4-${{ matrix.phase }}
          path: ${{ runner.temp }}/out
          retention-days: 10
