name: temp p004 constructive full-safe-endpoint MILP replay
on:
  push:
    paths:
      - .github/workflows/temp-science-boundary-p004-direct-endpoints.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temp-p004-direct-endpoints
  cancel-in-progress: false
jobs:
  construct:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: nine-original, case_file: c7p004-direct-nine-port-case.json, swap: "", expected: 134704}
          - {case: nine-neutral-swap, case_file: c7p004-direct-nine-port-case.json, swap: "4848:4898", expected: 134705}
          - {case: ten-original, case_file: c7p004-direct-ten-port-case.json, swap: "", expected: 134684}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact MILP solver
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Optimize direct ten-dimensional certificate from frozen input
        run: |
          mkdir -p /tmp/c7p004/result /tmp/c7p004/shot
          python science-boundary/shannon-capacity-c7/code/c7p004_full_endpoint_direct_milp.py \
            science-boundary/shannon-capacity-c7/data/circular-port12-port12a-2026-11-05.json \
            science-boundary/shannon-capacity-c7/data/${{ matrix.case_file }} \
            /tmp/c7p004/result --seconds 180 --aux-swap "${{ matrix.swap }}"
          cp /tmp/c7p004/result/best_certificate.json /tmp/c7p004/shot/certificate.json
      - name: Independently verify with Few Shots p004 judge
        run: |
          git clone --quiet --depth 1 https://github.com/few-shots/few-shots.git /tmp/c7-fewshots
          python /tmp/c7-fewshots/problems/p004-shannon-capacity-c7/verify/verify.py \
            /tmp/c7p004/shot | tee /tmp/c7p004/result/verdict.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('/tmp/c7p004/result')
          status=json.loads((r/'status.json').read_text())
          verdict=json.loads((r/'verdict.json').read_text())
          assert status['solver_status']==0
          assert status['score']==${{ matrix.expected }}
          assert verdict['valid'] and int(verdict['score'])==status['score']
          print('INDEPENDENT_REPLAY',json.dumps(verdict,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7p004-direct-endpoint-${{ matrix.case }}
          path: /tmp/c7p004/result/
          retention-days: 14
