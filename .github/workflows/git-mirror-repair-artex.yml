name: Git mirror repair - ARTEX ignored tracked file

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/git-mirror-repair-artex.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: git-mirror-repair-artex
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore tracked file omitted by nested gitignore
        shell: bash
        run: |
          set -euo pipefail
          target='git-mirror/data/github.com/mhtsec/ARTEX/snapshot/docs/漏洞流量证据.md'
          mkdir -p "$(dirname "$target")"
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/mhtsec/ARTEX/5c0dbd4bec940f3c0faf20705a56d879b57d3dfe/docs/%E6%BC%8F%E6%B4%9E%E6%B5%81%E9%87%8F%E8%AF%81%E6%8D%AE.md' \
            --output "$target"
          test "$(wc -c < "$target")" -eq 9024
          test "$(git hash-object "$target")" = '92c5814c9ad4314e0c6beb8a41b3b02f39308bd9'

      - name: Validate repaired mirror
        run: |
          python3 -m unittest discover -s git-mirror/tests -v
          python3 git-mirror/validate_snapshots.py

      - name: Commit repair and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f 'git-mirror/data/github.com/mhtsec/ARTEX/snapshot/docs/漏洞流量证据.md'
          git rm -- '.github/workflows/git-mirror-repair-artex.yml'
          git commit -m 'fix(git-mirror): restore ARTEX tracked doc'
          git pull --rebase origin main
          git push origin HEAD:main
