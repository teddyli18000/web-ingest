name: temp labs100 O58 K16 exact extreme splits
on:
  push:
    paths:
      - '.github/workflows/temp-labs100-o58-k16-extremes-20261104.yml'
  workflow_dispatch:
concurrency:
  group: temp-labs100-o58-k16-extremes-20261104
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - name: Build and independently check projection
        run: |
          set -euo pipefail
          cd science-boundary/labs-100
          python3 code/odd_energy_defect_projection.py > "$RUNNER_TEMP/projection.log"
          g++ -O3 -std=c++20 -fopenmp -DNDEBUG code/o58_k16_compressed_exact.cpp -o "$RUNNER_TEMP/o58-compressed"
          g++ -O3 -std=c++20 -fopenmp -DNDEBUG code/o58_k16_qgroup_exact.cpp -o "$RUNNER_TEMP/o58-qgroup"
      - name: Exhaust extreme norm splits and fibre-Q
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          : > outputs/tasks.txt
          for kp in 1 3 13 15; do
            kc=$((16-kp))
            lim=$(( kp<kc ? kp : kc ))
            for ((t=0; t<=lim; t++)); do
              if ((t%2==1)); then
                echo "16 $kp $t center" >> outputs/tasks.txt
              else
                echo "16 $kp $t unit" >> outputs/tasks.txt
                echo "16 $kp $t five" >> outputs/tasks.txt
              fi
            done
          done
          cat outputs/tasks.txt
          export OMP_NUM_THREADS=1
          export OUTROOT="$PWD/outputs"
          export O58_COMPRESSED="$RUNNER_TEMP/o58-compressed"
          export O58_QGROUP="$RUNNER_TEMP/o58-qgroup"
          xargs -P "$(nproc)" -n 4 bash -c '
            set -euo pipefail
            K="$1"; kp="$2"; t="$3"; cls="$4"
            prefix="$OUTROOT/kp${kp}-t${t}-${cls}"
            "$O58_COMPRESSED" "$K" "$kp" "$t" "$cls" > "${prefix}.compressed.log"
            actual=$(grep -c "^HIT " "${prefix}.compressed.log" || true)
            declared=$(sed -n "s/.* qhits=\([0-9]*\).*/\1/p" "${prefix}.compressed.log" | tail -1)
            if [[ "$actual" != "$declared" ]]; then
              echo "TRUNCATED kp=$kp t=$t cls=$cls actual=$actual declared=$declared"
              exit 4
            fi
            lag=0
            [[ "$cls" == unit ]] && lag=1
            [[ "$cls" == five ]] && lag=5
            if (( actual > 0 )); then
              "$O58_QGROUP" "$lag" "${prefix}.compressed.log" > "${prefix}.fibre.log"
            else
              echo "INPUT hits=0 groups=0" > "${prefix}.fibre.log"
              echo "SUMMARY groups=0 outer=0 half=0 qpass=0" >> "${prefix}.fibre.log"
            fi
            printf "DONE kp=%s t=%s cls=%s hits=%s %s\n" "$kp" "$t" "$cls" "$actual" "$(grep "^SUMMARY " "${prefix}.fibre.log" | tail -1)"
          ' _ < outputs/tasks.txt | tee outputs/progress.txt
          echo "TASKS $(wc -l < outputs/tasks.txt)"
          grep -h '^O58_K16_COMPRESSED\|^SUMMARY ' outputs/*.log > outputs/all-summaries.txt
          cat outputs/all-summaries.txt
      - name: Archive exact transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs100-o58-k16-extremes
          path: |
            outputs/
            ${{ runner.temp }}/projection.log
          retention-days: 30
