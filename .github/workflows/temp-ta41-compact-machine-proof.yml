name: temp-ta41-compact-machine-proof
on:
  push:
    paths:
      - 'science-boundary/job-shop-ta41/compact_machine_proof.py'
      - '.github/workflows/temp-ta41-compact-machine-proof.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temp-ta41-compact-machine-proof
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Pin CP-SAT for independent hard constraint verification
        run: python -m pip install 'ortools==9.14.6206'
      - name: Find compact cover of every <=7-machine change and independently prove each core infeasible
        run: python3 science-boundary/job-shop-ta41/compact_machine_proof.py --seconds 35
      - name: Persist audit-ready finite proof
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-boundary/job-shop-ta41/results/machine-core-compact-proof.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(ta41): independently audit compact machine core covering proof'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
